  let bestScore = Infinity;
  for (let m = 0; m < 8; m++) {
    const g = mod.map((row, r) => row.map((v, c) => (isFunc[r][c] ? v : v ^ (masks[m](r, c) ? 1 : 0))));
    writeFormat(g, m);
    const s = penalty(g);
    if (s < bestScore) {
      bestScore = s;
      bestGrid = g;
    }
  }
  return bestGrid;
}

function generateQrMatrix(text) {
  const bytes = new TextEncoder().encode(text);
  const { version, align, finalBytes } = encodeBytesToCodewords(bytes);
  return createMatrix(version, align, finalBytes);
}

function generateQrSvg(text, darkColor = '#0F2942', lightColor = '#FFFFFF') {
  const matrix = generateQrMatrix(text);
  const n = matrix.length;
  const pad = 4;
  const total = n + pad * 2;
  let rects = '';
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      if (matrix[r][c]) {
        rects += `<rect x="${c + pad}" y="${r + pad}" width="1" height="1"/>`;
      }
    }
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${total}" shape-rendering="crispEdges" role="img" aria-label="Mã QR truy cập nhanh"><rect width="${total}" height="${total}" fill="${lightColor}"/><g fill="${darkColor}">${rects}</g></svg>`;
}


  const ICONS = {
    check: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
    cross: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    flag: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>',
    flagSolid: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>',
    clock: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    shuffle: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>',
    refresh: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
    info: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
    bulb: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>',
    swap: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 3 4 4-4 4M20 7H4M8 21l-4-4 4-4M4 17h16"/></svg>',
  };

  function shuffleArr(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function shufflePermDifferent(prev) {
    let next = shuffleArr([0, 1, 2, 3]);
    if (Array.isArray(prev) && prev.length === 4) {
      for (let t = 0; t < 5 && next.every((v, i) => v === prev[i]); t++) {
        next = shuffleArr([0, 1, 2, 3]);
      }
    }
    return next;
  }

  function makeOptionPerms(prevMap) {
    const map = {};
    for (const q of QUESTIONS) {
      map[q.id] = shufflePermDifferent(prevMap ? prevMap[q.id] : null);
    }
    return map;
  }

  function makeChapterOrders() {
    const orders = { 0: shuffleArr(QUESTIONS.map((q) => q.id)) };
    for (const c of CHAPTERS) {
      orders[c.num] = shuffleArr(QUESTIONS.filter((q) => q.chapter === c.num).map((q) => q.id));
    }
    return orders;
  }

  function defaultTimeForCount(count) {
    if (count <= 20) return 15 * 60;
    if (count <= 60) return 45 * 60;
    if (count <= 110) return 60 * 60;
    return 120 * 60;
  }

  function createEmptyProgress(count) {
    return {
      index: 0,
      answers: {}, // qid -> original option index (0..3)
      flags: {},
      submitted: false,
      timeLeft: defaultTimeForCount(count),
      elapsed: 0,
    };
  }

  function createInitialState() {
    const allIds = QUESTIONS.map((q) => q.id);
    return {
      deck: 'chapters',
      chapter: 0, // 0 = all 250, 1..3 = chapter num
      mode: 'practice',
      shuffleQuestions: true,
      shuffleOptions: true,
      ballotFilter: 'all',
      chapterOrders: makeChapterOrders(),
      mixedOrder: shuffleArr(allIds),
      mock50Order: shuffleArr(allIds).slice(0, 50),
      wrongOrder: [],
      optionPerms: makeOptionPerms(null),
      wrongIds: [],
      progress: {},
    };
  }

  function loadState() {
    const fresh = createInitialState();
    try {
      const rawStr = localStorage.getItem(STORAGE_KEY);
      if (!rawStr) return fresh;
      const saved = JSON.parse(rawStr);
      if (saved && typeof saved === 'object') {
        if (['chapters', 'mock50', 'mixed250', 'wrong'].includes(saved.deck)) fresh.deck = saved.deck;
        if (typeof saved.chapter === 'number' && saved.chapter >= 0 && saved.chapter <= 3) fresh.chapter = saved.chapter;
        if (['practice', 'exam'].includes(saved.mode)) fresh.mode = saved.mode;
        if (typeof saved.shuffleQuestions === 'boolean') fresh.shuffleQuestions = saved.shuffleQuestions;
        if (typeof saved.shuffleOptions === 'boolean') fresh.shuffleOptions = saved.shuffleOptions;
        if (saved.chapterOrders && typeof saved.chapterOrders === 'object') {
          for (const k of Object.keys(fresh.chapterOrders)) {
            const arr = saved.chapterOrders[k];
            if (Array.isArray(arr) && arr.length === fresh.chapterOrders[k].length && arr.every((id) => Q_BY_ID.has(id))) {
              fresh.chapterOrders[k] = arr;
            }
          }
        }
        if (Array.isArray(saved.mixedOrder) && saved.mixedOrder.length === QUESTIONS.length && saved.mixedOrder.every((id) => Q_BY_ID.has(id))) {
          fresh.mixedOrder = saved.mixedOrder;
        }
        if (Array.isArray(saved.mock50Order) && saved.mock50Order.length === 50 && saved.mock50Order.every((id) => Q_BY_ID.has(id))) {
          fresh.mock50Order = saved.mock50Order;
        }
        if (saved.optionPerms && typeof saved.optionPerms === 'object') {
          for (const q of QUESTIONS) {
            const p = saved.optionPerms[q.id];
            if (Array.isArray(p) && p.length === 4) fresh.optionPerms[q.id] = p;
          }
        }
        if (Array.isArray(saved.wrongIds)) {
          fresh.wrongIds = saved.wrongIds.filter((id) => Q_BY_ID.has(id));
        }
        if (Array.isArray(saved.wrongOrder)) {
          fresh.wrongOrder = saved.wrongOrder.filter((id) => fresh.wrongIds.includes(id));
        }
        if (saved.progress && typeof saved.progress === 'object') {
          fresh.progress = saved.progress;
        }
      }
    } catch {}
    return fresh;
  }

  let state = loadState();
  let timerHandle = null;
  let pendingConfirmAction = null;

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
  }

  function getOptionPerm(qid) {
    if (!state.shuffleOptions) return [0, 1, 2, 3];
    if (!Array.isArray(state.optionPerms[qid]) || state.optionPerms[qid].length !== 4) {
      state.optionPerms[qid] = shuffleArr([0, 1, 2, 3]);
    }
    return state.optionPerms[qid];
  }

  function getDeckQuestionIds(deckId = state.deck, ch = state.chapter) {
    if (deckId === 'chapters') {
      const canonical = ch === 0
        ? QUESTIONS.map((q) => q.id)
        : QUESTIONS.filter((q) => q.chapter === ch).map((q) => q.id);
      if (!state.shuffleQuestions) return canonical;
      if (!Array.isArray(state.chapterOrders[ch]) || state.chapterOrders[ch].length !== canonical.length) {
        state.chapterOrders[ch] = shuffleArr(canonical);
      }
      return state.chapterOrders[ch];
    }
    if (deckId === 'mock50') return state.mock50Order;
    if (deckId === 'mixed250') return state.mixedOrder;
    const validWrong = state.wrongIds.filter((id) => Q_BY_ID.has(id));
    if (!state.shuffleQuestions) return validWrong;
    const set = new Set(validWrong);
    const kept = (state.wrongOrder || []).filter((id) => set.has(id));
    const missing = validWrong.filter((id) => !kept.includes(id));
    if (missing.length > 0 || kept.length !== validWrong.length) {
      state.wrongOrder = kept.concat(shuffleArr(missing));
    }
    return state.wrongOrder;
  }

  function sessionKey() {
    const scope = state.deck === 'chapters' ? ('ch' + state.chapter) : state.deck;
    return scope + ':' + state.mode;
  }

  function currentProgress() {
    const key = sessionKey();
    if (!state.progress[key]) {
      state.progress[key] = createEmptyProgress(getDeckQuestionIds().length);
    }
    return state.progress[key];
  }

  function formatSec(sec) {
    const s = Math.max(0, Math.floor(sec));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function syncTimer() {
    if (timerHandle) {
      clearInterval(timerHandle);
      timerHandle = null;
    }
    const ids = getDeckQuestionIds();
    const prog = currentProgress();
    if (state.mode === 'exam' && !prog.submitted && ids.length > 0 && prog.timeLeft > 0) {
      timerHandle = setInterval(() => {
        const p = currentProgress();
        if (state.mode !== 'exam' || p.submitted || getDeckQuestionIds().length === 0) {
          syncTimer();
          return;
        }
        p.timeLeft = Math.max(0, p.timeLeft - 1);
        p.elapsed = (p.elapsed || 0) + 1;
        const timerEl = document.getElementById('live-timer-val');
        if (timerEl) timerEl.textContent = formatSec(p.timeLeft);
        if (p.timeLeft === 0) submitExam(true);
        else if (p.timeLeft % 5 === 0) saveState();
      }, 1000);
    }
  }

  function triggerKittyHop() {
    const k = document.getElementById('btn-kitty-mascot');
    if (!k) return;
    k.classList.remove('hop');
    void k.offsetWidth;
    k.classList.add('hop');
  }

  function addWrongId(qid) {
    if (!state.wrongIds.includes(qid)) state.wrongIds.push(qid);
  }

  function removeWrongId(qid) {
    state.wrongIds = state.wrongIds.filter((id) => id !== qid);
    ['wrong:practice', 'wrong:exam'].forEach((k) => {
      if (state.progress[k]) {
        delete state.progress[k].answers[qid];
        const rem = getDeckQuestionIds('wrong').length;
        state.progress[k].index = rem > 0 ? Math.min(state.progress[k].index, rem - 1) : 0;
      }
    });
  }

  function selectDisplayIndex(displayPos) {
    const ids = getDeckQuestionIds();
    if (!ids.length) return;
    const prog = currentProgress();
    const qid = ids[prog.index];
    if (state.mode === 'exam' && prog.submitted) return;
    if (state.mode === 'practice' && prog.answers[qid] !== undefined) return;

    const q = Q_BY_ID.get(qid);
    const perm = getOptionPerm(qid);
    const origIdx = perm[displayPos];
    prog.answers[qid] = origIdx;

    if (state.mode === 'practice') {
      if (origIdx === q.correctIdx) triggerKittyHop();
      else addWrongId(qid);
    }
    saveState();
    render();
  }

  function submitExam(autoTimeout = false) {
    const ids = getDeckQuestionIds();
    const prog = currentProgress();
    if (prog.submitted || !ids.length) return;

    const unanswered = ids.filter((id) => prog.answers[id] === undefined).length;
    if (!autoTimeout && unanswered > 0) {
      openConfirm(
        'Nộp bài thi thử?',
        'Còn ' + unanswered + ' câu chưa trả lời. Bạn vẫn muốn nộp bài và chấm điểm ngay bây giờ?',
        () => finalizeExamSubmit()
      );
      return;
    }
    finalizeExamSubmit();
  }

  function finalizeExamSubmit() {
    const ids = getDeckQuestionIds();
    const prog = currentProgress();
    prog.submitted = true;
    for (const id of ids) {
      const q = Q_BY_ID.get(id);
      if (prog.answers[id] !== undefined && prog.answers[id] !== q.correctIdx) {
        addWrongId(id);
      }
    }
    syncTimer();
    saveState();
    const main = document.getElementById('main-stage');
    if (main) main.scrollTop = 0;
    render();
  }

  function resetCurrentDeck() {
    const prevIds = getDeckQuestionIds();
    if (state.deck === 'mixed250') {
      state.mixedOrder = shuffleArr(QUESTIONS.map((q) => q.id));
    } else if (state.deck === 'mock50') {
      state.mock50Order = shuffleArr(QUESTIONS.map((q) => q.id)).slice(0, 50);
    } else if (state.deck === 'chapters') {
      const canonical = state.chapter === 0
        ? QUESTIONS.map((q) => q.id)
        : QUESTIONS.filter((q) => q.chapter === state.chapter).map((q) => q.id);
      state.chapterOrders[state.chapter] = shuffleArr(canonical);
    } else if (state.deck === 'wrong') {
      state.wrongOrder = shuffleArr(state.wrongIds.filter((id) => Q_BY_ID.has(id)));
    }
    const nextIds = getDeckQuestionIds();
    for (const id of nextIds) {
      state.optionPerms[id] = shufflePermDifferent(state.optionPerms[id]);
    }
    state.progress[sessionKey()] = createEmptyProgress(nextIds.length || prevIds.length);
    saveState();
    syncTimer();
    triggerKittyHop();
    render();
  }

  function triggerShuffleNow() {
    const ids = getDeckQuestionIds();
    if (!ids.length) return;
    state.shuffleQuestions = true;
    state.shuffleOptions = true;
    const prog = currentProgress();
    const answeredCount = ids.filter((id) => prog.answers[id] !== undefined).length;
    if (answeredCount === 0) {
      resetCurrentDeck();
      return;
    }
    openConfirm(
      'Tráo lộn xộn lại đề hiện tại?',
      'Thứ tự câu hỏi và 4 đáp án A-B-C-D sẽ được tráo mới hoàn toàn, bắt đầu lượt làm mới từ câu 01.',
      resetCurrentDeck
    );
  }

  function openConfirm(title, message, onOk) {
    document.getElementById('confirm-title').textContent = title;
    document.getElementById('confirm-msg').textContent = message;
    pendingConfirmAction = onOk;
    const bd = document.getElementById('confirm-backdrop');
    bd.classList.add('open');
    bd.setAttribute('aria-hidden', 'false');
    document.getElementById('btn-confirm-ok').focus();
  }
  function closeConfirm() {
    pendingConfirmAction = null;
    const bd = document.getElementById('confirm-backdrop');
    bd.classList.remove('open');
    bd.setAttribute('aria-hidden', 'true');
  }

  function renderChapterBar() {
    const bar = document.getElementById('chapter-bar');
    if (state.deck !== 'chapters') {
      bar.classList.add('hidden');
      return;
    }
    bar.classList.remove('hidden');
    const counts = {};
    for (const q of QUESTIONS) counts[q.chapter] = (counts[q.chapter] || 0) + 1;
    const items = [{ num: 0, label: 'Tất cả (' + QUESTIONS.length + ')' }].concat(
      CHAPTERS.map((c) => ({ num: c.num, label: 'Ch.' + c.num + ' (' + (counts[c.num] || 0) + ')' }))
    );
    bar.innerHTML = items
      .map(
        (it) =>
          '<button type="button" class="ch-pill tnum' +
          (state.chapter === it.num ? ' active' : '') +
          '" data-ch="' + it.num + '">' +
          it.label +
          '</button>'
      )
      .join('');
    bar.querySelectorAll('[data-ch]').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.chapter = Number(btn.dataset.ch);
        saveState();
        syncTimer();
        render();
      });
    });
  }

  function renderBallotGroup(containerEl, filterEl, legendEl, titleEl, isDrawer) {
    const ids = getDeckQuestionIds();
    const prog = currentProgress();
    const total = ids.length;
    const answeredCount = ids.filter((id) => prog.answers[id] !== undefined).length;

    if (titleEl) {
      titleEl.textContent = isDrawer
        ? 'Bảng câu hỏi (' + answeredCount + '/' + total + ')'
        : 'Bảng ' + total + ' câu (' + answeredCount + '/' + total + ')';
    }

    const filters = [
      { id: 'all', label: 'Tất cả (' + total + ')' },
      { id: 'todo', label: 'Chưa làm' },
      { id: 'flagged', label: 'Đánh dấu' },
    ];
    if (state.mode === 'practice' || prog.submitted) {
      filters.push({ id: 'wrong', label: 'Làm sai' });
    }
    if (!filters.some((f) => f.id === state.ballotFilter)) state.ballotFilter = 'all';

    filterEl.innerHTML = filters
      .map(
        (f) =>
          '<button type="button" class="filter-chip' +
          (state.ballotFilter === f.id ? ' active' : '') +
          '" data-bfilter="' + f.id + '">' +
          f.label +
          '</button>'
      )
      .join('');

    filterEl.querySelectorAll('[data-bfilter]').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.ballotFilter = btn.dataset.bfilter;
        renderBallots();
      });
    });

    const filteredIndices = [];
    ids.forEach((id, idx) => {
      const q = Q_BY_ID.get(id);
      const ans = prog.answers[id];
      const flagged = Boolean(prog.flags[id]);
      if (state.ballotFilter === 'todo' && ans !== undefined) return;
      if (state.ballotFilter === 'flagged' && !flagged) return;
      if (state.ballotFilter === 'wrong' && (ans === undefined || ans === q.correctIdx)) return;
      filteredIndices.push({ id, idx, q, ans, flagged });
    });

    if (filteredIndices.length === 0) {
      containerEl.innerHTML =
        '<div style="grid-column:1/-1;padding:18px 8px;text-align:center;color:#88465F;font-size:13px;">Không có câu nào trong mục lọc này.</div>';
    } else {
      containerEl.innerHTML = filteredIndices
        .map(({ idx, q, ans, flagged }) => {
          const classes = ['bcell'];
          if (idx === prog.index) classes.push('current');
          if (ans !== undefined) {
            if (state.mode === 'practice' || prog.submitted) {
              classes.push(ans === q.correctIdx ? 'ok' : 'bad');
            } else {
              classes.push('picked');
            }
          }
          if (flagged) classes.push('flagged');
          return (
            '<button type="button" class="' + classes.join(' ') + '" data-jump="' + idx + '" aria-label="Câu ' + (idx + 1) + '">' +
            String(idx + 1).padStart(2, '0') +
            '</button>'
          );
        })
        .join('');

      containerEl.querySelectorAll('[data-jump]').forEach((btn) => {
        btn.addEventListener('click', () => {
          prog.index = Number(btn.dataset.jump);
          saveState();
          if (isDrawer) closeBallotDrawer();
          render();
        });
      });
    }

    if (state.mode === 'exam' && !prog.submitted) {
      legendEl.innerHTML =
        '<span class="leg-item"><span class="leg-dot"></span>Chưa chọn</span>' +
        '<span class="leg-item"><span class="leg-dot picked"></span>Đã chọn</span>' +
        '<span class="leg-item"><span class="leg-dot flag"></span>Đánh dấu</span>';
    } else {
      legendEl.innerHTML =
        '<span class="leg-item"><span class="leg-dot"></span>Chưa làm</span>' +
        '<span class="leg-item"><span class="leg-dot ok"></span>Đúng</span>' +
        '<span class="leg-item"><span class="leg-dot bad"></span>Sai</span>' +
        '<span class="leg-item"><span class="leg-dot flag"></span>Đánh dấu</span>';
    }
  }

  function renderBallots() {
    renderBallotGroup(
      document.getElementById('desktop-ballot'),
      document.getElementById('desktop-filters'),
      document.getElementById('desktop-legend'),
      document.getElementById('desktop-rail-title'),
      false
    );
    renderBallotGroup(
      document.getElementById('drawer-ballot'),
      document.getElementById('drawer-filters'),
      document.getElementById('drawer-legend'),
      document.getElementById('drawer-title'),
      true
    );
  }

  function renderStatus(ids, prog) {
    const right = document.getElementById('status-right');
    const progFill = document.getElementById('prog-fill');
    const total = ids.length;
    const answered = ids.filter((id) => prog.answers[id] !== undefined).length;
    const pct = total > 0 ? Math.round((answered / total) * 100) : 0;
    progFill.style.width = pct + '%';

    if (total === 0) { right.innerHTML = ''; return; }

    if (state.mode === 'practice') {
      let correct = 0;
      for (const id of ids) {
        if (prog.answers[id] !== undefined && prog.answers[id] === Q_BY_ID.get(id).correctIdx) correct++;
      }
      const mixBtn =
        state.deck === 'mixed250' || state.deck === 'mock50'
          ? '<button type="button" class="mini-action" id="btn-reshuffle">' +
            ICONS.shuffle +
            '<span>' + (state.deck === 'mock50' ? 'Đề 50 mới' : 'Xáo đề') + '</span></button>'
          : '';
      right.innerHTML =
        '<span class="stat-pill' + (answered > 0 ? ' good' : '') + '">Đúng ' + correct + '/' + answered + '</span>' +
        mixBtn;
      const shBtn = document.getElementById('btn-reshuffle');
      if (shBtn) {
        shBtn.addEventListener('click', () => {
          openConfirm(
            state.deck === 'mock50' ? 'Rút bộ đề 50 câu mới?' : 'Xáo trộn lại 250 câu?',
            'Lượt làm hiện tại sẽ bắt đầu lại từ đầu với thứ tự câu và đáp án mới.',
            resetCurrentDeck
          );
        });
      }
    } else if (!prog.submitted) {
      const lowTime = prog.timeLeft <= 300;
      right.innerHTML =
        '<span class="stat-pill' + (lowTime ? ' warn' : '') + '">' + ICONS.clock + '<span id="live-timer-val">' + formatSec(prog.timeLeft) + '</span></span>' +
        '<button type="button" class="mini-action primary" id="btn-submit-exam">Nộp bài (' + answered + '/' + total + ')</button>';
      document.getElementById('btn-submit-exam').addEventListener('click', () => submitExam(false));
    } else {
      let correct = 0;
      for (const id of ids) {
        if (prog.answers[id] === Q_BY_ID.get(id).correctIdx) correct++;
      }
      const score10 = ((correct / total) * 10).toFixed(2);
      right.innerHTML =
        '<span class="stat-pill good">' + score10 + ' điểm (' + correct + '/' + total + ')</span>' +
        '<button type="button" class="mini-action" id="btn-retake-exam">' + ICONS.refresh + '<span>Thi lại</span></button>';
      document.getElementById('btn-retake-exam').addEventListener('click', resetCurrentDeck);
    }
  }

  function renderMain(ids, prog) {
    const main = document.getElementById('main-stage');
    if (ids.length === 0) {
      main.innerHTML =
        '<div class="empty-state">' +
        '<h2>Chưa có câu làm sai</h2>' +
        '<p>Các câu bạn trả lời nhầm ở các chương hoặc đề thi thử sẽ tự động lưu tại đây để ôn lại kèm ghi chú giải thích.</p>' +
        '<button type="button" class="mini-action primary" id="btn-back-all">Quay về ôn theo chương</button>' +
        '</div>';
      document.getElementById('btn-back-all').addEventListener('click', () => {
        state.deck = 'chapters';
        saveState();
        render();
      });
      return;
    }

    if (prog.index >= ids.length) prog.index = ids.length - 1;
    if (prog.index < 0) prog.index = 0;

    let summaryHtml = '';
    if (state.mode === 'exam' && prog.submitted) {
      let correct = 0, wrong = 0, blank = 0;
      for (const id of ids) {
        const a = prog.answers[id];
        if (a === undefined) blank++;
        else if (a === Q_BY_ID.get(id).correctIdx) correct++;
        else wrong++;
      }
      const score10 = ((correct / ids.length) * 10).toFixed(2);
      summaryHtml =
        '<section class="summary-card" aria-label="Kết quả bài thi">' +
        '<div class="summary-head">' +
        '<h2 class="summary-title">Kết quả bài thi thử</h2>' +
        '<div class="score-big tnum">' + score10 + ' / 10</div>' +
        '</div>' +
        '<div class="summary-grid tnum">' +
        '<div class="summary-cell"><div class="summary-cell-val" style="color:var(--teal);">' + correct + '</div><div class="summary-cell-lbl">Câu đúng</div></div>' +
        '<div class="summary-cell"><div class="summary-cell-val" style="color:var(--crimson);">' + wrong + '</div><div class="summary-cell-lbl">Câu sai</div></div>' +
        '<div class="summary-cell"><div class="summary-cell-val">' + formatSec(prog.elapsed || (defaultTimeForCount(ids.length) - prog.timeLeft)) + '</div><div class="summary-cell-lbl">Thời gian (' + blank + ' bỏ trống)</div></div>' +
        '</div>' +
        '<div class="summary-actions">' +
        (wrong > 0 ? '<button type="button" class="mini-action" id="btn-jump-first-wrong">Xem câu sai đầu tiên</button>' : '') +
        '<button type="button" class="mini-action primary" id="btn-summary-retake">Làm lại đề thi mới</button>' +
        '</div>' +
        '</section>';
    }

    const qid = ids[prog.index];
    const q = Q_BY_ID.get(qid);
    const perm = getOptionPerm(qid);
    const chosenOrig = prog.answers[qid];
    const hasChosen = chosenOrig !== undefined;
    const isFlagged = Boolean(prog.flags[qid]);
    const showKey = state.mode === 'practice' ? hasChosen : prog.submitted;

    const correctDisplayPos = perm.indexOf(q.correctIdx);
    const correctLetter = LETTERS[correctDisplayPos];
    const chosenLetter = hasChosen ? LETTERS[perm.indexOf(chosenOrig)] : null;

    const optsHtml = perm
      .map((origIdx, dispPos) => {
        const letter = LETTERS[dispPos];
        const classes = ['opt'];
        let iconHtml = '';
        if (showKey) {
          if (origIdx === q.correctIdx) {
            classes.push('correct');
            iconHtml = ICONS.check;
          } else if (hasChosen && chosenOrig === origIdx) {
            classes.push('wrong');
            iconHtml = ICONS.cross;
          }
        } else if (hasChosen && chosenOrig === origIdx) {
          classes.push('selected');
        }
        const disabledAttr = showKey ? ' disabled' : '';
        return (
          '<button type="button" class="' + classes.join(' ') + '" data-pos="' + dispPos + '"' + disabledAttr + '>' +
          '<span class="opt-badge">' + letter + '</span>' +
          '<span class="opt-text">' + escapeHtml(q.options[origIdx]) + '</span>' +
          '<span class="opt-icon">' + iconHtml + '</span>' +
          '</button>'
        );
      })
      .join('');

    let feedbackHtml = '';
    let noteHtml = '';
    if (showKey) {
      let fbClass = 'neutral';
      let fbText = 'Chưa trả lời · Đáp án đúng là ' + correctLetter;
      let fbIcon = ICONS.info;
      if (hasChosen && chosenOrig === q.correctIdx) {
        fbClass = 'correct';
        fbText = 'Chính xác — Đáp án đúng: ' + correctLetter;
        fbIcon = ICONS.check;
      } else if (hasChosen) {
        fbClass = 'wrong';
        fbText = 'Chưa đúng — Bạn chọn ' + chosenLetter + ', đáp án đúng là ' + correctLetter;
        fbIcon = ICONS.cross;
      }
      const graduateBtn =
        state.deck === 'wrong' && hasChosen && chosenOrig === q.correctIdx
          ? '<button type="button" class="mini-action" id="btn-graduate-wrong">Đã thuộc (bỏ khỏi câu sai)</button>'
          : '';
      feedbackHtml =
        '<div class="feedback ' + fbClass + '" role="status" aria-live="polite">' +
        '<div class="feedback-main">' + fbIcon + '<span>' + fbText + '</span></div>' +
        graduateBtn +
        '</div>';

      noteHtml =
        '<section class="study-note" aria-label="Giải thích và mẹo liên hệ">' +
        '<div class="note-sec">' +
        '<div class="note-head">' + ICONS.bulb + '<span>Vì sao chọn đáp án này?</span></div>' +
        '<p class="note-body">' + escapeHtml(q.why) + '</p>' +
        '</div>' +
        '<div class="note-sec twist">' +
        '<div class="note-head">' + ICONS.swap + '<span>Liên hệ nếu đề hỏi khác</span></div>' +
        '<p class="note-body">' + escapeHtml(q.twist) + '</p>' +
        '</div>' +
        '</section>';
    }

    const originChip = '<span class="tag-chip tnum">Chương ' + q.chapter + ' · Câu gốc #' + q.num + '</span>';

    main.innerHTML =
      summaryHtml +
      '<div class="qmeta">' +
      '<div class="qmeta-left tnum">' +
      '<span class="qnum-label">Câu ' + String(prog.index + 1).padStart(2, '0') + ' / ' + ids.length + '</span>' +
      originChip +
      '</div>' +
      '<button type="button" class="flag-btn' + (isFlagged ? ' flagged' : '') + '" id="btn-flag-q" aria-pressed="' + isFlagged + '">' +
      (isFlagged ? ICONS.flagSolid : ICONS.flag) +
      '<span>' + (isFlagged ? 'Đã đánh dấu' : 'Đánh dấu') + '</span>' +
      '</button>' +
      '</div>' +
      '<section class="qcard"><p class="qstem">' + escapeHtml(q.stem) + '</p></section>' +
      '<div class="opts">' + optsHtml + '</div>' +
      feedbackHtml +
      noteHtml;

    main.querySelectorAll('[data-pos]').forEach((btn) => {
      btn.addEventListener('click', () => selectDisplayIndex(Number(btn.dataset.pos)));
    });

    const flagBtn = document.getElementById('btn-flag-q');
    if (flagBtn) {
      flagBtn.addEventListener('click', () => {
        prog.flags[qid] = !prog.flags[qid];
        saveState();
        render();
      });
    }

    const gradBtn = document.getElementById('btn-graduate-wrong');
    if (gradBtn) {
      gradBtn.addEventListener('click', () => {
        removeWrongId(qid);
        saveState();
        render();
      });
    }

    const jfw = document.getElementById('btn-jump-first-wrong');
    if (jfw) {
      jfw.addEventListener('click', () => {
        const firstWrongIdx = ids.findIndex((id) => prog.answers[id] !== undefined && prog.answers[id] !== Q_BY_ID.get(id).correctIdx);
        if (firstWrongIdx >= 0) {
          prog.index = firstWrongIdx;
          saveState();
          render();
        }
      });
    }

    const sRetake = document.getElementById('btn-summary-retake');
    if (sRetake) sRetake.addEventListener('click', resetCurrentDeck);
  }

  function renderDock(ids, prog) {
    const prevBtn = document.getElementById('btn-prev');
    const nextBtn = document.getElementById('btn-next');
    const nextLbl = document.getElementById('btn-next-label');
    const ballotLbl = document.getElementById('dock-ballot-label');

    const total = ids.length;
    const answered = ids.filter((id) => prog.answers[id] !== undefined).length;
    ballotLbl.textContent = 'Bảng câu (' + answered + '/' + total + ')';

    prevBtn.disabled = total === 0 || prog.index <= 0;
    const atEnd = total === 0 || prog.index >= total - 1;
    if (state.mode === 'exam' && !prog.submitted && atEnd && total > 0) {
      nextBtn.disabled = false;
      nextLbl.textContent = 'Nộp bài';
      nextBtn.dataset.action = 'submit';
    } else {
      nextBtn.disabled = atEnd;
      nextLbl.textContent = 'Câu tiếp theo';
      nextBtn.dataset.action = 'next';
    }
  }

  function render() {
    document.querySelectorAll('.tab[data-deck]').forEach((tab) => {
      tab.classList.toggle('active', tab.dataset.deck === state.deck);
    });
    document.getElementById('wrong-count').textContent = '(' + state.wrongIds.length + ')';

    const pBtn = document.getElementById('btn-mode-practice');
    const eBtn = document.getElementById('btn-mode-exam');
    pBtn.className = 'mode-btn' + (state.mode === 'practice' ? ' active' : '');
    eBtn.className = 'mode-btn' + (state.mode === 'exam' ? ' exam-active' : '');

    // Update Shuffle Bar state
    const shQBtn = document.getElementById('btn-toggle-shuf-q');
    const shQLbl = document.getElementById('lbl-shuf-q');
    const forceShufQ = state.deck === 'mixed250' || state.deck === 'mock50';
    const isShufQOn = forceShufQ ? true : state.shuffleQuestions;
    shQBtn.className = 'shuf-pill' + (isShufQOn ? ' on' : '');
    shQBtn.setAttribute('aria-pressed', String(isShufQOn));
    shQLbl.textContent = isShufQOn ? 'Tráo câu: Bật' : 'Tráo câu: Tắt';

    const shOBtn = document.getElementById('btn-toggle-shuf-opt');
    const shOLbl = document.getElementById('lbl-shuf-opt');
    shOBtn.className = 'shuf-pill' + (state.shuffleOptions ? ' on-teal' : '');
    shOBtn.setAttribute('aria-pressed', String(state.shuffleOptions));
    shOLbl.textContent = state.shuffleOptions ? 'Tráo A-B-C-D: Bật' : 'Tráo A-B-C-D: Tắt';

    renderChapterBar();
    const ids = getDeckQuestionIds();
    const prog = currentProgress();
    renderStatus(ids, prog);
    renderMain(ids, prog);
    renderDock(ids, prog);
    renderBallots();
  }

  function stepQuestion(delta) {
    const ids = getDeckQuestionIds();
    if (!ids.length) return;
    const prog = currentProgress();
    const nextIdx = prog.index + delta;
    if (nextIdx >= 0 && nextIdx < ids.length) {
      prog.index = nextIdx;
      saveState();
      render();
      const main = document.getElementById('main-stage');
      if (main) main.scrollTop = 0;
    }
  }

  function openBallotDrawer() {
    const bd = document.getElementById('ballot-backdrop');
    bd.classList.add('open');
    bd.setAttribute('aria-hidden', 'false');
    renderBallots();
  }
  function closeBallotDrawer() {
    const bd = document.getElementById('ballot-backdrop');
    bd.classList.remove('open');
    bd.setAttribute('aria-hidden', 'true');
  }

  function defaultShareUrl() {
    return window.location.href.split('#')[0];
  }

  function renderQrPreview(url) {
    const wrap = document.getElementById('qr-svg-wrap');
    const hint = document.getElementById('qr-hint-text');
    try {
      wrap.innerHTML = generateQrSvg(url.trim(), '#8F1242', '#FFFFFF');
      if (window.location.protocol === 'file:' || window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') {
        hint.textContent = 'Đang xem thử cục bộ. Khi dùng link HTTPS công khai, mã QR sẽ mở thẳng trên điện thoại của mọi người.';
      } else {
        hint.textContent = 'Đưa camera điện thoại hoặc Zalo vào mã QR này để mở thẳng bộ đề 250 câu Lịch sử Đảng Cộng sản Việt Nam.';
      }
    } catch {
      wrap.innerHTML = '<div style="font-size:12.5px;color:#B91C1C;text-align:center;padding:12px;">Đường dẫn quá dài để tạo mã QR (dưới 150 ký tự).</div>';
    }
  }

  function openQrModal() {
    const inp = document.getElementById('qr-url-input');
    inp.value = defaultShareUrl();
    renderQrPreview(inp.value);
    const bd = document.getElementById('qr-backdrop');
    bd.classList.add('open');
    bd.setAttribute('aria-hidden', 'false');
  }
  function closeQrModal() {
    const bd = document.getElementById('qr-backdrop');
    bd.classList.remove('open');
    bd.setAttribute('aria-hidden', 'true');
  }

  function downloadQrPng() {
    const url = document.getElementById('qr-url-input').value.trim();
    if (!url) return;
    let matrix;
    try { matrix = generateQrMatrix(url); } catch { return; }
    const n = matrix.length;
    const pad = 4;
    const targetPx = 768;
    const cell = Math.max(8, Math.floor(targetPx / (n + pad * 2)));
    const size = (n + pad * 2) * cell;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#8F1242';
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        if (matrix[r][c]) ctx.fillRect((c + pad) * cell, (r + pad) * cell, cell, cell);
      }
    }
    const link = document.createElement('a');
    link.download = 'qr-trac-nghiem-lsd.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  // Event wiring
  document.getElementById('btn-kitty-mascot').addEventListener('click', triggerKittyHop);
  document.querySelectorAll('.tab[data-deck]').forEach((tab) => {
    tab.addEventListener('click', () => {
      state.deck = tab.dataset.deck;
      saveState();
      syncTimer();
      render();
    });
  });

  document.getElementById('btn-mode-practice').addEventListener('click', () => {
    if (state.mode === 'practice') return;
    state.mode = 'practice';
    saveState();
    syncTimer();
    render();
  });

  document.getElementById('btn-mode-exam').addEventListener('click', () => {
    if (state.mode === 'exam') return;
    state.mode = 'exam';
    saveState();
    syncTimer();
    render();
  });

  document.getElementById('btn-toggle-shuf-q').addEventListener('click', () => {
    if (state.deck === 'mixed250' || state.deck === 'mock50') {
      triggerShuffleNow();
      return;
    }
    state.shuffleQuestions = !state.shuffleQuestions;
    if (state.shuffleQuestions) {
      const canonical = state.chapter === 0
        ? QUESTIONS.map((q) => q.id)
        : QUESTIONS.filter((q) => q.chapter === state.chapter).map((q) => q.id);
      if (state.deck === 'chapters') state.chapterOrders[state.chapter] = shuffleArr(canonical);
      else if (state.deck === 'wrong') state.wrongOrder = shuffleArr(state.wrongIds.filter((id) => Q_BY_ID.has(id)));
    }
    const prog = currentProgress();
    prog.index = 0;
    saveState();
    render();
  });

  document.getElementById('btn-toggle-shuf-opt').addEventListener('click', () => {
    state.shuffleOptions = !state.shuffleOptions;
    if (state.shuffleOptions) {
      for (const id of getDeckQuestionIds()) {
        state.optionPerms[id] = shufflePermDifferent(state.optionPerms[id]);
      }
    }
    saveState();
    render();
  });

  document.getElementById('btn-shuffle-now').addEventListener('click', triggerShuffleNow);

  document.getElementById('btn-prev').addEventListener('click', () => stepQuestion(-1));
  document.getElementById('btn-next').addEventListener('click', () => {
    const nextBtn = document.getElementById('btn-next');
    if (nextBtn.dataset.action === 'submit') submitExam(false);
    else stepQuestion(1);
  });

  document.getElementById('btn-open-ballot').addEventListener('click', openBallotDrawer);
  document.getElementById('btn-close-ballot').addEventListener('click', closeBallotDrawer);
  document.getElementById('ballot-backdrop').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeBallotDrawer();
  });

  const handleResetTrigger = () => {
    closeBallotDrawer();
    openConfirm(
      'Làm lại từ đầu?',
      'Toàn bộ đáp án đã chọn trong mục hiện tại sẽ được xóa và xáo lại vị trí A-B-C-D.',
      resetCurrentDeck
    );
  };
  document.getElementById('btn-desktop-reset').addEventListener('click', handleResetTrigger);
  document.getElementById('btn-drawer-reset').addEventListener('click', handleResetTrigger);

  document.getElementById('btn-open-qr').addEventListener('click', openQrModal);
  document.getElementById('btn-close-qr').addEventListener('click', closeQrModal);
  document.getElementById('qr-backdrop').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeQrModal();
  });
  document.getElementById('qr-url-input').addEventListener('input', (e) => renderQrPreview(e.target.value));
  document.getElementById('btn-download-qr').addEventListener('click', downloadQrPng);
  document.getElementById('btn-copy-url').addEventListener('click', async () => {
    const btn = document.getElementById('btn-copy-url');
    const url = document.getElementById('qr-url-input').value.trim();
    try {
      await navigator.clipboard.writeText(url);
      btn.textContent = 'Đã sao chép';
      setTimeout(() => { btn.textContent = 'Sao chép link'; }, 1800);
    } catch {
      document.getElementById('qr-url-input').select();
    }
  });

  document.getElementById('btn-confirm-cancel').addEventListener('click', closeConfirm);
  document.getElementById('btn-close-confirm').addEventListener('click', closeConfirm);
  document.getElementById('confirm-backdrop').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeConfirm();
  });
  document.getElementById('btn-confirm-ok').addEventListener('click', () => {
    const fn = pendingConfirmAction;
    closeConfirm();
    if (fn) fn();
  });

  // Touch swipe navigation
  let touchX = 0, touchY = 0;
  const stageEl = document.getElementById('main-stage');
  stageEl.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    touchX = e.touches[0].clientX;
    touchY = e.touches[0].clientY;
  }, { passive: true });
  stageEl.addEventListener('touchend', (e) => {
    if (!touchX || e.changedTouches.length !== 1) return;
    const dx = e.changedTouches[0].clientX - touchX;
    const dy = e.changedTouches[0].clientY - touchY;
    touchX = 0;
    if (Math.abs(dx) > 56 && Math.abs(dx) > Math.abs(dy) * 1.7) {
      stepQuestion(dx < 0 ? 1 : -1);
    }
  }, { passive: true });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.target && ['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
    if (e.key === 'Escape') {
      closeBallotDrawer();
      closeQrModal();
      closeConfirm();
      return;
    }
    const anyModalOpen =
      document.getElementById('qr-backdrop').classList.contains('open') ||
      document.getElementById('confirm-backdrop').classList.contains('open') ||
      document.getElementById('ballot-backdrop').classList.contains('open');
    if (anyModalOpen) return;

    if (e.key === 'ArrowLeft') { e.preventDefault(); stepQuestion(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); stepQuestion(1); }
    else if (['1', '2', '3', '4'].includes(e.key)) selectDisplayIndex(Number(e.key) - 1);
    else if (['a', 'b', 'c', 'd', 'A', 'B', 'C', 'D'].includes(e.key)) selectDisplayIndex(['A','B','C','D'].indexOf(e.key.toUpperCase()));
    else if (e.key === 'f' || e.key === 'F') {
      const ids = getDeckQuestionIds();
      const prog = currentProgress();
      if (ids[prog.index]) {
        prog.flags[ids[prog.index]] = !prog.flags[ids[prog.index]];
        saveState();
        render();
      }
    }
  });

  render();
  syncTimer();
})();
</script>
</body>
</html>
