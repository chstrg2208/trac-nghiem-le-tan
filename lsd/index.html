ịch Biên giới 1950"],3,"Chiến dịch Biên giới Thu – Đông 1950 là chiến dịch tiến công quy mô lớn đầu tiên do quân đội ta chủ động mở, giải phóng tuyến biên giới Việt – Trung và phá vỡ thế bao vây của địch. Thắng lợi này chứng tỏ sự trưởng thành vượt bậc của quân đội ta, đánh dấu bước ngoặt đưa cuộc kháng chiến chống Pháp từ thế phòng ngự sang thế tiến công và giành quyền chủ động trên chiến trường chính Bắc Bộ.","Nếu đề hỏi chiến dịch làm phá sản hoàn toàn kế hoạch “đánh nhanh thắng nhanh” của Pháp, bảo vệ an toàn cơ quan đầu não kháng chiến chọn Chiến dịch Việt Bắc 1947; hỏi chiến dịch giải phóng phần lớn vùng Tây Bắc chọn Tây Bắc 1952; hỏi trận quyết chiến chiến lược kết thúc kháng chiến chống Pháp chọn Điện Biên Phủ 1954."],[130,2,"Kế thừa và phát huy truyền thống của dân tộc ta “lấy ít địch nhiều, lấy yếu thắng mạnh, lấy chính nghĩa thắng hung tàn” được thể hiện rõ nhất qua nội dung nào trong đường lối kháng chiến chống Pháp của Đảng (1946 – 1954)?",["Kháng chiến toàn dân.","Kháng chiến toàn diện.","Tự lực cánh sinh, tranh thủ sự ủng hộ quốc tế","Kháng chiến trường kì"],3,"Trong bối cảnh tương quan lực lượng đầu kháng chiến chống Pháp quá chênh lệch (ta yếu hơn hẳn về vũ khí, quân đội và kinh tế), Đảng xác định phương châm kháng chiến trường kì (lâu dài) nhằm vừa đánh vừa xây dựng lực lượng. Tư tưởng này trực tiếp kế thừa truyền thống “lấy ít địch nhiều, lấy yếu thắng mạnh” của dân tộc, từng bước chuyển hóa tương quan để đi đến thắng lợi cuối cùng.","Nếu đề hỏi nội dung huy động sức mạnh của mọi tầng lớp nhân dân (“mỗi người dân là một chiến sĩ”) chọn Kháng chiến toàn dân; hỏi đánh địch trên mọi mặt trận quân sự, chính trị, kinh tế, văn hóa, ngoại giao chọn Kháng chiến toàn diện; hỏi dựa vào sức mình là chính chọn Tự lực cánh sinh, tranh thủ sự ủng hộ quốc tế."],[131,2,"Đường lối tiến hành xây dựng chủ nghĩa xã hội ở Miền Bắc được xác định trong Đại hội Đảng toàn quốc lần thứ III?",["Ưu tiên phát triển công nghiệp nhẹ - lấy công nghiệp nhẹ là nền tảng của nền kinh tế quốc dân","Ra sức phát triển nông nghiệp và công nghiệp nhẹ - lấy công nghiệp nhẹ là nền tảng của nền kinh tế quốc dân","Kết hợp phát triển công nghiệp với nông nghiệp - lấy nông nghiệp là nền tảng của nền kinh tế quốc dân","Lấy công nghiệp nặng làm nền tảng của nền kinh tế - ưu tiên phát triển công nghiệp nặng một cách hợp lí"],3,"Đại hội đại biểu toàn quốc lần thứ III (9/1960) xác định công nghiệp hóa xã hội chủ nghĩa là nhiệm vụ trung tâm trong thời kỳ quá độ ở miền Bắc. Đường lối xây dựng kinh tế lúc này chủ trương xây dựng nền kinh tế cân đối và hiện đại, lấy công nghiệp nặng làm nền tảng, ưu tiên phát triển công nghiệp nặng một cách hợp lý, đồng thời ra sức phát triển nông nghiệp và công nghiệp nhẹ.","Đừng nhầm với đường lối thời kỳ đầu Đổi mới: nếu đề hỏi Đại hội nào điều chỉnh từ ưu tiên công nghiệp nặng sang coi nông nghiệp là mặt trận hàng đầu và tập trung phát triển hàng tiêu dùng, hàng xuất khẩu thì chọn Đại hội V (3/1982) và nhất là Đại hội VI (12/1986)."],[132,2,"Nghị quyết Hội nghị lần thứ 15 Ban Chấp hành Trung ương Đảng khóa II, tháng 1/1959 chỉ rõ: “Lấy sức mạnh của quần chúng, dựa vào lực lượng chính trị của quần chúng là chủ yếu, kết hợp với lực lượng vũ trang để đánh đổ quyền thống trị của ......., dựng lên chính quyền cách mạng của nhân dân”. Dấu “...” trong lời khẳng định trên là gì?",["đế quốc","phong kiến","tư sản","Phong kiến, tư sản và đế quốc"],3,"Nghị quyết Hội nghị Trung ương lần thứ 15 khóa II (1/1959) xác định con đường cơ bản của cách mạng miền Nam là khởi nghĩa giành chính quyền về tay nhân dân, lấy sức mạnh và lực lượng chính trị của quần chúng là chủ yếu kết hợp với lực lượng vũ trang. Mục tiêu là đánh đổ quyền thống trị của thế lực đế quốc xâm lược cùng tập đoàn tay sai phong kiến, tư sản phản động, nên trong bộ đề chọn phương án bao quát đủ cả ba đối tượng “Phong kiến, tư sản và đế quốc”.","Các phương án nêu đơn lẻ từng thế lực đều chưa đầy đủ nên nhớ chọn phương án gộp cả ba theo đáp án bộ đề (lưu ý trong văn bản giáo trình thường tóm gọn là “đế quốc và phong kiến”). Nếu đề hỏi sự kiện trực tiếp thổi bùng phong trào Đồng khởi (1959–1960) thì chính là Nghị quyết Trung ương 15 (1/1959)."],[133,2,"Tài liệu nào dưới đây được coi như Cương lĩnh quân sự đầu tiên của Đảng ta?",["Đường cách mệnh","Cách đánh du kích","Con đường giải phóng","Chỉ thị thành lập Đội Việt Nam tuyên truyền giải phóng quân"],3,"Chỉ thị thành lập Đội Việt Nam tuyên truyền giải phóng quân do lãnh tụ Hồ Chí Minh soạn thảo (12/1944) đã xác định rõ bản chất cách mạng, nguyên tắc tổ chức, phương châm “chính trị trọng hơn quân sự” và chiến thuật du kích của lực lượng vũ trang ta. Vì mang tính định hướng nền tảng cho việc xây dựng quân đội nhân dân, tài liệu này được coi như Cương lĩnh quân sự đầu tiên của Đảng.","Nếu đề hỏi tác phẩm tập hợp các bài giảng huấn luyện cán bộ tại Quảng Châu (1927) chọn “Đường cách mệnh”; hỏi sách hướng dẫn chiến thuật đánh du kích chọn “Cách đánh du kích”; hỏi tài liệu chuẩn bị khởi nghĩa năm 1941 chọn “Con đường giải phóng”."],[134,2,"Chiến thắng Điện Biên Phủ “được ghi vào lịch sử dân tộc như một Bạch Đằng, một Chi Lăng hay một Đống Đa trong thế kỷ XX và đã đi vào lịch sử thế giới như một chiến công chói lọi đột phá thành trì của hệ thống nô dịch thuộc địa của chủ nghĩa đế quốc”. Anh/chị cho biết nhận định trên là của tác giả nào?",["Lê Hồng Phong","Trường Chinh","Phạm Văn Đồng","Lê Duẩn"],3,"Nhận định ví chiến thắng Điện Biên Phủ như một Bạch Đằng, Chi Lăng hay Đống Đa trong thế kỷ XX và là chiến công đột phá thành trì hệ thống thuộc địa của chủ nghĩa đế quốc là của Tổng Bí thư Lê Duẩn. Câu nói này được nêu trong tác phẩm “Dưới lá cờ vẻ vang của Đảng, vì độc lập tự do, vì chủ nghĩa xã hội, tiến lên giành những thắng lợi mới” (1970).","Nếu đề hỏi tác giả cuốn “Kháng chiến nhất định thắng lợi” (1947) giải thích đường lối kháng chiến chống Pháp chọn Trường Chinh; hỏi Trưởng đoàn đàm phán ta tại Hội nghị Giơnevơ (1954) chọn Phạm Văn Đồng; hỏi Tổng Bí thư đầu tiên được bầu tại Đại hội I (1935) chọn Lê Hồng Phong."],[135,2,"Thắng lợi của cuộc kháng chiến chống Mỹ, cứu nước đã để lại cho Đảng ta nhiều bài học kinh nghiệm có giá trị về lãnh đạo và chỉ đạo cách mạng. Bài học nào sau đây có giá trị hàng đầu?",["Coi trọng công tác tổ chức, công tác xây dựng Đảng","Kiên định tư tưởng chiến lược tiến công, quyết đánh và quyết thắng đế quốc Mỹ xâm lược","Thực hiện chiến tranh nhân dân, tìm ra biện pháp chiến đấu đúng đắn, linh hoạt, sáng tạo","Giương cao ngọn cờ độc lập dân tộc và chủ nghĩa xã hội"],3,"Theo tổng kết cuộc kháng chiến chống Mỹ, cứu nước (1954–1975) trong Giáo trình Lịch sử Đảng, bài học kinh nghiệm có giá trị hàng đầu là “Giương cao ngọn cờ độc lập dân tộc và chủ nghĩa xã hội”. Đường lối này giúp Đảng lãnh đạo tiến hành đồng thời và kết hợp chặt chẽ hai chiến lược cách mạng ở hai miền Nam – Bắc nhằm hoàn thành mục tiêu thống nhất Tổ quốc.","Phân biệt thật rõ từ khóa: đề hỏi bài học “có giá trị hàng đầu” thì chọn “Giương cao ngọn cờ độc lập dân tộc và chủ nghĩa xã hội”; còn nếu đề hỏi bài học “trực tiếp dẫn tới thắng lợi” thì phải chọn “Kiên định tư tưởng chiến lược tiến công, quyết đánh và quyết thắng đế quốc Mỹ xâm lược”."],[136,2,"Bài học nào sau đây trực tiếp dẫn tới thắng lợi của cuộc kháng chiến chống Mỹ, cứu nước?",["Giương cao ngọn cờ độc lập dân tộc và chủ nghĩa xã hội","Coi trọng công tác tổ chức, công tác xây dựng Đảng","Thực hiện chiến tranh nhân dân, tìm ra biện pháp chiến đấu đúng đắn, linh hoạt, sáng tạo","Kiên định tư tưởng chiến lược tiến công, quyết đánh và quyết thắng đế quốc Mỹ xâm lược"],3,"Trong các bài học kinh nghiệm của cuộc kháng chiến chống Mỹ, cứu nước, việc kiên định tư tưởng chiến lược tiến công, quyết đánh và quyết thắng đế quốc Mỹ xâm lược là bài học trực tiếp dẫn tới thắng lợi. Nhờ giữ vững thế chủ động tiến công từ Đồng khởi đến Tổng tiến công mùa Xuân 1975, quân dân ta đã lần lượt đánh bại mọi chiến lược chiến tranh của Mỹ.","Ghi nhớ cặp đối chiếu rất hay nhầm: “trực tiếp dẫn tới thắng lợi” gắn với “Kiên định tư tưởng chiến lược tiến công...”; “có giá trị hàng đầu” gắn với “Giương cao ngọn cờ độc lập dân tộc và chủ nghĩa xã hội”; còn “nhân tố quyết định thắng lợi” thường gắn với công tác xây dựng Đảng vững mạnh."],[137,2,"Chủ tịch Hồ Chí Minh đã đọc mấy câu thơ sau đây tại sự kiện nào? Ngày, tháng, năm nào? “Đảng ta là đạo đức, là văn minh, Là thống nhất, độc lập, là hòa bình ấm no. Công ơn Đảng thật là to, Ba mươi năm lịch sử Đảng là cả một pho lịch sử bằng vàng...”.",["Lễ kỷ niệm 30 năm ngày thành lập Đảng (3/2/1960)","Lễ kỷ niệm 30 năm ngày thành lập Đảng (2/3/1960)","Lễ kỷ niệm 30 năm ngày thành lập Đảng (2/9/1960)","Lễ kỷ niệm 30 năm ngày thành lập Đảng (5/1/1960)"],3,"Trước Đại hội III (9/1960), Đảng kỷ niệm ngày thành lập vào dịp đầu tháng 1 (theo ngày khai mạc Hội nghị hợp nhất năm 1930). Vì vậy, lễ kỷ niệm 30 năm ngày thành lập Đảng được tổ chức trọng thể vào ngày 5/1/1960 tại Hà Nội, nơi Chủ tịch Hồ Chí Minh đã đọc diễn văn cùng những vần thơ nổi tiếng “Đảng ta là đạo đức, là văn minh...”.","Đây là câu rất dễ sập bẫy chọn mốc 3/2/1960 theo thói quen hiện nay. Hãy nhớ mốc chuyển đổi: phải đến Đại hội III (9/1960) Đảng mới chính thức nghị quyết lấy ngày 3/2 hằng năm làm ngày kỷ niệm thành lập Đảng, còn lễ kỷ niệm 30 năm đầu năm 1960 diễn ra vào ngày 5/1/1960."],[138,2,"Những thành tựu căn bản của cách mạng Việt Nam trong việc xây dựng và củng cố chính quyền cách mạng về chính trị sau 1945 là gì?",["Toàn thể nhân dân được giải phóng, thống nhất nước nhà","Củng cố hệ thống Nhà nước từ Trung ương đến cơ sở","Thiết lập ngoại giao với tất cả các nước dân chủ","Tổ chức tổng tuyển cử và ban hành hiến pháp; củng cố và mở rộng mặt trận Việt Minh"],3,"Giai đoạn 1945–1946, để giữ vững chính quyền cách mạng non trẻ trước thù trong giặc ngoài, thành tựu chính trị căn bản nhất của ta là tổ chức thành công Tổng tuyển cử bầu Quốc hội khóa I (6/1/1946), thông qua Hiến pháp dân chủ đầu tiên (11/1946), đồng thời củng cố và mở rộng Mặt trận Việt Minh. Các phương án nói về thống nhất hoàn toàn đất nước hay ngoại giao với tất cả nước dân chủ đều không đúng với bối cảnh sau 1945.","Nếu đề hỏi ngày diễn ra Tổng tuyển cử đầu tiên bầu Quốc hội khóa I chọn 6/1/1946; hỏi ngày thông qua Hiến pháp đầu tiên của nước ta chọn 9/11/1946; còn hỏi thành tựu văn hóa – giáo dục sau 1945 thì gắn với phong trào “Bình dân học vụ” xóa nạn mù chữ."],[139,2,"Câu nói: “Miền Nam là máu của máu Việt Nam, là thịt của thịt Việt Nam. Sông có thể cạn, núi có thể mòn song chân lý đó không bao giờ thay đổi” là của ai?",["Hoàng Hoa Thám","Phạm Bành","Phan Bội Châu","Hồ Chí Minh"],3,"Câu nói bất hủ “Miền Nam là máu của máu Việt Nam, là thịt của thịt Việt Nam. Sông có thể cạn, núi có thể mòn song chân lý đó không bao giờ thay đổi” là của Chủ tịch Hồ Chí Minh. Người khẳng định chân lý này trong cuộc họp báo tại Pari tháng 7/1946 nhằm kiên quyết bác bỏ âm mưu chia cắt đất nước, lập “Nam Kỳ tự trị” của thực dân Pháp.","Ba nhân vật nhiễu đều thuộc phong trào yêu nước cuối thế kỷ XIX – đầu thế kỷ XX nên dễ loại trừ: Hoàng Hoa Thám (khởi nghĩa Yên Thế), Phạm Bành (khởi nghĩa Ba Đình – phong trào Cần Vương) và Phan Bội Châu (phong trào Đông Du, Duy Tân Hội)."],[140,2,"Câu nói: “Chiến tranh có thể kéo dài năm năm, 10 năm, 20 năm hoặc lâu hơn nữa. Hà Nội, Hải phòng và một số thành phố, xí nghiệp có thể bị tàn phá, song nhân dân Việt Nam quyết không sợ! Không có gì quý hơn độc lập, tự do” của Chủ tịch Hồ Chí Minh viết thời gian nào, trong tác phẩm, bài viết hoặc bài nói nào?",["Tác phẩm “Mỹ nhất định thua”, ngày 1/2/1966","Tác phẩm “Di Chúc”, ngày 10/5/1968","Tác phẩm “Di Chúc”, ngày 10/5/1969","Bài nói “Lời kêu gọi”, ngày 17/7/1966"],3,"Giữa lúc đế quốc Mỹ leo thang chiến tranh phá hoại, ném bom bắn phá Thủ đô Hà Nội và Hải Phòng (6/1966), ngày 17/7/1966 Chủ tịch Hồ Chí Minh đã công bố bài nói “Lời kêu gọi” (còn gọi là Lời kêu gọi chống Mỹ, cứu nước). Văn kiện này nêu bật chân lý thời đại “Không có gì quý hơn độc lập, tự do”, cổ vũ mạnh mẽ ý chí quyết chiến quyết thắng của toàn dân tộc.","Đừng nhầm với “Di chúc” (viết và bổ sung từ 1965 đến 10/5/1969): nếu đề hỏi văn kiện Bác căn dặn về giữ gìn sự đoàn kết trong Đảng, bồi dưỡng thế hệ cách mạng cho đời sau và niềm tin “Đế quốc Mỹ nhất định phải cút khỏi nước ta” thì mới chọn tác phẩm “Di chúc”."],[141,2,"Lực lượng nào giữ vai trò quan trọng nhất trong chiến lược “Chiến tranh cục bộ” của đế quốc Mỹ ở Miền Nam Việt Nam?",["Quân đội Mỹ và quân đội Sài Gòn","Quân đội Mỹ và quân đồng minh","Quân đội Sài Gòn và quân đồng minh","Quân đội Mỹ, quân đồng minh và quân đội Sài Gòn"],3,"Chiến lược “Chiến tranh cục bộ” (1965–1968) được đế quốc Mỹ triển khai bằng việc đưa ồ ạt quân viễn chinh Mỹ và quân các nước đồng minh vào trực tiếp tham chiến ở miền Nam, kết hợp chặt chẽ với quân đội Sài Gòn. Sự phối hợp của cả ba lực lượng này nhằm mục tiêu tiến hành chiến lược hai gọng kìm “tìm diệt” và “bình định” trên chiến trường miền Nam.","Phân biệt nhanh lực lượng các chiến lược chiến tranh của Mỹ: “Chiến tranh đặc biệt” (1961–1965) dùng quân Sài Gòn và cố vấn, vũ khí Mỹ; “Chiến tranh cục bộ” (1965–1968) dùng quân Mỹ, quân đồng minh và quân đội Sài Gòn (quân Mỹ giữ vai trò nòng cốt); “Việt Nam hóa chiến tranh” (1969–1973) rút dần quân Mỹ, lấy quân Sài Gòn làm chủ yếu."],[142,2,"Đây là một phong trào thi đua của nhân dân miền Bắc trên lĩnh vực sản xuất nông nghiệp trong những năm chống chiến tranh phá hoại của đế quốc Mĩ?",["“Ba điểm cao\"","\"Hai giỏi\"","\"Ba tốt\"","“Ba mục tiêu\""],3,"Trong những năm chống chiến tranh phá hoại của đế quốc Mỹ, trên mặt trận sản xuất nông nghiệp ở miền Bắc đã dấy lên mạnh mẽ phong trào thi đua “Ba mục tiêu” (phấn đấu đạt 5 tấn thóc, 2 con lợn, 1 lao động trên 1 héc-ta gieo trồng). Phong trào góp phần giúp hậu phương miền Bắc vững chắc về lương thực và chi viện hiệu quả cho tiền tuyến miền Nam.","Phân biệt các phong trào thi đua theo đúng lĩnh vực: nông nghiệp là “Ba mục tiêu” (cùng “Tay cày, tay súng”); công nghiệp là “Ba điểm cao” (năng suất cao, chất lượng tốt, tiết kiệm nhiều); thanh niên là “Ba sẵn sàng”; phụ nữ là “Ba đảm đang”; giáo dục là “Hai tốt”."],[143,2,"Chọn phương án đúng nhất điền vào chỗ trống trong câu nói sau của Hồ Chủ tịch: \"........... cũng là một mặt trận, mỗi cán bộ, công nhân, thanh niên xung phong ngành ........... là một chiến sĩ”",["Sản xuất nông nghiệp","Kinh tế","Văn hoá","Giao thông vận tải"],3,"Khi đế quốc Mỹ đánh phá ác liệt mạng lưới đường sá, cầu cống miền Bắc nhằm ngăn chặn nguồn chi viện cho miền Nam, Chủ tịch Hồ Chí Minh đã khẳng định: “Giao thông vận tải cũng là một mặt trận, mỗi cán bộ, công nhân, thanh niên xung phong ngành giao thông vận tải là một chiến sĩ”. Lời dạy này đã cổ vũ toàn ngành giữ vững mạch máu giao thông chi viện cho tiền tuyến.","Dấu hiệu nhận biết ngay đáp án là cụm từ “thanh niên xung phong”. Nếu đề hỏi câu nói nổi tiếng khác của Bác có cấu trúc tương tự: “Văn hóa nghệ thuật cũng là một mặt trận. Anh chị em là chiến sĩ trên mặt trận ấy” (Thư gửi các họa sĩ năm 1951) thì mới chọn lĩnh vực văn hóa."],[144,2,"Chọn phương án đúng nhất điền vào chỗ trống trong lời kêu gọi của Hồ Chủ tịch: \"........... ngay, ........... nữa. Đó là khẩu hiệu của ta ngày nay, đó là cách thiết thực để ta giữ vững quyền tự do độc lập”",["Thực hành tiết kiệm, tăng gia sản xuất, tăng gia sản xuất","Không bỏ hoang ruộng đất, tăng gia sản xuất, tăng gia sản xuất","Khôi phục thuỷ lợi, tăng gia sản xuất, tăng gia sản xuất","Tăng gia sản xuất, tăng gia sản xuất, tăng gia sản xuất"],3,"Trước nạn đói khủng khiếp đe dọa sinh mệnh hàng triệu đồng bào và chính quyền cách mạng non trẻ cuối năm 1945, Chủ tịch Hồ Chí Minh kêu gọi khẩu hiệu nhấn mạnh ba lần đầy khẩn thiết: “Tăng gia sản xuất! Tăng gia sản xuất ngay! Tăng gia sản xuất nữa!”. Đây được xác định là giải pháp căn cơ, thiết thực nhất để diệt giặc đói và giữ vững độc lập dân tộc.","Nhớ phân biệt hai nhóm biện pháp chống giặc đói sau Cách mạng Tháng Tám: biện pháp cấp bách trước mắt là “Hũ gạo cứu đói”, “Ngày đồng tâm”, tiết kiệm sẻ cơm nhường áo; còn biện pháp lâu dài, căn cơ là khẩu hiệu lặp 3 lần “Tăng gia sản xuất” gắn với bãi bỏ thuế thân, giảm tô 25%."],[145,3,"Nền kinh tế của ta sau 5 năm vẫn còn mất cân đối, sản xuất phát triển chậm, thu nhập quốc dân và năng suất lao động thấp, đời sống nhân dân còn gặp nhiều khó khăn. Đó là những hạn chế của thời kỳ nào?",["Thực hiện kế hoạch 5 năm lần nhất (1960-1965)","Thời kỳ khôi phục kinh tế miền Bắc (1968-1973)","Thực hiện kế hoạch 5 năm (1981-1985)","Thực hiện kế hoạch 5 năm (1976-1980)"],3,"Kết thúc kế hoạch 5 năm lần thứ hai (1976–1980), dù nhân dân ta có nhiều nỗ lực khắc phục hậu quả chiến tranh, nền kinh tế vẫn mất cân đối nghiêm trọng, sản xuất phát triển chậm, thu nhập quốc dân tăng rất thấp (chỉ 0,4%/năm) và đời sống nhân dân hết sức khó khăn. Nguyên nhân sâu xa ngoài hậu quả chiến tranh còn do sai lầm chủ quan duy ý chí và cơ chế tập trung quan liêu bao cấp.","Nếu đề hỏi giai đoạn kinh tế bắt đầu có chuyển biến tích cực (lương thực tăng từ 13,4 lên 17 triệu tấn, thu nhập quốc dân tăng bình quân 6,4%/năm) nhưng vẫn chưa thoát khỏi khủng hoảng thì chọn Kế hoạch 5 năm 1981–1985; còn kế hoạch 5 năm lần thứ nhất (1961–1965) chỉ thực hiện ở miền Bắc."],[146,3,"Đại hội Đảng toàn quốc lần thứ V (3/1982) có những quyết định quan trọng. Điều nào sau đây chưa phải là quyết định của Đại hội Đảng lần này?",["Tiếp tục đường lối xây dựng CNXH trong phạm vi cả nước","Thời kỳ quá độ lên CNXH ở nước ta phải trải qua nhiều chặng đường","Phương hướng, nhiệm vụ, mục tiêu của kế hoạch 5 năm (1981-1985)","Cả nước tiến nhanh, tiến mạnh tiến vững chắc lên chủ nghĩa xã hội"],3,"Chủ trương “cả nước tiến nhanh, tiến mạnh, tiến vững chắc lên chủ nghĩa xã hội” là quyết định của Đại hội IV (12/1976), không phải của Đại hội V (3/1982). Đến Đại hội V, trước thực tiễn khó khăn, Đảng đã điều chỉnh nhận thức rằng thời kỳ quá độ lên CNXH ở nước ta phải trải qua nhiều chặng đường, xác định đang ở chặng đường đầu tiên và đề ra mục tiêu kế hoạch 5 năm 1981–1985.","Nhớ cặp đối lập giữa hai Đại hội trước Đổi mới: Đại hội IV (12/1976) chủ trương “tiến nhanh, tiến mạnh, tiến vững chắc lên CNXH”; Đại hội V (3/1982) điều chỉnh bước đi “trải qua nhiều chặng đường”, coi nông nghiệp là mặt trận hàng đầu và đề ra hai nhiệm vụ chiến lược xây dựng CNXH và bảo vệ Tổ quốc."],[147,3,"Điểm nào chưa phải là thành tựu chủ yếu của kế hoạch nhà nước 5 năm (1981-1985)?",["Sản xuất lương thực tăng bình quân từ 13,4 triệu tấn trong thời kỳ 1976-1980 lên đến 17 triệu tấn","Thu nhập quốc dân tăng bình quân hàng năm là 6,4 % so với 0,4 % trong thời kỳ 1976-1980","Hoàn thành hàng trăm công trình tương đối lớn","Về cơ bản ổn định tình hình kinh tế - xã hội, ổn định đời sống nhân dân"],3,"Trong kế hoạch 5 năm 1981–1985, nhờ những bước đột phá như Chỉ thị 100 (Khoán 100), sản xuất lương thực tăng bình quân từ 13,4 lên 17 triệu tấn, thu nhập quốc dân tăng bình quân 6,4%/năm và nhiều công trình lớn được hoàn thành. Tuy vậy, do cơ chế bao cấp kéo dài và sai lầm trong cải cách giá – lương – tiền (1985), nước ta vẫn lún sâu vào khủng hoảng, chưa thể “về cơ bản ổn định tình hình kinh tế – xã hội, ổn định đời sống nhân dân”.","Nếu đề hỏi giai đoạn nước ta thực sự bắt đầu ổn định được tình hình kinh tế – xã hội và từng bước thoát khỏi khủng hoảng thì phải từ sau Đại hội VI (12/1986), và đến Đại hội VIII (1996) Đảng mới chính thức khẳng định nước ta đã ra khỏi khủng hoảng kinh tế – xã hội."],[148,3,"Tình trạng khủng hoảng trầm trọng về kinh tế - xã hội của đất nước trong thời kỳ 1980 - 1985 được biểu hiện ở nhiều mặt. Điểm nào không đúng với thực tế nói trên?",["Vấn đề lương thực chưa được giải quyết","Đời sống nhân dân còn khó khăn, chưa ổn định","Văn hóa - giáo dục chưa được coi trọng","Hàng tiêu dùng còn khan hiếm"],2,"Trong giai đoạn 1980–1985, tình trạng khủng hoảng trầm trọng về kinh tế – xã hội biểu hiện rõ nét nhất ở việc thiếu lương thực chưa được giải quyết dứt điểm, hàng tiêu dùng khan hiếm, lạm phát phi mã và đời sống nhân dân nhiều khó khăn, chưa ổn định. Dù kinh tế rất khó khăn, Đảng và Nhà nước vẫn luôn quan tâm phát triển sự nghiệp giáo dục, văn hóa, y tế nên nhận định “Văn hóa – giáo dục chưa được coi trọng” là không đúng với thực tế.","Khi gặp câu hỏi phủ định (“không đúng”, “chưa phải”) về tình hình khủng hoảng 1980–1985, hãy giữ lại các khó khăn thực tế về lương thực, hàng tiêu dùng, lạm phát và đời sống, đồng thời loại ngay phương án phủ nhận sự coi trọng của Đảng đối với lĩnh vực văn hóa – giáo dục."],[149,3,"Đại hội lần thứ VI của Đảng Cộng sản Việt Nam họp từ thời gian nào?",["Từ ngày 15 đến ngày 18/12/1985","Từ ngày 10 đến ngày 18/12/1985","Từ ngày 20 đến ngày 25/12/1986","Từ ngày 15 đến ngày 18/12/1986"],3,"Đại hội đại biểu toàn quốc lần thứ VI của Đảng Cộng sản Việt Nam họp tại Thủ đô Hà Nội từ ngày 15 đến ngày 18/12/1986. Đại hội đã nhìn thẳng vào sự thật, đánh giá đúng sự thật, đề ra đường lối đổi mới toàn diện đất nước và bầu đồng chí Nguyễn Văn Linh giữ chức Tổng Bí thư.","Đề rất hay gây nhiễu bằng năm 1985 (năm xảy ra sai lầm cải cách giá – lương – tiền) hoặc đổi ngày cuối tháng 12/1986. Mẹo nhớ nhanh hai Đại hội họp vào giữa tháng 12 cách nhau đúng 10 năm: Đại hội IV (14–20/12/1976) và Đại hội VI (15–18/12/1986)."],[150,3,"Quan điểm đổi mới của Đảng ta tại Đại hội Đảng VI (12/1986) là gì?",["Đổi mới về kinh tế","Đổi mới về văn hóa","Đổi mới về chính trị","Đổi mới toàn diện và đồng bộ"],3,"Tại Đại hội VI (12/1986), Đảng xác định quan điểm đổi mới là “đổi mới toàn diện và đồng bộ” trên tất cả các lĩnh vực của đời sống xã hội từ kinh tế, chính trị, văn hóa, xã hội đến đối ngoại, với bước đi và cách làm phù hợp. Các phương án chỉ nêu đổi mới riêng lẻ từng mặt kinh tế, văn hóa hay chính trị đều chưa đầy đủ quan điểm của Đại hội.","Cẩn thận phân biệt từ khóa hỏi: nếu đề hỏi “quan điểm đổi mới” chung tại Đại hội VI chọn “Đổi mới toàn diện và đồng bộ”; hỏi lấy lĩnh vực nào làm “trọng tâm” mới chọn đổi mới kinh tế; còn hỏi đổi mới bắt đầu từ đâu về nhận thức chọn “đổi mới tư duy, trước hết là tư duy kinh tế”."],[151,3,"Do yêu cầu đẩy mạnh sản xuất, bảo đảm đời sống và nâng cao hiệu quả kinh tế, Ban Bí thư Trung ương Đảng khóa IV đã ban hành Chỉ thị “Cải tiến công tác khoán, mở rộng khoán sản phẩm đến nhóm lao động và người lao động trong hợp tác xã nông nghiệp”. Anh/chị hãy cho biết, đó là Chỉ thị số bao nhiêu, ban hành ngày, tháng, năm nào?",["Chỉ thị số 99-CT/TW, ngày 13/01/1981","Chỉ thị số 101-CT/TW, ngày 13/01/1981","Chỉ thị số 102-CT/TW, ngày 13/01/1981","Chỉ thị số 100-CT/TW, ngày 13/01/1981"],3,"Ngày 13/01/1981, Ban Bí thư Trung ương Đảng khóa IV ban hành Chỉ thị số 100-CT/TW (quen gọi là Khoán 100) về “Cải tiến công tác khoán, mở rộng khoán sản phẩm đến nhóm lao động và người lao động trong hợp tác xã nông nghiệp”. Đây là bước đột phá quan trọng trong cơ chế quản lý nông nghiệp, khơi dậy tính tích cực của nông dân và đẩy sản lượng lương thực tăng rõ rệt giai đoạn 1981–1985.","Phân biệt chắc chắn hai văn kiện khoán lịch sử: Chỉ thị số 100-CT/TW (13/1/1981 – Khoán 100) khoán sản phẩm đến nhóm và người lao động; còn Nghị quyết số 10-NQ/TW của Bộ Chính trị (5/4/1988 – Khoán 10) giao quyền sử dụng ruộng đất ổn định lâu dài cho hộ nông dân, đưa Việt Nam bắt đầu xuất khẩu gạo từ năm 1989."],[152,3,"Trong 5 năm (1996-2006) tổng sản phẩm trong nước tăng bình quân hàng năm là bao nhiêu % ?",["5%","6%","8%","7%"],3,"Theo báo cáo tổng kết thực hiện kế hoạch 5 năm 1996–2000 tại Đại hội IX (4/2001), dù chịu ảnh hưởng nặng nề từ cuộc khủng hoảng tài chính – tiền tệ khu vực châu Á (1997), kinh tế Việt Nam vẫn đứng vững và duy trì tốc độ tăng trưởng GDP bình quân hằng năm đạt 7%.","Lưu ý câu hỏi trong bộ đề có lỗi in nhầm mốc năm “1996–2006” thay vì đúng 5 năm là “1996–2000”, nhưng đáp án chuẩn vẫn là 7%. Nếu đề hỏi tăng trưởng GDP bình quân giai đoạn 5 năm 1991–1995 chọn 8,2%, còn giai đoạn 2001–2005 chọn 7,5%."],[153,3,"Sự kiện nào là quan trọng nhất trong quá trình thống nhất đất nước về mặt Nhà nước sau 1975?",["Hội nghị Hiệp thương của đại biểu 2 miền Bắc Nam tại Sài Gòn (11/1975)","Quốc hội khóa V của nước Việt Nam thống nhất kỳ họp đầu tiên (24/6 - 2/7/1976)","Đại hội thống nhất Mặt trận Tổ quốc Việt Nam","Tổng tuyển cử bầu ra Quốc hội trong cả nước (25/4/1975)"],3,"Trong quá trình thống nhất đất nước về mặt Nhà nước sau năm 1975, cuộc Tổng tuyển cử bầu Quốc hội chung của cả nước là sự kiện quan trọng nhất, thể hiện ý chí thống nhất của hơn 23 triệu cử tri hai miền và trực tiếp bầu ra cơ quan quyền lực nhà nước cao nhất của nước Việt Nam thống nhất. Phương án nhắc kỳ họp đầu tiên Quốc hội bị sai số khóa (ghi nhầm khóa V thay vì khóa VI).","Lưu ý bộ đề gốc in nhầm năm “25/4/1975” (ngày lịch sử chính xác là 25/4/1976, vì 25/4/1975 miền Nam chưa giải phóng), nhưng làm bài vẫn chọn Tổng tuyển cử bầu Quốc hội chung. Nếu đề hỏi sự kiện bàn chủ trương thống nhất chọn Hội nghị Hiệp thương chính trị (11/1975); hỏi sự kiện hoàn thành thống nhất Nhà nước chọn Kỳ họp thứ nhất Quốc hội khóa VI (6–7/1976)."],[154,3,"Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội bổ sung và phát triển năm 2011 đã xác định: “Xã hội xã hội chủ nghĩa mà nhân dân ta xây dựng là một xã hội như thế nào”?",["Do nhân dân lao động làm chủ","Có một nền kinh tế phát triển cao dựa trên lực lượng sản xuất hiện đại và quan hệ sản xuất phù hợp","Văn hoá là nền tảng tinh thần của xã hội","Do nhân dân làm chủ"],3,"Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung, phát triển năm 2011) tại Đại hội XI xác định đặc trưng chủ thể của xã hội XHCN nước ta là “Do nhân dân làm chủ”, mở rộng hơn so với cụm từ “Do nhân dân lao động làm chủ” của Cương lĩnh 1991. Các phương án khác giữ diễn đạt cũ năm 1991 hoặc trích chưa chính xác câu chữ của Cương lĩnh 2011.","Mẹo phân biệt nhanh hai bản Cương lĩnh: Cương lĩnh năm 1991 (Đại hội VII, 6 đặc trưng) viết “Do nhân dân lao động làm chủ”; Cương lĩnh năm 2011 (Đại hội XI, 8 đặc trưng) bỏ chữ “lao động” thành “Do nhân dân làm chủ” và đưa “Dân giàu, nước mạnh, dân chủ, công bằng, văn minh” lên làm đặc trưng đầu tiên."],[155,3,"Kế hoạch 5 năm phát triển kinh tế - xã hội giai đoạn 1976-1980 là kế hoạch của Đại hội đại biểu toàn quốc lần thứ mấy?",["Đại hội V","Đại hội VI","Đại hội VII","Đại hội IV"],3,"Đại hội đại biểu toàn quốc lần thứ IV của Đảng (12/1976) là Đại hội đầu tiên sau khi đất nước thống nhất, đã đề ra đường lối cách mạng XHCN trên phạm vi cả nước và thông qua phương hướng, nhiệm vụ của kế hoạch nhà nước 5 năm (1976–1980) nhằm khôi phục, phát triển kinh tế và cải tạo xã hội chủ nghĩa.","Ghi nhớ trục đối chiếu Đại hội với kế hoạch 5 năm rất dễ ăn điểm: Đại hội IV (1976) gắn với 1976–1980; Đại hội V (1982) gắn với 1981–1985; Đại hội VI (1986) gắn với 1986–1990; Đại hội VII (1991) gắn với 1991–1995."],[156,3,"Quốc hội thống nhất cả nước là Quốc hội khóa mấy?",["Khóa IV","Khóa V","Khóa VII","Khóa VI"],3,"Để khẳng định tính liên tục của Nhà nước cách mạng từ sau Cách mạng Tháng Tám 1945 (từ Quốc hội khóa I năm 1946 đến Quốc hội khóa V năm 1975 ở miền Bắc), Quốc hội chung của nước Việt Nam thống nhất được bầu ngày 25/4/1976 mang tên là Quốc hội khóa VI (nhiệm kỳ 1976–1981).","Rất nhiều sinh viên nhầm số thứ tự khóa Quốc hội với số lần Đại hội Đảng trong cùng năm 1976: năm 1976, Đảng họp Đại hội đại biểu toàn quốc lần thứ IV (tháng 12/1976), còn Quốc hội thống nhất cả nước là Quốc hội khóa VI (họp kỳ đầu tháng 6–7/1976)."],[157,3,"Kỳ họp thứ I Quốc hội khóa VI có những quyết định nào liên quan với việc thống nhất đất nước về mặt Nhà nước?",["Quy định Quốc huy, Quốc kì, Quốc ca, thủ đô là Thành phố Hồ Chí Minh","Bầu các cơ quan địa phương trên cả nước","Đổi tên thành phố Sài Gòn - Gia Định là Thành phố Hồ Chí Minh","Thống nhất tên nước, quy định Quốc huy, Quốc kì, Quốc ca, thủ đô là Hà Nội"],3,"Tại kỳ họp thứ nhất (24/6–3/7/1976), Quốc hội khóa VI đã thông qua các nghị quyết quan trọng nhất về thống nhất đất nước về mặt Nhà nước: lấy tên nước là Cộng hòa xã hội chủ nghĩa Việt Nam, quy định Quốc huy, Quốc kỳ (cờ đỏ sao vàng), Quốc ca (Tiến quân ca) và chọn Hà Nội làm Thủ đô. Phương án nói Thủ đô là Thành phố Hồ Chí Minh là sai, còn các phương án khác chưa nêu đủ hoặc sai thẩm quyền.","Cần lưu ý kỳ họp thứ nhất Quốc hội khóa VI có quyết định đổi tên thành phố Sài Gòn – Gia Định thành Thành phố Hồ Chí Minh, nhưng câu hỏi hỏi nội dung bao quát liên quan thống nhất về mặt Nhà nước thì phải chọn phương án đủ tên nước, Quốc huy, Quốc kỳ, Quốc ca và Thủ đô Hà Nội."],[158,3,"Từ ngày 15 đến ngày 21/11/1975 ở nước ta diễn ra sự kiện nào sau đây?",["Cuộc Tổng tuyển cử của cả nước lần thứ nhất","Cuộc Tổng tuyển cử của cả nước lần thứ hai","Quốc hội khóa VI của nước Việt Nam thống nhất họp phiên đầu tiên","Hội nghị Hiệp thương chính trị thống nhất đất nước"],3,"Thực hiện chủ trương của Hội nghị Trung ương 24 khóa III (8/1975), từ ngày 15 đến ngày 21/11/1975 tại Sài Gòn đã diễn ra Hội nghị Hiệp thương chính trị thống nhất đất nước giữa hai đoàn đại biểu miền Bắc và miền Nam. Hội nghị nhất trí hoàn toàn về chủ trương, biện pháp thống nhất Tổ quốc về mặt Nhà nước, mở đường cho cuộc Tổng tuyển cử năm 1976.","Nhớ đúng thứ tự 3 mốc sự kiện thống nhất đất nước về mặt Nhà nước: 15–21/11/1975 là Hội nghị Hiệp thương chính trị tại Sài Gòn; 25/4/1976 là Tổng tuyển cử bầu Quốc hội chung cả nước; 24/6–3/7/1976 là kỳ họp thứ nhất Quốc hội khóa VI."],[159,3,"Ngày 25/4/1976, Tổng tuyển cử bầu Quốc hội chung trong cả nước có bao nhiêu cử tri tham gia?",["20 triệu","21 triệu","22 triệu","23 triệu"],3,"Ngày 25/4/1976, cuộc Tổng tuyển cử bầu Quốc hội chung của nước Việt Nam thống nhất đã diễn ra trong không khí ngày hội lớn trên khắp cả nước với hơn 23 triệu cử tri đi bỏ phiếu (đạt tỷ lệ 98,77% tổng số cử tri). Cuộc bầu cử đã bầu ra 492 đại biểu Quốc hội khóa VI, thể hiện khối đại đoàn kết và ý chí thống nhất sắt son của dân tộc.","Ghi nhớ trọn bộ 3 con số hay hỏi xoay quanh cuộc Tổng tuyển cử ngày 25/4/1976: hơn 23 triệu cử tri tham gia, đạt tỷ lệ 98,77%, và bầu ra 492 đại biểu Quốc hội khóa VI."],[160,3,"Hội nghị Hiệp thương chính trị thống nhất đất nước tại Sài Gòn đã nhất trí hoàn toàn các vấn đề gì?",["Lấy tên nước là nước Cộng hòa xã hội chủ nghĩa Việt Nam","Quốc kỳ là cờ đỏ sao vàng, Quốc ca là bài Tiến quân ca","Đổi tên Thành phố Sài Gòn - Gia Định là Thành phố Hồ Chí Minh","Chủ trương, biện pháp nhằm thống nhất đất nước về mặt Nhà nước"],3,"Hội nghị Hiệp thương chính trị thống nhất đất nước tại Sài Gòn (15–21/11/1975) đã thảo luận và đi đến nhất trí hoàn toàn về mọi chủ trương, biện pháp nhằm thống nhất đất nước về mặt Nhà nước, trọng tâm là sớm tổ chức cuộc Tổng tuyển cử trên toàn lãnh thổ Việt Nam để bầu ra Quốc hội chung của cả nước.","Phân biệt rõ thẩm quyền để không chọn nhầm: các quyết định cụ thể như tên nước Cộng hòa xã hội chủ nghĩa Việt Nam, Quốc kỳ, Quốc ca hay đổi tên TP. Sài Gòn – Gia Định thành TP. Hồ Chí Minh do Kỳ họp thứ nhất Quốc hội khóa VI (6–7/1976) thông qua, không phải Hội nghị Hiệp thương (11/1975)."],[161,3,"Đại hội nào của Đảng khẳng định: “Tư tưởng Hồ Chí Minh không chỉ là kết quả của sự vận dụng sáng tạo mà còn phát triển sáng tạo chủ nghĩa Mác - Lênin vào điều kiện cụ thể của nước ta”?",["Đại hội VII (6/1991)","Đại hội VIII (7/1996)","Đại hội VI (12/1986)","Đại hội IX (4/2001)"],3,"Đại hội đại biểu toàn quốc lần thứ IX (4/2001) đã làm rõ hơn khái niệm, nguồn gốc và nội dung cơ bản của tư tưởng Hồ Chí Minh, lần đầu tiên khẳng định tư tưởng Hồ Chí Minh không chỉ là kết quả của sự vận dụng sáng tạo mà còn là sự phát triển sáng tạo chủ nghĩa Mác – Lênin vào điều kiện cụ thể của nước ta.","Phân biệt mốc phát triển nhận thức giữa hai Đại hội: Đại hội VII (6/1991) lần đầu tiên chính thức ghi nhận Đảng lấy chủ nghĩa Mác – Lênin và tư tưởng Hồ Chí Minh làm nền tảng tư tưởng, kim chỉ nam cho hành động; đến Đại hội IX (4/2001) mới định nghĩa đầy đủ và khẳng định “vận dụng và phát triển sáng tạo”."],[162,3,"Báo cáo chính trị của Ban Chấp hành trung ương tại Đại hội VIII (7/1996) đã bổ sung đặc trưng tổng quát về mục tiêu xây dựng chủ nghĩa xã hội ở Việt Nam là gì?",["Do nhân dân lao động làm chủ","Có một nền kinh tế phát triển cao dựa trên lực lượng sản xuất hiện đại và quan hệ sản xuất phù hợp","Văn hoá là nền tảng tinh thần của xã hội","Dân giàu, nước mạnh, xã hội công bằng, văn minh"],3,"Tổng kết 10 năm thực hiện công cuộc đổi mới, Báo cáo chính trị tại Đại hội VIII (6–7/1996) đã bổ sung đặc trưng tổng quát về mục tiêu xây dựng chủ nghĩa xã hội ở Việt Nam là “Dân giàu, nước mạnh, xã hội công bằng, văn minh”. Ba phương án còn lại đều là các đặc trưng cụ thể đã được đề cập trước đó trong Cương lĩnh năm 1991 (Đại hội VII).","Theo dõi sự bổ sung chữ “dân chủ” để phân biệt các Đại hội: Đại hội VIII (1996) nêu “Dân giàu, nước mạnh, xã hội công bằng, văn minh”; Đại hội IX (2001) bổ sung thành “xã hội công bằng, dân chủ, văn minh”; còn Cương lĩnh 2011 (Đại hội XI) đưa “dân chủ” lên trước thành “Dân giàu, nước mạnh, dân chủ, công bằng, văn minh”."],[163,3,"Đại hội nào của Đảng được gọi là Đại hội “Trí tuệ - đổi mới, dân chủ - kỷ cương - đoàn kết”?",["Đại hội lần thứ V","Đại hội lần thứ VI","Đại hội lần thứ VIII","Đại hội lần thứ VII"],3,"Đại hội đại biểu toàn quốc lần thứ VII (6/1991) diễn ra khi hệ thống XHCN ở Đông Âu và Liên Xô lâm vào khủng hoảng sâu sắc; bằng việc thông qua Cương lĩnh 1991 và kiên định con đường đổi mới theo định hướng XHCN, Đại hội VII được gọi là Đại hội của “Trí tuệ – đổi mới, dân chủ – kỷ cương – đoàn kết”.","Gắn đúng khẩu hiệu/dấu ấn của từng Đại hội: Đại hội VI (1986) là Đại hội khởi xướng đường lối Đổi mới; Đại hội VII (1991) là Đại hội “Trí tuệ – đổi mới, dân chủ – kỷ cương – đoàn kết”; Đại hội VIII (1996) mở ra thời kỳ đẩy mạnh công nghiệp hóa, hiện đại hóa đất nước."],[164,3,"Ngày 14/7/1986, tại Hội nghị Ban chấp hành Trung ương đặc biệt ai được bầu làm Tổng Bí thư?",["Đỗ Mười","Nguyễn Văn Linh","Lê Khả Phiêu","Trường Chinh"],3,"Sau khi Tổng Bí thư Lê Duẩn qua đời (10/7/1986), ngày 14/7/1986 Ban Chấp hành Trung ương Đảng khóa V đã họp Hội nghị đặc biệt và bầu đồng chí Trường Chinh giữ chức Tổng Bí thư. Trên cương vị này, đồng chí Trường Chinh đã trực tiếp chỉ đạo quá trình đổi mới tư duy kinh tế, chuẩn bị dự thảo văn kiện mang tính bước ngoặt cho Đại hội VI.","Không nhầm với các Tổng Bí thư được bầu ở các Đại hội và Hội nghị sau đó: Nguyễn Văn Linh được bầu tại Đại hội VI (12/1986), Đỗ Mười được bầu tại Đại hội VII (6/1991), còn Lê Khả Phiêu được bầu tại Hội nghị Trung ương 4 khóa VIII (12/1997)."],[165,3,"Chủ trương đổi mới công tác kế hoạch hoá và cải tiến một cách cơ bản chính sách kinh tế để làm cho sản xuất “bung ra” được nêu lên ở Hội nghị nào của Ban chấp hành Trung ương Đảng khoá IV?",["Hội nghị lần thứ năm (12/1978)","Hội nghị lần thứ bảy (3/1980)","Hội nghị lần thứ bảy (9/1980)","Hội nghị lần thứ sáu (8/1979)"],3,"Hội nghị lần thứ sáu Ban Chấp hành Trung ương Đảng khóa IV (8/1979) được coi là bước đột phá đầu tiên trong quá trình đổi mới tư duy kinh tế của Đảng. Hội nghị chủ trương khắc phục những khuyết điểm trong quản lý kinh tế và cải tạo XHCN, đổi mới công tác kế hoạch hóa gắn với thị trường, cải tiến chính sách kinh tế để làm cho sản xuất “bung ra”.","Ghi nhớ trọn bộ 3 bước đột phá tư duy kinh tế trước Đại hội VI: đột phá thứ nhất là Hội nghị Trung ương 6 khóa IV (8/1979 – làm cho sản xuất “bung ra”); đột phá thứ hai là Hội nghị Trung ương 8 khóa V (6/1985 – xóa bỏ bao cấp, cải cách giá – lương – tiền); đột phá thứ ba là Hội nghị Bộ Chính trị khóa V (8/1986 – Kết luận 3 quan điểm kinh tế)."],[166,3,"Trong những thành tựu bước đầu của công cuộc đổi mới, thành tựu nào quan trọng nhất?",["Phát triển kinh tế đối ngoại","Kiềm chế được lạm phát","Từng bước đưa đất nước thoát khỏi khủng hoảng kinh tế - xã hội","Thực hiện được 3 chương trình kinh tế: lương thực, thực phẩm; hàng tiêu dùng; hàng xuất khẩu"],3,"Trong 5 năm đầu thực hiện đường lối đổi mới (1986–1990), thành tựu quan trọng nhất mang ý nghĩa nền tảng là thực hiện có hiệu quả ba chương trình kinh tế lớn: lương thực – thực phẩm, hàng tiêu dùng và hàng xuất khẩu. Nổi bật nhất là từ chỗ thiếu ăn triền miên, đến năm 1989 nước ta đã đáp ứng nhu cầu trong nước và bắt đầu xuất khẩu gạo, tạo tiền đề kiềm chế lạm phát và mở rộng đối ngoại.","Chú ý phạm vi thời gian trong câu hỏi: hỏi thành tựu quan trọng nhất trong “những thành tựu bước đầu” (1986–1990) chọn thực hiện 3 chương trình kinh tế lớn; còn kiềm chế lạm phát hay việc đưa đất nước ra khỏi khủng hoảng kinh tế – xã hội (khẳng định tại Đại hội VIII năm 1996) là kết quả tiếp nối."],[167,3,"Đại hội Đảng toàn quốc lần X đã tổng kết một số vấn đề về lý luận – thực tiễn của đất nước qua bao nhiêu năm đổi mới?",["5 năm","10 năm","15 năm","20 năm"],3,"Công cuộc đổi mới toàn diện đất nước bắt đầu từ Đại hội VI (12/1986), do đó đến Đại hội đại biểu toàn quốc lần thứ X (4/2006), Đảng đã tổng kết sâu sắc một số vấn đề lý luận – thực tiễn qua 20 năm đổi mới (1986–2006). Đại hội rút ra 5 bài học kinh nghiệm lớn và khẳng định nhận thức ngày càng rõ hơn về con đường đi lên CNXH ở Việt Nam.","Mẹo tính nhanh không bao giờ nhầm số năm tổng kết đổi mới: lấy năm họp Đại hội trừ đi 1986. Cụ thể: Đại hội VIII (1996) tổng kết 10 năm; Đại hội IX (2001) là 15 năm; Đại hội X (2006) là 20 năm; Đại hội XII (2016) là 30 năm; Đại hội XIII (2021) là 35 năm đổi mới."],[168,3,"Đại hội Đảng toàn quốc lần thứ IV (12/1976) có những quyết định quan trọng. Điều nào sau đây chưa phải là quyết định của Đại hội lần này?",["Đổi tên Đảng Lao động Việt Nam thành Đảng Cộng sản Việt Nam","Đề ra đường lối xây dựng CNXH trong cả nước","Quyết định phương hướng, nhiệm vụ, mục tiêu của kế hoạch nhà nước 5 năm (1976 - 1980)","Thực hiện đường lối đổi mới đất nước"],3,"Đại hội đại biểu toàn quốc lần thứ IV (12/1976) quyết định đổi tên Đảng Lao động Việt Nam thành Đảng Cộng sản Việt Nam, đề ra đường lối xây dựng CNXH trong cả nước và thông qua kế hoạch nhà nước 5 năm (1976–1980). Do đó, nội dung “Thực hiện đường lối đổi mới đất nước” chưa phải là quyết định của Đại hội IV mà phải đến 10 năm sau mới được khởi xướng tại Đại hội VI (12/1986).","Quy tắc loại trừ nhanh: bất kỳ phương án nào gắn với “đường lối đổi mới đất nước”, “kinh tế hàng hóa nhiều thành phần” hay “cơ chế thị trường” đều chỉ xuất hiện từ Đại hội VI (12/1986) trở đi, không thuộc Đại hội IV (1976) hay Đại hội V (1982)."],[169,3,"Đại hội đại biểu toàn quốc lần thứ VI của Đảng (12/1986) đã tạo ra bước ngoặt tư duy nào trong hoạt động của Đảng?",["Tiến hành cải cách, cải tổ toàn diện kinh tế, chính trị, xã hội","Nghiêm khắc chỉ ra những sai lầm trong nhận thức và chủ trương công nghiệp hóa trong mười năm từ 1945 đến 1954","Nhận thức và chủ trương công nghiệp hóa thời kỳ 1960-1985 là ưu tiên công nghiệp nặng","Nhìn thẳng vào sự thật, đánh giá đúng sự thật, nói rõ sự thật"],3,"Đại hội VI (12/1986) khởi xướng công cuộc đổi mới toàn diện với bước ngoặt tư duy cốt lõi là 'nhìn thẳng vào sự thật, đánh giá đúng sự thật, nói rõ sự thật', dũng cảm tự phê bình những sai lầm chủ quan, duy ý chí giai đoạn 1975–1986. Mốc 1945–1954 thuộc kháng chiến chống Pháp, ưu tiên công nghiệp nặng là tư duy cũ cần khắc phục, còn 'cải tổ toàn diện' không phải phương châm tư duy của Đảng.","Nếu đề hỏi Đại hội VI chỉ ra sai lầm trong nhận thức và chủ trương công nghiệp hóa của 10 năm nào thì chọn 1975–1985 (không phải 1945–1954); nếu hỏi trọng tâm đổi mới của Đại hội VI là lĩnh vực nào thì chọn đổi mới về kinh tế."],[170,3,"Trong quá trình đẩy mạnh công nghiệp hóa, hiện đại hóa gắn với phát triển kinh tế tri thức thời kỳ đổi mới. Có mấy định hướng phát triển các ngành và lĩnh vực kinh tế?",["4","5","7","6"],3,"Theo Giáo trình Lịch sử Đảng Cộng sản Việt Nam, trong quá trình đẩy mạnh công nghiệp hóa, hiện đại hóa gắn với phát triển kinh tế tri thức thời kỳ đổi mới, Đảng đề ra 6 định hướng phát triển các ngành và lĩnh vực kinh tế: công nghiệp – xây dựng, nông nghiệp – nông thôn, dịch vụ, kinh tế tri thức, kinh tế biển và phát triển vùng, liên kết vùng. Các con số 4, 5 hay 7 đều thiếu hoặc thừa so với phân loại chuẩn của giáo trình.","Nếu đề hỏi số quan điểm về công nghiệp hóa, hiện đại hóa tại Đại hội VIII (1996) thì cũng chọn 6 quan điểm; nếu hỏi số đặc trưng của xã hội xã hội chủ nghĩa trong Cương lĩnh năm 1991 là 6 đặc trưng, còn Cương lĩnh năm 2011 là 8 đặc trưng."],[171,3,"Ngoài văn kiện chính của một Đại hội Đảng, điểm mới nổi bật của Đại hội là đã thông qua mấy văn kiện quan trọng, cụ thể văn kiện đó là gì?",["Một văn kiện: Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội bổ sung và phát triển","Một văn kiện: Chiến lược, ổn định và phát triển kinh tế - xã hội đến năm 2020","Hai văn kiện: Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội; Chiến lược, ổn định và phát triển kinh tế - xã hội đến năm 2015","Hai văn kiện: Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội; Chiến lược, ổn định và phát triển kinh tế - xã hội đến năm 2000"],3,"Câu hỏi đề cập đến Đại hội đại biểu toàn quốc lần thứ VII (6/1991). Ngoài các văn kiện thường lệ, điểm mới nổi bật của Đại hội VII là thông qua hai văn kiện có tầm vóc chiến lược lâu dài: Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (Cương lĩnh 1991) và Chiến lược ổn định và phát triển kinh tế – xã hội đến năm 2000. Mốc đến năm 2015 không tồn tại, còn Cương lĩnh bổ sung và Chiến lược đến năm 2020 thuộc Đại hội XI.","Nếu đề hỏi Đại hội nào thông qua Cương lĩnh bổ sung, phát triển năm 2011 và Chiến lược phát triển kinh tế – xã hội đến năm 2020 thì chọn Đại hội XI (1/2011); nếu hỏi Chiến lược đến năm 2010 thì chọn Đại hội IX (4/2001)."],[172,3,"Đại hội IV của Đảng (12/1976) đưa ra chiến lược đẩy mạnh công nghiệp hóa xã hội chủ nghĩa, đã ưu tiên phát triển một cách hợp lý lĩnh vực nào?",["Nông nghiệp","Sản xuất nội địa và hàng xuất khẩu","Công nghiệp nhẹ","Công nghiệp nặng"],3,"Đường lối kinh tế do Đại hội IV (12/1976) vạch ra xác định đẩy mạnh công nghiệp hóa xã hội chủ nghĩa bằng cách ưu tiên phát triển công nghiệp nặng một cách hợp lý trên cơ sở phát triển nông nghiệp và công nghiệp nhẹ. Nông nghiệp và công nghiệp nhẹ đóng vai trò cơ sở, còn hàng xuất khẩu chỉ trở thành trọng tâm trong ba chương trình kinh tế lớn ở Đại hội VI (1986).","Nếu đề đổi sang Đại hội V (3/1982) hỏi chặng đường đầu tiên lấy lĩnh vực nào làm mặt trận hàng đầu thì chọn nông nghiệp; nếu hỏi Đại hội VI (1986) tập trung vào ba chương trình kinh tế lớn nào thì chọn lương thực – thực phẩm, hàng tiêu dùng và hàng xuất khẩu."],[173,3,"Đại hội lần thứ V của Đảng (3/1982) đã xác định trong chặng đường đầu tiên của thời kỳ quá độ ở nước ta phải lấy lĩnh vực nào làm mặt trận hàng đầu?",["Chăn nuôi, dệt may xuất khẩu","Thủ công mỹ nghệ xuất khẩu","Công nghiệp","Nông nghiệp"],3,"Trước khó khăn gay gắt về lương thực cuối những năm 1970, Đại hội V (3/1982) đã điều chỉnh nội dung công nghiệp hóa trong chặng đường đầu tiên, xác định tập trung sức phát triển mạnh nông nghiệp, coi nông nghiệp là mặt trận hàng đầu, kết hợp phát triển công nghiệp hàng tiêu dùng. Công nghiệp không còn đặt lên trên hết trong chặng đầu, còn chăn nuôi hay thủ công mỹ nghệ chỉ là bộ phận quá hẹp.","Hãy phân biệt rõ: Đại hội IV (12/1976) ưu tiên phát triển công nghiệp nặng một cách hợp lý; Đại hội V (3/1982) coi nông nghiệp là mặt trận hàng đầu trong chặng đường đầu tiên; Đại hội III (9/1960) coi công nghiệp hóa xã hội chủ nghĩa là nhiệm vụ trung tâm ở miền Bắc."],[174,3,"Khái niệm xây dựng Nhà nước pháp quyền xã hội chủ nghĩa lần đầu tiên đề cập ở Hội nghị trung ương nào?",["Hội nghị Trung ương 2 khóa VI","Hội nghị Trung ương 5 khóa VIII","Hội nghị Trung ương 5 khóa VI","Hội nghị Trung ương 2 khóa VII"],3,"Khái niệm xây dựng Nhà nước pháp quyền xã hội chủ nghĩa lần đầu tiên được Đảng đề cập tại Hội nghị Trung ương 2 khóa VII (11/1991) trong quá trình sửa đổi Hiến pháp 1980, sau đó tiếp tục được nhấn mạnh tại Hội nghị đại biểu toàn quốc giữa nhiệm kỳ khóa VII (1/1994). Hội nghị Trung ương 2 khóa VI bàn về phân phối – lưu thông, còn Hội nghị Trung ương 5 khóa VIII bàn về văn hóa.","Nếu đề hỏi Nghị quyết xây dựng nền văn hóa Việt Nam tiên tiến, đậm đà bản sắc dân tộc thì chọn Hội nghị Trung ương 5 khóa VIII (7/1998); nếu hỏi Hội nghị chuyên đề tiếp tục xây dựng và hoàn thiện Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam thì chọn Hội nghị Trung ương 8 khóa VII (1/1995)."],[175,3,"Chọn phương án đúng nhất điền vào chỗ trống. Các bước đột phá tháng ..........., tháng ........... và tháng ........... của Đại hội Đảng toàn quốc lần V đã phản ánh sự phát triển nhận thức của Đảng ta để hình thành đường lối đổi mới năm 1986.",["8/1978; 6/1984; 8/1986","8/1979; 9/1985; 3/1986","12/1979; 6/1985; 7/1986","8/1979; 6/1985; 8/1986"],3,"Quá trình tìm tòi đổi mới tư duy kinh tế của Đảng trước Đại hội VI diễn ra qua ba bước đột phá lớn: Hội nghị Trung ương 6 (8/1979) chủ trương làm cho sản xuất 'bung ra', Hội nghị Trung ương 8 (6/1985) quyết định xóa bỏ bao cấp qua giá – lương – tiền, và Hội nghị Bộ Chính trị (8/1986) kết luận ba vấn đề kinh tế lớn. Các tổ hợp tháng khác đều sai lệch mốc lịch sử của ba hội nghị bản lề này.","Lưu ý đề gốc ghi gộp 'của Đại hội lần V', nhưng chính xác theo giáo trình thì bước đột phá 8/1979 thuộc Hội nghị Trung ương 6 khóa IV, hai bước 6/1985 và 8/1986 thuộc khóa V; khi đi thi vẫn chọn đúng bộ mốc 8/1979; 6/1985; 8/1986."],[176,3,"Chỉ thị 100 CT/TW của ban Bí thư Trung ương Đảng (01/1981) đưa ra chủ trương nào?",["Phát huy quyền sản xuất kinh doanh của các xí nghiệp quốc doanh","Mở rộng hình thức trả lương khoán, lương sản phẩm","Cải tiến công tác phân phối lưu thông","Khoán sản phẩm đến nhóm và người lao động trong hợp tác xã nông nghiệp"],3,"Ngày 13/1/1981, Ban Bí thư Trung ương Đảng ban hành Chỉ thị số 100-CT/TW (Khoán 100) với chủ trương cải tiến công tác khoán, mở rộng 'khoán sản phẩm đến nhóm và người lao động trong hợp tác xã nông nghiệp', tạo động lực trực tiếp giúp sản lượng lương thực tăng mạnh giai đoạn 1981–1985. Ba phương án còn lại là nội dung của Quyết định 25-CP, 26-CP trong công nghiệp quốc doanh và Nghị quyết về phân phối lưu thông.","Nếu đề hỏi Quyết định 25-CP và 26-CP của Chính phủ (1/1981) thì chọn phát huy quyền chủ động sản xuất kinh doanh của xí nghiệp quốc doanh và mở rộng trả lương khoán, lương sản phẩm; nếu hỏi Nghị quyết 10 (4/1988) thì chọn giao quyền sử dụng ruộng đất lâu dài cho hộ nông dân."],[177,3,"Nêu một trong những thắng lợi vĩ đại của cách mạng Việt Nam trong giai đoạn 1930 đến 1945?",["Thắng lợi của cuộc cách mạng tháng Tám năm 1945, thành lập nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam","Thắng lợi của sự nghiệp đổi mới và từng bước đưa đất nước quá độ lên chủ nghĩa xã hội","Thắng lợi của cuộc kháng chiến oanh liệt để giải phóng dân tộc, bảo vệ Tổ quốc","Thắng lợi của cuộc Cách mạng tháng Tám năm 1945, thành lập nhà nước Việt Nam Dân chủ Cộng hòa"],3,"Trong ba thắng lợi vĩ đại của cách mạng Việt Nam dưới sự lãnh đạo của Đảng, thắng lợi giai đoạn 1930–1945 là Cách mạng tháng Tám năm 1945, thành lập nhà nước Việt Nam Dân chủ Cộng hòa (2/9/1945). Phương án ghi tên 'Cộng hòa xã hội chủ nghĩa Việt Nam' bị sai mốc lịch sử vì quốc hiệu này chỉ xuất hiện từ tháng 7/1976; hai thắng lợi còn lại thuộc thời kỳ kháng chiến sau 1945 và thời kỳ đổi mới từ 1986.","Cẩn thận bẫy quốc hiệu: mốc 1945 luôn đi với nhà nước Việt Nam Dân chủ Cộng hòa, còn từ Kỳ họp thứ nhất Quốc hội khóa VI (7/1976) mới là Cộng hòa xã hội chủ nghĩa Việt Nam. Nếu đề hỏi thắng lợi giai đoạn 1945–1975 thì chọn cuộc kháng chiến giải phóng dân tộc, bảo vệ Tổ quốc."],[178,3,"Nêu một trong những thắng lợi vĩ đại của cách mạng Việt Nam trong giai đoạn 1986 đến 2018?",["Thắng lợi của cuộc cách mạng tháng Tám năm 1945, thành lập nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam","Thắng lợi trong việc nắm vững ngọn cờ độc lập dân tộc và chủ nghĩa xã hội","Thắng lợi của cuộc kháng chiến oanh liệt để giải phóng dân tộc, bảo vệ Tổ quốc","Thắng lợi của sự nghiệp đổi mới và từng bước đưa đất nước quá độ lên chủ nghĩa xã hội"],3,"Tổng kết lịch sử Đảng từ 1930 đến 2018 khái quát ba thắng lợi vĩ đại, trong đó thành tựu tiêu biểu giai đoạn 1986–2018 là thắng lợi của sự nghiệp đổi mới và từng bước đưa đất nước quá độ lên chủ nghĩa xã hội, mở đầu từ Đại hội VI (12/1986). 'Nắm vững ngọn cờ độc lập dân tộc và chủ nghĩa xã hội' là bài học kinh nghiệm hàng đầu chứ không phải tên một thắng lợi; hai phương án kia thuộc giai đoạn trước 1975.","Cần phân biệt rạch ròi giữa 'thắng lợi vĩ đại' (3 thắng lợi theo 3 thời kỳ: 1930–1945, 1945–1975, từ 1986 đến nay) với 'bài học lớn' (như nắm vững ngọn cờ độc lập dân tộc và chủ nghĩa xã hội; sự nghiệp cách mạng là của nhân dân)."],[179,3,"Đại hội Đảng toàn quốc lần IX của Đảng Cộng sản Việt Nam họp trong khoảng thời gian nào?",["Từ 14 đến 19/7/2001","Từ 12 đến 17/6/2001","Từ 01 đến 8/4/2001","Từ 19 đến 22/4/2001"],3,"Đại hội đại biểu toàn quốc lần thứ IX của Đảng Cộng sản Việt Nam họp tại Hà Nội từ ngày 19 đến ngày 22/4/2001. Đây là Đại hội mở đầu thế kỷ XXI, thông qua Chiến lược phát triển kinh tế – xã hội 2001–2010 và xác định mô hình kinh tế thị trường định hướng xã hội chủ nghĩa. Các mốc tháng 6, tháng 7 hay đầu tháng 4 năm 2001 đều không chính xác.","Ghi nhớ nhanh thời gian các Đại hội giai đoạn đổi mới: Đại hội VIII (28/6–1/7/1996), Đại hội IX (19–22/4/2001), Đại hội X (18–25/4/2006), Đại hội XI (12–19/1/2011) và Đại hội XII (20–28/1/2016)."],[180,3,"Từ sau 30/4/1975, để bảo vệ an toàn lãnh thổ của Tổ quốc, Việt Nam phải đối đầu trực tiếp với những lực lượng nào?",["Quân xâm lược Mỹ","Tập đoàn Pôn Pốt (Cam-pu-chia)","Cuộc tiến công biên giới phía Bắc của quân Trung Quốc","Tập đoàn Pôn Pốt và cuộc tiến công biên giới phía Bắc của quân Trung Quốc"],3,"Ngay sau ngày thống nhất 30/4/1975, Việt Nam phải tiến hành hai cuộc chiến tranh bảo vệ Tổ quốc ở hai đầu biên giới: đánh trả tập đoàn phản động Pôn Pốt xâm lược biên giới Tây Nam (1975–1979) và chống cuộc tiến công quy mô lớn của quân Trung Quốc ở biên giới phía Bắc (từ 17/2/1979). Nêu riêng từng lực lượng là thiếu đầy đủ, còn quân Mỹ đã thất bại hoàn toàn vào năm 1975.","Nếu đề hỏi ngày quân tình nguyện Việt Nam cùng nhân dân Campuchia giải phóng Phnôm Pênh, đánh đổ chế độ Pôn Pốt thì chọn 7/1/1979; nếu hỏi ngày mở đầu cuộc chiến đấu bảo vệ biên giới phía Bắc thì chọn 17/2/1979."],[181,3,"Đại hội Đảng toàn quốc lần thứ mấy đã tổng kết 30 năm thực hiện đường lối đổi mới?",["Chưa có Đại hội nào tổng kết 30 năm đổi mới","Đại hội X","Đại hội XI","Đại hội XII"],3,"Công cuộc đổi mới bắt đầu từ Đại hội VI (12/1986), nên đến Đại hội đại biểu toàn quốc lần thứ XII (1/2016) vừa tròn 30 năm thực hiện đường lối đổi mới (1986–2016). Đại hội XII đã tổng kết sâu sắc 30 năm đổi mới và rút ra 5 bài học kinh nghiệm lớn. Đại hội X (2006) tổng kết 20 năm đổi mới, còn Đại hội XI (2011) tổng kết 20 năm thực hiện Cương lĩnh 1991.","Dùng công thức tính từ mốc 1986: tổng kết 10 năm đổi mới chọn Đại hội VIII (1996), 20 năm chọn Đại hội X (2006), 30 năm chọn Đại hội XII (2016), 35 năm chọn Đại hội XIII (2021); còn tổng kết 20 năm thực hiện Cương lĩnh 1991 chọn Đại hội XI (2011)."],[182,3,"Đại hội Đảng toàn quốc lần thứ VI (12/1986) đã xác định rõ quan điểm đổi mới của Đảng Cộng sản Việt Nam là đổi mới toàn diện và đồng bộ, nhưng trọng tâm là gì?",["Đổi mới về chính trị","Đổi mới về kinh tế và chính trị","Đổi mới về văn hóa","Đổi mới về kinh tế"],3,"Đại hội VI (12/1986) xác định quan điểm đổi mới toàn diện và đồng bộ trên mọi lĩnh vực của đời sống xã hội, nhưng lấy đổi mới kinh tế làm trọng tâm, đồng thời từng bước đổi mới chính trị một cách vững chắc. Ưu tiên tháo gỡ cơ chế kinh tế giúp ổn định đời sống nhân dân, tạo tiền đề vật chất để đổi mới chính trị an toàn, tránh rơi vào mất ổn định như mô hình cải tổ chính trị trước ở Liên Xô.","Phân biệt vai trò các lĩnh vực trong đường lối đổi mới: phát triển kinh tế là nhiệm vụ trung tâm/trọng tâm, xây dựng Đảng là nhiệm vụ then chốt, còn phát triển văn hóa là nền tảng tinh thần của xã hội."],[183,3,"Chủ trương về đổi mới cơ chế quản lý kinh tế tại Đại hội Đảng lần thứ VI là gì?",["Ưu tiên phát triển công nghiệp nặng trên cơ sở phát triển nông nghiệp và công nghiệp nhẹ","Thực hiện công nghiệp hóa và hiện đại hóa đất nước","Phát triển nền kinh tế theo cơ chế thị trường","Phát triển kinh tế hàng hóa nhiều thành phần, vận động theo cơ chế thị trường có sự quản lý của Nhà nước"],3,"Điểm đột phá cơ bản về cơ chế quản lý kinh tế tại Đại hội VI (12/1986) là xóa bỏ cơ chế tập trung quan liêu, bao cấp, chuyển sang phát triển kinh tế hàng hóa nhiều thành phần, vận động theo cơ chế thị trường có sự quản lý của Nhà nước. Phương án chỉ nêu cơ chế thị trường là thiếu vai trò quản lý của Nhà nước; ưu tiên công nghiệp nặng thuộc Đại hội IV, còn công nghiệp hóa, hiện đại hóa gắn mạnh từ Đại hội VIII.","Chú ý sự phát triển thuật ngữ qua các Đại hội: Đại hội VI–VIII gọi là kinh tế hàng hóa nhiều thành phần vận hành theo cơ chế thị trường có sự quản lý của Nhà nước; đến Đại hội IX (4/2001) mới chính thức gọi là nền kinh tế thị trường định hướng xã hội chủ nghĩa."],[184,3,"Mục tiêu của 3 chương trình kinh tế của kế hoạch 5 năm (1986-1990): lương thực - thực phẩm, hàng tiêu dùng và hàng xuất khẩu, được đề ra trong Đại hội nào?",["Đại hội Đảng IV (12/1976)","Đại hội Đảng V (3/1981)","Đại hội Đảng VII (6/1991)","Đại hội Đảng VI (12/1986)"],3,"Để giải quyết khủng hoảng kinh tế – xã hội và cụ thể hóa nội dung công nghiệp hóa trong chặng đường đầu tiên, Đại hội VI (12/1986) đã quyết định tập trung thực hiện ba chương trình kinh tế lớn trong kế hoạch 5 năm 1986–1990 gồm: lương thực – thực phẩm, hàng tiêu dùng và hàng xuất khẩu. Khung thời gian kế hoạch 1986–1990 cũng gắn trực tiếp với nhiệm kỳ Đại hội VI.","Lưu ý phương án nhiễu ghi 'Đại hội V (3/1981)' thực tế Đại hội V họp tháng 3/1982 gắn với kế hoạch 1981–1985; nếu đề hỏi kế hoạch 5 năm 1976–1980 chọn Đại hội IV (12/1976), còn kế hoạch 1991–1995 chọn Đại hội VII (6/1991)."],[185,3,"Mục tiêu đề ra là tăng trưởng kinh tế nhanh, hiệu quả và bền vững đi đôi với giải quyết những vấn đề bức xúc xã hội, đảm bảo quốc phòng an ninh; cải thiện đời sống nhân dân; nâng cao tích lũy từ nội bộ nền kinh tế. Đó là mục tiêu của kế hoạch 5 năm nào?",["Kế hoạch 5 năm (1981-1985)","Kế hoạch 5 năm (1986-1990)","Kế hoạch 5 năm (1991-1995)","Kế hoạch 5 năm (1996-2000)"],3,"Đây là mục tiêu tổng quát của Kế hoạch 5 năm 1996–2000 được Đại hội VIII (1996) đề ra sau khi đất nước đã thoát khỏi khủng hoảng kinh tế – xã hội. Giai đoạn này chuyển sang yêu cầu tăng trưởng kinh tế nhanh, hiệu quả, bền vững và nâng cao tích lũy từ nội bộ nền kinh tế để đẩy mạnh công nghiệp hóa, hiện đại hóa. Các kế hoạch từ 1981 đến 1995 chủ yếu nhằm ổn định tình hình, kiềm chế lạm phát và ra khỏi khủng hoảng.","Nếu đề hỏi kế hoạch 5 năm thực hiện ba chương trình kinh tế lớn thì chọn 1986–1990; nếu hỏi kế hoạch 5 năm vượt qua khó khăn thử thách, ổn định và phát triển kinh tế – xã hội, đẩy lùi lạm phát sau Cương lĩnh 1991 thì chọn 1991–1995."],[186,3,"Sau Đại thắng mùa Xuân 1975, nhiệm vụ quan trọng cấp thiết hàng đầu của cả nước ta là gì?",["Khắc phục hậu quả chiến tranh và phát triển kinh tế","Ổn định tình hình chính trị - xã hội ở 2 miền Nam - Bắc","Mở rộng quan hệ giao lưu với các nước","Thống nhất nước nhà về mặt Nhà nước"],3,"Sau Đại thắng mùa Xuân 1975, đất nước thống nhất về lãnh thổ nhưng hai miền vẫn tồn tại hai bộ máy chính quyền khác nhau (Chính phủ Việt Nam Dân chủ Cộng hòa ở miền Bắc và Chính phủ Cách mạng lâm thời ở miền Nam). Vì vậy, Hội nghị Trung ương 24 khóa III (8/1975) xác định nhiệm vụ quan trọng cấp thiết hàng đầu là thống nhất nước nhà về mặt Nhà nước, tạo nền tảng pháp lý để khôi phục kinh tế và xây dựng chủ nghĩa xã hội.","Nếu đề hỏi sự kiện hoàn thành thống nhất nước nhà về mặt Nhà nước thì chọn Kỳ họp thứ nhất Quốc hội khóa VI (24/6–3/7/1976); nếu hỏi Hội nghị Hiệp thương chính trị thống nhất hai miền họp ở đâu thì chọn Sài Gòn (11/1975)."],[187,3,"Khó khăn cơ bản nhất của đất nước sau 1975 là gì?",["Số người mù chữ, số người thất nghiệp chiếm tỷ lệ cao","Bọn phản động trong nước vẫn còn","Nền kinh tế nông nghiệp vẫn còn lạc hậu","Hậu quả của chiến tranh và chủ nghĩa thực dân mới của Mỹ để lại rất nặng nề"],3,"Sau 30 năm chiến tranh giải phóng dân tộc, khó khăn bao trùm và cơ bản nhất của nước ta từ sau 1975 là hậu quả cực kỳ nặng nề của chiến tranh tàn phá cùng di sản của chủ nghĩa thực dân mới kiểu Mỹ để lại ở miền Nam (kinh tế lệ thuộc, hạ tầng kiệt quệ, tệ nạn và hàng triệu người thất nghiệp). Tỷ lệ mù chữ, thất nghiệp cao hay bọn phản động chỉ là các hệ quả cụ thể nằm trong khó khăn tổng thể này.","Tránh nhầm với khó khăn sau Cách mạng tháng Tám 1945 ('ngàn cân treo sợi tóc': giặc đói, giặc dốt, giặc ngoại xâm). Nếu đề hỏi khó khăn từ bên ngoài vào cuối thập niên 1970 thì chú ý chiến tranh hai đầu biên giới và chính sách bao vây cấm vận."],[188,3,"Đại hội lần thứ mấy của Đảng đã đề ra bốn mục tiêu cơ bản của thời kỳ quá độ: xây dựng chế độ làm chủ của nhân dân dưới chủ nghĩa xã hội; xây dựng nền sản xuất lớn xã hội chủ nghĩa; xây dựng nền văn hoá mới xã hội chủ nghĩa và xây dựng con người mới xã hội chủ nghĩa?",["Đại hội III (9/1960)","Đại hội VI (12/1986)","Đại hội V (3/1981)","Đại hội IV (12/1976)"],3,"Đại hội đại biểu toàn quốc lần thứ IV của Đảng (12/1976) đã vạch ra đường lối chung xây dựng chủ nghĩa xã hội trên phạm vi cả nước, nổi bật với bốn mục tiêu cơ bản: xây dựng chế độ làm chủ tập thể xã hội chủ nghĩa, nền sản xuất lớn xã hội chủ nghĩa, nền văn hóa mới và con người mới xã hội chủ nghĩa. Đại hội III mới chỉ xây dựng chủ nghĩa xã hội ở miền Bắc, còn Đại hội V và VI tập trung điều chỉnh chặng đầu và đổi mới.","Cứ gặp bộ từ khóa 'chế độ làm chủ tập thể xã hội chủ nghĩa', 'nền sản xuất lớn xã hội chủ nghĩa' hay 'ba cuộc cách mạng' thì chọn ngay Đại hội IV (12/1976). (Ghi chú nhỏ: phương án nhiễu in Đại hội V là 3/1981, thực tế Đại hội V họp 3/1982)."],[189,3,"Tháng 8/1975, Hội nghị Ban Chấp hành Trung ương Đảng lần thứ 24 khóa III đã chủ trương gì?",["Cải tạo xã hội chủ nghĩa","Bầu cử Quốc hội thống nhất","Bầu Ban Dự thảo Hiến pháp","Hoàn thành thống nhất nước nhà"],3,"Tháng 8/1975, Hội nghị Ban Chấp hành Trung ương Đảng lần thứ 24 khóa III họp tại Đà Lạt đã phân tích cục diện sau giải phóng miền Nam và đề ra chủ trương chiến lược: 'Hoàn thành thống nhất nước nhà, đưa cả nước tiến nhanh, tiến mạnh, tiến vững chắc lên chủ nghĩa xã hội'. Các công việc như bầu Quốc hội thống nhất hay bầu Ban Dự thảo Hiến pháp là những bước triển khai cụ thể hóa vào năm 1976.","Nếu đề hỏi văn bản chỉ đạo trực tiếp cuộc Tổng tuyển cử bầu Quốc hội chung trong cả nước thì chọn Chỉ thị 228-CT/TW (3/1/1976); nếu hỏi ngày diễn ra Tổng tuyển cử thống nhất đất nước thì chọn 25/4/1976."],[190,3,"Hội nghị nào của Ban chấp hành Trung ương Đảng khoá V quyết định phải dứt khoát xoá bỏ cơ chế tập trung quan liêu bao cấp, thực hiện hạch toán kinh doanh xã hội chủ nghĩa?",["Hội nghị lần thứ chín (12/1985)","Hội nghị lần thứ mười (5/1986)","Hội nghị Bộ Chính trị (4/1988)","Hội nghị lần thứ tám (6/1985)"],3,"Hội nghị Trung ương 8 khóa V (6/1985) đánh dấu bước đột phá thứ hai trong đổi mới tư duy kinh tế của Đảng khi quyết định dứt khoát xóa bỏ cơ chế tập trung quan liêu, bao cấp, thực hiện cơ chế một giá, xóa bỏ cung cấp hiện vật và chuyển sang hạch toán kinh doanh xã hội chủ nghĩa. Các hội nghị sau đó xử lý những vướng mắc trong quá trình thực hiện giá – lương – tiền, còn Bộ Chính trị tháng 4/1988 ban hành Khoán 10.","Nhớ đúng 3 mốc đột phá trước Đại hội VI: Trung ương 6 khóa IV (8/1979 – sản xuất 'bung ra'), Trung ương 8 khóa V (6/1985 – xóa bỏ bao cấp, giá – lương – tiền), Bộ Chính trị khóa V (8/1986 – ba vấn đề kinh tế lớn); còn Bộ Chính trị 4/1988 là Nghị quyết 10 về nông nghiệp."],[191,3,"Nhằm mục tiêu đảm bảo nhu cầu lương thực, hàng thiết yếu của xã hội, tạo được một số mặt hàng xuất khẩu chủ lực, Đảng ta đã đề ra ba chương trình mục tiêu về lương thực, thực phẩm, hàng tiêu dùng và hàng xuất khẩu. Ba chương trình mục tiêu này được đề ra tại Đại hội khóa mấy của Đảng?",["Đại hội lần thứ IV (12/1976)","Đại hội lần thứ V (3/1981)","Đại hội lần thứ VII (6/1991)","Đại hội lần thứ VI (12/1986)"],3,"Tại Đại hội VI (12/1986), nhằm ổn định tình hình kinh tế – xã hội, đảm bảo nhu cầu lương thực, hàng thiết yếu và tạo nguồn hàng xuất khẩu chủ lực, Đảng đã đề ra ba chương trình kinh tế mục tiêu lớn: lương thực – thực phẩm, hàng tiêu dùng và hàng xuất khẩu. Đây là sự bố trí lại cơ cấu sản xuất phù hợp thực tiễn, khắc phục chủ trương đầu tư dàn trải trước đó của Đại hội IV và V.","Bất kể đề diễn giải dài hay ngắn, cứ thấy cụm 'ba chương trình kinh tế lớn / mục tiêu' gồm lương thực – thực phẩm, hàng tiêu dùng và hàng xuất khẩu thì chọn ngay Đại hội VI (12/1986); còn nếu hỏi Đại hội đổi tên Đảng thành Đảng Cộng sản Việt Nam thì chọn Đại hội IV (12/1976)."],[192,3,"Nguyên nhân cơ bản nhất dẫn đến khủng hoảng kinh tế - xã hội trong giai đoạn 1979 - 1989 ở nước ta là gì?",["Cơ sở vật chất kỹ thuật còn quá kém","Thiên tai","Viện trợ từ nước ngoài giảm","Duy trì cơ chế kinh tế kế hoạch hóa, tập trung, quan liêu, bao cấp"],3,"Đại hội VI (12/1986) phân tích thẳng thắn rằng bên cạnh khó khăn khách quan (cơ sở vật chất thấp kém, thiên tai, viện trợ giảm, chiến tranh và cấm vận), nguyên nhân chủ quan và cơ bản nhất dẫn đến khủng hoảng kinh tế – xã hội kéo dài giai đoạn 1979–1989 là duy trì quá lâu cơ chế kinh tế kế hoạch hóa, tập trung, quan liêu, bao cấp. Cơ chế này kìm hãm động lực sản xuất và gây ách tắc phân phối, lưu thông.","Nếu đề hỏi các yếu tố 'khách quan' làm trầm trọng thêm khó khăn sau 1975 thì mới xét thiên tai, cơ sở vật chất kém hay viện trợ giảm; còn khi đề hỏi nguyên nhân 'cơ bản nhất / chủ quan' của khủng hoảng kinh tế – xã hội thì luôn chọn duy trì cơ chế tập trung, quan liêu, bao cấp."],[193,3,"Nội dung nào dưới đây là đổi mới quan trọng nhất trong các chủ trương, chính sách của Đại hội Đảng lần thứ VI (1986)?",["Xây dựng bộ máy nhà nước tinh gọn, có hiệu lực","Thực hiện ba chương trình kinh tế lớn: Lương thực – thực phẩm; Hàng tiêu dùng; Hàng xuất khẩu","Xây dựng và tổ chức thực hiện một cách thiết thực và có hiệu quả các chính sách xã hội","Kiên quyết xóa bỏ cơ chế kinh tế kế hoạch hóa, tập trung, quan liêu, bao cấp"],3,"Trong đường lối đổi mới toàn diện của Đại hội VI (12/1986), đổi mới kinh tế là trọng tâm và bước ngoặt quan trọng nhất chính là kiên quyết xóa bỏ cơ chế kinh tế kế hoạch hóa, tập trung, quan liêu, bao cấp để chuyển sang cơ chế hạch toán kinh doanh xã hội chủ nghĩa và kinh tế hàng hóa nhiều thành phần. Ba chương trình kinh tế lớn, chính sách xã hội hay tinh gọn bộ máy chỉ phát huy hiệu quả khi cơ chế quản lý cũ được tháo gỡ.","Phân biệt ba tầng nội dung của Đại hội VI: trọng tâm đổi mới là kinh tế; nội dung đổi mới quan trọng nhất là xóa bỏ cơ chế tập trung quan liêu, bao cấp; còn mục tiêu sản xuất trực tiếp là ba chương trình kinh tế lớn."],[194,3,"Nội dung nào dưới đây không thuộc về những đổi mới chủ trương chính sách của Đại hội Đảng lần thứ VI (1986)?",["Kiên quyết xóa bỏ cơ chế kinh tế kế hoạch hóa, tập trung, quan liêu, bao cấp","Thực hiện ba chương trình kinh tế lớn: Lương thực – thực phẩm; Hàng tiêu dùng; Hàng xuất khẩu","Xây dựng và tổ chức thực hiện một cách thiết thực và có hiệu quả các chính sách xã hội","Chính sách đối ngoại chủ yếu dựa vào Liên Xô và các nước xã hội chủ nghĩa"],3,"Chính sách đối ngoại 'chủ yếu dựa vào Liên Xô và các nước xã hội chủ nghĩa' là đặc trưng của giai đoạn trước đổi mới chứ không phải nội dung đổi mới của Đại hội VI (12/1986). Đại hội VI chủ trương kết hợp sức mạnh dân tộc với sức mạnh thời đại, mở rộng hợp tác kinh tế đối ngoại, từng bước phá thế bị bao vây, cô lập. Ba phương án còn lại về xóa bỏ bao cấp, ba chương trình kinh tế lớn và chính sách xã hội đều thuộc đường lối Đại hội VI.","Chú ý từ phủ định 'không thuộc'! Nếu đề hỏi phương châm đối ngoại 'Việt Nam muốn là bạn với tất cả các nước' thì chọn Đại hội VII (6/1991); nếu hỏi 'sẵn sàng là bạn, là đối tác tin cậy' thì chọn Đại hội IX (4/2001)."],[195,3,"Kỳ họp thứ nhất của Quốc hội nước Việt Nam thống nhất (Quốc hội khoá VI) được tổ chức trong thời gian nào?",["Từ 24/7 - 3/8/1976","Từ 24/9 - 3/10/1976","Từ 20/9 - 1/10/1976","Từ 24/6 - 3/7/1976"],3,"Sau cuộc Tổng tuyển cử thống nhất toàn quốc ngày 25/4/1976, Kỳ họp thứ nhất Quốc hội khóa VI đã diễn ra tại Hà Nội từ ngày 24/6 đến ngày 3/7/1976. Kỳ họp quyết định đặt quốc hiệu là Cộng hòa xã hội chủ nghĩa Việt Nam, thông qua Quốc kỳ, Quốc huy, Quốc ca, đổi tên Sài Gòn – Gia Định thành Thành phố Hồ Chí Minh và bầu bộ máy lãnh đạo Nhà nước thống nhất. Các khoảng thời gian tháng 7–8 hay 9–10/1976 đều sai mốc.","Học trọn chuỗi 4 mốc thống nhất đất nước 1975–1976: Hội nghị Trung ương 24 khóa III (8/1975) -> Hội nghị Hiệp thương chính trị tại Sài Gòn (15–21/11/1975) -> Tổng tuyển cử cả nước (25/4/1976) -> Kỳ họp thứ nhất Quốc hội khóa VI (24/6–3/7/1976)."],[196,3,"Bộ Chính trị đã ra Chỉ thị số 228-CT/TW về việc lãnh đạo tổng tuyển cử trong cả nước vào thời gian nào?",["30/12/1975","2/1/1976","30/1/1976","3/1/1976"],3,"Triển khai kết quả Hội nghị Hiệp thương chính trị thống nhất Tổ quốc (11/1975), ngày 3/1/1976 Bộ Chính trị đã ban hành Chỉ thị số 228-CT/TW về việc lãnh đạo cuộc Tổng tuyển cử bầu Quốc hội chung trong cả nước. Văn bản chỉ đạo cụ thể công tác tuyên truyền, hiệp thương nhân sự và bảo đảm bầu cử dân chủ, đưa tới thắng lợi của ngày bầu cử 25/4/1976. Các mốc ngày 30/12/1975, 2/1/1976 hay 30/1/1976 đều là số nhiễu.","Đừng nhầm ngày ra Chỉ thị 228-CT/TW (3/1/1976) với ngày Tổng tuyển cử đầu tiên bầu Quốc hội khóa I nước Việt Nam Dân chủ Cộng hòa (6/1/1946) và ngày Tổng tuyển cử bầu Quốc hội thống nhất khóa VI (25/4/1976)."],[197,3,"Đại hội Đảng lần thứ IX (4/2001) là Đại hội có chủ đề gì?",["Nhìn thẳng vào sự thật, nói rõ sự thật, đánh giá đúng sự thật","Trí tuệ-đổi mới, dân chủ-kỷ cương-đoàn kết","Nâng cao năng lực lãnh đạo và sức chiến đấu của Đảng","Trí tuệ, Dân chủ, Đoàn kết, Đổi mới"],3,"Đại hội đại biểu toàn quốc lần thứ IX của Đảng (4/2001) được xác định là Đại hội của 'Trí tuệ, Dân chủ, Đoàn kết, Đổi mới', mở đầu thế kỷ XXI với quyết tâm đẩy mạnh công nghiệp hóa, hiện đại hóa. Các cụm từ khác gắn với những kỳ Đại hội khác: 'Nhìn thẳng vào sự thật...' là phương châm Đại hội VI, 'Trí tuệ – đổi mới, dân chủ – kỷ cương – đoàn kết' là Đại hội VII, còn 'Nâng cao năng lực lãnh đạo...' là mở đầu chủ đề Đại hội X.","Cẩn thận phân biệt hai phương án rất giống nhau: Đại hội VII (1991) có thêm từ 'kỷ cương' ('Trí tuệ – đổi mới, dân chủ – kỷ cương – đoàn kết'), còn Đại hội IX (2001) ngắn gọn với 4 từ 'Trí tuệ, Dân chủ, Đoàn kết, Đổi mới'."],[198,3,"Đại hội Đảng lần thứ IX (4/2001) xác định quan điểm phát triển nhanh và bền vững, theo đó tăng trưởng kinh tế phải đi đôi với vấn đề gì?",["Chính sách xã hội","Phát triển kinh tế tri thức","Tăng cường sự quản lý của Nhà nước","Thực hiện tiến bộ, công bằng xã hội và bảo vệ môi trường"],3,"Trong Chiến lược phát triển kinh tế – xã hội 2001–2010 tại Đại hội IX (4/2001), Đảng xác định quan điểm phát triển nhanh, hiệu quả và bền vững: tăng trưởng kinh tế phải đi đôi với thực hiện tiến bộ, công bằng xã hội và bảo vệ môi trường. Ba phương án kia chỉ nêu riêng lẻ chính sách xã hội, kinh tế tri thức hoặc quản lý Nhà nước nên không phản ánh đủ ba trụ cột của phát triển bền vững (kinh tế – xã hội – môi trường).","Mỗi khi đề nhắc quan điểm 'phát triển bền vững' từ Đại hội IX trở đi, hãy tìm đủ cặp 'tiến bộ, công bằng xã hội và bảo vệ môi trường'; còn nếu đề hỏi Đại hội nào nhấn mạnh đẩy mạnh công nghiệp hóa, hiện đại hóa gắn với phát triển kinh tế tri thức thì chú ý Đại hội X (4/2006)."],[199,3,"Hạn chế, yếu kém nào sau đây chứng tỏ cơ chế quản lý kinh tế cũ vẫn chưa bị xóa bỏ hoàn toàn?",["Doanh nghiệp nhà nước hoạt động kém hiệu quả, chưa thể hiện đúng vai trò nòng cốt của nền kinh tế","Hiệu lực, hiệu quả quản lý nhà nước chưa cao, thể chế kinh tế còn chưa hoàn bị","Trình độ phát triển của các loại thị trường còn thấp, vận hành chưa đồng bộ","Vẫn còn tình trạng bao cấp, xin – cho trong một số lĩnh vực kinh tế"],3,"Đặc trưng cốt lõi của cơ chế quản lý kinh tế kế hoạch hóa tập trung trước đổi mới là tính quan liêu, bao cấp và mệnh lệnh hành chính. Do đó, việc 'vẫn còn tình trạng bao cấp, xin – cho trong một số lĩnh vực kinh tế' là minh chứng trực tiếp nhất cho thấy tàn dư cơ chế cũ chưa bị xóa bỏ hoàn toàn. Các hạn chế về doanh nghiệp nhà nước, hiệu lực quản lý hay sự đồng bộ thị trường phản ánh quá trình hoàn thiện thể chế thị trường còn chậm.","Gặp câu hỏi về biểu hiện 'cơ chế quản lý cũ chưa xóa bỏ hoàn toàn' thì bắt ngay cặp từ khóa 'bao cấp, xin – cho'; còn nếu đề hỏi hạn chế của hệ thống thị trường thì mới chọn trình độ các loại thị trường còn thấp, vận hành chưa đồng bộ."],[200,3,"Trong bước đột phá thứ ba về đổi mới kinh tế tại Hội nghị Bộ Chính trị khóa V (8/1986). Về cơ chế quản lý kinh tế, Hội nghị cho rằng “chúng ta đã chủ quan, nóng vội đề ra một số chủ trương quá lớn về quy mô, quá cao về nhịp độ xây dựng và phát triển sản xuất”. Đây là nguyên nhân trực tiếp của tình trạng nào?",["dẫm chân tại chỗ","chi phí sản xuất không ngừng tăng lên","lạm phát","chậm giải quyết căn bản các vấn đề về lương thực, thực phẩm, hàng tiêu dùng và tạo nguồn hàng cho xuất khẩu"],3,"Tại Hội nghị Bộ Chính trị khóa V (8/1986) – bước đột phá thứ ba về đổi mới tư duy kinh tế – Đảng thẳng thắn nhận định việc chủ quan, nóng vội đề ra quy mô xây dựng quá lớn, nhịp độ quá cao đã làm phân tán nguồn lực, trở thành nguyên nhân trực tiếp khiến ta chậm giải quyết căn bản vấn đề lương thực, thực phẩm, hàng tiêu dùng và tạo nguồn hàng xuất khẩu. Từ đó, Đại hội VI đã chuyển hướng sang ba chương trình kinh tế lớn.","Lưu ý nhỏ: theo giáo trình chuẩn, nhận định này nằm ở phần điều chỉnh cơ cấu sản xuất trong Kết luận Hội nghị Bộ Chính trị 8/1986 (đề gốc gắn vào cơ chế quản lý), nhưng mối liên hệ nhân – quả với lương thực – thực phẩm, hàng tiêu dùng và hàng xuất khẩu là dấu hiệu nhận diện chắc chắn nhất."],[201,3,"“Các dân tộc trong nước bình đẳng, đoàn kết và giúp đỡ lẫn nhau cùng tiến bộ” là một trong những đặc trưng xây dựng xã hội xã hội chủ nghĩa mà nhân dân ta xây dựng. Đặc trưng trên được trình bày tại Đại hội đại biểu toàn quốc lần thứ mấy?",["Đại hội Đảng IV (12/1976)","Đại hội Đảng V (3/1981)","Đại hội Đảng VI (12/1986)","Đại hội Đảng VII (6/1991)"],3,"Tại Đại hội VII (6/1991), Đảng thông qua Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội với 6 đặc trưng cơ bản, trong đó đặc trưng thứ năm nêu rõ: 'Các dân tộc trong nước bình đẳng, đoàn kết và giúp đỡ lẫn nhau cùng tiến bộ'. Các Đại hội IV, V và VI chưa thông qua Cương lĩnh mới nên chưa xây dựng hệ thống các đặc trưng này.","Cẩn thận nếu đề đổi cách diễn đạt thành 'Các dân tộc trong cộng đồng Việt Nam bình đẳng, đoàn kết, tôn trọng và giúp nhau cùng phát triển' (có thêm chữ 'tôn trọng', đổi 'tiến bộ' thành 'phát triển') thì phải chọn Đại hội XI (1/2011) với Cương lĩnh bổ sung năm 2011."],[202,3,"Nhìn lại chặng đường 10 năm đổi mới (1986-1996), Đại hội Đại biểu toàn quốc lần thứ VIII của Đảng nhận định như thế nào về tình hình đất nước ta?",["Nước ta đã có nền kinh tế phát triển","Nước ta đã thoát khỏi nghèo đói, có dự trữ và bước đầu có xuất khẩu","Nước ta đã chuyển sang nền kinh tế thị trường","Nước ta đã thoát ra khỏi khủng hoảng kinh tế - xã hội"],3,"Tổng kết 10 năm thực hiện đường lối đổi mới (1986–1996), trước thành tựu tăng trưởng kinh tế cao và kiềm chế được lạm phát, Đại hội VIII (6–7/1996) đưa ra đánh giá tổng quát có ý nghĩa bước ngoặt: 'Nước ta đã ra khỏi khủng hoảng kinh tế – xã hội, nhưng một số mặt còn chưa vững chắc'. Nước ta lúc đó vẫn đang phát triển ở mức thu nhập thấp nên chưa có nền kinh tế phát triển.","Nếu đề hỏi Đại hội nào đánh dấu bước chuyển sang thời kỳ đẩy mạnh công nghiệp hóa, hiện đại hóa đất nước thì cũng chọn Đại hội VIII (1996); còn nếu hỏi mốc nhận định nước ta ra khỏi tình trạng kém phát triển, bước vào nhóm nước có thu nhập trung bình thì chọn Đại hội XI (2011)."],[203,3,"Chủ đề Đại hội đại biểu toàn quốc lần thứ XII của Đảng (01/2016) là gì?",["Tăng cường xây dựng Đảng trong sạch, vững mạnh; phát huy sức mạnh toàn dân tộc, dân chủ xã hội chủ nghĩa","Đẩy mạnh toàn diện, đồng bộ công cuộc đổi mới; bảo vệ vững chắc Tổ quốc, giữ vững môi trường hòa bình, ổn định; phấn đấu sớm đưa nước ta cơ bản trở thành nước công nghiệp theo hướng hiện đại","Tăng cường xây dựng Đảng trong sạch, vững mạnh; phát huy sức mạnh toàn dân tộc, dân chủ xã hội chủ nghĩa; phấn đấu sớm đưa nước ta cơ bản trở thành nước công nghiệp theo hướng hiện đại","Tăng cường xây dựng Đảng trong sạch, vững mạnh; phát huy sức mạnh toàn dân tộc, dân chủ xã hội chủ nghĩa; đẩy mạnh toàn diện, đồng bộ công cuộc đổi mới; bảo vệ vững chắc Tổ quốc, giữ vững môi trường hòa bình, ổn định; phấn đấu sớm đưa nước ta cơ bản trở thành nước công nghiệp theo hướng hiện đại"],3,"Chủ đề đầy đủ của Đại hội đại biểu toàn quốc lần thứ XII (1/2016) gồm trọn vẹn 5 thành tố: tăng cường xây dựng Đảng trong sạch, vững mạnh; phát huy sức mạnh toàn dân tộc, dân chủ xã hội chủ nghĩa; đẩy mạnh toàn diện, đồng bộ công cuộc đổi mới; bảo vệ vững chắc Tổ quốc, giữ vững môi trường hòa bình, ổn định; phấn đấu sớm đưa nước ta cơ bản trở thành nước công nghiệp theo hướng hiện đại. Ba phương án còn lại đều bị lược bớt các vế cốt lõi.","Phân biệt chủ đề Đại hội XI (2011) và Đại hội XII (2016): Đại hội XI mở đầu bằng 'Tiếp tục nâng cao năng lực lãnh đạo và sức chiến đấu của Đảng...' và đặt mốc 'đến năm 2020'; Đại hội XII mở đầu bằng 'Tăng cường xây dựng Đảng trong sạch, vững mạnh...' và ghi 'phấn đấu sớm đưa nước ta...'."],[204,3,"Nghị quyết Đại hội lần thứ VI của Đảng đã nhấn mạnh: “Kiên quyết xoá bỏ cơ chế tập trung quan liêu, bao cấp, thiết lập và hình thành đồng bộ cơ chế kế hoạch hoá theo phương thức hạch toán kinh doanh xã hội chủ nghĩa, đúng nguyên tắc tập trung dân chủ”. Anh/chị hãy cho biết, nội dung trên được nêu trong nhiệm vụ nào sau đây?",["Thực hiện nhiệm vụ cải tạo xã hội chủ nghĩa","Giải quyết cho được những vấn đề cấp bách về phân phối, lưu thông","Nâng cao hiệu lực chỉ đạo và điều hành của Nhà nước","Đổi mới cơ chế quản lý kinh tế"],3,"Đoạn trích trong Nghị quyết Đại hội VI (12/1986) nhấn mạnh hai vế 'xóa bỏ cơ chế tập trung quan liêu, bao cấp' và 'thiết lập cơ chế kế hoạch hóa theo phương thức hạch toán kinh doanh xã hội chủ nghĩa', đây chính là nội dung trực tiếp của nhiệm vụ 'Đổi mới cơ chế quản lý kinh tế'. Cải tạo xã hội chủ nghĩa, phân phối lưu thông hay nâng cao hiệu lực điều hành của Nhà nước là các nhiệm vụ khác được tách mục riêng trong Nghị quyết.","Mẹo ghép trích dẫn Đại hội VI với tên nhiệm vụ: thấy 'xóa bỏ bao cấp, hạch toán kinh doanh' chọn Đổi mới cơ chế quản lý kinh tế; thấy 'ba chương trình kinh tế lớn' chọn Bố trí lại cơ cấu sản xuất; thấy 'sử dụng nhiều thành phần kinh tế' chọn Cải tạo xã hội chủ nghĩa với hình thức, bước đi thích hợp."],[205,3,"“Nước ta đã ra khỏi khủng hoảng kinh tế - xã hội nhưng một số mặt còn chưa vững chắc” là đánh giá tổng quát của Đại hội nào?",["Đại hội VI (12/1986)","Đại hội VII (6/1991)","Đại hội IX (4/2001)","Đại hội VIII (7/1996)"],3,"Đánh giá tổng quát 'Nước ta đã ra khỏi khủng hoảng kinh tế – xã hội nhưng một số mặt còn chưa vững chắc' là nhận định nổi tiếng của Đại hội đại biểu toàn quốc lần thứ VIII (28/6–1/7/1996) sau 10 năm đổi mới. Đại hội VI (1986) và VII (1991) diễn ra khi khủng hoảng chưa kết thúc, còn Đại hội IX (2001) tổng kết 15 năm đổi mới và định hướng bước vào thế kỷ XXI.","Nếu đề hỏi Đại hội nào đánh giá 'đất nước vẫn chưa ra khỏi khủng hoảng kinh tế – xã hội' nhưng đã đạt thành tựu bước đầu rất quan trọng thì chọn Đại hội VII (6/1991). (Lưu ý: Đại hội VIII họp từ 28/6 đến 1/7/1996 nên đề thi có thể ghi 6/1996 hoặc 7/1996)."],[206,3,"Đại hội Đảng lần thứ mấy của Đảng xác định nền kinh tế thị trường định hướng xã hội chủ nghĩa là mô hình kinh tế tổng quát của nước ta trong thời kỳ quá độ đi lên chủ nghĩa xã hội?",["Đại hội VI (12/1986)","Đại hội VII (6/1991)","Đại hội VIII (7/1996)","Đại hội IX (4/2001)"],3,"Đại hội đại biểu toàn quốc lần thứ IX của Đảng (4/2001) tạo bước phát triển đột phá về lý luận khi lần đầu tiên chính thức xác định 'nền kinh tế thị trường định hướng xã hội chủ nghĩa' là mô hình kinh tế tổng quát của nước ta trong thời kỳ quá độ lên chủ nghĩa xã hội. Trước đó, từ Đại hội VI đến Đại hội VIII mới gọi là nền kinh tế hàng hóa nhiều thành phần vận hành theo cơ chế thị trường có sự quản lý của Nhà nước.","Đừng nhầm với Đại hội VI (khởi xướng kinh tế hàng hóa nhiều thành phần) hay Đại hội VIII (đẩy mạnh công nghiệp hóa, hiện đại hóa). Cứ gặp đúng cụm từ 'mô hình kinh tế tổng quát: kinh tế thị trường định hướng xã hội chủ nghĩa' thì chọn ngay Đại hội IX (4/2001)."],[207,3,"Các nước bên ngoài dựa vào nguyên cớ gì bao vây cấm vận nước ta từ cuối thập kỷ 70 của thế kỷ XX?",["Đất nước còn nghèo","Đánh thắng Mỹ","Quan hệ với Trung Quốc ngày càng xấu đi","Sự kiện Campuchia"],3,"Từ cuối thập kỷ 70 của thế kỷ XX, sau khi quân tình nguyện Việt Nam thực hiện quyền tự vệ chính đáng và giúp nhân dân Campuchia đánh đổ chế độ diệt chủng Pôn Pốt (1/1979), Mỹ và một số nước phương Tây, khu vực đã lấy 'sự kiện Campuchia' làm nguyên cớ chính trị để bao vây, cô lập ngoại giao và siết chặt cấm vận kinh tế đối với Việt Nam. Nghèo nàn hay chiến thắng Mỹ không phải cái cớ trực tiếp cho làn sóng cấm vận đa phương này.","Nếu đề hỏi những mốc đánh dấu Việt Nam phá vỡ thế bị bao vây, cấm vận thì nhớ: Hiệp định Paris về Campuchia (10/1991), bình thường hóa quan hệ Việt – Trung (11/1991), Mỹ bỏ cấm vận (2/1994), gia nhập ASEAN và bình thường hóa quan hệ Việt – Mỹ (7/1995)."],[208,3,"Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội được thông qua trong Đại hội nào của Đảng?",["Đại hội VI (12/1986)","Đại hội VIII (7/1996)","Đại hội IX (4/2001)","Đại hội VII (6/1991)"],3,"Tại Đại hội đại biểu toàn quốc lần thứ VII (6/1991), giữa lúc chế độ xã hội chủ nghĩa ở Liên Xô và Đông Âu khủng hoảng sâu sắc, Đảng đã thông qua 'Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội' (Cương lĩnh 1991). Văn kiện xác định 6 đặc trưng và 7 phương hướng cơ bản, khẳng định kiên định con đường xã hội chủ nghĩa ở Việt Nam.","Phân biệt các bản Cương lĩnh của Đảng: Cương lĩnh chính trị đầu tiên thông qua tại Hội nghị thành lập Đảng (2/1930); Luận cương chính trị tại Hội nghị Trung ương 10/1930; Chính cương Đảng Lao động Việt Nam tại Đại hội II (2/1951); Cương lĩnh 1991 tại Đại hội VII; Cương lĩnh bổ sung năm 2011 tại Đại hội XI."],[209,3,"Đại hội nào của Đảng đề ra nhiệm vụ: “Đẩy mạnh công cuộc đổi mới toàn diện và đồng bộ, tiếp tục phát triển nền kinh tế nhiều thành phần vận hành theo cơ chế thị trường có sự quản lý của Nhà nước theo định hướng xã hội chủ nghĩa”?",["Đại hội đại biểu toàn quốc lần thứ VI (12/1986)","Đại hội đại biểu toàn quốc lần thứ VII (06/1991)","Đại hội đại biểu toàn quốc lần thứ IX (04/2001)","Đại hội đại biểu toàn quốc lần thứ VIII (07/1996)"],3,"Trên cơ sở đánh giá đất nước đã thoát khỏi khủng hoảng kinh tế – xã hội, Đại hội đại biểu toàn quốc lần thứ VIII (28/6–1/7/1996) đề ra nhiệm vụ 'Đẩy mạnh công cuộc đổi mới toàn diện và đồng bộ, tiếp tục phát triển nền kinh tế nhiều thành phần vận hành theo cơ chế thị trường có sự quản lý của Nhà nước theo định hướng xã hội chủ nghĩa'. Đại hội VI mới khởi xướng đổi mới, Đại hội VII chưa dùng cụm 'đẩy mạnh đổi mới toàn diện và đồng bộ', còn Đại hội IX đã dùng tên 'kinh tế thị trường định hướng xã hội chủ nghĩa'.","Mẹo nhận diện chính xác: trích dẫn vẫn giữ cụm dài 'nền kinh tế nhiều thành phần vận hành theo cơ chế thị trường có sự quản lý của Nhà nước theo định hướng xã hội chủ nghĩa' (chưa rút gọn như Đại hội IX) đi cùng cụm 'đẩy mạnh công cuộc đổi mới toàn diện và đồng bộ' -> chọn Đại hội VIII (1996)."],[210,3,"Đại hội toàn quốc lần thứ mấy của Đảng xác định: “Đảng lấy chủ nghĩa Mác - Lênin và tư tưởng Hồ Chí Minh làm nền tảng tư tưởng, kim chỉ nam cho hành động”?",["Đại hội lần thứ VI (12/1986)","Đại hội lần thứ VIII (7/1996)","Đại hội lần thứ IX (04/2001)","Đại hội lần thứ VII (6/1991)"],3,"Một mốc son về tư duy lý luận của Đại hội đại biểu toàn quốc lần thứ VII (6/1991) là trong Cương lĩnh năm 1991 và Điều lệ Đảng sửa đổi, Đảng lần đầu tiên khẳng định chính thức: 'Đảng lấy chủ nghĩa Mác – Lênin và tư tưởng Hồ Chí Minh làm nền tảng tư tưởng, kim chỉ nam cho hành động'. Trước đó, Đảng mới ghi chủ nghĩa Mác – Lênin là
