 đạo thống nhất của Đảng Cộng sản Việt Nam với mục tiêu rõ ràng chống đế quốc và phong kiến, tạo nên khối liên minh công - nông thực tế. Các phương án nhiễu đều sai sử liệu: chính quyền Xô viết chỉ thành lập ở một số xã nông thôn hai tỉnh Nghệ An và Hà Tĩnh chứ không phải toàn Nghệ - Tĩnh, và phong trào cũng chưa giành thắng lợi cuối cùng hay đấu tranh vũ trang tự vệ trên toàn quốc.","Nếu đề hỏi đỉnh cao của phong trào cách mạng 1930-1931 thì chọn Xô viết Nghệ - Tĩnh (chính quyền kiểu mới ở một số xã nông thôn Nghệ An và Hà Tĩnh); nếu hỏi ý nghĩa lịch sử chung thì nhớ cụm \"cuộc tổng diễn tập đầu tiên\" cho Cách mạng Tháng Tám 1945."],[54,1,"Chọn phương án đúng nhất điền vào chỗ trống: “............. là đội tiền phong của giai cấp công nhân, đồng thời là đội tiền phong của nhân dân lao động và của dân tộc Việt Nam, đại biểu trung thành lợi ích của giai cấp công nhân, nhân dân lao động và của dân tộc”",["Đảng cộng sản","Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam","Mặt trận Tổ quốc Việt Nam","Đảng Cộng sản Việt Nam"],3,"Đây là nguyên văn định nghĩa về bản chất giai cấp và tính chất dân tộc của Đảng Cộng sản Việt Nam được ghi trong Điều lệ Đảng và Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung, phát triển năm 2011). Phương án \"Đảng cộng sản\" nói chung chưa xác định rõ chủ thể cụ thể gắn với dân tộc Việt Nam. Trong khi đó, Nhà nước là trụ cột quản lý xã hội và Mặt trận Tổ quốc là cơ sở chính trị của chính quyền nhân dân, không phải đội tiền phong lãnh đạo.","Nếu đề hỏi tổ chức nào là \"cơ sở chính trị của chính quyền nhân dân, đại diện bảo vệ quyền và lợi ích hợp pháp, chính đáng của nhân dân\" thì chọn Mặt trận Tổ quốc Việt Nam; nếu hỏi tổ chức thực hiện quyền lực nhà nước của nhân dân, do nhân dân, vì nhân dân thì chọn Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam."],[55,1,"Trong cả cuộc đời lãnh đạo cách mạng, chủ tịch Hồ Chí Minh luôn quan tâm đến báo chí. Tờ báo được Người sáng lập và được coi là mở đầu cho nền báo chí cách mạng Việt Nam là tờ báo nào?",["Báo Dân chúng (1938)","Báo Búa Liềm (1925)","Báo Nhân dân (1951)","Báo Thanh niên (1925)"],3,"Ngày 21/6/1925, tại Quảng Châu (Trung Quốc), lãnh tụ Nguyễn Ái Quốc đã sáng lập và xuất bản số đầu tiên của báo Thanh niên — cơ quan ngôn luận của Hội Việt Nam Cách mạng Thanh niên. Tờ báo bằng tiếng Việt này đã truyền bá sâu rộng chủ nghĩa Mác - Lênin và đường lối cứu nước mới về trong nước, mở đầu cho nền báo chí cách mạng Việt Nam (ngày 21/6 trở thành Ngày Báo chí cách mạng Việt Nam). Các tờ báo khác đều ra đời về sau hoặc không phải tờ báo mở đầu do Người trực tiếp sáng lập năm 1925.","Nếu đề hỏi cơ quan ngôn luận công khai của Đảng trong phong trào dân chủ 1936-1939 thì chọn Báo Dân chúng (1938); nếu hỏi cơ quan ngôn luận của Đông Dương Cộng sản Đảng thì chọn Báo Búa Liềm (thực tế ra đời năm 1929, không phải 1925); còn cơ quan trung ương của Đảng từ Đại hội II thì chọn Báo Nhân dân (1951)."],[56,1,"Nhân dân ta phải tiến hành Tổng khởi nghĩa giành chính quyền trước khi quân Đồng minh vào Đông Dương trong giai đoạn kháng chiến chống thực dân Pháp (1930-1945) vì những lý do nào?",["Thực dân Pháp đã bị phát xít Nhật đảo chánh","Quân Nhật đang bị mất ý chí chiến đấu do bị bại trận trước quân đồng minh","Quân Đồng minh có thể không vào nước ta","So sánh lực lượng có lợi nhất, kẻ thù cũ đã ngã gục nhưng kẻ thù mới chưa kịp đến"],3,"Tháng 8/1945, phát xít Nhật tuyên bố đầu hàng Đồng minh vô điều kiện, quân Nhật ở Đông Dương rệu rã, chính quyền tay sai Trần Trọng Kim hoang mang tột độ, trong khi quân Đồng minh cùng thực dân Pháp mang dã tâm tái chiếm vẫn chưa kịp kéo vào. Đây là thời cơ \"ngàn năm có một\" khi so sánh lực lượng có lợi nhất cho cách mạng, kẻ thù cũ đã ngã gục nhưng kẻ thù mới chưa kịp đến, cho phép ta giành chính quyền nhanh chóng để đón quân Đồng minh với tư thế người làm chủ. Các phương án khác chỉ nêu hiện tượng riêng lẻ hoặc sai thực tế.","Nếu đề hỏi hội nghị nào của Đảng quyết định phát động Tổng khởi nghĩa giành chính quyền trước khi quân Đồng minh vào Đông Dương thì chọn Hội nghị toàn quốc của Đảng tại Tân Trào (14-15/8/1945); nếu hỏi mốc Nhật đảo chính Pháp mở ra thời cơ trực tiếp nhưng chưa chín muồi để tổng khởi nghĩa ngay thì chọn ngày 9/3/1945."],[57,1,"Một trong những điểm khác nhau giữa Cương lĩnh chính trị đầu tiên (2/1930) của Đảng và Luận cương chính trị (10/1930) là gì?",["Phương hướng chiến lược của cách mạng","Phương pháp cách mạng","Vai trò lãnh đạo cách mạng","Chủ trương tập hợp lực lượng cách mạng"],3,"Cương lĩnh chính trị đầu tiên (2/1930) do Nguyễn Ái Quốc soạn thảo chủ trương đoàn kết rộng rãi mọi tầng lớp yêu nước (công, nông, tiểu tư sản, trí thức, tranh thủ trung tiểu địa chủ và tư sản dân tộc), còn Luận cương chính trị (10/1930) do Trần Phú soạn thảo lại chỉ coi công nhân và nông dân là động lực cách mạng, chưa đánh giá đúng khả năng yêu nước của các giai tầng khác. Hai văn kiện thống nhất về phương hướng chiến lược, vai trò lãnh đạo của Đảng và phương pháp bạo lực cách mạng.","Ngoài chủ trương tập hợp lực lượng, điểm khác biệt lớn thứ hai giữa hai văn kiện là nhiệm vụ trọng tâm: Cương lĩnh tháng 2/1930 đặt giải phóng dân tộc lên hàng đầu, còn Luận cương tháng 10/1930 nhấn mạnh nặng nề đấu tranh giai cấp và cách mạng ruộng đất; nếu đề hỏi điểm giống nhau thì chọn vai trò lãnh đạo, phương hướng chiến lược hoặc phương pháp cách mạng."],[58,1,"Chọn phương án đúng nhất điền vào chỗ trống: Phương pháp nghiên cứu, học tập môn Lịch sử Đảng Cộng sản Việt Nam cần dựa trên phương pháp luận khoa học Mác xít, đặc biệt là nắm vững ...(1)... và ...(2)... để xem xét và nhận thức lịch sử một cách khách quan, trung thực và đúng quy luật.",["(1) Tư tưởng Hồ Chí Minh; (2) thực tiễn","(1) chủ nghĩa Mác - Lênin; (2) thực tiễn","(1) lý luận; (2) thực tiễn","(1) chủ nghĩa duy vật biện chứng; (2) chủ nghĩa duy vật lịch sử"],3,"Theo Giáo trình Lịch sử Đảng Cộng sản Việt Nam (chương Nhập môn), phương pháp luận nghiên cứu và học tập môn học này đặt nền tảng trên triết học Mác - Lênin, trực tiếp là nắm vững chủ nghĩa duy vật biện chứng và chủ nghĩa duy vật lịch sử. Hai trụ cột phương pháp luận đó giúp người học đánh giá các sự kiện lịch sử Đảng trong mối liên hệ phổ biến, vận động phát triển và điều kiện lịch sử cụ thể, bảo đảm tính khách quan, trung thực và đúng quy luật. Các cặp khái niệm còn lại không khớp nguyên văn định nghĩa về phương pháp luận.","Nếu đề hỏi nền tảng tư tưởng, kim chỉ nam cho hành động của Đảng ta thì chọn chủ nghĩa Mác - Lênin và Tư tưởng Hồ Chí Minh; còn nếu đề hỏi hai phương pháp nghiên cứu cụ thể đặc trưng của khoa học lịch sử Đảng thì chọn phương pháp lịch sử và phương pháp lôgic."],[59,1,"Trong tác phẩm “Những mẩu chuyện về hoạt động của Hồ Chủ tịch”, tác giả Trần Dân Tiên đã nói đến tác phẩm nào là kết quả của bao nhiêu hy vọng, gắng sức và tin tưởng của hơn 20 triệu nhân dân Việt Nam?",["Tự chỉ trích","Đời sống mới","Tuyên cáo của Hoàng đế Việt Nam thoái vị","Tuyên ngôn Độc lập"],3,"Trong cuốn \"Những mẩu chuyện về hoạt động của Hồ Chủ tịch\" (bút danh Trần Dân Tiên của Chủ tịch Hồ Chí Minh), tác giả ca ngợi bản Tuyên ngôn Độc lập đọc ngày 2/9/1945 tại Quảng trường Ba Đình là kết tinh của bao nhiêu hy vọng, gắng sức và tin tưởng của hơn 20 triệu nhân dân Việt Nam sau gần một thế kỷ bị đô hộ. Văn kiện lịch sử này khai sinh nước Việt Nam Dân chủ Cộng hòa và khẳng định quyền độc lập, tự do thiêng liêng của dân tộc trước toàn thế giới. Các văn kiện khác không mang tầm vóc và ý nghĩa khai sinh quốc gia như vậy.","Nếu đề hỏi tác phẩm về công tác xây dựng Đảng do Tổng Bí thư Nguyễn Văn Cừ viết năm 1939 thì chọn \"Tự chỉ trích\"; nếu hỏi tác phẩm vận động nếp sống cần kiệm liêm chính do Hồ Chí Minh viết năm 1947 (bút danh Tân Sinh) thì chọn \"Đời sống mới\"; còn \"Tuyên cáo thoái vị\" là văn kiện ngày 30/8/1945 của vua Bảo Đại."],[60,1,"Điều kiện nào đã tạo ra khả năng đấu tranh công khai, hợp pháp cho phong trào cách mạng Đông Dương trong giai đoạn 1936-1939?",["Sự xuất hiện chủ nghĩa phát xít và nguy cơ chiến tranh thế giới","Chủ trương chuyển hướng chiến lược cách mạng thế giới của Quốc tế Cộng sản","Mặt trận chống phát xít","Mặt trận nhân dân Pháp lên cầm quyền"],3,"Tháng 6/1936, Chính phủ Mặt trận Nhân dân Pháp lên nắm quyền và thi hành một số cải cách tiến bộ cho các nước thuộc địa như ân xá tù chính trị, nới lỏng kiểm duyệt báo chí và cho phép lập một số hội ái hữu. Chính sự kiện này trực tiếp tạo ra điều kiện thuận lợi để Đảng ta kết hợp đấu tranh bí mật với các hình thức công khai, hợp pháp và nửa hợp pháp giai đoạn 1936-1939. Nguy cơ phát xít hay chủ trương của Quốc tế Cộng sản là bối cảnh chung và định hướng chiến lược, chưa tự tạo ra hành lang pháp lý công khai tại Đông Dương.","Nếu đề hỏi sự kiện quốc tế định hướng chuyển hướng chiến lược chống phát xít của các đảng cộng sản trên thế giới thì chọn Đại hội lần thứ VII của Quốc tế Cộng sản (7/1935); còn nếu hỏi nguyên nhân trực tiếp khiến thời kỳ đấu tranh công khai 1936-1939 chấm dứt thì chọn Chiến tranh thế giới thứ hai bùng nổ (9/1939)."],[61,1,"Chính sách cai trị của thực dân Pháp đã nảy sinh hệ quả cơ bản gì trong xã hội Việt Nam?",["Cho ra đời hai giai cấp mới là nông dân và tư sản Việt Nam","Làm cho xã hội Việt Nam phong kiến trở thành xã hội thuộc địa","Tồn tại hai chế độ xã hội: Thực dân và Phong kiến","Tạo ra mâu thuẫn giữa toàn thể dân tộc Việt Nam với thực dân Pháp xâm lược"],3,"Dưới ách thống trị và khai thác thuộc địa của thực dân Pháp, xã hội Việt Nam chuyển từ xã hội phong kiến độc lập thành xã hội thuộc địa nửa phong kiến với hai mâu thuẫn cơ bản, trong đó mâu thuẫn bao trùm, gay gắt và chủ yếu nhất là mâu thuẫn giữa toàn thể dân tộc Việt Nam với thực dân Pháp xâm lược cùng tay sai. Các phương án khác đều sai bản chất: giai cấp nông dân vốn đã tồn tại từ xã hội phong kiến, và tính chất xã hội Việt Nam phải là \"thuộc địa nửa phong kiến\" chứ không chỉ là \"xã hội thuộc địa\" đơn thuần.","Nếu đề hỏi hai giai cấp mới ra đời do cuộc khai thác thuộc địa của Pháp thì chọn giai cấp công nhân và giai cấp tư sản (cùng tầng lớp tiểu tư sản); nếu đề hỏi tính chất đầy đủ của xã hội Việt Nam dưới thời Pháp thuộc thì chọn xã hội \"thuộc địa nửa phong kiến\"."],[62,1,"Nhiệm vụ nào dưới đây là nhiệm vụ nghiên cứu môn học Lịch sử Đảng Cộng sản Việt Nam?",["Tổng kết lịch sử của Đảng; làm rõ vai trò, sức chiến đấu của hệ thống tổ chức đảng từ Trung ương đến cơ sở trong lãnh đạo, tổ chức thực tiễn","Quá trình lãnh đạo của Đảng Cộng sản Việt Nam đối với cách mạng Việt Nam từ năm 1930 đến nay","Làm rõ vai trò, sức chiến đấu của hệ thống tổ chức Đảng từ Trung ương đến cơ sở trong lãnh đạo, tổ chức thực tiễn","Trình bày có hệ thống Cương lĩnh, đường lối của Đảng; tái hiện tiến trình lịch sử lãnh đạo, đấu tranh của Đảng; tổng kết lịch sử của Đảng; làm rõ vai trò, sức chiến đấu của hệ thống tổ chức đảng từ Trung ương đến cơ sở trong lãnh đạo, tổ chức thực tiễn"],3,"Theo Giáo trình Lịch sử Đảng Cộng sản Việt Nam (chương Nhập môn), môn học có bốn nhiệm vụ nghiên cứu thống nhất: trình bày có hệ thống Cương lĩnh, đường lối của Đảng; tái hiện tiến trình lịch sử lãnh đạo, đấu tranh của Đảng; tổng kết lịch sử của Đảng; làm rõ vai trò, sức chiến đấu của hệ thống tổ chức đảng từ Trung ương đến cơ sở trong lãnh đạo, tổ chức thực tiễn. Các phương án khác hoặc chỉ nêu thiếu một đến hai nhiệm vụ bộ phận, hoặc thực chất là định nghĩa về \"đối tượng nghiên cứu\".","Nếu đề hỏi \"đối tượng nghiên cứu\" của môn Lịch sử Đảng Cộng sản Việt Nam là gì thì chọn phương án nhấn mạnh quá trình lãnh đạo của Đảng đối với cách mạng Việt Nam từ năm 1930 đến nay (bao gồm sự kiện lịch sử, Cương lĩnh, đường lối và công tác xây dựng Đảng); còn hỏi \"nhiệm vụ\" phải chọn đủ cả 4 vế."],[63,1,"Nội dung nào sau đây là không đúng về chính sách cai trị của thực dân Pháp ở nước ta?",["Chia Việt Nam ra thành ba xứ để cai trị: Bắc Kỳ, Trung Kỳ, Nam Kỳ","Thực hiện khai thác thuộc địa dưới nhiều hình thức","Thực hiện chính sách dung túng, duy trì các hủ tục lạc hậu trong nhân dân ta","Thực hiện khẩu hiệu: Tự do, Bình đẳng, Bác ái ở nước ta"],3,"Về chính trị, thực dân Pháp áp đặt chế độ chuyên chế độc tài, \"chia để trị\" bằng cách tách Việt Nam thành ba xứ (Bắc Kỳ, Trung Kỳ, Nam Kỳ); về kinh tế, chúng khai thác thuộc địa tàn bạo; về văn hóa - xã hội, chúng thực hiện chính sách ngu dân, dung túng và duy trì hủ tục lạc hậu. Thực dân Pháp hoàn toàn không thực hiện khẩu hiệu \"Tự do, Bình đẳng, Bác ái\" ở nước ta mà trái lại đã chà đạp tàn bạo các quyền tự do, dân chủ của nhân dân thuộc địa.","Cần đọc kỹ từ phủ định \"không đúng\" trong đề bài; nếu đề chuyển sang hỏi nội dung đúng về chính sách chính trị của Pháp thì chọn chia nước ta thành 3 xứ để cai trị, còn về chính sách văn hóa - xã hội thì chọn chính sách ngu dân và duy trì các hủ tục lạc hậu."],[64,1,"Trong cao trào kháng Nhật cứu nước, phong trào “phá kho thóc của Nhật để giải quyết nạn đói” đã diễn ra mạnh mẽ ở đâu?",["Đồng bằng Nam Bộ","Đồng bằng Bắc Bộ","Đồng bằng Trung Bộ","Đồng bằng Bắc Bộ và Bắc Trung Bộ"],3,"Cuối năm 1944 đầu năm 1945, do chính sách nhổ lúa trồng đay, thu mua thóc gạo cưỡng bức của phát xít Nhật và thực dân Pháp kết hợp thiên tai, nạn đói khủng khiếp đã xảy ra chủ yếu ở các tỉnh Bắc Bộ và Bắc Trung Bộ làm khoảng 2 triệu đồng bào ta thiệt mạng. Thực hiện Chỉ thị \"Nhật - Pháp bắn nhau và hành động của chúng ta\" (12/3/1945), Đảng phát động khẩu hiệu \"Phá kho thóc, giải quyết nạn đói\", tạo nên cao trào quần chúng mạnh mẽ nhất tại Đồng bằng Bắc Bộ và Bắc Trung Bộ. Các phương án chỉ nêu một vùng hoặc nêu Đồng bằng Nam Bộ đều chưa chính xác.","Nếu đề hỏi văn kiện nào đề ra khẩu hiệu \"Phá kho thóc, giải quyết nạn đói\" thì chọn Chỉ thị \"Nhật - Pháp bắn nhau và hành động của chúng ta\" ngày 12/3/1945 của Ban Thường vụ Trung ương Đảng; nếu hỏi hình thức đấu tranh chủ yếu ở vùng rừng núi và trung du Bắc Kỳ trong cùng cao trào thì chọn khởi nghĩa từng phần."],[65,1,"Cao trào kháng Nhật cứu nước đã diễn ra ở vùng rừng núi và trung du Bắc kỳ với hình thức nào là chủ yếu?",["Khởi nghĩa từng phần","Đấu tranh chính trị","Đấu tranh báo chí","Biểu tình, thị uy, vũ trang du kích"],0,"Từ giữa tháng 3/1945, thực hiện Chỉ thị \"Nhật - Pháp bắn nhau và hành động của chúng ta\", ở vùng rừng núi và trung du Bắc Kỳ (đặc biệt là khu vực Việt Bắc), lực lượng vũ trang cách mạng cùng nhân dân đã đẩy mạnh chiến tranh du kích kết hợp phát động khởi nghĩa từng phần, đánh chiếm đồn bốt Nhật và lập chính quyền cách mạng ở hàng loạt xã, châu, huyện. Thắng lợi của khởi nghĩa từng phần đã dẫn tới sự ra đời của Khu giải phóng Việt Bắc (6/1945). Các hình thức như đấu tranh báo chí hay đấu tranh chính trị đơn thuần chủ yếu gắn với giai đoạn 1936-1939 hoặc vùng đô thị.","Nếu đề hỏi phong trào nổi bật ở vùng đồng bằng Bắc Bộ và Bắc Trung Bộ trong cao trào kháng Nhật cứu nước thì chọn \"phá kho thóc của Nhật để giải quyết nạn đói\"; còn nếu hỏi hình thức chủ yếu trong giai đoạn 1936-1939 thì chọn đấu tranh chính trị công khai, hợp pháp và đấu tranh báo chí, nghị trường."],[66,1,"Chọn phương án đúng nhất điền vào chỗ trống: Nghị quyết Trung ương 4 khóa XII (10/2016) khẳng định: “Chúng ta có quyền tự hào về bản chất tốt đẹp, truyền thống anh hùng và lịch sử vẻ vang của ...(1)... - ... (2)... của Chủ tịch Hồ Chí Minh vĩ đại, đại biểu của ...(3)... anh hùng”",["(1) nước ta; (2) Đất nước; (3) một dân tộc","(1) nhân dân ta; (2) Đất nước; (3) một dân tộc","(1) dân tộc Việt Nam; (2) Tổ quốc; (3) những đồng chí","(1) Đảng ta; (2) Đảng; (3) dân tộc Việt Nam"],3,"Nghị quyết Hội nghị Trung ương 4 khóa XII (30/10/2016) về tăng cường xây dựng, chỉnh đốn Đảng khẳng định nguyên văn niềm tự hào về bản chất tốt đẹp, truyền thống anh hùng và lịch sử vẻ vang của \"Đảng ta - Đảng của Chủ tịch Hồ Chí Minh vĩ đại, đại biểu của dân tộc Việt Nam anh hùng\". Câu trích dẫn nhấn mạnh trực tiếp vai trò người sáng lập, rèn luyện Đảng của Chủ tịch Hồ Chí Minh và mối liên hệ máu thịt giữa Đảng với dân tộc Việt Nam. Các phương án thay bằng \"nước ta\", \"nhân dân ta\" hay \"Tổ quốc\" đều làm sai lệch chủ thể trung tâm của Nghị quyết.","Nếu đề hỏi nội dung cốt lõi của Nghị quyết Trung ương 4 khóa XII (10/2016) thì chọn ngăn chặn, đẩy lùi sự suy thoái về tư tưởng chính trị, đạo đức, lối sống, những biểu hiện \"tự diễn biến\", \"tự chuyển hóa\" trong nội bộ; còn Nghị quyết Trung ương 4 khóa XI (1/2012) nêu một số vấn đề cấp bách về xây dựng Đảng hiện nay."],[67,1,"Chọn phương án đúng nhất điền vào chỗ trống trong câu nói nổi tiếng của Nguyễn Ái Quốc: “Rượu cồn và thuốc phiện cùng báo chí phản động của bọn cầm quyền bổ sung cho cái công cuộc ........... của Chính phủ. Máy chém và nhà tù làm nốt phần còn lại”.",["trị dân","khai hoá","an dân","ngu dân"],3,"Đây là câu văn đanh thép của Nguyễn Ái Quốc trong tác phẩm \"Bản án chế độ thực dân Pháp\" (xuất bản lần đầu tại Paris năm 1925) nhằm vạch trần bộ mặt giả nhân giả nghĩa của chính sách văn hóa - xã hội mà thực dân Pháp áp đặt ở Đông Dương. Thực chất cái gọi là \"khai hóa văn minh\" của thực dân chỉ là công cuộc \"ngu dân\" kết hợp rượu cồn, thuốc phiện, báo chí phản động cùng máy chém và nhà tù để dễ bề thống trị. Các từ như \"trị dân\", \"an dân\" hay \"khai hóa\" không đúng với nguyên văn phê phán trực diện của Người.","Nếu đề hỏi tên tác phẩm tố cáo tội ác thực dân của Nguyễn Ái Quốc chứa câu nói này thì chọn \"Bản án chế độ thực dân Pháp\" (1925); nếu hỏi đặc trưng chính sách văn hóa - giáo dục của thực dân Pháp ở Việt Nam thì từ khóa chuẩn luôn là \"chính sách ngu dân\" (mở nhà tù nhiều hơn trường học)."],[68,1,"Chọn phương án đúng nhất điền vào chỗ trống. Nhà tư sản nổi tiếng ở Việt Nam đầu thế kỉ XX còn thiếu trong câu sau: “Nhất Sĩ, nhĩ Phương, tam Xương, tứ...” là ai?",["Bền (Trương Văn Bền)","Vĩnh (Lê Phát Vĩnh)","Sản (Trịnh Duy Sản)","Bưởi (Bạch Thái Bưởi)"],3,"Đầu thế kỷ XX, cùng với sự ra đời của giai cấp tư sản Việt Nam, giới kinh doanh dân tộc xuất hiện bốn gương mặt giàu có và nổi danh nhất thường được ngân hàng đề học phần tóm gọn qua câu \"Nhất Sĩ (Lê Phát Đạt), nhì Phương (Đỗ Hữu Phương), tam Xương (Lý Tường Quan tức Huyện Xương), tứ Bưởi (Bạch Thái Bưởi)\". Bạch Thái Bưởi được mệnh danh là \"Chúa sông Bắc Kỳ\", nổi tiếng với tinh thần kinh doanh dân tộc cạnh tranh trực tiếp với tư bản Pháp và Hoa kiều trên lĩnh vực vận tải đường thủy. Các tên tuổi còn lại tuy là doanh nhân nổi tiếng nhưng không nằm trong cụm từ bốn đại tư sản này.","Lưu ý mẹo làm bài: dân gian Nam Bộ có dị bản \"tứ Hỏa\" (Chú Hỏa - Hứa Bổn Hòa) hoặc \"tứ Định\", nhưng bộ đề Lịch sử Đảng chốt đáp án là Bạch Thái Bưởi; nếu đề hỏi nhà tư sản nổi tiếng với phong trào \"Chấn hưng nội hóa, bài trừ ngoại hóa\" và thương hiệu xà bông Cô Ba thì nhớ đến Trương Văn Bền."],[69,1,"Chọn phương án đúng nhất điền vào chỗ trống trong câu nói của Phan Bội Châu: “Đương lúc khói độc mây mù, thình lình có một trận gió xuân thổi tới. Đương giữa lúc trời khuya đất ngủ, thình lình có một tia thái dương mọc ra. Trận gió xuân ấy, tia thái dương ấy là ...........”",["Nguyễn Ái Quốc","cách mạng Nga năm 1917","cách mạng Tân Hợi ở Trung Quốc","chủ nghĩa xã hội"],3,"Trong tác phẩm \"Truyện Phạm Hồng Thái\" (1924) và các bài viết thời kỳ cuối hoạt động tại Trung Quốc, chịu ảnh hưởng mạnh mẽ từ thắng lợi của Cách mạng Tháng Mười Nga và phong trào công nhân quốc tế, cụ Phan Bội Châu đã ca ngợi \"chủ nghĩa xã hội\" như \"trận gió xuân\" và \"tia thái dương\" soi rọi màn đêm áp bức của chế độ đế quốc. Câu nói cho thấy sự chuyển biến tích cực trong tư tưởng của bậc sĩ phu yêu nước tiên tiến hướng về con đường xã hội chủ nghĩa. Các phương án như Nguyễn Ái Quốc, Cách mạng Nga hay Cách mạng Tân Hợi tuy liên quan nhưng không phải cụm từ nguyên văn cần điền.","Nếu đề hỏi sự kiện quốc tế thúc đẩy Phan Bội Châu chuyển từ lập trường quân chủ lập hiến sang dân chủ cộng hòa (lập Việt Nam Quang phục hội năm 1912) thì chọn Cách mạng Tân Hợi ở Trung Quốc (1911); còn nếu hỏi người đầu tiên truyền bá chủ nghĩa Mác - Lênin vào Việt Nam thì chọn Nguyễn Ái Quốc."],[70,2,"Phương châm chiến lược của cuộc kháng chiến chống thực dân Pháp trong giai đoạn 1945-1954 là gì?",["Toàn dân","Toàn diện","Trường kỳ kháng chiến","Lâu dài và dựa vào sức mình là chính"],3,"Đường lối kháng chiến chống thực dân Pháp (1945-1954) của Đảng được xác định là \"toàn dân, toàn diện, lâu dài và dựa vào sức mình là chính\", trong đó \"lâu dài và dựa vào sức mình là chính\" là phương châm chiến lược cơ bản. Do tương quan lực lượng ban đầu giữa ta và địch quá chênh lệch và nước ta bị bao vây cô lập, ta phải đánh lâu dài để từng bước chuyển hóa tương quan lực lượng, đồng thời phát huy tối đa nội lực, không ỷ lại bên ngoài. \"Toàn dân\" và \"toàn diện\" thuộc tính chất, lực lượng và phạm vi kháng chiến, còn \"Trường kỳ kháng chiến\" mới nêu một vế của phương châm.","Nếu đề hỏi 4 đặc trưng tổng quát của đường lối kháng chiến chống Pháp thì nhớ đủ bộ \"toàn dân, toàn diện, lâu dài, dựa vào sức mình là chính\"; nếu đề hỏi phương châm tác chiến riêng trong chiến dịch Điện Biên Phủ (1954) thì chọn \"Đánh chắc, tiến chắc\"."],[71,2,"Hiến pháp đầu tiên của nước Việt Nam Dân chủ Cộng hoà được Quốc hội thông qua vào ngày tháng năm nào?",["9/11/1945","6/01/1946","10/10/1946","9/11/1946"],3,"Tại kỳ họp thứ hai Quốc hội khóa I (họp từ ngày 28/10 đến ngày 9/11/1946 tại Hà Nội), Quốc hội nước Việt Nam Dân chủ Cộng hòa đã chính thức thông qua bản Hiến pháp đầu tiên vào ngày 9/11/1946. Đây là bản Hiến pháp dân chủ đầu tiên ở Đông Nam Á, thể chế hóa thành quả Cách mạng Tháng Tám và khẳng định quyền làm chủ của nhân dân (ngày 9/11 hằng năm trở thành Ngày Pháp luật Việt Nam). Các mốc khác như 6/1/1946 là ngày Tổng tuyển cử bầu Quốc hội khóa I, còn 9/11/1945 và 10/10/1946 là mốc nhiễu.","Nếu đề hỏi ngày tiến hành cuộc Tổng tuyển cử đầu tiên bầu Quốc hội khóa I của nước Việt Nam Dân chủ Cộng hòa thì chọn ngày 6/1/1946; nếu hỏi ngày Quốc hội họp phiên đầu tiên lập Chính phủ chính thức do Hồ Chí Minh làm Chủ tịch thì chọn ngày 2/3/1946."],[72,2,"Đảng, Chính phủ và Chủ tịch Hồ Chí Minh đã tập trung chỉ đạo, động viên mọi tầng lớp nhân dân tham gia các phong trào lớn, các cuộc vận động nào chống giặc đói, đẩy lùi nạn đói?",["Thóc không thiếu một cân, quân không thiếu một người","Tay cày tay súng; tay búa, tay súng","Ba sẵn sàng; ba đảm đang","Tăng gia sản xuất, thực hành tiết kiệm; lập hũ gạo tiết kiệm"],3,"Ngay sau Cách mạng Tháng Tám 1945, trước nguy cơ nạn đói mới đe dọa chế độ non trẻ, Đảng, Chính phủ và Chủ tịch Hồ Chí Minh đã phát động đồng bộ biện pháp trước mắt và lâu dài gồm phong trào \"Tăng gia sản xuất, thực hành tiết kiệm\" (khẩu hiệu \"Tấc đất tấc vàng\"), tổ chức \"Ngày đồng tâm\", lập \"Hũ gạo tiết kiệm\" và nghiêm cấm dùng gạo nấu rượu. Nhờ đó, nạn đói cơ bản được đẩy lùi chỉ sau một năm, củng cố vững chắc lòng tin của nhân dân với chính quyền mới. Các phong trào còn lại đều thuộc thời kỳ kháng chiến chống Mỹ cứu nước ở miền Bắc những năm 1965-1975.","Nếu đề hỏi phong trào diệt \"giặc dốt\" năm 1945-1946 thì chọn \"Bình dân học vụ\"; còn nếu hỏi các phong trào thi đua ở miền Bắc thời chống Mỹ (1965-1975) thì chọn \"Ba sẵn sàng\" (thanh niên), \"Ba đảm đang\" (phụ nữ), \"Tay cày tay súng\" (nông dân), \"Tay búa, tay súng\" (công nhân) và \"Thóc không thiếu một cân, quân không thiếu một người\" (chi viện tiền tuyến)."],[73,2,"Tư tưởng chỉ đạo đối với cuộc đấu tranh ở miền Nam được thể hiện trong các Nghị quyết Hội nghị Trung ương lần thứ 11 (3/1965) và lần thứ 12 (12/1965) là tư tưởng nào?",["Kiên quyết tiến công và nổi dậy buộc đối phương phải ngồi vào bàn đàm phán với ta","Kết hợp tiến công quân sự với nổi dậy của quần chúng, đánh bại âm mưu Việt Nam hoá chiến tranh của địch","Thực hiện phương châm đánh cho Mỹ cút, đánh cho ngụy nhào","Giữ vững và phát triển thế tiến công, kiên quyết tiến công và liên tục tiến công"],3,"Năm 1965, khi đế quốc Mỹ ồ ạt đưa quân viễn chinh vào miền Nam thực hiện chiến lược \"Chiến tranh cục bộ\" và mở rộng ném bom phá hoại miền Bắc, Hội nghị Trung ương 11 (3/1965) và Trung ương 12 (12/1965) đã kịp thời đề ra đường lối kháng chiến chống Mỹ cứu nước trên cả nước. Đối với tiền tuyến miền Nam, Đảng xác định tư tưởng chỉ đạo là \"giữ vững và phát triển thế tiến công, kiên quyết tiến công và liên tục tiến công\", kết hợp đấu tranh quân sự với đấu tranh chính trị trên cả ba vùng chiến lược. Các phương án nhắc tới \"Việt Nam hóa chiến tranh\" hay \"đánh cho Mỹ cút, đánh cho ngụy nhào\" thuộc giai đoạn từ năm 1969 về sau.","Nếu đề hỏi khẩu hiệu chiến lược trong thơ chúc Tết năm 1969 của Chủ tịch Hồ Chí Minh thì chọn \"Đánh cho Mỹ cút, đánh cho ngụy nhào\"; nếu hỏi giai đoạn đánh bại chiến lược \"Việt Nam hóa chiến tranh\" của chính quyền Nixon thì thuộc mốc thời gian 1969-1973, không phải năm 1965."],[74,2,"Thực hiện Nghị quyết của Đảng và theo Lời kêu gọi của Hồ Chí Minh, quân và dân miền Bắc đã dấy lên các cao trào chống Mỹ, cứu nước, vừa sản xuất, vừa chiến đấu, với niềm tin và quyết tâm cao độ. Thanh niên có phong trào:",["Tay búa, tay súng","Xung kích chiến đấu","Ba đảm đang","Ba sẵn sàng"],3,"Trước yêu cầu bảo vệ miền Bắc xã hội chủ nghĩa và chi viện tối đa cho tiền tuyến lớn miền Nam khi Mỹ tiến hành chiến tranh phá hoại từ năm 1964-1965, thanh niên miền Bắc đã sôi nổi hưởng ứng phong trào \"Ba sẵn sàng\" (sẵn sàng chiến đấu, sẵn sàng gia nhập lực lượng vũ trang, sẵn sàng đi bất cứ đâu, làm bất cứ việc gì Tổ quốc cần). Phong trào này thu hút hàng triệu đoàn viên, thanh niên nhập ngũ và tham gia thanh niên xung phong, góp phần quyết định vào thắng lợi chung. Các phong trào còn lại gắn với những giới quần chúng khác chứ không phải tên phong trào tiêu biểu của thanh niên miền Bắc.","Nếu đề đổi đối tượng sang phụ nữ miền Bắc thì chọn \"Ba đảm đang\"; nếu hỏi công nhân thì chọn \"Tay búa, tay súng\"; nếu hỏi nông dân thì chọn \"Tay cày, tay súng\"; còn nếu hỏi thanh niên miền Nam thì chọn phong trào \"Năm xung phong\"."],[75,2,"Sự kiện nào mở đầu cho sự hòa hoãn giữa Việt Nam và Pháp?",["Pháp ngừng bắn ở miền Nam","Tạm ước Việt Pháp được ký kết","Đảng Cộng sản Đông Dương tuyên bố tự giải tán","Hiệp định Sơ bộ được ký kết"],3,"Trước tình thế Hiệp ước Hoa - Pháp (28/2/1946) được ký kết cho phép quân Pháp ra Bắc thay quân Tưởng, Ban Thường vụ Trung ương Đảng đã chọn giải pháp \"hòa để tiến\" và ký Hiệp định Sơ bộ ngày 6/3/1946 với đại diện Chính phủ Pháp (Jean Sainteny). Sự kiện này mở đầu giai đoạn hòa hoãn tạm thời giữa ta và Pháp, giúp ta loại nhanh 20 vạn quân Tưởng cùng tay sai về nước và có thêm thời gian quý báu chuẩn bị lực lượng cho cuộc kháng chiến lâu dài. Tạm ước 14/9/1946 chỉ là bước tiếp nối để kéo dài thêm thời gian hòa hoãn, còn Đảng tuyên bố tự giải tán là sách lược đối phó quân Tưởng cuối năm 1945.","Nếu đề hỏi văn kiện nào \"tiếp tục kéo dài thêm\" thời gian hòa hoãn sau khi Hội nghị Phôngtennơblô thất bại thì chọn Tạm ước Việt - Pháp (14/9/1946); nếu hỏi sự kiện gạt mũi nhọn công kích của quân Tưởng và tay sai cuối năm 1945 thì chọn Đảng Cộng sản Đông Dương tuyên bố tự giải tán (11/11/1945)."],[76,2,"Hiệp định sơ bộ về cuộc đàm phán với thực dân Pháp được ký kết với thực dân Pháp vào ngày tháng năm nào?",["Ngày 6 tháng 3 năm 1945","Ngày 9 tháng 3 năm 1945","Ngày 14 tháng 9 năm 1946","Ngày 6 tháng 3 năm 1946"],3,"Vào chiều ngày 6/3/1946 tại Hà Nội, Chủ tịch Hồ Chí Minh thay mặt Chính phủ Việt Nam Dân chủ Cộng hòa và Jean Sainteny thay mặt Chính phủ Pháp đã ký bản Hiệp định Sơ bộ. Theo đó, Pháp công nhận Việt Nam là một quốc gia tự do có Chính phủ, Nghị viện, quân đội và tài chính riêng nằm trong Liên bang Đông Dương thuộc khối Liên hiệp Pháp, đổi lại ta đồng ý cho 15.000 quân Pháp ra Bắc thay thế quân Tưởng và rút dần trong 5 năm. Các mốc năm 1945 (9/3/1945 là Nhật đảo chính Pháp) và 14/9/1946 (ngày ký Tạm ước) đều là phương án nhiễu dễ nhầm.","Nếu đề hỏi ngày ký Tạm ước Việt - Pháp tại Pháp nhằm nhân nhượng thêm một số quyền lợi kinh tế - văn hóa để kéo dài hòa bình thì chọn ngày 14 tháng 9 năm 1946; nếu hỏi ngày phát xít Nhật đảo chính thực dân Pháp ở Đông Dương thì chọn ngày 9 tháng 3 năm 1945."],[77,2,"Để gạt mũi nhọn tiến công của kẻ thù, Đảng ta đã tuyên bố tự giải tán vào ngày tháng năm nào và lấy tên gọi là gì?",["2-9-1945 – Đảng Cộng sản Đông Dương","25-11-1945 – Hội nghiên cứu Chủ nghĩa Mác - Lênin","3-2-1946 – Đảng Lao động Việt Nam","11-11-1945 – Hội nghiên cứu Chủ nghĩa Mác ở Đông Dương"],3,"Trước âm mưu \"diệt Cộng, cầm Hồ\" của 20 vạn quân Tưởng cùng các đảng phái tay sai Việt Quốc, Việt Cách cuối năm 1945, ngày 11/11/1945, Đảng Cộng sản Đông Dương ra thông cáo tuyên bố \"tự ý giải tán\" nhưng thực chất rút vào hoạt động bí mật, chỉ giữ lại bộ phận công khai mang tên \"Hội nghiên cứu Chủ nghĩa Mác ở Đông Dương\". Sách lược khôn khéo này vừa gạt bỏ mũi nhọn công kích của kẻ thù, vừa giữ vững vai trò lãnh đạo tuyệt đối của Đảng đối với chính quyền cách mạng. Các mốc khác đều nhầm sự kiện: 2/9/1945 là Quốc khánh, 25/11/1945 là ngày ra Chỉ thị \"Kháng chiến kiến quốc\", còn tên Đảng Lao động Việt Nam ra đời tại Đại hội II (2/1951).","Nếu đề hỏi ngày Ban Chấp hành Trung ương ra Chỉ thị \"Kháng chiến kiến quốc\" thì chọn 25/11/1945; nếu hỏi thời điểm Đảng ra hoạt động công khai trở lại với tên gọi \"Đảng Lao động Việt Nam\" thì chọn Đại hội lần thứ II (tháng 2/1951)."],[78,2,"Cuộc tổng giao chiến lịch sử mở đầu của kháng chiến chống thực dân Pháp của quân và dân ta ở Hà Nội đã diễn ra trong:",["30 ngày đêm","90 ngày đêm","45 ngày đêm","60 ngày đêm"],3,"Mở đầu toàn quốc kháng chiến chống thực dân Pháp từ đêm 19/12/1946 đến ngày 17/2/1947, quân và dân Thủ đô Hà Nội (nòng cốt là Trung đoàn Thủ đô với lời thề \"Quyết tử cho Tổ quốc quyết sinh\") đã chiến đấu kiên cường suốt 60 ngày đêm giữa vòng vây địch. Cuộc chiến đấu này đã giam chân, tiêu hao lớn sinh lực quân Pháp tại nội đô, tạo điều kiện cho cơ quan đầu não Trung ương, Chính phủ và nhân dân di chuyển an toàn lên căn cứ địa Việt Bắc chuẩn bị kháng chiến lâu dài. Các con số 30, 45 hay 90 ngày đêm đều không đúng với mốc lịch sử của mặt trận Hà Nội.","Nếu đề hỏi thời gian diễn ra chiến dịch Điện Biên Phủ (từ 13/3 đến 7/5/1954) thì nhớ mốc \"56 ngày đêm khoét núi, ngủ hầm, mưa dầm, cơm vắt\"; còn nếu hỏi cuộc tổng giao chiến mở đầu tại Hà Nội (19/12/1946 - 17/2/1947) thì luôn chọn \"60 ngày đêm\"."],[79,2,"Trên cơ sở theo dõi tình hình địch ở Điện Biên Phủ, Đại tướng Võ Nguyên Giáp đã quyết định thay đổi chiến lược, thực hiện phương châm:",["Đánh nhanh, thắng nhanh","Cơ động, chủ động, linh hoạt","Đánh nhanh, tiến chắc","Đánh chắc, tiến chắc"],3,"Trong quá trình chuẩn bị chiến dịch Điện Biên Phủ (tháng 1/1954), nhận thấy thực dân Pháp đã tăng cường quân số, củng cố tập đoàn cứ điểm phòng ngự cực mạnh mà bộ đội ta chưa đủ kinh nghiệm đánh công kiên quy mô lớn, Đại tướng Võ Nguyên Giáp đã đưa ra \"quyết định khó khăn nhất trong cuộc đời chỉ huy\" vào ngày 26/1/1954: chuyển phương châm tác chiến từ \"đánh nhanh, giải quyết nhanh\" sang \"đánh chắc, tiến chắc\". Quyết định sáng suốt này giúp ta bóc vỏ từng cụm cứ điểm, bảo toàn lực lượng và làm nên chiến thắng lịch sử ngày 7/5/1954. Phương án \"Cơ động, chủ động, linh hoạt\" là phương châm chỉ đạo tác chiến chung của chiến cuộc Đông - Xuân 1953-1954.","Nếu đề hỏi phương châm dự kiến ban đầu trước ngày 26/1/1954 ở Điện Biên Phủ thì chọn \"Đánh nhanh, thắng nhanh\" (đánh nhanh, giải quyết nhanh); nếu hỏi phương châm tác chiến chiến lược của toàn bộ chiến cuộc Đông - Xuân 1953-1954 do Bộ Chính trị đề ra tháng 9/1953 thì chọn \"tích cực, chủ động, cơ động, linh hoạt\"."],[80,2,"Chủ tịch Hồ Chí Minh ra lời kêu gọi đồng bào, chiến sỹ cả nước: “Trung Nam Bắc đều là bờ cõi của ta, nước ta sẽ nhất định thống nhất, đồng bào cả nước nhất định được giải phóng\" vào thời gian nào?",["Ngày 4-7-1955","Ngày 12-8-1955","Ngày 25-8-1954","Ngày 22-7-1954"],3,"Ngay sau khi Hiệp định Giơnevơ về chấm dứt chiến tranh, lập lại hòa bình ở Đông Dương được ký kết (21/7/1954), đất nước tạm thời bị chia cắt làm hai miền lấy vĩ tuyến 17 làm giới tuyến quân sự tạm thời. Ngày 22/7/1954, Chủ tịch Hồ Chí Minh đã ra Lời kêu gọi đồng bào và cán bộ, chiến sĩ cả nước, khẳng định quyết tâm đấu tranh thống nhất nước nhà với câu nói bất hủ: \"Trung Nam Bắc đều là bờ cõi của ta, nước ta nhất định sẽ thống nhất, đồng bào cả nước nhất định được giải phóng\". Các mốc tháng 8/1954 hay năm 1955 đều sai so với thời điểm ra Lời kêu gọi ngay sau Hiệp định Giơnevơ.","Nếu đề hỏi ngày ký kết chính thức Hiệp định Giơnevơ về Đông Dương thì chọn ngày 21/7/1954 (văn bản ghi 20/7/1954); nếu hỏi Hội nghị Trung ương nào ngay trước đó (15-17/7/1954) xác định đế quốc Mỹ là kẻ thù chính của nhân dân Đông Dương thì chọn Hội nghị Trung ương lần thứ 6 khóa II."],[81,2,"Chiến khu cách mạng nào được gọi là Đệ tứ chiến khu?",["Quang Trung","Hoàng Hoa Thám","Lê Lợi","Trần Hưng Đạo"],3,"Ngày 8/6/1945, trên cơ sở phong trào khởi nghĩa từng phần mạnh mẽ của công nhân mỏ và nhân dân vùng duyên hải Đông Bắc, Chiến khu Trần Hưng Đạo (tức Chiến khu Đông Triều, thuộc địa bàn Quảng Ninh - Hải Dương - Hải Phòng ngày nay) chính thức được thành lập và mang tên gọi là Đệ tứ chiến khu. Đây là căn cứ địa quan trọng tạo bàn đạp giải phóng vùng Đông Bắc tiến tới Cách mạng Tháng Tám năm 1945. Các chiến khu Quang Trung (Hòa - Ninh - Thanh), Hoàng Hoa Thám (Bắc Sơn - Võ Nhai) hay Lê Lợi thuộc các địa bàn khác và không mang danh xưng Đệ tứ chiến khu.","Nếu đề hỏi tên gọi khác gắn với địa danh của Chiến khu Trần Hưng Đạo thì chọn Chiến khu Đông Triều; nếu hỏi chiến khu ở vùng Hòa Bình - Ninh Bình - Thanh Hóa thì chọn Chiến khu Quang Trung; còn vùng Bắc Sơn - Võ Nhai gắn với Chiến khu Hoàng Hoa Thám (nằm trong Khu giải phóng Việt Bắc)."],[82,2,"Đại hội nào của Đảng đã quyết định tách 3 Đảng bộ Đảng Cộng sản ở 3 nước Việt Nam, Lào và Campuchia?",["Đại hội I","Đại hội IV","Đại hội III","Đại hội II"],3,"Tại Đại hội đại biểu toàn quốc lần thứ II của Đảng họp tại Chiêm Hóa (Tuyên Quang) tháng 2/1951, căn cứ vào sự trưởng thành của phong trào cách mạng và đặc điểm riêng của từng dân tộc trên bán đảo Đông Dương, Đảng quyết định tách Đảng Cộng sản Đông Dương thành ba đảng cách mạng riêng biệt ở Việt Nam, Lào và Campuchia để trực tiếp lãnh đạo cuộc kháng chiến ở mỗi nước. Ở Việt Nam, Đảng ra hoạt động công khai với tên gọi Đảng Lao động Việt Nam. Đại hội I (1935) khôi phục tổ chức Đảng, Đại hội III (1960) đề ra hai chiến lược cách mạng hai miền, còn Đại hội IV (1976) là Đại hội sau thống nhất đất nước.","Nếu đề hỏi Đại hội nào đổi tên Đảng thành \"Đảng Cộng sản Việt Nam\" thì chọn Đại hội IV (12/1976); nếu hỏi Đại hội lần đầu tiên tổ chức trong nước và thông qua Chính cương Đảng Lao động Việt Nam thì vẫn chọn Đại hội II (2/1951); còn Đại hội đề ra đường lối đồng thời hai chiến lược cách mạng ở hai miền là Đại hội III (9/1960)."],[83,2,"Theo Chính cương Đảng Lao động Việt Nam, hai đối tượng của cách mạng Việt Nam là:",["Chủ nghĩa đế quốc xâm lược, cụ thể là thực dân Pháp","Địa chủ phong kiến, đặc biệt là phong kiến phản động","Đế quốc và phong kiến","Thực dân Pháp và phong kiến phản động"],3,"Chính cương Đảng Lao động Việt Nam thông qua tại Đại hội II (2/1951) phân định rõ hai đối tượng của cách mạng Việt Nam lúc bấy giờ: đối tượng chính là chủ nghĩa đế quốc xâm lược (cụ thể là thực dân Pháp và bọn can thiệp Mỹ), và đối tượng phụ là phong kiến (cụ thể là phong kiến phản động câu kết với đế quốc). Việc chỉ rõ \"phong kiến phản động\" thể hiện sách lược phân hóa địa chủ, chỉ đánh vào bộ phận phản động để tranh thủ địa chủ yêu nước vào mặt trận kháng chiến. Các phương án khác hoặc chỉ nêu một vế, hoặc nêu chung chung \"Đế quốc và phong kiến\" nên chưa thể hiện đúng sự phân hóa sắc bén của Chính cương năm 1951.","Nếu đề hỏi riêng \"đối tượng chính\" trong Chính cương năm 1951 thì chọn chủ nghĩa đế quốc xâm lược (cụ thể là thực dân Pháp và bọn can thiệp Mỹ); nếu hỏi riêng \"đối tượng phụ\" thì chọn phong kiến phản động; còn nếu hỏi kẻ thù trong Luận cương 10/1930 thì mới là đế quốc và phong kiến nói chung."],[84,2,"Chính cương của Đảng Lao động Việt Nam tháng 2 - 1951 đã nêu ra các tính chất của xã hội Việt Nam là:",["Dân tộc và dân chủ mới","Dân chủ và dân tộc","Dân chủ tư sản","Dân chủ nhân dân, một phần thuộc địa và nửa phong kiến"],3,"Đến năm 1951, dưới sự lãnh đạo của Đảng, cách mạng Việt Nam đã xây dựng được vùng tự do rộng lớn với chính quyền dân chủ nhân dân, trong khi thực dân Pháp chỉ còn chiếm đóng một bộ phận lãnh thổ và tàn dư phong kiến vẫn tồn tại. Do đó, Chính cương Đảng Lao động Việt Nam (2/1951) xác định chính xác xã hội Việt Nam lúc này có ba tính chất: \"dân chủ nhân dân, một phần thuộc địa và nửa phong kiến\". Các phương án như \"Dân tộc và dân chủ mới\" hay \"Dân chủ tư sản\" là khái niệm về tính chất cách mạng hoặc sai lệch với thực tế xã hội năm 1951.","Nếu đề hỏi tính chất của xã hội Việt Nam giai đoạn trước Cách mạng Tháng Tám 1945 thì chọn \"thuộc địa nửa phong kiến\"; nếu đề hỏi tính chất của \"cuộc cách mạng\" Việt Nam trong Chính cương năm 1951 (không phải tính chất xã hội) thì chọn \"cách mạng dân tộc dân chủ nhân dân\"."],[85,2,"Ý nghĩa của chiến thắng Biên giới Thu – Đông đối với cách mạng Việt Nam là:",["Giáng một đòn nặng nề vào ý chí xâm lược của địch, đập tan tuyến phòng thủ và giải phóng hoàn toàn khu vực biên giới, nối liền Việt Nam và các nước xung quanh","Đánh dấu sự trưởng thành vượt bậc về trình độ chiến đấu của quân đội Việt Nam","Quân ta đã giành được thế chủ động hoàn toàn trên chiến trường Bắc Bộ, tạo bước chuyển biến lớn của kháng chiến vào giai đoạn mới","Tiêu diệt một bộ phận quan trọng sinh lực địch, khai thông biên giới, mở rộng và củng cố căn cứ địa kháng chiến Việt Bắc"],3,"Chiến thắng Biên giới Thu – Đông 1950 đã tiêu diệt một bộ phận quan trọng sinh lực địch, giải phóng tuyến biên giới dài 750 km từ Cao Bằng đến Đình Lập, khai thông con đường liên lạc với Trung Quốc và các nước xã hội chủ nghĩa, đồng thời mở rộng và củng cố căn cứ địa Việt Bắc. Các phương án nhiễu sai ở chỗ nói nối liền với \"các nước xung quanh\" quá chung chung hoặc khẳng định ta giành thế chủ động \"hoàn toàn\" trong khi thực tế ta mới giành quyền chủ động trên chiến trường chính Bắc Bộ.","Nếu đề hỏi chiến thắng nào đánh dấu bước ngoặt chuyển cuộc kháng chiến sang giai đoạn tiến công và giành quyền chủ động trên chiến trường chính Bắc Bộ thì cũng chọn Biên giới Thu – Đông 1950; còn nếu hỏi đập tan âm mưu \"đánh nhanh, thắng nhanh\" thì chọn Việt Bắc Thu – Đông 1947."],[86,2,"Ngay sau khi quyết định chọn chiến dịch Điện Biên Phủ là trận quyết chiến, chiến lược ban đầu của TƯ Đảng đã xác định phương châm:",["Đánh chắc, tiến chắc","Đánh chậm, tiến chắc","Chắc thắng mới đánh, không chắc thắng không đánh","Đánh nhanh, thắng nhanh"],3,"Khi mới chọn Điện Biên Phủ làm điểm quyết chiến chiến lược cuối năm 1953 – đầu năm 1954, nhận định địch mới nhảy dù xuống còn nhiều sơ hở, Bộ Chỉ huy chiến dịch ban đầu xác định phương châm \"Đánh nhanh, thắng nhanh\". Sau khi trinh sát thực tế thấy Pháp đã củng cố tập đoàn cứ điểm rất mạnh, ngày 26/1/1954 Đại tướng Võ Nguyên Giáp mới quyết định chuyển sang \"Đánh chắc, tiến chắc\".","Đọc kỹ chữ \"ban đầu\" để chọn \"Đánh nhanh, thắng nhanh\"; nếu đề hỏi phương châm đã được điều chỉnh ngày 26/1/1954 và đem lại thắng lợi quyết định tại Điện Biên Phủ thì chọn \"Đánh chắc, tiến chắc\"."],[87,2,"Ai được cử làm Bí thư Trung ương cục miền Nam đầu tiên?",["Phạm Hùng","Lê Duẩn","Lê Đức Thọ","Nguyễn Văn Linh"],1,"Thực hiện nghị quyết Đại hội II, tại Hội nghị Trung ương lần thứ nhất (3/1951), Trung ương Đảng quyết định giải thể Xứ ủy Nam Bộ để thành lập Trung ương Cục miền Nam nhằm trực tiếp chỉ đạo kháng chiến ở Nam Bộ và cử đồng chí Lê Duẩn làm Bí thư đầu tiên. Lê Đức Thọ giữ cương vị Phó Bí thư, còn Nguyễn Văn Linh và Phạm Hùng đảm nhiệm chức Bí thư Trung ương Cục ở các giai đoạn kháng chiến chống Mỹ sau này.","Nếu đề hỏi Phó Bí thư Trung ương Cục miền Nam năm 1951 thì chọn Lê Đức Thọ; hỏi Bí thư khi tái lập Trung ương Cục miền Nam năm 1961 thì chọn Nguyễn Văn Linh; hỏi Bí thư Trung ương Cục giai đoạn 1967–1975 thì chọn Phạm Hùng."],[88,2,"Đến năm 1951, Đảng ta đã tiến hành bao nhiêu kỳ Đại hội và trong khoảng thời gian nào?",["1 kỳ Đại hội vào tháng 2 - 1930","3 kỳ Đại hội vào tháng 2 – 1930, 3 – 1935 và 2 - 1951","4 kỳ Đại hội vào tháng 2 – 1930, 10 – 1930, 3 – 1935 và 2 - 1951","2 kỳ Đại hội vào tháng 3 – 1935 và tháng 2 – 1951"],3,"Tính đến năm 1951, Đảng ta đã tiến hành chính thức 2 kỳ Đại hội đại biểu toàn quốc là Đại hội lần thứ I vào tháng 3/1935 (tại Ma Cao, Trung Quốc) và Đại hội lần thứ II vào tháng 2/1951 (tại Chiêm Hóa, Tuyên Quang). Hội nghị thành lập Đảng tháng 2/1930 tuy có giá trị như một Đại hội nhưng không tính là Đại hội toàn quốc thứ nhất, còn tháng 10/1930 là Hội nghị Trung ương lần thứ nhất.","Đừng cộng gộp Hội nghị hợp nhất tháng 2/1930 hay Hội nghị Trung ương tháng 10/1930 vào số kỳ Đại hội. Nếu đề hỏi đến năm 1960 Đảng đã họp mấy kỳ Đại hội thì chọn 3 kỳ (thêm Đại hội III tháng 9/1960 tại Hà Nội)."],[89,2,"Để phá thế bao vây cô lập, phát triển lực lượng và giành thế chủ động, tháng 6 – 1950, lần đầu tiên TƯ Đảng đã chủ trương mở chiến dịch tiến công quy mô lớn. Đó là:",["Chiến dịch Việt Bắc","Chiến dịch Tây Bắc","Chiến dịch Thượng Lào","Chiến dịch Biên Giới"],3,"Tháng 6/1950, trước tình hình cách mạng Trung Quốc thắng lợi và âm mưu khóa chặt biên giới Việt – Trung của Pháp theo kế hoạch Rơve, Trung ương Đảng quyết định mở Chiến dịch Biên Giới (9–10/1950) nhằm tiêu diệt sinh lực địch, khai thông biên giới và mở rộng căn cứ địa Việt Bắc. Đây là chiến dịch tiến công quy mô lớn đầu tiên do quân ta chủ động mở, khác với Chiến dịch Việt Bắc 1947 mang tính chất phản công.","Nếu đề hỏi chiến dịch phản công lớn đầu tiên đánh bại cuộc tiến công mùa Đông của Pháp năm 1947 thì chọn Chiến dịch Việt Bắc; còn Chiến dịch Tây Bắc (1952) và Thượng Lào (1953) là các chiến dịch tiến công giữ vững quyền chủ động sau năm 1950."],[90,2,"Tháng 3 – 1951, Đại hội thống nhất Việt Minh và Liên Việt thành:",["Mặt trận Việt Nam cách mạng thanh niên","Mặt trận Việt Minh","Mặt trận Tổ Quốc","Mặt trận Liên hiệp quốc dân Việt Nam (Liên Việt)"],3,"Thực hiện chủ trương mở rộng khối đại đoàn kết dân tộc sau Đại hội II, từ ngày 3 đến 7/3/1951 tại Tuyên Quang đã diễn ra Đại hội hợp nhất Mặt trận Việt Minh và Hội Liên hiệp quốc dân Việt Nam (Liên Việt) thành một mặt trận thống nhất lấy tên là Mặt trận Liên hiệp quốc dân Việt Nam (gọi tắt là Mặt trận Liên Việt), do cụ Tôn Đức Thắng làm Chủ tịch. Mặt trận Tổ quốc Việt Nam đến tháng 9/1955 mới được thành lập.","Phân biệt mốc các mặt trận: Việt Minh thành lập ngày 19/5/1941 (Hội nghị Trung ương 8); Hội Liên Việt thành lập tháng 5/1946; hợp nhất Việt Minh – Liên Việt tháng 3/1951 thành Mặt trận Liên Việt; Mặt trận Tổ quốc Việt Nam ra đời tháng 9/1955."],[91,2,"Ngày 15 tháng 10 năm 1947 để đối phó với cuộc tấn công của thực dân Pháp lên căn cứ địa Việt Bắc, Ban Thường vụ TƯ Đảng đã đề ra:",["Lời kêu gọi đánh giặc Pháp xâm lược","Chủ trương tấn công quân Pháp từ phía sau lưng chúng","Chỉ thị kháng chiến, kiến quốc","Chỉ thị “Phá tan cuộc tấn công mùa Đông của giặc Pháp”"],3,"Ngày 7/10/1947, thực dân Pháp huy động hơn một vạn quân mở cuộc tấn công quy mô lớn lên căn cứ địa Việt Bắc hòng tiêu diệt cơ quan đầu não kháng chiến. Trước tình thế khẩn cấp, ngày 15/10/1947 Ban Thường vụ Trung ương Đảng ban hành Chỉ thị \"Phá tan cuộc tấn công mùa Đông của giặc Pháp\", vạch rõ chỗ yếu của địch và phương châm bao vây, bẻ gãy hai gọng kìm địch.","Nếu đề hỏi văn kiện ngày 25/11/1945 nhằm định hướng xây dựng và bảo vệ chính quyền non trẻ thì chọn Chỉ thị \"Kháng chiến kiến quốc\"; nếu hỏi văn kiện ngày 22/12/1946 đề ra đường lối kháng chiến thì chọn Chỉ thị \"Toàn dân kháng chiến\"."],[92,2,"Hiệp định Giơnevơ quy định thời gian tiến hành hiệp thương tổng tuyển cử thống nhất 2 miền Nam Bắc vào thời gian nào?",["Tháng 7 năm 1955","Tháng 7 năm 1957","Tháng 7 năm 1954","Tháng 7 năm 1956"],3,"Theo Tuyên bố cuối cùng của Hội nghị Giơnevơ (21/7/1954), các nước tham dự cam kết tôn trọng độc lập, chủ quyền, thống nhất và toàn vẹn lãnh thổ của Việt Nam; sau hai năm kể từ ngày ký hiệp định, hai miền sẽ tiến hành tổng tuyển cử tự do trong cả nước vào tháng 7/1956 dưới sự kiểm soát của Ủy ban quốc tế để thống nhất đất nước. Tháng 7/1955 là mốc bắt đầu gặp gỡ hiệp thương giữa hai miền để chuẩn bị cho cuộc tổng tuyển cử này.","Nhớ quy tắc \"cộng 2 năm\": ký Hiệp định Giơnevơ vào tháng 7/1954, gặp gỡ hiệp thương chuẩn bị vào tháng 7/1955 và tổng tuyển cử thống nhất đất nước vào tháng 7/1956."],[93,2,"Hiệp định Giơnevơ quy định giới tuyến quân sự tạm thời giữa ta và thực dân Pháp tại vĩ tuyến bao nhiêu?",["Vĩ tuyến 16","Vĩ tuyến 18","Vĩ tuyến 20","Vĩ tuyến 17"],3,"Hiệp định Giơnevơ về đình chỉ chiến sự ở Việt Nam quy định lấy vĩ tuyến 17 (dọc sông Bến Hải, tỉnh Quảng Trị) làm giới tuyến quân sự tạm thời để hai bên tập kết, chuyển quân trong vòng 300 ngày, tuyệt đối không coi đây là ranh giới chính trị hay lãnh thổ. Phương án vĩ tuyến 16 là mốc phân chia khu vực giải giáp quân Nhật của quân Đồng minh năm 1945 nên dễ gây nhầm lẫn.","Phân biệt rạch ròi hai vĩ tuyến hay thi: nếu đề hỏi ranh giới quân Tưởng (phía Bắc) và quân Anh (phía Nam) vào giải giáp phát xít Nhật theo Hội nghị Pôtxđam 1945 thì chọn vĩ tuyến 16; hỏi giới tuyến tạm thời theo Hiệp định Giơnevơ 1954 thì chọn vĩ tuyến 17."],[94,2,"Với thế chủ động trên chiến trường, từ cuối 1950 đến đầu 1953 quân ta đã tổ chức nhiều chiến dịch tiêu diệt, tiêu hao sinh lực địch. Đó là những chiến dịch nào?",["Chiến dịch Việt Bắc; Chiến dịch Biên Giới; Chiến dịch Đường 18","Chiến dịch Biên Giới, chiến dịch Tây Bắc, chiến dịch Thượng Lào","Chiến dịch Trung Lào, chiến dịch Tây Nguyên, chiến dịch Điện Biên Phủ","Chiến dịch Hòa Bình; Chiến dịch Tây Bắc Thu Đông; Chiến dịch Thượng Lào"],3,"Phát huy quyền chủ động chiến lược sau thắng lợi Biên giới Thu – Đông 1950, từ cuối năm 1950 đến đầu năm 1953 quân ta liên tiếp mở các chiến dịch tiến công ở trung du, đồng bằng và rừng núi, tiêu biểu là Chiến dịch Hòa Bình (cuối 1951 – đầu 1952), Chiến dịch Tây Bắc Thu – Đông (1952) và Chiến dịch Thượng Lào (Xuân – Hè 1953). Các cụm phương án khác đều lẫn chiến dịch ngoài mốc thời gian như Việt Bắc (1947) hay Điện Biên Phủ (1954).","Chú ý mốc thời gian \"từ cuối 1950 đến đầu 1953\" để loại ngay các đáp án chứa Chiến dịch Việt Bắc (1947), Chiến dịch Biên Giới (9–10/1950) hoặc cụm chiến cuộc Đông – Xuân 1953–1954 (Trung Lào, Tây Nguyên, Điện Biên Phủ)."],[95,2,"Trong giai đoạn chống chiến tranh phá hoại (1965 - 1968), lý do nào là cơ bản nhất miền Bắc đẩy mạnh phát triển kinh tế địa phương, nhất là chú trọng phát triển nông nghiệp?",["Đảm bảo cho nhu cầu chiến đấu tại chỗ","Đảm bảo đời sống cho nhân dân địa phương","Hạn chế được sự tàn phá của chiến tranh","Miền Bắc phải thực hiện đầy đủ nghĩa vụ của hậu phương lớn, chi viện theo yêu cầu về sức người sức của cho miền Nam"],3,"Trước việc Mỹ mở rộng chiến tranh cục bộ ở miền Nam và leo thang đánh phá miền Bắc (1965–1968), Hội nghị Trung ương 11 (3/1965) và 12 (12/1965) chủ trương chuyển hướng xây dựng kinh tế miền Bắc, đẩy mạnh kinh tế địa phương và nông nghiệp nhằm giữ vững sản xuất trong chiến tranh để làm tròn nghĩa vụ cao nhất của hậu phương lớn, chi viện sức người, sức của cho tiền tuyến lớn miền Nam. Đáp ứng nhu cầu tại chỗ hay đời sống địa phương là mục tiêu trực tiếp nhưng đều phục vụ lý do cơ bản nhất ấy.","Nếu đề hỏi vai trò của hai miền trong Đại hội III (9/1960) thì nhớ: miền Bắc giữ vai trò \"quyết định nhất\" đối với sự phát triển toàn bộ cách mạng cả nước, còn miền Nam giữ vai trò \"quyết định trực tiếp\" đối với sự nghiệp giải phóng miền Nam."],[96,2,"Chiến lược “Việt Nam hóa chiến tranh” của Nich-xơn có gì giống so với chiến lược “Chiến tranh cục bộ”?",["Về vai trò của “ấp chiến lược”","Về vai trò của quân đội Mỹ","Vai trò của quân đội Ngụy","Về mục đích của chiến tranh"],3,"Cả \"Chiến tranh cục bộ\" (1965–1968) dưới thời Giôn-xơn và \"Việt Nam hóa chiến tranh\" (1969–1973) dưới thời Ních-xơn đều có điểm giống nhau cơ bản về mục đích: tiến hành chiến tranh xâm lược thực dân kiểu mới, biến miền Nam thành thuộc địa kiểu mới, căn cứ quân sự của Mỹ và chia cắt lâu dài Việt Nam. Chúng khác nhau rõ rệt về vai trò lực lượng nòng cốt: \"Chiến tranh cục bộ\" lấy quân viễn chinh Mỹ làm chủ yếu, còn \"Việt Nam hóa chiến tranh\" rút dần quân Mỹ và dùng quân đội Sài Gòn làm lực lượng chủ yếu.","Nếu đề hỏi điểm khác nhau cơ bản giữa \"Việt Nam hóa chiến tranh\" với \"Chiến tranh cục bộ\" thì chú ý vào vai trò quân Mỹ và quân đội Sài Gòn (công thức \"dùng người Việt đánh người Việt\", mở rộng sang toàn Đông Dương)."],[97,2,"Từ những năm 1950 trở đi, đế quốc Mỹ đã can thiệp ngày càng sâu vào cuộc chiến tranh ở Đông Dương. Đến năm 1954, viện trợ của Mỹ cho Pháp đã tăng bao nhiêu % trong ngân sách chiến tranh ở Đông Dương?",["50%","60%","73%","80%"],3,"Từ năm 1950, Mỹ từng bước can thiệp sâu để thay chân Pháp ở Đông Dương thông qua viện trợ quân sự và tài chính ngày càng lớn. Tỷ trọng viện trợ Mỹ trong tổng ngân sách chiến tranh Đông Dương của Pháp tăng nhanh từ khoảng 19% (1950) lên 73% (1953) và đạt tới 80% vào năm 1954 khi Pháp triển khai kế hoạch Nava.","Nhớ mốc tăng dần của viện trợ Mỹ cho Pháp: năm 1953 là 73% và năm 1954 đạt đỉnh 80%; nếu đề đổi mốc hỏi năm 1953 thì chọn 73%, còn hỏi năm 1954 thì chọn 80%."],[98,2,"Cuối năm 1946, thực dân Pháp đã bội ước, liên tục tăng cường khiêu khích và lấn chiếm thêm một số địa điểm nào ở nước ta?",["Thành phố Hải Phòng, thị xã Lạng Sơn","Đà Nẵng, Sài Gòn","Hải Phòng, Hải Dương, Lào Cai, Yên Bái","Thành phố Hải phòng, thị xã Lạng Sơn, Đà Nẵng, Hà Nội"],3,"Bất chấp Hiệp định Sơ bộ (6/3/1946) và Tạm ước (14/9/1946), cuối năm 1946 thực dân Pháp ráo riết mở rộng đánh chiếm nhiều địa bàn trọng yếu nhằm đặt ta trước sự đã rồi: tháng 11/1946 Pháp đánh chiếm Hải Phòng và Lạng Sơn; tháng 12/1946 Pháp đổ bộ Đà Nẵng và liên tục gây xung đột, thảm sát, gửi tối hậu thư tại Hà Nội. Các phương án khác chỉ liệt kê thiếu địa danh hoặc nêu sai các tỉnh như Lào Cai, Yên Bái.","Ghi nhớ đủ bộ 4 điểm nóng cuối năm 1946 theo trình tự leo thang của Pháp: Hải Phòng, Lạng Sơn (11/1946) đến Đà Nẵng và Hà Nội (12/1946) — giọt nước tràn ly dẫn tới Toàn quốc kháng chiến đêm 19/12/1946."],[99,2,"Hội nghị Ban thường vụ Trung Đảng họp mở rộng quyết định phát động cuộc kháng chiến toàn quốc chống thực dân Pháp xâm lược lần thứ hai vào ngày tháng năm nào?",["Ngày 18 tháng 12 năm 1946","Ngày 20 tháng 12 năm 1946","Ngày 22 tháng 12 năm 1946","Ngày 19 tháng 12 năm 1946"],3,"Trước tối hậu thư ngang ngược của Pháp đòi giải giáp lực lượng tự vệ Thủ đô (18/12/1946), trong hai ngày 18 và 19/12/1946, Hội nghị Ban Thường vụ Trung ương Đảng họp mở rộng tại làng Vạn Phúc (Hà Đông) dưới sự chủ trì của Chủ tịch Hồ Chí Minh đã quyết định phát động cuộc kháng chiến toàn quốc bắt đầu từ đêm 19/12/1946. Các ngày 20/12 và 22/12 là mốc công bố các văn kiện tiếp theo sau khi tiếng súng toàn quốc đã nổ.","Phân biệt chuỗi mốc tháng 12/1946: ngày 19/12 phát động Toàn quốc kháng chiến và Bác Hồ viết Lời kêu gọi; sáng 20/12 Đài Tiếng nói Việt Nam phát Lời kêu gọi; ngày 22/12 Trung ương ra Chỉ thị \"Toàn dân kháng chiến\"."],[100,2,"Hội nghị quốc tế về chấm dứt chiến tranh, lập lại hòa bình ở Đông Dương đã diễn ra vào thời gian nào, ở đâu?",["Từ 15/8/1954 – 27/9/1954, tại Paris","Từ 17/7/1954 – 2/8/1954, tại Postdam","Từ 5/5/1954 – 10/10/1954, tại New York","Từ 8/5/1954 – 21/7/1954, tại Giơnevơ"],3,"Hội nghị quốc tế Giơnevơ bắt đầu bàn về vấn đề chấm dứt chiến tranh, lập lại hòa bình ở Đông Dương từ ngày 8/5/1954 — ngay một ngày sau chiến thắng lịch sử Điện Biên Phủ — và kết thúc vào ngày 21/7/1954 bằng việc ký kết các hiệp định đình chỉ chiến sự và thông qua Tuyên bố cuối cùng. Các địa điểm Paris (1973), Pôtxđam (1945) hay New York đều sai về cả thời gian lẫn sự kiện.","Phân biệt các hội nghị quốc tế lớn: Hội nghị Pôtxđam (7–8/1945) bàn về trật tự sau Thế chiến II và giải giáp Nhật; Hội nghị Giơnevơ (8/5–21/7/1954) kết thúc kháng chiến chống Pháp; Hội nghị Paris (1968–1973, ký 27/1/1973) buộc Mỹ rút quân trong kháng chiến chống Mỹ."],[101,2,"Chiến tranh phá hoại lần thứ nhất diễn ra trong khoảng thời gian nào?",["Ngày 5/8/1964 đến ngày 1/1/1968","Ngày 5/8/1964 đến ngày 1/11/1968","Ngày 7/2/1965 đến ngày 1/1/1968","Ngày 7/2/1965 đến ngày 1/11/1968"],3,"Ngày 7/2/1965, đế quốc Mỹ chính thức mở cuộc chiến tranh phá hoại miền Bắc lần thứ nhất bằng không quân và hải quân trên quy mô lớn, liên tục và ác liệt; đến ngày 1/11/1968, do thất bại nặng nề ở cả hai miền, Tổng thống Giôn-xơn buộc phải tuyên bố chấm dứt hoàn toàn việc ném bom miền Bắc không điều kiện. Mốc 5/8/1964 là sự kiện Vịnh Bắc Bộ mở đầu hành động leo thang đánh phá đơn lẻ, chưa phải chiến tranh phá hoại liên tục.","Phân biệt hai mốc dễ nhầm: ngày 5/8/1964 là Mỹ dựng \"sự kiện Vịnh Bắc Bộ\" đánh phá một số mục tiêu ven biển lần đầu; chiến tranh phá hoại lần thứ nhất tính từ 7/2/1965 đến 1/11/1968, còn lần thứ hai diễn ra từ 4/1972 đến 1/1973."],[102,2,"Quân đội của Trung Hoa Quốc dân đảng khi tiến vào Việt Nam đã làm gì?",["Sử dụng một bộ phận Quân đội Nhật chờ giải giáp, đánh úp trụ sở chính quyền cách mạng","Ngầm giúp đỡ, trang bị vũ khí cho quân Pháp, ủng hộ các hành động khiêu khích quân sự của Pháp","Cản trở về mặt ngoại giao, vận động các nước lớn không công nhận nước Việt Nam Dân chủ Cộng hoà","Sách nhiễu chính quyền cách mạng, đòi cải tổ Chính phủ, thay đổi Quốc kì, Hồ Chí Minh phải từ chức"],3,"Tháng 8/1945, lấy danh nghĩa Đồng minh vào giải giáp quân Nhật từ vĩ tuyến 16 trở ra, 20 vạn quân Trung Hoa Quốc dân đảng (Tưởng Giới Thạch) kéo theo bọn phản động Việt Quốc, Việt Cách đã liên tục sách nhiễu chính quyền cách mạng, đòi cải tổ Chính phủ, thay đổi Quốc kỳ, thậm chí đòi Chủ tịch Hồ Chí Minh từ chức nhằm lật đổ chính quyền nhân dân. Các hành động dùng quân Nhật đánh úp trụ sở cách mạng hay tiếp tay vũ khí cho Pháp ở miền Nam là việc làm của quân đội Anh.","Phân biệt hành động của quân Anh và quân Tưởng sau Cách mạng Tháng Tám: từ vĩ tuyến 16 trở vào là quân Anh ngầm trang bị vũ khí và mở đường cho Pháp tái xâm lược Nam Bộ; từ vĩ tuyến 16 trở ra là quân Tưởng cùng Việt Quốc, Việt Cách sách nhiễu, đòi cải tổ Chính phủ."],[103,2,"Tại sao ta chuyển từ chiến lược đánh Pháp sang chiến lược hoà hoãn nhân nhượng Pháp?",["Vì Pháp được Anh hậu thuẫn","Vì ta tránh tình trạng một lúc đối phó với nhiều kẻ thù","Vì Pháp được bọn phản động tay sai giúp đỡ","Vì Pháp và Tưởng đã bắt tay cấu kết với nhau chống ta"],3,"Đầu năm 1946, thực dân Pháp và chính phủ Tưởng Giới Thạch đã thỏa hiệp, ký Hiệp ước Hoa – Pháp (28/2/1946) để Pháp đưa quân ra Bắc thay thế quân Tưởng giải giáp phát xít Nhật. Trước cục diện hai kẻ thù bắt tay cấu kết chống ta, Đảng chủ trương chuyển từ đánh Pháp sang hòa hoãn, nhân nhượng có nguyên tắc với Pháp (ký Hiệp định Sơ bộ 6/3/1946) nhằm phân hóa kẻ thù, đẩy nhanh 20 vạn quân Tưởng về nước và tranh thủ thời gian chuẩn bị kháng chiến.","Lưu ý mối liên hệ nhân quả: nếu đề hỏi sự kiện trực tiếp dẫn đến quyết định hòa hoãn với Pháp đầu năm 1946 thì chọn việc Pháp – Tưởng cấu kết qua Hiệp ước Hoa – Pháp (28/2/1946); nếu hỏi mục tiêu sách lược khi ký Hiệp định Sơ bộ 6/3/1946 thì nhấn mạnh đẩy quân Tưởng về nước, tránh đối phó cùng lúc nhiều kẻ thù."],[104,2,"Những khó khăn, thách thức gì sau Cách mạng Tháng Tám năm 1945 đối với cách mạng Việt Nam?",["Đế quốc, phản động bao vây","Kinh tế nông nghiệp lạc hậu, kém phát triển","Chính quyền nhà nước non kém, dân số mù chữ","Thù trong, giặc ngoài, kinh tế kiệt quệ, nhân dân mù chữ, đói kém"],3,"Ngay sau Cách mạng Tháng Tám 1945, nước Việt Nam Dân chủ Cộng hòa rơi vào tình thế \"ngàn cân treo sợi tóc\" với đầy đủ ba nhóm khó khăn chồng chất: thù trong giặc ngoài bao vây tứ phía, kinh tế – tài chính kiệt quệ (ngân khố trống rỗng, nạn đói 1945 cướp đi khoảng 2 triệu người) và hơn 90% nhân dân mù chữ. Ba phương án nhiễu chỉ nêu được từng khía cạnh rời rạc, thiếu tính bao quát.","Khi gặp câu hỏi tổng hợp về bối cảnh sau Cách mạng Tháng Tám 1945, hãy tìm phương án nêu đủ cả 3 mặt: quân sự – chính trị (thù trong, giặc ngoài), kinh tế (kiệt quệ, đói kém) và văn hóa – xã hội (mù chữ)."],[105,2,"Trong “Chỉ thị kháng chiến kiến quốc” của Trung ương Đảng ngày 25/11/1945, Đảng ta đã xác định kẻ thù chính của cách mạng Việt Nam là ai?",["Quân đội Tưởng Giới Thạch","Quân đội phát xít Nhật","Quân đội thực dân Anh","Thực dân Pháp xâm lược"],3,"Trong Chỉ thị \"Kháng chiến kiến quốc\" ngày 25/11/1945, Ban Chấp hành Trung ương Đảng phân tích rõ âm mưu từng thế lực đế quốc và khẳng định kẻ thù chính của nhân dân Đông Dương lúc này là thực dân Pháp xâm lược, phải tập trung ngọn lửa đấu tranh vào chúng. Lý do là Pháp đã trực tiếp nổ súng tái xâm lược Nam Bộ (23/9/1945) và quyết tâm khôi phục nền thống trị thực dân lâu dài tại Việt Nam.","Đừng nhầm với quân Tưởng hay quân Nhật vì Nhật đã đầu hàng, còn Tưởng chỉ có mặt tạm thời với danh nghĩa giải giáp. Nếu đề hỏi khẩu hiệu hành động của Chỉ thị 25/11/1945 thì chọn \"Dân tộc trên hết, Tổ quốc trên hết\"."],[106,2,"Trong “Chỉ thị kháng chiến kiến quốc” của Trung ương Đảng ngày 15/11/1945, Đảng ta đã xác định những nhiệm vụ nào là chủ yếu và cấp bách cần khẩn trương thực hiện?",["Chống thực dân Pháp xâm lược, bầu cử Quốc hội, xóa nạn mù chữ","Bài trừ nội phản, chống đói, củng cố chính quyền, chống thực dân Pháp","Cải thiện đời sống cho nhân dân, thêm bạn bớt thù, chống nạn mù chữ","Củng cố chính quyền, chống thực dân Pháp xâm lược, bài trừ nội phản, cải thiện đời sống cho nhân dân"],3,"Chỉ thị \"Kháng chiến kiến quốc\" của Ban Chấp hành Trung ương Đảng xác định rõ bốn nhiệm vụ chủ yếu, cấp bách phải khẩn trương thực hiện là: củng cố chính quyền, chống thực dân Pháp xâm lược, bài trừ nội phản và cải thiện đời sống cho nhân dân. Trong đó, củng cố chính quyền cách mạng được đặt lên hàng đầu vì có giữ vững chính quyền mới đủ sức kháng chiến và kiến quốc.","Lưu ý nhỏ: câu hỏi gốc trong ngân hàng đề ghi nhầm ngày \"15/11/1945\", còn mốc lịch sử chuẩn trong giáo trình của Chỉ thị \"Kháng chiến kiến quốc\" là ngày 25/11/1945. Nếu đề hỏi nhiệm vụ nào quan trọng nhất trong 4 nhiệm vụ trên thì chọn \"Củng cố chính quyền\"."],[107,2,"Đảng ta đã lựa chọn giải pháp gì trong mối quan hệ với thực dân Pháp sau ngày Pháp và Tưởng ký hiệp ước Hoa-Pháp ở Trùng Khánh vào ngày 28/02/1946?",["Phát động toàn dân chống ngoại xâm","Kháng chiến chống thực dân Pháp","Nhân nhượng với quân Tưởng để tập trung đánh Pháp","Thương lượng và hòa hoãn với Pháp"],3,"Ngay khi biết Pháp và Tưởng ký Hiệp ước Hoa – Pháp tại Trùng Khánh (28/2/1946) thỏa thuận cho quân Pháp ra miền Bắc thay Tưởng, Ban Thường vụ Trung ương Đảng kịp thời đề ra chủ trương \"Hòa để tiến\", lựa chọn giải pháp thương lượng và hòa hoãn với Pháp. Đường lối sáng suốt này dẫn tới việc ký Hiệp định Sơ bộ (6/3/1946), giúp ta loại bớt một kẻ thù nguy hiểm là quân Tưởng và có thêm thời gian quý báu chuẩn bị lực lượng.","Phân biệt hai giai đoạn sách lược ngoại giao 1945–1946: trước ngày 6/3/1946 ta hòa với Tưởng ở miền Bắc để tập trung đánh Pháp ở miền Nam; sau Hiệp ước Hoa – Pháp (28/2/1946) ta chuyển sang thương lượng, hòa hoãn với Pháp để đuổi quân Tưởng về nước."],[108,2,"Sau ngày tuyên bố độc lập năm 1945, Chính phủ cách mạng lâm thời Việt Nam đã xác định các nhiệm vụ cấp bách cần giải quyết là gì?",["Chống giặc ngoại xâm, củng cố chính quyền cách mạng","Chống giặc ngoại xâm và nội phản","Khai khẩn đất hoang, tăng gia sản xuất, hàn gắn vết thương chiến tranh","Diệt giặc đói, giặc dốt và giặc ngoại xâm"],3,"Ngay ngày 3/9/1945 — một ngày sau lễ Tuyên ngôn Độc lập — tại phiên họp đầu tiên của Chính phủ lâm thời, Chủ tịch Hồ Chí Minh đã nêu 6 nhiệm vụ cấp bách trước mắt, khái quát thành ba nhiệm vụ trọng tâm sống còn của toàn dân tộc là diệt giặc đói, diệt giặc dốt và diệt giặc ngoại xâm. Các phương án còn lại đều thiếu yếu tố giải quyết nạn đói hoặc nạn mù chữ vốn đe dọa trực tiếp vận mệnh đất nước.","Phân biệt rõ cơ quan ban hành: Chính phủ lâm thời (3/9/1945) xác định 3 nhiệm vụ cấp bách là diệt giặc đói, giặc dốt và giặc ngoại xâm; còn Trung ương Đảng trong Chỉ thị \"Kháng chiến kiến quốc\" (25/11/1945) xác định 4 nhiệm vụ chủ yếu (củng cố chính quyền, chống Pháp, bài trừ nội phản, cải thiện đời sống)."],[109,2,"Hội nghị nào của Đảng mở đường cho phong trào “Đồng khởi” ở miền Nam năm 1960?",["Hội nghị Trung ương 12 - Khoá II của Đảng (3/1957)","Hội nghị Trung ương 13 - Khoá II của Đảng (12/1957)","Hội nghị Trung ương 14 - Khoá II của Đảng (11/1958)","Hội nghị Trung ương 15 - Khoá II của Đảng (1/1959)"],3,"Trước chính sách khủng bố đẫm máu của Mỹ – Diệm (như Luật 10/59), tháng 1/1959 Hội nghị Trung ương lần thứ 15 (khóa II) đã họp và ra Nghị quyết lịch sử xác định con đường phát triển cơ bản của cách mạng miền Nam là khởi nghĩa giành chính quyền về tay nhân dân bằng lực lượng chính trị kết hợp với lực lượng vũ trang. Nghị quyết này đã trực tiếp mở đường cho cao trào \"Đồng khởi\" bùng nổ mạnh mẽ ở Bến Tre và toàn miền Nam năm 1959–1960.","Nhớ đúng số hiệu và mốc thời gian: Hội nghị Trung ương 15 khóa II (1/1959) là bước ngoặt chuyển cách mạng miền Nam từ thế giữ gìn lực lượng sang thế tiến công. Các Hội nghị Trung ương 12, 13, 14 khóa II chủ yếu giải quyết vấn đề củng cố quốc phòng, tiền lương và kế hoạch 3 năm ở miền Bắc."],[110,2,"Chính cương của Đảng Lao động Việt Nam được thông qua tại Đại hội đại biểu toàn quốc lần thứ II, đã nêu lên 3 tính chất nào của xã hội Việt Nam?",["Dân tộc, dân chủ, xã hội chủ nghĩa","Nông nghiệp lạc hậu, thuộc địa, nửa phong kiến","Dân chủ mới, văn hóa mới, đời sống mới xã hội chủ nghĩa","Dân chủ nhân dân, một phần thuộc địa, nửa phong kiến"],3,"Chính cương của Đảng Lao động Việt Nam thông qua tại Đại hội đại biểu toàn quốc lần thứ II (2/1951) phân tích thực tiễn đất nước sau 5 năm kháng chiến và xác định xã hội Việt Nam có 3 tính chất: dân chủ nhân dân, một phần thuộc địa và nửa phong kiến. Sở dĩ gọi là \"một phần thuộc địa\" vì phần lớn lãnh thổ đã thuộc vùng tự do có chính quyền dân chủ nhân dân, còn vùng địch tạm chiếm vẫn chịu ách thuộc địa của Pháp.","Tránh nhầm với tính chất xã hội Việt Nam trước Cách mạng Tháng Tám 1945 là \"thuộc địa nửa phong kiến\". Khi đề nhắc \"Đại hội II\" hay \"Chính cương Đảng Lao động Việt Nam\", hãy chọn cụm đặc trưng \"dân chủ nhân dân, một phần thuộc địa, nửa phong kiến\"."],[111,2,"Chính cương của Đảng Lao động Việt Nam được thông qua tại Đại hội đại biểu toàn quốc lần thứ II, đã nêu lên 3 nhiệm vụ cơ bản nào của cách mạng Việt Nam?",["Bài trừ nội phản; tệ nạn xã hội và những hủ tục lạc hậu","Xây dựng đời sống mới; văn hóa mới; nếp sống mới","Diệt giặc đói; giặc dốt và giặc ngoại xâm","Đánh đuổi bọn đế quốc xâm lược, giành độc lập và thống nhất thật sự cho dân tộc; xoá bỏ những tàn tích phong kiến và nửa phong kiến, làm cho người cày có ruộng; phát triển chế độ dân chủ nhân dân, gây cơ sở cho chủ nghĩa xã hội"],3,"Từ việc xác định 3 tính chất xã hội Việt Nam, Chính cương Đảng Lao động Việt Nam (Đại hội II, 2/1951) nêu rõ 3 nhiệm vụ cơ bản của cách mạng là: đánh đuổi bọn đế quốc xâm lược giành độc lập thống nhất thật sự cho dân tộc; xóa bỏ tàn tích phong kiến và nửa phong kiến làm cho người cày có ruộng; phát triển chế độ dân chủ nhân dân, gây cơ sở cho chủ nghĩa xã hội. Ba nhiệm vụ này khăng khít nhau, trong đó nhiệm vụ hàng đầu là đánh đuổi đế quốc xâm lược.","Phân biệt với \"diệt giặc đói, giặc dốt, giặc ngoại xâm\" (nhiệm vụ cấp bách của Chính phủ lâm thời tháng 9/1945). Nếu đề hỏi nhiệm vụ nào được đặt lên hàng đầu trong 3 nhiệm vụ của Chính cương năm 1951 thì chọn nhiệm vụ đánh đuổi đế quốc xâm lược, giành độc lập dân tộc."],[112,2,"“Đẩy mạnh cách mạng xã hội chủ nghĩa ở miền Bắc; đồng thời tiến hành cách mạng dân tộc dân chủ nhân dân ở miền Nam, thực hiện thống nhất nước nhà, hoàn thành độc lập và dân chủ trong cả nước” là một trong những nhiệm vụ của cách mạng Việt Nam trong giai đoạn kháng chiến chống Mỹ cứu nước (1954-1975). Văn kiện nào thể hiện nhiệm vụ trên?",["Nghị quyết của Bộ Chính trị (9/1954)","Hội nghị trung ương lần thứ 15 (1/1959)","Hội nghị trung ương lần thứ 15 (4/1959)","Đại hội đại biểu toàn quốc lần thứ III (9/1960)"],3,"Đại hội đại biểu toàn quốc lần thứ III của Đảng (9/1960 tại Hà Nội) đã hoàn chỉnh đường lối chiến lược chung cho cả nước trong giai đoạn kháng chiến chống Mỹ: tiến hành đồng thời hai chiến lược cách mạng khác nhau ở hai miền — đẩy mạnh cách mạng xã hội chủ nghĩa ở miền Bắc và tiến hành cách mạng dân tộc dân chủ nhân dân ở miền Nam nhằm mục tiêu chung là hòa bình thống nhất Tổ quốc. Hội nghị Trung ương 15 (1/1959) mới tập trung giải quyết đường lối cách mạng miền Nam.","Nhớ mốc gắn với từng văn kiện chống Mỹ: Nghị quyết Bộ Chính trị (9/1954) chuyển hướng đấu tranh sau Hiệp định Giơnevơ; Hội nghị Trung ương 15 (1/1959) mở đường cho Đồng khởi ở miền Nam; Đại hội III (9/1960) xác lập đồng thời hai nhiệm vụ chiến lược ở hai miền."],[113,2,"Hội nghị nào của Đảng quyết định mở cuộc Tổng tiến công và nổi dậy giải phóng Sài Gòn trước tháng 5/1975?",["Hội nghị Trung ương 21 (7/1973)","Hội nghị Bộ Chính trị (10/1974)","Hội nghị Trung ương 23 (12/1974)","Hội nghị Bộ Chính trị (3/1975)"],3,"Sau thắng lợi thần tốc của Chiến dịch Tây Nguyên và giải phóng Huế – Đà Nẵng, tại cuộc họp tháng 3/1975 (cụ thể ngày 25/3/1975), Bộ Chính trị nhận định thời cơ chiến lược lớn đã đến nên quyết định bổ sung quyết tâm chiến lược, tập trung lực lượng mở cuộc Tổng tiến công và nổi dậy giải phóng Sài Gòn – Gia Định trước mùa mưa (trước tháng 5/1975). Hội nghị Bộ Chính trị tháng 10/1974 và 12/1974 – 1/1975 trước đó mới đề ra kế hoạch giải phóng miền Nam trong 2 năm 1975–1976.","Phân biệt chuỗi hội nghị quyết định thắng lợi năm 1975: Hội nghị Trung ương 21 (7/1973) khẳng định tiếp tục con đường bạo lực cách mạng sau Hiệp định Paris; Hội nghị Bộ Chính trị cuối 1974 – đầu 1975 đề ra kế hoạch 2 năm 1975–1976; Hội nghị Bộ Chính trị tháng 3/1975 rút ngắn quyết tâm giải phóng Sài Gòn trước tháng 5/1975."],[114,2,"Trong Cương lĩnh thứ ba (2/1951), Đảng ta đã khẳng định nhận thức về con đường cách mạng Việt Nam. Đó là con đường cách mạng nào?",["Con đường cách mạng vô sản","Con đường cách mạng tư sản dân quyền và thổ địa cách mạng","Con đường cách mạng tư sản dân quyền","Con đường cách mạng dân tộc, dân chủ, nhân dân"],3,"Trong Chính cương Đảng Lao động Việt Nam (Cương lĩnh thứ ba, 2/1951), Đảng khẳng định tính chất và con đường cách mạng Việt Nam giai đoạn này là cách mạng dân tộc dân chủ nhân dân do giai cấp công nhân lãnh đạo, dựa trên nền tảng liên minh công – nông – trí thức và tiến lên chủ nghĩa xã hội. Khái niệm này thể hiện sự phát triển nhận thức lý luận vượt lên cách gọi \"cách mạng tư sản dân quyền và thổ địa cách mạng\" ở Cương lĩnh 1930.","Phân biệt tên gọi con đường cách mạng qua các cương lĩnh: Cương lĩnh đầu tiên (2/1930) nêu \"tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội cộng sản\"; Cương lĩnh thứ ba (2/1951) gọi là \"cách mạng dân tộc dân chủ nhân dân\" tiến lên chủ nghĩa xã hội."],[115,2,"Đại hội Đảng toàn quốc lần thứ II của Đảng Lao động Việt Nam đã thông qua một văn kiện mang tính chất cương lĩnh. Đó là văn kiện nào?",["Cương lĩnh cách mạng Việt Nam","Luận cương về cách mạng Việt Nam","Cương lĩnh của Đảng Lao động Việt Nam","Chính cương của Đảng Lao động Việt Nam"],3,"Tại Đại hội đại biểu toàn quốc lần thứ II (2/1951), trên cơ sở Báo cáo chính trị của Chủ tịch Hồ Chí Minh và báo cáo \"Bàn về cách mạng Việt Nam\" của Tổng Bí thư Trường Chinh, Đại hội đã thông qua văn kiện mang tính cương lĩnh mang tên \"Chính cương của Đảng Lao động Việt Nam\". Đây được xem là bản Cương lĩnh chính trị thứ ba của Đảng sau Cương lĩnh 2/1930 và Luận cương 10/1930.","Chú ý chính xác từ đầu tiên của tên văn kiện để không bị đánh lừa: năm 2/1930 là Chánh cương vắn tắt, năm 10/1930 là Luận cương chính trị, năm 2/1951 là \"Chính cương của Đảng Lao động Việt Nam\" (không phải \"Cương lĩnh\"), còn năm 1991 mới dùng tên \"Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên CNXH\"."],[116,2,"Chiến thắng nào đã căn bản đánh bại âm mưu “đánh nhanh, thắng nhanh” của thực dân Pháp trong cuộc kháng chiến chống thực dân Pháp lần thứ hai?",["Chiến dịch Trung Du","Chiến dịch Biên Giới","Chiến dịch Hà Nam Ninh","Chiến dịch Việt Bắc"],3,"Trong Thu – Đông năm 1947, quân và dân ta đã anh dũng phản công, bẻ gãy các gọng kìm thủy – bộ – không quân của thực dân Pháp tiến công lên căn cứ địa Việt Bắc, bảo vệ an toàn cơ quan đầu não kháng chiến. Chiến thắng Chiến dịch Việt Bắc (1947) đã làm phá sản căn bản âm mưu \"đánh nhanh, thắng nhanh\" của Pháp, buộc chúng phải chuyển sang đánh lâu dài và thực hiện chính sách \"dùng người Việt đánh người Việt, lấy chiến tranh nuôi chiến tranh\".","Phân biệt ý nghĩa các chiến dịch chống Pháp: Việt Bắc (1947) đánh bại âm mưu \"đánh nhanh, thắng nhanh\"; Biên Giới (1950) phá thế bao vây và giành quyền chủ động trên chiến trường chính Bắc Bộ; Điện Biên Phủ (1954) đập tan kế hoạch Nava và kết thúc chiến tranh."],[117,2,"Trong cuộc kháng chiến chống Mỹ cứu nước, Đảng ta đã lãnh đạo đánh bại các chiến lược chiến tranh mà Mỹ đã tiến hành ở miền Nam Việt Nam (1954-1975): 1. Chiến lược “Việt Nam hoá chiến tranh”; 2. Chiến lược “Chiến tranh đặc biệt”; 3. Chiến lược “Chiến tranh cục bộ”. Hãy sắp xếp các sự kiện sau cho đúng với trình tự thời gian?",["2, 1, 3","3, 2, 1","1, 2, 3","2, 3, 1"],3,"Trong cuộc kháng chiến chống Mỹ cứu nước, đế quốc Mỹ lần lượt áp dụng các chiến lược chiến tranh xâm lược thực dân mới theo đúng trình tự lịch sử: đầu tiên là \"Chiến tranh đặc biệt\" (1961–1965, mục số 2), tiếp theo là \"Chiến tranh cục bộ\" (1965–1968, mục số 3) và cuối cùng là \"Việt Nam hóa chiến tranh\" (1969–1973, mục số 1). Vì vậy thứ tự đúng là 2, 3, 1.","Nhớ nhanh 4 chiến lược của Mỹ theo chuỗi thời gian: Chiến tranh đơn phương (1954–1960) → Chiến tranh đặc biệt (1961–1965) → Chiến tranh cục bộ (1965–1968) → Việt Nam hóa chiến tranh (1969–1973), gắn lần lượt với các tổng thống Eisenhower, Kennedy, Johnson và Nixon."],[118,2,"Thời gian và địa điểm nào diễn ra Đại hội Đảng lần thứ hai?",["Tháng 3/1935, tại Ma Cao, Trung Quốc","Tháng 2/1950, tại Tân Trào, Tuyên Quang","Tháng 3/1951, tại Việt Bắc","Tháng 2/1951, tại Chiêm Hoá, Tuyên Quang"],3,"Đại hội đại biểu toàn quốc lần thứ II của Đảng diễn ra từ ngày 11 đến 19/2/1951 tại xã Vinh Quang, huyện Chiêm Hóa, tỉnh Tuyên Quang với sự tham dự của 158 đại biểu chính thức và 53 đại biểu dự khuyết. Đây là kỳ Đại hội đầu tiên của Đảng được tổ chức công khai ngay trong nước, còn mốc tháng 3/1935 tại Ma Cao là của Đại hội lần thứ I.","Nhớ đủ bộ thời gian và địa điểm các Đại hội đầu tiên: Đại hội I (3/1935, Ma Cao – Trung Quốc); Đại hội II (2/1951, Chiêm Hóa – Tuyên Quang); Đại hội III (9/1960, Hà Nội). Tránh nhầm Tân Trào (nơi họp Quốc dân Đại hội tháng 8/1945) với Chiêm Hóa."],[119,2,"Tại Đại hội đại biểu toàn quốc lần thứ hai, Đảng Cộng sản Việt Nam có tên là gì?",["Đảng mác xít","Đảng Cộng sản Việt Nam","Hội nghiên cứu Chủ nghĩa Mác","Đảng Lao động Việt Nam"],3,"Do yêu cầu mới của cuộc kháng chiến ở ba nước Đông Dương, Đại hội đại biểu toàn quốc lần thứ II (2/1951) quyết định tách Đảng Cộng sản Đông Dương thành ba đảng cách mạng riêng cho từng nước; tại Việt Nam, Đảng ra hoạt động công khai với tên gọi là Đảng Lao động Việt Nam. Tên gọi \"Hội nghiên cứu Chủ nghĩa Mác\" chỉ là hình thức hoạt động công khai tạm thời sau khi Đảng tuyên bố \"tự giải tán\" tháng 11/1945.","Nhớ đủ lịch sử đổi tên của Đảng: Đảng Cộng sản Việt Nam (2/1930) → Đảng Cộng sản Đông Dương (10/1930) → Đảng Lao động Việt Nam (Đại hội II, 2/1951) → lấy lại tên Đảng Cộng sản Việt Nam tại Đại hội IV (12/1976)."],[120,2,"Mốc thời gian nào nhân dân Nam bộ đứng lên kháng chiến chống thực dân Pháp xâm lược, bảo vệ chính quyền cách mạng trong giai đoạn 1945-1954?",["Ngày 23 tháng 11 năm 1945","Ngày 19 tháng 12 năm 1946","Ngày 10 tháng 12 năm 1946","Ngày 23 tháng 9 năm 1945"],3,"Đêm 22 rạng sáng ngày 23/9/1945, được quân Anh hỗ trợ, thực dân Pháp nổ súng đánh úp trụ sở Ủy ban nhân dân Nam Bộ và các cơ quan trọng yếu ở Sài Gòn, mở đầu cuộc chiến tranh xâm lược nước ta lần thứ hai. Ngay sáng 23/9/1945, Xứ ủy và Ủy ban kháng chiến Nam Bộ phát lời kêu gọi toàn dân nhất tề đứng lên chiến đấu, mở đầu Ngày Nam Bộ kháng chiến oanh liệt.","Phân biệt hai mốc khởi đầu kháng chiến chống Pháp lần hai: ngày 23/9/1945 là ngày nhân dân Nam Bộ mở đầu kháng chiến, còn ngày 19/12/1946 là ngày cả nước bước vào cuộc kháng chiến toàn quốc."],[121,2,"Mặt trận Dân tộc Giải phóng miền Nam Việt Nam được thành lập ngày, tháng, năm nào? Ở đâu?",["Ngày 10 tháng 12 năm 1960, Bến Tre","Ngày 12 tháng 2 năm 1960, Long An","Ngày 20 tháng 12 năm 1961, Vĩnh Long","Ngày 20 tháng 12 năm 1960, Tây Ninh"],3,"Từ thắng lợi vang dội của phong trào \"Đồng khởi\" (1959–1960), ngày 20/12/1960 tại xã Tân Lập, huyện Châu Thành, tỉnh Tây Ninh, đại biểu các giai tầng, tôn giáo, dân tộc yêu nước đã họp thành lập Mặt trận Dân tộc Giải phóng miền Nam Việt Nam do Luật sư Nguyễn Hữu Thọ làm Chủ tịch. Mặt trận ra đời nhằm đoàn kết toàn dân miền Nam đánh đổ chế độ Mỹ – Diệm, thực hiện hòa bình, độc lập, trung lập tiến tới thống nhất đất nước.","Đừng nhầm địa danh Bến Tre (nơi khởi phát tiêu biểu của phong trào Đồng khởi ngày 17/1/1960) với Tây Ninh (nơi thành lập Mặt trận Dân tộc Giải phóng miền Nam Việt Nam ngày 20/12/1960)."],[122,2,"Thực dân Pháp ký hiệp ước gì với Tưởng vào thời gian nào trong sự nghiệp Đảng lãnh đạo xây dựng, bảo vệ chính quyền cách mạng kháng chiến chống thực dân Pháp xâm lược 1945-1954?",["Hiệp ước Patơnốt, ngày 6/6/1946","Hiệp định Giơnevơ, ngày 27/1/1954","Hiệp định Sơ bộ, ngày 9/3/1946","Hiệp ước Trùng Khánh, ngày 28/2/1946"],3,"Ngày 28/2/1946, tại Trùng Khánh (Trung Quốc), đại diện chính phủ Pháp và chính phủ Tưởng Giới Thạch đã ký kết Hiệp ước Hoa – Pháp (còn gọi là Hiệp ước Trùng Khánh), theo đó Pháp trả lại một số tô giới và đặc quyền ở Trung Quốc để đổi lấy quyền đưa quân ra miền Bắc Việt Nam thay quân Tưởng. Các phương án nhiễu đều sai cả về bản chất lẫn ngày tháng (Hiệp ước Patơnốt ký 6/6/1884, Hiệp định Sơ bộ ký 6/3/1946, Hiệp định Giơnevơ ký 21/7/1954).","Ghi nhớ cặp mốc ngoại giao liền kề năm 1946: Pháp – Tưởng ký Hiệp ước Hoa – Pháp tại Trùng Khánh ngày 28/2/1946, và chỉ 6 ngày sau, Việt Nam – Pháp ký Hiệp định Sơ bộ ngày 6/3/1946 để đẩy quân Tưởng về nước."],[123,2,"Nơi nào được coi là căn cứ địa cách mạng của cả nước trong cuộc kháng chiến chống thực dân Pháp lần thứ 2 (1945-1954)?",["Căn cứ địa cách mạng Tây Bắc","Thủ đô Hà Nội","Căn cứ địa cách mạng Điện Biên Phủ","Căn cứ địa cách mạng Việt Bắc"],3,"Trong suốt 9 năm kháng chiến chống thực dân Pháp (1945–1954), Việt Bắc được mệnh danh là \"Thủ đô kháng chiến\", là căn cứ địa cách mạng vững chắc của cả nước, nơi đặt cơ quan đầu não của Trung ương Đảng, Chính phủ, Quốc hội và Chủ tịch Hồ Chí Minh. Thủ đô Hà Nội khi ấy nằm trong vùng địch tạm chiếm, còn Tây Bắc và Điện Biên Phủ là địa bàn chiến trường trọng yếu về sau.","Nếu đề hỏi địa bàn mở đầu xây dựng Khu giải phóng gồm 6 tỉnh (Cao Bằng, Bắc Kạn, Lạng Sơn, Hà Giang, Tuyên Quang, Thái Nguyên) tháng 6/1945 trước Cách mạng Tháng Tám thì cũng là Khu giải phóng Việt Bắc."],[124,2,"Thắng lợi quan trọng của Hiệp định Paris đối với sự nghiệp kháng chiến chống Mỹ cứu nước là gì?",["Đánh cho Mỹ cút, đánh cho Ngụy nhào","Mỹ phải công nhận các quyền dân tộc cơ bản của ta","Buộc Mỹ phải rút hết quân về nước","Tạo thời cơ thuận lợi để nhân dân ta đánh cho Ngụy nhào"],3,"Hiệp định Paris (27/1/1973) buộc Mỹ phải công nhận các quyền dân tộc cơ bản của Việt Nam và rút toàn bộ quân viễn chinh Mỹ cùng chư hầu về nước, căn bản hoàn thành mục tiêu \"đánh cho Mỹ cút\". Thắng lợi chiến lược quan trọng nhất của Hiệp định là làm thay đổi tương quan lực lượng có lợi hẳn cho cách mạng miền Nam, tạo thời cơ thuận lợi để quân và dân ta tiến lên \"đánh cho Ngụy nhào\", giải phóng hoàn toàn miền Nam năm 1975.","Cẩn thận bẫy câu chữ: Hiệp định Paris mới hoàn thành vế \"đánh cho Mỹ cút\" (chưa làm \"Ngụy nhào\" ngay năm 1973) và tạo tiền đề để ta \"đánh cho Ngụy nhào\" năm 1975, nên không chọn phương án gộp cả \"đánh cho Mỹ cút, đánh cho Ngụy nhào\"."],[125,2,"Chiến lược “Chiến tranh đặc biệt” (1961-1965) nằm trong hình thức nào của chiến lược toàn cầu do đế quốc Mỹ đề ra?",["Ngăn đe thực tế","Chiến tranh lạnh","Chiến lược cam kết và mở rộng","Phản ứng linh hoạt"],3,"Sau thất bại của chiến lược \"trả đũa ồ ạt\" thời Eisenhower và sự lớn mạnh của phong trào giải phóng dân tộc, từ năm 1961 Tổng thống Kennedy đề ra chiến lược toàn cầu mới mang tên \"Phản ứng linh hoạt\" gồm ba loại hình chiến tranh: chiến tranh tổng lực, chiến tranh cục bộ và chiến tranh đặc biệt. Trong đó, chiến lược \"Chiến tranh đặc biệt\" (1961–1965) tại miền Nam Việt Nam là một hình thức thí điểm điển hình của \"Phản ứng linh hoạt\".","Phân biệt chiến lược toàn cầu của Mỹ theo từng thời tổng thống: \"Phản ứng linh hoạt\" (Kennedy – Johnson, gắn với Chiến tranh đặc biệt và Chiến tranh cục bộ); \"Ngăn đe thực tế\" (Nixon, gắn với Việt Nam hóa chiến tranh); \"Cam kết và mở rộng\" (Bill Clinton, sau Chiến tranh lạnh)."],[126,2,"Thất bại trong chiến lược nào buộc đế quốc Mỹ phải ngồi vào bàn đàm phán với ta ở Hội nghị Paris?",["Trong chiến lược “Chiến tranh đặc biệt”","Trong chiến lược “Việt Nam hóa chiến tranh - Đông Dương hóa chiến tranh”","Trong chiến tranh phá hoại miền Bắc lần hai","Trong chiến lược “Chiến tranh cục bộ”"],3,"Trong chiến lược \"Chiến tranh cục bộ\" (1965–1968), Mỹ đã ồ ạt đưa hơn nửa triệu quân viễn chinh vào miền Nam nhưng liên tiếp thất bại, đỉnh cao là đòn bất ngờ của cuộc Tổng tiến công và nổi dậy Tết Mậu Thân 1968 làm lung lay tận gốc ý chí xâm lược của Nhà Trắng. Thất bại này buộc Tổng thống Giôn-xơn phải tuyên bố ngừng ném bom hạn chế miền Bắc (31/3/1968) và chấp nhận ngồi vào bàn đàm phán với ta tại Hội nghị Paris từ ngày 13/5/1968.","Phân biệt hai mốc Hội nghị Paris rất dễ nhầm: thất bại trong \"Chiến tranh cục bộ\" (Tết Mậu Thân 1968) buộc Mỹ phải ngồi vào bàn đàm phán ở Paris (5/1968); còn thất bại trong \"Việt Nam hóa chiến tranh\" và trận \"Điện Biên Phủ trên không\" (12/1972) buộc Mỹ phải ký Hiệp định Paris (27/1/1973)."],[127,2,"Với khí thế “thần tốc, táo bạo, bất ngờ, chắc thắng”. Đó là tinh thần và khí thế ra quân của dân tộc ta trong chiến dịch nào?",["Chiến dịch Điện Biên Phủ (7/5/1954)","Chiến dịch Tây Nguyên (4-24/3/1975)","Chiến dịch Huế-Đà Nẵng (21-29/3/1975)","Chiến dịch Hồ Chí Minh (26-30/4/1975)"],3,"Khí thế “thần tốc, táo bạo, bất ngờ, chắc thắng” là phương châm tác chiến và tinh thần ra quân quyết thắng của quân dân ta trong Chiến dịch Hồ Chí Minh lịch sử (26–30/4/1975), tiếp nối bức điện nổi tiếng của Đại tướng Võ Nguyên Giáp ngày 7/4/1975. Đây là chiến dịch quyết chiến chiến lược cuối cùng, đánh sập hoàn toàn chính quyền Sài Gòn và giải phóng miền Nam.","Nếu đề hỏi chiến dịch mở màn cuộc Tổng tiến công và nổi dậy mùa Xuân 1975 chọn Chiến dịch Tây Nguyên (4–24/3/1975); hỏi chiến dịch giải phóng miền Trung chọn Huế – Đà Nẵng (21–29/3/1975); còn phương châm “đánh chắc, tiến chắc” gắn với Chiến dịch Điện Biên Phủ (1954)."],[128,2,"Trong các nội dung của Hiệp định Paris, nội dung nào thể hiện thắng lợi lớn nhất của nhân dân ta?",["Hoa Kì rút hết quân Mỹ và quân đồng minh về nước","Các bên để nhân dân miền Nam tự quyết định tương lai của họ qua cuộc tổng tuyển cử tự do","Hoa Kì và các nước cam kết tôn trọng độc lập, chủ quyền, thống nhất và toàn vẹn lãnh thổ của các nước Đông Dương","Hoa Kì và các nước cam kết tôn trọng độc lập, chủ quyền, thống nhất và toàn vẹn lãnh thổ của Việt Nam"],3,"Điều 1 Hiệp định Paris (27/1/1973) buộc Hoa Kỳ và các nước cam kết tôn trọng độc lập, chủ quyền, thống nhất và toàn vẹn lãnh thổ của Việt Nam. Đây là thắng lợi chính trị – pháp lý lớn nhất của nhân dân ta, buộc Mỹ thừa nhận các quyền dân tộc cơ bản của Việt Nam và tạo cơ sở tiến tới giải phóng hoàn toàn miền Nam. Phương án nhắc “các nước Đông Dương” bị sai phạm vi vì Hiệp định Paris ký riêng về Việt Nam.","Nếu đề hỏi điều khoản làm thay đổi trực tiếp so sánh lực lượng trên chiến trường miền Nam theo phương châm “đánh cho Mỹ cút” thì chú ý việc Hoa Kỳ rút hết quân Mỹ và quân đồng minh về nước; còn cam kết tôn trọng quyền dân tộc cơ bản của ba nước Đông Dương thuộc Hiệp định Giơnevơ (1954)."],[129,2,"Thắng lợi này chứng minh sự trưởng thành của quân đội ta và cuộc kháng chiến từ thế phòng ngự sang thế tiến công. Đó là ý nghĩa lịch sử của chiến dịch nào?",["Chiến dịch Việt Bắc 1947","Chiến dịch Tây Bắc 1952","Chiến dịch Điện Biên Phủ 1954","Chiến d
