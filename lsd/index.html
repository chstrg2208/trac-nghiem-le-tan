 nền tảng tư tưởng; sự bổ sung này khẳng định bản sắc và sức sống của tư tưởng Hồ Chí Minh.","Phân biệt hai mốc về tư tưởng Hồ Chí Minh: Đại hội VII (6/1991) lần đầu xác định lấy chủ nghĩa Mác – Lênin và tư tưởng Hồ Chí Minh làm nền tảng tư tưởng, kim chỉ nam cho hành động; còn Đại hội IX (4/2001) lần đầu nêu định nghĩa đầy đủ về nội hàm tư tưởng Hồ Chí Minh."],[211,3,"Mục tiêu tổng quát: “đưa nước ta ra khỏi tình trạng kém phát triển, tạo nền tảng để đến năm 2020 nước ta cơ bản trở thành một nước công nghiệp theo hướng hiện đại; tiếp tục đưa tổng sản phẩm trong nước (GDP) năm 2010 lên gấp đôi so với năm 2000”, được xác định trong văn kiện nào của Đảng ta?",["Nghị quyết Đại hội lần thứ VI","Diễn văn khai mạc Đại hội lần thứ VII","Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội","Chiến lược phát triển kinh tế - xã hội 2001-2010"],3,"Tại Đại hội đại biểu toàn quốc lần thứ IX (4/2001), Đảng thông qua Chiến lược phát triển kinh tế - xã hội 2001-2010 với mục tiêu tổng quát đưa nước ta ra khỏi tình trạng kém phát triển, tạo nền tảng để đến năm 2020 cơ bản trở thành nước công nghiệp theo hướng hiện đại và nâng GDP năm 2010 lên gấp đôi so với năm 2000. Các văn kiện của Đại hội VI, Đại hội VII hay Cương lĩnh xây dựng đất nước không đặt ra chỉ tiêu tăng gấp đôi GDP cho đúng giai đoạn 2000-2010 này.","Nếu đề hỏi văn kiện đề ra mục tiêu đưa GDP năm 2000 tăng gấp đôi so với năm 1990 thì chọn Chiến lược ổn định và phát triển kinh tế - xã hội đến năm 2000 tại Đại hội VII (6/1991); còn Đại hội VI (12/1986) gắn với Ba chương trình kinh tế lớn."],[212,3,"Trong bốn nguy cơ mà Đảng ta đã chỉ ra thì nguy cơ nào là lớn nhất trong 5 năm (2016 - 2020)?",["Tham nhũng, quan liêu, lãng phí","Diễn biến hòa bình","Suy thoái về tư tưởng chính trị, đạo đức, lối sống của một bộ phận cán bộ, đảng viên, công chức, viên chức","Tụt hậu xa hơn về kinh tế so với các nước trong khu vực và trên thế giới"],3,"Từ Hội nghị giữa nhiệm kỳ khóa VII (1/1994) đến Đại hội XII (1/2016), Đảng luôn cảnh báo bốn nguy cơ lớn đối với sự nghiệp đổi mới. Trong giai đoạn 2016-2020, bộ đề xác định tụt hậu xa hơn về kinh tế so với các nước trong khu vực và trên thế giới là nguy cơ lớn nhất vì kinh tế chậm phát triển sẽ làm suy yếu tiềm lực đất nước và kéo theo các nguy cơ khác. Tham nhũng, suy thoái đạo đức và diễn biến hòa bình đều là những nguy cơ nghiêm trọng nhưng tác động trên các phương diện khác.","Nếu đề hỏi nguy cơ đe dọa trực tiếp đến sự tồn vong của Đảng và chế độ thì chú ý tới tình trạng suy thoái về tư tưởng chính trị, đạo đức, lối sống và nạn tham nhũng, quan liêu; còn diễn biến hòa bình là âm mưu phá hoại từ các thế lực thù địch bên ngoài."],[213,3,"Việt Nam được kết nạp là thành viên thứ 150 của Tổ chức Thương mại thế giới (WTO) chính thức thời gian nào?",["8/2006","9/2006","10/2006","11/2006"],3,"Sau hơn 11 năm đàm phán gia nhập, ngày 7/11/2006 tại Geneva (Thụy Sĩ), Tổ chức Thương mại thế giới (WTO) đã chính thức kết nạp Việt Nam trở thành thành viên thứ 150, đánh dấu bước ngoặt lớn trong tiến trình hội nhập kinh tế quốc tế sâu rộng. Các mốc tháng 8, tháng 9 và tháng 10/2006 đều trước lễ ký nghị định thư gia nhập chính thức của Việt Nam.","Cần phân biệt hai mốc dễ nhầm: tháng 11/2006 (ngày 7/11/2006) là thời điểm WTO chính thức kết nạp Việt Nam làm thành viên thứ 150, còn ngày 11/1/2007 là lúc Việt Nam chính thức có đầy đủ tư cách thành viên sau 30 ngày nộp văn kiện phê chuẩn."],[214,3,"Việt Nam trở thành thành viên đầy đủ của Hiệp hội các quốc gia Đông Nam Á (ASEAN) vào thời gian nào?",["Ngày 5 tháng 6 năm 1996","Ngày 1 tháng 11 năm 1998","Ngày 25 tháng 5 năm 1995","Ngày 28 tháng 7 năm 1995"],3,"Ngày 28/7/1995, tại Hội nghị Ngoại trưởng ASEAN lần thứ 28 ở Brunei, Việt Nam chính thức trở thành thành viên đầy đủ thứ 7 của Hiệp hội các quốc gia Đông Nam Á (ASEAN). Sự kiện này mở ra thời kỳ hội nhập khu vực sâu rộng, góp phần xây dựng Đông Nam Á hòa bình, ổn định và hợp tác, nên các mốc năm 1996, 1998 hay tháng 5/1995 đều không chính xác.","Nếu đề hỏi mốc Việt Nam và Hoa Kỳ bình thường hóa quan hệ ngoại giao thì chọn ngày 11/7/1995; mốc ký Hiệp định khung hợp tác với Liên minh châu Âu (EU) là 17/7/1995; còn mốc gia nhập Diễn đàn Hợp tác Kinh tế châu Á - Thái Bình Dương (APEC) là tháng 11/1998."],[215,3,"Hội nghị Trung ương 4, khóa XI (1/2012) đã đưa ra kết luận tiếp tục tăng cường sự lãnh đạo của Đảng đối với công tác phòng, chống tham nhũng, lãng phí. Trung ương quyết định thành lập Ban Chỉ đạo Trung ương về phòng, chống tham nhũng trực thuộc cơ quan nào?",["Bộ Chính trị do Ủy ban kiểm tra làm Trưởng ban","Chính phủ do Thủ tướng làm Trưởng ban","Quốc Hội do Chủ tịch Quốc Hội làm Trưởng ban","Bộ Chính trị do Tổng Bí thư làm Trưởng ban"],3,"Nhằm tăng cường sự lãnh đạo trực tiếp, toàn diện của Đảng đối với công tác phòng, chống tham nhũng, lãng phí trong nhiệm kỳ khóa XI, Ban Chấp hành Trung ương quyết định thành lập Ban Chỉ đạo Trung ương về phòng, chống tham nhũng trực thuộc Bộ Chính trị do Tổng Bí thư làm Trưởng ban. Mô hình này khắc phục hạn chế của cơ chế cũ và tạo bước chuyển mạnh mẽ trong đấu tranh chống tham nhũng.","Lưu ý nhỏ về mốc hội nghị: đề gốc ghi Hội nghị Trung ương 4 khóa XI (1/2012), nhưng theo văn kiện lịch sử, Hội nghị Trung ương 5 khóa XI (5/2012) mới quyết định chuyển Ban Chỉ đạo này từ trực thuộc Chính phủ (do Thủ tướng làm Trưởng ban trước năm 2012) sang trực thuộc Bộ Chính trị do Tổng Bí thư làm Trưởng ban."],[216,3,"Đảng viên được làm kinh tế tư nhân là kết quả đổi mới tư duy của Đảng ta đối với các thành phần kinh tế. Thực tiễn đã chứng minh đó là một chủ trương phù hợp với thực tế của đất nước và thế giới. Anh/chị cho biết văn kiện nào của Đảng quy định về vấn đề đảng viên làm kinh tế tư nhân?",["Quy định số 114-QĐ/TW, ngày 20/8/2004","Quy định số 94-QĐ/TW, ngày 03/3/2004","Quy định số 47-QĐ/TW, ngày 01/11/2011","Quy định số 15-QĐ/TW, ngày 28/8/2006"],3,"Thực hiện chủ trương đổi mới tư duy về các thành phần kinh tế của Đại hội X (4/2006), ngày 28/8/2006 Bộ Chính trị khóa X đã ban hành Quy định số 15-QĐ/TW về việc đảng viên làm kinh tế tư nhân. Văn kiện này cho phép đảng viên tham gia làm kinh tế tư nhân không giới hạn quy mô miễn là chấp hành nghiêm Điều lệ Đảng và pháp luật Nhà nước, tạo động lực phát triển lực lượng sản xuất.","Nếu đề hỏi văn kiện quy định về những điều đảng viên không được làm trong nhiệm kỳ khóa XI thì chọn Quy định số 47-QĐ/TW ngày 1/11/2011; còn nếu hỏi Đại hội lần đầu xác lập chủ trương cho đảng viên làm kinh tế tư nhân thì chọn Đại hội X (4/2006)."],[217,3,"Hội nghị Trung ương 7 (3/2003), khóa IX đã đề ra bao nhiêu Nghị quyết quan trọng, đó là những Nghị quyết gì?",["Không có Nghị quyết nào quan trọng","Một Nghị quyết: Nghị quyết về nâng cao năng lực lãnh đạo và sức chiến đấu của Đảng","Hai Nghị quyết: Nghị quyết về công tác dân tộc; Nghị quyết về công tác tôn giáo","Ba Nghị quyết: Nghị quyết về phát huy sức mạnh đại đoàn kết toàn dân tộc; Nghị quyết về công tác dân tộc; Nghị quyết về công tác tôn giáo"],3,"Hội nghị lần thứ 7 Ban Chấp hành Trung ương Đảng khóa IX (3/2003) là hội nghị chuyên đề mang ý nghĩa chiến lược về khối đoàn kết toàn dân, đã ban hành đồng thời ba Nghị quyết quan trọng: về phát huy sức mạnh đại đoàn kết toàn dân tộc, về công tác dân tộc và về công tác tôn giáo. Các phương án chỉ nêu một hoặc hai nghị quyết đều thiếu nội dung cốt lõi mà hội nghị đã thông qua.","Hãy nhớ bộ ba từ khóa 'đại đoàn kết - dân tộc - tôn giáo' gắn liền với Hội nghị Trung ương 7 khóa IX (3/2003); nếu đề hỏi về xây dựng, chỉnh đốn Đảng và nâng cao sức chiến đấu của Đảng thì liên hệ tới Nghị quyết Trung ương 6 lần 2 khóa VIII (1999) hoặc Trung ương 4 khóa XI, XII."],[218,3,"Đặc trưng đầu tiên của mô hình xã hội xã hội chủ nghĩa ở Việt Nam trong “Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội” (bổ sung, phát triển năm 2011) là gì?",["Do nhân dân làm chủ","Có nền văn hoá tiên tiến, đậm đà bản sắc dân tộc","Có Nhà nước pháp quyền xã hội chủ nghĩa của nhân dân, do nhân dân vì nhân dân","Dân giàu, nước mạnh, dân chủ, công bằng, văn minh"],3,"Trong Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung, phát triển năm 2011) thông qua tại Đại hội XI, Đảng xác định 8 đặc trưng của xã hội xã hội chủ nghĩa và đưa đặc trưng tổng quát 'Dân giàu, nước mạnh, dân chủ, công bằng, văn minh' lên vị trí đầu tiên. Các đặc trưng 'Do nhân dân làm chủ', văn hóa tiên tiến và Nhà nước pháp quyền xã hội chủ nghĩa lần lượt đứng ở vị trí thứ hai, thứ tư và thứ bảy.","Nếu đề hỏi đặc trưng đầu tiên trong Cương lĩnh năm 1991 (gồm 6 đặc trưng) thì chọn 'Do nhân dân lao động làm chủ'; còn đến Cương lĩnh năm 2011 mới bổ sung đặc trưng tổng quát 'Dân giàu, nước mạnh, dân chủ, công bằng, văn minh' lên hàng đầu và đưa 'Do nhân dân làm chủ' xuống thứ hai."],[219,3,"Phương châm đối ngoại của Đảng ta tại Đại hội lần IX (4/2001) là gì?",["Việt Nam sẵn sàng là bạn, là đối tác tin cậy, là thành viên có trách nhiệm của các nước trong cộng đồng quốc tế, phấn đấu vì hòa bình, độc lập và phát triển","Việt Nam muốn là bạn với tất cả các nước trong cộng đồng thế giới, phấn đấu vì hòa bình, độc lập và phát triển","Việt Nam muốn là bạn với tất cả các nước dân chủ, hợp tác, đoàn kết, tôn trọng độc lập chủ quyền của nhau","Việt Nam sẵn sàng là bạn, là đối tác tin cậy của các nước trong cộng đồng quốc tế, phấn đấu vì hòa bình, độc lập và phát triển"],3,"Tại Đại hội đại biểu toàn quốc lần thứ IX (4/2001), Đảng phát triển đường lối đối ngoại độc lập, tự chủ lên tầm cao mới với phương châm: 'Việt Nam sẵn sàng là bạn, là đối tác tin cậy của các nước trong cộng đồng quốc tế, phấn đấu vì hòa bình, độc lập và phát triển'. So với giai đoạn trước, Đại hội IX chuyển từ 'muốn là bạn' sang 'sẵn sàng là bạn' và bổ sung vế 'đối tác tin cậy'.","Ghi nhớ ba bậc phát triển của phương châm đối ngoại: Đại hội VII (1991) là 'muốn là bạn'; Đại hội IX (2001) nâng lên 'sẵn sàng là bạn, là đối tác tin cậy'; đến Đại hội XI (2011) và XII (2016) bổ sung thêm vế 'là thành viên có trách nhiệm trong cộng đồng quốc tế'."],[220,3,"Đại hội lần thứ mấy Đảng ta lần đầu khẳng định: “Việt Nam muốn là bạn với tất cả các nước trong cộng đồng thế giới, phấn đấu vì hoà bình, độc lập và phát triển”?",["Đại hội VI (12/1986)","Đại hội VIII (7/1996)","Đại hội IX (4/2001)","Đại hội VII (6/1991)"],3,"Trước biến động lớn của hệ thống xã hội chủ nghĩa ở Liên Xô và Đông Âu, Đại hội VII của Đảng (6/1991) đã đổi mới mạnh mẽ tư duy đối ngoại và lần đầu tiên tuyên bố: 'Việt Nam muốn là bạn với tất cả các nước trong cộng đồng thế giới, phấn đấu vì hòa bình, độc lập và phát triển'. Chủ trương này giúp Việt Nam phá thế bao vây, cô lập và mở rộng quan hệ quốc tế đa phương.","Nếu đề hỏi Đại hội khởi xướng đường lối đối ngoại đổi mới với phương châm 'thêm bạn, bớt thù' thì chọn Đại hội VI (12/1986); nếu hỏi Đại hội lần đầu nêu 'sẵn sàng là bạn, là đối tác tin cậy' thì chọn Đại hội IX (4/2001)."],[221,3,"Trước đổi mới (trước 1986), quan hệ đối ngoại của Việt Nam chủ yếu với nước nào?",["Liên Xô, Trung Quốc, Cuba","Liên Xô, Cuba, Đông Âu và các nước Dân chủ","Liên Xô, Cuba, Đông Âu, Lào và Campuchia","Liên Xô và các nước xã hội chủ nghĩa"],3,"Trong thời kỳ trước đổi mới (1975-1986), do bối cảnh Chiến tranh Lạnh và chính sách bao vây, cấm vận của các thế lực thù địch, quan hệ đối ngoại của Việt Nam chủ yếu tập trung với Liên Xô và các nước xã hội chủ nghĩa, trong đó hợp tác toàn diện với Liên Xô được xem là 'hòn đá tảng'. Cách diễn đạt 'Liên Xô và các nước xã hội chủ nghĩa' phản ánh đầy đủ, chính xác nhất đường lối đối ngoại giai đoạn này.","Chú ý loại trừ các phương án chỉ liệt kê rời rạc vài quốc gia hoặc thêm cụm 'các nước Dân chủ' không đúng thuật ngữ văn kiện; còn nếu đề hỏi chủ trương đối ngoại sau năm 1986 thì chọn đa phương hóa, đa dạng hóa quan hệ với tất cả các nước không phân biệt chế độ chính trị."],[222,3,"Anh/chị cho biết phương châm đối ngoại của Việt Nam được Đại hội đại biểu toàn quốc lần thứ XII (1/2016) của Đảng nêu ra là gì?",["Đa dạng hóa, đa phương hóa trong quan hệ đối ngoại; độc lập về chính trị nhân nhượng về kinh tế","Chủ động và tích cực hội nhập kinh tế quốc tế","Là bạn, là đối tác tin cậy và thành viên có trách nhiệm của cộng đồng quốc tế","Đa dạng hóa, đa phương hóa trong quan hệ đối ngoại; chủ động và tích cực hội nhập quốc tế; là bạn, là đối tác tin cậy và thành viên có trách nhiệm của cộng đồng quốc tế"],3,"Đại hội đại biểu toàn quốc lần thứ XII của Đảng (1/2016) tổng hợp đầy đủ phương châm đối ngoại thời kỳ hội nhập sâu rộng là: đa dạng hóa, đa phương hóa trong quan hệ đối ngoại; chủ động và tích cực hội nhập quốc tế; là bạn, là đối tác tin cậy và thành viên có trách nhiệm của cộng đồng quốc tế. Các phương án khác hoặc thiếu vế, hoặc thu hẹp chỉ còn 'hội nhập kinh tế quốc tế', hoặc sai nguyên tắc khi nói 'nhân nhượng về kinh tế'.","Nếu đề hỏi Đại hội lần đầu nhấn mạnh 'chủ động và tích cực hội nhập kinh tế quốc tế' thì chọn Đại hội X (4/2006); còn từ Đại hội XI (2011) và Đại hội XII (2016) trở đi, Đảng mở rộng thành 'chủ động và tích cực hội nhập quốc tế' trên tất cả các lĩnh vực."],[223,3,"“Dân giàu, nước mạnh, dân chủ, công bằng, văn minh” là một trong những đặc trưng xây dựng xã hội xã hội chủ nghĩa mà nhân dân ta xây dựng. Đặc trưng trên được trình bày trong Cương lĩnh nào?",["Cương lĩnh chính trị đầu tiên của Đảng","Chánh cương của Đảng Lao động Việt Nam","Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội năm 1991","Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung, phát triển năm 2011)"],3,"Cụm đặc trưng 'Dân giàu, nước mạnh, dân chủ, công bằng, văn minh' được khẳng định chính thức trong Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung, phát triển năm 2011) thông qua tại Đại hội XI. Cương lĩnh năm 1991 chưa có đặc trưng này, còn Cương lĩnh đầu tiên (1930) và Chính cương của Đảng Lao động Việt Nam (1951) thuộc giai đoạn cách mạng dân tộc dân chủ nhân dân.","Lưu ý thứ tự từ khóa để tránh bẫy: tại Đại hội X (2006), mục tiêu được diễn đạt là 'dân giàu, nước mạnh, xã hội công bằng, dân chủ, văn minh', nhưng đến Cương lĩnh bổ sung, phát triển năm 2011 đã đổi trật tự đưa 'dân chủ' lên trước thành 'dân chủ, công bằng, văn minh'."],[224,3,"Một trong những điểm mới về chủ trương đối ngoại của Đảng ta tại Đại hội VIII (7/1996) là gì?",["Bình thường hóa với Trung Quốc và Mỹ","Xóa bỏ tình trạng độc quyền về ngoại thương","Xây dựng một nền kinh tế khép kín","Đầu tư ra nước ngoài"],3,"Tại Đại hội VIII (7/1996), trước yêu cầu đẩy mạnh công nghiệp hóa, hiện đại hóa và mở rộng kinh tế đối ngoại, Đảng lần đầu đề ra nhiều điểm mới như chủ trương đầu tư ra nước ngoài, hợp tác đa phương và mở rộng quan hệ với các đảng cầm quyền cùng các nước công nghiệp phát triển. Việc bình thường hóa quan hệ với Trung Quốc (1991) và Mỹ (1995) đã diễn ra từ trước Đại hội VIII, còn xây dựng nền kinh tế khép kín trái ngược với đường lối đổi mới.","Nếu đề hỏi mốc bình thường hóa quan hệ Việt - Trung thì chọn tháng 11/1991; bình thường hóa Việt - Mỹ chọn tháng 7/1995; còn chủ trương xóa bỏ cơ chế độc quyền nhà nước về ngoại thương đã được khởi động từ thời kỳ Đại hội VI và khóa VII."],[225,3,"Tên gọi “Nước Cộng hoà Xã hội chủ nghĩa Việt Nam” có từ khi nào?",["Ngày 2/9/1945","Ngày 12/2/1951","Ngày 2/7/1975","Ngày 2/7/1976"],3,"Sau thắng lợi của cuộc Tổng tuyển cử bầu Quốc hội chung cả nước (25/4/1976), tại Kỳ họp thứ nhất Quốc hội khóa VI họp ở Hà Nội, ngày 2/7/1976 Quốc hội đã thông qua nghị quyết đổi tên nước thành nước Cộng hòa xã hội chủ nghĩa Việt Nam. Đây là dấu mốc hoàn thành thống nhất đất nước về mặt nhà nước, khác với năm 1975 khi miền Nam vừa mới được giải phóng.","Nếu đề hỏi ngày khai sinh nước Việt Nam Dân chủ Cộng hòa thì chọn ngày 2/9/1945; nếu hỏi mốc đổi tên Đảng thành Đảng Lao động Việt Nam thì chọn Đại hội II tháng 2/1951; còn ngày 2/7/1976 gắn liền với tên gọi nước Cộng hòa xã hội chủ nghĩa Việt Nam."],[226,3,"Từ năm 1945 đến năm 1976, có mấy lần Tổng tuyển cử bầu Quốc hội được tổ chức trên phạm vi cả nước Việt Nam?",["4","3","6","2"],3,"Trong suốt giai đoạn 1945-1976, Việt Nam chỉ tổ chức được đúng 2 cuộc Tổng tuyển cử bầu Quốc hội trên phạm vi cả nước: lần thứ nhất ngày 6/1/1946 bầu Quốc hội khóa I của nước Việt Nam Dân chủ Cộng hòa và lần thứ hai ngày 25/4/1976 bầu Quốc hội khóa VI của nước Việt Nam thống nhất. Từ năm 1954 đến năm 1975, do đất nước bị chia cắt hai miền nên các cuộc bầu cử Quốc hội khóa II, III, IV và V chỉ tiến hành ở miền Bắc.","Đừng nhầm giữa số khóa Quốc hội (từ khóa I đến khóa VI là 6 khóa) với số lần Tổng tuyển cử trên phạm vi cả nước (chỉ có 2 lần vào năm 1946 và năm 1976); nếu đề chỉ hỏi ngày Tổng tuyển cử thống nhất đất nước thì chọn ngày 25/4/1976."],[227,3,"Người được bầu làm Chủ tịch đầu tiên của nước Cộng hoà xã hội Chủ nghĩa Việt Nam là ai?",["Hồ Chí Minh","Lê Duẩn","Trường Chinh","Tôn Đức Thắng"],3,"Tại Kỳ họp thứ nhất Quốc hội khóa VI (tháng 7/1976) quyết định lấy tên nước là Cộng hòa xã hội chủ nghĩa Việt Nam, Quốc hội đã bầu đồng chí Tôn Đức Thắng làm Chủ tịch nước đầu tiên của nước Cộng hòa xã hội chủ nghĩa Việt Nam. Chủ tịch Hồ Chí Minh đã từ trần năm 1969, còn đồng chí Trường Chinh được bầu làm Chủ tịch Ủy ban Thường vụ Quốc hội và đồng chí Lê Duẩn giữ cương vị lãnh đạo cao nhất của Đảng.","Hãy đọc kỹ tên nước trong đề bài: nếu hỏi Chủ tịch đầu tiên của nước Việt Nam Dân chủ Cộng hòa (1945) thì chọn Hồ Chí Minh; hỏi Chủ tịch Hội đồng Nhà nước đầu tiên (1981) chọn Trường Chinh; còn Chủ tịch đầu tiên của nước Cộng hòa xã hội chủ nghĩa Việt Nam (7/1976) là Tôn Đức Thắng."],[228,3,"Đại hội Đảng toàn quốc lần XII của Đảng Cộng sản Việt Nam họp trong khoảng thời gian nào?",["Từ 04 đến 09/3/2016","Từ 12 đến 17/6/2016","Từ 22 đến 28/6/2016","Từ 21 đến 28/1/2016"],3,"Đại hội đại biểu toàn quốc lần thứ XII của Đảng Cộng sản Việt Nam họp chính thức tại Hà Nội từ ngày 21 đến ngày 28/1/2016 (họp phiên trù bị ngày 20/1/2016) với chủ đề tăng cường xây dựng Đảng trong sạch, vững mạnh và đẩy mạnh toàn diện, đồng bộ công cuộc đổi mới. Tất cả các mốc vào tháng 3 hay tháng 6 năm 2016 đều không đúng thời gian tổ chức Đại hội XII.","Để không nhầm ngày tháng các kỳ Đại hội gần đây, hãy nhớ chúng đều diễn ra vào tháng 1: Đại hội XI từ 12 đến 19/1/2011, Đại hội XII từ 21 đến 28/1/2016 và Đại hội XIII từ 25/1 đến 1/2/2021."],[229,3,"Hãy chọn đáp án đúng điền vào những cụm từ còn thiếu cho đúng với Nghị quyết Hội nghị lần thứ 24 Ban Chấp hành Trung ương Đảng (9/1975): “ ....(1).... vừa là nguyện vọng tha thiết của nhân dân cả nước, vừa là ....(2).... của sự phát triển cách mạng Việt Nam, của lịch sử dân tộc Việt Nam\".",["(1) Chủ nghĩa xã hội; (2) yêu cầu","(1) Giải phóng dân tộc; (2) quy luật khách quan","(1) Thống nhất đất nước; (2) yêu cầu","(1) Thống nhất đất nước; (2) quy luật khách quan"],3,"Tháng 9/1975, Hội nghị lần thứ 24 Ban Chấp hành Trung ương Đảng khóa III họp tại Đà Lạt đã đề ra chủ trương hoàn thành thống nhất đất nước về mặt nhà nước, khẳng định rõ: 'Thống nhất đất nước vừa là nguyện vọng tha thiết của nhân dân cả nước, vừa là quy luật khách quan của sự phát triển cách mạng Việt Nam, của lịch sử dân tộc Việt Nam'. Cụm từ 'quy luật khách quan' thể hiện tính tất yếu lịch sử chứ không chỉ là 'yêu cầu' chủ quan.","Gắn mốc Hội nghị Trung ương 24 khóa III (9/1975) với nhiệm vụ trọng tâm là 'thống nhất đất nước về mặt nhà nước' và cặp từ khóa 'Thống nhất đất nước' - 'quy luật khách quan'; sau hội nghị này là Hội nghị Hiệp thương chính trị thống nhất Tổ quốc tháng 11/1975."],[230,3,"Chiến lược phát triển kinh tế - xã hội giai đoạn 2011-2020, Đại hội Đảng toàn quốc lần XI đã đề ra bao nhiêu bước đột phá chiến lược?",["1","2","4","3"],3,"Chiến lược phát triển kinh tế - xã hội giai đoạn 2011-2020 thông qua tại Đại hội đại biểu toàn quốc lần thứ XI (1/2011) đã xác định 3 khâu đột phá chiến lược: hoàn thiện thể chế kinh tế thị trường định hướng xã hội chủ nghĩa; phát triển nhanh nguồn nhân lực, nhất là nguồn nhân lực chất lượng cao; và xây dựng hệ thống kết cấu hạ tầng đồng bộ. Con số 1, 2 hay 4 đều không đúng với hệ thống đột phá chiến lược mà Đại hội XI đề ra.","Ba đột phá chiến lược này tiếp tục được kế thừa, bổ sung tại Đại hội XII và Đại hội XIII; tránh nhầm với 6 nhiệm vụ trọng tâm của Đại hội XII hay 8 đặc trưng của chủ nghĩa xã hội trong Cương lĩnh bổ sung, phát triển năm 2011."],[231,3,"Từ năm 1946 đến 1980, đã ba lần Quốc hội thông qua Hiến pháp, đó là những Hiến pháp nào?",["Hiến pháp 1946; Hiến pháp 1960; Hiến pháp 1980","Hiến pháp 1946; Hiến pháp 1975; Hiến pháp 1980","Hiến pháp 1946; Hiến pháp 1976; Hiến pháp 1980","Hiến pháp 1946; Hiến pháp 1959; Hiến pháp 1980"],3,"Từ năm 1946 đến năm 1980, Quốc hội Việt Nam đã thông qua ba bản Hiến pháp tương ứng với ba giai đoạn lịch sử lớn: Hiến pháp năm 1946 của nước Việt Nam Dân chủ Cộng hòa vừa giành độc lập, Hiến pháp năm 1959 định hướng xây dựng chủ nghĩa xã hội ở miền Bắc và đấu tranh thống nhất nước nhà, và Hiến pháp năm 1980 của nước Cộng hòa xã hội chủ nghĩa Việt Nam thống nhất. Các năm 1975 và 1976 không ban hành Hiến pháp mới.","Lưu ý mốc rất dễ nhầm: Hiến pháp thứ hai được Quốc hội khóa I thông qua ngày 31/12/1959 (nên gọi chuẩn là Hiến pháp 1959) và được Chủ tịch Hồ Chí Minh ký lệnh công bố ngày 1/1/1960; nếu tính đến nay Việt Nam có tổng cộng 5 bản Hiến pháp (1946, 1959, 1980, 1992 và 2013)."],[232,3,"Tính đến năm 2018, Đảng ta đã có bao nhiêu Cương lĩnh?",["1","2","4","5"],3,"Theo Giáo trình Lịch sử Đảng Cộng sản Việt Nam, tính đến năm 2018 Đảng ta đã ban hành 5 bản Cương lĩnh: Cương lĩnh chính trị đầu tiên (2/1930), Luận cương chính trị (10/1930), Chính cương của Đảng Lao động Việt Nam (2/1951), Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (6/1991) và Cương lĩnh bổ sung, phát triển năm 2011. Các con số ít hơn đều bỏ sót Luận cương 10/1930 hoặc không tính riêng bản bổ sung, phát triển năm 2011.","Khi gặp câu hỏi đếm số Cương lĩnh của Đảng từ năm 1930 đến nay, hãy nhớ đủ 5 mốc năm: 2/1930, 10/1930, 1951, 1991 và 2011; nếu đề hỏi riêng số Cương lĩnh thời kỳ đổi mới thì chọn 2 bản (1991 và 2011)."],[233,3,"“... Văn hóa thực sự trở thành nền tảng tinh thần vững chắc của xã hội, là sức mạnh nội sinh quan trọng bảo đảm sự phát triển bền vững và bảo vệ vững chắc Tổ quốc vì mục tiêu dân giàu, nước mạnh, dân chủ, công bằng, văn minh”. Anh/chị cho biết mục tiêu này được thể hiện trong Nghị quyết nào?",["Nghị quyết số 29-NQ/TW, ngày 4/11/2013, Hội nghị lần thứ 8 Ban Chấp hành Trung ương Đảng (khóa XI)","Nghị quyết số 31-NQ/TW, ngày 14/5/2014, Hội nghị lần thứ 9 Ban Chấp hành Trung ương (khoá XI)","Nghị quyết số 38-NQ/TW, ngày 12/1/2015, Hội nghị lần thứ 10 Ban Chấp hành Trung ương Đảng (khóa XI)","Nghị quyết số 33-NQ/TW, ngày 9/6/2014, Hội nghị lần thứ 9 Ban Chấp hành Trung ương Đảng (khóa XI)"],3,"Mục tiêu đưa văn hóa thực sự trở thành nền tảng tinh thần vững chắc của xã hội và là sức mạnh nội sinh quan trọng bảo đảm sự phát triển bền vững đất nước được xác định trong Nghị quyết số 33-NQ/TW ngày 9/6/2014 của Hội nghị lần thứ 9 Ban Chấp hành Trung ương Đảng khóa XI về xây dựng và phát triển văn hóa, con người Việt Nam đáp ứng yêu cầu phát triển bền vững đất nước. Nghị quyết này phát triển sâu sắc thêm đường lối văn hóa từ Nghị quyết Trung ương 5 khóa VIII (1998).","Rất dễ nhầm số hiệu nghị quyết khóa XI: nếu đề hỏi về đổi mới căn bản, toàn diện giáo dục và đào tạo thì chọn Nghị quyết số 29-NQ/TW ngày 4/11/2013 (Hội nghị Trung ương 8 khóa XI); còn hỏi về văn hóa, con người phát triển bền vững thì chọn Nghị quyết số 33-NQ/TW (Hội nghị Trung ương 9 khóa XI, 9/6/2014)."],[234,3,"Đại hội X của Đảng (4/2006) đã nhận thức về công nghiệp hóa ở Việt Nam kể từ Đại hội III như thế nào?",["Giai đoạn chuẩn bị các tiền đề công nghiệp hóa đất nước đã cơ bản hoàn thành, cho phép nước ta chuyển sang giai đoạn đẩy mạnh công nghiệp hóa, hiện đại hóa đất nước","Công nghiệp hóa được nhận thức là “công nghiệp hóa, hiện đại hóa”","Công nghiệp hóa được nhận thức là “công nghiệp hóa, hiện đại hóa từng bước gắn với phát triển kinh tế tri thức”","Công nghiệp hóa được nhận thức là “công nghiệp hóa, hiện đại hóa gắn với phát triển kinh tế tri thức trong thể chế kinh tế thị trường định hướng xã hội chủ nghĩa và hội nhập kinh tế quốc tế”"],3,"Kế thừa và phát triển tư duy công nghiệp hóa từ Đại hội III đến thời kỳ đổi mới, Đại hội X của Đảng (4/2006) đã có bước đột phá quan trọng khi xác định rõ mô hình công nghiệp hóa ở Việt Nam là 'công nghiệp hóa, hiện đại hóa gắn với phát triển kinh tế tri thức trong thể chế kinh tế thị trường định hướng xã hội chủ nghĩa và hội nhập kinh tế quốc tế'. Các nhận định ngắn gọn hơn phản ánh nhận thức của các kỳ Đại hội trước đó như Đại hội VIII hay Đại hội IX.","Phân biệt nấc thang nhận thức qua các kỳ Đại hội: Đại hội VIII (1996) khẳng định giai đoạn chuẩn bị tiền đề đã cơ bản hoàn thành để chuyển sang đẩy mạnh công nghiệp hóa, hiện đại hóa; Đại hội IX (2001) nêu từng bước phát triển kinh tế tri thức; đến Đại hội X (2006) gắn trực tiếp với kinh tế tri thức, kinh tế thị trường định hướng xã hội chủ nghĩa và hội nhập kinh tế quốc tế."],[235,3,"Nghị quyết số 04-NQ/TW, khóa XII do Tổng Bí thư Nguyễn Phú Trọng ký ban hành ngày 30/10/2016 đã chỉ ra bao nhiêu biểu hiện suy thoái về tư tưởng chính trị, đạo đức, lối sống, những biểu hiện “tự diễn biến”, “tự chuyển hóa” trong nội bộ?",["21 biểu hiện","24 biểu hiện","30 biểu hiện","27 biểu hiện"],3,"Nghị quyết số 04-NQ/TW của Hội nghị Trung ương 4 khóa XII ban hành ngày 30/10/2016 đã nhận diện thẳng thắn, cụ thể 27 biểu hiện suy thoái và 'tự diễn biến', 'tự chuyển hóa' trong nội bộ Đảng. Con số 27 được cấu trúc khoa học thành 3 nhóm đều nhau gồm: 9 biểu hiện suy thoái về tư tưởng chính trị, 9 biểu hiện suy thoái về đạo đức, lối sống và 9 biểu hiện 'tự diễn biến', 'tự chuyển hóa'.","Mẹo ghi nhớ chắc chắn là công thức 3 nhóm nhân 9 biểu hiện bằng 27 biểu hiện; nếu đề tách ra hỏi riêng số biểu hiện suy thoái tư tưởng chính trị hoặc số biểu hiện 'tự diễn biến', 'tự chuyển hóa' thì mỗi nhóm đều là 9 biểu hiện."],[236,3,"Chọn phương án đúng nhất điền vào chỗ trống: Hội nghị Trung ương VIII của Ban Chấp hành Trung ương Đảng khoá V (6/1985) đã chủ trương xoá bỏ cơ chế ...(1)..., lấy giá lương tiền là khâu đột phá để chuyển sang cơ chế ...(2)...",["(1) thị trường xã hội chủ nghĩa; (2) kinh doanh xã hội chủ nghĩa","(1) kế hoạch hóa xã hội chủ nghĩa; (2) kinh doanh xã hội chủ nghĩa","(1) tập trung quan liêu; (2) kinh doanh xã hội chủ nghĩa","(1) tập trung quan liêu hành chính bao cấp; (2) hạch toán, kinh doanh xã hội chủ nghĩa"],3,"Hội nghị Trung ương 8 khóa V (6/1985) đánh dấu bước đột phá thứ hai trong đổi mới tư duy kinh tế của Đảng khi quyết định xóa bỏ cơ chế tập trung quan liêu hành chính bao cấp, lấy giá - lương - tiền làm khâu đột phá để chuyển nền kinh tế sang cơ chế hạch toán, kinh doanh xã hội chủ nghĩa. Các phương án khác lược bỏ mất từ 'hành chính bao cấp' và 'hạch toán' hoặc dùng sai khái niệm 'thị trường xã hội chủ nghĩa'.","Ghi nhớ bộ ba bước đột phá tư duy kinh tế trước Đại hội VI: Hội nghị Trung ương 6 khóa IV (8/1979) 'làm cho sản xuất bung ra'; Hội nghị Trung ương 8 khóa V (6/1985) đột phá giá - lương - tiền chuyển sang hạch toán, kinh doanh xã hội chủ nghĩa; Kết luận Bộ Chính trị khóa V (8/1986) về ba quan điểm kinh tế."],[237,3,"Trong nền kinh tế kế hoạch hóa tập trung quan liêu, bao cấp thời kỳ trước đổi mới ở nước ta chưa thừa nhận vấn đề gì?",["Chế độ “cấp phát – giao nộp”","Cơ chế “xin – cho\"","Quản lý kinh tế bằng mệnh lệnh","Nền sản xuất hàng hóa và cơ chế thị trường"],3,"Trong thời kỳ trước đổi mới (trước năm 1986), mô hình kinh tế kế hoạch hóa tập trung quan liêu, bao cấp tuyệt đối hóa sở hữu nhà nước và tập thể, chỉ phân bổ sản phẩm theo kế hoạch hiện vật nên chưa thừa nhận sự tồn tại của nền sản xuất hàng hóa và cơ chế thị trường. Ngược lại, chế độ 'cấp phát - giao nộp', cơ chế 'xin - cho' và quản lý bằng mệnh lệnh hành chính chính là những đặc trưng cố hữu của mô hình bao cấp ấy.","Nếu đề hỏi đặc trưng nổi bật của cơ chế kế hoạch hóa tập trung bao cấp trước đổi mới thì chọn chế độ 'cấp phát - giao nộp', cơ chế 'xin - cho' và quản lý bằng mệnh lệnh hành chính; còn điều cơ chế này phủ nhận chính là sản xuất hàng hóa và cơ chế thị trường."],[238,3,"Đặc trưng xây dựng xã hội xã hội chủ nghĩa về “Do nhân dân lao động làm chủ” và “Do nhân dân làm chủ”, đặc trưng này là điểm khác nhau giữa hai Cương lĩnh nào?",["Chánh cương của Đảng Lao động Việt Nam và Cương lĩnh chính trị đầu tiên của Đảng","Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung, phát triển năm 2011) và Chánh cương của Đảng Lao động Việt Nam","Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội năm 1991 và Chánh cương của Đảng Lao động Việt Nam","Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội năm 1991 và Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung, phát triển năm 2011)"],3,"Khi so sánh hai bản Cương lĩnh thời kỳ đổi mới, Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội năm 1991 nêu đặc trưng 'Do nhân dân lao động làm chủ', còn Cương lĩnh bổ sung, phát triển năm 2011 đã mở rộng thành 'Do nhân dân làm chủ' nhằm phát huy sâu rộng hơn nữa quyền làm chủ và sức mạnh đại đoàn kết toàn dân tộc. Các văn kiện năm 1930 và 1951 thuộc thời kỳ cách mạng giải phóng dân tộc nên không chứa cặp đặc trưng này.","Bên cạnh sự điều chỉnh từ 'nhân dân lao động làm chủ' (1991) thành 'nhân dân làm chủ' (2011), đề cũng hay hỏi điểm mới khác giữa hai bản Cương lĩnh này như số đặc trưng tăng từ 6 lên 8 và số phương hướng cơ bản tăng từ 7 lên 8."],[239,3,"Hội nghị Đại biểu toàn quốc giữa nhiệm kỳ khoá VII (01/1994) đã xác định những nguy cơ nào mà chúng ta có thể gặp phải trước mắt?",["Nguy cơ tụt hậu xa hơn về địa vị kinh tế","Nguy cơ chệch hướng bản chất xã hội chủ nghĩa","Âm mưu và hành động “tranh chấp biển” của các thế lực thù địch","Nguy cơ tụt hậu xa hơn về kinh tế; chệch hướng xã hội chủ nghĩa; tham nhũng; âm mưu và hành động “diễn biến hòa bình” của các thế lực thù địch"],3,"Hội nghị Đại biểu toàn quốc giữa nhiệm kỳ khóa VII (1/1994) là dấu mốc lịch sử khi lần đầu tiên Đảng nhận diện toàn diện 4 nguy cơ lớn mà cách mạng Việt Nam phải đối mặt: tụt hậu xa hơn về kinh tế so với nhiều nước trong khu vực và trên thế giới; chệch hướng xã hội chủ nghĩa; nạn tham nhũng và tệ quan liêu; và âm mưu, hành động 'diễn biến hòa bình' của các thế lực thù địch. Các phương án khác hoặc chỉ nêu thiếu một nguy cơ, hoặc ghép sai cụm từ 'tranh chấp biển'.","Hãy gắn chặt cụm '4 nguy cơ' với Hội nghị Đại biểu toàn quốc giữa nhiệm kỳ khóa VII (1/1994); đây cũng là hội nghị lần đầu tiên Đảng sử dụng chính thức khái niệm 'công nghiệp hóa, hiện đại hóa' và khái niệm 'Nhà nước pháp quyền xã hội chủ nghĩa'."],[240,3,"Đại hội VI của Đảng đã phê phán những sai lầm trong nhận thức và chủ trương công nghiệp hóa thời kỳ 1960-1985. Phương án nào chỉ ra rằng chúng ta chưa chuẩn bị tốt các tiền đề dân sinh cho công nghiệp hóa?",["Chúng ta đã xác định đúng mục tiêu và bước đi về xây dựng cơ sở vật chất - kỹ thuật","Đã chủ trương đẩy mạnh công nghiệp hóa trong khi chưa có đủ các tiền đề cần thiết","Trong việc bố trí cơ cấu kinh tế thường chỉ xuất phát từ lòng mong muốn đi nhanh","Không tập trung giải quyết vấn đề cơ bản là lương thực, thực phẩm, hàng tiêu dùng và hàng xuất khẩu"],3,"Khi kiểm điểm sai lầm chủ quan, duy ý chí trong đường lối công nghiệp hóa thời kỳ 1960-1985, Đại hội VI (12/1986) chỉ rõ nguyên nhân dẫn tới thiếu hụt các tiền đề dân sinh là do nóng vội ưu tiên công nghiệp nặng mà không tập trung giải quyết những vấn đề cơ bản thiết yếu nhất gồm lương thực, thực phẩm, hàng tiêu dùng và hàng xuất khẩu. Các phương án nói về việc đẩy mạnh công nghiệp hóa khi chưa đủ tiền đề hay mong muốn đi nhanh mới chỉ nhận xét chung về tư duy chủ quan chứ chưa chỉ cụ thể nội dung dân sinh.","Gắn trực tiếp bài học này với quyết sách kinh tế lớn nhất của Đại hội VI (12/1986): chuyển hướng chiến lược sang thực hiện Ba chương trình kinh tế lớn là lương thực - thực phẩm, hàng tiêu dùng và hàng xuất khẩu."],[241,3,"Hệ thống chính trị ở Việt Nam bao gồm những thành tố nào?",["Đảng, Nhà nước, Mặt trận Tổ quốc","Đảng, Nhà nước và các đoàn thể chính trị - xã hội","Đảng lãnh đạo, Nhà nước quản lý và nhân dân làm chủ","Đảng Cộng sản Việt Nam, Nhà nước CHXHCN Việt Nam, Mặt trận Tổ quốc Việt Nam và các đoàn thể chính trị - xã hội"],3,"Theo Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội và Hiến pháp nước ta, hệ thống chính trị ở Việt Nam gồm ba bộ phận cấu thành thống nhất: Đảng Cộng sản Việt Nam (hạt nhân lãnh đạo), Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam (trụ cột quản lý xã hội bằng pháp luật), cùng Mặt trận Tổ quốc Việt Nam và các đoàn thể chính trị - xã hội (cơ sở chính trị của chính quyền nhân dân). Các phương án khác đều thiếu thành tố hoặc nhầm sang cơ chế vận hành.","Đừng nhầm lẫn hai câu hỏi rất gần nhau: nếu đề hỏi 'thành tố/cấu trúc' của hệ thống chính trị thì chọn đầy đủ Đảng, Nhà nước, Mặt trận Tổ quốc và các đoàn thể chính trị - xã hội; còn nếu hỏi 'cơ chế vận hành' của hệ thống chính trị thì chọn 'Đảng lãnh đạo, Nhà nước quản lý, nhân dân làm chủ'."],[242,3,"Đại hội đồng Tổ chức Giáo dục, Khoa học và Văn hóa Liên Hiệp Quốc (UNESCO) ra Nghị quyết 24C/18.65 về việc Kỷ niệm 100 năm Ngày sinh của Chủ tịch Hồ Chí Minh, trong đó ghi rõ “Chủ tịch Hồ Chí Minh là Anh hùng giải phóng dân tộc và Nhà văn hóa kiệt xuất của Việt Nam”. Anh/chị cho biết Nghị quyết trên được ban hành năm nào?",["Năm 1985","Năm 1986","Năm 1989","Năm 1987"],3,"Tại Khóa họp lần thứ 24 diễn ra ở Paris từ ngày 20/10 đến 20/11/1987, Đại hội đồng Tổ chức Giáo dục, Khoa học và Văn hóa Liên hợp quốc (UNESCO) đã thông qua Nghị quyết 24C/18.65 khuyến nghị các nước thành viên tổ chức kỷ niệm 100 năm ngày sinh Chủ tịch Hồ Chí Minh vào năm 1990 và tôn vinh Người là Anh hùng giải phóng dân tộc và Nhà văn hóa kiệt xuất của Việt Nam. Các năm 1985, 1986 và 1989 đều không trùng với khóa họp lần thứ 24 này.","Cần phân biệt hai mốc năm dễ bị trộn lẫn: năm 1987 là năm UNESCO ban hành Nghị quyết 24C/18.65, còn năm 1990 mới là năm tổ chức kỷ niệm 100 năm Ngày sinh của Chủ tịch Hồ Chí Minh (1890-1990)."],[243,3,"Tại Hội nghị Trung ương 5 khóa VIII (7/1998), quan điểm nào trong các quan điểm sau đây nói về chức năng, vị trí, vai trò đặc biệt quan trọng của văn hóa đối với sự phát triển kinh tế - xã hội?",["Nền văn hoá mà chúng ta xây dựng là nền văn hoá tiên tiến, đậm đà bản sắc dân tộc","Nền văn hoá Việt Nam là nền văn hoá thống nhất mà đa dạng trong cộng đồng các dân tộc Việt Nam","Xây dựng và phát triển văn hoá là sự nghiệp của toàn dân do Đảng lãnh đạo, trong đó đội ngũ trí thức giữ vai trò quan trọng","Văn hóa là nền tảng tinh thần của xã hội, vừa là mục tiêu, vừa là động lực thúc đẩy sự phát triển kinh tế - xã hội"],3,"Hội nghị Trung ương 5 khóa VIII (7/1998) ban hành Nghị quyết về xây dựng và phát triển nền văn hóa Việt Nam tiên tiến, đậm đà bản sắc dân tộc với 5 quan điểm chỉ đạo lớn. Trong đó, quan điểm thứ nhất khẳng định chức năng, vị trí, vai trò đặc biệt quan trọng của văn hóa là: 'Văn hóa là nền tảng tinh thần của xã hội, vừa là mục tiêu, vừa là động lực thúc đẩy sự phát triển kinh tế - xã hội'. Các phương án còn lại nói về tính chất, đặc trưng đa dạng và chủ thể xây dựng văn hóa.","Phân biệt 4 quan điểm đầu của Nghị quyết Trung ương 5 khóa VIII (7/1998): 'nền tảng tinh thần, mục tiêu, động lực' nói về vị trí, vai trò; 'tiên tiến, đậm đà bản sắc dân tộc' nói về tính chất; 'thống nhất mà đa dạng' nói về đặc trưng dân tộc; 'sự nghiệp toàn dân, trí thức giữ vai trò quan trọng' nói về lực lượng xây dựng."],[244,3,"Hội nghị lần thứ tư Ban Chấp hành Trung ương Đảng khóa XII (30/10/2016) đã ban hành Nghị quyết về tăng cường ...(1)...; ngăn chặn, đẩy lùi sự suy thoái về tư tưởng chính trị, đạo đức, lối sống, những biểu hiện ...(2)... trong nội bộ. Chọn phương án đúng nhất điền vào chỗ trống.",["(1) xây dựng Đảng; (2) “suy thoái\"","(1) xây dựng, chỉnh đốn Đảng; (2) “suy thoái\"","(1) xây dựng Đảng; (2) “suy thoái”, “tự chuyển hóa”","(1) xây dựng, chỉnh đốn Đảng; (2) “tự diễn biến”, “tự chuyển hóa”"],3,"Ngày 30/10/2016, Hội nghị lần thứ tư Ban Chấp hành Trung ương Đảng khóa XII ban hành Nghị quyết số 04-NQ/TW với tên gọi đầy đủ là: 'Về tăng cường xây dựng, chỉnh đốn Đảng; ngăn chặn, đẩy lùi sự suy thoái về tư tưởng chính trị, đạo đức, lối sống, những biểu hiện tự diễn biến, tự chuyển hóa trong nội bộ'. Văn kiện đặt song hành hai vế 'xây dựng, chỉnh đốn Đảng' và xác định rõ mối nguy từ 'tự diễn biến', 'tự chuyển hóa', nên các phương án lặp lại từ 'suy thoái' hay thiếu vế 'chỉnh đốn' đều không chuẩn xác.","Phân biệt tên hai nghị quyết xây dựng Đảng nổi tiếng: Nghị quyết Trung ương 4 khóa XI (1/2012) có tên 'Một số vấn đề cấp bách về xây dựng Đảng hiện nay', còn Nghị quyết Trung ương 4 khóa XII (30/10/2016) gắn với cặp từ khóa 'xây dựng, chỉnh đốn Đảng' và 'tự diễn biến, tự chuyển hóa'."],[245,3,"Sau thắng lợi của cuộc kháng chiến chống Mỹ và hoàn thành thống nhất đất nước về nhiệm vụ nhà nước, cách mạng nước ta chuyển sang giai đoạn mới. Đó là giai đoạn gì?",["Thực hiện kế hoạch 5 năm (1976-1980)","Cải tạo quan hệ sản xuất","Xây dựng cơ sở vật chất kĩ thuật của CNXH","Đất nước độc lập, thống nhất, đi lên CNXH"],3,"Sau Đại thắng mùa Xuân năm 1975 và hoàn thành thống nhất đất nước về mặt nhà nước tại Kỳ họp thứ nhất Quốc hội khóa VI (7/1976), Đại hội IV của Đảng (12/1976) khẳng định cách mạng Việt Nam đã chuyển sang giai đoạn lịch sử mới: đất nước độc lập, thống nhất, cả nước cùng đi lên chủ nghĩa xã hội. Các nội dung như kế hoạch 5 năm (1976-1980), cải tạo quan hệ sản xuất hay xây dựng cơ sở vật chất - kỹ thuật chỉ là những nhiệm vụ bộ phận nằm trong giai đoạn chiến lược tổng quát này.","Nếu đề hỏi văn kiện chính thức xác định đường lối chung cho giai đoạn cả nước độc lập, thống nhất đi lên chủ nghĩa xã hội thì chọn Đại hội IV (12/1976); còn nếu hỏi bước ngoặt khởi xướng đổi mới toàn diện thì chọn Đại hội VI (12/1986)."],[246,3,"Nói về tác dụng của đấu tranh tự phê bình và phê bình trong xây dựng, chỉnh đốn Đảng, Chủ tịch Hồ Chí Minh từng so sánh: “Dao có mài, mới sắc Vàng có thui, mới trong Nước có lọc, mới sạch Người có tự phê bình, mới tiến bộ. Đảng cũng thế”. Câu nói đó được Chủ tịch Hồ Chí Minh viết trong tác phẩm nào?",["Phê bình","Di chúc","Dân vận","Tự phê bình"],3,"Những câu ví von sinh động 'Dao có mài, mới sắc / Vàng có thui, mới trong / Nước có lọc, mới sạch / Người có tự phê bình, mới tiến bộ. Đảng cũng thế' được Chủ tịch Hồ Chí Minh viết trong bài báo 'Tự phê bình' đăng trên Báo Nhân Dân ngày 20/5/1951. Tác phẩm nhấn mạnh tự phê bình là quy luật phát triển tất yếu giúp mỗi cán bộ, đảng viên và tổ chức Đảng ngày càng trong sạch, vững mạnh.","Đừng nhầm với tác phẩm 'Dân vận' (15/10/1949) nêu phương châm 'óc nghĩ, mắt trông, tai nghe, chân đi, miệng nói, tay làm' hay 'Di chúc' (1965-1969) căn dặn giữ gìn sự đoàn kết nhất trí và thường xuyên tự phê bình, phê bình có tình đồng chí thương yêu lẫn nhau."],[247,3,"Chọn phương án đúng nhất điền vào chỗ trống: “Bảo hiểm xã hội là một trụ cột chính của hệ thống ........... trong nền kinh tế thị trường định hướng xã hội chủ nghĩa”",["chính sách cho người lao động","chăm sóc sức khỏe cộng đồng","chính sách xã hội","an sinh xã hội"],3,"Trong các văn kiện về chính sách xã hội của Đảng, tiêu biểu là Nghị quyết số 28-NQ/TW (5/2018) của Hội nghị Trung ương 7 khóa XII về cải cách chính sách bảo hiểm xã hội, Đảng khẳng định nguyên văn: 'Bảo hiểm xã hội là một trụ cột chính của hệ thống an sinh xã hội trong nền kinh tế thị trường định hướng xã hội chủ nghĩa'. Cách diễn đạt 'an sinh xã hội' chuẩn xác về mặt thuật ngữ, còn 'chính sách xã hội' quá rộng và 'chăm sóc sức khỏe cộng đồng' quá hẹp.","Ghi nhớ cụm thuật ngữ chuẩn 'an sinh xã hội' gắn với Nghị quyết số 15-NQ/TW (Trung ương 5 khóa XI, 6/2012) về một số vấn đề chính sách xã hội và Nghị quyết số 28-NQ/TW (Trung ương 7 khóa XII, 5/2018) về cải cách chính sách bảo hiểm xã hội."],[248,3,"Đổi mới không phải là thay đổi mục tiêu chủ nghĩa xã hội, vậy đổi mới cần phải làm gì?",["Làm cho chủ nghĩa xã hội ngày càng tốt đẹp hơn.","Làm cho mục tiêu đã đề ra nhanh chóng được thực hiện.","Làm cho mục tiêu đã đề ra phù hợp với thực tiễn đất nước","Làm cho mục tiêu ấy được thực hiện có hiệu quả"],3,"Tại Hội nghị Trung ương 6 khóa VI (3/1989), khi đề ra 6 nguyên tắc chỉ đạo công cuộc đổi mới, Đảng khẳng định rõ: đi lên chủ nghĩa xã hội là con đường tất yếu, đổi mới không phải là thay đổi mục tiêu xã hội chủ nghĩa mà là làm cho mục tiêu ấy được thực hiện có hiệu quả bằng những quan niệm đúng đắn về chủ nghĩa xã hội, những hình thức, bước đi và biện pháp thích hợp. Các diễn đạt khác không đúng nguyên văn cốt lõi của nguyên tắc đổi mới này.","Nếu đề hỏi hội nghị lần đầu tiên xác lập các nguyên tắc cơ bản của công cuộc đổi mới (nhấn mạnh kiên định mục tiêu chủ nghĩa xã hội và vai trò lãnh đạo của Đảng) thì chọn Hội nghị Trung ương 6 khóa VI (3/1989)."],[249,3,"Trong các đặc trưng chủ yếu của công nghiệp hóa, hiện đại hóa thời kỳ trước đổi mới, đặc trưng nào sau đây khiến cho chủ lực thực hiện công nghiệp hóa chỉ là Nhà nước?",["Công nghiệp hóa thiên về phát triển công nghiệp nặng","Công nghiệp hóa chủ yếu dựa vào lợi thế về lao động, tài nguyên, đất đai","Ham làm nhanh, làm lớn, không quan tâm đến hiệu quả kinh tế-xã hội","Tiến hành công nghiệp hóa thông qua cơ chế kế hoạch hóa tập trung quan liêu, bao cấp"],3,"Trước đổi mới, vì công nghiệp hóa được tiến hành thông qua cơ chế kế hoạch hóa tập trung quan liêu, bao cấp — không thừa nhận kinh tế tư nhân và cơ chế thị trường — nên Nhà nước nắm độc quyền phân bổ mọi nguồn lực và trở thành chủ lực duy nhất thực hiện công nghiệp hóa. Các đặc trưng còn lại đề cập đến cơ cấu ngành thiên về công nghiệp nặng, nguồn lực dựa vào lao động - tài nguyên hoặc tư duy nóng vội, chưa giải thích trực tiếp vai trò độc tôn của Nhà nước.","Nếu đề hỏi điểm khác biệt căn bản của công nghiệp hóa, hiện đại hóa thời kỳ đổi mới so với trước đổi mới thì chọn: sự nghiệp của toàn dân và mọi thành phần kinh tế, trong đó kinh tế nhà nước giữ vai trò chủ đạo, vận hành theo cơ chế thị trư   // Minimal zero-dependency QR Code encoder (ISO/IEC 18004, Byte mode, ECC M, Versions 1..8)
const GF_EXP = new Uint8Array(512);
const GF_LOG = new Uint8Array(256);
(() => {
  let x = 1;
  for (let i = 0; i < 255; i++) {
    GF_EXP[i] = x;
    GF_LOG[x] = i;
    x <<= 1;
    if (x & 0x100) x ^= 0x11d;
  }
  for (let i = 255; i < 512; i++) GF_EXP[i] = GF_EXP[i - 255];
})();

function gfMul(a, b) {
  return a === 0 || b === 0 ? 0 : GF_EXP[GF_LOG[a] + GF_LOG[b]];
}

function rsGeneratorPoly(ecLen) {
  let g = [1];
  for (let i = 0; i < ecLen; i++) {
    const next = new Array(g.length + 1).fill(0);
    const root = GF_EXP[i];
    for (let j = 0; j < g.length; j++) {
      next[j] ^= g[j];
      next[j + 1] ^= gfMul(g[j], root);
    }
    g = next;
  }
  return g;
}

function rsEncode(data, ecLen) {
  const gen = rsGeneratorPoly(ecLen);
  const res = new Uint8Array(data.length + ecLen);
  res.set(data);
  for (let i = 0; i < data.length; i++) {
    const coef = res[i];
    if (coef !== 0) {
      for (let j = 0; j < gen.length; j++) {
        res[i + j] ^= gfMul(gen[j], coef);
      }
    }
  }
  return res.slice(data.length);
}

// Version specs for ECC Level M: [totalDataBytes, ecPerBlock, [group1Count, group1Data, group2Count, group2Data], alignCoords]
const SPECS_M = {
  1: [16, 10, [1, 16, 0, 0], []],
  2: [28, 16, [1, 28, 0, 0], [6, 18]],
  3: [44, 26, [1, 44, 0, 0], [6, 22]],
  4: [64, 18, [2, 32, 0, 0], [6, 26]],
  5: [86, 24, [2, 43, 0, 0], [6, 30]],
  6: [108, 16, [4, 27, 0, 0], [6, 34]],
  7: [124, 18, [4, 31, 0, 0], [6, 22, 38]],
  8: [154, 22, [2, 38, 2, 39], [6, 24, 42]],
};

function encodeBytesToCodewords(bytes) {
  let version = 0;
  for (let v = 1; v <= 8; v++) {
    // 4-bit mode + 8-bit length + 8*bytes + up to 4 terminator bits <= totalDataBytes*8
    if (4 + 8 + bytes.length * 8 <= SPECS_M[v][0] * 8) {
      version = v;
      break;
    }
  }
  if (!version) throw new Error('QR payload too long for Versions 1..8');

  const [totalData, ecLen, [g1c, g1d, g2c, g2d], align] = SPECS_M[version];
  const bits = [];
  const pushBits = (val, len) => {
    for (let i = len - 1; i >= 0; i--) bits.push((val >> i) & 1);
  };
  pushBits(0b0100, 4); // Byte mode
  pushBits(bytes.length, 8); // Char count (V1..V9)
  for (const b of bytes) pushBits(b, 8);
  const maxBits = totalData * 8;
  for (let i = 0; i < 4 && bits.length < maxBits; i++) bits.push(0);
  while (bits.length % 8 !== 0) bits.push(0);

  const data = [];
  for (let i = 0; i < bits.length; i += 8) {
    let val = 0;
    for (let j = 0; j < 8; j++) val = (val << 1) | bits[i + j];
    data.push(val);
  }
  const pads = [0xec, 0x11];
  let pi = 0;
  while (data.length < totalData) {
    data.push(pads[pi & 1]);
    pi++;
  }

  // Split into blocks and interleave
  const blocksData = [];
  const blocksEc = [];
  let offset = 0;
  for (let i = 0; i < g1c; i++) {
    const slice = data.slice(offset, offset + g1d);
    offset += g1d;
    blocksData.push(slice);
    blocksEc.push(Array.from(rsEncode(slice, ecLen)));
  }
  for (let i = 0; i < g2c; i++) {
    const slice = data.slice(offset, offset + g2d);
    offset += g2d;
    blocksData.push(slice);
    blocksEc.push(Array.from(rsEncode(slice, ecLen)));
  }

  const finalBytes = [];
  const maxD = Math.max(g1d, g2d);
  for (let i = 0; i < maxD; i++) {
    for (const bd of blocksData) if (i < bd.length) finalBytes.push(bd[i]);
  }
  for (let i = 0; i < ecLen; i++) {
    for (const be of blocksEc) if (i < be.length) finalBytes.push(be[i]);
  }

  return { version, align, finalBytes };
}

function calcFormatBits(maskIdx) {
  // ECC Level M = 00
  const data = (0b00 << 3) | maskIdx;
  let rem = data << 10;
  const gen = 0b10100110111;
  for (let i = 14; i >= 10; i--) {
    if ((rem >> i) & 1) rem ^= gen << (i - 10);
  }
  return ((data << 10) | rem) ^ 0b101010000010010;
}

function calcVersionBits(version) {
  let rem = version << 12;
  const gen = 0b1111100100101;
  for (let i = 17; i >= 12; i--) {
    if ((rem >> i) & 1) rem ^= gen << (i - 12);
  }
  return (version << 12) | rem;
}

function createMatrix(version, align, finalBytes) {

  const setFunc = (r, c, v) => {
    if (r >= 0 && r < size && c >= 0 && c < size) {
      mod[r][c] = v ? 1 : 0;
      isFunc[r][c] = 1;
    }
  };

  const drawFinder = (r0, c0) => {
    for (let dr = -1; dr <= 7; dr++) {
      for (let dc = -1; dc <= 7; dc++) {
        const r = r0 + dr, c = c0 + dc;
        if (r < 0 || r >= size || c < 0 || c >= size) continue;
        const on =
          (dr >= 0 && dr <= 6 && (dc === 0 || dc === 6)) ||
          (dc >= 0 && dc <= 6 && (dr === 0 || dr === 6)) ||
          (dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4);
        setFunc(r, c, on);
      }
    }
  };
  drawFinder(0, 0);
  drawFinder(0, size - 7);
  drawFinder(size - 7, 0);

  for (const ar of align) {
    for (const ac of align) {
      if ((ar === 6 && ac === 6) || (ar === 6 && ac === size - 7) || (ar === size - 7 && ac === 6)) continue;
      for (let dr = -2; dr <= 2; dr++) {

  }

    (r, c) => c % 3 === 0,
    (r, c) => (r + c) % 3 === 0,

  const penalty = (grid) => {

    }

      let run = 1;
      for (let r = 1; r < size; r++) {

        else { if (run >= 5) score += 3 + (run - 5); run = 1; }

          (arr[i]===0&&arr[i+1]===0&&arr[i+2]===0&&arr[i+3]===0&&arr[i+4]===1&&arr[i+5]===0&&arr[i+6]===1&&arr[i+7]===1&&arr[i+8]===1&&arr[i+9]===0&&arr[i+10]===1)
        ) hits++;

    for (let c = 0; c < size; c++) {
