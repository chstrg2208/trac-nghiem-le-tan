<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#BD1E59">
<meta name="description" content="Ôn tập trắc nghiệm Lịch sử Đảng Cộng sản Việt Nam: 250 câu đủ 3 chương có giải thích chi tiết từng câu, mẹo liên hệ nếu đề hỏi khác, tráo câu hỏi & đáp án A-B-C-D và mã QR.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FFE4EC'/%3E%3Cpath d='M7 13L6 5l6 4q4-1 8 0l6-4-1 8c3 3 3 10-2 13-4 2-10 2-14 0-5-3-5-10-2-13z' fill='%23FFF' stroke='%234A1026' stroke-width='1.5'/%3E%3Ccircle cx='12' cy='18' r='1.3' fill='%234A1026'/%3E%3Ccircle cx='20' cy='18' r='1.3' fill='%234A1026'/%3E%3Cellipse cx='16' cy='20.5' rx='1.8' ry='1.2' fill='%23FBBF24'/%3E%3Ccircle cx='22' cy='9' r='2.5' fill='%23E11D48'/%3E%3C/svg%3E">
<title>Lịch sử Đảng CSVN · Trắc nghiệm 250 câu (Hello Kitty)</title>
<style>
  :root {
    --bg-desk: #FFDCE8;
    --bg-page: #FFF9FB;
    --bg-strip: #FFEFF4;
    --bg-card: rgba(255, 255, 255, 0.93);
    --bg-card-solid: #FFFFFF;
    --navy: #BD1E59;
    --navy-soft: #9F1548;
    --ribbon: #E11D48;
    --ink: #4A1026;
    --ink-body: #5C1B33;
    --ink-muted: #88465F;
    --border: #F4C3D4;
    --border-strong: #E494B0;
    --teal: #0F766E;
    --teal-bg: #ECFDF5;
    --teal-text: #064E3B;
    --crimson: #B91C1C;
    --crimson-bg: #FEF2F2;
    --crimson-text: #7F1D1D;
    --amber: #B45309;
    --amber-bg: #FEF3C7;
    --amber-text: #78350F;
    --twist-bg: #FFF7ED;
    --twist-border: #FDBA74;
    --twist-ink: #7C2D12;
    --selected-bg: #FDF2F8;
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 18px;
    --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg-page);
    color: var(--ink);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  ::selection { background: var(--navy); color: #FFFFFF; }
  button, input { font-family: inherit; }

  .tnum { font-variant-numeric: tabular-nums; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  /* Flying Kitty Sky Backdrop */
  .sky-backdrop {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
    display: none;
  }
  @media (min-width: 768px) {
    .sky-backdrop { display: block; }
  }
  .stage-sky {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .fly-obj {
    position: absolute;
    will-change: transform;
    pointer-events: none;
  }
  .fly-cat-a {
    animation: kitty-glide-lr var(--dur, 18s) linear var(--del, 0s) infinite;
    opacity: var(--op, 0.42);
  }
  .fly-cat-b {
    animation: kitty-glide-rl var(--dur, 21s) linear var(--del, 0s) infinite;
    opacity: var(--op, 0.38);
  }
  .fly-float {
    animation: kitty-bob var(--dur, 6s) ease-in-out var(--del, 0s) infinite;
    opacity: var(--op, 0.45);
  }
  .kitty-wing-l {
    transform-origin: 18px 25px;
    animation: wing-l 0.9s ease-in-out infinite alternate;
  }
  .kitty-wing-r {
    transform-origin: 46px 25px;
    animation: wing-r 0.9s ease-in-out infinite alternate;
  }
  @keyframes wing-l {
    from { transform: rotate(-14deg); }
    to { transform: rotate(12deg); }
  }
  @keyframes wing-r {
    from { transform: rotate(14deg); }
    to { transform: rotate(-12deg); }
  }
  @keyframes kitty-glide-lr {
    0% { transform: translate3d(-120px, 18px, 0) rotate(-6deg); }
    25% { transform: translate3d(28vw, -14px, 0) rotate(4deg); }
    50% { transform: translate3d(58vw, 16px, 0) rotate(-4deg); }
    75% { transform: translate3d(88vw, -12px, 0) rotate(5deg); }
    100% { transform: translate3d(calc(100vw + 140px), 10px, 0) rotate(-5deg); }
  }
  @keyframes kitty-glide-rl {
    0% { transform: translate3d(calc(100vw + 120px), -10px, 0) rotate(6deg); }
    25% { transform: translate3d(72vw, 18px, 0) rotate(-4deg); }
    50% { transform: translate3d(42vw, -14px, 0) rotate(4deg); }
    75% { transform: translate3d(14vw, 14px, 0) rotate(-5deg); }
    100% { transform: translate3d(-140px, -8px, 0) rotate(5deg); }
  }
  @keyframes kitty-bob {
    0%, 100% { transform: translate3d(0, 0, 0) rotate(-4deg); }
    50% { transform: translate3d(0, -14px, 0) rotate(5deg); }
  }
  @keyframes mascot-hop {
    0%, 100% { transform: translateY(0) scale(1); }
    35% { transform: translateY(-6px) rotate(-6deg) scale(1.08); }
    70% { transform: translateY(-2px) rotate(5deg) scale(1.04); }
  }
  .kitty-mascot.hop {
    animation: mascot-hop 520ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  @media (prefers-reduced-motion: reduce) {
    .fly-cat-a, .fly-cat-b, .fly-float, .kitty-wing-l, .kitty-wing-r, .kitty-mascot.hop {
      animation: none !important;
    }
    .fly-cat-a { transform: translate3d(16px, 0, 0); }
    .fly-cat-b { transform: translate3d(calc(100% - 76px), 0, 0); }
  }

  /* Outer App Frame */
  .app-frame {
    position: relative;
    z-index: 1;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg-page);
    width: 100%;
    overflow: hidden;
  }

  @media (min-width: 768px) {
    body { background: var(--bg-desk); padding: 14px; }
    .app-frame {
      max-width: 1080px;
      height: calc(100dvh - 28px);
      margin: 0 auto;
      border: 1.5px solid #EEABC1;
      border-radius: 22px;
    }
  }

  /* Header Bar */
  .topbar {
    background: var(--navy);
    color: #FFFFFF;
    padding: 11px 16px 10px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }
  .toprow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .brand-wrap {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
  }
  .kitty-mascot {
    appearance: none;
    border: none;
    background: transparent;
    padding: 0;
    margin: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    border-radius: 50%;
  }
  .kitty-mascot:focus-visible { outline: 2px solid #FFFFFF; outline-offset: 2px; }
  h1.brand {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.015em;
    color: #FFFFFF;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .brand-credit {
    font-size: 11px;
    font-weight: 500;
    color: #FFE4EC;
    white-space: nowrap;
    display: none;
  }
  @media (min-width: 540px) { .brand-credit { display: inline; } }

  .qr-trigger {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--navy-soft);
    color: #FFFFFF;
    border: 1px solid rgba(255, 255, 255, 0.34);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
    min-height: 34px;
  }
  .qr-trigger:hover { background: #83113B; }
  .qr-trigger:focus-visible { outline: 2px solid #FFFFFF; outline-offset: 2px; }

  .tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .tab {
    appearance: none;
    background: rgba(255, 255, 255, 0.14);
    color: #FFFFFF;
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 11px;
    padding: 7px 4px;
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    min-height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    white-space: nowrap;
  }
  .tab:hover { background: rgba(255, 255, 255, 0.22); }
  .tab.active {
    background: var(--bg-page);
    color: var(--navy-soft);
    border-color: var(--bg-page);
  }
  .tab:focus-visible { outline: 2px solid #FFFFFF; outline-offset: 1px; }
  .tab-count { font-variant-numeric: tabular-nums; opacity: 0.92; }

  /* Chapter Filter Strip */
  .chapter-bar {
    background: #FFF4F7;
    border-bottom: 1px solid var(--border);
    padding: 7px 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    overflow-x: auto;
    flex-shrink: 0;
    scrollbar-width: none;
    position: relative;
    z-index: 2;
  }
  .chapter-bar::-webkit-scrollbar { display: none; }
  .chapter-bar.hidden { display: none; }
  .ch-pill {
    appearance: none;
    border: 1px solid var(--border);
    background: #FFFFFF;
    color: var(--ink-body);
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    flex-shrink: 0;
  }
  .ch-pill.active {
    background: var(--navy);
    border-color: var(--navy);
    color: #FFFFFF;
  }
  .ch-pill:focus-visible { outline: 2px solid var(--navy); outline-offset: 1px; }

  /* Mode & Status Strip */
  .statusstrip {
    background: var(--bg-strip);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }
  .mode-switch {
    display: inline-flex;
    background: #FAD4E1;
    border: 1px solid #F0A9C2;
    border-radius: 999px;
    padding: 2px;
    gap: 2px;
  }
  .mode-btn {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink);
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    min-height: 30px;
  }
  .mode-btn.active { background: var(--teal); color: #FFFFFF; }
  .mode-btn.exam-active { background: var(--navy); color: #FFFFFF; }
  .mode-btn:focus-visible { outline: 2px solid var(--navy); outline-offset: 1px; }

  .status-right {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    flex-wrap: wrap;
  }
  .stat-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--bg-card-solid);
    border: 1px solid var(--border);
    color: var(--ink);
  }
  .stat-pill.good { background: var(--teal-bg); border-color: #99F6E4; color: var(--teal-text); }
  .stat-pill.warn { background: var(--crimson-bg); border-color: #FECACA; color: var(--crimson-text); }

  .mini-action {
    appearance: none;
    border: 1px solid var(--border-strong);
    background: var(--bg-card-solid);
    color: var(--ink);
    border-radius: 999px;
    padding: 4px 11px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    min-height: 30px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .mini-action.primary { background: var(--navy); border-color: var(--navy); color: #FFFFFF; }
  .mini-action:hover { opacity: 0.92; }
  .mini-action:focus-visible { outline: 2px solid var(--navy); outline-offset: 1px; }

  .progbar {
    height: 4px;
    background: #FCDFE9;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }
  .shuffle-bar {
    background: #FFF4F7;
    border-bottom: 1px solid var(--border);
    padding: 6px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }
  .shuffle-bar::-webkit-scrollbar { display: none; }
  .shuffle-toggles {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .shuf-pill {
    appearance: none;
    border: 1px solid var(--border-strong);
    background: #FFFFFF;
    color: var(--ink-muted);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    min-height: 28px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .shuf-pill.on {
    background: var(--navy);
    border-color: var(--navy);
    color: #FFFFFF;
  }
  .shuf-pill.on-teal {
    background: var(--teal);
    border-color: var(--teal);
    color: #FFFFFF;
  }
  .shuf-pill:focus-visible { outline: 2px solid var(--navy); outline-offset: 1px; }
  .shuf-now {
    appearance: none;
    border: 1px solid var(--navy);
    background: #FFFFFF;
    color: var(--navy-soft);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    min-height: 28px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .shuf-now:hover { background: var(--selected-bg); }
  .shuf-now:focus-visible { outline: 2px solid var(--navy); outline-offset: 1px; }
  .progfill {
    height: 100%;
    width: 0%;
    background: var(--ribbon);
    transition: width 180ms ease;
  }

  /* Split Workspace on Desktop */
  .workspace {
    flex: 1;
    display: flex;
    min-height: 0;
    overflow: hidden;
  }
  .stage-col {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background: linear-gradient(180deg, #FFF9FB 0%, #FFF1F6 100%);
  }
  .main {
    position: relative;
    z-index: 1;
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: thin;
    scrollbar-color: #E494B0 transparent;
  }
  .main > * { flex-shrink: 0; }
  @media (min-width: 768px) {
    .main { padding: 20px 24px 28px; gap: 14px; }
  }
  .main::-webkit-scrollbar { width: 6px; }
  .main::-webkit-scrollbar-thumb { background: #E494B0; border-radius: 3px; }

  /* Question Meta Row */
  .qmeta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-muted);
  }
  .qmeta-left {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
  }
  .qnum-label { color: var(--ink); font-weight: 700; }
  .tag-chip {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--bg-strip);
    border: 1px solid var(--border);
    color: var(--ink-body);
    font-size: 11.5px;
    font-weight: 600;
  }
  .flag-btn {
    appearance: none;
    background: var(--bg-card-solid);
    border: 1px solid var(--border);
    color: var(--ink-muted);
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-height: 32px;
    flex-shrink: 0;
  }
  .flag-btn.flagged {
    background: var(--amber-bg);
    border-color: #D97706;
    color: var(--amber-text);
  }
  .flag-btn:focus-visible { outline: 2px solid var(--navy); outline-offset: 1px; }

  /* Question Card */
  .qcard {
    background: var(--bg-card);
    backdrop-filter: blur(4px);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px;
  }
  @media (min-width: 768px) { .qcard { padding: 20px; } }
  .qstem {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.5;
    color: var(--ink);
  }
  @media (min-width: 768px) { .qstem { font-size: 17px; } }

  /* Options */
  .opts { display: flex; flex-direction: column; gap: 9px; }
  .opt {
    appearance: none;
    width: 100%;
    text-align: left;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--bg-card);
    backdrop-filter: blur(4px);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    min-height: 52px;
    font-size: 14.5px;
    line-height: 1.44;
    color: var(--ink-body);
    cursor: pointer;
    transition: border-color 120ms ease, background-color 120ms ease, transform 120ms ease;
  }
  .opt:hover:not(:disabled) {
    border-color: var(--border-strong);
    background: #FFFDFD;
    transform: translateY(-1px);
  }
  .opt:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
  .opt:disabled { cursor: default; }

  .opt-badge {
    min-width: 28px;
    height: 28px;
    border-radius: 999px;
    background: #FFF0F5;
    border: 1.5px solid #F0A9C2;
    color: var(--navy-soft);
    font-weight: 700;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .opt-text { flex: 1; }
  .opt-icon { flex-shrink: 0; margin-top: 4px; display: none; }

  .opt.selected {
    background: var(--selected-bg);
    border-color: var(--navy);
    box-shadow: inset 0 0 0 1px var(--navy);
    color: var(--ink);
    font-weight: 600;
  }
  .opt.selected .opt-badge { background: var(--navy); border-color: var(--navy); color: #FFFFFF; }

  .opt.correct {
    background: var(--teal-bg);
    border-color: var(--teal);
    box-shadow: inset 0 0 0 1px var(--teal);
    color: var(--teal-text);
    font-weight: 600;
  }
  .opt.correct .opt-badge { background: var(--teal); border-color: var(--teal); color: #FFFFFF; }
  .opt.correct .opt-icon { display: inline-flex; color: var(--teal); }

  .opt.wrong {
    background: var(--crimson-bg);
    border-color: var(--crimson);
    box-shadow: inset 0 0 0 1px var(--crimson);
    color: var(--crimson-text);
    font-weight: 600;
  }
  .opt.wrong .opt-badge { background: var(--crimson); border-color: var(--crimson); color: #FFFFFF; }
  .opt.wrong .opt-icon { display: inline-flex; color: var(--crimson); }

  /* Feedback Strip */
  .feedback {
    border-radius: var(--radius-md);
    padding: 11px 14px;
    font-size: 13.5px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    border: 1px solid transparent;
  }
  .feedback.correct { background: var(--teal-bg); border-color: #99F6E4; color: var(--teal-text); }
  .feedback.wrong { background: var(--crimson-bg); border-color: #FECACA; color: var(--crimson-text); }
  .feedback.neutral { background: var(--bg-strip); border-color: var(--border); color: var(--ink-body); }
  .feedback-main { display: flex; align-items: center; gap: 8px; }

  /* Detailed Study Note Card (Why + If Asked Differently) */
  .study-note {
    background: var(--bg-card-solid);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .note-sec {
    padding: 13px 15px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .note-sec + .note-sec {
    border-top: 1px dashed var(--border);
  }
  .note-sec.twist {
    background: var(--twist-bg);
    border-top-color: var(--twist-border);
  }
  .note-head {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--navy-soft);
  }
  .note-sec.twist .note-head {
    color: var(--twist-ink);
  }
  .note-body {
    margin: 0;
    font-size: 14px;
    line-height: 1.55;
    color: var(--ink-body);
  }
  .note-sec.twist .note-body {
    color: #5B210B;
  }

  /* Summary Banner inside Main */
  .summary-card {
    background: var(--bg-card-solid);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .summary-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .summary-title { margin: 0; font-size: 16px; font-weight: 700; color: var(--ink); }
  .score-big { font-size: 28px; font-weight: 700; color: var(--teal); line-height: 1; }
  .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .summary-cell {
    background: var(--bg-page);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px;
    text-align: center;
  }
  .summary-cell-val { font-size: 18px; font-weight: 700; color: var(--ink); }
  .summary-cell-lbl { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
  .summary-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* Empty Wrong State */
  .empty-state {
    background: var(--bg-card-solid);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px 20px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .empty-state h2 { margin: 0; font-size: 16px; font-weight: 700; color: var(--ink); }
  .empty-state p { margin: 0; font-size: 13.5px; color: var(--ink-muted); max-width: 340px; line-height: 1.5; }

  /* Bottom Thumb Dock */
  .dock {
    position: relative;
    z-index: 2;
    background: var(--bg-card-solid);
    border-top: 1px solid var(--border);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    display: grid;
    grid-template-columns: 1fr 1.25fr 1fr;
    gap: 8px;
    flex-shrink: 0;
  }
  .dbtn {
    appearance: none;
    border: 1.5px solid var(--border-strong);
    background: #FFF5F8;
    color: var(--navy-soft);
    border-radius: var(--radius-md);
    padding: 10px 8px;
    min-height: 46px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    white-space: nowrap;
  }
  .dbtn.primary { background: var(--navy); border-color: var(--navy); color: #FFFFFF; }
  .dbtn:disabled { opacity: 0.42; cursor: not-allowed; }
  .dbtn:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }

  /* Desktop Right Ballot Rail */
  .desktop-rail {
    position: relative;
    z-index: 2;
    display: none;
    width: 320px;
    flex-shrink: 0;
    background: var(--bg-page);
    border-left: 1px solid var(--border);
    flex-direction: column;
    overflow: hidden;
  }
  @media (min-width: 1024px) {
    .desktop-rail { display: flex; }
    .dock { grid-template-columns: 1fr 1fr; }
    .dock-ballot-btn { display: none; }
  }

  .rail-head {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-strip);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .rail-title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .rail-title { margin: 0; font-size: 13.5px; font-weight: 700; color: var(--ink); }
  .ballot-filters { display: flex; gap: 4px; flex-wrap: wrap; }
  .filter-chip {
    appearance: none;
    background: var(--bg-card-solid);
    border: 1px solid var(--border);
    color: var(--ink-muted);
    border-radius: 999px;
    padding: 4px 9px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .filter-chip.active { background: var(--navy); border-color: var(--navy); color: #FFFFFF; }

  .ballot-scroll { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .ballot-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  @media (max-width: 1023px) { .ballot-grid { grid-template-columns: repeat(7, 1fr); } }
  @media (max-width: 379px) { .ballot-grid { grid-template-columns: repeat(5, 1fr); } }
  .bcell {
    appearance: none;
    position: relative;
    height: 38px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-card-solid);
    color: var(--ink);
    font-size: 12px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bcell.current { border-color: var(--navy); box-shadow: inset 0 0 0 1.5px var(--navy); }
  .bcell.ok { background: var(--teal); border-color: var(--teal); color: #FFFFFF; }
  .bcell.bad { background: var(--crimson); border-color: var(--crimson); color: #FFFFFF; }
  .bcell.picked { background: var(--navy); border-color: var(--navy); color: #FFFFFF; }
  .bcell.flagged::after {
    content: "";
    position: absolute;
    top: 3px;
    right: 3px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #F59E0B;
  }
  .bcell:focus-visible { outline: 2px solid var(--navy); outline-offset: 1px; }

  .ballot-legend {
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    background: var(--bg-strip);
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 11.5px;
    color: var(--ink-body);
  }
  .leg-item { display: inline-flex; align-items: center; gap: 5px; }
  .leg-dot { width: 10px; height: 10px; border-radius: 3px; border: 1px solid var(--border-strong); background: #FFFFFF; }
  .leg-dot.ok { background: var(--teal); border-color: var(--teal); }
  .leg-dot.bad { background: var(--crimson); border-color: var(--crimson); }
  .leg-dot.picked { background: var(--navy); border-color: var(--navy); }
  .leg-dot.flag { background: #F59E0B; border-color: #D97706; border-radius: 50%; }

  /* Drawer & Modals */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(74, 16, 38, 0.45);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  .backdrop.open { display: flex; }
  @media (min-width: 640px) { .backdrop.modal-center { align-items: center; padding: 16px; } }

  .sheet {
    width: 100%;
    max-width: 560px;
    max-height: 82dvh;
    background: var(--bg-page);
    border-radius: 18px 18px 0 0;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  @media (min-width: 640px) { .backdrop.modal-center .sheet { border-radius: 16px; max-width: 440px; } }
  .sheet-head {
    padding: 14px 16px;
    background: var(--bg-strip);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .sheet-title { margin: 0; font-size: 15px; font-weight: 700; color: var(--ink); }
  .close-btn {
    appearance: none;
    background: var(--bg-card-solid);
    border: 1px solid var(--border);
    color: var(--ink);
    border-radius: var(--radius-sm);
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  /* QR Modal Content */
  .qr-body {
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    overflow-y: auto;
  }
  .qr-box {
    width: 220px;
    height: 220px;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qr-box svg { width: 100%; height: 100%; display: block; }
  .qr-hint { margin: 0; font-size: 13px; color: var(--ink-muted); text-align: center; line-height: 1.45; }
  .qr-url-row { width: 100%; display: flex; gap: 6px; }
  .qr-input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--border-strong);
    background: #FFFFFF;
    color: var(--ink);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    font-size: 12.5px;
  }
  .qr-actions { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .confirm-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .confirm-text { margin: 0; font-size: 14px; line-height: 1.5; color: var(--ink-body); }
  .confirm-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
</style>

<script>
(() => {
  'use strict';

  const CHAPTERS = [{"num":1,"title":"ĐẢNG CỘNG SẢN VIỆT NAM RA ĐỜI VÀ LÃNH ĐẠO ĐẤU TRANH GIÀNH CHÍNH QUYỀN (1930-1945)"},{"num":2,"title":"ĐẢNG LÃNH ĐẠO HAI CUỘC KHÁNG CHIẾN, HOÀN THÀNH GIẢI PHÓNG DÂN TỘC, THỐNG NHẤT ĐẤT NƯỚC (1945-1975)"},{"num":3,"title":"ĐẢNG LÃNH ĐẠO CẢ NƯỚC QUÁ ĐỘ LÊN CHỦ NGHĨA XÃ HỘI VÀ TIẾN HÀNH CÔNG CUỘC ĐỔI MỚI (1975-2018)"}];
  const RAW_BANK = [[1,1,"Đối tượng nghiên cứu của khoa học Lịch sử Đảng Cộng sản Việt Nam là gì?",["Các sự kiện lịch sử Đảng","Đảng lãnh đạo cách mạng giải phóng dân tộc, xây dựng và phát triển đất nước","Làm rõ hệ thống tổ chức Đảng, công tác xây dựng Đảng","Sự ra đời, phát triển và hoạt động lãnh đạo của Đảng qua các thời kỳ lịch sử"],3,"Theo Giáo trình Lịch sử Đảng Cộng sản Việt Nam, đối tượng nghiên cứu của môn học bao quát toàn diện sự ra đời, phát triển và hoạt động lãnh đạo của Đảng qua các thời kỳ lịch sử. Các phương án còn lại chỉ đề cập đến từng khía cạnh bộ phận như hệ thống sự kiện, công tác xây dựng Đảng hay một giai đoạn lãnh đạo cụ thể nên chưa đầy đủ.","Nếu đề hỏi về nhiệm vụ nghiên cứu cụ thể hoặc từng nội dung cấu thành đối tượng nghiên cứu (như trình bày có hệ thống các sự kiện lịch sử Đảng, làm rõ hệ thống tổ chức và công tác xây dựng Đảng) thì mới chọn các khía cạnh riêng lẻ đó; hỏi khái quát đối tượng nghiên cứu thì chọn đáp án bao trùm sự ra đời, phát triển và hoạt động lãnh đạo."],[2,1,"Chọn câu trả lời đúng nhất khi nói về các chức năng nghiên cứu của khoa học Lịch sử Đảng Cộng sản Việt Nam?",["Chức năng nhận thức; chức năng giáo dục","Chức năng xã hội; chức năng giáo dục","Chức năng tổng kết lịch sử; chức năng giáo dục","Chức năng nhận thức; chức năng giáo dục; chức năng dự báo và phê phán"],3,"Khoa học Lịch sử Đảng Cộng sản Việt Nam thực hiện đồng thời ba chức năng cơ bản: chức năng nhận thức (cung cấp tri thức, quy luật lịch sử), chức năng giáo dục (bồi dưỡng lý tưởng, truyền thống cách mạng) và chức năng dự báo, phê phán (dự báo xu hướng phát triển và đấu tranh chống quan điểm sai trái). Các phương án khác đều thiếu vế dự báo và phê phán hoặc gọi sai tên chức năng.","Nếu đề tách riêng hỏi chức năng giúp nắm vững tri thức, quy luật và bài học kinh nghiệm thì chọn chức năng nhận thức; hỏi về bồi đắp niềm tin, đạo đức cách mạng thì chọn chức năng giáo dục; hỏi về nhận diện tương lai và bác bỏ luận điệu xuyên tạc thì chọn chức năng dự báo và phê phán."],[3,1,"Những hoạt động nào của Nguyễn Ái Quốc nhằm chuẩn bị trực tiếp điều kiện về tư tưởng cho việc thành lập Đảng Cộng sản Việt Nam?",["Tập bài giảng “Đường Kách mệnh” đã đề cập đến những vấn đề cơ bản của một Cương lĩnh chính trị cho Đảng Cộng sản Việt Nam sau này","Thành lập Hội Việt Nam Cách mạng Thanh niên (6/1925) với chương trình và Điều lệ là làm cách mạng dân tộc và cách mạng thế giới","Từ năm 1925 đến đầu 1927, mở các lớp huấn luyện chính trị nhằm đào tạo cán bộ cho cách mạng Việt Nam","Viết báo, xuất bản sách nhằm truyền bá chủ nghĩa Mác-Lênin vào Việt Nam để thức tỉnh quần chúng"],3,"Nguyễn Ái Quốc chuẩn bị trực tiếp về mặt tư tưởng cho sự ra đời của Đảng thông qua hoạt động viết báo trên các tờ Người cùng khổ, Nhân đạo, Đời sống công nhân, Thanh niên và xuất bản sách (như Bản án chế độ thực dân Pháp năm 1925) nhằm tố cáo tội ác thực dân, truyền bá chủ nghĩa Mác-Lênin và thức tỉnh quần chúng yêu nước.","Đề rất hay tráo đổi ba mặt chuẩn bị của Nguyễn Ái Quốc: nếu hỏi chuẩn bị về chính trị thì chọn tập bài giảng “Đường Kách mệnh” (phác thảo những vấn đề cơ bản của Cương lĩnh); nếu hỏi chuẩn bị về tổ chức thì chọn thành lập Hội Việt Nam Cách mạng Thanh niên (6/1925) và mở các lớp huấn luyện chính trị (1925–1927)."],[4,1,"Những hoạt động nào của Nguyễn Ái Quốc nhằm chuẩn bị trực tiếp điều kiện về tổ chức cho việc thành lập Đảng Cộng sản Việt Nam?",["Viết báo, xuất bản sách nhằm truyền bá chủ nghĩa Mác - Lê nin vào Việt Nam để thức tỉnh quần chúng","Tập bài giảng “Đường Kách mệnh” đã đề cập đến những vấn đề cơ bản của một Cương lĩnh chính trị cho Đảng Cộng sản Việt Nam sau này","Từ năm 1925 đến đầu 1927, mở các lớp huấn luyện chính trị nhằm đào tạo cán bộ cho cách mạng Việt Nam","Thành lập Hội Việt Nam Cách mạng Thanh niên (6/1925) với chương trình, Điều lệ, mục đích là làm cách mệnh dân tộc và cách mạng thế giới"],3,"Tháng 6/1925, tại Quảng Châu (Trung Quốc), Nguyễn Ái Quốc thành lập Hội Việt Nam Cách mạng Thanh niên với hạt nhân là Cộng sản đoàn, có chương trình và Điều lệ rõ ràng. Đây là tổ chức tiền thân trực tiếp giữ vai trò quyết định trong việc chuẩn bị về mặt tổ chức để tiến tới thành lập Đảng Cộng sản Việt Nam.","Khi gặp câu hỏi về các điều kiện chuẩn bị thành lập Đảng, hãy soi kỹ từ khóa: “tư tưởng” gắn với viết báo, xuất bản sách truyền bá chủ nghĩa Mác-Lênin; “chính trị” gắn với tác phẩm “Đường Kách mệnh” (1927); còn “tổ chức” gắn trực tiếp với Hội Việt Nam Cách mạng Thanh niên (6/1925)."],[5,1,"Hội Liên hiệp thuộc địa được thành lập vào năm nào?",["1920","1924","1923","1921"],3,"Năm 1921, tại Pari (Pháp), Nguyễn Ái Quốc cùng một số nhà yêu nước của các nước thuộc địa Pháp đã tham gia sáng lập Hội Liên hiệp thuộc địa và ra báo Le Paria (Người cùng khổ) làm cơ quan ngôn luận. Tổ chức này nhằm đoàn kết nhân dân các dân tộc bị áp bức chống chủ nghĩa thực dân và truyền bá tư tưởng cách mạng về các thuộc địa.","Phân biệt các mốc gần nhau trong hoạt động của Nguyễn Ái Quốc: năm 1920 Người đọc Luận cương của Lênin và tham gia sáng lập Đảng Cộng sản Pháp; năm 1923 Người sang Liên Xô dự Hội nghị Quốc tế Nông dân; năm 1924 Người dự Đại hội V Quốc tế Cộng sản rồi về Quảng Châu."],[6,1,"“Hội phản đế Đồng minh” là tổ chức mặt trận đầu tiên để tập hợp đoàn kết các giai cấp, tầng lớp dân tộc được Ban Thường vụ Trung ương Đảng thành lập vào ngày tháng năm nào?",["22/11/1944","18/10/1930","22/12/1944","18/11/1930"],3,"Ngày 18/11/1930, Ban Thường vụ Trung ương Đảng ban hành Chỉ thị về việc thành lập Hội Phản đế Đồng minh nhằm tập hợp rộng rãi mọi giai cấp, tầng lớp yêu nước chống đế quốc. Đây là tổ chức mặt trận dân tộc thống nhất đầu tiên dưới sự lãnh đạo của Đảng và ngày 18/11 trở thành Ngày truyền thống Mặt trận Tổ quốc Việt Nam.","Tránh nhầm với mốc tháng 10/1930 (Hội nghị Trung ương lần thứ nhất thông qua Luận cương chính trị) hay ngày 22/12/1944 (ngày thành lập Đội Việt Nam Tuyên truyền Giải phóng quân tại Cao Bằng)."],[7,1,"Địa điểm nào là nơi họp để tổ chức thành lập Chi bộ Cộng sản đầu tiên ở nước ta?",["Nhà số 312, Khâm Thiên, Hà Nội","Nhà số 48, Hàng Ngang, Hà Nội","Đình Tân Trào, huyện Sơn Dương, tỉnh Tuyên Quang","Nhà số 5D, Hàm Long, Hà Nội"],3,"Cuối tháng 3/1929, một số hội viên tiên tiến của Hội Việt Nam Cách mạng Thanh niên ở Bắc Kỳ đã họp tại nhà số 5D, phố Hàm Long, Hà Nội để lập ra Chi bộ Cộng sản đầu tiên ở Việt Nam gồm 7 đảng viên, do Trần Văn Cung làm Bí thư. Sự kiện này mở đầu trực tiếp cho quá trình hình thành các tổ chức cộng sản trong nước.","Ghi nhớ bộ địa chỉ lịch sử hay bị tráo nhau: nhà số 312 Khâm Thiên (Hà Nội) là nơi thành lập Đông Dương Cộng sản Đảng (17/6/1929); nhà số 48 Hàng Ngang (Hà Nội) là nơi Chủ tịch Hồ Chí Minh soạn thảo Tuyên ngôn Độc lập (8/1945); đình Tân Trào (Tuyên Quang) là nơi họp Quốc dân Đại hội (16/8/1945)."],[8,1,"Đông Dương cộng sản Liên đoàn hợp nhất vào Đảng Cộng sản Việt Nam khi nào?",["22/2/1930","22/2/1931","24/2/1931","24/2/1930"],3,"Do nhận tin chậm nên đại biểu Đông Dương Cộng sản Liên đoàn không kịp dự Hội nghị hợp nhất đầu năm 1930. Sau khi gửi đơn xin gia nhập, ngày 24/2/1930, Ban Chấp hành Trung ương lâm thời Đảng Cộng sản Việt Nam đã họp và ra nghị quyết chấp nhận Đông Dương Cộng sản Liên đoàn gia nhập Đảng, hoàn tất thống nhất các tổ chức cộng sản.","Lưu ý sự kiện này diễn ra ngay trong tháng 2/1930 chứ không phải năm 1931: Hội nghị hợp nhất kết thúc đầu tháng 2/1930 (lấy 3/2/1930 làm ngày thành lập Đảng) và chỉ khoảng ba tuần sau, đúng ngày 24/2/1930 thì Đông Dương Cộng sản Liên đoàn chính thức hợp nhất vào Đảng."],[9,1,"Phương án nào nói về sự thống trị của thực dân Pháp đã làm thay đổi tính chất xã hội Việt Nam?",["Cho ra đời hai giai cấp mới là công nhân và tư sản Việt Nam","Chống đế quốc, giải phóng dân tộc là nhiệm vụ hàng đầu","Nảy sinh mâu thuẫn cơ bản trong đời sống xã hội Việt Nam là mâu thuẫn giữa toàn thể dân tộc Việt Nam với thực dân Pháp xâm lược","Làm cho xã hội Việt Nam phong kiến trở thành xã hội thuộc địa, nửa phong kiến"],3,"Trước khi thực dân Pháp xâm lược (1858), Việt Nam là một quốc gia phong kiến độc lập. Dưới ách thống trị, bóc lột của thực dân Pháp gắn với việc duy trì bộ máy phong kiến tay sai, tính chất xã hội Việt Nam đã biến đổi căn bản từ xã hội phong kiến thành xã hội thuộc địa, nửa phong kiến.","Nếu đề không hỏi về “tính chất xã hội” mà hỏi sự biến đổi “cơ cấu giai cấp” thì chọn sự ra đời của giai cấp công nhân và tư sản; hỏi “mâu thuẫn chủ yếu” thì chọn mâu thuẫn giữa toàn thể dân tộc Việt Nam với thực dân Pháp; hỏi “nhiệm vụ hàng đầu” thì chọn chống đế quốc, giải phóng dân tộc."],[10,1,"Ý nào SAI về đặc điểm ra đời của giai cấp công nhân Việt Nam?",["Ra đời trước giai cấp tư sản, trong cuộc khai thác thuộc địa lần thứ nhất của thực dân Pháp.","Phần lớn xuất thân từ nông dân.","Chịu sự áp bức và bóc lột của đế quốc, phong kiến và tư sản","Phần lớn xuất thân từ giai cấp tư sản Việt Nam"],3,"Giai cấp công nhân Việt Nam hình thành trong cuộc khai thác thuộc địa lần thứ nhất của Pháp, ra đời trước giai cấp tư sản Việt Nam, chịu ba tầng áp bức (đế quốc, phong kiến, tư sản) và phần lớn xuất thân từ nông dân bị bần cùng hóa. Do đó, nhận định cho rằng công nhân phần lớn xuất thân từ giai cấp tư sản Việt Nam là sai sự thật lịch sử.","Đọc kỹ từ phủ định “Ý nào SAI” trong câu hỏi; nếu đề đổi thành hỏi nguyên nhân giúp giai cấp công nhân có mối liên minh tự nhiên, bền chặt với nông dân thì chọn ý phần lớn xuất thân từ nông dân."],[11,1,"Những giai cấp bị trị ở Việt Nam dưới chế độ thuộc địa của đế quốc Pháp là:",["Công nhân và nông dân","Công nhân, nông dân, tiểu tư sản","Công nhân, nông dân, tiểu tư sản, tư sản dân tộc","Công nhân, nông dân, tiểu tư sản, tư sản dân tộc, địa chủ vừa và nhỏ"],3,"Dưới chế độ thuộc địa của đế quốc Pháp, ngoại trừ giai cấp đại địa chủ và tư sản mại bản cấu kết làm tay sai cho thực dân, hầu hết các giai cấp, tầng lớp khác đều ở địa vị bị trị, bị chèn ép về chính trị và kinh tế, gồm: công nhân, nông dân, tiểu tư sản, tư sản dân tộc và địa chủ vừa và nhỏ. Các phương án còn lại đều liệt kê thiếu lực lượng.","Nếu đề hỏi lực lượng động lực chính theo quan điểm của Luận cương chính trị tháng 10/1930 thì chọn công nhân và nông dân; còn hỏi toàn bộ các giai cấp bị trị có thể tập hợp trong mặt trận dân tộc chống đế quốc thì phải chọn phương án bao gồm đầy đủ đến tư sản dân tộc và địa chủ vừa và nhỏ."],[12,1,"Chính quyền Xô Viết ở một số vùng nông thôn Nghệ-Tĩnh được thành lập trong khoảng thời gian nào?",["Đầu năm 1930","Cuối năm 1931","Giữa năm 1931","Cuối năm 1930"],3,"Trong cao trào cách mạng 1930–1931, sau các cuộc biểu tình rầm rộ của nông dân Nghệ An và Hà Tĩnh (đỉnh cao là cuộc biểu tình Hưng Nguyên ngày 12/9/1930), bộ máy chính quyền địch ở nhiều xã bị tê liệt. Từ khoảng tháng 9 đến cuối năm 1930, các Ban Chấp hành Nông hội xã đứng ra điều hành đời sống xã hội, hình thành chính quyền Xô viết đầu tiên ở nước ta.","Tránh nhầm với đầu năm 1930 (thời điểm mới thành lập Đảng và khởi đầu đấu tranh bãi công tháng 5/1930) hay giữa và cuối năm 1931 (thời điểm thực dân Pháp khủng bố trắng khốc liệt khiến phong trào Xô viết Nghệ - Tĩnh tạm thời lắng xuống)."],[13,1,"Trong cao trào dân chủ giai đoạn 1936-1939, Đảng ta chủ trương tập hợp những lực lượng nào?",["Công nhân và nông dân","Công nhân, nông dân và trí thức","Công nhân, nông dân, tiểu tư sản, tư sản, tiểu địa chủ, địa chủ","Mọi lực lượng dân tộc và một bộ phận người Pháp ở Đông Dương"],3,"Giai đoạn 1936–1939, trước nguy cơ phát xít và việc Mặt trận Nhân dân Pháp lên cầm quyền, Đảng chủ trương thành lập Mặt trận Thống nhất nhân dân phản đế Đông Dương (sau đổi là Mặt trận Dân chủ Đông Dương). Chủ trương tập hợp lực lượng được mở rộng tối đa, bao gồm mọi lực lượng dân tộc yêu nước, dân chủ và tranh thủ cả một bộ phận người Pháp chống phát xít ở Đông Dương.","Nếu đề đổi mốc sang giai đoạn 1930–1931 (theo Luận cương 10/1930) thì lực lượng chủ yếu là công nhân và nông dân; nếu sang giai đoạn 1939–1945 (Mặt trận Việt Minh) thì tập hợp toàn thể các giai cấp, tầng lớp yêu nước trong dân tộc Việt Nam để giải phóng dân tộc (không còn chủ trương tập hợp bộ phận người Pháp)."],[14,1,"Tên của lực lượng vũ trang được thành lập ở Nghệ Tĩnh trong cao trào cách mạng năm 1930 là gì?",["Du kích","Tự vệ","Tự vệ chiến đấu","Tự vệ đỏ"],3,"Trong cao trào Xô viết Nghệ - Tĩnh năm 1930, để bảo vệ chính quyền cách mạng ở các xã, giữ gìn trật tự trị an và chống lại sự đàn áp của địch, các cấp bộ Đảng và Nông hội đã thành lập đội vũ trang quần chúng mang tên “Tự vệ đỏ”. Đây là hình thức tổ chức vũ trang cách mạng đầu tiên do Đảng ta sáng lập.","Phân biệt tên gọi lực lượng vũ trang qua các thời kỳ: năm 1930 ở Nghệ - Tĩnh là Tự vệ đỏ; cuối năm 1940 sau khởi nghĩa Bắc Sơn là Đội du kích Bắc Sơn (sau phát triển thành Cứu quốc quân); đến ngày 22/12/1944 là Đội Việt Nam Tuyên truyền Giải phóng quân."],[15,1,"Tổ chức cộng sản nào ra đời đầu tiên ở Việt Nam?",["Hội Việt Nam cách mạng thanh niên","Đông Dương cộng sản liên đoàn","An Nam cộng sản Đảng","Đông Dương cộng sản Đảng"],3,"Ngày 17/6/1929, đại biểu các tổ chức cơ sở cộng sản ở Bắc Kỳ họp tại nhà số 312 phố Khâm Thiên (Hà Nội), tuyên bố thành lập Đông Dương Cộng sản Đảng, thông qua Tuyên ngôn, Điều lệ và xuất bản báo Búa Liềm. Đây là tổ chức cộng sản ra đời sớm nhất ở Việt Nam, đáp ứng yêu cầu bức thiết của phong trào công nhân và yêu nước.","Nhớ đúng thứ tự ba tổ chức cộng sản ra đời năm 1929: đầu tiên là Đông Dương Cộng sản Đảng (6/1929, Bắc Kỳ), thứ hai là An Nam Cộng sản Đảng (8/1929, Nam Kỳ), thứ ba là Đông Dương Cộng sản Liên đoàn (9/1929, Trung Kỳ); còn Hội Việt Nam Cách mạng Thanh niên (6/1925) chỉ là tổ chức tiền thân."],[16,1,"Cuộc khởi nghĩa Nam Kỳ nổ ra vào ngày tháng năm nào?",["Ngày 11 tháng 3 năm 1945","Ngày 27 tháng 9 năm 1940","Ngày 23 tháng 9 năm 1945","Ngày 23 tháng 11 năm 1940"],3,"Đêm 22 rạng sáng ngày 23/11/1940, dưới sự lãnh đạo của Xứ ủy Nam Kỳ, cuộc khởi nghĩa Nam Kỳ đã bùng nổ đồng loạt tại nhiều tỉnh Nam Kỳ, lần đầu tiên lá cờ đỏ sao vàng xuất hiện trên trận địa. Cùng với khởi nghĩa Bắc Sơn và binh biến Đô Lương, đây là tiếng súng báo hiệu thời kỳ đấu tranh mới giành độc lập dân tộc.","Cần phân biệt kỹ các mốc dễ nhầm: ngày 27/9/1940 là khởi nghĩa Bắc Sơn (Lạng Sơn); ngày 11/3/1945 là khởi nghĩa Ba Tơ (Quảng Ngãi); còn ngày 23/9/1945 là ngày Nam Bộ kháng chiến chống thực dân Pháp quay lại xâm lược sau Cách mạng Tháng Tám."],[17,1,"Hội nghị của Ban chấp hành Trung ương lần thứ hai đã họp và xác định nhiệm vụ trước mắt là chống phát xít, chống chiến tranh đế quốc, chống phản động thuộc địa và tay sai, đòi tự do, dân chủ, cơm áo và hòa bình. Hội nghị đó diễn ra vào ngày tháng năm nào?",["Ngày 15 tháng 10 năm 1930","Ngày 26 tháng 11 năm 1939","Ngày 15 tháng 5 năm 1941","Ngày 26 tháng 7 năm 1936"],3,"Ngày 26/7/1936, Hội nghị Ban Chấp hành Trung ương Đảng lần thứ hai họp tại Thượng Hải (Trung Quốc) do đồng chí Lê Hồng Phong chủ trì. Hội nghị kịp thời điều chỉnh chủ trương chiến lược giai đoạn 1936–1939: xác định nhiệm vụ trước mắt là chống phát xít, chống chiến tranh đế quốc, chống phản động thuộc địa và tay sai, đòi tự do, dân chủ, cơm áo và hòa bình.","Đối chiếu các Hội nghị Trung ương mốc lớn: tháng 10/1930 là Hội nghị Trung ương lần thứ nhất thông qua Luận cương chính trị; tháng 11/1939 là Hội nghị Trung ương 6 chuyển hướng chiến lược khi Thế chiến II bùng nổ; tháng 5/1941 là Hội nghị Trung ương 8 hoàn chỉnh chuyển hướng và thành lập Mặt trận Việt Minh."],[18,1,"Đội Việt Nam tuyên truyền giải phóng quân do Võ Nguyên Giáp tổ chức ra đời ở Cao Bằng được thành lập vào ngày tháng năm nào?",["Ngày 22 tháng 5 năm 1945","Ngày 22 tháng 11 năm 1945","Ngày 22 tháng 5 năm 1946","Ngày 22 tháng 12 năm 1944"],3,"Chấp hành Chỉ thị của lãnh tụ Hồ Chí Minh, ngày 22/12/1944, Đội Việt Nam Tuyên truyền Giải phóng quân gồm 34 chiến sĩ do đồng chí Võ Nguyên Giáp tổ chức và chỉ huy đã làm lễ thành lập tại khu rừng Trần Hưng Đạo (Nguyên Bình, Cao Bằng). Đây là tiền thân của Quân đội nhân dân Việt Nam ngày nay.","Đừng nhầm với mốc tháng 5/1945 (ngày 15/5/1945 thống nhất Đội Việt Nam Tuyên truyền Giải phóng quân và Cứu quốc quân thành Việt Nam Giải phóng quân) hay ngày 22/5/1946 (Chủ tịch Hồ Chí Minh ký sắc lệnh đổi tên Vệ quốc đoàn thành Quân đội quốc gia Việt Nam)."],[19,1,"Hội văn hóa cứu quốc thành lập vào thời gian nào?",["1941","1945","1944","1943"],3,"Năm 1943, gắn liền với việc Ban Thường vụ Trung ương Đảng thông qua Đề cương về văn hóa Việt Nam (do đồng chí Trường Chinh soạn thảo) với phương châm dân tộc, khoa học, đại chúng, Hội Văn hóa Cứu quốc được thành lập trực thuộc Mặt trận Việt Minh, tập hợp đông đảo trí thức, văn nghệ sĩ yêu nước tham gia mặt trận cứu quốc.","Nhớ chuỗi mốc mặt trận và văn hóa giai đoạn 1941–1945: năm 1941 thành lập Mặt trận Việt Minh (19/5/1941); năm 1943 ban hành Đề cương về văn hóa Việt Nam và lập Hội Văn hóa Cứu quốc; năm 1944 lập Đảng Dân chủ Việt Nam; năm 1945 Tổng khởi nghĩa Tháng Tám thành công."],[20,1,"Chọn phương án trả lời đúng nhất: Đánh giá như thế nào về giai cấp địa chủ Việt Nam?",["Là giai cấp đầu hàng, tay sai của thực dân Pháp","Là giai cấp bóc lột của chế độ phong kiến, hoàn toàn không có thế lực chính trị","Là một giai cấp có thế lực kinh tế độc lập với Pháp, có tinh thần dân tộc cao","Một bộ phận của giai cấp này là tay sai của thực dân. Một bộ phận có tinh thần dân tộc chống Pháp"],3,"Dưới ách thống trị của thực dân Pháp, giai cấp địa chủ Việt Nam bị phân hóa rõ rệt chứ không đồng nhất: một bộ phận đại địa chủ dựa vào thế lực thực dân làm tay sai, bóc lột nông dân; trong khi bộ phận địa chủ vừa và nhỏ bị đế quốc chèn ép nên vẫn có tinh thần yêu nước, dân tộc chống Pháp và có thể tranh thủ hoặc làm trung lập trong cách mạng giải phóng dân tộc.","Quan điểm phân hóa này là điểm sáng tạo trong Cương lĩnh tháng 2/1930 của Nguyễn Ái Quốc, khác với cái nhìn đánh đồng toàn bộ địa chủ là phản động trong Luận cương tháng 10/1930; nếu đề hỏi về giai cấp tư sản Việt Nam thì cũng có sự phân hóa tương tự giữa tư sản mại bản và tư sản dân tộc."],[21,1,"Vì sao nói giai cấp nông dân là một lực lượng cách mạng to lớn của dân tộc?",["Đây là một giai cấp có đủ khả năng lãnh đạo cách mạng giải phóng dân tộc ở nước ta","Đây là giai cấp rất nhạy cảm chính trị, hăng hái với công cuộc canh tân đất nước","Đây là lực lượng lao động chính, tạo ra mọi giá trị vật chất cho xã hội","Đây là một giai cấp có số lượng đông, bị áp bức bóc lột, có tinh thần yêu nước"],3,"Trong xã hội thuộc địa nửa phong kiến Việt Nam, nông dân chiếm khoảng 90% dân số, chịu hai tầng áp bức bóc lột nặng nề của đế quốc và phong kiến, đồng thời có truyền thống yêu nước, chống ngoại xâm bền bỉ. Vì vậy, nông dân là lực lượng cách mạng đông đảo, to lớn và là đồng minh tự nhiên, tin cậy nhất của giai cấp công nhân.","Phân biệt đặc trưng từng giai cấp: giai cấp có đủ khả năng lãnh đạo cách mạng là giai cấp công nhân (nông dân không đại diện cho phương thức sản xuất tiên tiến nên không thể lãnh đạo); còn tầng lớp nhạy cảm với thời cuộc, hăng hái với công cuộc canh tân thường dùng để chỉ tiểu tư sản, trí thức."],[22,1,"Trong các nội dung sau đây, nội dung nào không thuộc Luận cương chính trị tháng 10/1930?",["Cách mạng Việt Nam phải trải qua hai giai đoạn: cách mạng tư sản dân quyền và cách mạng xã hội chủ nghĩa","Cách mạng do Đảng của giai cấp vô sản theo chủ nghĩa Mác – Lênin lãnh đạo","Cách mạng Việt Nam là một bộ phận của cách mạng thế giới","Lực lượng để đánh đuổi đế quốc và phong kiến là công - nông. Đồng thời “phải biết liên lạc với tiểu tư sản, trí thức, trung nông... để kéo họ vào phe vô sản giai cấp”"],3,"Luận cương chính trị tháng 10/1930 (do Trần Phú soạn thảo) có hạn chế là chỉ xác định động lực cách mạng gồm vô sản và nông dân, chưa chủ trương đoàn kết rộng rãi các giai cấp, tầng lớp yêu nước khác. Nội dung “phải biết liên lạc với tiểu tư sản, trí thức, trung nông... để kéo họ vào phe vô sản giai cấp” thực chất thuộc Cương lĩnh chính trị đầu tiên tháng 2/1930 của Nguyễn Ái Quốc.","Nếu đề đổi sang hỏi những điểm GIỐNG nhau giữa Cương lĩnh tháng 2/1930 và Luận cương tháng 10/1930 thì cả ba nội dung còn lại đều đúng: trải qua hai giai đoạn chiến lược, do Đảng của giai cấp vô sản theo chủ nghĩa Mác-Lênin lãnh đạo và cách mạng Việt Nam là một bộ phận của cách mạng thế giới."],[23,1,"Phong trào do Việt Nam Quốc dân Đảng khởi xướng thuộc khuynh hướng nào?",["Khuynh hướng Cần Vương","Khuynh hướng Phong kiến","Khuynh hướng Vô sản","Khuynh hướng Dân chủ tư sản"],3,"Việt Nam Quốc dân Đảng (thành lập tháng 12/1927, lãnh tụ Nguyễn Thái Học) là chính đảng yêu nước tiêu biểu của giai cấp tư sản và tiểu tư sản trí thức, hoạt động theo khuynh hướng dân chủ tư sản với mục tiêu đánh đuổi Pháp, dựng nền cộng hòa. Sự thất bại của khởi nghĩa Yên Bái (2/1930) đã chấm dứt vai trò lịch sử của khuynh hướng này ở Việt Nam.","Phân biệt rõ ba khuynh hướng cứu nước: phong trào Cần Vương và khởi nghĩa Yên Thế thuộc khuynh hướng phong kiến; phong trào Đông Du, Duy Tân và Việt Nam Quốc dân Đảng thuộc khuynh hướng dân chủ tư sản; phong trào do Nguyễn Ái Quốc và Đảng Cộng sản Việt Nam lãnh đạo thuộc khuynh hướng vô sản."],[24,1,"Tổ chức nào được gọi là Quốc tế Cộng sản?",["Quốc tế thứ nhất (1864-1976) do C.Mác và Ph.Ăngghen sáng lập","Quốc tế thứ hai (1889-1895) do Ph.Ăngghen sáng lập","Quốc tế thứ nhất (1864-1976) do C.Mác sáng lập","Quốc tế thứ ba (1919-1943) do V.I Lênin sáng lập"],3,"Tháng 3/1919, theo sáng kiến và sự lãnh đạo trực tiếp của V.I. Lênin, Quốc tế thứ ba (tên chính thức là Quốc tế Cộng sản) được thành lập tại Mátxcơva và hoạt động đến năm 1943. Tổ chức này giữ vai trò lãnh đạo phong trào cộng sản quốc tế và thúc đẩy mạnh mẽ phong trào giải phóng dân tộc ở các nước thuộc địa, trong đó có Việt Nam.","Tránh nhầm với Quốc tế thứ nhất (1864–1876, phương án nhiễu in nhầm năm 1976) do Các Mác và Ph. Ăngghen sáng lập (Hội Liên hiệp công nhân quốc tế) và Quốc tế thứ hai (thành lập năm 1889) do Ph. Ăngghen tham gia sáng lập."],[25,1,"Phương án nào nói về chính sách cai trị về văn hóa của thực dân Pháp ở Việt Nam?",["Chia Việt Nam ra thành ba xứ để cai trị: Bắc Kỳ, Trung Kỳ, Nam Kỳ","Làm cho nền kinh tế Việt Nam bị lệ thuộc vào tư bản Pháp và bị kìm hãm trong vòng lạc hậu","Thực hiện khẩu hiệu: Tự do, Bình đẳng, Bác ái ở nước ta","Nô dịch và ngu dân"],3,"Trên lĩnh vực văn hóa - xã hội, thực dân Pháp thực hiện chính sách nô dịch và ngu dân: hạn chế tối đa việc mở trường học, lập nhà tù nhiều hơn trường học, khuyến khích tiêu thụ rượu cồn, thuốc phiện và duy trì hủ tục phong kiến nhằm làm tê liệt ý chí đấu tranh của nhân dân Việt Nam.","Đề thường xoay vòng ba lĩnh vực cai trị của thực dân Pháp: nếu hỏi về chính trị thì chọn chia Việt Nam thành ba xứ Bắc Kỳ, Trung Kỳ, Nam Kỳ (“chia để trị”); nếu hỏi về kinh tế thì chọn chính sách độc quyền, bóc lột làm kinh tế Việt Nam lệ thuộc tư bản Pháp và lạc hậu."],[26,1,"Hội nghị hợp nhất thành lập Đảng Cộng sản Việt Nam (6/1-7/2/1930) đã thông qua các văn kiện nào dưới đây?",["Chánh cương vắn tắt, Luận cương chính trị, Điều lệ tóm tắt","Sách lược vắn tắt, Luận cương chính trị vắn tắt","Luận cương chính trị và Chương trình tóm tắt","Chánh cương vắn tắt, Sách lược vắn tắt, Chương trình tóm tắt, Điều lệ vắn tắt"],3,"Hội nghị hợp nhất thành lập Đảng Cộng sản Việt Nam (6/1–7/2/1930) tại Cửu Long (Hương Cảng, Trung Quốc) do Nguyễn Ái Quốc chủ trì đã thông qua các văn kiện quan trọng do Người soạn thảo gồm: Chánh cương vắn tắt, Sách lược vắn tắt, Chương trình tóm tắt và Điều lệ vắn tắt của Đảng. Các văn kiện này hợp thành Cương lĩnh chính trị đầu tiên của Đảng.","Mẹo loại trừ nhanh: bất kỳ phương án nào có cụm từ “Luận cương chính trị” đều sai đối với Hội nghị đầu năm 1930, vì Luận cương chính trị (do Trần Phú soạn thảo) chỉ được thông qua sau đó tại Hội nghị Trung ương lần thứ nhất tháng 10/1930."],[27,1,"Những giai cấp nào là giai cấp bị trị khi xã hội Việt Nam trở thành thuộc địa nửa phong kiến của đế quốc Pháp vào cuối thế kỷ XIX đầu thế kỷ XX?",["Công nhân và nông dân","Công nhân, nông dân, tiểu tư sản","Công nhân, nông dân, tiểu tư sản, tư sản dân tộc","Công nhân, nông dân, tiểu tư sản, tư sản dân tộc, địa chủ vừa và nhỏ"],3,"Khi xã hội Việt Nam chuyển thành thuộc địa nửa phong kiến dưới ách thống trị của thực dân Pháp cuối thế kỷ XIX đầu thế kỷ XX, ngoại trừ đế quốc Pháp cùng đại địa chủ và tư sản mại bản tay sai, tất cả các giai cấp, tầng lớp gồm công nhân, nông dân, tiểu tư sản, tư sản dân tộc và địa chủ vừa và nhỏ đều là giai cấp bị trị.","Gặp dạng câu hỏi liệt kê tăng dần về giai cấp bị trị dưới chế độ thuộc địa, luôn chọn phương án bao quát đầy đủ cả năm lực lượng đến địa chủ vừa và nhỏ; chỉ chọn riêng công nhân và nông dân khi đề hỏi lực lượng nòng cốt hoặc động lực chính theo Luận cương tháng 10/1930."],[28,1,"Thực dân Pháp tiến hành khai thác thuộc địa lần thứ nhất ở nước ta vào thời gian nào?",["1858-1884","1884-1896","1914-1918","1897-1914"],3,"Sau khi cơ bản bình định xong các cuộc khởi nghĩa vũ trang cuối thế kỷ XIX, thực dân Pháp tiến hành cuộc khai thác thuộc địa lần thứ nhất từ năm 1897 đến năm 1914 (khi Chiến tranh thế giới thứ nhất bùng nổ). Cuộc khai thác này làm biến đổi sâu sắc cơ cấu kinh tế - xã hội và làm ra đời giai cấp công nhân Việt Nam.","Nhớ hệ thống mốc liên hoàn: 1858–1884 là quá trình Pháp xâm lược Việt Nam; 1884–1896 là giai đoạn bình định và phong trào Cần Vương; 1914–1918 là Chiến tranh thế giới thứ nhất; còn nếu đề hỏi cuộc khai thác thuộc địa lần thứ hai thì chọn mốc 1919–1929."],[29,1,"Sau đợt khai thác thuộc địa lần thứ nhất của thực dân Pháp, ở nước ta có một giai cấp mới ra đời, đó là giai cấp nào?",["Giai cấp tiểu tư sản","Giai cấp tư sản","Giai cấp nông dân","Giai cấp công nhân"],3,"Trong cuộc khai thác thuộc địa lần thứ nhất (1897–1914), thực dân Pháp đầu tư khai mỏ, mở đường sắt, xây dựng một số nhà máy và đồn điền, dẫn tới sự ra đời của giai cấp công nhân Việt Nam. Giai cấp công nhân hình thành sớm hơn giai cấp tư sản và tiểu tư sản Việt Nam.","Nếu đề đổi mốc sang “sau cuộc khai thác thuộc địa lần thứ hai (1919–1929)” thì mới chọn sự định hình rõ rệt thành giai cấp của giai cấp tư sản và tầng lớp tiểu tư sản Việt Nam; còn giai cấp nông dân vốn là giai cấp cũ đã tồn tại từ chế độ phong kiến."],[30,1,"Nội dung nào nói về chính sách cai trị về chính trị của thực dân Pháp ở Việt Nam?",["Thực hiện khẩu hiệu “Tự do, bình đẳng, bác ái” ở nước ta","Trưng thu lương thực, sưu cao, thuế nặng","Thực hiện chính sách nhân nhượng, nới rộng quyền tự do, dân chủ cho nhân dân ta","Chia Việt Nam ra thành ba xứ để cai trị: Bắc Kỳ, Trung Kỳ, Nam Kỳ"],3,"Về mặt chính trị, thực dân Pháp thi hành chính sách chuyên chế kết hợp thủ đoạn “chia để trị”: chia nước ta thành ba xứ Bắc Kỳ (nửa bảo hộ), Trung Kỳ (bảo hộ), Nam Kỳ (thuộc địa) với ba chế độ cai trị khác nhau, rồi gộp chung với Lào và Campuchia vào Liên bang Đông Dương nhằm chia rẽ khối đoàn kết dân tộc.","Nếu đề đổi từ khóa “chính trị” sang “kinh tế” thì chọn trưng thu lương thực, sưu cao thuế nặng và độc quyền bóc lột; còn các ý nói Pháp thực hiện “Tự do, bình đẳng, bác ái” hay “nhân nhượng, nới rộng dân chủ” đều trái ngược với bản chất áp bức của chủ nghĩa thực dân."],[31,1,"Đại biểu của các tổ chức cộng sản nào đã trực tiếp đến tham dự Hội nghị hợp nhất thành lập Đảng đầu năm 1930?",["Đông Dương Cộng sản Đảng, An Nam Cộng sản Đảng và Đông Dương Cộng sản Liên đoàn","Đông Dương Cộng sản Đảng và Đông Dương Cộng sản Liên đoàn","An Nam Cộng sản Đảng và Đông Dương Cộng sản Liên đoàn","Đông Dương Cộng sản Đảng và An Nam Cộng sản Đảng"],3,"Tham dự trực tiếp Hội nghị hợp nhất thành lập Đảng đầu năm 1930 tại Cửu Long (Hương Cảng, Trung Quốc) do Nguyễn Ái Quốc chủ trì chỉ có đại biểu của hai tổ chức cộng sản là Đông Dương Cộng sản Đảng (Trịnh Đình Cửu, Nguyễn Đức Cảnh) và An Nam Cộng sản Đảng (Châu Văn Liêm, Nguyễn Thiệu). Đại biểu Đông Dương Cộng sản Liên đoàn không kịp tới dự.","Cẩn thận bẫy chọn “cả ba tổ chức cộng sản”: chỉ có hai tổ chức trực tiếp dự Hội nghị hợp nhất (6/1–7/2/1930); nếu đề hỏi tổ chức nào gia nhập sau Hội nghị hợp nhất (vào ngày 24/2/1930) thì mới chọn Đông Dương Cộng sản Liên đoàn."],[32,1,"Hội Việt Nam cách mạng Thanh niên chủ trương “vô sản hóa” vào thời gian nào?",["Cuối năm 1926 đầu năm 1927","Cuối năm 1927 đầu năm 1928","Cuối năm 1929 đầu năm 1930","Cuối năm 1928 đầu năm 1929"],3,"Từ cuối năm 1928 đến đầu năm 1929, Hội Việt Nam Cách mạng Thanh niên phát động phong trào “vô sản hóa”, đưa cán bộ, hội viên vào nhà máy, hầm mỏ, đồn điền cùng lao động và sinh hoạt với công nhân. Chủ trương này giúp rèn luyện lập trường giai cấp công nhân, truyền bá sâu rộng chủ nghĩa Mác-Lênin và thúc đẩy phong trào công nhân chuyển sang đấu tranh tự giác.","Đặt vào dòng thời gian để khỏi nhầm năm: 6/1925 thành lập Hội Việt Nam Cách mạng Thanh niên; năm 1927 xuất bản “Đường Kách mệnh”; cuối 1928 đầu 1929 thực hiện “vô sản hóa”; từ tháng 6 đến tháng 9/1929 lần lượt ra đời ba tổ chức cộng sản; đầu năm 1930 hợp nhất thành lập Đảng."],[33,1,"Nội dung nào dưới đây là đúng nhất với nội dung Cương lĩnh Chính trị đầu tiên của Đảng tháng 2/1930?",["Tư sản dân quyền cách mạng là thời kỳ dự bị để làm xã hội cách mạng","Chỉ có giải phóng được giai cấp vô sản mới giải phóng được toàn thể dân tộc","Đảng có vững cách mạng mới thành công","Đánh đổ đế quốc chủ nghĩa Pháp và bọn phong kiến, làm cho nước Việt Nam hoàn toàn độc lập"],3,"Về nhiệm vụ chính trị, Chánh cương vắn tắt (trong Cương lĩnh chính trị đầu tiên tháng 2/1930) xác định rõ: “Đánh đổ đế quốc chủ nghĩa Pháp và bọn phong kiến, làm cho nước Việt Nam được hoàn toàn độc lập”. Nội dung này thể hiện rõ tư tưởng đặt nhiệm vụ chống đế quốc, giải phóng dân tộc lên hàng đầu.","Nhận diện nhanh nguồn trích dẫn của các phương án nhiễu: “Đảng có vững cách mạng mới thành công” trích từ tác phẩm “Đường Kách mệnh” (1927); còn “Tư sản dân quyền cách mạng là thời kỳ dự bị để làm xã hội cách mạng” là nội dung trong Luận cương chính trị tháng 10/1930."],[34,1,"Cương lĩnh Chính trị đầu tiên của Đảng (2/1930) đã xác định mục tiêu chiến lược của cách mạng Việt Nam là gì?",["Xây dựng một nước Việt Nam dân giàu nước mạnh xã hội công bằng, dân chủ và văn minh","Cách mạng tư sản dân quyền - phản đế và điền địa - lập chính quyền của công nông bằng hình thức Xô viết, để dự bị điều kiện đi tới cách mạng xã hội chủ nghĩa","Đánh đổ đế quốc chủ nghĩa Pháp và bọn phong kiến, làm cho nước Nam hoàn toàn độc lập","Làm tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội cộng sản"],3,"Cương lĩnh chính trị đầu tiên của Đảng (tháng 2/1930) xác định mục tiêu, phương hướng chiến lược của cách mạng Việt Nam là “làm tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội cộng sản”. Đường lối này gắn kết chặt chẽ ngay từ đầu mục tiêu độc lập dân tộc với định hướng chủ nghĩa xã hội.","Phân biệt kỹ câu hỏi: “Đánh đổ đế quốc chủ nghĩa Pháp và bọn phong kiến...” là nhiệm vụ chính trị cụ thể (không phải mục tiêu chiến lược tổng quát); “lập chính quyền công nông bằng hình thức Xô viết...” mang đặc trưng của Luận cương 10/1930; còn “dân giàu, nước mạnh, xã hội công bằng, dân chủ, văn minh” là mục tiêu thời kỳ Đổi mới."],[35,1,"Nội dung nào dưới đây trong Cương lĩnh chính trị đầu tiên của Đảng thể hiện tư tưởng đại đoàn kết dân tộc của Hồ Chí Minh?",["Vạch ra phương hướng cách mạng Việt Nam là làm tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội cộng sản","Nhiệm vụ cách mạng bao gồm: Dân tộc và Dân chủ, chống đế quốc và chống phong kiến, song nổi lên hàng đầu là nhiệm vụ chống đế quốc","Lãnh đạo cách mạng là giai cấp vô sản, thông qua chính Đảng là Đảng Cộng sản Việt Nam","Lực lượng cách mạng gồm toàn bộ những người Việt Nam yêu nước bao gồm: Công nhân, Nông dân, Tiểu tư sản, Trí thức, Trung nông...; tranh thủ, làm trung lập phú nông, trung, tiểu địa chủ, tư sản"],3,"Tư tưởng đại đoàn kết dân tộc của Hồ Chí Minh trong Cương lĩnh chính trị đầu tiên (2/1930) được thể hiện trực tiếp qua nội dung xác định lực lượng cách mạng: lấy công - nông làm gốc, đoàn kết rộng rãi tiểu tư sản, trí thức, trung nông, đồng thời tranh thủ hoặc trung lập phú nông, trung - tiểu địa chủ và tư sản chưa rõ mặt phản cách mạng nhằm cô lập tối đa kẻ thù.","Ba phương án còn lại đều là nội dung đúng của Cương lĩnh 2/1930 nhưng tương ứng với các mục khác: phương hướng chiến lược, nhiệm vụ cách mạng và vai trò lãnh đạo của Đảng. Khi đề nhấn từ khóa “đại đoàn kết dân tộc” thì phải chọn mục lực lượng cách mạng."],[36,1,"Địa điểm nào là nơi chủ tịch Hồ Chí Minh đã thực hiện trách nhiệm lịch sử trọng đại, soạn thảo bản “Tuyên ngôn Độc lập” của nước Việt Nam Dân chủ Cộng hòa?",["Nhà số 5D, Hàm Long, Hà Nội","Nhà số 312, Khâm Thiên, Hà Nội","Đình Tân Trào, huyện Sơn Dương, tỉnh Tuyên Quang","Nhà số 48, Hàng Ngang, Hà Nội"],3,"Cuối tháng 8/1945, sau khi từ Tân Trào về Hà Nội, Chủ tịch Hồ Chí Minh đã ở và làm việc tại tầng 2 nhà số 48 phố Hàng Ngang (nhà cơ sở cách mạng của gia đình ông bà Trịnh Văn Bô). Chính tại địa điểm này, từ ngày 28 đến 31/8/1945, Người đã soạn thảo bản Tuyên ngôn Độc lập khai sinh nước Việt Nam Dân chủ Cộng hòa.","Phân biệt rõ bốn địa danh lịch sử kinh điển: nhà số 5D Hàm Long là nơi thành lập Chi bộ Cộng sản đầu tiên (3/1929); nhà số 312 Khâm Thiên là nơi thành lập Đông Dương Cộng sản Đảng (6/1929); đình Tân Trào (Sơn Dương, Tuyên Quang) là nơi họp Quốc dân Đại hội (16/8/1945); nhà số 48 Hàng Ngang là nơi viết Tuyên ngôn Độc lập."],[37,1,"Cho biết đối tượng của cách mạng Đông Dương trong giai đoạn 1936-1939 là ai?",["Bọn đế quốc xâm lược","Địa chủ phong kiến","Đế quốc và phong kiến","Bọn phản động thuộc địa và tay sai"],3,"Giai đoạn 1936–1939, trước nguy cơ chủ nghĩa phát xít và việc Mặt trận Nhân dân Pháp lên cầm quyền, Đảng không chủ trương đánh đổ chung chung toàn bộ thực dân Pháp và phong kiến mà xác định kẻ thù trực tiếp, cụ thể trước mắt của cách mạng Đông Dương là bọn phản động thuộc địa Pháp và tay sai không chịu thi hành chính sách tiến bộ của Mặt trận Nhân dân Pháp.","So sánh đối tượng cách mạng qua ba thời kỳ: giai đoạn 1930–1931 là đế quốc Pháp và địa chủ phong kiến; giai đoạn 1936–1939 là bọn phản động thuộc địa và tay sai; giai đoạn 1939–1945 là đế quốc phát xít Pháp - Nhật và tay sai (từ sau ngày 9/3/1945 tập trung vào phát xít Nhật)."],[38,1,"Sự kiện nào được Nguyễn Ái Quốc đánh giá \"như chim én nhỏ báo hiệu mùa Xuân\"?",["Cách mạng tháng Mười Nga bùng nổ và thắng lợi","Sự thành lập Đảng Cộng sản Pháp","Sự thành lập Hội Việt Nam cách mạng thanh niên","Vụ mưu sát tên toàn quyền Méclanh của Phạm Hồng Thái"],3,"Ngày 19/6/1924, chiến sĩ yêu nước Phạm Hồng Thái (thành viên tổ chức Tâm tâm xã) đã ném bom mưu sát Toàn quyền Đông Dương Méc-lanh tại Sa Diện (Quảng Châu, Trung Quốc). Tuy mưu sát không thành nhưng hành động quả cảm này đã làm chấn động dư luận, được Nguyễn Ái Quốc đánh giá là “như chim én nhỏ báo hiệu mùa xuân” của thời đại đấu tranh dân tộc.","Không nhầm hình ảnh ẩn dụ của Nguyễn Ái Quốc giữa các sự kiện: vụ Phạm Hồng Thái ở Sa Diện (1924) là “chim én nhỏ báo hiệu mùa xuân”; còn Cách mạng Tháng Mười Nga (1917) được Người ca ngợi như “mặt trời chói lọi” mở ra con đường giải phóng cho các dân tộc bị áp bức."],[39,1,"Cho biết hình thức tổ chức và đấu tranh trong giai đoạn năm 1936-1939?",["Công khai, hợp pháp, bí mật","Nửa công khai, nửa hợp pháp, bí mật","Bí mật, bất hợp pháp, bãi công, biểu tình","Công khai, nửa công khai, nửa hợp pháp, bí mật, bất hợp pháp"],3,"Tận dụng điều kiện chính trị tương đối thuận lợi trong cao trào dân chủ 1936–1939, Đảng chủ trương kết hợp linh hoạt mọi hình thức tổ chức và đấu tranh: công khai, nửa công khai, hợp pháp và nửa hợp pháp (báo chí công khai, nghị trường, mít tinh...) đi đôi với tổ chức, hoạt động bí mật, bất hợp pháp nhằm vừa phát động quần chúng rộng rãi vừa bảo toàn lực lượng cốt cán.","Mẹo chọn đáp án cho giai đoạn 1936–1939 là chọn phương án đầy đủ nhất kết hợp cả hai mặt công khai/hợp pháp và bí mật/bất hợp pháp; còn nếu đề đổi sang giai đoạn 1930–1931 hoặc sau tháng 9/1939 (khi Đảng rút vào bí mật) thì hình thức chủ yếu là bí mật, bất hợp pháp."],[40,1,"Trong các văn kiện sau đây, văn kiện nào của Đảng nhấn mạnh: “Vấn đề thổ địa là cái cốt của cách mạng tư sản dân quyền”?",["Chánh cương vắn tắt, Sách lược vắn tắt tháng 2/1930","Chỉ thị thành lập Hội Phản đế Đồng minh (ngày 18/11/1930)","Xung quanh vấn đề chính sách mới của Đảng (tháng 10/1936)","Luận cương chính trị tháng 10/1930"],3,"Luận cương chính trị tháng 10/1930 của Đảng Cộng sản Đông Dương (do đồng chí Trần Phú soạn thảo) nhấn mạnh: “Vấn đề thổ địa là cái cốt của cách mạng tư sản dân quyền”. Quan điểm này phản ánh hạn chế của Luận cương khi quá nặng về đấu tranh giai cấp, chưa đặt nhiệm vụ giải phóng dân tộc lên vị trí hàng đầu như Cương lĩnh tháng 2/1930.","Phân biệt với các văn kiện khác: Chánh cương, Sách lược vắn tắt (2/1930) đặt giải phóng dân tộc lên hàng đầu; Chỉ thị 18/11/1930 lập Hội Phản đế Đồng minh; còn văn kiện “Chung quanh vấn đề chiến sách mới” (10/1936) bước đầu khắc phục hạn chế của Luận cương 10/1930 về mối quan hệ giữa vấn đề dân tộc và giai cấp."],[41,1,"Mặt trận dân chủ Đông dương chính thức thành lập vào năm nào?",["Năm 1935","Năm 1936","Năm 1936","Năm 1938"],3,"Tại Hội nghị Trung ương tháng 7/1936, Đảng chủ trương lập Mặt trận Thống nhất nhân dân phản đế Đông Dương. Đến Hội nghị Ban Chấp hành Trung ương tháng 3/1938 (họp tại Bà Điểm, Hóc Môn, Gia Định), để phù hợp với yêu cầu tập hợp rộng rãi lực lượng dân chủ chống phát xít và phản động thuộc địa, Đảng quyết định đổi tên thành Mặt trận Dân chủ Đông Dương.","Cẩn thận phân biệt hai mốc rất dễ nhầm: năm 1936 là năm chủ trương thành lập Mặt trận Thống nhất nhân dân phản đế Đông Dương, đến tháng 3/1938 mới chính thức mang tên Mặt trận Dân chủ Đông Dương; còn năm 1935 là năm diễn ra Đại hội đại biểu lần thứ I của Đảng tại Ma Cao."],[42,1,"Hội nghị nào đã quyết định phát động toàn dân nổi dậy Tổng khởi nghĩa giành chính quyền từ tay phát xít Nhật trước khi quân Đồng Minh vào Đông Dương tháng 8/1945?",["Hội nghị Ban Chấp hành Trung ương Đảng","Hội nghị Ban Thường vụ Trung ương Đảng","Hội nghị Tổng bộ Việt Minh","Hội nghị toàn quốc của Đảng"],3,"Trong bối cảnh Nhật Bản sắp đầu hàng Đồng minh, Hội nghị toàn quốc của Đảng họp tại Tân Trào (Tuyên Quang) ngày 14–15/8/1945 đã nhận định thời cơ ngàn năm có một đã chín muồi, quyết định phát động toàn dân nổi dậy Tổng khởi nghĩa giành chính quyền từ tay phát xít Nhật trước khi quân Đồng minh vào Đông Dương, theo ba nguyên tắc tập trung, thống nhất, kịp thời.","Phân biệt các hội nghị quan trọng năm 1945: Hội nghị Ban Thường vụ Trung ương mở rộng (9–12/3/1945) ra Chỉ thị “Nhật - Pháp bắn nhau và hành động của chúng ta” phát động cao trào kháng Nhật cứu nước; Hội nghị toàn quốc của Đảng (14–15/8/1945) quyết định Tổng khởi nghĩa; ngay sau đó là Quốc dân Đại hội Tân Trào (16–17/8/1945) tán thành Tổng khởi nghĩa và bầu Ủy ban Dân tộc giải phóng."],[43,1,"Trong Chương trình hành động của Đảng Cộng sản Đông Dương ngày 15/6/1932 vạch ra nhiệm vụ đấu tranh trong giai đoạn 1932-1935 là gì?",["Dân tộc, dân chủ, nhân dân","Dân chủ, dân sinh","Độc lập dân tộc","Khôi phục hệ thống tổ chức của Đảng và phong trào cách mạng"],3,"Sau cao trào 1930-1931 bị thực dân Pháp khủng bố trắng nặng nề, hầu hết cơ sở Đảng và phong trào quần chúng bị tổn thất nghiêm trọng. Vì vậy, Chương trình hành động ngày 15/6/1932 xác định nhiệm vụ trung tâm, cấp bách nhất giai đoạn 1932-1935 là khôi phục hệ thống tổ chức của Đảng và phong trào cách mạng. Các phương án như \"Dân chủ, dân sinh\" hay \"Độc lập dân tộc\" thuộc mục tiêu của những giai đoạn lịch sử khác.","Nếu đề hỏi mục tiêu đấu tranh trực tiếp giai đoạn 1936-1939 thì chọn \"Dân chủ, dân sinh\" (tự do, dân sinh, dân chủ, cơm áo, hòa bình); còn nếu hỏi nhiệm vụ đặt lên hàng đầu từ Hội nghị Trung ương 6 (11/1939) đến 1945 thì chọn \"Độc lập dân tộc\" (giải phóng dân tộc)."],[44,1,"Quân đội phát xít Nhật vào Đông Dương làm cho nhân dân Đông Dương phải chịu cảnh “một cổ hai tròng” vào thời gian nào?",["Tháng 9 năm 1939","Tháng 8 năm 1940","Tháng 8 năm 1942","Tháng 9 năm 1940"],3,"Tháng 9/1940, quân đội phát xít Nhật vượt biên giới tiến vào Đông Dương qua ngả Lạng Sơn và đổ bộ vào Hải Phòng để mở rộng xâm lược Đông Nam Á. Thực dân Pháp nhanh chóng đầu hàng và câu kết với Nhật để cùng bóc lột, đàn áp, đẩy nhân dân Đông Dương vào cảnh \"một cổ hai tròng\" áp bức. Mốc tháng 9/1939 là thời điểm Chiến tranh thế giới thứ hai bùng nổ, chưa có sự kiện quân Nhật vào Đông Dương.","Nếu đề hỏi thời điểm Chiến tranh thế giới thứ hai bùng nổ làm thay đổi bối cảnh Đông Dương thì chọn tháng 9 năm 1939; nếu hỏi thời điểm phát xít Nhật đảo chính hất cẳng Pháp để độc chiếm Đông Dương thì chọn ngày 9 tháng 3 năm 1945."],[45,1,"Hội nghị Trung ương nào bắt đầu chủ trương điều chỉnh từ chiến lược đấu tranh giành các quyền dân chủ sang chiến lược cách mạng giải phóng dân tộc trong giai đoạn kháng chiến chống thực dân Pháp (1930- 1945)?",["Hội nghị Trung ương lần thứ nhất (10/1930)","Hội nghị Trung ương lần thứ bảy (11/1940)","Hội nghị Trung ương lần thứ tám (5/1941)","Hội nghị Trung ương lần thứ sáu (11/1939)"],3,"Ngay sau khi Chiến tranh thế giới thứ hai bùng nổ (9/1939), tại Bà Điểm (Hóc Môn, Gia Định), Hội nghị Trung ương lần thứ sáu (11/1939) do Tổng Bí thư Nguyễn Văn Cừ chủ trì đã mở đầu chủ trương chuyển hướng chỉ đạo chiến lược của Đảng. Hội nghị đặt nhiệm vụ giải phóng dân tộc lên hàng đầu và tạm gác khẩu hiệu cách mạng ruộng đất để tập trung chống đế quốc và tay sai. Hội nghị Trung ương lần thứ bảy và thứ tám là các bước tiếp tục bổ sung và hoàn chỉnh chủ trương này.","Nếu đề đổi từ khóa từ \"bắt đầu chủ trương điều chỉnh\" sang \"hoàn chỉnh chủ trương chuyển hướng chỉ đạo chiến lược\" hoặc xác định khởi nghĩa vũ trang là nhiệm vụ trung tâm thì chọn Hội nghị Trung ương lần thứ tám (5/1941); còn thông qua Luận cương chính trị thì chọn Hội nghị Trung ương lần thứ nhất (10/1930)."],[46,1,"Tại Hội nghị nào Ban chấp hành Trung ương Đảng xác định chuẩn bị khởi nghĩa vũ trang là nhiệm vụ trung tâm của Đảng và nhân dân trong kháng chiến chống thực dân Pháp giai đoạn 1930-1945?",["Hội nghị Trung ương lần thứ nhất (10/1930)","Hội nghị Trung ương lần thứ bảy (11/1940)","Hội nghị Trung ương lần thứ sáu (11/1939)","Hội nghị Trung ương lần thứ tám (5/1941)"],3,"Hội nghị Trung ương lần thứ tám (5/1941) họp tại Pác Bó (Cao Bằng) do lãnh tụ Nguyễn Ái Quốc trực tiếp chủ trì đã hoàn chỉnh đường lối chuyển hướng chỉ đạo chiến lược của Đảng. Hội nghị xác định chuẩn bị khởi nghĩa vũ trang là nhiệm vụ trung tâm của toàn Đảng, toàn dân, đi từ khởi nghĩa từng phần tiến lên tổng khởi nghĩa giành chính quyền. Hội nghị Trung ương sáu (11/1939) mới mở đầu chuyển hướng, còn Hội nghị Trung ương bảy (11/1940) tiếp tục khẳng định chủ trương đó nhưng chưa đề ra nhiệm vụ trung tâm này.","Nếu đề hỏi hội nghị \"bắt đầu\" chuyển hướng chiến lược thì chọn Hội nghị Trung ương lần thứ sáu (11/1939); nếu hỏi hội nghị quyết định duy trì đội du kích Bắc Sơn và hoãn khởi nghĩa Nam Kỳ thì chọn Hội nghị Trung ương lần thứ bảy (11/1940)."],[47,1,"Hội nghị Ban chấp hành Trung ương Đảng họp vào ngày 26/7/1936 chủ trương thành lập Mặt trận mang tên gì?",["Mặt trận Dân chủ Đông Dương","Mặt trận Dân tộc thống nhất phản đế Đông Dương","Mặt trận Đồng minh phản đế Đông Dương","Mặt trận nhân dân phản đế Đông Dương"],3,"Tại Hội nghị Ban Chấp hành Trung ương Đảng họp ở Thượng Hải (Trung Quốc) ngày 26/7/1936 do Lê Hồng Phong chủ trì, Đảng xác định mục tiêu đấu tranh trước mắt là chống phát xít, chống chiến tranh, đòi tự do, dân sinh, dân chủ. Để tập hợp rộng rãi các lực lượng yêu nước và tiến bộ, Hội nghị chủ trương thành lập Mặt trận thống nhất nhân dân phản đế Đông Dương (gọi gọn là Mặt trận nhân dân phản đế Đông Dương). Tên gọi Mặt trận Dân chủ Đông Dương chỉ được đổi về sau vào năm 1938.","Nếu đề hỏi tên mặt trận sau khi đổi tại Hội nghị Trung ương tháng 3/1938 thì chọn Mặt trận Dân chủ Đông Dương; còn nếu hỏi tên mặt trận do Hội nghị Trung ương 6 (11/1939) thành lập thì chọn Mặt trận Dân tộc thống nhất phản đế Đông Dương."],[48,1,"Được sự giúp đỡ của Quốc tế Cộng sản, Đảng ta đã kịp thời công bố “Chương trình hành động của Đảng Cộng sản Đông Dương” vào ngày tháng năm nào?",["Ngày 15 tháng 5 năm 1932","Ngày 15 tháng 8 năm 1932","Ngày 15 tháng 7 năm 1932","Ngày 15 tháng 6 năm 1932"],3,"Sau khi phong trào cách mạng 1930-1931 bị đàn áp khốc liệt, dưới sự chỉ đạo và giúp đỡ của Quốc tế Cộng sản, Lê Hồng Phong cùng các đồng chí cốt cán đã soạn thảo và công bố \"Chương trình hành động của Đảng Cộng sản Đông Dương\" vào ngày 15/6/1932. Văn kiện này vạch ra yêu cầu trước mắt và lâu dài, định hướng công tác khôi phục hệ thống tổ chức Đảng và phong trào quần chúng trong giai đoạn 1932-1935. Các mốc tháng 5, tháng 7 và tháng 8 năm 1932 đều là phương án nhiễu về thời gian.","Nếu đề hỏi nhiệm vụ trọng tâm được đề ra trong Chương trình hành động ngày 15/6/1932 thì chọn \"Khôi phục hệ thống tổ chức của Đảng và phong trào cách mạng\"; còn nếu hỏi Đại hội đánh dấu sự phục hồi hoàn toàn của Đảng giai đoạn này thì chọn Đại hội lần thứ nhất (3/1935) tại Ma Cao."],[49,1,"Nguyên nhân chủ yếu và có ý nghĩa quyết định sự bùng nổ và phát triển của các cao trào cách mạng Việt Nam năm 1930 là gì?",["Tác động tiêu cực của cuộc khủng hoảng kinh tế","Chính sách khủng bố trắng của đế quốc Pháp","Chính sách tăng cường vơ vét bóc lột của đế quốc Pháp","Sự lãnh đạo của Đảng Cộng sản Việt Nam"],3,"Đầu năm 1930, Đảng Cộng sản Việt Nam ra đời đã chấm dứt cuộc khủng hoảng về đường lối cứu nước và giai cấp lãnh đạo, nhanh chóng thống nhất tổ chức và phát động quần chúng đấu tranh trên quy mô cả nước. Chính sự lãnh đạo đúng đắn, kịp thời của Đảng là nhân tố chủ quan giữ vai trò chủ yếu và quyết định sự bùng nổ, phát triển mạnh mẽ của cao trào 1930-1931. Khủng hoảng kinh tế hay chính sách bóc lột, khủng bố trắng của Pháp chỉ là điều kiện khách quan làm mâu thuẫn xã hội thêm gay gắt.","Nếu đề hỏi nguyên nhân khách quan khiến đời sống nhân dân thêm cùng cực, thúc đẩy phong trào đầu năm 1930 thì chú ý đến tác động của cuộc khủng hoảng kinh tế 1929-1933 và chính sách vơ vét, khủng bố trắng của thực dân Pháp; hễ thấy từ khóa \"quyết định\" luôn chọn sự lãnh đạo của Đảng."],[50,1,"Cuộc khai thác thuộc địa lần thứ hai của Pháp ở Việt Nam (1919 - 1929) có điểm gì tương đồng so với cuộc khai thác thuộc địa lần thứ nhất?",["Pháp chú trọng đầu tư vào ngành khai thác mỏ","Đẩy mạnh hoạt động thương mại xuất - nhập khẩu","Pháp không đầu tư nhiều vào xây dựng cơ sở hạ tầng","Pháp không đầu tư nhiều vào các ngành công nghiệp nặng"],3,"Trong cả hai cuộc khai thác thuộc địa (1897-1914 và 1919-1929), thực dân Pháp đều nhằm mục đích vơ vét tài nguyên và biến Đông Dương thành thị trường tiêu thụ hàng hóa phụ thuộc kinh tế chính quốc. Do đó, Pháp chỉ tập trung vốn vào đồn điền cao su, khai thác mỏ và một số ngành công nghiệp nhẹ, tuyệt đối không đầu tư nhiều vào các ngành công nghiệp nặng để tránh tạo ra nền kinh tế độc lập. Phương án không đầu tư hạ tầng là sai vì Pháp vẫn xây dựng đường sắt, bến cảng phục vụ khai thác và quân sự.","Nếu đề hỏi điểm khác biệt nổi bật của cuộc khai thác thuộc địa lần thứ hai (1919-1929) so với lần thứ nhất thì chọn quy mô lớn hơn, tốc độ nhanh hơn và vốn đầu tư tập trung nhiều nhất vào nông nghiệp (chủ yếu là đồn điền cao su) cùng ngành khai mỏ."],[51,1,"Ai là người đã từng tham gia vụ binh biến trên tàu chiến Pháp ở Biển Đen (năm 1918) phản đối chính sách can thiệp cách mạng Nga của đế quốc Pháp, khi về nước đã lập ra tổ chức đầu tiên của công nhân Việt Nam?",["Phan Anh","Trường Chinh","Lê Duẩn","Tôn Đức Thắng"],3,"Khi bị động viên làm thợ máy trên chiến hạm của hải quân Pháp ở Biển Đen, người công nhân yêu nước Tôn Đức Thắng đã trực tiếp tham gia cuộc phản chiến, kéo cờ đỏ ủng hộ nước Nga Xô viết, phản đối đế quốc Pháp can thiệp vào Cách mạng Tháng Mười. Năm 1920, sau khi trở về Sài Gòn, ông đã sáng lập Công hội đỏ (tổ chức Công hội bí mật ở Sài Gòn - Chợ Lớn), tổ chức công đoàn đầu tiên của giai cấp công nhân Việt Nam. Phan Anh, Trường Chinh và Lê Duẩn không gắn với sự kiện Biển Đen hay Công hội đỏ năm 1920.","Lưu ý dù câu hỏi gốc in mốc năm 1918 (sử liệu chuẩn là ngày 19/4/1919), hễ gặp từ khóa \"Biển Đen\" và \"tổ chức đầu tiên của công nhân Việt Nam\" đều chọn Tôn Đức Thắng; nếu đề hỏi tác giả \"Đề cương văn hóa Việt Nam\" (1943) thì chọn Trường Chinh, còn tác giả \"Đề cương cách mạng miền Nam\" (1956) thì chọn Lê Duẩn."],[52,1,"Điền thêm từ còn thiếu trong lời nhận định của đồng chí Lê Duẩn: “Không có những trận chiến đấu giai cấp rung trời chuyển đất những năm 1930 - 1931, trong đó công nông đã vung ra nghị lực phi thường của mình thì không thể có cao trào....”",["những năm 1932 - 1935","những năm 1939 - 1945","kháng Nhật cứu nước","những năm 1936 – 1939"],3,"Câu nhận định nổi tiếng của Tổng Bí thư Lê Duẩn nhấn mạnh ý nghĩa lịch sử to lớn và tính kế thừa trực tiếp của phong trào cách mạng 1930-1931 đối với bước phát triển kế tiếp là cao trào dân chủ những năm 1936-1939. Cao trào 1930-1931 đã rèn luyện bản lĩnh cho Đảng, khẳng định vai trò lãnh đạo của giai cấp công nhân và xây dựng khối liên minh công - nông vững chắc làm tiền đề cho cao trào những năm 1936-1939. Các giai đoạn 1932-1935 hay 1939-1945 không khớp với nguyên văn câu trích dẫn của đồng chí Lê Duẩn.","Nếu đề hỏi tên giai đoạn phục hồi lực lượng ngay sau 1930-1931 thì chọn những năm 1932-1935; nếu hỏi giai đoạn giải phóng dân tộc tiến tới Cách mạng Tháng Tám thì chọn những năm 1939-1945, trong đó đỉnh cao từ tháng 3/1945 là cao trào kháng Nhật cứu nước."],[53,1,"Vì sao nói phong trào 1930 - 1931 là bước phát triển mới của cách mạng Việt Nam?",["Lần đầu tiên trong cuộc đấu tranh chống đế quốc phong kiến, công nông đã giành được chính quyền ở trên toàn Nghệ - Tĩnh.","Lần đầu tiên công – nông vùng lên, đấu tranh chính trị kết hợp vũ trang tự vệ trên quy mô cả nước.","Lần đầu tiên phong trào dân tộc do Đảng Cộng sản lãnh đạo đã giành được thắng lợi, gây tiếng vang lớn, có ảnh hưởng mạnh mẽ đến đấu tranh của các dân tộc phương Đông.","Lần đầu tiên đấu tranh có quy mô trên cả nước, do Đảng Cộng sản Việt Nam lãnh đạo, có tính thống nhất cao, công – nông cùng đoàn kết đấu tranh quyết liệt chống đế quốc, phong kiến"],3,"Khác hẳn các phong trào yêu nước tự phát, rời rạc trước năm 1930, phong trào 1930-1931 lần đầu tiên bùng nổ trên quy mô cả nước dưới sự lãnh
