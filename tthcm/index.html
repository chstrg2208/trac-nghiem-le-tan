<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#BD1E59">
<meta name="description" content="Ôn tập trắc nghiệm Tư tưởng Hồ Chí Minh: 280 câu đủ 6 chương có giải thích chi tiết từng câu, mẹo liên hệ nếu đề hỏi khác, trộn đáp án A-B-C-D và mã QR.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FFE4EC'/%3E%3Cpath d='M7 13L6 5l6 4q4-1 8 0l6-4-1 8c3 3 3 10-2 13-4 2-10 2-14 0-5-3-5-10-2-13z' fill='%23FFF' stroke='%234A1026' stroke-width='1.5'/%3E%3Ccircle cx='12' cy='18' r='1.3' fill='%234A1026'/%3E%3Ccircle cx='20' cy='18' r='1.3' fill='%234A1026'/%3E%3Cellipse cx='16' cy='20.5' rx='1.8' ry='1.2' fill='%23FBBF24'/%3E%3Ccircle cx='22' cy='9' r='2.5' fill='%23E11D48'/%3E%3C/svg%3E">
<title>Tư tưởng Hồ Chí Minh · Trắc nghiệm 280 câu (Hello Kitty)</title>
<style>
  :root {
    --bg-desk: #FFDCE8;
    --bg-page: #FFF9FB;
    --bg-strip: #FFEFF4;
    --bg-card: rgba(255, 255, 255, 0.93);
    --bg-card-solid: #FFFFFF;
    --navy: #BD1E59;
    --navy-soft: #9F1548;
    --ribbon: #E11D48;
    --ink: #4A1026;
    --ink-body: #5C1B33;
    --ink-muted: #88465F;
    --border: #F4C3D4;
    --border-strong: #E494B0;
    --teal: #0F766E;
    --teal-bg: #ECFDF5;
    --teal-text: #064E3B;
    --crimson: #B91C1C;
    --crimson-bg: #FEF2F2;
    --crimson-text: #7F1D1D;
    --amber: #B45309;
    --amber-bg: #FEF3C7;
    --amber-text: #78350F;
    --twist-bg: #FFF7ED;
    --twist-border: #FDBA74;
    --twist-ink: #7C2D12;
    --selected-bg: #FDF2F8;
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 18px;
    --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg-page);
    color: var(--ink);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  ::selection { background: var(--navy); color: #FFFFFF; }
  button, input { font-family: inherit; }

  .tnum { font-variant-numeric: tabular-nums; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  /* Flying Kitty Sky Backdrop */
  .sky-backdrop {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
    display: none;
  }
  @media (min-width: 768px) {
    .sky-backdrop { display: block; }
  }
  .stage-sky {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .fly-obj {
    position: absolute;
    will-change: transform;
    pointer-events: none;
  }
  .fly-cat-a {
    animation: kitty-glide-lr var(--dur, 18s) linear var(--del, 0s) infinite;
    opacity: var(--op, 0.42);
  }
  .fly-cat-b {
    animation: kitty-glide-rl var(--dur, 21s) linear var(--del, 0s) infinite;
    opacity: var(--op, 0.38);
  }
  .fly-float {
    animation: kitty-bob var(--dur, 6s) ease-in-out var(--del, 0s) infinite;
    opacity: var(--op, 0.45);
  }
  .kitty-wing-l {
    transform-origin: 18px 25px;
    animation: wing-l 0.9s ease-in-out infinite alternate;
  }
  .kitty-wing-r {
    transform-origin: 46px 25px;
    animation: wing-r 0.9s ease-in-out infinite alternate;
  }
  @keyframes wing-l {
    from { transform: rotate(-14deg); }
    to { transform: rotate(12deg); }
  }
  @keyframes wing-r {
    from { transform: rotate(14deg); }
    to { transform: rotate(-12deg); }
  }
  @keyframes kitty-glide-lr {
    0% { transform: translate3d(-120px, 18px, 0) rotate(-6deg); }
    25% { transform: translate3d(28vw, -14px, 0) rotate(4deg); }
    50% { transform: translate3d(58vw, 16px, 0) rotate(-4deg); }
    75% { transform: translate3d(88vw, -12px, 0) rotate(5deg); }
    100% { transform: translate3d(calc(100vw + 140px), 10px, 0) rotate(-5deg); }
  }
  @keyframes kitty-glide-rl {
    0% { transform: translate3d(calc(100vw + 120px), -10px, 0) rotate(6deg); }
    25% { transform: translate3d(72vw, 18px, 0) rotate(-4deg); }
    50% { transform: translate3d(42vw, -14px, 0) rotate(4deg); }
    75% { transform: translate3d(14vw, 14px, 0) rotate(-5deg); }
    100% { transform: translate3d(-140px, -8px, 0) rotate(5deg); }
  }
  @keyframes kitty-bob {
    0%, 100% { transform: translate3d(0, 0, 0) rotate(-4deg); }
    50% { transform: translate3d(0, -14px, 0) rotate(5deg); }
  }
  @keyframes mascot-hop {
    0%, 100% { transform: translateY(0) scale(1); }
    35% { transform: translateY(-6px) rotate(-6deg) scale(1.08); }
    70% { transform: translateY(-2px) rotate(5deg) scale(1.04); }
  }
  .kitty-mascot.hop {
    animation: mascot-hop 520ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  @media (prefers-reduced-motion: reduce) {
    .fly-cat-a, .fly-cat-b, .fly-float, .kitty-wing-l, .kitty-wing-r, .kitty-mascot.hop {
      animation: none !important;
    }
    .fly-cat-a { transform: translate3d(16px, 0, 0); }
    .fly-cat-b { transform: translate3d(calc(100% - 76px), 0, 0); }
  }

  /* Outer App Frame */
  .app-frame {
    position: relative;
    z-index: 1;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg-page);
    width: 100%;
    overflow: hidden;
  }

  @media (min-width: 768px) {
    body { background: var(--bg-desk); padding: 14px; }
    .app-frame {
      max-width: 1080px;
      height: calc(100dvh - 28px);
      margin: 0 auto;
      border: 1.5px solid #EEABC1;
      border-radius: 22px;
    }
  }

  /* Header Bar */
  .topbar {
    background: var(--navy);
    color: #FFFFFF;
    padding: 11px 16px 10px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }
  .toprow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .brand-wrap {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
  }
  .kitty-mascot {
    appearance: none;
    border: none;
    background: transparent;
    padding: 0;
    margin: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    border-radius: 50%;
  }
  .kitty-mascot:focus-visible { outline: 2px solid #FFFFFF; outline-offset: 2px; }
  h1.brand {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.015em;
    color: #FFFFFF;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .brand-credit {
    font-size: 11px;
    font-weight: 500;
    color: #FFE4EC;
    white-space: nowrap;
    display: none;
  }
  @media (min-width: 540px) { .brand-credit { display: inline; } }

  .qr-trigger {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--navy-soft);
    color: #FFFFFF;
    border: 1px solid rgba(255, 255, 255, 0.34);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
    min-height: 34px;
  }
  .qr-trigger:hover { background: #83113B; }
  .qr-trigger:focus-visible { outline: 2px solid #FFFFFF; outline-offset: 2px; }

  .tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .tab {
    appearance: none;
    background: rgba(255, 255, 255, 0.14);
    color: #FFFFFF;
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 11px;
    padding: 7px 4px;
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    min-height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    white-space: nowrap;
  }
  .tab:hover { background: rgba(255, 255, 255, 0.22); }
  .tab.active {
    background: var(--bg-page);
    color: var(--navy-soft);
    border-color: var(--bg-page);
  }
  .tab:focus-visible { outline: 2px solid #FFFFFF; outline-offset: 1px; }
  .tab-count { font-variant-numeric: tabular-nums; opacity: 0.92; }

  /* Chapter Filter Strip */
  .chapter-bar {
    background: #FFF4F7;
    border-bottom: 1px solid var(--border);
    padding: 7px 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    overflow-x: auto;
    flex-shrink: 0;
    scrollbar-width: none;
    position: relative;
    z-index: 2;
  }
  .chapter-bar::-webkit-scrollbar { display: none; }
  .chapter-bar.hidden { display: none; }
  .ch-pill {
    appearance: none;
    border: 1px solid var(--border);
    background: #FFFFFF;
    color: var(--ink-body);
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    flex-shrink: 0;
  }
  .ch-pill.active {
    background: var(--navy);
    border-color: var(--navy);
    color: #FFFFFF;
  }
  .ch-pill:focus-visible { outline: 2px solid var(--navy); outline-offset: 1px; }

  /* Mode & Status Strip */
  .statusstrip {
    background: var(--bg-strip);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }
  .mode-switch {
    display: inline-flex;
    background: #FAD4E1;
    border: 1px solid #F0A9C2;
    border-radius: 999px;
    padding: 2px;
    gap: 2px;
  }
  .mode-btn {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink);
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    min-height: 30px;
  }
  .mode-btn.active { background: var(--teal); color: #FFFFFF; }
  .mode-btn.exam-active { background: var(--navy); color: #FFFFFF; }
  .mode-btn:focus-visible { outline: 2px solid var(--navy); outline-offset: 1px; }

  .status-right {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    flex-wrap: wrap;
  }
  .stat-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--bg-card-solid);
    border: 1px solid var(--border);
    color: var(--ink);
  }
  .stat-pill.good { background: var(--teal-bg); border-color: #99F6E4; color: var(--teal-text); }
  .stat-pill.warn { background: var(--crimson-bg); border-color: #FECACA; color: var(--crimson-text); }

  .mini-action {
    appearance: none;
    border: 1px solid var(--border-strong);
    background: var(--bg-card-solid);
    color: var(--ink);
    border-radius: 999px;
    padding: 4px 11px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    min-height: 30px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .mini-action.primary { background: var(--navy); border-color: var(--navy); color: #FFFFFF; }
  .mini-action:hover { opacity: 0.92; }
  .mini-action:focus-visible { outline: 2px solid var(--navy); outline-offset: 1px; }

  .progbar {
    height: 4px;
    background: #FCDFE9;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }
  .progfill {
    height: 100%;
    width: 0%;
    background: var(--ribbon);
    transition: width 180ms ease;
  }

  /* Split Workspace on Desktop */
  .workspace {
    flex: 1;
    display: flex;
    min-height: 0;
    overflow: hidden;
  }
  .stage-col {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background: linear-gradient(180deg, #FFF9FB 0%, #FFF1F6 100%);
  }
  .main {
    position: relative;
    z-index: 1;
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: thin;
    scrollbar-color: #E494B0 transparent;
  }
  .main > * { flex-shrink: 0; }
  @media (min-width: 768px) {
    .main { padding: 20px 24px 28px; gap: 14px; }
  }
  .main::-webkit-scrollbar { width: 6px; }
  .main::-webkit-scrollbar-thumb { background: #E494B0; border-radius: 3px; }

  /* Question Meta Row */
  .qmeta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-muted);
  }
  .qmeta-left {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
  }
  .qnum-label { color: var(--ink); font-weight: 700; }
  .tag-chip {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--bg-strip);
    border: 1px solid var(--border);
    color: var(--ink-body);
    font-size: 11.5px;
    font-weight: 600;
  }
  .flag-btn {
    appearance: none;
    background: var(--bg-card-solid);
    border: 1px solid var(--border);
    color: var(--ink-muted);
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-height: 32px;
    flex-shrink: 0;
  }
  .flag-btn.flagged {
    background: var(--amber-bg);
    border-color: #D97706;
    color: var(--amber-text);
  }
  .flag-btn:focus-visible { outline: 2px solid var(--navy); outline-offset: 1px; }

  /* Question Card */
  .qcard {
    background: var(--bg-card);
    backdrop-filter: blur(4px);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px;
  }
  @media (min-width: 768px) { .qcard { padding: 20px; } }
  .qstem {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.5;
    color: var(--ink);
  }
  @media (min-width: 768px) { .qstem { font-size: 17px; } }

  /* Options */
  .opts { display: flex; flex-direction: column; gap: 9px; }
  .opt {
    appearance: none;
    width: 100%;
    text-align: left;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--bg-card);
    backdrop-filter: blur(4px);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    min-height: 52px;
    font-size: 14.5px;
    line-height: 1.44;
    color: var(--ink-body);
    cursor: pointer;
    transition: border-color 120ms ease, background-color 120ms ease, transform 120ms ease;
  }
  .opt:hover:not(:disabled) {
    border-color: var(--border-strong);
    background: #FFFDFD;
    transform: translateY(-1px);
  }
  .opt:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
  .opt:disabled { cursor: default; }

  .opt-badge {
    min-width: 28px;
    height: 28px;
    border-radius: 999px;
    background: #FFF0F5;
    border: 1.5px solid #F0A9C2;
    color: var(--navy-soft);
    font-weight: 700;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .opt-text { flex: 1; }
  .opt-icon { flex-shrink: 0; margin-top: 4px; display: none; }

  .opt.selected {
    background: var(--selected-bg);
    border-color: var(--navy);
    box-shadow: inset 0 0 0 1px var(--navy);
    color: var(--ink);
    font-weight: 600;
  }
  .opt.selected .opt-badge { background: var(--navy); border-color: var(--navy); color: #FFFFFF; }

  .opt.correct {
    background: var(--teal-bg);
    border-color: var(--teal);
    box-shadow: inset 0 0 0 1px var(--teal);
    color: var(--teal-text);
    font-weight: 600;
  }
  .opt.correct .opt-badge { background: var(--teal); border-color: var(--teal); color: #FFFFFF; }
  .opt.correct .opt-icon { display: inline-flex; color: var(--teal); }

  .opt.wrong {
    background: var(--crimson-bg);
    border-color: var(--crimson);
    box-shadow: inset 0 0 0 1px var(--crimson);
    color: var(--crimson-text);
    font-weight: 600;
  }
  .opt.wrong .opt-badge { background: var(--crimson); border-color: var(--crimson); color: #FFFFFF; }
  .opt.wrong .opt-icon { display: inline-flex; color: var(--crimson); }

  /* Feedback Strip */
  .feedback {
    border-radius: var(--radius-md);
    padding: 11px 14px;
    font-size: 13.5px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    border: 1px solid transparent;
  }
  .feedback.correct { background: var(--teal-bg); border-color: #99F6E4; color: var(--teal-text); }
  .feedback.wrong { background: var(--crimson-bg); border-color: #FECACA; color: var(--crimson-text); }
  .feedback.neutral { background: var(--bg-strip); border-color: var(--border); color: var(--ink-body); }
  .feedback-main { display: flex; align-items: center; gap: 8px; }

  /* Detailed Study Note Card (Why + If Asked Differently) */
  .study-note {
    background: var(--bg-card-solid);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .note-sec {
    padding: 13px 15px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .note-sec + .note-sec {
    border-top: 1px dashed var(--border);
  }
  .note-sec.twist {
    background: var(--twist-bg);
    border-top-color: var(--twist-border);
  }
  .note-head {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--navy-soft);
  }
  .note-sec.twist .note-head {
    color: var(--twist-ink);
  }
  .note-body {
    margin: 0;
    font-size: 14px;
    line-height: 1.55;
    color: var(--ink-body);
  }
  .note-sec.twist .note-body {
    color: #5B210B;
  }

  /* Summary Banner inside Main */
  .summary-card {
    background: var(--bg-card-solid);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .summary-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .summary-title { margin: 0; font-size: 16px; font-weight: 700; color: var(--ink); }
  .score-big { font-size: 28px; font-weight: 700; color: var(--teal); line-height: 1; }
  .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .summary-cell {
    background: var(--bg-page);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px;
    text-align: center;
  }
  .summary-cell-val { font-size: 18px; font-weight: 700; color: var(--ink); }
  .summary-cell-lbl { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
  .summary-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* Empty Wrong State */
  .empty-state {
    background: var(--bg-card-solid);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px 20px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .empty-state h2 { margin: 0; font-size: 16px; font-weight: 700; color: var(--ink); }
  .empty-state p { margin: 0; font-size: 13.5px; color: var(--ink-muted); max-width: 340px; line-height: 1.5; }

  /* Bottom Thumb Dock */
  .dock {
    position: relative;
    z-index: 2;
    background: var(--bg-card-solid);
    border-top: 1px solid var(--border);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    display: grid;
    grid-template-columns: 1fr 1.25fr 1fr;
    gap: 8px;
    flex-shrink: 0;
  }
  .dbtn {
    appearance: none;
    border: 1.5px solid var(--border-strong);
    background: #FFF5F8;
    color: var(--navy-soft);
    border-radius: var(--radius-md);
    padding: 10px 8px;
    min-height: 46px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    white-space: nowrap;
  }
  .dbtn.primary { background: var(--navy); border-color: var(--navy); color: #FFFFFF; }
  .dbtn:disabled { opacity: 0.42; cursor: not-allowed; }
  .dbtn:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }

  /* Desktop Right Ballot Rail */
  .desktop-rail {
    position: relative;
    z-index: 2;
    display: none;
    width: 320px;
    flex-shrink: 0;
    background: var(--bg-page);
    border-left: 1px solid var(--border);
    flex-direction: column;
    overflow: hidden;
  }
  @media (min-width: 1024px) {
    .desktop-rail { display: flex; }
    .dock { grid-template-columns: 1fr 1fr; }
    .dock-ballot-btn { display: none; }
  }

  .rail-head {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-strip);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .rail-title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .rail-title { margin: 0; font-size: 13.5px; font-weight: 700; color: var(--ink); }
  .ballot-filters { display: flex; gap: 4px; flex-wrap: wrap; }
  .filter-chip {
    appearance: none;
    background: var(--bg-card-solid);
    border: 1px solid var(--border);
    color: var(--ink-muted);
    border-radius: 999px;
    padding: 4px 9px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .filter-chip.active { background: var(--navy); border-color: var(--navy); color: #FFFFFF; }

  .ballot-scroll { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .ballot-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  @media (max-width: 1023px) { .ballot-grid { grid-template-columns: repeat(7, 1fr); } }
  @media (max-width: 379px) { .ballot-grid { grid-template-columns: repeat(5, 1fr); } }
  .bcell {
    appearance: none;
    position: relative;
    height: 38px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-card-solid);
    color: var(--ink);
    font-size: 12px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bcell.current { border-color: var(--navy); box-shadow: inset 0 0 0 1.5px var(--navy); }
  .bcell.ok { background: var(--teal); border-color: var(--teal); color: #FFFFFF; }
  .bcell.bad { background: var(--crimson); border-color: var(--crimson); color: #FFFFFF; }
  .bcell.picked { background: var(--navy); border-color: var(--navy); color: #FFFFFF; }
  .bcell.flagged::after {
    content: "";
    position: absolute;
    top: 3px;
    right: 3px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #F59E0B;
  }
  .bcell:focus-visible { outline: 2px solid var(--navy); outline-offset: 1px; }

  .ballot-legend {
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    background: var(--bg-strip);
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 11.5px;
    color: var(--ink-body);
  }
  .leg-item { display: inline-flex; align-items: center; gap: 5px; }
  .leg-dot { width: 10px; height: 10px; border-radius: 3px; border: 1px solid var(--border-strong); background: #FFFFFF; }
  .leg-dot.ok { background: var(--teal); border-color: var(--teal); }
  .leg-dot.bad { background: var(--crimson); border-color: var(--crimson); }
  .leg-dot.picked { background: var(--navy); border-color: var(--navy); }
  .leg-dot.flag { background: #F59E0B; border-color: #D97706; border-radius: 50%; }

  /* Drawer & Modals */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(74, 16, 38, 0.45);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  .backdrop.open { display: flex; }
  @media (min-width: 640px) { .backdrop.modal-center { align-items: center; padding: 16px; } }

  .sheet {
    width: 100%;
    max-width: 560px;
    max-height: 82dvh;
    background: var(--bg-page);
    border-radius: 18px 18px 0 0;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  @media (min-width: 640px) { .backdrop.modal-center .sheet { border-radius: 16px; max-width: 440px; } }
  .sheet-head {
    padding: 14px 16px;
    background: var(--bg-strip);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .sheet-title { margin: 0; font-size: 15px; font-weight: 700; color: var(--ink); }
  .close-btn {
    appearance: none;
    background: var(--bg-card-solid);
    border: 1px solid var(--border);
    color: var(--ink);
    border-radius: var(--radius-sm);
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  /* QR Modal Content */
  .qr-body {
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    overflow-y: auto;
  }
  .qr-box {
    width: 220px;
    height: 220px;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qr-box svg { width: 100%; height: 100%; display: block; }
  .qr-hint { margin: 0; font-size: 13px; color: var(--ink-muted); text-align: center; line-height: 1.45; }
  .qr-url-row { width: 100%; display: flex; gap: 6px; }
  .qr-input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--border-strong);
    background: #FFFFFF;
    color: var(--ink);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    font-size: 12.5px;
  }
  .qr-actions { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .confirm-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .confirm-text { margin: 0; font-size: 14px; line-height: 1.5; color: var(--ink-body); }
  .confirm-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
</style>

  const CHAPTERS = [{"num":1,"title":"KHÁI NIỆM, ĐỐI TƯỢNG, PHƯƠNG PHÁP NGHIÊN CỨU VÀ Ý NGHĨA HỌC TẬP MÔN TƯ TƯỞNG HỒ CHÍ MINH"},{"num":2,"title":"CƠ SỞ, QUÁ TRÌNH HÌNH THÀNH VÀ PHÁT TRIỂN TƯ TƯỞNG HỒ CHÍ MINH"},{"num":3,"title":"TƯ TƯỞNG HỒ CHÍ MINH VỀ ĐỘC LẬP DÂN TỘC VÀ CHỦ NGHĨA XÃ HỘI"},{"num":4,"title":"TƯ TƯỞNG HỒ CHÍ MINH VỀ ĐẢNG CỘNG SẢN VIỆT NAM VÀ NHÀ NƯỚC CỦA NHÂN DÂN, DO NHÂN DÂN, VÌ NHÂN DÂN"},{"num":5,"title":"TƯ TƯỞNG HỒ CHÍ MINH VỀ ĐẠI ĐOÀN KẾT TOÀN DÂN TỘC VÀ ĐOÀN KẾT QUỐC TẾ"},{"num":6,"title":"TƯ TƯỞNG HỒ CHÍ MINH VỀ VĂN HÓA, ĐẠO ĐỨC, CON NGƯỜI"}];
  const RAW_BANK = [[1,1,"Đối tượng nghiên cứu của môn học Tư tưởng Hồ Chí Minh là gì?",["Cuộc đời, sự nghiệp Hồ Chí Minh","Tiểu sử Hồ Chí Minh","Lịch sử tư tưởng Hồ Chí Minh","Hệ thống các quan điểm lý luận của Hồ Chí Minh"],3,"Theo Giáo trình Tư tưởng Hồ Chí Minh, đối tượng nghiên cứu của môn học là toàn bộ hệ thống các quan điểm lý luận toàn diện và sâu sắc của Hồ Chí Minh về những vấn đề cơ bản của cách mạng Việt Nam, cùng quá trình hệ thống quan điểm ấy vận động trong thực tiễn. Tiểu sử, cuộc đời, sự nghiệp hay lịch sử tư tưởng chỉ là bối cảnh và chất liệu hỗ trợ chứ không phải đối tượng nghiên cứu trọng tâm của môn học.","Nếu đề hỏi về 'phương pháp nghiên cứu' hay 'cơ sở hình thành', cần phân biệt rõ với đối tượng nghiên cứu; còn nếu đề ghép cả hai vế thì đáp án đầy đủ gồm 'hệ thống các quan điểm của Hồ Chí Minh' và 'quá trình hiện thực hóa các quan điểm đó trong thực tiễn cách mạng Việt Nam'."],[2,1,"Một trong những nhiệm vụ nghiên cứu của môn tư tưởng Hồ Chí Minh là gì?",["Hình thức quá độ lên CNXH ở Việt Nam","Các thành tố cơ bản của hệ thống chính trị ở nước ta","Cơ cấu giai cấp ở nước ta","Các giai đoạn hình thành và phát triển tư tưởng Hồ Chí Minh"],3,"Nhiệm vụ nghiên cứu của môn học Tư tưởng Hồ Chí Minh tập trung làm rõ cơ sở hình thành, các giai đoạn hình thành và phát triển tư tưởng Hồ Chí Minh, hệ thống quan điểm cơ bản và giá trị vận dụng của tư tưởng đó. Các nội dung như hình thức quá độ lên chủ nghĩa xã hội, thành tố hệ thống chính trị hay cơ cấu giai cấp ở nước ta thuộc phạm vi nghiên cứu chính của các môn Chủ nghĩa xã hội khoa học và Chính trị học.","Nếu đề đổi sang hỏi 'ý nghĩa học tập môn học đối với sinh viên', hãy chọn các nội dung liên quan đến nâng cao năng lực tư duy lý luận, bồi dưỡng đạo đức cách mạng và rèn luyện phương pháp, phong cách công tác."],[3,1,"Trong “Định nghĩa Tư tưởng Hồ Chí Minh của Đại hội Đảng lần IX (4-2001), Đảng ta bước đầu làm rõ bao nhiêu vấn đề về Tư tưởng Hồ Chí Minh?",["Một","Hai","Ba","Bốn"],3,"Trong định nghĩa tại Đại hội đại biểu toàn quốc lần thứ IX (4-2001), Đảng ta đã bước đầu làm rõ bốn vấn đề lớn về Tư tưởng Hồ Chí Minh: bản chất cách mạng và khoa học; nguồn gốc tư tưởng lý luận; những nội dung cơ bản cốt lõi; và giá trị, ý nghĩa định hướng đối với cách mạng Việt Nam. Các phương án một, hai hay ba vấn đề đều chưa bao quát đủ cấu trúc định nghĩa này.","Nếu đề chuyển sang hỏi khái niệm Tư tưởng Hồ Chí Minh tại Đại hội XI (2011) nêu rõ mấy nội dung cơ bản (cô đọng lại, lược phần liệt kê chi tiết các tư tưởng thành phần), hãy chú ý ba trụ cột chính: bản chất khoa học - cách mạng, cơ sở hình thành và ý nghĩa của Tư tưởng Hồ Chí Minh."],[4,1,"Một trong những nguyên tắc phương pháp luận trong nghiên cứu môn học tư tưởng Hồ Chí Minh là gì?",["Kết hợp gia đình, nhà trường và xã hội","Thống nhất giữa tập trung và dân chủ","Thống nhất giữa nói và làm","Thống nhất tính Đảng và tính khoa học"],3,"Thống nhất tính Đảng và tính khoa học là nguyên tắc phương pháp luận hàng đầu khi nghiên cứu Tư tưởng Hồ Chí Minh, đòi hỏi vừa đứng vững trên lập trường giai cấp công nhân, chủ nghĩa Mác - Lênin vừa bảo đảm khách quan, trung thực, không cường điệu hay xuyên tạc. Các phương án khác thuộc phạm trù khác: thống nhất tập trung và dân chủ là nguyên tắc tổ chức Đảng; thống nhất nói và làm là nguyên tắc rèn luyện đạo đức; kết hợp gia đình, nhà trường và xã hội là phương pháp giáo dục.","Nếu đề hỏi các nguyên tắc phương pháp luận khác của môn học, cần nhớ đủ 5 nguyên tắc cơ bản: thống nhất tính Đảng và tính khoa học; thống nhất lý luận và thực tiễn; quan điểm lịch sử - cụ thể; quan điểm toàn diện và hệ thống; quan điểm kế thừa và phát triển."],[5,1,"Đảng ta chính thức bắt đầu kêu gọi “...Toàn Đảng hãy ra sức học tập đường lối chính trị, tác phong và đạo đức cách mạng của Hồ Chủ tịch; sự học tập ấy là điều kiện tiên quyết làm cho Đảng mạnh và làm cho cách mạng đi mau đến thắng lợi hoàn toàn” từ Đại hội nào?",["Đại hội đại biểu toàn quốc lần thứ IV (12-1976)","Đại hội đại biểu toàn quốc lần thứ VI (12-1986)","Đại hội đại biểu toàn quốc lần thứ III (9-1960)","Đại hội đại biểu toàn quốc lần thứ II (2-1951)"],3,"Chính tại Đại hội đại biểu toàn quốc lần thứ II (tháng 2-1951), khi Đảng ra hoạt động công khai với tên gọi Đảng Lao động Việt Nam, Đảng ta lần đầu tiên chính thức kêu gọi toàn Đảng ra sức học tập đường lối chính trị, tác phong và đạo đức cách mạng của Hồ Chủ tịch. Các Đại hội lần thứ III (1960), IV (1976) hay VI (1986) đều diễn ra muộn hơn mốc khởi đầu này.","Nếu đề hỏi Đại hội nào nhấn mạnh 'phải nắm vững bản chất cách mạng và khoa học của chủ nghĩa Mác - Lênin, kế thừa di sản quý báu về tư tưởng và lý luận cách mạng của Chủ tịch Hồ Chí Minh', thì đó là Đại hội VI (12-1986); còn khẳng định làm 'nền tảng tư tưởng, kim chỉ nam cho hành động' là Đại hội VII (6-1991)."],[6,1,"Đại hội đại biểu toàn quốc lần thứ mấy, Đảng ta khẳng định: “Đảng lấy chủ nghĩa Mác-Lênin và tư tưởng Hồ Chí Minh làm nền tảng tư tưởng, kim chỉ nam cho hành động”?",["Đại hội đại biểu toàn quốc lần thứ VIII (7-1996)","Đại hội đại biểu toàn quốc lần thứ IX (4-2001)","Đại hội đại biểu toàn quốc lần thứ X (4-2006)","Đại hội đại biểu toàn quốc lần thứ VII (6-1991)"],3,"Đại hội đại biểu toàn quốc lần thứ VII (tháng 6-1991) đánh dấu bước ngoặt nhận thức quan trọng khi lần đầu tiên ghi vào Cương lĩnh và Điều lệ Đảng khẳng định: Đảng lấy chủ nghĩa Mác - Lênin và tư tưởng Hồ Chí Minh làm nền tảng tư tưởng, kim chỉ nam cho hành động. Đại hội VIII, IX, X diễn ra sau đó chỉ tiếp tục kế thừa và cụ thể hóa luận điểm này.","Cần phân biệt ba mốc Đại hội rất hay ra thi: Đại hội VII (1991) chính thức xác lập vị trí nền tảng tư tưởng; Đại hội IX (2001) lần đầu đưa ra định nghĩa đầy đủ về Tư tưởng Hồ Chí Minh; Đại hội XI (2011) hoàn thiện khái niệm cô đọng, chuẩn xác như hiện nay."],[7,1,"Đại hội đại biểu toàn quốc lần thứ mấy có nêu khái niệm Tư tưởng Hồ Chí Minh: “Tư tưởng Hồ Chí Minh là một hệ thống quan điểm toàn diện và sâu sắc về những vấn đề cơ bản của cách mạng Việt Nam, kết quả của sự vận dụng và phát triển sáng tạo chủ nghĩa Mác-Lênin vào điều kiện cụ thể của nước ta, kế thừa và phát triển các giá trị truyền thống tốt đẹp của dân tộc, tiếp thu tinh hoa văn hoá nhân loại: là tài sản tinh thần vô cùng to lớn và quý giá của Đảng và dân tộc ta, mãi mãi soi đường cho sự nghiệp cách mạng của nhân dân ta giành thắng lợi”?",["Đại hội đại biểu toàn quốc lần thứ VIII (7-1996)","Đại hội đại biểu toàn quốc lần thứ IX (4-2001)","Đại hội đại biểu toàn quốc lần thứ X (4-2006)","Đại hội đại biểu toàn quốc lần thứ XI (1-2011)"],3,"Đoạn trích nguyên văn nêu khái niệm Tư tưởng Hồ Chí Minh một cách cô đọng, chuẩn xác và kết thúc bằng vế 'là tài sản tinh thần vô cùng to lớn và quý giá của Đảng và dân tộc ta, mãi mãi soi đường cho sự nghiệp cách mạng của nhân dân ta giành thắng lợi' được thông qua tại Đại hội đại biểu toàn quốc lần thứ XI (tháng 1-2011). So với Đại hội IX (2001), khái niệm tại Đại hội XI đã lược bỏ đoạn liệt kê dài các nội dung cụ thể để tăng tính khái quát và bổ sung cụm từ 'vô cùng to lớn và quý giá'.","Mẹo nhận diện nhanh: thấy có đoạn liệt kê 'tư tưởng về giải phóng dân tộc, giải phóng giai cấp, giải phóng con người...' thì chọn Đại hội IX (4-2001); còn thấy ngắn gọn và có cụm 'tài sản tinh thần vô cùng to lớn và quý giá của Đảng và dân tộc ta' thì chọn Đại hội XI (1-2011)."],[8,1,"Chấp hành Trung ương Đảng đã tôn vinh Hồ Chí Minh là “Anh hùng dân tộc vĩ đại”, thể hiện trong văn bản nào?",["Văn kiện Đại hội đại biểu toàn quốc lần thứ VI (12-1986)","Bài diễn văn của Tổng Bí thư Nông Đức Mạnh trong lễ kỷ niệm 119 năm ngày sinh Chủ tịch Hồ Chí Minh và Ngày truyền thống bộ đội Trường Sơn (5-2009)","Nghị Quyết của Quốc hội nước Cộng hòa xã hội chủ nghĩa Việt Nam về tổ chức kỷ niệm lần 100 ngày sinh của Chủ tịch Hồ Chí Minh (6-1989)","Điếu văn của Ban chấp hành Trung ương Đảng (9-1969)"],3,"Ngay sau khi Chủ tịch Hồ Chí Minh qua đời, trong Điếu văn của Ban Chấp hành Trung ương Đảng tại Lễ truy điệu tháng 9-1969, Đảng ta đã trang trọng tôn vinh Người là 'Anh hùng dân tộc vĩ đại'. Các văn kiện Đại hội VI (1986), Nghị quyết Quốc hội (1989) hay diễn văn năm 2009 đều ra đời về sau.","Nếu đề hỏi tổ chức quốc tế nào và vào năm nào đã vinh danh Hồ Chí Minh là 'Anh hùng giải phóng dân tộc và Nhà văn hóa kiệt xuất của Việt Nam', đáp án sẽ là Tổ chức Giáo dục, Khoa học và Văn hóa Liên Hợp Quốc (UNESCO) tại khóa họp lần thứ 24 năm 1987."],[9,1,"Theo Lênin “Một người xứng đáng là nhà tư tưởng khi nào biết giải quyết trước người khác tất cả những vấn đề .......... các vấn đề về tổ chức, về những yếu tố vật chất của phong trào không phải một cách tự phát”. Chọn phương án đúng nhất để điền vào chỗ trống.",["chính trị - xã hội","kinh tế, chính trị, xã hội","chiến lược - sách lược","chính trị - sách lược"],3,"Theo đúng trích dẫn của V.I. Lênin được trình bày trong phần mở đầu Giáo trình Tư tưởng Hồ Chí Minh, một người xứng đáng là nhà tư tưởng khi biết giải quyết trước người khác tất cả những vấn đề 'chính trị - sách lược', các vấn đề về tổ chức và những yếu tố vật chất của phong trào một cách tự giác, không tự phát. Các cụm từ 'chính trị - xã hội', 'kinh tế, chính trị, xã hội' hay 'chiến lược - sách lược' tuy gần nghĩa nhưng không đúng nguyên văn luận điểm của Lênin.","Đây là câu hỏi điền khuyết theo nguyên văn giáo trình; khi gặp dạng câu trích dẫn Lênin về tiêu chuẩn 'nhà tư tưởng', hãy ghi nhớ chính xác cặp từ 'chính trị - sách lược' đi liền với 'vấn đề về tổ chức' và 'không phải một cách tự phát'."],[10,1,"Khái niệm tư tưởng Hồ Chí Minh được Đảng ta chính thức sử dụng từ năm nào?",["Từ năm 1945","Từ năm 1969","Từ năm 1986","Từ năm 1991"],3,"Khái niệm 'Tư tưởng Hồ Chí Minh' được Đảng ta chính thức sử dụng trong văn kiện từ năm 1991, gắn với Đại hội đại biểu toàn quốc lần thứ VII (tháng 6-1991) khi khẳng định chủ nghĩa Mác - Lênin và tư tưởng Hồ Chí Minh là nền tảng tư tưởng của Đảng. Trước đó, các mốc 1945, 1969 hay 1986 mới dùng các cách diễn đạt như đường lối, đạo đức, tác phong hay di sản tư tưởng của Chủ tịch Hồ Chí Minh.","Nếu đề hỏi mốc thời gian Đảng ta bắt đầu kêu gọi học tập đường lối chính trị, tác phong và đạo đức của Hồ Chủ tịch thì chọn năm 1951 (Đại hội II); còn hỏi năm chính thức đưa ra định nghĩa đầy đủ về khái niệm này thì chọn năm 2001 (Đại hội IX)."],[11,1,"Khái niệm tư tưởng Hồ Chí Minh được nêu lên đầy đủ, hoàn chỉnh kể từ Đại hội nào của Đảng?",["Đại hội đại biểu toàn quốc lần thứ X (4-2006)","Đại hội đại biểu toàn quốc lần thứ VI (12-1986)","Đại hội đại biểu toàn quốc lần thứ VIII (7-1996)","Đại hội đại biểu toàn quốc lần thứ IX (4-2001)"],3,"Đại hội đại biểu toàn quốc lần thứ IX (tháng 4-2001) là Đại hội đầu tiên của Đảng nêu lên khái niệm Tư tưởng Hồ Chí Minh một cách đầy đủ, hoàn chỉnh trong Văn kiện, chỉ rõ bản chất, nguồn gốc, nội dung cốt lõi và giá trị lịch sử. Đại hội VI và VIII mới khẳng định vị trí, vai trò học tập và vận dụng chứ chưa đưa ra định nghĩa hoàn chỉnh, còn Đại hội X kế thừa lại khái niệm của Đại hội IX.","Nếu đề hỏi Đại hội nào tiếp tục bổ sung, hoàn thiện khái niệm Tư tưởng Hồ Chí Minh với hình thức cô đọng nhất và bổ sung nhận định 'tài sản tinh thần vô cùng to lớn và quý giá', khi đó đáp án là Đại hội XI (1-2011)."],[12,1,"Nội dung nào dưới đây đúng với định nghĩa tư tưởng Hồ Chí Minh?",["Tư tưởng Hồ Chí Minh là những quy luật chung nhất về tự nhiên, xã hội và tư duy","Tư tưởng Hồ Chí Minh là hệ thống lý luận về đấu tranh giai cấp","Tư tưởng Hồ Chí Minh là học thuyết về giải phóng các dân tộc thuộc địa","Tư tưởng Hồ Chí Minh là một hệ thống quan điểm toàn diện và sâu sắc về những vấn đề cơ bản của cách mạng Việt Nam"],3,"Theo định nghĩa của Đảng, Tư tưởng Hồ Chí Minh là 'một hệ thống quan điểm toàn diện và sâu sắc về những vấn đề cơ bản của cách mạng Việt Nam'. Các phương án khác đều sai hoặc phiến diện: 'những quy luật chung nhất về tự nhiên, xã hội và tư duy' là đối tượng của phép biện chứng duy vật; còn chỉ nói về đấu tranh giai cấp hay giải phóng thuộc địa đã thu hẹp phạm vi toàn diện của tư tưởng Hồ Chí Minh.","Nếu đề hỏi 'cốt lõi của Tư tưởng Hồ Chí Minh là gì', đừng nhầm với định nghĩa tổng quát mà hãy chọn 'độc lập dân tộc gắn liền với chủ nghĩa xã hội'."],[13,1,"Chọn câu trả lời đúng nhất với tư tưởng Hồ Chí Minh?",["Tư tưởng Hồ Chí Minh là kết quả của sự vận dụng sáng tạo chủ nghĩa Mác - Lênin vào điều kiện thực tế của nước ta","Tư tưởng Hồ Chí Minh là sự áp dụng chủ nghĩa Mác - Lênin vào điều kiện nước ta","Tư tưởng Hồ Chí Minh là sự học hỏi sáng tạo chủ nghĩa Mác - Lênin và truyền bá vào nước ta những năm đầu thế kỷ XX","Tư tưởng Hồ Chí Minh là kết quả của sự vận dụng và phát triển sáng tạo chủ nghĩa Mác - Lênin vào điều kiện cụ thể của nước ta"],3,"Theo định nghĩa chuẩn của Đảng, Tư tưởng Hồ Chí Minh là 'kết quả của sự vận dụng và phát triển sáng tạo chủ nghĩa Mác - Lênin vào điều kiện cụ thể của nước ta'. Các phương án khác đều chưa chuẩn xác vì hoặc thiếu vế 'và phát triển sáng tạo', hoặc dùng từ 'áp dụng' mang tính rập khuôn, hoặc chỉ thu hẹp thành việc 'học hỏi và truyền bá' đầu thế kỷ XX.","Mẹo làm bài câu hỏi về mối quan hệ giữa Tư tưởng Hồ Chí Minh và chủ nghĩa Mác - Lênin: luôn kiểm tra đủ hai yếu tố 'vận dụng' và 'phát triển sáng tạo' gắn với 'điều kiện cụ thể của nước ta' (không chọn các từ mang nghĩa máy móc như 'áp dụng nguyên xi' hay 'sao chép')."],[14,1,"Đâu không là ý nghĩa học tập môn học Tư tưởng Hồ Chí Minh đối với sinh viên?",["Nâng cao năng lực tư duy lý luận và phương pháp công tác","Bồi dưỡng phẩm chất đạo đức cách mạng và rèn luyện bản lĩnh chính trị","Nâng cao lòng tự hào dân tộc, tự hào về Bác kính yêu","Bồi dưỡng tình yêu thiên nhiên, ý thức bảo vệ môi trường"],3,"Giáo trình Tư tưởng Hồ Chí Minh xác định ý nghĩa học tập đối với sinh viên gồm: nâng cao năng lực tư duy lý luận và phương pháp công tác; bồi dưỡng phẩm chất đạo đức cách mạng, rèn luyện bản lĩnh chính trị; nâng cao lòng tự hào dân tộc, tự hào về Bác kính yêu. 'Bồi dưỡng tình yêu thiên nhiên, ý thức bảo vệ môi trường' tuy tốt đẹp nhưng không phải ý nghĩa học tập đặc thù được nêu trong chương trình môn học này.","Đọc kỹ từ phủ định 'không là' trong câu hỏi để tránh chọn nhầm các ý đúng. Nếu đề bỏ chữ 'không' và hỏi một trong những ý nghĩa trực tiếp, hãy chọn các ý gắn với tư duy lý luận, bản lĩnh chính trị, đạo đức cách mạng và phong cách công tác."],[15,2,"Hồ Chí Minh đã từng dạy học ở ngôi trường nào?",["Trường tiểu học Pháp - Việt ở Vinh","Trường tiểu học Đông Ba ở Huế","Trường Quốc học Huế","Trường Dục Thanh ở Phan Thiết"],3,"Trên hành trình vào Nam trước khi ra đi tìm đường cứu nước, từ tháng 9-1910 đến tháng 2-1911, thầy giáo Nguyễn Tất Thành đã dừng chân dạy học tại Trường Dục Thanh ở Phan Thiết (tỉnh Bình Thuận). Còn Trường tiểu học Pháp - Việt ở Vinh, Trường tiểu học Đông Ba và Trường Quốc học Huế đều là những ngôi trường Người từng theo học thời niên thiếu.","Nếu đề đổi câu hỏi thành 'Hồ Chí Minh đã từng theo học ở những ngôi trường nào tại Huế?', hãy nhớ Trường tiểu học Pháp - Việt Đông Ba và Trường Quốc học Huế; còn trường do các sĩ phu yêu nước sáng lập nơi Người dạy học thì chắc chắn là Trường Dục Thanh."],[16,2,"Hồ Chí Minh ra đi tìm đường cứu nước vào năm nào?",["Năm 1890","Năm 1905","Năm 1908","Năm 1911"],3,"Ngày 5-6-1911, từ bến cảng Nhà Rồng (Sài Gòn), người thanh niên yêu nước Nguyễn Tất Thành với tên gọi Văn Ba đã lên tàu ra đi tìm đường cứu nước. Các mốc còn lại gắn với sự kiện khác: năm 1890 là năm sinh của Người; năm 1905 Người tiếp xúc khẩu hiệu Tự do - Bình đẳng - Bác ái; năm 1908 Người tham gia phong trào chống thuế ở Huế.","Nếu đề hỏi 'Hồ Chí Minh ra đi tìm đường cứu nước khi bao nhiêu tuổi?' thì tính từ 1890 đến 1911 là 21 tuổi; còn hỏi 'Người bôn ba ở nước ngoài bao nhiêu năm?' thì từ 1911 đến 1941 là 30 năm."],[17,2,"Nguyễn Tất Thành đã tham gia phong trào nào vào tháng 9/1908?",["Phong trào Đông Du","Phong trào Duy Tân","Phong trào cắt tóc ngắn","Cuộc biểu tình chống thuế của nông dân tỉnh Thừa Thiên Huế"],3,"Năm 1908, khi đang theo học tại Trường Quốc học Huế, Nguyễn Tất Thành đã trực tiếp tham gia cuộc biểu tình chống sưu thuế của nông dân tỉnh Thừa Thiên Huế với vai trò người phiên dịch, truyền đạt yêu sách của đồng bào. Phong trào Đông Du do Phan Bội Châu khởi xướng, còn Duy Tân và cắt tóc ngắn do Phan Châu Trinh chủ trương nhưng không phải sự kiện cụ thể Người trực tiếp tham gia tại Huế năm 1908.","Nếu đề hỏi hậu quả của việc Nguyễn Tất Thành tham gia biểu tình chống thuế năm 1908, hãy nhớ sự kiện Người bị thực dân Pháp và Nam triều theo dõi, buộc phải rời Trường Quốc học Huế, mở đầu chặng đường đi vào miền Nam (Bình Định, Phan Thiết, Sài Gòn)."],[18,2,"Nguyễn Tất Thành lấy tên là Nguyễn Ái Quốc vào thời gian nào?",["Khi sang Liên Xô làm việc ở Ban Phương Đông của Quốc tế Cộng sản tháng 6/1923","Khi lên tàu Amiral Latouche-Tréville từ bến Nhà Rồng năm 1911","Khi tham gia sáng lập Đảng Cộng sản Pháp tại Đại hội Tours tháng 12/1920","Tại Hội nghị Versailles (Pháp) ngày 18/6/1919"],3,"Tên gọi Nguyễn Ái Quốc chính thức xuất hiện lần đầu vào ngày 18-6-1919 khi Người thay mặt Hội những người Việt Nam yêu nước tại Pháp gửi Bản Yêu sách của nhân dân An Nam gồm 8 điểm tới Hội nghị Versailles (Pháp). Trước đó năm 1911 khi lên tàu Người lấy tên Văn Ba, còn Đại hội Tours (12-1920) và sang Liên Xô (6-1923) diễn ra sau khi tên gọi Nguyễn Ái Quốc đã vang danh.","Nếu đề hỏi 'Bản Yêu sách của nhân dân An Nam gồm mấy điểm?' thì chọn 8 điểm; nếu hỏi 'tên gọi Hồ Chí Minh xuất hiện từ khi nào?' thì chọn tháng 8-1942 khi Người sang Trung Quốc công tác."],[19,2,"Những ý kiến, quan điểm của Hồ Chí Minh được đưa ra trong các Hội nghị Quốc tế Nông dân, Quốc tế Thanh niên vào năm nào?",["1925","1920","1919","1923"],3,"Tháng 6-1923, Nguyễn Ái Quốc rời Pháp sang Liên Xô để công tác tại Quốc tế Cộng sản; ngay trong năm 1923, Người tích cực tham dự và đóng góp nhiều ý kiến quan trọng về vấn đề thuộc địa, nông dân và thanh niên tại Hội nghị Quốc tế Nông dân (tháng 10-1923, được bầu vào Ban Chấp hành) và các hoạt động của Quốc tế Thanh niên. Các mốc 1919, 1920 Người còn ở Pháp, còn năm 1925 Người đang hoạt động tại Quảng Châu (Trung Quốc).","Nếu đề hỏi Nguyễn Ái Quốc tham dự và đọc tham luận nổi tiếng tại Đại hội lần thứ V của Quốc tế Cộng sản vào năm nào, hãy chọn năm 1924 (cũng trong thời gian Người hoạt động tại Liên Xô giai đoạn 1923-1924)."],[20,2,"Hồ Chí Minh tiếp xúc với lý tưởng tự do, bình đẳng, bác ái vào thời gian nào?",["Năm 1895","Năm 1908","Năm 1910","Năm 1905"],3,"Theo lời kể của chính Chủ tịch Hồ Chí Minh và tài liệu Giáo trình, vào khoảng năm 1905 (khi học tại trường tiểu học Pháp - Việt ở Vinh), Người lần đầu tiên nghe đến khẩu hiệu 'Tự do, Bình đẳng, Bác ái' của nước Pháp và sớm nuôi ý định đi sang phương Tây để xem đằng sau những chữ ấy thực chất ẩn giấu điều gì. Năm 1895 Người mới 5 tuổi theo cha vào Huế lần đầu, còn năm 1908 và 1910 là các giai đoạn sau đó ở Huế và Phan Thiết.","Nếu đề hỏi thái độ của Hồ Chí Minh khi sang Pháp trực tiếp chứng kiến khẩu hiệu 'Tự do, Bình đẳng, Bác ái', hãy nhớ Người nhận ra tính giả dối của chủ nghĩa thực dân: ở chính quốc nói tự do, bình đẳng nhưng ở thuộc địa lại áp bức, bóc lột tàn bạo."],[21,2,"Các phong trào yêu nước đấu tranh chống thực dân Pháp của nhân dân Việt Nam cuối thế kỷ XIX đầu thế kỷ XX diễn ra theo mấy khuynh hướng?",["Một","Hai","Bốn","Ba"],3,"Cuối thế kỷ XIX đầu thế kỷ XX, phong trào yêu nước chống thực dân Pháp của nhân dân Việt Nam diễn ra sôi nổi theo ba khuynh hướng chính: khuynh hướng phong kiến (Cần Vương, khởi nghĩa nông dân Yên Thế), khuynh hướng dân chủ tư sản (Phan Bội Châu, Phan Châu Trinh, Đông Kinh Nghĩa Thục) và sự chuyển biến sang khuynh hướng cách mạng vô sản từ đầu thế kỷ XX. Các con số một, hai hay bốn đều không phản ánh đầy đủ bức tranh toàn giai đoạn này.","Lưu ý rất kỹ câu chữ đề bài: nếu đề chỉ hỏi các phong trào yêu nước 'cuối thế kỷ XIX - đầu thế kỷ XX bị thất bại, lâm vào khủng hoảng về đường lối trước năm 1920', thường chỉ tính hai khuynh hướng cũ là phong kiến và dân chủ tư sản."],[22,2,"Nguyễn Tất Thành bắt đầu làm việc trên tàu Amiran Latuso Torêvin (Amiral Latouche Trévill) đang cập bến Nhà Rồng Sài Gòn để lấy hàng và đón khách đi Mác-xây (Marseille) vào thời gian nào?",["1-6-1911","5-6-1911","4-6-1911","3-6-1911"],3,"Ngày 3-6-1911, Nguyễn Tất Thành (với tên gọi Văn Ba) chính thức được nhận vào làm phụ bếp trên tàu buôn Amiral Latouche-Tréville đang cập bến Nhà Rồng (Sài Gòn) để chuẩn bị lấy hàng và đón khách đi Marseille. Hai ngày sau, tức ngày 5-6-1911, con tàu mới nhổ neo rời cảng, chính thức bắt đầu hành trình ra đi tìm đường cứu nước của Người.","Cực kỳ dễ nhầm giữa hai mốc sát nhau: hỏi 'bắt đầu làm việc trên tàu' thì chọn 3-6-1911; còn hỏi 'tàu rời bến Nhà Rồng / chính thức ra đi tìm đường cứu nước' thì chọn 5-6-1911."],[23,2,"Nguyễn Ái Quốc viết \"Bản án chế độ thực dân Pháp\" được xuất bản vào thời gian nào?",["Năm 1920","Năm 1927","Năm 1930","Năm 1925"],3,"Tác phẩm nổi tiếng 'Bản án chế độ thực dân Pháp' do Nguyễn Ái Quốc viết bằng tiếng Pháp được xuất bản lần đầu tiên tại Pari vào năm 1925, vạch trần tội ác dã man của chủ nghĩa thực dân và thức tỉnh tinh thần đấu tranh của các dân tộc thuộc địa. Năm 1920 gắn với Đại hội Tours, năm 1927 gắn với tác phẩm 'Đường Kách mệnh', còn năm 1930 gắn với Cương lĩnh chính trị đầu tiên của Đảng.","Ghi nhớ bộ ba tác phẩm - mốc thời gian kinh điển trong giai đoạn 1920-1930: 'Bản án chế độ thực dân Pháp' (1925), 'Đường Kách mệnh' (1927) và 'Chánh cương vắn tắt, Sách lược vắn tắt' (đầu năm 1930)."],[24,2,"Tại Quảng Châu (Trung Quốc), Nguyễn Ái Quốc đã mở nhiều lớp huấn luyện đào tạo cán bộ cho cách mạng Việt Nam, vào thời gian nào?",["1927-1929","1924-1926","1923-1924","1925-1927"],3,"Giai đoạn 1925-1927, tại Quảng Châu (Trung Quốc), Nguyễn Ái Quốc đã sáng lập Hội Việt Nam Cách mạng Thanh niên (tháng 6-1925) và trực tiếp mở nhiều lớp huấn luyện chính trị nhằm đào tạo đội ngũ cán bộ nòng cốt cho cách mạng Việt Nam; các bài giảng sau đó được tập hợp in thành sách 'Đường Kách mệnh' năm 1927. Giai đoạn 1923-1924 Người ở Liên Xô, còn từ giữa năm 1927 Người rời Quảng Châu sang Liên Xô rồi về Thái Lan (1928-1929).","Nếu đề hỏi 'cơ quan ngôn luận của Hội Việt Nam Cách mạng Thanh niên do Nguyễn Ái Quốc sáng lập tại Quảng Châu là tờ báo nào?', đáp án là báo Thanh Niên (số đầu ra ngày 21-6-1925)."],[25,2,"Yếu tố nào không thuộc nguồn gốc tư tưởng, lý luận hình thành tư tưởng Hồ Chí Minh?",["Những giá trị truyền thống dân tộc","Tinh hoa văn hoá nhân loại","Chủ nghĩa Mác-Lênin","Triết học cổ điển Đức"],3,"Giáo trình Tư tưởng Hồ Chí Minh xác định có 3 nguồn gốc tư tưởng, lý luận trực tiếp hình thành tư tưởng Hồ Chí Minh: các giá trị truyền thống tốt đẹp của dân tộc Việt Nam, tinh hoa văn hóa nhân loại và chủ nghĩa Mác - Lênin. 'Triết học cổ điển Đức' không nằm trong 3 nguồn gốc trực tiếp này mà là một trong ba tiền đề lý luận hình thành nên chủ nghĩa Mác (cùng kinh tế chính trị học cổ điển Anh và chủ nghĩa xã hội không tưởng Pháp).","Nếu đề hỏi 'nguồn gốc lý luận nào giữ vai trò quyết định bản chất cách mạng và khoa học của Tư tưởng Hồ Chí Minh?', hãy chọn 'Chủ nghĩa Mác - Lênin'; còn hỏi nguồn gốc có trước, làm điểm xuất phát cho hành trình cứu nước thì chọn 'Giá trị truyền thống tốt đẹp của dân tộc'."],[26,2,"Một trong những truyền thống tốt đẹp của tư tưởng văn hoá Việt Nam được Hồ Chí Minh tiếp thu là gì?",["Những mặt tích cực của Nho giáo","Tư tưởng vị tha của Phật giáo","Lòng nhân ái, đức hy sinh của Hồi giáo","Chủ nghĩa yêu nước Việt Nam"],3,"Chủ nghĩa yêu nước Việt Nam là giá trị đứng đầu, xuyên suốt trong truyền thống tư tưởng - văn hóa dân tộc Việt Nam và là động lực trực tiếp thôi thúc Hồ Chí Minh ra đi tìm đường cứu nước. Các mặt tích cực của Nho giáo, tư tưởng vị tha của Phật giáo thuộc nhóm tinh hoa văn hóa nhân loại (văn hóa phương Đông), còn Hồi giáo không được xác định là nguồn tiếp thu chính của Người.","Nếu đề hỏi 'một trong những tinh hoa văn hóa phương Đông được Hồ Chí Minh tiếp thu', khi đó mới chọn những mặt tích cực của Nho giáo, Phật giáo, Lão giáo và Chủ nghĩa Tam dân của Tôn Trung Sơn."],[27,2,"Một trong những nguồn gốc của tư tưởng Hồ Chí Minh là tiếp thu vấn đề gì?",["Lòng nhân ái, đức hy sinh của Hồi giáo","Các giá trị văn hoá tiến bộ của thời kỳ Phục hưng","Toàn bộ tư tưởng của các nhà khai sáng","Giá trị truyền thống dân tộc"],3,"Giá trị truyền thống tốt đẹp của dân tộc Việt Nam (như yêu nước, đoàn kết, nhân nghĩa, cần cù, lạc quan) là một trong ba cơ sở lý luận quan trọng nhất hình thành Tư tưởng Hồ Chí Minh. Các phương án còn lại sai hoặc không chuẩn: Hồ Chí Minh chỉ tiếp thu có chọn lọc chứ không tiếp thu 'toàn bộ' tư tưởng các nhà khai sáng; Hồi giáo không thuộc nguồn gốc trực tiếp; văn hóa Phục hưng chỉ là một lát cắt hẹp chứ không đại diện chuẩn xác bằng khái niệm nguồn gốc truyền thống dân tộc.","Khi gặp phương án có các từ tuyệt đối hóa như 'toàn bộ', 'tất cả', 'nguyên vẹn' về việc Hồ Chí Minh tiếp thu văn hóa nước ngoài hay Nho giáo, Phật giáo, hãy loại ngay vì nguyên tắc của Người luôn là tiếp thu có chọn lọc và phê phán."],[28,2,"Công nhân Việt Nam lúc mới ra đời chịu mấy tầng áp bức bóc lột?",["Một","Bốn","Hai","Ba"],3,"Ngay từ khi mới ra đời trong cuộc khai thác thuộc địa của thực dân Pháp, giai cấp công nhân Việt Nam đã phải chịu cùng lúc ba tầng áp bức bóc lột nặng nề: thực dân (đế quốc), phong kiến và tư sản bản xứ. Chính điều kiện đó làm cho giai cấp công nhân Việt Nam sớm có tinh thần cách mạng triệt để và gắn bó máu thịt với giai cấp nông dân.","Nếu đề hỏi 'giai cấp công nhân Việt Nam ra đời trước hay sau giai cấp tư sản Việt Nam?', đáp án là ra đời TRƯỚC giai cấp tư sản dân tộc Việt Nam (từ cuộc khai thác thuộc địa lần thứ nhất 1897-1914)."],[29,2,"Trong giai đoạn 1923 - 1924, Nguyễn Ái Quốc sống và hoạt động chủ yếu ở đâu?",["Pháp","Trung Quốc","Thái Lan","Liên Xô"],3,"Từ tháng 6-1923 đến cuối năm 1924, Nguyễn Ái Quốc rời Pháp sang Liên Xô để trực tiếp nghiên cứu quê hương Cách mạng Tháng Mười, làm việc tại Quốc tế Cộng sản và tham dự Đại hội V Quốc tế Cộng sản (6-1924). Trước năm 1923 Người hoạt động chủ yếu ở Pháp; cuối năm 1924 đến 1927 ở Quảng Châu (Trung Quốc); còn giai đoạn 1928-1929 Người hoạt động tại Thái Lan (Xiêm).","Nắm nhanh bản đồ địa bàn hoạt động của Bác thập niên 1920: 1917-1923 ở Pháp; 1923-1924 ở Liên Xô; 1924-1927 ở Trung Quốc (Quảng Châu); 1928-1929 ở Thái Lan; đầu năm 1930 ở Hương Cảng (Hồng Kông) chủ trì hợp nhất Đảng."],[30,2,"Mốc thời gian nào đánh dấu Nguyễn Ái Quốc trở về Tổ quốc sau 30 năm hoạt động ở nước ngoài?",["22-12-1941","19-5-1941","23-9-1940","28-1-1941"],3,"Ngày 28-1-1941, sau 30 năm bôn ba hoạt động ở nước ngoài (1911-1941), lãnh tụ Nguyễn Ái Quốc đã vượt qua cột mốc 108 biên giới Việt - Trung trở về Tổ quốc tại Pác Bó (Cao Bằng) để trực tiếp lãnh đạo cách mạng Việt Nam. Các mốc khác không đúng: 19-5-1941 là ngày thành lập Mặt trận Việt Minh; 23-9-1940 gắn với tình hình Nhật vào Đông Dương; còn Đội Việt Nam Tuyên truyền Giải phóng quân thành lập ngày 22-12-1944 (không phải 1941).","Nếu đề hỏi 'Hội nghị Trung ương 8 do Nguyễn Ái Quốc chủ trì tại Pác Bó họp vào thời gian nào?', chọn tháng 5-1941; còn hỏi 'ngày thành lập Mặt trận Việt Minh' thì chọn 19-5-1941."],[31,2,"Giai đoạn Hình thành tư tưởng yêu nước và có chí hướng tìm tòi con đường cứu nước mới của Hồ Chí Minh được tính từ thời gian nào?",["Đầu năm 1930 đến đầu năm 1941","Giữa năm 1911 đến cuối năm 1920","Cuối năm 1920 đến đầu năm 1930","Trước ngày 5-6-1911"],3,"Theo Giáo trình Tư tưởng Hồ Chí Minh, quá trình hình thành và phát triển tư tưởng Hồ Chí Minh chia làm 5 thời kỳ, trong đó thời kỳ đầu tiên 'Hình thành tư tưởng yêu nước và có chí hướng tìm tòi con đường cứu nước mới' được tính từ năm 1890 đến trước ngày 5-6-1911. Các mốc từ giữa 1911 trở về sau thuộc các thời kỳ tìm đường, hình thành cơ bản và vượt qua thử thách.","Học thuộc khung 5 thời kỳ để làm trọn dạng câu này: (1) Trước 5-6-1911: hình thành tư tưởng yêu nước, chí hướng cứu nước; (2) Giữa 1911 - cuối 1920: tìm thấy con đường cứu nước; (3) Cuối 1920 - đầu 1930: hình thành nội dung cơ bản về cách mạng Việt Nam; (4) Đầu 1930 - đầu 1941: vượt qua thử thách, giữ vững đường lối; (5) Đầu 1941 - 9/1969: tiếp tục phát triển, hoàn thiện, soi đường giành thắng lợi."],[32,2,"Giai đoạn Hình thành những nội dung cơ bản tư tưởng về cách mạng Việt Nam, được tính từ thời gian nào?",["Trước ngày 5-6-1911","Giữa năm 1911 đến cuối năm 1920","Đầu năm 1930 đến đầu năm 1941","Cuối năm 1920 đến đầu năm 1930"],3,"Thời kỳ từ cuối năm 1920 đến đầu năm 1930 là giai đoạn 'Hình thành những nội dung cơ bản tư tưởng về cách mạng Việt Nam', mở đầu từ khi Người trở thành người cộng sản tại Đại hội Tours (12-1920) và kết tinh rực rỡ trong Cương lĩnh chính trị đầu tiên của Đảng (đầu năm 1930). Trước 5-6-1911 là thời kỳ hình thành chí hướng; giữa 1911 đến cuối 1920 là thời kỳ tìm thấy con đường cứu nước; đầu 1930 đến đầu 1941 là thời kỳ vượt qua thử thách.","Nếu đề hỏi 'giai đoạn nào đánh dấu bước ngoặt chuyển từ chủ nghĩa yêu nước sang chủ nghĩa cộng sản, tìm thấy con đường cứu nước?', hãy chọn thời kỳ từ giữa năm 1911 đến cuối năm 1920."],[33,2,"Chủ trương dân tộc độc lập, dân quyền tự do, dân sinh hạnh phúc là của ai?",["M.Găng đi","Hồ Chí Minh","Nguyễn Trãi","Tôn Trung Sơn"],3,"Chủ trương 'dân tộc độc lập, dân quyền tự do, dân sinh hạnh phúc' chính là cốt lõi của Học thuyết Tam dân do nhà cách mạng dân chủ tư sản Trung Quốc Tôn Trung Sơn (Tôn Dật Tiên) đề xướng. Hồ Chí Minh đã tìm thấy ở chủ nghĩa Tam dân những chính sách phù hợp với điều kiện nước ta và vận dụng sáng tạo thành tiêu ngữ 'Độc lập - Tự do - Hạnh phúc', nhưng người khởi xướng chủ trương gốc là Tôn Trung Sơn chứ không phải M. Găng-đi hay Nguyễn Trãi.","Nếu đề hỏi 'Hồ Chí Minh đánh giá ưu điểm lớn nhất của chủ nghĩa Tôn Dật Tiên (Tôn Trung Sơn) là gì?', đáp án chuẩn là 'chính sách của nó thích hợp với điều kiện nước ta'."],[34,2,"Lãnh đạo phong trào yêu nước theo khuynh hướng dân chủ tư sản là ai?",["Nguyễn Thiện Thuật","Tôn Đức Thắng","Tôn Thất Thuyết","Lương Văn Can, Nguyễn Quyền"],3,"Lương Văn Can và Nguyễn Quyền là những sĩ phu yêu nước tiêu biểu sáng lập và lãnh đạo phong trào Đông Kinh Nghĩa Thục (1907), thuộc khuynh hướng dân chủ tư sản ở Việt Nam đầu thế kỷ XX. Ngược lại, Tôn Thất Thuyết và Nguyễn Thiện Thuật thuộc phong trào Cần Vương theo khuynh hướng phong kiến, còn Tôn Đức Thắng là nhà cách mạng tiền bối gắn với phong trào công nhân theo khuynh hướng vô sản.","Nếu đề hỏi các đại biểu khác của khuynh hướng dân chủ tư sản, hãy nhớ Phan Bội Châu (bạo động, Đông Du, Việt Nam Quang phục hội), Phan Châu Trinh (cải cách, Duy Tân) và Nguyễn Thái Học (Việt Nam Quốc dân Đảng)."],[35,2,"Các giá trị về quyền sống, quyền tự do, quyền mưu cầu hạnh phúc được Hồ Chí Minh tiếp thu từ đâu?",["Phật giáo và Nho giáo","Các tác phẩm của các nhà khai sáng","Tuyên ngôn nhân quyền của Pháp 1789","Tuyên ngôn độc lập của Mỹ năm 1776"],3,"Những giá trị bất hủ về 'quyền sống, quyền tự do và quyền mưu cầu hạnh phúc' được Hồ Chí Minh tiếp thu từ bản Tuyên ngôn Độc lập năm 1776 của nước Mỹ và được Người trang trọng trích dẫn ngay đầu bản Tuyên ngôn Độc lập Việt Nam ngày 2-9-1945. Tuyên ngôn Nhân quyền và Dân quyền của Cách mạng Pháp (1789/1791) nhấn mạnh 'tự do và bình đẳng về quyền lợi', còn các nhà khai sáng hay Phật giáo, Nho giáo không nêu nguyên văn bộ ba quyền này.","Nếu đề đổi sang hỏi câu 'Người ta sinh ra tự do và bình đẳng về quyền lợi; và phải luôn luôn được tự do và bình đẳng về quyền lợi' được trích từ văn kiện nào, hãy chọn Tuyên ngôn Nhân quyền và Dân quyền của Cách mạng Pháp."],[36,2,"Hồ Chí Minh tham gia sáng lập Đảng Cộng sản Pháp vào thời gian nào?",["Năm 1918","Năm 1919","Năm 1921","Năm 1920"],3,"Tháng 12 năm 1920, tại Đại hội lần thứ XVIII của Đảng Xã hội Pháp họp ở thành phố Tours, Nguyễn Ái Quốc đã bỏ phiếu tán thành gia nhập Quốc tế Cộng sản (Quốc tế III) và tham gia sáng lập Đảng Cộng sản Pháp, trở thành người cộng sản Việt Nam đầu tiên. Các mốc 1918, 1919 diễn ra trước khi Người đọc Luận cương của Lênin, còn năm 1921 Người tham gia sáng lập Hội Liên hiệp thuộc địa.","Nếu đề hỏi mốc thời gian cụ thể hơn (tháng/năm) của hai sự kiện lớn trong năm 1920: đọc Sơ thảo Luận cương của Lênin là tháng 7-1920; còn dự Đại hội Tours sáng lập Đảng Cộng sản Pháp là tháng 12-1920."],[37,2,"Giai đoạn Vượt qua thử thách, giữ vững đường lối, phương pháp cách mạng Việt Nam đúng đắn, sáng tạo là thời gian nào?",["Từ cuối năm 1920 đến đầu năm 1930","Từ đầu năm 1941 đến tháng 9-1969","Từ giữa năm 1911 đến cuối năm 1920","Từ đầu năm 1930 đến đầu năm 1941"],3,"Thời kỳ từ đầu năm 1930 đến đầu năm 1941 là giai đoạn 'Vượt qua thử thách, giữ vững đường lối, phương pháp cách mạng Việt Nam đúng đắn, sáng tạo'. Trong 11 năm này, tư tưởng của Người từng chịu sự phê phán thiếu khách quan từ khuynh hướng 'tả' khuynh của Quốc tế Cộng sản và Hội nghị Trung ương tháng 10-1930, nhưng Người vẫn kiên định lập trường đặt giải phóng dân tộc lên hàng đầu cho đến khi đường lối đó được khẳng định hoàn toàn năm 1941.","Nếu đề hỏi thời kỳ 'từ đầu năm 1941 đến tháng 9-1969' mang tên gọi gì, hãy chọn 'Tư tưởng Hồ Chí Minh tiếp tục phát triển, hoàn thiện, soi đường cho sự nghiệp cách mạng của Đảng và nhân dân ta'."],[38,2,"Theo Hồ Chí Minh, ưu điểm lớn nhất của học thuyết Khổng Tử là gì?",["Tinh thần hiếu học","Coi trọng người quân tử","Quản lý xã hội bằng đạo đức","Sự tu dưỡng đạo đức cá nhân"],3,"Chính Hồ Chí Minh từng đúc kết ngắn gọn rằng: 'Học thuyết Khổng Tử có ưu điểm là sự tu dưỡng đạo đức cá nhân'. Các phương án như tinh thần hiếu học, coi trọng người quân tử hay quản lý xã hội bằng đạo đức tuy có liên quan đến Nho giáo nhưng không phải nhận định trực tiếp của Người về ưu điểm lớn nhất của học thuyết Khổng Tử.","Hãy nhớ trọn bộ bốn nhận định kinh điển của Hồ Chí Minh để tránh nhầm khi đề đổi đối tượng: Khổng Tử -> sự tu dưỡng đạo đức cá nhân; Tôn giáo Giêsu -> lòng nhân ái cao cả; Chủ nghĩa Mác -> phương pháp làm việc biện chứng; Chủ nghĩa Tôn Dật Tiên -> chính sách thích hợp với điều kiện nước ta."],[39,2,"Trong hành trình bôn ba đi tìm chân lý, sự kiện nào đánh dấu Nguyễn Ái Quốc tìm được con đường cứu nước?",["Đọc Tuyên ngôn của Đảng cộng sản của C.Mác","Tham gia Đảng xã hội Pháp","Đọc Biện chứng tự nhiên của Ph.Ăngghen","Đọc bản Sơ thảo lần thứ nhất những luận cương về vấn đề dân tộc và thuộc địa của Lênin"],3,"Tháng 7-1920, khi đọc bản 'Sơ thảo lần thứ nhất những luận cương về vấn đề dân tộc và vấn đề thuộc địa' của V.I. Lênin đăng trên báo Nhân Đạo (L'Humanité), Nguyễn Ái Quốc đã vỡ òa tìm thấy con đường cứu nước, giải phóng dân tộc đúng đắn - con đường cách mạng vô sản. Việc tham gia Đảng Xã hội Pháp (đầu 1919) chỉ là bước đệm tìm hiểu, còn Tuyên ngôn Đảng Cộng sản hay Biện chứng tự nhiên không phải văn kiện đánh dấu bước ngoặt tìm thấy đường cứu nước tháng 7-1920.","Nếu đề hỏi 'tờ báo nào đã đăng bản Sơ thảo lần thứ nhất những luận cương về vấn đề dân tộc và thuộc địa của Lênin mà Nguyễn Ái Quốc đọc được?', đáp án là báo Nhân Đạo (L'Humanité) của Đảng Xã hội Pháp."],[40,2,"Hồ Chí Minh đã không kế thừa tư tưởng nào của Nho giáo?",["Đề cao văn hóa lễ giáo, hiếu học","Triết lý nhân sinh, tu thân dưỡng tính","Lý tưởng về một xã hội bình trị","Quan điểm phân biệt đẳng cấp"],3,"Hồ Chí Minh tiếp thu Nho giáo một cách có chọn lọc và phê phán: Người kiên quyết loại bỏ yếu tố tiêu cực, lạc hậu như quan điểm phân biệt đẳng cấp, tư tưởng trọng nam khinh nữ, khinh lao động chân tay và bảo vệ trật tự phong kiến bất bình đẳng. Ngược lại, Người kế thừa các mặt tích cực gồm đề cao văn hóa lễ giáo - hiếu học, triết lý nhân sinh tu thân dưỡng tính và lý tưởng về một xã hội bình trị, đại đồng.","Nếu đề bỏ từ phủ định 'không' và hỏi 'Hồ Chí Minh đã cải tạo khái niệm nào của Nho giáo để mang nội dung cách mạng mới?', hãy nhớ các cặp phạm trù đạo đức như Trung (trung với nước thay vì trung với vua), Hiếu (hiếu với dân thay vì chỉ hiếu với cha mẹ), Cần - Kiệm - Liêm - Chính."],[41,2,"Hồ Chí Minh kế thừa quan điểm, tư tưởng nào của Phật giáo?",["Tư tưởng tiến bộ về tự do, độc lập, bình đẳng về quyền lợi","Lòng nhân ái cao cả, nhân văn sâu sắc","Tư tưởng về cuộc sống vĩnh hằng bên kia thế giới, quy luật nhân quả","Tư tưởng vị tha, từ bi bác ái, cứu khổ cứu nạn, lối sống đạo đức"],3,"Hồ Chí Minh tiếp thu có chọn lọc tinh hoa Phật giáo ở tư tưởng vị tha, từ bi bác ái, cứu khổ cứu nạn và lối sống đạo đức, trong sạch, giản dị. Người không tiếp thu yếu tố duy tâm như thế giới bên kia, còn lòng nhân ái cao cả thuộc về Thiên Chúa giáo và tư tưởng tự do, bình đẳng về quyền lợi thuộc tinh hoa văn hóa phương Tây.","Nếu đề hỏi Hồ Chí Minh kế thừa điều gì của Thiên Chúa giáo thì chọn lòng nhân ái cao cả; nếu hỏi văn hóa phương Tây thì chọn tư tưởng tự do, bình đẳng, bác ái và quyền con người; nếu hỏi Nho giáo thì chọn triết lý hành động, tu thân dưỡng tính và ước vọng xã hội đại đồng."],[42,2,"Nguyên nhân trực tiếp dẫn đến thất bại của các phong trào yêu nước theo khuynh hướng dân chủ tư sản là gì?",["Chưa xác định được kẻ thù chính của dân tộc","Chưa đủ tiềm lực vật chất và lực lượng","Tinh thần yêu nước chưa chín muồi","Chưa có đường lối và phương pháp cách mạng đúng đắn"],3,"Các phong trào yêu nước theo khuynh hướng dân chủ tư sản đầu thế kỷ XX (như Phan Bội Châu, Phan Châu Trinh, Việt Nam Quốc dân đảng) đều thất bại trực tiếp vì chưa có đường lối và phương pháp cách mạng đúng đắn, thiếu một giai cấp tiên tiến lãnh đạo. Tinh thần yêu nước của nhân dân đã rất cao và kẻ thù thực dân cũng đã lộ rõ, nên các lý do đó không phải nguyên nhân trực tiếp.","Nếu đề hỏi vì sao các phong trào cứu nước cuối thế kỷ XIX theo hệ tư tưởng phong kiến (Cần Vương) thất bại thì nguyên nhân sâu xa là hệ tư tưởng phong kiến đã lỗi thời, bất lực trước yêu cầu lịch sử; từ đó dẫn tới cuộc khủng hoảng về đường lối cứu nước đầu thế kỷ XX."],[43,2,"Nguyễn Tất Thành nói: \"Tôi muốn đi ra ngoài xem nước Pháp và các nước khác làm như thế nào, tôi sẽ trở về giúp đồng bào chúng ta\". Câu nói đó vào thời gian nào?",["6-1909","7-1910","6-1912","6-1911"],3,"Đầu tháng 6-1911 tại Sài Gòn, trước khi lên tàu rời Bến Nhà Rồng ngày 5-6-1911, Nguyễn Tất Thành đã nói câu này với người bạn thân là anh Lê (Lê Văn Đạt) để bày tỏ hoài bão ra đi tìm đường cứu nước. Các mốc 6-1909, 7-1910 (khi Người chuẩn bị vào Nam và dạy học ở Dục Thanh) hay 6-1912 đều sai thời điểm Người xuất dương.","Nếu đề hỏi ngày Nguyễn Tất Thành chính thức ra đi tìm đường cứu nước trên con tàu Amiral Latouche-Tréville thì chọn 5-6-1911; nếu hỏi mốc mở đầu giai đoạn tìm thấy con đường cứu nước (1911–1920) thì cũng bắt đầu từ năm 1911."],[44,2,"Nguyễn Ái Quốc đọc “Sơ thảo lần thứ nhất Luận cương về vấn đề dân tộc và vấn đề thuộc địa” của V.I.Lênin vào thời gian nào?",["7-1917","7-1918","7-1922","7-1920"],3,"Tháng 7-1920, tại Paris, Nguyễn Ái Quốc đọc được 'Sơ thảo lần thứ nhất những luận cương về vấn đề dân tộc và vấn đề thuộc địa' của V.I.Lênin đăng trên báo Nhân đạo (L'Humanité), qua đó tìm thấy con đường giải phóng dân tộc đúng đắn là cách mạng vô sản. Các mốc 1917, 1918 là trước khi Luận cương ra đời, còn 1922 là sau khi Người đã gia nhập Đảng Cộng sản Pháp.","Nếu đề hỏi thời điểm Nguyễn Ái Quốc bỏ phiếu tán thành Quốc tế Cộng sản và tham gia sáng lập Đảng Cộng sản Pháp tại Đại hội Tours thì chọn tháng 12-1920; nếu hỏi thời điểm gửi Bản yêu sách của nhân dân An Nam tới Hội nghị Véc-xây thì chọn tháng 6-1919."],[45,2,"Trong khoảng thời gian từ năm 1920 đến năm 1945, Hồ Chí Minh bị địch bắt vào tù mấy lần?",["1 lần","3 lần","4 lần","2 lần"],3,"Trong giai đoạn 1920–1945, Hồ Chí Minh bị địch bắt giam đúng 2 lần: lần thứ nhất từ tháng 6-1931 đến đầu năm 1933 do thực dân Anh bắt giữ tại Hồng Kông; lần thứ hai từ tháng 8-1942 đến tháng 9-1943 do chính quyền Tưởng Giới Thạch bắt giam tại Quảng Tây (Trung Quốc), nơi Người sáng tác tập thơ 'Nhật ký trong tù'.","Nếu đề hỏi tác phẩm ra đời trong lần bị bắt giam thứ hai (1942–1943) ở Quảng Tây thì chọn 'Nhật ký trong tù'; nếu hỏi tên luật sư người Anh đã bào chữa giúp Người thoát khỏi vụ án Hồng Kông (1931–1933) thì chọn luật sư Francis Henry Loseby."],[46,2,"Câu nói: “Dân tộc ta, nhân dân ta, non sông đất nước ta đã sinh ra Hồ Chủ Tịch, người anh hùng dân tộc vĩ đại, và chính Người đã làm rạng rỡ dân tộc ta, nhân dân ta và non sông đất nước ta”, được trích trong bài viết nào?",["Lời kêu gọi của Ban Chấp hành Trung ương Đảng lao động Việt Nam ngày 3-9-1969","Bản Thông cáo đặc biệt ngày 4-9-1969","Diễn văn khai mạc kỷ niệm 100 năm ngày sinh Chủ Tịch Hồ Chí Minh","Điếu văn của Ban Chấp hành Trung ương Đảng lao động Việt Nam"],3,"Câu tôn vinh bất hủ này được trích từ Điếu văn của Ban Chấp hành Trung ương Đảng Lao động Việt Nam do Bí thư thứ nhất Lê Duẩn đọc tại lễ truy điệu Chủ tịch Hồ Chí Minh ngày 9-9-1969 ở Quảng trường Ba Đình. Các văn kiện như Lời kêu gọi ngày 3-9-1969, Thông cáo đặc biệt ngày 4-9-1969 hay Diễn văn kỷ niệm 100 năm ngày sinh Người không phải xuất xứ của trích dẫn này.","Nếu đề hỏi văn kiện nào của UNESCO tôn vinh Hồ Chí Minh là 'Anh hùng giải phóng dân tộc và Nhà văn hóa kiệt xuất của Việt Nam' thì chọn Nghị quyết số 24C/18.6.5 năm 1987 nhân dịp chuẩn bị kỷ niệm 100 năm ngày sinh của Người (1990)."],[47,2,"\"Luận cương của Lênin làm cho tôi rất cảm động, phấn khởi, sáng tỏ, tin tưởng biết bao. Tôi vui mừng đến phát khóc lên. Ngồi một mình trong buồng mà tôi nói to lên như đang nói trước quần chúng đông đảo: Hỡi đồng bào bị đoạ đày đau khổ! Đây là cái cần thiết cho chúng ta, đây là con đường giải phóng của chúng ta\". Nguyễn Ái Quốc nói câu ấy khi đang ở đâu?",["Luân Đôn (Anh)","Matxcơva (Liên xô)","Quảng Châu (Trung Quốc)","Paris (Pháp)"],3,"Nguyễn Ái Quốc đọc Luận cương của V.I.Lênin và thốt lên những lời xúc động ấy vào tháng 7-1920 khi đang sống và hoạt động cách mạng tại Paris (Pháp). Luân Đôn là nơi Người từng làm việc giai đoạn 1913–1917, Matxcơva là nơi Người sang năm 1923, còn Quảng Châu là địa bàn hoạt động từ cuối năm 1924.","Nếu đề hỏi câu nói này được Hồ Chí Minh kể lại trong bài viết nào thì chọn bài 'Con đường dẫn tôi đến chủ nghĩa Lênin' (tháng 4-1960); nếu hỏi tờ báo đăng Luận cương mà Người đã đọc thì chọn báo Nhân đạo (L'Humanité)."],[48,2,"Nguyễn Ái Quốc đã trích dẫn luận điểm nổi tiếng của V.I.Lênin “Không có lý luận cách mệnh thì không có cách mệnh vận động... chỉ có theo lý luận cách mệnh tiền phong, Đảng cách mệnh mới làm nổi trách nhiệm cách mệnh tiền phong”. Câu này được ghi ở trang đầu tiên của cuốn sách nào?",["Nhật ký trong tù (1942-1943)","Bản án chế độ thực dân Pháp (1925)","V.I.Lênin và các dân tộc thuộc địa (1925)","Đường cách mệnh (1927)"],3,"Nguyễn Ái Quốc đã trích nguyên văn luận điểm nổi tiếng trong tác phẩm 'Làm gì?' của V.I.Lênin đặt ngay trang đầu cuốn 'Đường cách mệnh' (xuất bản năm 1927) nhằm nhấn mạnh vai trò tiên quyết của lý luận cách mạng đối với phong trào và Đảng tiền phong. 'Bản án chế độ thực dân Pháp' tập trung tố cáo tội ác thực dân, còn 'Nhật ký trong tù' là tập thơ viết năm 1942–1943.","Nếu đề hỏi cuốn 'Đường cách mệnh' tập hợp bài giảng của Nguyễn Ái Quốc tại các lớp huấn luyện ở đâu thì chọn Quảng Châu (Trung Quốc) giai đoạn 1925–1927; nếu hỏi tác phẩm mở đầu có chương 'Tư cách một người cách mệnh' thì cũng chính là 'Đường cách mệnh'."],[49,2,"Mâu thuẫn tồn tại trong xã hội thuộc địa, nửa phong kiến ở nước ta cuối thế kỷ IX, đầu thế kỷ XX, mẫu thuẫn nào là chủ yếu nhất?",["Giai cấp nông dân mâu thuẫn với giai cấp địa chủ phong kiến","Giai cấp công nhân mâu thuẫn với giai cấp tư sản","Giai cấp công nhân và nông dân mâu thuẫn với giai cấp tư sản","Toàn thể nhân dân ta mâu thuẫn với đế quốc quốc Pháp"],3,"Trong xã hội Việt Nam thuộc địa, nửa phong kiến cuối thế kỷ XIX – đầu thế kỷ XX tồn tại hai mâu thuẫn cơ bản là mâu thuẫn dân tộc và mâu thuẫn giai cấp, trong đó mâu thuẫn chủ yếu và gay gắt nhất là mâu thuẫn giữa toàn thể nhân dân ta với đế quốc Pháp xâm lược và tay sai. Mâu thuẫn nông dân – địa chủ hay công nhân – tư sản đều chịu sự chi phối của mâu thuẫn dân tộc này.","Nếu đề hỏi hai mâu thuẫn cơ bản của xã hội Việt Nam thời thuộc địa là gì thì chọn cả mâu thuẫn giữa toàn thể dân tộc Việt Nam với đế quốc Pháp và mâu thuẫn giữa nông dân với địa chủ phong kiến; từ đó nhiệm vụ hàng đầu là giải phóng dân tộc."],[50,2,"Đảng ta quyết định lấy tư tưởng Hồ Chí Minh làm nền tảng tư tưởng và kim chỉ nam cho hành động của Đảng vào năm nào?",["Năm 1986","Năm 1976","Năm 1953","Năm 1991"],3,"Tại Đại hội đại biểu toàn quốc lần thứ VII (tháng 6-1991), Đảng Cộng sản Việt Nam lần đầu tiên chính thức khẳng định: 'Đảng lấy chủ nghĩa Mác – Lênin và tư tưởng Hồ Chí Minh làm nền tảng tư tưởng, kim chỉ nam cho hành động'. Các mốc 1953, 1976 và 1986 đều diễn ra trước sự kiện lịch sử này.","Nếu đề hỏi năm Đảng khởi xướng công cuộc Đổi mới (Đại hội VI) thì chọn năm 1986; nếu hỏi năm đổi tên Đảng thành Đảng Cộng sản Việt Nam (Đại hội IV) thì chọn năm 1976; nếu hỏi Đại hội nào hoàn thiện đầy đủ khái niệm tư tưởng Hồ Chí Minh thì chọn Đại hội XI (năm 2011)."],[51,2,"Đề tài nghiên cứu của Nguyễn Ái Quốc ở lớp nghiên cứu sinh do Viện nghiên cứu các vấn đề dân tộc và thuộc địa mở vào năm 1937 là đề tài gì?",["Vấn đề thanh niên ở thuộc địa","Vấn đề dân tộc thuộc địa","Vấn đề cách mạng giải phóng dân tộc ở thuộc địa","Cách mạng ruộng đất ở Đông Nam Á"],3,"Năm 1937, trong thời gian học lớp nghiên cứu sinh tại Viện Nghiên cứu các vấn đề dân tộc và thuộc địa (Matxcơva, Liên Xô), Nguyễn Ái Quốc đã chọn đề tài nghiên cứu là 'Cách mạng ruộng đất ở Đông Nam Á' nhằm làm sáng tỏ vấn đề nông dân và ruộng đất gắn với giải phóng dân tộc ở khu vực. Các tên đề tài còn lại là phương án nhiễu gần nghĩa.","Nếu đề hỏi khoảng thời gian Nguyễn Ái Quốc học tập, nghiên cứu tại Liên Xô trong giai đoạn vượt qua thử thách, giữ vững đường lối (1930–1941) thì đó là thời kỳ 1934–1938 trước khi Người trở về Trung Quốc rồi về nước năm 1941."],[52,2,"Lý do chính của việc Nguyễn Ái Quốc đến Pháp?",["Để học nghề","Để tìm hiểu văn minh Pháp","Để vận động nhân dân Pháp ủng hộ cách mạng Việt Nam","Vì nguồn gốc mọi đau khổ của nhân dân Việt Nam là ở tại “chính quốc”"],3,"Lý do chính khiến Nguyễn Ái Quốc quyết định sang phương Tây và đến thẳng nước Pháp là nhận thức sâu sắc rằng nguồn gốc mọi đau khổ của nhân dân Việt Nam nằm ngay tại 'chính quốc'. Người muốn tận mắt xem đằng sau khẩu hiệu 'Tự do – Bình đẳng – Bác ái' nước Pháp làm thế nào để tìm cách đánh đuổi thực dân, chứ không đơn thuần đi học nghề hay du lịch tìm hiểu văn minh.","Nếu đề hỏi điểm khác biệt cơ bản trong hướng đi tìm đường cứu nước của Nguyễn Tất Thành so với các bậc tiền bối như Phan Bội Châu (sang Nhật Bản – phương Đông) là gì thì chọn việc Người hướng sang phương Tây, đi thẳng vào 'chính quốc' Pháp để tìm bản chất chủ nghĩa thực dân."],[53,2,"Những yếu tố góp phần hình thành nhân cách và văn hóa Hồ Chí Minh là gì?",["Kế thừa truyền thống dân tộc","Vận dụng và phát triển chủ nghĩa Mác – Lênin","Các thành tựu hiện đại của văn minh phương Tây","Truyền thống văn hóa dân tộc, tinh hoa văn hóa nhân loại"],3,"Nhân cách và văn hóa Hồ Chí Minh là sự kết tinh hài hòa giữa truyền thống văn hóa tốt đẹp của dân tộc Việt Nam với tinh hoa văn hóa nhân loại (cả phương Đông lẫn phương Tây). Các phương án chỉ nhắc riêng truyền thống dân tộc, riêng văn minh phương Tây hoặc chỉ nêu chủ nghĩa Mác – Lênin đều phiến diện, chưa bao quát đầy đủ nền tảng văn hóa của Người.","Nếu đề hỏi nhân tố nào giữ vai trò quyết định bản chất cách mạng và khoa học của tư tưởng Hồ Chí Minh (không phải riêng nhân cách văn hóa) thì chọn chủ nghĩa Mác – Lênin; còn nếu hỏi cội nguồn sâu xa nhất thì chọn giá trị truyền thống tốt đẹp của dân tộc."],[54,2,"Tư tưởng nào của cụ Nguyễn Sinh Sắc có ảnh hưởng quyết định đến tư tưởng xây dựng một nhà nước của dân, do dân, vì dân của Hồ Chí Minh?",["Thương yêu người nghèo","Lòng yêu nước","Lòng căm thù bọn xâm lược","Tư tưởng “thân dân”"],3,"Cụ Phó bảng Nguyễn Sinh Sắc – thân phụ của Hồ Chí Minh – nổi tiếng với tư tưởng 'thân dân', coi việc gần gũi, lấy dân làm hậu thuẫn là gốc, khinh ghét chốn quan trường thối nát; chính tư tưởng 'thân dân' này ảnh hưởng trực tiếp và sâu sắc đến quan niệm xây dựng nhà nước của dân, do dân, vì dân của Hồ Chí Minh. Lòng yêu nước hay thương người nghèo là phẩm chất chung rộng hơn.","Nếu đề hỏi cụ Nguyễn Sinh Sắc thường dạy các con câu gì về thái độ với chốn quan trường thì nhớ câu 'Quan trường là nô lệ trong những người nô lệ, lại càng nô lệ hơn'; còn truyền thống quê hương Nghệ Tĩnh góp phần hun đúc ý chí kiên cường, hiếu học cho Người."],[55,2,"Bước nhận thức mới về quyền tự do, dân chủ của nhân dân trong tư tưởng Hồ Chí Minh thể hiện qua hoạt động nào của Người?",["Tiếp thu Tuyên ngôn nhân quyền của Mỹ","Tham gia Phong trào chống đi phu, chống sưu thuế ở Trung kỳ","Viết Bản án chế độ thực dân Pháp và tuyên truyền đến các nước thuộc địa","Gởi Yêu sách của nhân dân An Nam tới Hội nghị Véc-xây"],3,"Ngày 18-6-1919, thay mặt Hội những người An Nam yêu nước tại Pháp, Nguyễn Ái Quốc gửi 'Bản yêu sách của nhân dân An Nam' (gồm 8 điểm) tới Hội nghị Véc-xây đòi các quyền tự do, dân chủ, bình đẳng về pháp lý cho người Việt Nam. Đây đánh dấu bước nhận thức mới về quyền tự do, dân chủ của nhân dân trên diễn đàn quốc tế, sớm hơn việc viết 'Bản án chế độ thực dân Pháp' (1925) và cao hơn phong trào chống thuế tự phát năm 1908.","Nếu đề hỏi tên gọi Nguyễn Ái Quốc lần đầu tiên xuất hiện gắn liền với sự kiện nào thì cũng chính là việc gửi Bản yêu sách của nhân dân An Nam tới Hội nghị Véc-xây (18-6-1919); còn bài học rút ra từ sự kiện này là muốn được giải phóng, các dân tộc chỉ có thể trông cậy vào lực lượng của chính mình."],[56,2,"Trong những tiền đề lý luận, tiền đề nào quyết định bản chất cách mạng và khoa học của tư tưởng Hồ Chí Minh?",["Giá trị truyền thống tốt đẹp của dân tộc","Tinh hoa văn hoá nhân loại","Tư tưởng Tam dân của Tôn Trung Sơn","Chủ nghĩa Mác-Lênin"],3,"Trong ba nguồn gốc lý luận (giá trị truyền thống dân tộc, tinh hoa văn hóa nhân loại và chủ nghĩa Mác – Lênin), chủ nghĩa Mác – Lênin là tiền đề lý luận giữ vai trò quyết định bản chất cách mạng và khoa học của tư tưởng Hồ Chí Minh, vì nó trang bị thế giới quan duy vật biện chứng, phương pháp luận khoa học và chỉ rõ con đường cách mạng vô sản.","Nếu đề hỏi tiền đề nào là điểm xuất phát, là cội nguồn nuôi dưỡng tư tưởng Hồ Chí Minh thì chọn giá trị truyền thống tốt đẹp của dân tộc (đứng đầu là chủ nghĩa yêu nước); nếu hỏi tiền đề giúp làm phong phú tầm nhìn nhân văn toàn cầu thì chọn tinh hoa văn hóa nhân loại."],[57,2,"Theo Hồ Chí Minh, ưu điểm lớn nhất của chủ nghĩa Mác là gì?",["Bản chất khoa học","Bản chất cách mạng","Chủ nghĩa nhân đạo triệt để","Phương pháp làm việc biện chứng"],3,"Khi nhận xét về các học thuyết lớn của nhân loại, Hồ Chí Minh chỉ rõ ưu điểm lớn nhất của chủ nghĩa Mác là 'phương pháp làm việc biện chứng'. Các đặc trưng như bản chất khoa học, bản chất cách mạng hay chủ nghĩa nhân đạo triệt để tuy đúng với chủ nghĩa Mác nói chung nhưng không phải câu nhận định trực tiếp của Người về ưu điểm lớn nhất này.","Nếu đề đổi sang hỏi ưu điểm lớn nhất của các học thuyết khác theo Hồ Chí Minh thì nhớ bộ tứ: học thuyết Khổng Tử là 'sự tu dưỡng đạo đức cá nhân'; tôn giáo Giêsu là 'lòng nhân ái cao cả'; chủ nghĩa Mác là 'phương pháp làm việc biện chứng'; chủ nghĩa Tôn Dật Tiên là 'chính sách thích hợp với điều kiện nước ta'."],[58,3,"Câu nói: “Các vua Hùng đã có công dựng nước, bác cháu ta phải cùng nhau giữ lấy nước”. Hồ Chí Minh nói ở đâu?",["Việt Bắc","Tân Trào","Hà Nội","Đền Hùng"],3,"Ngày 19-9-1954, trên đường từ chiến khu Việt Bắc về tiếp quản Thủ đô Hà Nội, Chủ tịch Hồ Chí Minh đã ghé thăm Đền Hùng (Phú Thọ) và căn dặn cán bộ, chiến sĩ Đại đoàn Quân Tiên Phong tại Đền Giếng câu nói nổi tiếng: 'Các vua Hùng đã có công dựng nước, bác cháu ta phải cùng nhau giữ lấy nước'. Việt Bắc, Tân Trào hay Hà Nội đều không phải địa điểm Người nói câu này.","Nếu đề hỏi thời gian Hồ Chí Minh nói câu này thì chọn ngày 19-9-1954 (ngay sau chiến thắng Điện Biên Phủ và Hiệp định Giơ-ne-vơ); nếu hỏi câu này thể hiện truyền thống gì của dân tộc Việt Nam thì chọn tinh thần yêu nước gắn liền với ý thức dựng nước đi đôi với giữ nước."],[59,3,"Hồ Chí Minh viết “Lời kêu gọi toàn quốc kháng chiến” vào thời gian nào?",["Ngày 19-12-1944","Ngày 19-12-1945","Ngày 19-12-1955","Ngày 19-12-1946"],3,"Tối ngày 19-12-1946, trước dã tâm xâm lược trở lại của thực dâ
