g tác lý luận","Công tác giáo dục giác ngộ quần chúng","Công tác cán bộ"],3,"Hồ Chí Minh khẳng định \"cán bộ là cái gốc của mọi công việc\", \"muôn việc thành công hoặc thất bại đều do cán bộ tốt hoặc kém\", do đó công tác cán bộ được Người xác định là công tác \"gốc\" của Đảng. Công tác tư tưởng, lý luận hay giác ngộ quần chúng đều rất quan trọng nhưng cuối cùng đều phải do đội ngũ cán bộ trực tiếp tổ chức thực hiện.","Nếu đề hỏi trong tiêu chuẩn cán bộ (đức và tài), Hồ Chí Minh coi yếu tố nào là \"gốc\" thì chọn đạo đức cách mạng (\"có tài mà không có đức là người vô dụng, có đức mà không có tài thì làm việc gì cũng khó\", nhưng đạo đức vẫn là gốc của người cách mạng)."],[147,4,"Theo tư tưởng Hồ Chí Minh, Đảng phải thường xuyên tự đổi mới, tự chỉnh đốn về mặt nào?",["Về số lượng, trình độ đảng viên","Về tổ chức cơ sở Đảng","Về hình thức, nội dung sinh hoạt Đảng","Về chính trị, tư tưởng và tổ chức"],3,"Để giữ vững vai trò lãnh đạo trong điều kiện cầm quyền và trước biến chuyển của thực tiễn, Hồ Chí Minh yêu cầu Đảng phải thường xuyên tự đổi mới, tự chỉnh đốn toàn diện trên ba mặt cơ bản là chính trị, tư tưởng và tổ chức (gắn liền với đạo đức). Các phương án khác chỉ đề cập từng khía cạnh cục bộ như số lượng đảng viên hay hình thức sinh hoạt.","Nếu đề hỏi trong Di chúc, Hồ Chí Minh căn dặn \"việc cần phải làm trước tiên\" sau khi kháng chiến thắng lợi là gì thì chọn chỉnh đốn lại Đảng."],[148,4,"Theo tư tưởng Hồ Chí Minh, một trong những yếu tố dẫn đến sự ra đời của Đảng Cộng sản Việt Nam là phong trào yêu nước. Phong trào yêu nước đó là phong trào nào?",["Phong trào của giai cấp công nhân","Phong trào của giai cấp nông dân","Phong trào của tầng lớp trí thức","Phong trào của giai cấp công nhân, nông dân, tầng lớp trí thức"],3,"Ở Việt Nam thuộc địa nửa phong kiến, phong trào yêu nước mang tính toàn dân rộng lớn, hội tụ sức mạnh đấu tranh của giai cấp công nhân, giai cấp nông dân và tầng lớp trí thức (cùng nhiều tầng lớp yêu nước khác), có truyền thống lâu đời và là mảnh đất thuận lợi để tiếp thu chủ nghĩa Mác-Lênin. Nếu chỉ quy phong trào yêu nước vào riêng công nhân, riêng nông dân hay riêng trí thức đều thu hẹp bản chất rộng lớn của phong trào này.","Nếu đề hỏi vì sao phong trào yêu nước có thể kết hợp với phong trào công nhân để hình thành Đảng Cộng sản Việt Nam thì nhớ: cả hai đều có chung mục tiêu giải phóng dân tộc và giai cấp công nhân Việt Nam xuất thân chủ yếu từ nông dân nên có mối liên hệ tự nhiên, mật thiết với các tầng lớp yêu nước."],[149,4,"Theo tư tưởng Hồ Chí Minh, để lãnh đạo Mặt trận dân tộc thống nhất, yêu cầu Đảng ta phải như thế nào?",["Có đội ngũ đảng viên đông đảo tập hợp trong mặt trận để lãnh đạo","Có đội ngũ đảng viên đủ trình độ lý luận và chuyên môn xứng tầm với nhiệm vụ mới","Có năng lực chuyên môn, có đức, có tài, am hiểu pháp luật","Có năng lực lãnh đạo; có chính sách đúng đắn; có uy tín"],3,"Theo Hồ Chí Minh, quyền lãnh đạo của Đảng đối với Mặt trận dân tộc thống nhất không phải tự phong mà được nhân dân thừa nhận dựa trên ba điều kiện cốt lõi: có năng lực lãnh đạo thực tiễn, đề ra đường lối chính sách đúng đắn phù hợp lợi ích toàn dân và có uy tín cao trước quần chúng. Chỉ có số lượng đảng viên đông đảo hay trình độ chuyên môn, pháp luật đơn thuần chưa đủ tạo nên quyền lãnh đạo chính trị đối với Mặt trận.","Nếu đề hỏi vị trí của Đảng trong Mặt trận dân tộc thống nhất theo Hồ Chí Minh thì nhớ Đảng vừa là một thành viên bình đẳng của Mặt trận, vừa là lực lượng lãnh đạo Mặt trận; phương pháp lãnh đạo là tuyên truyền, giáo dục, thuyết phục, nêu gương chứ không áp đặt mệnh lệnh."],[150,4,"Hồ Chí Minh nêu hai mệnh đề ngắn gọn: “Dân là chủ” và “Dân làm chủ”, là muốn đề cập vấn đề gì?",["Quyền tự do và làm chủ vận mệnh của dân","Quyền quản lý nhà nước và quản lý xã hội","Quyền tự do bầu cử, ứng cử của dân","Vị thế và năng lực, trách nhiệm của dân"],3,"Hai mệnh đề ngắn gọn của Hồ Chí Minh hàm chứa hai lớp ý nghĩa chặt chẽ: \"Dân là chủ\" xác định vị thế, địa vị tối cao của nhân dân trong chế độ mới; còn \"Dân làm chủ\" nhấn mạnh năng lực, quyền hạn và trách nhiệm thực thi quyền làm chủ của người dân trên thực tế. Các phương án như quyền bầu cử hay quản lý nhà nước chỉ là những biểu hiện cụ thể chứ chưa khái quát hết ý nghĩa của cặp mệnh đề này.","Nếu đề tách riêng từng vế: hỏi mệnh đề \"Dân là chủ\" nói lên điều gì thì chọn địa vị/vị thế làm chủ của nhân dân; hỏi mệnh đề \"Dân làm chủ\" nói lên điều gì thì chọn quyền, nghĩa vụ, trách nhiệm và năng lực làm chủ của nhân dân."],[151,4,"Hồ Chí Minh khẳng định “bao nhiêu lợi ích đều vì dân”, “quyền hành và lực lượng đều ở nơi dân”, là muốn đề cập vấn đề gì?",["Nguyên tắc hoạt động của Nhà nước","Nguyên tắc hoạt động của Đảng","Phương thức tổ chức và hoạt động của các đoàn thể xã hội","Phương thức tổ chức xã hội"],3,"Trong bài báo \"Dân vận\" (1949), khi khẳng định \"bao nhiêu lợi ích đều vì dân\", \"quyền hành và lực lượng đều ở nơi dân\", Hồ Chí Minh đã khái quát phương thức tổ chức xã hội kiểu mới — xã hội dân chủ do nhân dân làm chủ, nơi mọi thiết chế chính trị, đoàn thể và hoạt động công quyền đều vận hành trên nền tảng sức dân và hướng tới lợi ích của dân. Các phương án gói gọn trong nguyên tắc riêng của Đảng hay Nhà nước chưa phản ánh hết tầm bao quát toàn xã hội của luận điểm.","Nếu đề hỏi câu \"Bao nhiêu lợi ích đều vì dân. Bao nhiêu quyền hạn đều của dân... Nói tóm lại, quyền hành và lực lượng đều ở nơi dân\" trích trong tác phẩm nào của Hồ Chí Minh thì chọn bài báo Dân vận (15/10/1949)."],[152,4,"Luận điểm: \"Cách mệnh trước hết phải có cái gì? Trước hết phải có đảng cách mệnh, để trong thì vận động và tổ chức dân chúng, ngoài thì liên lạc với dân tộc bị áp bức và vô sản giai cấp mọi nơi. Đảng có vững cách mệnh mới thành công, cũng như người cầm lái có vững thuyền mới chạy\" được trích từ tác phẩm nào của Hồ Chí Minh?",["Bản án chế độ thực dân Pháp (1925)","Thường thức chính trị (1953)","Chánh cương vắn tắt của Đảng (1930)","Đường cách mệnh (1927)"],3,"Luận điểm kinh điển khẳng định tính tất yếu phải có Đảng cách mệnh lãnh đạo — \"Đảng có vững cách mệnh mới thành công, cũng như người cầm lái có vững thuyền mới chạy\" — được Nguyễn Ái Quốc trình bày trong tác phẩm Đường cách mệnh xuất bản năm 1927, tập hợp các bài giảng huấn luyện cán bộ tại Quảng Châu. Các tác phẩm Bản án chế độ thực dân Pháp (1925), Chánh cương vắn tắt (1930) hay Thường thức chính trị (1953) có nội dung và bối cảnh khác.","Phân biệt nhanh 4 tác phẩm hay xuất hiện cùng nhau: Bản án chế độ thực dân Pháp (1925) tố cáo tội ác thực dân; Đường cách mệnh (1927) trình bày lý luận về con đường, lực lượng và vai trò Đảng cách mạng; Chánh cương vắn tắt (1930) là Cương lĩnh đầu tiên của Đảng; Thường thức chính trị (1953) phổ cập kiến thức về Đảng và chính quyền nhân dân."],[153,4,"Một trong những nội dung xây dựng Đảng Cộng sản Việt Nam trong sạch vững mạnh theo tư tưởng Hồ Chí Minh là gì?",["Xây dựng Đảng về phương thức sinh hoạt Đảng; công tác quần chúng; về đạo đức cách mạng; về vai trò tiên phong chính trị","Xây dựng đảng viên ý thức chính trị theo chủ nghĩa Mác-Lênin","Xây dựng Đảng về công tác mặt trận dân tộc","Xây dựng Đảng về tổ chức, bộ máy, công tác cán bộ"],3,"Theo tư tưởng Hồ Chí Minh, xây dựng Đảng trong sạch, vững mạnh gồm các nội dung trụ cột: xây dựng Đảng về tư tưởng lý luận, về chính trị, về tổ chức - bộ máy - công tác cán bộ và về đạo đức. Phương án \"Xây dựng Đảng về tổ chức, bộ máy, công tác cán bộ\" diễn đạt chính xác một trong các nội dung trọng tâm đó, trong khi các phương án còn lại bị pha trộn hoặc thu hẹp sang công tác mặt trận hay ý thức riêng lẻ.","Nếu đề hỏi nội dung xây dựng Đảng về tư tưởng, lý luận lấy gì làm nền tảng thì chọn chủ nghĩa Mác-Lênin; nếu hỏi trong công tác cán bộ khâu nào được xem là gốc thì chọn đào tạo, bồi dưỡng, sử dụng cán bộ vừa có đức vừa có tài."],[154,4,"Quan điểm: \"Đảng ta là đạo đức, là văn minh\" được Hồ Chí Minh viết trong tác phẩm nào?",["Sách lược vắn tắt của Đảng","Báo cáo chính trị tại Đại hội lần thứ II của Đảng","Diễn văn khai mạc Đại hội lần thứ III của Đảng Lao động Việt Nam","Bài nói tại lễ kỷ niệm 30 năm ngày thành lập Đảng"],3,"Mệnh đề nổi tiếng \"Đảng ta là đạo đức, là văn minh\" được Hồ Chí Minh trình bày trong Bài nói tại lễ kỷ niệm 30 năm ngày thành lập Đảng (tháng 1/1960), khẳng định mục đích cao đẹp của Đảng là chiến đấu vì độc lập dân tộc, hạnh phúc của nhân dân và đại diện cho lương tâm, trí tuệ thời đại. Các văn kiện như Sách lược vắn tắt hay Báo cáo Đại hội II, Đại hội III không chứa nguyên văn mệnh đề này.","Nếu đề hỏi ý nghĩa của luận điểm \"Đảng ta là đạo đức, là văn minh\" thì nhớ: \"đạo đức\" thể hiện ở việc Đảng không có lợi ích riêng nào ngoài lợi ích của giai cấp, dân tộc và nhân dân; \"văn minh\" thể hiện ở Đảng tiêu biểu cho trí tuệ, lương tâm, danh dự của dân tộc và hoạt động phù hợp quy luật tiến bộ của thời đại."],[155,4,"Quan điểm: \"Đảng ta là một Đảng cầm quyền” được Hồ Chí Minh viết trong văn kiện nào?",["Chánh cương vắn tắt của Đảng (1930)","Báo cáo chính trị tại Đại hội lần thứ II của Đảng (1951)","Diễn văn khai mạc Đại hội lần thứ III của Đảng Lao động Việt Nam (1960)","Di chúc (1965-1969)"],3,"Trong Di chúc (viết giai đoạn 1965–1969), Hồ Chí Minh căn dặn sâu sắc: \"Đảng ta là một Đảng cầm quyền. Mỗi đảng viên và cán bộ phải thật sự thấm nhuần đạo đức cách mạng, thật sự cần kiệm liêm chính, chí công vô tư\". Các văn kiện năm 1930, 1951 hay 1960 chưa nêu cụm từ \"Đảng ta là một Đảng cầm quyền\" theo lời dặn trực tiếp về rèn luyện đạo đức cầm quyền này.","Nếu đề hỏi trong Di chúc, Hồ Chí Minh nhắc nhở Đảng cầm quyền phải làm gì để giữ gìn sự trong sạch thì nhớ: \"phải giữ gìn Đảng ta thật trong sạch, phải xứng đáng là người lãnh đạo, là người đầy tớ thật trung thành của nhân dân\" và \"cần phải giữ gìn sự đoàn kết nhất trí của Đảng như giữ gìn con ngươi của mắt mình\"."],[156,4,"Theo quan điểm của học thuyết Mác-Lênin, Nhà nước có mấy đặc trưng cơ bản?",["Ba","Bốn","Bảy","Năm"],3,"Theo học thuyết Mác-Lênin về Nhà nước và Pháp luật, Nhà nước có năm đặc trưng cơ bản phân biệt với các tổ chức xã hội khác: thiết lập quyền lực công cộng đặc biệt; phân chia và quản lý dân cư theo đơn vị hành chính - lãnh thổ; có chủ quyền quốc gia; ban hành pháp luật và quản lý xã hội bằng pháp luật; quy định và thu các loại thuế bắt buộc. Các con số ba, bốn hay bảy đều không khớp với hệ thống năm dấu hiệu kinh điển này.","Đừng nhầm câu hỏi về đặc trưng của Nhà nước (năm đặc trưng) với số lượng kiểu Nhà nước trong lịch sử loài người (bốn kiểu: chủ nô, phong kiến, tư sản, xã hội chủ nghĩa) hoặc số đặc trưng cơ bản của bản chất Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam."],[157,4,"Theo tư tưởng Hồ Chí Minh, Nhà nước có mấy vai trò cơ bản?",["Ba","Bốn","Bảy","Năm"],3,"Theo hệ thống kiến thức môn Tư tưởng Hồ Chí Minh, Nhà nước kiểu mới của dân, do dân, vì dân thực hiện năm vai trò cơ bản: tổ chức và quản lý phát triển kinh tế; quản lý và phát triển văn hóa - giáo dục - xã hội; bảo đảm quyền làm chủ và chăm lo đời sống nhân dân; củng cố quốc phòng - an ninh, bảo vệ Tổ quốc; mở rộng quan hệ đối ngoại, hợp tác quốc tế. Các con số ba, bốn hay bảy đều thiếu hoặc thừa so với khung phân loại này.","Mẹo nhớ nhanh nhóm câu hỏi đếm số lượng ở Chương 4: yếu tố ra đời Đảng là ba; kiểu Nhà nước trong lịch sử là bốn; đặc trưng cơ bản của Nhà nước (Mác-Lênin) và vai trò cơ bản của Nhà nước (Tư tưởng Hồ Chí Minh) đều là năm."],[158,4,"Theo Hồ Chí Minh, có mấy yếu tố dẫn đến sự ra đời của Đảng Cộng sản Việt Nam?",["Hai","Bốn","Năm","Ba"],3,"Theo Hồ Chí Minh, Đảng Cộng sản Việt Nam ra đời từ sự kết hợp của ba yếu tố: chủ nghĩa Mác-Lênin, phong trào công nhân và phong trào yêu nước Việt Nam. Con số hai chỉ đúng với quy luật chung ở các nước tư bản châu Âu theo V.I. Lênin (chưa tính đặc thù thuộc địa có phong trào yêu nước mạnh mẽ).","Nếu đề hỏi theo V.I. Lênin, Đảng Cộng sản ở các nước phương Tây ra đời từ sự kết hợp của mấy yếu tố thì chọn hai (chủ nghĩa Mác và phong trào công nhân); còn hỏi ở Việt Nam theo Hồ Chí Minh thì chọn ba."],[159,4,"Lịch sử xã hội loài người cho đến nay có bao nhiêu kiểu Nhà nước?",["Ba","Năm","Sáu","Bốn"],3,"Gắn liền với các hình thái kinh tế - xã hội có đối kháng giai cấp và thời kỳ quá độ lên chủ nghĩa xã hội, lịch sử xã hội loài người cho đến nay đã tồn tại bốn kiểu Nhà nước: Nhà nước chủ nô, Nhà nước phong kiến, Nhà nước tư sản và Nhà nước xã hội chủ nghĩa (xã hội cộng sản nguyên thủy chưa có Nhà nước). Các con số ba, năm hay sáu đều không chính xác.","Nếu đề hỏi kiểu Nhà nước nào là \"Nhà nước nửa nhà nước\" hoặc kiểu Nhà nước cuối cùng trong lịch sử, đại diện cho lợi ích của đại đa số nhân dân lao động thì chọn Nhà nước xã hội chủ nghĩa; còn nếu hỏi lịch sử loài người có mấy hình thái kinh tế - xã hội thì là năm (tính thêm cộng sản nguyên thủy)."],[160,4,"Câu “Chính vì Đảng Lao động Việt Nam là Đảng của giai cấp công nhân và nhân dân lao động, cho nên nó phải là Đảng của dân tộc Việt Nam” được trích trong tác phẩm nào của Hồ Chí Minh?",["Nâng cao đạo đức cách mạng, quét sạch chủ nghĩa cá nhân (1969)","Thường thức chính trị (1953)","Ba mươi năm hoạt động của Đảng (1960)","Báo cáo chính trị tại Đại hội lần II của Đảng (1951)"],3,"Câu nói \"Chính vì Đảng Lao động Việt Nam là Đảng của giai cấp công nhân và nhân dân lao động, cho nên nó phải là Đảng của dân tộc Việt Nam\" được trích từ Báo cáo chính trị của Chủ tịch Hồ Chí Minh tại Đại hội đại biểu toàn quốc lần thứ II của Đảng (tháng 2/1951) — Đại hội quyết định đưa Đảng ra hoạt động công khai với tên gọi Đảng Lao động Việt Nam. Đây là dấu hiệu nhận diện rõ nhất để loại trừ các tác phẩm năm 1953, 1960 hay 1969.","Mẹo bắt từ khóa cực nhanh: hễ thấy cụm tên \"Đảng Lao động Việt Nam\" gắn với khẳng định vừa là Đảng của giai cấp công nhân, nhân dân lao động vừa là Đảng của dân tộc Việt Nam thì liên hệ ngay tới Báo cáo chính trị tại Đại hội II (1951)."],[161,4,"Hồ Chí Minh đã quy định mấy môn trong thi tuyển công chức?",["4","5","7","6"],3,"Theo Sắc lệnh số 76/SL ngày 20-5-1950 về Quy chế công chức do Chủ tịch Hồ Chí Minh ký ban hành, kỳ thi tuyển công chức được quy định gồm 6 môn: Chính trị, Pháp luật, Hành chính, Lịch sử, Kinh tế và Ngoại ngữ. Các con số 4, 5 hay 7 đều không khớp với quy định chính thức này nhằm tuyển chọn người đủ đức, đủ tài vào bộ máy nhà nước.","Nếu đề hỏi cụ thể tên các môn công chức cần học hoặc điền khuyết danh sách môn thi tuyển, hãy nhớ đủ bộ 6 môn: Chính trị, Pháp luật, Hành chính, Lịch sử, Kinh tế, Ngoại ngữ (không có Toán học, Văn học hay Địa lý)."],[162,4,"Câu “Cơ hội tốt cho ta giành quyền độc lập đã tới ...”. Được khẳng định trong một cuộc hội nghị ngày 14-8-1945, đó là hội nghị nào?",["Hội nghị quân sự Bắc kỳ","Đại hội quốc dân Việt Nam","Hội nghị thành lập khu giải phóng Việt Bắc","Hội nghị toàn quốc của Đảng cộng sản Đông dương"],3,"Nhận định “Cơ hội tốt cho ta giành quyền độc lập đã tới...” được thông qua tại Hội nghị toàn quốc của Đảng Cộng sản Đông Dương họp ở Tân Trào ngày 14–15/8/1945, ngay khi phát xít Nhật sắp đầu hàng Đồng minh, nhằm quyết định phát động Tổng khởi nghĩa trên cả nước. Ba hội nghị còn lại diễn ra ở các mốc thời gian và nhiệm vụ khác nhau.","Phân biệt các mốc năm 1945 dễ nhầm: Hội nghị quân sự cách mạng Bắc Kỳ họp tháng 4/1945 (thống nhất lực lượng vũ trang); Khu giải phóng Việt Bắc thành lập tháng 6/1945; Đại hội quốc dân Việt Nam họp ngày 16–17/8/1945 (tán thành lệnh Tổng khởi nghĩa và bầu Ủy ban Dân tộc giải phóng)."],[163,4,"Nói về hoạt động của Nhà nước, Hồ Chí Minh viết: “Công việc thành công hoặc thất bại đều do cán bộ tốt hay ..........”. Chọn phương án đúng nhất để điền vào chỗ trống.",["xấu","yếu","dốt","kém"],3,"Trong tác phẩm Sửa đổi lối làm việc (1947), Hồ Chí Minh khẳng định nguyên văn: “Cán bộ là cái gốc của mọi công việc. Muôn việc thành công hoặc thất bại đều do cán bộ tốt hoặc kém”. Các từ “xấu”, “yếu”, “dốt” không đúng với cách diễn đạt chuẩn xác của Người về năng lực và phẩm chất đội ngũ cán bộ.","Nếu đề hỏi “cái gốc của mọi công việc” là gì thì chọn “cán bộ”; còn nếu hỏi tác phẩm chứa câu trích dẫn này thì chọn Sửa đổi lối làm việc (1947)."],[164,4,"Theo tư tưởng Hồ Chí Minh, trong xây dựng xã hội mới “đảng viên đi trước làng nước theo sau”. Nội dung đó nói lên vấn đề gì?",["Vai trò đấu tranh giai cấp, giải phóng dân tộc","Vai trò lãnh đạo nhân dân","Vai trò tham mưu chiến đấu","Vai trò tiên phong chính trị"],3,"Câu nói “Đảng viên đi trước, làng nước theo sau” nhấn mạnh vai trò tiên phong chính trị và tính gương mẫu của mỗi cán bộ, đảng viên trong lao động, chiến đấu và đạo đức để quần chúng tin tưởng, noi theo. Các phương án như đấu tranh giai cấp, lãnh đạo nhân dân hay tham mưu chiến đấu nói chung về chức năng của tổ chức Đảng chứ chưa diễn đạt đúng tinh thần đi đầu nêu gương của câu nói.","Nếu đề đổi câu hỏi sang phương châm rèn luyện đạo đức hay nguyên tắc nêu gương của cán bộ, đảng viên thì nhớ khẩu hiệu “nói đi đôi với làm”, “đảng viên đi trước, làng nước theo sau” là biểu hiện trực tiếp của tính tiên phong gương mẫu."],[165,4,"Năm 1953, Hồ Chí Minh viết: “Đảng Lao động là tổ chức cao nhất của giai cấp cần lao và đại biểu cho lợi ích của cả dân tộc” và “Đảng là đảng của giai cấp lao động, mà cũng là đảng của toàn dân”. Nội dung đó nói lên vấn đề gì?",["Bộ máy tổ chức của Đảng","Quyền lợi của Đảng","Chủ trương của Đảng","Bản chất của Đảng"],3,"Hai luận điểm Hồ Chí Minh viết trong Thường thức chính trị (1953) khẳng định trực tiếp bản chất của Đảng: vừa mang bản chất giai cấp công nhân – nhân dân lao động, vừa đại biểu trung thành cho lợi ích của toàn thể dân tộc Việt Nam. Nội dung này không bàn về cơ cấu bộ máy tổ chức, chủ trương cụ thể hay quyền lợi riêng của Đảng.","Nếu đề hỏi câu “Sự lãnh đạo của Đảng là nhân tố hàng đầu đưa cách mạng nước ta đến thắng lợi” nói về điều gì thì chọn “vai trò lãnh đạo của Đảng”; còn hễ thấy nhắc Đảng “của giai cấp công nhân, nhân dân lao động và toàn dân tộc” thì chắc chắn hỏi về “bản chất của Đảng”."],[166,4,"Theo tư tưởng Hồ Chí Minh, trong xã hội mới thì chủ thể “nhân dân” là như thế nào?",["Đầy tớ","Lãnh đạo","Quần chúng lao khổ","Người chủ Nhà nước"],3,"Theo tư tưởng Hồ Chí Minh, nước ta là nước dân chủ nên địa vị cao nhất thuộc về nhân dân, nhân dân là người chủ Nhà nước và nắm giữ quyền lực tối cao. Các cách gọi như “đầy tớ” (dùng để chỉ trách nhiệm phục vụ của cán bộ, công chức) hay “quần chúng lao khổ” (thân phận dưới chế độ cũ) đều sai vị thế của nhân dân trong xã hội mới.","Cẩn thận bẫy đảo vai trò: “nhân dân” là “người chủ”, còn “Đảng và cán bộ, công chức Nhà nước” vừa là “người lãnh đạo” vừa là “người đầy tớ (công bộc) thật trung thành của nhân dân”."],[167,4,"Theo tư tưởng Hồ Chí Minh, Nhà nước do dân là Nhà nước như thế nào?",["Phục vụ nhân dân đem lại lợi ích cho dân","Chăm lo mọi mặt đời sống nhân dân","Đặt lợi ích dân tộc, lợi ích tổ quốc trên hết","Do dân làm chủ tổ chức nên Nhà nước"],3,"Nội hàm cốt lõi của “Nhà nước do dân” là Nhà nước do nhân dân làm chủ, tự mình lập nên thông qua bầu cử, đóng góp xây dựng, ủng hộ và trực tiếp kiểm soát, giám sát hoạt động của bộ máy nhà nước. Hai phương án về phục vụ nhân dân và chăm lo đời sống nhân dân thuộc nội hàm của “Nhà nước vì dân”, không phải “do dân”.","Mẹo phân biệt nhanh bộ ba “của dân – do dân – vì dân”: “Của dân” nhấn mạnh quyền lực thuộc về dân (dân là chủ); “Do dân” nhấn mạnh dân lập nên, nuôi dưỡng, kiểm soát Nhà nước; “Vì dân” nhấn mạnh mục đích phục vụ, chăm lo lợi ích và hạnh phúc của nhân dân."],[168,4,"Theo Hồ Chí Minh, Đảng lãnh đạo Nhà nước bằng phương thức nào?",["Thông qua những văn bản, nghị quyết thể hiện đường lối, chủ trương, chính sách của Đảng","Thông qua hệ thống tổ chức đảng từ Trung ương đến địa phương và lực lượng đảng viên","Bằng công tác giám sát, thanh tra, kiểm tra thường xuyên","Thông qua Đường lối, chủ trương, chính sách, các tổ chức đảng, đảng viên trong bộ máy nhà nước và công tác kiểm tra"],3,"Hồ Chí Minh chỉ rõ Đảng lãnh đạo Nhà nước không phải bằng mệnh lệnh hành chính thay thế Nhà nước, mà bằng hệ thống phương thức đồng bộ: đề ra đường lối, chủ trương, chính sách lớn; thông qua tổ chức đảng và vai trò gương mẫu của đảng viên trong cơ quan nhà nước; kết hợp với công tác kiểm tra, giám sát. Ba phương án còn lại mỗi phương án chỉ nêu một khía cạnh nên chưa đầy đủ.","Nếu đề hỏi phương thức nào KHÔNG đúng với nguyên tắc Đảng lãnh đạo Nhà nước, hãy loại ngay phương án kiểu “Đảng trực tiếp điều hành, làm thay công việc quản lý hành chính của Nhà nước”."],[169,4,"Pháp luật đúng theo tư tưởng Hồ Chí Minh là pháp luật như thế nào?",["Cho người dân làm những điều mà luật cho phép","Bảo vệ lợi ích của giai cấp cầm quyền","Duy trì sự cầm quyền của Đảng","Thể hiện và bảo vệ được lợi ích của dân"],3,"Theo Hồ Chí Minh, pháp luật của Nhà nước dân chủ phải là pháp luật dân chủ, tức là thể hiện ý chí và bảo vệ được lợi ích chính đáng của nhân dân. Phương án “cho người dân làm những điều mà luật cho phép” bị sai nguyên tắc pháp quyền (công dân được làm những gì pháp luật không cấm), còn hai phương án kia thu hẹp mục đích pháp luật vào lợi ích cục bộ.","Nếu đề hỏi về nguyên tắc pháp quyền hiện đại, nhớ phân biệt: công dân được làm mọi điều pháp luật không cấm, còn cơ quan nhà nước và công chức chỉ được làm những gì pháp luật cho phép."],[170,4,"Quan điểm nào sau đây là đúng về mối quan hệ giữa Đảng Cộng sản với Mặt trận dân tộc thống nhất?",["Đảng Cộng sản Việt Nam là một thành viên của Mặt trận dân tộc thống nhất","Đảng Cộng sản Việt Nam là lực lượng lãnh đạo Mặt trận dân tộc thống nhất","Đảng Cộng sản Việt Nam độc lập, đứng trên để lãnh đạo Mặt trận dân tộc thống nhất","Đảng Cộng sản Việt Nam là thành viên và là lực lượng lãnh đạo Mặt trận dân tộc thống nhất"],3,"Trong tư tưởng Hồ Chí Minh, Đảng Cộng sản Việt Nam vừa là một thành viên bình đẳng tham gia hiệp thương dân chủ, vừa là lực lượng lãnh đạo Mặt trận dân tộc thống nhất nhờ đường lối đúng đắn và sự gương mẫu của đảng viên. Hai phương án chỉ nêu một vế đều thiếu sót, còn quan điểm Đảng “đứng trên” Mặt trận là trái với nguyên tắc dân chủ và đoàn kết.","Nếu đề hỏi Đảng lãnh đạo Mặt trận bằng cách nào, nhớ chọn phương thức “tuyên truyền, vận động, giáo dục, thuyết phục, nêu gương và hiệp thương dân chủ” chứ không áp đặt mệnh lệnh hành chính."],[171,4,"Hồ Chí Minh nêu “Tất cả quyền bính trong nước đều là của toàn thể nhân dân Việt Nam, không phân biệt nòi giống, gái trai, giàu nghèo, giai cấp, tôn giáo; những việc quan hệ đến vận mệnh quốc gia sẽ đưa ra toàn dân phúc quyết”. Nội dung đó muốn đề cập vấn đề gì?",["Nguyên tắc hoạt động của Nhà nước","Nhà nước vì dân","Nhà nước do dân","Nhà nước của dân"],3,"Câu trích dẫn (khẳng định trong Hiến pháp năm 1946) xác lập nguyên tắc tối thượng: toàn bộ quyền lực nhà nước thuộc về toàn thể nhân dân và những vấn đề hệ trọng của quốc gia do toàn dân phúc quyết, đây chính là bản chất của “Nhà nước của dân”. Nó không nói về quy trình nhân dân lập bộ máy (“do dân”) hay mục tiêu chăm lo đời sống (“vì dân”).","Thấy từ khóa “tất cả quyền bính thuộc về nhân dân”, “dân là chủ”, “toàn dân phúc quyết” thì chọn “Nhà nước của dân”; thấy “dân bầu ra, dân giám sát, bãi miễn” thì chọn “Nhà nước do dân”; thấy “đầy tớ của dân, mang lại lợi ích cho dân” thì chọn “Nhà nước vì dân”."],[172,4,"Theo tư tưởng Hồ Chí Minh, nội dung nào thể hiện đặc trưng cơ bản của Nhà nước?",["Nhà nước cộng hòa dân chủ","Đầu tư, cung cấp sản phẩm, dịch vụ xã hội cơ bản","Ban hành pháp luật và văn bản dưới luật","Nhà nước có chủ quyền quốc gia"],3,"Chủ quyền quốc gia (độc lập, tự chủ trong đối nội, đối ngoại và toàn vẹn lãnh thổ) là một đặc trưng cơ bản xác định sự tồn tại của một Nhà nước theo tư tưởng Hồ Chí Minh. Trong khi đó, “Nhà nước cộng hòa dân chủ” là hình thức chính thể, “ban hành pháp luật và văn bản dưới luật” là vai trò quản lý, còn cung cấp dịch vụ xã hội là nhiệm vụ kinh tế – xã hội cụ thể.","Đọc kỹ chữ “đặc trưng cơ bản” khác với “vai trò cơ bản”: hỏi “đặc trưng cơ bản của Nhà nước” thì chọn “Nhà nước có chủ quyền quốc gia”, còn hỏi “vai trò cơ bản của Nhà nước” thì chọn “Ban hành pháp luật và văn bản dưới luật”."],[173,4,"Theo tư tưởng Hồ Chí Minh, nội dung nào thể hiện vai trò cơ bản của Nhà nước?",["Nhà nước cộng hòa dân chủ","Đầu tư, cung cấp sản phẩm, dịch vụ xã hội cơ bản","Nhà nước có chủ quyền quốc gia","Ban hành pháp luật và văn bản dưới luật"],3,"Quản lý xã hội bằng pháp luật thông qua việc ban hành pháp luật và các văn bản dưới luật thể hiện vai trò cơ bản của Nhà nước trong việc tổ chức, điều hành đời sống xã hội và bảo đảm quyền làm chủ của nhân dân. Các phương án như “có chủ quyền quốc gia” là đặc trưng bản thể của Nhà nước, còn “cộng hòa dân chủ” là hình thức tổ chức chính thể.","Cặp câu dễ lẫn trong đề thi: “đặc trưng cơ bản” gắn với “Nhà nước có chủ quyền quốc gia”, còn “vai trò cơ bản” gắn với chức năng lập pháp và quản lý xã hội là “Ban hành pháp luật và văn bản dưới luật”."],[174,4,"Theo Tư tưởng Hồ Chí Minh, Đảng Cộng sản Việt Nam là Đảng của ai?",["Của giai cấp công nhân","Của nhân dân lao động","Của giai cấp lao động, mà cũng là Đảng của toàn dân","Của giai cấp công nhân, của nhân dân lao động và của dân tộc Việt Nam"],3,"Hồ Chí Minh khẳng định đầy đủ và nhất quán bản chất của Đảng Cộng sản Việt Nam là Đảng của giai cấp công nhân, đồng thời là Đảng của nhân dân lao động và của cả dân tộc Việt Nam, vì lợi ích giai cấp công nhân thống nhất với lợi ích của dân tộc. Các phương án chỉ nêu riêng giai cấp công nhân hoặc nhân dân lao động đều thiếu tính toàn diện, còn cách diễn đạt “giai cấp lao động” chưa chuẩn thuật ngữ đầy đủ bằng “giai cấp công nhân, nhân dân lao động và dân tộc Việt Nam”.","Nếu đề hỏi bản chất giai cấp của Đảng Cộng sản Việt Nam là bản chất của giai cấp nào (chỉ hỏi riêng về giai cấp), thì chọn “giai cấp công nhân” (không lẫn thành “giai cấp nông dân” hay “tầng lớp trí thức”)."],[175,4,"Trong tư tưởng đại đoàn kết của Hồ Chí Minh, khái niệm “dân” được hiểu như thế nào?",["Mọi đối tượng đông đảo nhất trong xã hội","Giai cấp tiến bộ đại diện cho xã hội tương lai","Các tầng lớp người bị bóc lột","“Mọi con dân nước Việt”, “mỗi con Rồng cháu Tiên”"],3,"Trong tư tưởng đại đoàn kết của Hồ Chí Minh, khái niệm “dân” và “nhân dân” có nội hàm rất rộng lớn, chỉ “mọi con dân nước Việt”, “mỗi con Rồng cháu Tiên”, tức là tất cả đồng bào Việt Nam yêu nước ở trong và ngoài nước, không phân biệt giai cấp, tầng lớp, dân tộc hay tôn giáo. Ba phương án còn lại đều thu hẹp khái niệm “dân” vào một bộ phận giai cấp hoặc diễn đạt chung chung không sát tư tưởng Người.","Nếu đề hỏi chủ thể của khối đại đoàn kết toàn dân tộc là ai, hãy nhớ là “toàn thể nhân dân Việt Nam” (mọi con dân đất Việt yêu nước), còn “nền tảng” của khối đại đoàn kết mới là “liên minh công nhân – nông dân – trí thức”."],[176,4,"Theo tư tưởng Hồ Chí Minh, học chủ nghĩa Mác-Lênin nghĩa là gì?",["Học thuộc các luận điểm lý luận","Để có tinh thần quốc tế cao cả","Để chứng tỏ trình độ lý luận","Để sống với nhau có tình, có nghĩa"],3,"Hồ Chí Minh từng căn dặn sâu sắc rằng hiểu và học chủ nghĩa Mác – Lênin cốt ở tinh thần nhân văn và thực tiễn hành động, tức là “để sống với nhau có tình, có nghĩa”, chứ không phải học thuộc lòng kinh viện các luận điểm hay khoe khoang trình độ lý luận. Cách hiểu này phản ánh rõ đạo đức cách mạng gắn chặt với lý luận khoa học.","Nếu đề hỏi Hồ Chí Minh phê phán căn bệnh gì khi học chủ nghĩa Mác – Lênin theo kiểu thuộc lòng câu chữ mà xa rời thực tiễn, hãy chọn “bệnh giáo điều” (hoặc “chủ nghĩa giáo điều, sách vở”)."],[177,4,"Luận điểm: \"Phải giữ gìn Đảng ta thật trong sạch, phải xứng đáng là người lãnh đạo, là người đầy tớ thật trung thành của nhân dân\" được trích từ tác phẩm nào của Hồ Chí Minh?",["Đường cách mệnh","Thường thức chính trị","Sửa đổi lối làm việc","Di chúc"],3,"Lời căn dặn nổi tiếng “Phải giữ gìn Đảng ta thật trong sạch, phải xứng đáng là người lãnh đạo, là người đầy tớ thật trung thành của nhân dân” được Hồ Chí Minh viết trong bản Di chúc (1969), phần nói về Đảng. Ba tác phẩm còn lại được viết ở các thời kỳ trước (1927, 1947, 1953) với những chủ đề và văn phong khác.","Nhớ mốc 4 tác phẩm kinh điển rất hay ra câu hỏi trích dẫn: Đường cách mệnh (1927 – tư cách người cách mệnh, mục đích cách mạng), Sửa đổi lối làm việc (1947 – phê bình, cán bộ, 12 điều xây dựng Đảng), Thường thức chính trị (1953 – bản chất và lực lượng cách mạng), Di chúc (1969 – chỉnh đốn Đảng, đoàn kết trong Đảng, đầy tớ trung thành của nhân dân)."],[178,4,"Câu: \"Một Đảng mà giấu giếm khuyết điểm của mình là một Đảng hỏng. Một Đảng có gan thừa nhận khuyết điểm của mình, vạch rõ những cái đó, vì đâu mà có khuyết điểm đó, xét rõ hoàn cảnh sinh ra khuyết điểm đó, rồi tìm kiếm mọi cách để sửa chữa khuyết điểm đó. Như thế là một Đảng tiến bộ, mạnh dạn, chắc chắn, chân chính\" được trích trong tác phẩm nào của Hồ Chí Minh?",["Đời sống mới","Đạo đức cách mạng","Thư gửi các đồng chí Bắc Bộ","Sửa đổi lối làm việc"],3,"Đoạn trích bàn về dũng khí tự phê bình, không giấu giếm khuyết điểm để trở thành một Đảng tiến bộ, chân chính nằm trong tác phẩm Sửa đổi lối làm việc (viết tháng 10-1947 dưới bút danh X.Y.Z). Các tác phẩm như Đời sống mới (bàn về cần kiệm liêm chính trong nếp sống), Đạo đức cách mạng (1958) hay Thư gửi các đồng chí Bắc Bộ (1947) đều không chứa đoạn văn này.","Nếu đề hỏi nguyên tắc sinh hoạt Đảng nào được Hồ Chí Minh ví như “vũ khí sắc bén” hay “thang thuốc tốt nhất” để giữ Đảng trong sạch, hãy chọn “tự phê bình và phê bình”."],[179,4,"Câu: “Việc gì có lợi cho dân, ta phải hết sức làm. Việc gì hại đến dân, ta phải hết sức tránh. Chúng ta phải yêu dân, kính dân thì dân mới yêu ta, kính ta” được trích từ tác phẩm nào của Hồ Chí Minh?",["Thư gửi các đồng chí tỉnh nhà","Thư gửi các đồng chí Bắc bộ","Đạo đức cách mạng","Thư gửi Ủy ban nhân dân các kỳ, tỉnh, huyện và làng"],3,"Câu “Việc gì có lợi cho dân, ta phải hết sức làm. Việc gì hại đến dân, ta phải hết sức tránh...” được Hồ Chí Minh viết trong Thư gửi Ủy ban nhân dân các kỳ, tỉnh, huyện và làng (tháng 10-1945) nhằm giáo dục đạo đức công vụ cho đội ngũ cán bộ chính quyền cách mạng non trẻ ngay sau khi giành độc lập. Các bức thư và tác phẩm khác có đối tượng và nội dung riêng biệt.","Trong cùng bức Thư gửi Ủy ban nhân dân các kỳ, tỉnh, huyện và làng (10-1945), Hồ Chí Minh còn chỉ ra 6 căn bệnh của cán bộ chính quyền cần tránh: trái phép, cậy thế, hủ hóa, tư túng, chia rẽ và kiêu ngạo — nếu đề hỏi 6 căn bệnh này trích từ đâu thì cũng chọn văn kiện này."],[180,4,"Câu “Chống .......... và bệnh quan liêu cũng quan trọng và cần kíp như việc đánh giặc trên mặt trận”. Chọn phương án đúng để điền vào chỗ trống.",["phá hoại của công","thói kiêu căng, lạm quyền","lãng phí","tham ô, lãng phí"],3,"Hồ Chí Minh coi tham ô, lãng phí và bệnh quan liêu là ba thứ “giặc nội xâm” phá hoại từ bên trong nên Người nhấn mạnh nguyên văn: “Chống tham ô, lãng phí và bệnh quan liêu cũng quan trọng và cần kíp như việc đánh giặc trên mặt trận”. Phương án chỉ điền “lãng phí” bị thiếu vế “tham ô”, còn hai phương án kia sai nguyên văn.","Nếu đề hỏi đâu là “nguyên nhân, nguồn gốc sinh ra tham ô, lãng phí” theo Hồ Chí Minh, hãy chọn “bệnh quan liêu” (vì quan liêu xa rời thực tế tạo kẽ hở cho tham ô và lãng phí)."],[181,4,"Hồ Chí Minh khẳng định: “Lực lượng của giai cấp .......... là rất to lớn, là vô cùng vô tận. Nhưng lực lượng ấy cần có Đảng lãnh đạo mới chắc chắn thắng lợi”. Chọn phương án đúng để điền vào chỗ trống.",["Nông dân","Công nhân và trí thức","Công nhân và nông dân","Công nhân và nhân dân lao động"],3,"Trong Thường thức chính trị (1953), Hồ Chí Minh viết chính xác: “Lực lượng của giai cấp công nhân và nhân dân lao động là rất to lớn, là vô cùng vô tận. Nhưng lực lượng ấy cần có Đảng lãnh đạo mới chắc chắn thắng lợi”. Các cụm từ chỉ nêu riêng nông dân, công nhân – trí thức hay công nhân – nông dân đều thu hẹp phạm vi chủ thể so với nguyên văn.","Gặp câu trích dẫn có vế “lực lượng ấy cần có Đảng lãnh đạo mới chắc chắn thắng lợi”, luôn nhớ cụm đi kèm là “giai cấp công nhân và nhân dân lao động”; còn khi đề hỏi “nền tảng của khối đại đoàn kết” thì mới là “liên minh công – nông – trí thức”."],[182,4,"Trong tư tưởng Hồ Chí Minh, luận điểm “sự lãnh đạo của Đảng là nhân tố hàng đầu đưa cách mạng nước ta đến thắng lợi”, là để:",["Xác định vị thế cầm quyền của Đảng","Xác định mục đích của Đảng","Xác định nhiệm vụ của Đảng","Xác định vai trò lãnh đạo của Đảng"],3,"Luận điểm khẳng định sự lãnh đạo của Đảng là nhân tố hàng đầu quyết định thắng lợi của cách mạng trực tiếp xác định vai trò lãnh đạo của Đảng đối với cách mạng Việt Nam. Nội dung này không bàn về mục đích hoạt động, nhiệm vụ cụ thể hay địa vị cầm quyền nhà nước của Đảng.","Đối chiếu ngay với câu hỏi tương tự: luận điểm “Đảng là của giai cấp công nhân, nhân dân lao động và cả dân tộc” xác định “bản chất của Đảng”, còn “nhân tố hàng đầu đưa cách mạng đến thắng lợi” xác định “vai trò lãnh đạo của Đảng”."],[183,4,"Luận điểm “Đảng cộng sản là đảng của giai cấp công nhân, của nhân dân lao động và của cả dân tộc”, là nhằm:",["Xác định vai trò lãnh đạo của Đảng","Xác định vị thế cầm quyền của Đảng","Xác định chức năng, nhiệm vụ của Đảng","Xác định bản chất của Đảng"],3,"Khẳng định Đảng Cộng sản là Đảng của giai cấp công nhân, của nhân dân lao động và của cả dân tộc nhằm xác định bản chất giai cấp – dân tộc thống nhất của Đảng. Các nội dung về vai trò lãnh đạo, vị thế cầm quyền hay chức năng, nhiệm vụ được thể hiện qua các luận điểm khác.","Khi làm bài tập nhận diện luận điểm về Đảng, nhớ cặp từ khóa: “của ai” → xác định bản chất của Đảng; “nhân tố hàng đầu quyết định thắng lợi” → xác định vai trò lãnh đạo của Đảng; “Đảng cầm quyền vừa là người lãnh đạo, vừa là người đầy tớ” → xác định vị thế và trách nhiệm cầm quyền."],[184,4,"Theo tư tưởng Hồ Chí Minh: \"Làm sao cách mệnh rồi thì quyền trao cho .......... chớ để trong tay một bọn ít người\". Chọn phương án đúng nhất để điền vào chỗ trống.",["Giai cấp công nhân","Giai cấp nông dân","Giai cấp tư sản dân tộc","Dân chúng số nhiều"],3,"Trong tác phẩm Đường cách mệnh (1927), khi phân tích cách mạng tư sản Mỹ và Pháp chưa đến nơi vì quyền lực vẫn nằm trong tay thiểu số tư sản, Hồ Chí Minh nêu mục tiêu của cách mạng Việt Nam là “làm sao cách mệnh rồi thì quyền trao cho dân chúng số nhiều chớ để trong tay một bọn ít người”. Các phương án nêu riêng một giai cấp cụ thể đều sai nguyên văn và hẹp hơn tinh thần dân chủ rộng rãi của Người.","Nếu đề hỏi Hồ Chí Minh dùng cụm từ “cách mệnh chưa đến nơi” để nhận xét về cuộc cách mạng nào trong Đường cách mệnh, hãy chọn “Cách mạng tư sản Mỹ (1776) và Cách mạng tư sản Pháp (1789)”."],[185,4,"Điểm đặc sắc nhất trong tư tưởng Hồ Chí Minh về Nhà nước pháp quyền là gì?",["Coi trọng luật pháp trong quản lý xã hội","Đề cao đạo đức trong quản lý xã hội","Bao đảm tính nghiêm minh và hiệu lực của pháp luật","Kết hợp nhuần nhuyễn cả pháp luật và đạo đức trong quản lý"],3,"Điểm đặc sắc, sáng tạo nổi bật nhất trong tư tưởng Hồ Chí Minh về Nhà nước pháp quyền là sự kết hợp nhuần nhuyễn giữa pháp luật (“pháp trị”) và đạo đức (“đức trị”) trong quản lý xã hội, vừa nghiêm minh thượng tôn pháp luật vừa chú trọng giáo dục, cảm hóa đạo đức. Ba phương án còn lại đều chỉ nhấn mạnh một mặt riêng lẻ nên chưa thể hiện nét đặc sắc tổng hòa của Người.","Nếu đề đổi hỏi về đặc trưng của Nhà nước pháp quyền nhân nghĩa Hồ Chí Minh, ngoài kết hợp pháp luật với đạo đức, còn có nét nổi bật là “pháp luật nghiêm minh nhưng mang tính nhân văn, hướng thiện, khuyến khích cái tốt”."],[186,4,"Theo Hồ Chí Minh, những điều kiện nào bảo đảm cho pháp luật được thực hiện nghiêm minh và có hiệu lực?",["Pháp luật phải đúng, đủ và đi vào cuộc sống","Pháp luật phải đúng và được chấp nhận của xã hội; được người dân tự giác học tập","Pháp luật phải đúng, đủ và có khả năng điều hành các mặt xã hội","Pháp luật phải đúng và đủ; người thực thi luật pháp phải công tâm, nghiêm minh"],3,"Để pháp luật thực sự nghiêm minh và phát huy hiệu lực trong đời sống, Hồ Chí Minh yêu cầu đồng thời hai điều kiện: hệ thống pháp luật phải đúng đắn, đầy đủ (phù hợp thực tiễn, bảo vệ lợi ích nhân dân) và đội ngũ người thực thi pháp luật phải thật sự công tâm, nghiêm minh, không thiên vị. Ba phương án còn lại đều bỏ sót vai trò quyết định của người thực thi pháp luật.","Nếu đề hỏi thêm về yêu cầu đối với cán bộ tư pháp và hành pháp theo Hồ Chí Minh, nhớ cụm từ “phụng công, thủ pháp, chí công, vô tư” và phải gương mẫu chấp hành pháp luật trước dân."],[187,4,"Văn kiện nào đầu tiên thể hiện chế độ dân chủ do chủ tịch Hồ Chí Minh thiết kế?",["Tuyên ngôn độc lập","Yêu sách 8 điểm gửi hội nghị Vecxay","Hiến pháp 1946","Chương trình của mặt trận Việt minh"],3,"Chương trình của Mặt trận Việt Minh (1941) là văn kiện đầu tiên phác họa rõ nét mô hình chế độ dân chủ mới do Hồ Chí Minh thiết kế, với mục tiêu lập Chính phủ nhân dân của nước Việt Nam Dân chủ Cộng hòa và bảo đảm các quyền tự do dân chủ cơ bản. Yêu sách 8 điểm (1919) mới đòi quyền cải cách trong khuôn khổ thuộc địa Pháp, Tuyên ngôn Độc lập (1945) tuyên bố nền độc lập quốc gia, còn Hiến pháp 1946 ra đời sau khi chính quyền dân chủ đã được thiết lập.","Phân biệt chuẩn 4 văn kiện mốc son: Yêu sách 8 điểm (1919) – lần đầu đòi quyền tự do, dân chủ và pháp quyền cho dân thuộc địa; Chương trình Việt Minh (1941) – văn kiện đầu tiên thiết kế chế độ dân chủ mới; Tuyên ngôn Độc lập (2/9/1945) – khai sinh nước Việt Nam Dân chủ Cộng hòa; Hiến pháp 1946 – bản Hiến pháp dân chủ đầu tiên của nước ta."],[188,4,"Theo Hồ Chí Minh, để thực hiện được dân chủ trong xã hội, trước tiên cần thực hiện dân chủ trong tổ chức nào?",["Dân chủ trong chính quyền các cấp","Dân chủ trong Quốc hội","Dân chủ trong các đoàn thể nhân dân","Dân chủ trong tổ chức Đảng"],3,"Vì Đảng Cộng sản là lực lượng lãnh đạo Nhà nước và toàn xã hội, nên theo Hồ Chí Minh, muốn thực hành dân chủ rộng rãi trong xã hội thì trước hết phải thực hiện dân chủ thực sự ngay trong tổ chức Đảng. Nội bộ Đảng có dân chủ, minh bạch thì mới nêu gương và bảo đảm dân chủ trong Quốc hội, chính quyền các cấp và các đoàn thể nhân dân.","Nếu đề hỏi nguyên tắc tổ chức và sinh hoạt cơ bản nhất của Đảng để bảo đảm dân chủ đi đôi với kỷ luật là gì, hãy chọn “nguyên tắc tập trung dân chủ”."],[189,4,"Hồ Chí Minh viết: “Những người trúng cử, sẽ phải ra sức giữ vững nền độc lập của Tổ quốc, ra sức .......... cho đồng bào. Phải luôn luôn nhớ và thực hành câu: Vì lợi nước, quên lợi nhà; vì lợi chung, quên lợi riêng”. Chọn phương án đúng nhất để điền vào chỗ trống.",["làm giàu","giải phóng","tăng phúc lợi","mưu sự hạnh phúc"],3,"Trong bài báo Ý nghĩa Tổng tuyển cử đăng trên báo Cứu quốc ngày 31-12-1945 (ngay trước cuộc Tổng tuyển cử đầu tiên 6-1-1946), Hồ Chí Minh viết nguyên văn: “Những người trúng cử, sẽ phải ra sức giữ vững nền độc lập của Tổ quốc, ra sức mưu sự hạnh phúc cho đồng bào”. Các cụm từ “làm giàu”, “giải phóng” hay “tăng phúc lợi” không khớp nguyên văn lời căn dặn của Người.","Nếu đề hỏi câu này được Hồ Chí Minh viết nhân sự kiện lịch sử nào, hãy chọn “cuộc Tổng tuyển cử bầu Quốc hội khóa I ngày 6-1-1946”."],[190,4,"Theo tư tưởng Hồ Chí Minh, một trong những tiêu chuẩn để lựa chọn người vào bộ máy nhà nước: “Công chức cần phải được học Chính trị, Pháp luật, .......... Kinh tế, Ngoại ngữ”. Chọn phương án đúng nhất để điền vào chỗ trống.",["Văn học, Toán học","Lịch sử, Địa lý","Văn học, Lịch sử","Hành chính, Lịch sử"],3,"Theo Quy chế công chức ban hành kèm Sắc lệnh số 76/SL năm 1950 của Chủ tịch Hồ Chí Minh, công chức nhà nước phải trải qua kỳ thi tuyển và được đào tạo 6 môn: Chính trị, Pháp luật, Hành chính, Lịch sử, Kinh tế và Ngoại ngữ. Do đó cặp môn còn thiếu đúng chuẩn là Hành chính và Lịch sử, không phải Văn học, Toán học hay Địa lý.","Liên hệ trực tiếp với câu hỏi về số lượng: hễ hỏi “mấy môn thi tuyển công chức” thì chọn “6”, hỏi tên các môn thì kiểm tra đủ 6 cái tên: Chính trị – Pháp luật – Hành chính – Lịch sử – Kinh tế – Ngoại ngữ."],[191,4,"Hồ Chí Minh nói: “Các cô chú làm việc trong lĩnh vực tư pháp nhưng vấn đề cơ bản vẫn là vấn đề .......... đó là vấn đề yêu nước, thương nhân loại bị áp bức”. Chọn phương án đúng nhất để điền vào chỗ trống.",["công, tư phân minh, có lý có tình","lý trí và vấn đề tình cảm","năng lực công tác và sự am hiểu pháp luật","ở đời và làm người"],3,"Tại Hội nghị học tập của cán bộ ngành Tư pháp năm 1950, Hồ Chí Minh căn dặn sâu sắc rằng gốc rễ của người làm công tác tư pháp trước hết là “vấn đề ở đời và làm người”, tức là có lòng yêu nước, thương dân, thương nhân loại bị áp bức. Ba phương án còn lại là những yêu cầu nghề nghiệp cụ thể nhưng không khớp nguyên văn câu nói mang tầm triết lý nhân văn này của Người.","Nếu đề hỏi Hồ Chí Minh yêu cầu cán bộ tư pháp phải có phẩm chất cốt lõi nào trong công việc xét xử, ngoài “ở đời và làm người”, hãy nhớ 8 chữ vàng Người gửi ngành Tư pháp: “Phụng công, thủ pháp, chí công, vô tư” và “gần dân, hiểu dân, giúp dân, học dân”."],[192,4,"Trong tư tưởng Hồ Chí Minh, đặc trưng nổi bật nhất của đạo đức cộng sản là gì?",["Tình thương dành cho công nhân","Tình thương dành cho người nghèo","Tình thương dành cho con người","Chủ nghĩa nhân đạo chiến đấu"],3,"Trong tư tưởng Hồ Chí Minh, đặc trưng nổi bật nhất của đạo đức cộng sản là “chủ nghĩa nhân đạo chiến đấu” — nghĩa là tình yêu thương con người gắn liền với hành động cách mạng kiên quyết đấu tranh xóa bỏ áp bức, bóc lột, giải phóng dân tộc và giải phóng loài người. Các phương án chỉ nói chung chung về tình thương dành cho một nhóm hay con người nói chung đều chưa toát lên tính chiến đấu cách mạng đặc thù.","Nếu đề hỏi phẩm chất đạo đức cách mạng bao trùm, nền tảng và quan trọng nhất của con người Việt Nam theo Hồ Chí Minh là gì, hãy chọn “Trung với nước, hiếu với dân”; còn hỏi “đặc trưng nổi bật nhất của đạo đức cộng sản” thì chọn “Chủ nghĩa nhân đạo chiến đấu”."],[193,4,"Học tập tư tưởng Hồ Chí Minh, trong thực thi pháp luật chúng ta cần chú trọng điều gì nhất?",["Coi pháp luật là độc tôn","Đề cao công lý","Đề cao yếu tố tình cảm hơn pháp luật","Coi trọng cả 2 mặt: Lý và Tình"],3,"Học tập tư tưởng Hồ Chí Minh, quá trình thực thi pháp luật phải coi trọng cả hai mặt Lý và Tình, tức là vừa nghiêm minh, công bằng theo đúng quy định pháp luật (“có lý”), vừa giàu tính nhân văn, thấu đáo hoàn cảnh, mang mục đích giáo dục cảm hóa (“có tình”). Việc độc tôn pháp luật cứng nhắc hoặc đề cao tình cảm hơn pháp luật đều làm sai lệch bản chất Nhà nước pháp quyền nhân nghĩa.","Nếu đề hỏi về nguyên tắc xử lý giữa “pháp luật” và “đạo đức” trong quản lý xã hội của Hồ Chí Minh, nhớ chọn tinh thần kết hợp hài hòa cả hai (“đức trị” kết hợp “pháp trị”, “có lý, có tình”), tuyệt đối không chọn phương án tuyệt đối hóa một mặt."],[194,5,"Hồ Chí Minh khẳng định: “Đại đoàn kết là một hệ thống các quan điểm .......... tổ chức tập hợp lực lượng yêu nước cách mạng một cách rộng rãi và chặt chẽ, nhằm phát huy đến mức cao như sức mạnh của dân tộc, đấu tranh cho độc lập dân tộc, dân chủ và chủ nghĩa xã hội”. Chọn phương án đúng để điền vào chỗ trống.",["Nguyên tắc, phương pháp, chiến lược để","Về chiến lược, sách lược","Quan niệm, phương pháp, kế hoạch","Nguyên tắc, phương pháp"],3,"Theo định nghĩa chuẩn trong Giáo trình Tư tưởng Hồ Chí Minh, tư tưởng đại đoàn kết là “một hệ thống các quan điểm, nguyên tắc, phương pháp tổ chức tập hợp lực lượng yêu nước cách mạng một cách rộng rãi và chặt chẽ...”. Các phương án chèn thêm từ “chiến lược”, “sách lược” hay “kế hoạch” đều sai lệch so với nguyên văn khái niệm.","Lưu ý phân biệt khi đề hỏi vai trò của đại đoàn kết dân tộc: Hồ Chí Minh khẳng định đại đoàn kết dân tộc là “vấn đề có ý nghĩa chiến lược, quyết định thành công của cách mạng” (không phải sách lược hay thủ đoạn chính trị nhất thời)."],[195,5,"Theo Hồ Chí Minh, xây dựng Mặt trận đoàn kết quốc tế phải có ít nhất mấy tầng mặt trận?",["Hai","Năm","Ba","Bốn"],3,"Trong tư tưởng Hồ Chí Minh về xây dựng lực lượng đoàn kết quốc tế, Người chủ trương hình thành ít nhất 4 tầng mặt trận đồng tâm từ trong ra ngoài: (1) Mặt trận đại đoàn kết dân tộc Việt Nam; (2) Mặt trận đoàn kết Việt – Miên – Lào; (3) Mặt trận nhân dân Á – Phi đoàn kết với Việt Nam; và (4) Mặt trận nhân dân thế giới đoàn kết với Việt Nam chống đế quốc xâm lược. Các con số hai, ba hay năm đều chưa đúng cấu trúc 4 tầng này.","Thuộc lòng thứ tự 4 tầng mặt trận từ gần đến xa để không bao giờ sai câu hỏi phụ: Tầng 1 = Việt Nam; Tầng 2 = Việt – Miên – Lào (Đông Dương); Tầng 3 = Nhân dân Á – Phi; Tầng 4 = Nhân dân thế giới."],[196,5,"Theo Hồ Chí Minh, Mặt trận đoàn kết Việt - Miên - Lào thuộc tầng mặt trận đoàn kết thứ mấy?",["Bốn","Năm","Ba","Hai"],3,"Trong hệ thống 4 tầng mặt trận đoàn kết theo tư tưởng Hồ Chí Minh, Mặt trận đoàn kết ba nước Đông Dương Việt – Miên – Lào nằm ở tầng thứ hai, ngay sau tầng thứ nhất là Mặt trận đại đoàn kết toàn dân tộc Việt Nam. Vị trí này thể hiện mối quan hệ láng giềng gắn bó sống còn cùng chung kẻ thù xâm lược.","Nếu đề đổi hỏi tầng thứ nhất là gì thì chọn “Mặt trận đại đoàn kết dân tộc Việt Nam”; hỏi tầng thứ ba thì chọn “Mặt trận nhân dân Á – Phi đoàn kết với Việt Nam”; hỏi tầng thứ tư thì chọn “Mặt trận nhân dân thế giới đoàn kết với Việt Nam”."],[197,5,"Theo Hồ Chí Minh, Mặt trận nhân dân Á - Phi đoàn kết với Việt Nam thuộc tầng mặt trận đoàn kết thứ mấy?",["Bốn","Năm","Hai","Ba"],3,"Mặt trận nhân dân Á – Phi đoàn kết với Việt Nam thuộc tầng thứ ba trong cấu trúc 4 tầng mặt trận đoàn kết quốc tế của Hồ Chí Minh, mở rộng từ khối đoàn kết dân tộc (tầng 1) và liên minh Việt – Miên – Lào (tầng 2) ra các dân tộc thuộc địa và đang phát triển cùng cảnh ngộ ở châu Á, châu Phi.","Mẹo nhớ theo quy mô địa lý tăng dần: Trong nước (tầng 1) → Đông Dương / Việt – Miên – Lào (tầng 2) → Á – Phi (tầng 3) → Toàn thế giới (tầng 4)."],[198,5,"Vận dụng tư tưởng đại đoàn kết Hồ Chí Minh, Đảng ta đã thành lập Mặt trận Tổ quốc Việt Nam vào năm nào?",["Năm 1941","Năm 1936","Năm 1939","Năm 1955"],3,"Vận dụng tư tưởng đại đoàn kết Hồ Chí Minh trong giai đoạn cách mạng mới sau năm 1954, Đảng ta đã thành lập Mặt trận Tổ quốc Việt Nam vào ngày 10-9-1955 tại Hà Nội (trên cơ sở kế thừa Mặt trận Liên Việt). Các mốc năm 1936, 1939 và 1941 đều gắn với những hình thức mặt trận ở thời kỳ trước Cách mạng Tháng Tám.","Nhớ nhanh các mốc tên gọi Mặt trận dễ bị đánh tráo: 1930 (Hội Phản đế đồng minh), 1936 (Mặt trận Thống nhất Nhân dân Phản đế / Mặt trận Dân chủ Đông Dương), 1939 (Mặt trận Thống nhất Dân tộc Phản đế Đông Dương), 1941 (Mặt trận Việt Minh), 1951 (Mặt trận Liên Việt), 1955 (Mặt trận Tổ quốc Việt Nam)."],[199,5,"Cơ sở hình thành tư tưởng Hồ Chí Minh về đại đoàn kết dân tộc là gì?",["Truyền thống yêu nước dân tộc","Truyền thống yêu nước dân tộc và đoàn kết quốc tế","Truyền thống cố kết cộng đồng làng xã Việt Nam","Tinh thần yêu nước; ý thức cố kết dân tộc đoàn kết dân tộc; tổng kết những kinh nghiệm của phong trào cách mạng Việt Nam và phong trào cách mạng thế giới"],3,"Tư tưởng Hồ Chí Minh về đại đoàn kết dân tộc được hình thành từ sự tổng hòa cả cơ sở truyền thống lẫn cơ sở thực tiễn: truyền thống yêu nước, ý thức cố kết cộng đồng dân tộc Việt Nam kết hợp với sự tổng kết thực tiễn phong trào cách mạng trong nước và thế giới (cùng cơ sở lý luận chủ nghĩa Mác – Lênin). Ba phương án còn lại đều chỉ nêu phiến diện một mảnh của truyền thống nên chưa đầy đủ.","Phân biệt câu hỏi chung và câu hỏi trọng tâm: hỏi “cơ sở hình thành” nói chung thì chọn phương án đầy đủ cả truyền thống dân tộc lẫn tổng kết thực tiễn trong nước – thế giới; còn hỏi “cơ sở lý luận quan trọng nhất” thì chọn “Chủ nghĩa Mác – Lênin”."],[200,5,"Cơ sở lý luận quan trọng nhất hình thành tư tưởng Hồ Chí Minh về đại đoàn kết dân tộc là gì?",["Tinh thần đoàn kết quốc tế","Tinh thần yêu nước Việt Nam","Tinh thần đoàn kết dân tộc","Chủ nghĩa Mác – Lênin"],3,"Chủ nghĩa Mác – Lênin là cơ sở lý luận quan trọng nhất quyết định bước phát triển về chất trong tư tưởng Hồ Chí Minh về đại đoàn kết dân tộc, giúp Người nhận thức sâu sắc vai trò sáng tạo lịch sử của quần chúng nhân dân, liên minh công – nông và sự gắn kết cách mạng giải phóng dân tộc với cách mạng vô sản thế giới. Các phương án như tinh thần yêu nước, đoàn kết dân tộc hay đoàn kết quốc tế thuộc về cơ sở truyền thống văn hóa và thực tiễn, không phải cơ sở lý luận.","Cẩn thận hai chữ “lý luận” trong đề: hỏi “cơ sở truyền thống quan trọng nhất” hay “cội nguồn sâu xa” thì chọn “truyền thống yêu nước, đoàn kết của dân tộc Việt Nam”, còn hỏi “cơ sở lý luận quan trọng nhất” thì luôn chọn “Chủ nghĩa Mác – Lênin”."],[201,5,"Theo Hồ Chí Minh, đại đoàn kết dân tộc có ý nghĩa thế nào trong sự nghiệp cách mạng?",["Rất quan trọng","Đặc biệt quan trọng","Là vấn đề có ý nghĩa sách lược","Là vấn đề chiến lược"],3,"Hồ Chí Minh khẳng định đại đoàn kết toàn dân tộc là vấn đề có ý nghĩa chiến lược, quyết định thành công của cách mạng, xuyên suốt cả cách mạng dân tộc dân chủ nhân dân lẫn cách mạng xã hội chủ nghĩa. Các cụm từ như \"Rất quan trọng\" hay \"Đặc biệt quan trọng\" chỉ nêu mức độ chung chung, còn \"sách lược\" là sai vì đại đoàn kết không phải thủ đoạn chính trị nhất thời.","Nếu đề hỏi hai nội dung về vai trò của đại đoàn kết dân tộc, cần nhớ cả hai vế: là vấn đề có ý nghĩa chiến lược, quyết định thành công của cách mạng; và là một mục tiêu, nhiệm vụ hàng đầu của cách mạng Việt Nam. Luôn phân biệt \"chiến lược\" (lâu dài, nhất quán) với \"sách lược\" (tạm thời, tình thế)."],[202,5,"Đoàn kết quốc tế trong tư tưởng Hồ Chí Minh tập trung chủ yếu vào những lực lượng nào?",["Phong trào đấu tranh của giai cấp công nhân ở chính quốc","Hiệp hội hữu nghị và hợp tác quốc tế song phương, đa phương","Các khối kinh tế, thương mại đa chiều","Phong trào giải phóng dân tộc, yêu chuộng hòa bình, phản chiến"],3,"Trong tư tưởng Hồ Chí Minh, lực lượng đoàn kết quốc tế rộng lớn bao gồm phong trào cộng sản và công nhân quốc tế, phong trào giải phóng dân tộc và các lực lượng tiến bộ, yêu chuộng hòa bình, chống chiến tranh xâm lược (phản chiến). Phương án chỉ nêu giai cấp công nhân ở chính quốc là quá hẹp, còn các hiệp hội hữu nghị hay khối thương mại đa chiều là khái niệm đối ngoại hiện đại chứ không phải lực lượng cách mạng cốt lõi mà Người xác định.","Nếu đề hỏi đầy đủ 3 lực lượng cần đoàn kết quốc tế theo giáo trình, hãy chọn phương án có đủ: phong trào cộng sản và công nhân quốc tế; phong trào đấu tranh giải phóng dân tộc; các lực lượng tiến bộ, những người yêu chuộng hòa bình, dân chủ, tự do và công lý."],[203,5,"Theo Hồ Chí Minh, đại đoàn kết dân tộc là nhiệm vụ hàng đầu của Đảng, đồng thời cũng là nhiệm vụ hàng đầu của mọi giai đoạn cách mạng. Nội dung đó nhấn mạnh tới vấn đề gì?",["Sách lược của cách mạng","Mục tiêu, nhiệm vụ hàng đầu của cách mạng","Chiến lược của cách mạng","Vai trò của thực lực của cách mạng"],3,"Theo Hồ Chí Minh, thực lực của cách mạng bắt nguồn từ khối đại đoàn kết toàn dân, nên việc xác định đại đoàn kết là nhiệm vụ hàng đầu của Đảng trong mọi giai đoạn chính là nhấn mạnh vai trò tạo dựng thực lực nội sinh vững mạnh cho cách mạng. Phương án \"Sách lược của cách mạng\" sai về bản chất lâu dài, còn \"Mục tiêu, nhiệm vụ hàng đầu\" hay \"Chiến lược\" mới lặp lại hình thức câu hỏi chứ chưa chỉ ra cốt lõi là vai trò của thực lực cách mạng.","Khi đề hỏi trực tiếp về vai trò của đại đoàn kết dân tộc theo đề mục giáo trình, hãy chọn \"vấn đề chiến lược, quyết định thành công\" hoặc \"mục tiêu, nhiệm vụ hàng đầu\". Còn khi đề nhắc câu \"Thực lực là cái chiêng, ngoại giao là cái tiếng\", hãy liên hệ ngay đến nguyên tắc tự lực cánh sinh, dựa vào sức mình là chính trong đoàn kết quốc tế."],[204,5,"Lòng khoan dung, độ lượng của Hồ Chí Minh đối với những người lầm đường, lạc lối là sự biểu hiện:",["Một sách lược cách mạng nhất thời","Một thủ đoạn chính trị","Một thủ đoạn mỵ dân","Một tư tưởng nhất quán, một mục tiêu của cách mạng mà suốt đời Bác theo đuổi"],3,"Hồ Chí Minh quan niệm trong mỗi con người đều có phần thiện và phần ác, cần khơi dậy phần tốt đẹp để cảm hóa người lầm đường lạc lối cùng hướng về Tổ quốc. Lòng khoan dung, độ lượng ấy xuất phát từ bản chất nhân văn và là tư tưởng nhất quán, mục tiêu cách mạng suốt đời Người theo đuổi, hoàn toàn đối lập với \"sách lược nhất thời\", \"thủ đoạn chính trị\" hay \"thủ đoạn mỵ dân\".","Nếu đề hỏi về các điều kiện xây dựng khối đại đoàn kết toàn dân tộc gắn với nội dung này, hãy chọn \"Phải có lòng khoan dung, độ lượng với con người\" (đi cùng truyền thống yêu nước, nhân nghĩa và niềm tin vào nhân dân)."],[205,5,"Trong những khẩu hiệu tập hợp lực lượng dưới đây, khẩu hiệu nào do Hồ Chí Minh nêu lên và có giá trị đến ngày nay?",["Vô sản tất cả các nước liên hiệp lại","Vô sản các nước và các dân tộc bị áp bức trên thế giới đoàn kết lại","Lao động tất cả các nước đoàn kết lại","Nhân dân yêu chuộng hòa bình và công lý trên thế giới đoàn kết lại"],3,"Hồ Chí Minh đã kế thừa và phát triển tư tưởng đoàn kết quốc tế trong bối cảnh thời đại mới bằng khẩu hiệu \"Nhân dân yêu chuộng hòa bình và công lý trên thế giới đoàn kết lại\", giúp mở rộng tối đa lực lượng ủng hộ cách mạng và giữ nguyên giá trị đến ngày nay. \"Vô sản tất cả các nước liên hiệp lại\" là khẩu hiệu của Các Mác và Ph. Ăngghen, còn \"Vô sản các nước và các dân tộc bị áp bức trên thế giới đoàn kết lại\" là khẩu hiệu do V.I. Lênin nêu lên.","Cần nhớ chính xác tác giả của từng khẩu hiệu để tránh nhầm lẫn: Các Mác – Ăngghen nêu \"Vô sản tất cả các nước liên hiệp lại\"; V.I. Lênin bổ sung thêm \"...và các dân tộc bị áp bức\"; Hồ Chí Minh mở rộng sang toàn thể \"Nhân dân yêu chuộng hòa bình và công lý trên thế giới\"."],[206,5,"Trong kháng chiến chống đế quốc Mỹ cứu nước của ta, tên gọi nào không thuộc Mặt trận đoàn kết dân tộc?",["Mặt trận đại đoàn kết dân tộc","Mặt trận đoàn kết ba nước Đông Dương","Mặt trận nhân dân tiến bộ thế giới đoàn kết với Việt Nam","Mặt trận liên hiệp thuộc địa chống đế quốc"],3,"Trong kháng chiến chống Mỹ cứu nước, Hồ Chí Minh xây dựng 4 tầng mặt trận: Mặt trận đại đoàn kết dân tộc trong nước, Mặt trận đoàn kết ba nước Đông Dương, Mặt trận nhân dân Á – Phi đoàn kết với Việt Nam và Mặt trận nhân dân tiến bộ thế giới đoàn kết với Việt Nam. \"Mặt trận liên hiệp thuộc địa chống đế quốc\" không tồn tại trong kháng chiến chống Mỹ (dễ nhầm với Hội Liên hiệp thuộc địa thành lập tại Pháp năm 1921).","Nếu đề hỏi tổ chức đoàn kết các dân tộc thuộc địa do Nguyễn Ái Quốc tham gia sáng lập ở Pháp năm 1921, hãy chọn \"Hội Liên hiệp thuộc địa\". Còn khi hỏi 4 tầng mặt trận thời chống Mỹ, nhớ trục mở rộng: Việt Nam – Đông Dương – Á-Phi – Nhân dân thế giới."],[207,5,"Chọn phương án trả lời đúng nhất với tư tưởng Hồ Chí Minh?",["Đảng Cộng sản Việt Nam là một thành viên của Mặt trận dân tộc thống nhất","Đảng Cộng sản Việt Nam là lực lượng lãnh đạo Mặt trận dân tộc","Đảng Cộng sản Việt Nam tồn tại độc lập với Mặt trận dân tộc","Đảng Cộng sản Việt Nam vừa là thành viên, vừa là lực lượng lãnh đạo Mặt trận"],3,"Theo Hồ Chí Minh, Đảng Cộng sản Việt Nam vừa là một thành viên bình đẳng trong Mặt trận dân tộc thống nhất để cùng hiệp thương với các tổ chức khác, vừa là lực lượng lãnh đạo Mặt trận bằng đường lối đúng đắn và sự tiên phong gương mẫu. Các phương án chỉ nêu \"là một thành viên\" hoặc chỉ nêu \"là lực lượng lãnh đạo\" đều chưa đầy đủ, còn nói Đảng \"tồn tại độc lập\" là tách rời Đảng khỏi nhân dân.","Nếu đề hỏi Đảng thực hiện quyền lãnh đạo Mặt trận bằng phương thức nào, hãy chọn: bằng đường lối, chính sách đúng đắn, bằng công tác tuyên truyền, vận động, thuyết phục và sự gương mẫu của đảng viên (chứ không dùng mệnh lệnh hành chính áp đặt)."],[208,5,"Theo Hồ Chí Minh, đại đoàn kết dân tộc phải được quán triệt trong vấn đề gì?",["Chính sách của Đảng","Đường lối của Đảng và hiệp thương dân chủ","Chủ trương của Đảng và pháp luật của Nhà nước","Đường lối, chủ trương, chính sách của Đảng"],3,"Vì đại đoàn kết dân tộc là mục tiêu, nhiệm vụ hàng đầu của cách mạng nên theo Hồ Chí Minh, tư tưởng này phải được quán triệt toàn diện trong đường lối, chủ trương, chính sách của Đảng ở mọi giai đoạn. Phương án chỉ nêu \"Chính sách của Đảng\" là thiếu hụt, còn ghép thêm \"hiệp thương dân chủ\" (nguyên tắc của Mặt trận) hay \"pháp luật của Nhà nước\" đều không khớp với nội dung quán triệt trong lãnh đạo của Đảng.","Nếu đề hỏi nguyên tắc hoạt động của Mặt trận dân tộc thống nhất thì mới chọn \"Hiệp thương dân chủ\"; còn khi hỏi đại đoàn kết dân tộc phải được cụ thể hóa, quán triệt ở đâu để biến thành sức mạnh vật chất thì chọn \"Đường lối, chủ trương, chính sách của Đảng\"."],[209,5,"Theo Hồ Chí Minh, nguyên tắc hoạt động của Mặt trận dân tộc là gì?",["Tôn trọng ý kiến cá nhân","Tập trung","Thống nhất","Hiệp thương dân chủ"],3,"Mặt trận dân tộc thống nhất quy tụ nhiều giai cấp, tầng lớp, dân tộc, tôn giáo, tổ chức khác nhau nên nguyên tắc hoạt động đặc thù là \"hiệp thương dân chủ\": bàn bạc công khai, bình đẳng, tôn trọng lẫn nhau để đi tới thống nhất chung. Phương án \"Tập trung\" dễ nhầm với nguyên tắc tổ chức của Đảng, còn \"Tôn trọng ý kiến cá nhân\" hay \"Thống nhất\" đơn lẻ đều không phản ánh đúng tên nguyên tắc cơ bản của Mặt trận.","Phân biệt rõ hai nguyên tắc rất hay bị tráo đổi trong đề thi: nguyên tắc tổ chức cơ bản nhất của Đảng Cộng sản là \"Tập trung dân chủ\", còn nguyên tắc hoạt động của Mặt trận dân tộc thống nhất là \"Hiệp thương dân chủ\"."],[210,5,"Trong lời kết thúc buổi ra mắt của Đảng Lao động Việt Nam, Hồ Chí Minh nói: \"Mục đích của Đảng Lao động Việt Nam có thể gồm 8 chữ là: ĐOÀN KẾT TOÀN DÂN, PHỤNG SỰ TỔ QUỐC\". Cho biết buổi ra mắt đó vào thời gian nào?",["3-3-1950","3-3-1960","3-3-1955","3-3-1951"],3,"Sau Đại hội đại biểu toàn quốc lần thứ II của Đảng (tháng 2/1951) quyết định đưa Đảng ra hoạt động công khai với tên gọi Đảng Lao động Việt Nam, lễ ra mắt chính thức diễn ra vào ngày 3-3-1951 và Chủ tịch Hồ Chí Minh đã đọc lời kết thúc nổi tiếng gồm 8 chữ ấy. Các mốc 1950, 1955 hay 1960 (năm diễn ra Đại hội III) đều không đúng bối cảnh lịch sử.","Mẹo nhớ móc nối: Đại hội II họp tháng 2/1951 → Ra mắt Đảng Lao động Việt Nam ngày 3-3-1951. Đề có thể hỏi ngược sự kiện của câu nói này (chọn \"Kết thúc buổi ra mắt của Đảng Lao động Việt Nam\") hoặc hỏi chính xác 8 chữ mục đích của Đảng (\"Đoàn kết toàn dân, phụng sự Tổ quốc\")."],[211,5,"Câu thơ của Hồ Chí Minh: “Rằng đây bốn biển một nhà, / .......... đều là anh em.\" Chọn phương án đúng để điền vào chỗ trống.",["Bốn phương vô sản","Lao động thế giới","Công nông thế giới","Vàng đen trắng đỏ"],3,"Nguyên văn câu thơ của Hồ Chí Minh là \"Rằng đây bốn biển một nhà / Vàng đen trắng đỏ đều là anh em\", thể hiện tinh thần nhân văn rộng mở, bình đẳng giữa các dân tộc, xóa bỏ kỳ thị màu da trong đoàn kết quốc tế. Phương án \"Bốn phương vô sản\" là bẫy rất phổ biến vì xuất hiện trong một câu thơ khác của Người.","Phân biệt chặt hai câu thơ gần giống nhau để không mắc bẫy: nếu vế đầu là \"Rằng đây bốn biển một nhà\" thì điền \"Vàng đen trắng đỏ\"; còn nếu vế đầu là \"Quan sơn muôn dặm một nhà\" (năm 1960) thì mới điền \"Bốn phương vô sản\"."],[212,5,"Theo Hồ Chí Minh, một trong những nguyên tắc cơ bản nhất của đoàn kết quốc tế là gì?",["Phân biệt rõ đối tượng, đối tác, bạn, thù","Đề cao lợi ích, vị thế của dân tộc Việt Nam","Phải nghiên cứu tính chất, xu thế của thời đại","Dựa trên cơ sở thống nhất mục tiêu và lợi ích, có lý, có tình"],3,"Theo Giáo trình Tư tưởng Hồ Chí Minh, một trong hai nguyên tắc cơ bản của đoàn kết quốc tế là đoàn kết trên cơ sở thống nhất mục tiêu và lợi ích, có lý, có tình. Phương án \"Đề cao lợi ích, vị thế của dân tộc Việt Nam\" dễ lệch sang chủ nghĩa dân tộc hẹp hòi, còn \"Phân biệt đối tượng, đối tác\" hay \"nghiên cứu xu thế thời đại\" là phương pháp đối ngoại cụ thể chứ không phải nguyên tắc nền tảng trong hệ thống tư tưởng của Người.","Nhớ đủ 2 nguyên tắc đoàn kết quốc tế: (1) Thống nhất mục tiêu và lợi ích; có lý, có tình; (2) Độc lập, tự chủ (tự lực cánh sinh). Nếu đề hỏi \"có lý\" và \"có tình\" nghĩa là gì: \"có lý\" là tuân thủ nguyên tắc cơ bản của chủ nghĩa Mác – Lênin và luật pháp quốc tế; \"có tình\" là sự thông cảm, tôn trọng lẫn nhau trên tinh thần đồng chí, anh em."],[213,5,"Theo Hồ Chí Minh, muốn tăng cường đoàn kết quốc tế, các đảng cộng sản trên thế giới phải làm gì?",["Phải có chính sách giải quyết lợi ích giai cấp và dân tộc rõ ràng","Phải kết hợp được sức mạnh 3 dòng thác cách mạng: Phong trào công nhân, cách mạng giải phóng dân tộc và cách mạng xã hội chủ nghĩa","Phải kết hợp được sức mạnh của cả dân tộc với sức mạnh thời đại","Giáo dục chủ nghĩa yêu nước chân chính kết hợp với chủ nghĩa quốc tế vô sản cho nhân dân"],3,"Hồ Chí Minh chỉ rõ muốn tăng cường đoàn kết quốc tế, các đảng cộng sản phải đẩy mạnh giáo dục chủ nghĩa yêu nước chân chính kết hợp chặt chẽ với chủ nghĩa quốc tế vô sản cho nhân dân, qua đó khắc phục chủ nghĩa dân tộc hẹp hòi và chủ nghĩa sôvanh nước lớn. Các phương án nói về kết hợp 3 dòng thác hay kết hợp sức mạnh dân tộc với thời đại là nội dung và mục tiêu tổng quát, chưa trúng nhiệm vụ giáo dục trực tiếp của các đảng cộng sản.","Khi đề hỏi yếu tố tư tưởng nào giúp chống lại cả chủ nghĩa dân tộc vị kỷ lẫn chủ nghĩa sôvanh nước lớn trong đoàn kết quốc tế, hãy chọn sự kết hợp giữa \"chủ nghĩa yêu nước chân chính\" và \"chủ nghĩa quốc tế vô sản\"."],[214,5,"Theo Hồ Chí Minh, trong xây dựng khối đại đoàn kết dân tộc cần giải quyết hài hòa mối quan hệ nào?",["Giữa dân tộc Việt Nam với thực dân cướp nước","Giữa nông dân với địa chủ, phong kiến","Giữa công nhân với các giai cấp khác","Giữa dân tộc và giai cấp"],3,"Trong xây dựng khối đại đoàn kết dân tộc, Hồ Chí Minh yêu cầu giải quyết hài hòa mối quan hệ giữa dân tộc và giai cấp: đặt lợi ích tối cao của dân tộc lên trên hết nhưng vẫn chăm lo quyền lợi chính đáng của các giai cấp, tầng lớp nhân dân. Quan hệ giữa dân tộc Việt Nam với thực dân cướp nước là mâu thuẫn đối kháng phải đánh đổ chứ không thể hài hòa, còn quan hệ giữa nông dân với địa chủ hay công nhân với giai cấp khác chỉ là phạm vi hẹp.","Nếu đề hỏi phải đứng trên lập trường giai cấp nào để giải quyết hài hòa quan hệ dân tộc và giai cấp, hãy chọn \"Giai cấp công nhân\". Nếu hỏi nền tảng của khối đại đoàn kết dân tộc, hãy chọn \"Liên minh công nhân – nông dân – trí thức\"."],[215,5,"Hồ Chí Minh viết: “Đoàn kết trong .......... nhân dân ta đã làm Cách mạng Tháng Tám thành công, lập nên nước Việt Nam Dân chủ Cộng hòa”. Chọn phương án đúng để điền vào chỗ trống.",["Mặt trận dân chủ","Mặt trận Tổ quốc Việt Nam","Mặt trận Liên Việt","Mặt trận Việt Minh"],3,"Mặt trận Việt Minh (Việt Nam Độc lập Đồng minh, thành lập tháng 5/1941) là tổ chức đã đoàn kết toàn dân làm nên thắng lợi của Cách mạng Tháng Tám 1945, khai sinh nước Việt Nam Dân chủ Cộng hòa. Mặt trận Dân chủ thuộc giai đoạn 1936–1939, Mặt trận Liên Việt gắn với kháng chiến chống Pháp (1951–1954), còn Mặt trận Tổ quốc Việt Nam ra đời năm 1955.","Ghi nhớ trọn bộ 3 câu trích song hành của Hồ Chí Minh theo đúng mốc lịch sử: Cách mạng Tháng Tám 1945 → \"Mặt trận Việt Minh\"; Kháng chiến chống Pháp, giải phóng miền Bắc 1954 → \"Mặt trận Liên Việt\"; Khôi phục kinh tế, xây dựng CNXH ở miền Bắc từ 1955 → \"Mặt trận Tổ quốc Việt Nam\"."],[216,5,"Hồ Chí Minh viết: “Đoàn kết trong .......... nhân dân ta đã kháng chiến thắng lợi, lập lại hòa bình ở Đông Dương, hoàn toàn giải phóng miền Bắc”. Chọn phương án đúng để điền vào chỗ trống.",["Mặt trận dân chủ","Mặt trận Tổ quốc Việt Nam","Mặt trận Việt Minh","Mặt trận Liên Việt"],3,"Tháng 3/1951, Mặt trận Việt Minh hợp nhất với Hội Liên Việt thành Mặt trận Liên Việt, quy tụ sức mạnh toàn dân đưa cuộc kháng chiến chống thực dân Pháp tới thắng lợi năm 1954, lập lại hòa bình ở Đông Dương và giải phóng hoàn toàn miền Bắc. Không chọn Mặt trận Việt Minh (gắn với Cách mạng Tháng Tám 1945) hay Mặt trận Tổ quốc Việt Nam (thành lập sau khi hòa bình lập lại ở miền Bắc năm 1955).","Chú ý từ khóa định vị thời kỳ trong câu trích: thấy \"Cách mạng Tháng Tám\" chọn Mặt trận Việt Minh; thấy \"lập lại hòa bình ở Đông Dương, hoàn toàn giải phóng miền Bắc\" chọn Mặt trận Liên Việt; thấy \"khôi phục kinh tế, cải tạo và xây dựng CNXH ở miền Bắc\" chọn Mặt trận Tổ quốc Việt Nam."],[217,5,"Theo Hồ Chí Minh, có mấy điều kiện để xây dựng khối đại đoàn kết toàn dân tộc?",["Hai","Bốn","Năm","Ba"],3,"Theo hệ thống phân loại truyền thống trong Giáo trình Tư tưởng Hồ Chí Minh (khớp với bộ câu hỏi trắc nghiệm chuẩn này), có ba điều kiện cơ bản để xây dựng khối đại đoàn kết toàn dân tộc: kế thừa truyền thống yêu nước, nhân nghĩa, đoàn kết của dân tộc; có lòng khoan dung, độ lượng với con người; và có niềm tin vào nhân dân. Vì vậy các đáp án \"Hai\", \"Bốn\", \"Năm\" không khớp đáp án chuẩn của câu hỏi này.","Lưu ý phân biệt giữa hai bản giáo trình: bản tái bản mới tách thêm điều kiện \"lấy lợi ích chung làm điểm quy tụ\" thành 4 điều kiện, nhưng trong ngân hàng đề chuẩn hiện hành câu đếm số điều kiện vẫn chốt là \"Ba\". Đừng nhầm với 4 nguyên tắc xây dựng Mặt trận hay 3 chức năng văn hóa."],[218,5,"Theo Hồ Chí Minh, sức mạnh thời đại sau Chiến tranh thế giới thứ hai được tạo ra từ những yếu tố nào?",["Sức mạnh của khoa học công nghệ","Sức mạnh của cuộc cách mạng khoa học kỹ thuật và công nghệ","Sức mạnh của khoa học công nghệ, hội nhập và con người","Hệ thống xã hội chủ nghĩa thế giới; phong trào giải phóng dân tộc và phong trào đấu tranh vì hoà bình, dân chủ, tiến bộ xã hội"],3,"Sau Chiến tranh thế giới thứ hai, Hồ Chí Minh xác định sức mạnh thời đại được tạo thành từ ba dòng thác cách mạng lớn: hệ thống xã hội chủ nghĩa thế giới hình thành và phát triển, phong trào giải phóng dân tộc dâng cao, cùng phong trào đấu tranh vì hòa bình, dân chủ, tiến bộ xã hội. Các phương án chỉ nhấn mạnh khoa học công nghệ hay hội nhập phản ánh bối cảnh hiện đại sau này, chưa nêu đúng các yếu tố chính trị – cách mạng thời kỳ hậu Thế chiến II.","Nếu đề chuyển sang hỏi \"Sức mạnh dân tộc gồm những yếu tố nào?\", hãy chọn: chủ nghĩa yêu nước, tinh thần đoàn kết, ý chí đấu tranh anh dũng bất khuất và tinh thần tự lực tự cường của dân tộc Việt Nam."],[219,5,"Tên gọi nào dưới đây là tổ chức của khối đại đoàn kết dân tộc Việt Nam?",["Mặt trận nhân dân thế giới đoàn kết với Việt Nam chống xâm lược","Mặt trận độc lập đồng minh","Mặt trận thống nhất của nhân dân chính quốc và thuộc địa","Mặt trận dân tộc thống nhất"],3,"Trong tư tưởng Hồ Chí Minh, \"Mặt trận dân tộc thống nhất\" là tên gọi chung chỉ hình thức tổ chức của khối đại đoàn kết toàn dân tộc Việt Nam (với các tên gọi cụ thể từng thời kỳ như Hội Phản đế đồng minh, Việt Minh, Liên Việt, Mặt trận Tổ quốc Việt Nam). \"Mặt trận nhân dân thế giới...\" thuộc đoàn kết quốc tế, còn hai phương án kia không phải danh xưng chuẩn trong tư tưởng Hồ Chí Minh.","Nếu đề hỏi tên gọi đầu tiên của Mặt trận dân tộc thống nhất (1930) thì chọn \"Hội Phản đế đồng minh\"; nếu hỏi tên gọi từ sau khi thống nhất đất nước (1976) đến nay thì chọn \"Mặt trận Tổ quốc Việt Nam\"."],[220,5,"Câu \"Mục đích của Đảng Lao động Việt Nam có thể gồm 8 chữ là: ĐOÀN KẾT TOÀN DÂN, PHỤNG SỰ TỔ QUỐC\" được Hồ Chí Minh nói ở đâu?",["Trong chuyến thăm lực lượng Thanh niên xung phong (ngày 28/3/1951)","Trong Đại hội thi đua yêu nước lần thứ II (7/1958)","Trong Đại hội thi đua yêu nước lần thứ nhất (5/1952)","Kết thúc buổi ra mắt của Đảng Lao động Việt Nam"],3,"Câu khẳng định mục đích 8 chữ \"ĐOÀN KẾT TOÀN DÂN, PHỤNG SỰ TỔ QUỐC\" được Hồ Chí Minh nói trong lời kết thúc buổi ra mắt của Đảng Lao động Việt Nam ngày 3-3-1951. Các mốc sự kiện khác như chuyến thăm Thanh niên xung phong (28/3/1951) hay Đại hội thi đua yêu nước lần I, II gắn với những lời căn dặn khác của Người.","Đừng nhầm với chuyến thăm Thanh niên xung phong (28/3/1951), nơi Bác tặng 4 câu thơ \"Không có việc gì khó / Chỉ sợ lòng không bền...\". Nếu đề hỏi thời gian của buổi ra mắt Đảng Lao động Việt Nam thì chọn ngày 3-3-1951."],[221,5,"Hồ Chí Minh viết: “Đoàn kết trong .......... nhân dân ta đã giành được thắng lợi trong công cuộc khôi phục kinh tế, cải tạo xã hội chủ nghĩa và trong sự nghiệp xây dựng chủ nghĩa xã hội ở miền Bắc”. Chọn phương án đúng để điền vào chỗ trống.",["Mặt trận dân chủ","Mặt trận Liên Việt","Mặt trận Việt Minh","Mặt trận Tổ quốc Việt Nam"],3,"Tháng 9/1955, Mặt trận Tổ quốc Việt Nam được thành lập nhằm mở rộng khối đại đoàn kết toàn dân cho giai đoạn cách mạng mới: khôi phục kinh tế, cải tạo xã hội chủ nghĩa, xây dựng chủ nghĩa xã hội ở miền Bắc và đấu tranh thống nhất nước nhà. Mặt trận Việt Minh gắn với Cách mạng Tháng Tám 1945, Mặt trận Liên Việt gắn với kháng chiến chống Pháp, còn Mặt trận Dân chủ thuộc giai đoạn 1936–1939.","Nếu đề hỏi thêm tổ chức mặt trận được thành lập ở miền Nam trong kháng chiến chống Mỹ (ngày 20/12/1960), hãy chọn \"Mặt trận Dân tộc giải phóng miền Nam Việt Nam\"."],[222,5,"Từ nhận thức, đại đoàn kết dân tộc là một nhu cầu, đòi hỏi khách quan của sự nghiệp cách mạng do quần chúng tiến hành, Hồ Chí Minh đã đi đến kết luận gì?",["Đại đoàn kết dân tộc trước hết phải đoàn kết đại đa số nhân dân","Coi trọng xây dựng tinh thần đoàn kết với các nước láng giềng","Đại đoàn kết dân tộc phải gắn với đoàn kết quốc tế","Đại đoàn kết dân tộc là mục tiêu, nhiệm vụ hàng đầu của Đảng, của dân tộc"],3,"Xuất phát từ quan điểm cách mạng là sự nghiệp của quần chúng và đại đoàn kết là đòi hỏi khách quan để quần chúng phát huy sức mạnh, Hồ Chí Minh đi đến kết luận: đại đoàn kết dân tộc là mục tiêu, nhiệm vụ hàng đầu của Đảng, của dân tộc. Các phương án như đoàn kết đại đa số nhân dân, đoàn kết láng giềng hay gắn với đoàn kết quốc tế nói về phạm vi và mối liên hệ chứ không phải kết luận về vị trí mục tiêu, nhiệm vụ hàng đầu.","Ghi nhớ cặp luận điểm về vai trò của đại đoàn kết dân tộc: khi đề nhắc \"nhu cầu, đòi hỏi khách quan của sự nghiệp cách mạng do quần chúng tiến hành\" thì chọn \"mục tiêu, nhiệm vụ hàng đầu của Đảng, của dân tộc\"; khi đề nhắc \"nhân tố quyết định thắng lợi\" thì chọn \"vấn đề chiến lược\"."],[223,5,"Theo Hồ Chí Minh, trong mỗi giai đoạn cách mạng có những yêu cầu và nhiệm vụ, chính sách, phương pháp tập hợp lực lượng khác nhau, nên phải điều chỉnh cho phù hợp từng đối tượng, nhưng không bao giờ được thay đổi gì?",["Đường lối đoàn kết quốc tế","Chủ trương liên minh công - nông - trí thức","Lập trường tư tưởng giai cấp công nhân","Chủ trương đại đoàn kết toàn dân tộc"],3,"Hồ Chí Minh khẳng định tùy từng giai đoạn cách mạng mà chính sách, phương pháp tập hợp lực lượng có thể thay đổi linh hoạt cho phù hợp từng đối tượng, nhưng \"chủ trương đại đoàn kết toàn dân tộc\" mang ý nghĩa chiến lược nên tuyệt đối không bao giờ được thay đổi. Các phương án về đoàn kết quốc tế, liên minh công – nông – trí thức hay lập trường giai cấp công nhân tuy quan trọng nhưng không khớp trực tiếp luận điểm về tính bất biến chiến lược của đại đoàn kết dân tộc.","Nếu đề hỏi \"Tại sao không bao giờ được thay đổi chủ trương đại đoàn kết toàn dân tộc?\", hãy chọn lý do: vì đại đoàn kết là vấn đề chiến lược lâu dài, quyết định thành công của cách mạng chứ không phải sách lược nhất thời."],[224,5,"Theo Hồ Chí Minh, một trong những điều kiện để thực hiện đại đoàn kết dân tộc là gì?",["Tuyên truyền chủ trương, đường lối của Đảng, chính sách, pháp luật của Nhà nước","Đổi mới nội dung, phương thức hoạt động của Mặt trận dân tộc thống nhất","Mở rộng dân chủ và giữ vững kỷ cương trong đời sống xã hội","Kế thừa truyền thống yêu nước, nhân nghĩa của dân tộc"],3,"Trong tư tưởng Hồ Chí Minh, \"kế thừa truyền thống yêu nước, nhân nghĩa của dân tộc\" là một trong những điều kiện cốt lõi để thực hiện đại đoàn kết dân tộc, bởi đây là giá trị tinh thần bền chặt gắn kết mọi người Việt Nam qua hàng nghìn năm lịch sử. Các phương án như tuyên truyền pháp luật, đổi mới phương thức hoạt động của Mặt trận hay giữ vững kỷ cương là giải pháp vận dụng hiện nay chứ không thuộc nhóm điều kiện kinh điển trong tư tưởng của Người.","Học thuộc đầy đủ các điều kiện thực hiện đại đoàn kết toàn dân tộc để nhận diện nhanh mọi biến thể đề: kế thừa truyền thống yêu nước – nhân nghĩa – đoàn kết; có lòng khoan dung, độ lượng với con người; có niềm tin vào nhân dân (và lấy lợi ích chung làm điểm quy tụ)."],[225,5,"Nói về đoàn kết dân tộc, Hồ Chí Minh đọc câu thơ: \"Chúng ta đoàn kết một nhà, / Ấy là nghĩa trọng, ấy là tình sâu ...\" Bác đọc trong lúc đi thăm nơi nào?",["Cao Bằng","Hà Nội","Thái Nguyên","Nghệ An"],3,"Hai câu thơ \"Chúng ta đoàn kết một nhà / Ấy là nghĩa trọng, ấy là tình sâu...\" được Chủ tịch Hồ Chí Minh đọc trong dịp về thăm quê hương Nghệ An (tháng 6/1957), căn dặn cán bộ và đồng bào tỉnh nhà nêu cao tinh thần đoàn kết. Các địa phương Cao Bằng, Hà Nội, Thái Nguyên là những phương án nhiễu dễ gây nhầm với các chuyến công tác khác của Bác.","Cũng trong dịp về thăm quê hương Nghệ An, Bác còn đọc hai câu thơ rất quen thuộc: \"Quê hương nghĩa trọng tình cao / Năm mươi năm ấy biết bao nhiêu tình\". Hễ thấy cặp chữ \"nghĩa trọng – tình sâu\" hoặc \"nghĩa trọng – tình cao\", hãy liên hệ ngay tới quê hương Nghệ An."],[226,5,"Hồ Chí Minh viết: “Đoàn kết, đoàn kết, đại đoàn kết / Thành công, thành công, đại thành công!\" Được trích trong tác phẩm nào?",["Bài nói chuyện trong buổi lễ bế mạc Đại hội thành lập Mặt trận Tổ quốc Việt Nam","Bài nói chuyện tại Hội nghị mở rộng Ủy ban Trung ương Mặt trận Tổ quốc Việt Nam","Bài nói chuyện Đại hội đại biểu Mặt trận Tổ quốc Việt Nam lần thứ II","Bài nói chuyện tại lớp bồi dưỡng cán bộ về công tác Mặt trận"],3,"Câu nói nổi tiếng \"Đoàn kết, đoàn kết, đại đoàn kết / Thành công, thành công, đại thành công!\" được Giáo trình Tư tưởng Hồ Chí Minh trích dẫn chuẩn từ \"Bài nói chuyện tại lớp bồi dưỡng cán bộ về công tác Mặt trận\" (tháng 8/1962, Hồ Chí Minh toàn tập, tập 13). Vì vậy cần loại các phương án gây nhiễu cùng nhắc đến Mặt trận như lễ bế mạc Đại hội thành lập hay Hội nghị mở rộng Ủy ban Trung ương Mặt trận Tổ quốc Việt Nam.","Nếu đề hỏi ý nghĩa của câu nói \"Đoàn kết, đoàn kết, đại đoàn kết...\", hãy chọn: khẳng định đại đoàn kết dân tộc là vấn đề có ý nghĩa chiến lược, quyết định thành công của cách mạng. Mốc thời gian của bài nói chuyện này là tháng 8/1962."],[227,5,"Trong số những luận điểm dưới đây, luận điểm nào được Hồ Chí Minh viết trong Di chúc?",["Để thực hành đoàn kết phải có tấm lòng khoan dung đại độ với con người","Ta đoàn kết để đấu tranh cho thống nhất và độc lập của Tổ quốc","Ai có tài, có đức, có lòng phụng sự Tổ quốc và phục vụ nhân dân thì ta đoàn kết với họ","Đoàn kết là một truyền thống cực kỳ quý báu của Đảng và nhân dân ta"],3,"Luận điểm \"Đoàn kết là một truyền thống cực kỳ quý báu của Đảng và nhân dân ta\" được Chủ tịch Hồ Chí Minh viết trang trọng trong phần đầu bản Di chúc lịch sử (1965–1969), gắn với lời căn dặn giữ gìn sự đoàn kết nhất trí trong Đảng. Ba luận điểm còn lại là lời phát biểu của Người trong các bài nói chuyện về Mặt trận và công tác đại đoàn kết ở những thời điểm khác, không có trong văn bản Di chúc.","Ngay sau câu này trong Di chúc, Bác căn dặn phải giữ gìn sự đoàn kết nhất trí của Đảng \"như giữ gìn con ngươi của mắt mình\" và biện pháp tốt nhất là \"thực hành dân chủ rộng rãi, thường xuyên và nghiêm chỉnh tự phê bình và phê bình\"."],[228,5,"Theo tư tưởng Hồ Chí Minh: \"Đảng không thể đòi hỏi Mặt trận thừa nhận quyền lãnh đạo của mình, mà phải tỏ ra là một bộ phận .......... và chân thực nhất. Chỉ trong đấu tranh và công tác hàng ngày, khi quần chúng rộng rãi thừa nhận chính sách đúng đắn và năng lực lãnh đạo của Đảng, thì Đảng mới giành được địa vị lãnh đạo\"? Chọn phương án đúng để điền vào chỗ trống.",["Đoàn kết nhất, giỏi giang nhất","Kiên cường nhất, trung thành nhất","Đoàn kết nhất, trí tuệ nhất","Trung thành nhất, hoạt động nhất"],3,"Nguyên văn trích dẫn của Hồ Chí Minh khẳng định Đảng phải tỏ ra là một bộ phận \"trung thành nhất, hoạt động nhất và chân thực nhất\" trong Mặt trận, qua đó chinh phục niềm tin của quần chúng để được thừa nhận vai trò lãnh đạo chứ không thể tự đòi hỏi. Các cặp từ như \"giỏi giang nhất\", \"kiên cường nhất\" hay \"trí tuệ nhất\" đều bị thay đổi so với nguyên văn tác phẩm.","Nhớ bộ 3 cụm từ đi liền nhau của Đảng trong Mặt trận: \"trung thành nhất – hoạt động nhất – chân thực nhất\". Nếu đề hỏi câu trích này nói về vấn đề gì, hãy chọn: phương thức khẳng định vai trò lãnh đạo của Đảng đối với Mặt trận dân tộc thống nhất."],[229,5,"Kết hợp sức mạnh dân tộc với sức mạnh thời đại theo tư tưởng Hồ Chí Minh là gì?",["Xây dựng đất nước phồn vinh, hội nhập quốc tế","Xây dựng lực lượng trong nước kết hợp các lực lượng đoàn kết quốc tế vì hòa bình dân chủ và tiến bộ xã hội","Phát huy sức mạnh tổng hợp của dân tộc kết hợp với ứng dụng những thành tựu của khoa học công nghệ hiện đại","Kết hợp chủ nghĩa yêu nước chân chính với chủ nghĩa quốc tế vô sản; đoàn kết với các lực lượng tiến bộ trên thế giới"],3,"Theo tư tưởng Hồ Chí Minh, kết hợp sức mạnh dân tộc với sức mạnh thời đại thực chất là kết hợp chủ nghĩa yêu nước chân chính với chủ nghĩa quốc tế vô sản, đồng thời đoàn kết rộng rãi với các lực lượng tiến bộ trên thế giới để tạo nên sức mạnh tổng hợp cho cách mạng. Các phương án chỉ nhấn mạnh hội nhập quốc tế hay ứng dụng khoa học công nghệ mang sắc thái kinh tế hiện đại, còn phương án \"xây dựng lực lượng trong nước kết hợp...\" chưa chỉ rõ bản chất tư tưởng cốt lõi là chủ nghĩa yêu nước chân chính gắn với chủ nghĩa quốc tế vô sản.","Nếu đề hỏi sự cần thiết phải đoàn kết quốc tế theo Hồ Chí Minh, nhớ 2 ý lớn: (1) Kết hợp sức mạnh dân tộc với sức mạnh thời đại, tạo sức mạnh tổng hợp cho cách mạng; (2) Góp phần cùng nhân dân thế giới thực hiện thắng lợi các mục tiêu cách mạng của thời đại."],[230,5,"Hồ Chí Minh khẳng định: “Nếu chỉ có tinh thần yêu nước chưa đủ, cách mạng muốn “thành công và thành công đến nơi”, phải .......... có thể tập hợp, xây dựng được khối đại đoàn kết dân tộc bền vững”. Chọn phương án đúng để điền vào chỗ trống.",["Có chiến lược lôi kéo mọi lực lượng","Tuyên truyền, kêu gọi mọi người gắn kết lại mới","Quy tụ tất cả các tầng lớp, giai cấp để","Tập hợp được tất cả mọi lực lượng"],3,"Hồ Chí Minh chỉ rõ chỉ có tinh thần yêu nước tự phát thì chưa đủ; muốn cách mạng \"thành công và thành công đến nơi\", phải \"tập hợp được tất cả mọi lực lượng\" có thể tập hợp để xây dựng khối đại đoàn kết dân tộc bền vững. Các phương án dùng từ \"lôi kéo\", \"tuyên truyền, kêu gọi\" hay \"quy tụ tất cả các tầng lớp, giai cấp để\" đều không khớp nguyên văn và không diễn đạt chuẩn tính bao quát mọi lực lượng có thể tập hợp.","Nếu đề hỏi chủ thể (lực lượng) của khối đại đoàn kết toàn dân tộc là ai, hãy chọn: toàn thể nhân dân Việt Nam không phân biệt giai cấp, tầng lớp, dân tộc, tôn giáo, đảng phái hay ở trong nước và nước ngoài, miễn có lòng yêu nước."],[231,5,"Theo Hồ Chí Minh, trong quá trình xây dựng khối đại đoàn kết dân tộc phải đứng vững trên lập trường của giai cấp nào?",["Nông dân","Công nhân và Nông dân","Không giai cấp nào","Công nhân"],3,"Theo Hồ Chí Minh, để xây dựng khối đại đoàn kết rộng rãi mà vẫn giữ vững định hướng cách mạng, phải đứng vững trên lập trường của giai cấp công nhân – giai cấp tiên tiến nhất có khả năng giải quyết hài hòa quan hệ giữa dân tộc và giai cấp. \"Nông dân\" hay \"Công nhân và Nông dân\" thuộc lực lượng nền tảng chứ không phải lập trường lãnh đạo, còn \"Không giai cấp nào\" là quan điểm phi giai cấp sai lầm.","Phân biệt nhanh 3 câu hỏi rất dễ nhầm: đứng vững trên lập trường giai cấp nào → \"Giai cấp công nhân\"; nền tảng của khối đại đoàn kết là gì → \"Liên minh công nhân – nông dân – trí thức\"; lực lượng lãnh đạo là ai → \"Đảng Cộng sản Việt Nam\"."],[232,5,"Câu: “Đại đoàn kết phải được xây dựng trên cơ sở thống nhất giữa lợi ích dân tộc với lợi ích quốc tế; giữa lợi ích tối cao của dân tộc với quyền lợi cơ bản, chính đáng của các tầng lớp nhân dân”. Nội dung đó nhấn mạnh tới vấn đề gì?",["Mục tiêu xây dựng khối đại đoàn kết dân tộc","Chiến lược xây dựng khối đại đoàn kết dân tộc","Nội dung xây dựng khối đại đoàn kết dân tộc","Nguyên tắc xây dựng khối đại đoàn kết dân tộc"],3,"Việc xây dựng đại đoàn kết trên cơ sở thống nhất lợi ích dân tộc với lợi ích quốc tế và hài hòa lợi ích tối cao của dân tộc với quyền lợi chính đáng của các tầng lớp nhân dân là nguyên tắc xây dựng khối đại đoàn kết dân tộc (lấy lợi ích chung làm điểm quy tụ). Nội dung này quy định chuẩn mực tổ chức, xử lý quan hệ lợi ích nên không phải mục tiêu, chiến lược hay nội dung hoạt động.","Cả câu 232 và câu 233 đều có chung dấu hiệu nhận biết đáp án \"Nguyên tắc xây dựng khối đại đoàn kết dân tộc\": khi câu dẫn nêu yêu cầu nền tảng như \"trên cơ sở thống nhất lợi ích...\" hoặc \"tự giác, có tổ chức, có lãnh đạo; lâu dài, chặt chẽ\"."],[233,5,"Câu “đoàn kết một cách tự giác, có tổ chức, có lãnh đạo; đoàn kết lâu dài, chặt chế”. Nội dung đó nhấn mạnh tới vấn đề gì?",["Mục tiêu xây dựng khối đại đoàn kế
