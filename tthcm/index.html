t dân tộc","Chiến lược xây dựng khối đại đoàn kết dân tộc","Nội dung xây dựng khối đại đoàn kết dân tộc","Nguyên tắc xây dựng khối đại đoàn kết dân tộc"],3,"Hồ Chí Minh yêu cầu đoàn kết phải tự giác, có tổ chức (Mặt trận), có sự lãnh đạo của Đảng và đoàn kết lâu dài, chặt chẽ, chân thành chứ không tập hợp tự phát hay nhất thời. Đây chính là nguyên tắc xây dựng khối đại đoàn kết dân tộc nhằm bảo đảm khối đoàn kết vững chắc và phát huy hiệu quả, không phải mục tiêu, chiến lược hay nội dung cụ thể.","Nếu đề hỏi cụ thể các nguyên tắc xây dựng và hoạt động của Mặt trận dân tộc thống nhất, nhớ 4 ý: xây dựng trên nền tảng liên minh công – nông – trí thức dưới sự lãnh đạo của Đảng; xuất phát từ mục tiêu vì nước, vì dân; hoạt động theo nguyên tắc hiệp thương dân chủ; đoàn kết lâu dài, chặt chẽ, chân thành, thân ái giúp đỡ nhau cùng tiến bộ."],[234,6,"Hồ Chí Minh đưa ra bao nhiêu điểm lớn để định hướng cho việc xây dựng nền văn hóa dân tộc?",["Ba","Bốn","Sáu","Năm"],3,"Tháng 8/1943, cuối tập Nhật ký trong tù, Hồ Chí Minh đã nêu lên 5 điểm lớn định hướng xây dựng nền văn hóa dân tộc: xây dựng tâm lý, xây dựng luân lý, xây dựng xã hội, xây dựng chính trị và xây dựng kinh tế. Do đó các con số \"Ba\", \"Bốn\", \"Sáu\" đều không chính xác.","Đề thường hỏi nội dung chi tiết từng điểm trong 5 điểm lớn: xây dựng tâm lý (tinh thần độc lập tự cường), luân lý (biết hy sinh mình, làm lợi cho quần chúng), xã hội (mọi sự nghiệp liên quan phúc lợi nhân dân), chính trị (dân quyền), kinh tế; và mốc thời gian ra đời là tháng 8/1943."],[235,6,"Hồ Chí Minh có mấy cách tiếp cận chủ yếu về văn hóa?",["Hai","Ba","Năm","Bốn"],3,"Theo Giáo trình Tư tưởng Hồ Chí Minh, Người có 4 cách tiếp cận chủ yếu về văn hóa: theo nghĩa rộng (tổng hợp mọi phương thức sinh hoạt của con người); theo nghĩa hẹp (đời sống tinh thần xã hội, thuộc kiến trúc thượng tầng); theo nghĩa hẹp hơn (bàn đến trường học, số người đi học, xóa mù chữ...); và tiếp cận theo phương thức sử dụng công cụ sinh hoạt. Các con số \"Hai\", \"Ba\", \"Năm\" đều không khớp hệ thống 4 cách tiếp cận này.","Học thuộc bộ số Chương 6 để không nhầm giữa các câu đếm số: 4 cách tiếp cận văn hóa – 5 điểm lớn xây dựng nền văn hóa dân tộc – 3 chức năng chủ yếu của văn hóa – 3 tính chất của nền văn hóa (dân tộc, khoa học, đại chúng)."],[236,6,"Theo Hồ Chí Minh, văn hóa có bao nhiêu chức năng chủ yếu?",["Hai","Bốn","Năm","Ba"],3,"Theo Hồ Chí Minh, văn hóa có 3 chức năng chủ yếu: (1) Bồi dưỡng tư tưởng đúng đắn và những tình cảm cao đẹp; (2) Mở rộng hiểu biết, nâng cao dân trí; (3) Bồi dưỡng những phẩm chất, phong cách và lối sống tốt đẹp, lành mạnh, hướng con người đến chân – thiện – mỹ. Vì vậy các phương án \"Hai\", \"Bốn\", \"Năm\" đều sai số lượng.","Nếu đề trích cụ thể một chức năng (chẳng hạn \"nâng cao dân trí\" hoặc \"hướng con người đến chân – thiện – mỹ\") và hỏi đó là vai trò hay chức năng của văn hóa, hãy xếp vào 3 chức năng chủ yếu của văn hóa."],[237,6,"Theo Hồ Chí Minh, mặt trận văn hóa văn nghệ được thể hiện trên mấy quan điểm chủ yếu?",["Ba","Năm","Sáu","Bốn"],3,"Trong tư tưởng Hồ Chí Minh, mặt trận văn hóa văn nghệ được thể hiện trên 4 quan điểm chủ yếu: văn hóa nghệ thuật là một mặt trận; văn nghệ sĩ là chiến sĩ trên mặt trận ấy; tác phẩm văn nghệ phải gắn bó với thực tiễn đời sống và phục vụ nhân dân; văn nghệ phải giàu tính chân thực và sức chiến đấu (phò chính trừ tà, biểu dương cái đẹp và phê phán cái xấu). Do đó các đáp án \"Ba\", \"Năm\", \"Sáu\" đều không chính xác.","Nếu đề hỏi xuất xứ câu \"Văn hóa nghệ thuật cũng là một mặt trận. Anh chị em là chiến sĩ trên mặt trận ấy\", hãy chọn \"Thư gửi các họa sĩ nhân dịp triển lãm hội họa năm 1951\" (ngày 10/12/1951)."],[238,6,"Tác phẩm Đời sống mới của Hồ Chí Minh xuất bản thời gian nào?",["1948","1946","1945","1947"],3,"Tác phẩm \"Đời sống mới\" do Chủ tịch Hồ Chí Minh viết với bút danh Tân Sinh được xuất bản vào tháng 3 năm 1947 nhằm vận động cán bộ, nhân dân thực hành Cần, Kiệm, Liêm, Chính ngay từ đầu cuộc kháng chiến chống thực dân Pháp. Năm 1945 gắn với Tuyên ngôn Độc lập, năm 1946 gắn với Lời kêu gọi toàn quốc kháng chiến, còn năm 1948 gắn với Lời kêu gọi thi đua ái quốc.","Ghi nhớ bộ mốc thời gian và bút danh các tác phẩm đạo đức tiêu biểu của Bác: \"Đời sống mới\" (Tân Sinh, 3/1947); \"Sửa đổi lối làm việc\" (X.Y.Z, 10/1947); \"Cần, Kiệm, Liêm, Chính\" (Lê Quyết Thắng, 1949); \"Đạo đức cách mạng\" (Trần Lực, 1958)."],[239,6,"Một trong những nguồn gốc hình thành tư tưởng đạo đức Hồ Chí Minh là gì?",["Truyền thống chống ngoại xâm của dân tộc Việt Nam","Tư tưởng Nho giáo và tinh thần cộng đồng làng xã của các dân tộc phương Đông","Cảnh ngộ của các dân tộc thuộc địa","Tư tưởng đạo đức của Mác - Ăngghen và Lênin"],3,"Tư tưởng đạo đức Hồ Chí Minh bắt nguồn từ ba cơ sở: truyền thống đạo đức tốt đẹp của dân tộc Việt Nam, tinh hoa đạo đức nhân loại và tư tưởng đạo đức của Mác – Ăngghen và Lênin (nhân tố quyết định bản chất khoa học, cách mạng). \"Truyền thống chống ngoại xâm\" thiên về lịch sử đấu tranh vũ trang, còn \"tư tưởng Nho giáo và cộng đồng làng xã\" hay \"cảnh ngộ thuộc địa\" không khái quát chuẩn xác nguồn gốc lý luận đạo đức của Người.","Nếu đề hỏi nguồn gốc nào đóng vai trò quyết định bước nhảy vọt về chất, tạo nên bản chất cách mạng của tư tưởng đạo đức Hồ Chí Minh, hãy chọn \"Chủ nghĩa Mác – Lênin\" (tư tưởng đạo đức của Mác – Ăngghen và Lênin)."],[240,6,"Những phẩm chất đạo đức cơ bản của con người Việt Nam trong thời đại mới theo tư tưởng Hồ Chí Minh là gì?",["Trung với nước, hiếu với dân, yêu thương con người","Trung với nước hiếu với dân, cần, kiệm, liêm, chính, chí công vô tư","Trung thành với sự nghiệp dựng nước và tinh thần quốc tế trong sáng","Trung với nước hiếu với dân, yêu thương con người, cần kiệm liêm chính, chí công vô tư, tinh thần quốc tế trong sáng"],3,"Theo Giáo trình Tư tưởng Hồ Chí Minh, con người Việt Nam trong thời đại mới cần rèn luyện đầy đủ 4 phẩm chất (chuẩn mực) đạo đức cơ bản: trung với nước, hiếu với dân; cần, kiệm, liêm, chính, chí công vô tư; yêu thương con người, sống có tình có nghĩa; và tinh thần quốc tế trong sáng. Ba phương án còn lại đều liệt kê thiếu ít nhất một trong bốn chuẩn mực cốt lõi này.","Nếu đề hỏi riêng từng chuẩn mực: phẩm chất nào bao trùm, quan trọng nhất, chi phối các phẩm chất khác → \"Trung với nước, hiếu với dân\"; phẩm chất nào gắn với hoạt động hằng ngày của mỗi người → \"Cần, kiệm, liêm, chính, chí công vô tư\"; phẩm chất nào là một trong những phẩm chất đạo đức cao đẹp nhất → \"Yêu thương con người, sống có tình có nghĩa\"."],[241,6,"Trong các phẩm chất đạo đức cơ bản của con người Việt Nam trong thời đại mới, theo tư tưởng Hồ Chí Minh, phẩm chất đạo đức nào cao đẹp nhất?",["Trung với nước, hiếu với dân","Cần, kiệm, liêm, chính chí công vô tư","Tinh thần quốc tế trong sáng","Yêu thương con người"],3,"Theo Giáo trình Tư tưởng Hồ Chí Minh, trong hệ thống bốn chuẩn mực đạo đức cơ bản, \"yêu thương con người, sống có tình nghĩa\" được Người xác định là một trong những phẩm chất đạo đức cao đẹp nhất, bắt nguồn từ truyền thống nhân ái dân tộc kết hợp với chủ nghĩa nhân đạo cộng sản. Các phẩm chất còn lại đều quan trọng nhưng giữ vị trí khác: \"trung với nước, hiếu với dân\" là phẩm chất bao trùm và quan trọng nhất, còn \"cần, kiệm, liêm, chính, chí công vô tư\" là phẩm chất thiết thực nhất gắn với hoạt động hằng ngày.","Nếu đề hỏi phẩm chất đạo đức \"bao trùm nhất, quan trọng nhất\" thì chọn \"Trung với nước, hiếu với dân\"; hỏi phẩm chất \"thiết thực nhất, gắn với hoạt động hằng ngày\" thì chọn \"Cần, kiệm, liêm, chính, chí công vô tư\"; hỏi phẩm chất xuất phát từ \"bản chất của giai cấp công nhân, vượt ra ngoài phạm vi quốc gia\" thì chọn \"Tinh thần quốc tế trong sáng\"."],[242,6,"Trong các phẩm chất đạo đức cơ bản của con người Việt Nam trong thời đại mới, theo tư tưởng Hồ Chí Minh, phẩm chất đạo đức nào thiết thực nhất, gắn với hoạt động hàng ngày của mỗi người?",["Trung với nước, hiếu với dân","Yêu thương con người","Tinh thần quốc tế trong sáng","Cần, kiệm, liêm, chính chí công vô tư"],3,"Hồ Chí Minh khẳng định \"cần, kiệm, liêm, chính, chí công vô tư\" là nội dung cốt lõi của đạo đức cách mạng, gắn liền trực tiếp và thiết thực nhất với hoạt động lao động, công tác và sinh hoạt hằng ngày của mỗi người, giống như bốn mùa của trời và bốn phương của đất. Các phẩm chất như \"trung với nước, hiếu với dân\", \"yêu thương con người\" hay \"tinh thần quốc tế trong sáng\" mang tầm khái quát cao hơn về lý tưởng chính trị, nhân ái hoặc quan hệ quốc tế.","Nếu đề đổi từ khóa sang phẩm chất \"cao đẹp nhất\" thì chọn \"Yêu thương con người\"; hỏi phẩm chất \"quan trọng nhất, bao trùm nhất, chi phối các phẩm chất khác\" thì chọn \"Trung với nước, hiếu với dân\"."],[243,6,"Theo tư tưởng Hồ Chí Minh, trong cách mạng dân tộc dân chủ nhân dân, nền văn hoá mới có những tính chất nào?",["Dân tộc, lao động và tính chiến đấu","Dân tộc, dân chủ và đổi mới","Dân tộc, kế thừa và phát triển","Dân tộc, khoa học và đại chúng"],3,"Trong thời kỳ cách mạng dân tộc dân chủ nhân dân, Hồ Chí Minh tiếp thu và phát triển ba tính chất nền tảng của nền văn hóa mới là \"dân tộc, khoa học và đại chúng\" nhằm chống lại văn hóa nô dịch thực dân, phản khoa học và xa rời quần chúng. Các tổ hợp có cụm từ \"lao động và tính chiến đấu\", \"dân chủ và đổi mới\" hay \"kế thừa và phát triển\" không phải là công thức ba tính chất chuẩn của nền văn hóa mới giai đoạn này.","Nếu đề hỏi đặc trưng nền văn hóa trong thời kỳ xây dựng chủ nghĩa xã hội theo Hồ Chí Minh thì chọn \"có nội dung xã hội chủ nghĩa và tính chất dân tộc\"; còn nếu hỏi định hướng xây dựng nền văn hóa Việt Nam theo Văn kiện Đại hội Đảng thời kỳ đổi mới thì chọn \"tiên tiến, đậm đà bản sắc dân tộc\"."],[244,6,"Theo tư tưởng Hồ Chí Minh, người cách mạng muốn hoàn thành được nhiệm vụ cách mạng thì phải như thế nào?",["Chuyên cần và tiết kiệm","Giỏi chuyên môn nghiệp vụ, am hiểu pháp luật","Có lý tưởng, không ngại khó khăn, gian khổ","Có đức và tài"],3,"Theo Hồ Chí Minh, để hoàn thành trọng trách cách mạng, người cán bộ, người cách mạng phải có đủ cả đức và tài, trong đó đức là gốc và tài là rất quan trọng; Người từng nhấn mạnh có tài mà không có đức là người vô dụng, có đức mà không có tài thì làm việc gì cũng khó. Các phương án như chỉ \"chuyên cần và tiết kiệm\", chỉ \"giỏi chuyên môn nghiệp vụ\" hay chỉ \"có lý tưởng\" đều phiến diện, mới phản ánh một khía cạnh của đức hoặc tài.","Nếu đề hỏi trong mối quan hệ giữa đức và tài thì yếu tố nào là \"gốc\", là \"nền tảng\" thì chọn \"Đức\" (đạo đức cách mạng); nếu hỏi khẩu hiệu đào tạo thế hệ trẻ trong Di chúc thì chọn \"vừa hồng vừa chuyên\"."],[245,6,"Một trong những điểm lớn định hướng cho việc xây dựng nền văn hóa dân tộc theo Hồ Chí Minh là gì?",["Xây dựng nền giáo dục","Xây dựng ý thức yêu nước","Xây dựng Nhà nước","Xây dựng kinh tế"],3,"Tháng 8 năm 1943, ngay sau khi nêu định nghĩa về văn hóa, Hồ Chí Minh đề ra năm điểm lớn định hướng xây dựng nền văn hóa dân tộc gồm: xây dựng tâm lý, xây dựng luân lý, xây dựng xã hội, xây dựng chính trị và \"xây dựng kinh tế\". Các phương án \"xây dựng nền giáo dục\", \"xây dựng ý thức yêu nước\" và \"xây dựng Nhà nước\" không nằm nguyên văn trong năm điểm lớn này.","Ghi nhớ trọn bộ năm điểm lớn năm 1943 để làm mọi câu biến thể: xây dựng tâm lý (tinh thần độc lập tự cường), xây dựng luân lý (biết hy sinh mình, làm lợi cho quần chúng), xây dựng xã hội (phúc lợi nhân dân), xây dựng chính trị (dân quyền) và xây dựng kinh tế."],[246,6,"Trong định nghĩa về văn hoá, Hồ Chí Minh đã chỉ ra văn hoá là gì?",["Toàn bộ giá trị tinh thần thuộc văn hóa phi vật thể do con người sáng tạo ra","Toàn bộ giá trị vật chất thuộc văn hóa vật thể do con người sáng tạo ra","Văn hoá là trình độ học vấn, trình độ hiểu biết của con người","Văn hoá là toàn bộ các giá trị vật chất và tinh thần do con người sáng tạo ra"],3,"Trong định nghĩa văn hóa theo nghĩa rộng viết vào tháng 8 năm 1943, Hồ Chí Minh chỉ rõ văn hóa là toàn bộ những sáng tạo và phát minh của loài người về cả giá trị tinh thần (ngôn ngữ, chữ viết, đạo đức, pháp luật, khoa học, tôn giáo, văn học, nghệ thuật) lẫn giá trị vật chất (công cụ sinh hoạt hằng ngày về mặc, ăn, ở và các phương thức sử dụng). Vì vậy, các phương án chỉ nêu riêng \"giá trị tinh thần\", riêng \"giá trị vật chất\" hoặc bó hẹp thành \"trình độ học vấn\" đều chưa đầy đủ theo định nghĩa gốc.","Nếu đề hỏi văn hóa hiểu theo \"nghĩa hẹp\" thì chọn đời sống tinh thần của xã hội, thuộc kiến trúc thượng tầng; nếu hỏi theo \"nghĩa hẹp hơn\" (rất hẹp) thì chọn trình độ học vấn, việc đi học, xóa mù chữ."],[247,6,"Theo định nghĩa của Hồ Chí Minh về văn hoá, nội dung nào không phải là thành tố cấu thành văn hoá?",["Những công cụ cho sinh hoạt hàng ngày về mặc, ăn, ở","Khoa học, tôn giáo, văn học, nghệ thuật","Ngôn ngữ, chữ viết, đạo đức, pháp luật","Là những gì thuộc về thiên nhiên"],3,"Theo định nghĩa của Hồ Chí Minh, văn hóa bắt nguồn từ hoạt động sáng tạo và phát minh của con người vì lẽ sinh tồn và mục đích cuộc sống, bao gồm công cụ sinh hoạt hằng ngày về ăn, mặc, ở; khoa học, tôn giáo, văn học, nghệ thuật; ngôn ngữ, chữ viết, đạo đức, pháp luật. Do đó, \"là những gì thuộc về thiên nhiên\" thuần túy, không phải sản phẩm do con người sáng tạo ra, không phải thành tố cấu thành văn hóa.","Nếu đề bỏ từ \"không\" và hỏi những yếu tố thuộc nội hàm định nghĩa văn hóa năm 1943, hãy chọn các nhóm gắn với sáng tạo của con người như ngôn ngữ, chữ viết, đạo đức, pháp luật, khoa học, tôn giáo, văn học, nghệ thuật và công cụ sinh hoạt hằng ngày."],[248,6,"Theo Hồ Chí Minh, quá trình làm cho lối sống mới dần dần trở thành nền nếp, thói quen, ổn định ở mỗi người, thành phong tục tập quán của tập thể hay cả cộng đồng, trong khu vực hay cả nước, được hiểu là gì?",["Lối sống mới","Đời sống mới","Cuộc sống mới","Nếp sống mới"],3,"Trong tư tưởng Hồ Chí Minh về văn hóa đời sống (đời sống mới), \"nếp sống mới\" là kết quả của quá trình đưa lối sống mới trở thành nền nếp, thói quen bền vững ở mỗi cá nhân và thành phong tục, tập quán tốt đẹp của tập thể, cộng đồng. \"Lối sống mới\" là cách sống văn minh, tiến bộ trong ăn, mặc, ở, đi lại, làm việc, còn \"đời sống mới\" là khái niệm bao trùm gồm cả đạo đức mới, lối sống mới và nếp sống mới.","Nếu đề hỏi cách sống mới trong năm khía cạnh ăn, mặc, ở, đi lại, làm việc thì chọn \"Lối sống mới\"; nếu hỏi khái niệm tổng quát đồng nhất với \"văn hóa đời sống\" gồm ba nội dung thì chọn \"Đời sống mới\"."],[249,6,"Theo Hồ Chí Minh, trong tình hình thực tế, yếu tố nào của chủ nghĩa xã hội có sức hấp dẫn đặc biệt?",["Lý tưởng cao đẹp","Mức sống vật chất dồi dào","Tư tưởng được tự do giải phóng","Những giá trị đạo đức cao đẹp"],3,"Giáo trình Tư tưởng Hồ Chí Minh chỉ rõ: theo Người, sức hấp dẫn của chủ nghĩa xã hội trong thực tế chưa phải trước hết ở lý tưởng cao xa, mức sống vật chất dồi dào hay tư tưởng được tự do giải phóng, mà trước hết nằm ở \"những giá trị đạo đức cao đẹp\" và phẩm chất gương mẫu của những người cộng sản ưu tú luôn sống, chiến đấu vì lý tưởng nhân văn.","Câu này rất dễ bẫy người học chọn \"Mức sống vật chất dồi dào\" hoặc \"Lý tưởng cao đẹp\" theo cảm tính; khi thấy từ khóa \"sức hấp dẫn đặc biệt\" của chủ nghĩa xã hội trong thực tế theo Hồ Chí Minh, luôn gắn ngay với \"những giá trị đạo đức cao đẹp\"."],[250,6,"Câu: \"Nhân dân ta thường nói: đảng viên đi trước, làng nước theo sau”, được trích từ tác phẩm nào của Hồ Chí Minh?",["Đạo đức cách mạng","Thường thức chính trị","Cần, Kiệm, Liêm, Chính","Nâng cao đạo đức cách mạng, quét sạch chủ nghĩa cá nhân"],3,"Câu \"Nhân dân ta thường nói: đảng viên đi trước, làng nước theo sau\" được trích từ bài viết nổi tiếng cuối đời của Hồ Chí Minh mang tên \"Nâng cao đạo đức cách mạng, quét sạch chủ nghĩa cá nhân\" (đăng báo Nhân dân ngày 3 tháng 2 năm 1969 nhân kỷ niệm 39 năm thành lập Đảng). Các tác phẩm \"Đạo đức cách mạng\" (1958), \"Thường thức chính trị\" (1953) và \"Cần, Kiệm, Liêm, Chính\" (1949) bàn về đạo đức và chính trị nhưng không chứa nguyên văn trích dẫn này.","Nếu đề hỏi trích dẫn \"Quét sạch chủ nghĩa cá nhân, nâng cao đạo đức cách mạng\" hay gọi chủ nghĩa cá nhân là \"kẻ địch hung ác\", \"giặc nội xâm\" viết dịp 3/2/1969 thì vẫn là tác phẩm \"Nâng cao đạo đức cách mạng, quét sạch chủ nghĩa cá nhân\"; còn nếu hỏi câu \"Làm cách mạng để cải tạo xã hội cũ thành xã hội mới là một sự nghiệp rất vẻ vang, nhưng nó cũng là một nhiệm vụ rất nặng nề...\" viết năm 1958 thì chọn \"Đạo đức cách mạng\"."],[251,6,"Văn hóa đời sống thực chất là đời sống mới, được Hồ Chí Minh nêu ra mấy nội dung cơ bản?",["Hai","Bốn","Năm","Ba"],3,"Theo tư tưởng Hồ Chí Minh, văn hóa đời sống thực chất là xây dựng đời sống mới với đúng \"ba\" nội dung cơ bản gắn bó chặt chẽ với nhau: đạo đức mới, lối sống mới và nếp sống mới. Các con số hai, bốn hay năm đều sai vì thiếu nội dung hoặc nhầm với năm cách sửa đổi lối sống hay năm điểm lớn xây dựng văn hóa dân tộc.","Nếu đề hỏi số \"điểm lớn định hướng xây dựng nền văn hóa dân tộc\" (1943) hoặc số \"cách phải sửa đổi trong lối sống mới\" (ăn, mặc, ở, đi lại, làm việc) thì chọn \"Năm\"; hỏi số \"phẩm chất đạo đức cơ bản\" thì chọn \"Bốn\"."],[252,6,"Ba tính chất \"dân tộc, khoa học và đại chúng\" của văn hóa được Đảng ta đưa ra lần đầu tiên ở tác phẩm nào?",["Báo cáo chính trị tại đại hội lần thứ II của Đảng (1951)","Văn kiện đại hội lần thứ VII của Đảng (1991)","Văn kiện đại hội lần thứ VI của Đảng (1986)","Đề cương văn hóa (1943)"],3,"Ba tính chất \"dân tộc, khoa học và đại chúng\" (dân tộc hóa, khoa học hóa, đại chúng hóa) lần đầu tiên được Đảng ta chính thức nêu ra trong \"Đề cương văn hóa (1943)\" do Tổng Bí thư Trường Chinh khởi thảo. Các văn kiện Đại hội lần thứ II (1951), lần thứ VI (1986) và lần thứ VII (1991) ra đời sau đó nhiều năm và mang những bổ sung phù hợp từng giai đoạn lịch sử mới.","Nếu đề hỏi mốc văn kiện xác định xây dựng nền văn hóa \"tiên tiến, đậm đà bản sắc dân tộc\" thì gắn với Cương lĩnh năm 1991 (Đại hội VII); nếu hỏi thời điểm Hồ Chí Minh đưa ra định nghĩa văn hóa và năm điểm lớn thì cũng cùng năm 1943 nhưng trong tập \"Nhật ký trong tù\"."],[253,6,"Câu \"Cách mạng tức là giai cấp tiến bộ đánh đổ giai cấp phản tiến bộ\" trích từ tác phẩm nào của Hồ Chí Minh?",["Di chúc (1969)","Đạo đức cách mạng (1958)","Thường thức chính trị (1953)","Dân vận (1949)"],3,"Theo hệ thống trích dẫn học phần Tư tưởng Hồ Chí Minh, nhận định \"Cách mạng tức là giai cấp tiến bộ đánh đổ giai cấp phản tiến bộ\" được gắn với tác phẩm \"Dân vận (1949)\", bài viết nhấn mạnh bản chất cách mạng thuộc về quần chúng nhân dân và sức mạnh của nhân dân trong việc lật đổ thế lực áp bức, phản tiến bộ. Các tác phẩm \"Di chúc (1969)\", \"Đạo đức cách mạng (1958)\" và \"Thường thức chính trị (1953)\" tập trung vào những chủ đề khác nhau như dặn dò trước lúc đi xa, rèn luyện phẩm chất đảng viên hay kiến thức chính trị phổ thông.","Nếu đề hỏi câu \"Bao nhiêu lợi ích đều vì dân. Bao nhiêu quyền hạn đều của dân... Lực lượng của dân rất to. Việc dân vận rất quan trọng\" thì cũng chọn \"Dân vận (1949)\"; nếu hỏi nơi trích câu \"Cũng như sông thì có nguồn mới có nước...\" thì chọn \"Sửa đổi lối làm việc (1947)\"."],[254,6,"Câu “Bồi dưỡng thế hệ cách mạng cho đời sau là một việc rất quan trọng và rất cần thiết” được trích trong bài viết nào của Hồ Chí Minh?",["Báo cáo chính trị tại Đại hội Đảng lần thứ II (1951)","Bài nói tại Đại hội Sinh viên Việt Nam lần thứ II (1958)","Bản án chế độ thực dân Pháp (1925)","Di Chúc (1965-1969)"],3,"Lời căn dặn \"Bồi dưỡng thế hệ cách mạng cho đời sau là một việc rất quan trọng và rất cần thiết\" là một luận điểm nổi tiếng về chiến lược trồng người được Hồ Chí Minh viết trong \"Di Chúc (1965-1969)\" ở phần nói về đoàn viên và thanh niên. Các văn kiện như Báo cáo chính trị tại Đại hội II (1951), Bài nói tại Đại hội Sinh viên lần thứ II (1958) hay Bản án chế độ thực dân Pháp (1925) không phải xuất xứ của câu này.","Nếu đề hỏi tác phẩm có câu \"Vì lợi ích mười năm thì phải trồng cây, vì lợi ích trăm năm thì phải trồng người\" thì chọn bài nói chuyện tại Lớp học chính trị của giáo viên cấp II, cấp III toàn miền Bắc năm 1958; còn nhắc đến \"bồi dưỡng thế hệ cách mạng cho đời sau\" hay đào tạo thanh niên \"vừa hồng vừa chuyên\" thì chọn \"Di Chúc\"."],[255,6,"Theo tư tưởng Hồ Chí Minh, trong mối quan hệ giữa đức và tài thì đức phải như thế nào?",["Quyết định","Là ngọn","Là quan trọng","Là gốc"],3,"Trong tư tưởng Hồ Chí Minh về mối quan hệ biện chứng giữa đức và tài, đạo đức \"là gốc\", là nền tảng của người cách mạng, cũng như nguồn của sông và gốc của cây. Phương án \"là ngọn\" là hoàn toàn trái ngược; còn \"là quan trọng\" hay \"quyết định\" không diễn đạt đúng thuật ngữ kinh điển mà Hồ Chí Minh thường dùng để chỉ vị trí nền tảng của đạo đức so với tài năng.","Nếu đề hỏi trong câu \"Người cách mạng phải có đạo đức, không có đạo đức thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân\" nhấn mạnh điều gì, vẫn chọn vai trò đạo đức \"là gốc, là nền tảng\"; còn tài năng giữ vai trò \"rất quan trọng\", cần kết hợp chặt chẽ với đức."],[256,6,"Theo Hồ Chí Minh, việc tu dưỡng đạo đức ở mỗi người phải được thực hiện như thế nào?",["Trong tất cả các mặt của đời sống","Trong mọi mối quan hệ xã hội","Trong mọi hoạt động thực tiễn","Trong mọi mối quan hệ xã hội, hoạt động thực tiễn"],3,"Hồ Chí Minh quan niệm đạo đức cách mạng không phải trên trời sa xuống mà do đấu tranh, rèn luyện bền bỉ hằng ngày mà phát triển và củng cố, nên việc tu dưỡng đạo đức phải diễn ra đồng thời \"trong mọi mối quan hệ xã hội, hoạt động thực tiễn\". Hai phương án chỉ nêu riêng \"trong mọi mối quan hệ xã hội\" hoặc chỉ nêu riêng \"trong mọi hoạt động thực tiễn\" đều thiếu một vế quan trọng, còn \"trong tất cả các mặt của đời sống\" diễn đạt chung chung, chưa nêu đúng hai môi trường rèn luyện cơ bản theo giáo trình.","Nếu đề hỏi đặc điểm về thời gian của việc tu dưỡng đạo đức theo Hồ Chí Minh thì chọn \"tu dưỡng đạo đức suốt đời\" (kiên trì, bền bỉ hằng ngày như rửa mặt hằng ngày, \"ngọc càng mài càng sáng, vàng càng luyện càng trong\")."],[257,6,"Trung với nước, hiếu với dân theo tư tưởng Hồ Chí Minh là phẩm chất đạo đức như thế nào?",["Cao quý nhất cần có của người cách mạng, nhất là của người đảng viên cộng sản","Là khuôn mẫu đạo đức của xã hội mới","Bất di bất dịch, được kết tinh từ truyền thống đạo đức dân tộc và đạo đức cộng sản","Bao trùm nhất, quan trọng nhất, là nền tảng của đạo đức cách mạng"],3,"Theo Giáo trình Tư tưởng Hồ Chí Minh, \"trung với nước, hiếu với dân\" là phẩm chất đạo đức \"bao trùm nhất, quan trọng nhất, là nền tảng của đạo đức cách mạng\", giữ vai trò chi phối các phẩm chất đạo đức khác. Phương án cho rằng phẩm chất này \"bất di bất dịch\" là sai về phương pháp luận lịch sử vì Hồ Chí Minh đã cách mạng hóa nội dung từ \"trung với vua, hiếu với cha mẹ\" của đạo đức cũ thành \"trung với nước, hiếu với dân\" của đạo đức mới; các phương án còn lại chưa phản ánh đủ vai trò bao trùm và nền tảng.","Nếu đề hỏi sự khác biệt căn bản giữa quan niệm \"trung, hiếu\" của Hồ Chí Minh so với Nho giáo truyền thống thì chọn: chuyển từ \"trung với vua, hiếu với cha mẹ\" sang \"trung với nước, hiếu với dân\"."],[258,6,"Theo tư tưởng Hồ Chí Minh: Văn hoá được hiểu như thế nào?",["Trình độ văn hóa phổ thông của con người","Người có vốn sống thực tiễn phong phú, đa dạng, có trình độ văn hóa cao","Nền giáo dục toàn diện; trình độ học vấn của dân tộc","Học vấn của dân; lĩnh vực tinh thần của xã hội; hệ thống các giá trị do con người tạo ra trong quá trình lịch sử"],3,"Hồ Chí Minh tiếp cận khái niệm văn hóa theo nhiều cấp độ: theo nghĩa rất hẹp là \"học vấn của dân\", theo nghĩa hẹp là \"lĩnh vực tinh thần của xã hội\" (kiến trúc thượng tầng), và theo nghĩa rộng là \"hệ thống các giá trị do con người tạo ra trong quá trình lịch sử\". Các phương án còn lại đều phiến diện vì chỉ thu gọn văn hóa vào trình độ phổ thông, vốn sống cá nhân hoặc nền giáo dục.","Nắm rõ bốn cách tiếp cận văn hóa của Hồ Chí Minh để đối phó câu hỏi tách lẻ: nghĩa rộng (tổng hợp mọi phương thức sinh hoạt và giá trị vật chất - tinh thần); nghĩa hẹp (đời sống tinh thần xã hội); nghĩa hẹp hơn (trường học, số người đi học, xóa mù chữ); và tiếp cận theo phương thức sử dụng công cụ sinh hoạt."],[259,6,"Nguyên tắc xây dựng đạo đức cách mạng theo tư tưởng Hồ Chí Minh là gì?",["Lý luận gắn liền với thực tiễn","Học đi đôi với hành","Học tập, rèn luyện bền bỉ hàng ngày; nói đi đôi với làm, nêu gương đạo đức","Đấu tranh chống các biểu hiện tiêu cực về đạo đức; tu dưỡng đạo đức suốt đời; nói đi đôi với làm, nêu gương đạo đức"],3,"Giáo trình Tư tưởng Hồ Chí Minh hệ thống hóa ba nguyên tắc xây dựng đạo đức cách mạng gồm: nói đi đôi với làm, nêu gương về đạo đức; xây đi đôi với chống (đấu tranh chống các biểu hiện tiêu cực về đạo đức); và tu dưỡng đạo đức suốt đời. Đáp án \"Đấu tranh chống các biểu hiện tiêu cực về đạo đức; tu dưỡng đạo đức suốt đời; nói đi đôi với làm, nêu gương đạo đức\" hội tụ đủ cả ba nguyên tắc này, trong khi các phương án khác chỉ nêu nguyên tắc giáo dục chung (học đi đôi với hành, lý luận gắn với thực tiễn) hoặc thiếu nguyên tắc đấu tranh chống tiêu cực.","Nếu đề hỏi trong ba nguyên tắc xây dựng đạo đức mới, nguyên tắc nào là \"quan trọng bậc nhất\" thì chọn \"Nói đi đôi với làm, phải nêu gương về đạo đức\"."],[260,6,"Đánh giá đúng theo tư tưởng Hồ Chí Minh: các thầy, cô giáo là người như thế nào?",["Kỹ sư tâm hồn","Người chiến sĩ trên mặt trận văn hóa","Người lao động trí óc","Anh hùng vô danh của dân tộc"],3,"Hồ Chí Minh đánh giá rất cao vị trí và cống hiến thầm lặng của đội ngũ nhà giáo trong sự nghiệp trồng người, gọi các thầy, cô giáo là những \"anh hùng vô danh của dân tộc\". Các cách gọi khác dễ gây nhầm lẫn: \"người chiến sĩ trên mặt trận văn hóa\" là cách Người gọi văn nghệ sĩ, còn \"kỹ sư tâm hồn\" hay \"người lao động trí óc\" không phải lời tôn vinh đặc trưng của Hồ Chí Minh dành riêng cho thầy, cô giáo trong nội dung này.","Nếu đề hỏi Hồ Chí Minh gọi \"văn nghệ sĩ\" là gì thì chọn \"Chiến sĩ trên mặt trận văn hóa (văn nghệ)\"; còn hỏi Người tôn vinh \"thầy, cô giáo\" là gì thì chọn \"Anh hùng vô danh của dân tộc\" (và nghề dạy học là nghề vẻ vang nhất)."],[261,6,"Đạo đức theo tư tưởng Hồ Chí Minh có vai trò gì?",["Là cơ sở lý luận, là cái gốc của hoạt động thực tiễn","Chỗ dựa của người cách mạng","Vũ khí của người cách mạng","Nền tảng của người cách mạng"],3,"Hồ Chí Minh khẳng định đạo đức là gốc, là \"nền tảng của người cách mạng\", quyết định sức mạnh tinh thần và sự thành công bền vững của sự nghiệp cách mạng. Phương án \"là cơ sở lý luận, là cái gốc của hoạt động thực tiễn\" sai ở chỗ đánh đồng đạo đức với lý luận khoa học (cơ sở lý luận là chủ nghĩa Mác - Lênin); còn \"chỗ dựa\" hay \"vũ khí\" không diễn đạt chuẩn xác vai trò nền tảng của đạo đức theo giáo trình.","Nếu đề hỏi về vai trò của \"đạo đức\" đối với cả xã hội thì chọn \"là gốc, là nền tảng tinh thần của xã hội, của người cách mạng\"; còn nếu hỏi về \"chủ nghĩa Mác - Lênin\" thì mới chọn là cơ sở lý luận, kim chỉ nam cho hành động."],[262,6,"Khái niệm con người trong tư tưởng Hồ Chí Minh được hiểu ra sao?",["Con người chung chung, trừu tượng","Con người trong quan hệ cộng đồng dân tộc và thế giới","Loài người, nhân loại","Con người lịch sử cụ thể"],3,"Kế thừa chủ nghĩa duy vật lịch sử của chủ nghĩa Mác - Lênin, Hồ Chí Minh luôn nhìn nhận con người như một chỉnh thể thống nhất và là \"con người lịch sử cụ thể\" gắn với những điều kiện lịch sử, xã hội, giai cấp, dân tộc, nghề nghiệp, lứa tuổi, giới tính xác định. Người không bao giờ xem xét con người một cách \"chung chung, trừu tượng\" hay chỉ dừng ở khái niệm sinh học \"loài người, nhân loại\" mơ hồ.","Nếu đề hỏi Hồ Chí Minh nhìn nhận con người trong sự thống nhất giữa những mặt nào thì chọn \"thống nhất giữa trí lực, tâm lực, thể lực\" và \"thống nhất giữa mặt sinh học với mặt xã hội\" (trong đó bản chất xã hội giữ vai trò quyết định)."],[263,6,"Đặc trưng cốt lõi nhất của tư tưởng đạo đức Hồ Chí Minh là gì?",["Lòng thương yêu con người vô hạn","Cảm thông, yêu thương những người cùng khổ","Sự quan tâm sâu sắc đến con người, nhất là những người bị đọa đày nô lệ, mất nước","Chủ nghĩa nhân đạo chiến đấu"],3,"Theo Giáo trình Tư tưởng Hồ Chí Minh, đặc trưng cốt lõi nhất của tư tưởng đạo đức Hồ Chí Minh là \"chủ nghĩa nhân đạo chiến đấu\": không dừng lại ở lòng thương cảm thụ động, mà biến tình yêu thương con người thành hành động cách mạng kiên quyết đấu tranh xóa bỏ áp bức, bóc lột, giải phóng dân tộc và giải phóng con người. Các phương án như \"lòng thương yêu con người vô hạn\" hay \"cảm thông với người cùng khổ\" mới chỉ phản ánh phần tình cảm, chưa toát lên tinh thần chiến đấu cách mạng.","Nếu đề hỏi \"chủ nghĩa nhân đạo chiến đấu\" thể hiện rõ nhất ở phẩm chất nào trong bốn chuẩn mực đạo đức thì liên hệ ngay với \"Yêu thương con người, sống có tình nghĩa\" gắn với hành động giải phóng những người bị áp bức."],[264,6,"Theo tư tưởng Hồ Chí Minh, Nội dung Văn hoá hiểu theo nghĩa rất hẹp là như thế nào?",["Trình độ văn hóa phổ thông của con người","Người có vốn sống thực tiễn phong phú, đa dạng, có trình độ văn hóa cao","Nền giáo dục toàn diện; trình độ học vấn của dân tộc","Trình độ học vấn của con người được đánh giá bằng các cấp học phổ thông"],3,"Trong bốn cách tiếp cận văn hóa của Hồ Chí Minh, văn hóa hiểu theo nghĩa rất hẹp (nghĩa hẹp hơn) chỉ \"trình độ học vấn của con người được đánh giá bằng các cấp học phổ thông\", gắn với trường học, số người đi học, biết đọc biết viết và trình độ văn hóa cấp I, II, III. Phương án \"trình độ văn hóa phổ thông của con người\" chưa nêu rõ tiêu chí đánh giá qua các cấp học phổ thông, còn các phương án về \"vốn sống thực tiễn\" hay \"nền giáo dục toàn diện\" lại mở rộng sai phạm vi.","Nếu đề hỏi văn hóa theo \"nghĩa hẹp\" (chưa đến mức \"rất hẹp\") thì chọn \"đời sống tinh thần của xã hội, thuộc kiến trúc thượng tầng\"; hỏi theo \"nghĩa rộng\" thì chọn \"tổng hợp mọi phương thức sinh hoạt và toàn bộ giá trị vật chất, tinh thần do con người sáng tạo ra\"."],[265,6,"Thực hiện nội dung Văn hoá theo nghĩa rất hẹp, Hồ Chí Minh yêu cầu mọi người phải làm gì?",["Tiếp thu có chọn lọc văn hóa nhân loại","Bảo vệ, bảo tồn và phát huy các mặt tốt đẹp của văn hóa dân tộc","Bảo vệ các di sản văn hóa dân tộc","Đi học văn hóa, xóa mù chữ"],3,"Vì văn hóa theo nghĩa rất hẹp là trình độ học vấn và khả năng đọc viết, nên để thực hiện nội dung này, Hồ Chí Minh yêu cầu mọi người dân phải \"đi học văn hóa, xóa mù chữ\" nhằm diệt \"giặc dốt\", nâng cao dân trí. Các nhiệm vụ \"tiếp thu văn hóa nhân loại\", \"bảo tồn văn hóa dân tộc\" hay \"bảo vệ di sản văn hóa\" thuộc phạm vi xây dựng và phát triển nền văn hóa theo nghĩa rộng và nghĩa hẹp.","Nếu đề hỏi ba thứ giặc mà Chính phủ lâm thời đề ra phải tiêu diệt ngay sau Cách mạng Tháng Tám 1945 thì chọn \"giặc đói, giặc dốt và giặc ngoại xâm\", trong đó chống \"giặc dốt\" gắn trực tiếp với phong trào Bình dân học vụ, xóa mù chữ."],[266,6,"Theo Hồ Chí Minh, văn hóa là một kiến trúc thượng tầng nhưng không thể đứng ngoài, mà phải ở đâu?",["Trong đời sống tinh thần xã hội","Trong hệ thống chính trị","Trong giáo dục và đào tạo","Trong kinh tế và chính trị"],3,"Khi bàn về mối quan hệ giữa văn hóa với các lĩnh vực khác của đời sống xã hội, Hồ Chí Minh khẳng định văn hóa thuộc kiến trúc thượng tầng nhưng \"không thể đứng ngoài mà phải ở trong kinh tế và chính trị\", có sự tác động qua lại mật thiết với hai lĩnh vực này. Các phương án \"trong đời sống tinh thần xã hội\", \"trong hệ thống chính trị\" hay \"trong giáo dục và đào tạo\" không đúng với luận điểm nổi tiếng của Người.","Ghi nhớ cặp vế đi liền nhau trong luận điểm này: văn hóa phải ở \"trong kinh tế và chính trị\"; đồng thời kinh tế và chính trị cũng phải có tính văn hóa (chính trị giải phóng mở đường cho văn hóa phát triển, kinh tế phát triển tạo cơ sở vật chất cho văn hóa)."],[267,6,"Theo Hồ Chí Minh, chức năng hàng đầu của văn hóa là bồi dưỡng, nâng cao vấn đề gì cho con người?",["Phẩm chất chính trị, lối sống văn hóa","Tinh thần làm chủ và đạo đức","Nâng cao dân trí và văn hóa","Tư tưởng đúng đắn và tình cảm cao đẹp"],3,"Theo tư tưởng Hồ Chí Minh, văn hóa có ba chức năng cơ bản, trong đó chức năng hàng đầu là bồi dưỡng, nâng cao \"tư tưởng đúng đắn và tình cảm cao đẹp\" cho con người (lý tưởng độc lập dân tộc gắn liền với chủ nghĩa xã hội, lòng yêu nước, thương dân, trung thực, chân thành). \"Nâng cao dân trí\" là chức năng thứ hai, còn bồi dưỡng phẩm chất, phong cách, lối sống lành mạnh là chức năng thứ ba.","Nếu đề hỏi chức năng thứ hai của văn hóa thì chọn \"Mở rộng hiểu biết, nâng cao dân trí\"; nếu hỏi chức năng thứ ba thì chọn \"Bồi dưỡng những phẩm chất, phong cách và lối sống tốt đẹp, lành mạnh, hướng con người đến chân, thiện, mỹ\"."],[268,6,"Theo tư tưởng Hồ Chí Minh, người sáng tạo ra giá trị vật chất và tinh thần cho xã hội là ai?",["Anh hùng","Vĩ nhân","Lãnh tụ","Nhân dân"],3,"Quán triệt quan điểm duy vật lịch sử của chủ nghĩa Mác - Lênin, Hồ Chí Minh khẳng định \"nhân dân\" là lực lượng quyết định lịch sử và là người trực tiếp sáng tạo ra mọi giá trị vật chất cũng như tinh thần cho xã hội. Các cá nhân kiệt xuất như \"anh hùng\", \"vĩ nhân\" hay \"lãnh tụ\" dù có vai trò định hướng quan trọng nhưng đều xuất thân từ nhân dân và không thể thay thế vai trò sáng tạo của quần chúng nhân dân.","Nếu đề hỏi theo Hồ Chí Minh \"cách mạng là sự nghiệp của ai\" hoặc \"trong bầu trời không gì quý bằng điều gì\" thì cũng chọn \"Nhân dân\"."],[269,6,"Theo Hồ Chí Minh, muốn thức tỉnh một dân tộc trước hết phải thức tỉnh bộ phận dân cư nào?",["Nông nhân","Phụ nữ","Trí thức","Thanh niên"],3,"Hồ Chí Minh đặc biệt tin tưởng vào sức trẻ, tinh thần xung kích và khả năng tiếp thu cái mới của \"thanh niên\", coi tuổi trẻ là mùa xuân của xã hội; vì vậy Người cho rằng muốn thức tỉnh một dân tộc trước hết phải thức tỉnh lực lượng thanh niên. Nông dân, phụ nữ và trí thức đều là những lực lượng cách mạng to lớn trong khối đại đoàn kết, nhưng không phải bộ phận được Người xác định là khâu tiên phong để thức tỉnh đầu tiên.","Nếu đề hỏi vì sao năm 1925 Nguyễn Ái Quốc thành lập \"Hội Việt Nam Cách mạng Thanh niên\" thì cũng xuất phát từ nhận thức chiến lược này: tập hợp, giác ngộ tầng lớp thanh niên yêu nước làm nòng cốt truyền bá chủ nghĩa Mác - Lênin vào phong trào công nhân và yêu nước."],[270,6,"Câu: “Ngoài miệng thì tuyên truyền bảo người ta siêng làm, mà tự mình thì ăn trưa, ngủ trễ; bảo người ta tiết kiệm, mà tự mình thì xa xỉ, lung tung, thì tuyên truyền 100 năm cũng vô ích”. Bác Hồ khuyên chúng ta điều gì?",["Nên cần cù, chịu khó","Nên siêng năng, hay làm","Nên tiết kiệm","Nên làm gương"],3,"Câu nói phê phán gay gắt thói nói một đằng làm một nẻo, qua đó Hồ Chí Minh khuyên cán bộ, đảng viên \"nên làm gương\", thực hiện nghiêm nguyên tắc \"nói đi đôi với làm\" vì một tấm gương sống còn có giá trị hơn một trăm bài diễn văn tuyên truyền. Các phương án \"cần cù\", \"siêng năng\" hay \"tiết kiệm\" chỉ là ví dụ minh họa nằm trong lời khuyên, không phải bài học cốt lõi mà cả câu trích dẫn hướng tới.","Nếu đề dẫn câu \"Một tấm gương sống còn có giá trị hơn một trăm bài diễn văn tuyên truyền\" và hỏi thuộc nguyên tắc đạo đức nào thì chọn ngay \"Nói đi đôi với làm, phải nêu gương về đạo đức\"."],[271,6,"Theo Hồ Chí Minh, để xây dựng con người, biện pháp quan trọng nhất là gì?",["Duy trì trật tự xã hội","Đấu tranh chống tiêu cực","Tăng cường pháp luật","Giáo dục"],3,"Trong tư tưởng Hồ Chí Minh về chiến lược trồng người, \"giáo dục\" là biện pháp quan trọng nhất để xây dựng con người mới phát triển toàn diện về đức, trí, thể, mỹ; Người từng đúc kết trong Nhật ký trong tù rằng hiền hay dữ không phải tính sẵn mà phần nhiều do giáo dục mà nên. Các biện pháp như \"duy trì trật tự xã hội\", \"đấu tranh chống tiêu cực\" hay \"tăng cường pháp luật\" có vai trò hỗ trợ, răn đe nhưng không thay thế được vai trò nền tảng của giáo dục.","Nếu đề hỏi mục tiêu lâu dài của công tác giáo dục qua câu nói nổi tiếng của Bác thì nhớ \"Vì lợi ích mười năm thì phải trồng cây, vì lợi ích trăm năm thì phải trồng người\"; còn nếu hỏi kết hợp các biện pháp xây dựng con người thì cần tự rèn luyện đi đôi với vai trò của giáo dục và các phong trào cách mạng."],[272,6,"Nói về vai trò của việc tu dưỡng, rèn luyện phẩm chất đạo đức Hồ Chí Minh viết: “Trời có bốn mùa: Xuân, Hạ, Thu, Đông / Đất có bốn phương: Đông, Tây, Nam, Bắc / Người có bốn đức: Cần, Kiệm, Liêm, Chính / Thiếu một mùa, thì không thành trời / Thiếu một phương, thì không thành đất / Thiếu một đức, thì không thành người.” Sáu câu thơ trên Người đưa ra trong bài viết nào?",["Di chúc","Đời sống mới","Sữa đổi lối làm việc","Cần, kiệm, liêm, chính"],3,"Sáu câu thơ ví bốn đức \"Cần, Kiệm, Liêm, Chính\" với bốn mùa của trời và bốn phương của đất được Hồ Chí Minh viết trong bài \"Cần, kiệm, liêm, chính\" (tháng 6 năm 1949, ký bút danh Lê Quyết Thắng). Các tác phẩm \"Di chúc\" (1969), \"Đời sống mới\" (1947) và \"Sửa đổi lối làm việc\" (1947) tuy đều bàn về đạo đức, lối sống nhưng không phải nguồn trích của sáu câu thơ này.","Mẹo phân biệt nhanh nguồn trích đạo đức: thơ \"Trời có bốn mùa... Người có bốn đức\" nằm trong \"Cần, kiệm, liêm, chính\" (1949); câu \"Cũng như sông thì có nguồn mới có nước...\" nằm trong \"Sửa đổi lối làm việc\" (1947); năm cách sửa đổi ăn, mặc, ở, đi lại, làm việc nằm trong \"Đời sống mới\" (1947)."],[273,6,"Câu “Đoàn viên và thanh niên ta nói chung là tốt, mọi việc đều hăng hái xung phong, không ngại khó khăn, có chí tiến thủ. Đảng cần phải chăm lo giáo dục đạo đức cách mạng cho họ, đào tạo họ thành những người thừa kế xây dựng chủ nghĩa xã hội vừa “hồng” vừa “chuyên”” được trích trong bài viết nào của Hồ Chí Minh?",["Lời khai mạc Đại hội Đảng lần thứ III (1960)","Tuyên ngôn độc lập (1945)","Đường cách mệnh (1927)","Di Chúc (1969)"],3,"Đoạn văn đánh giá cao đoàn viên, thanh niên và giao trách nhiệm cho Đảng chăm lo đào tạo họ thành những người thừa kế xây dựng chủ nghĩa xã hội vừa \"hồng\" vừa \"chuyên\" nằm trong bản \"Di Chúc (1969)\" của Chủ tịch Hồ Chí Minh. Lời khai mạc Đại hội III (1960), Tuyên ngôn Độc lập (1945) và Đường cách mệnh (1927) đều không có nội dung dặn dò này.","Trong Di chúc (1969), khi nhắc đến \"vừa hồng vừa chuyên\", \"hồng\" là đạo đức cách mạng, bản lĩnh chính trị, lý tưởng xã hội chủ nghĩa; còn \"chuyên\" là trình độ chuyên môn, tri thức, năng lực công tác — tương đồng với cặp phạm trù \"đức và tài\"."],[274,6,"Câu: “Cán bộ cần phải yêu thương, săn sóc người bệnh như anh em ruột thịt của mình, coi họ đau đớn cũng như mình đau đớn. \"Lương y như từ mẫu\", câu nói ấy rất đúng”. Bác Hồ nói câu trên trong bài viết nào?",["Thư gửi Hội nghị Y tế toàn quốc năm (1953)","Thư gửi Hội nghị Quân y năm (1948)","Thư gửi Trường Quân y năm (1946)","Thư gửi Hội nghị cán bộ y tế (1955)"],3,"Lời căn dặn nổi tiếng \"Lương y như từ mẫu\" và yêu cầu cán bộ y tế yêu thương, chăm sóc người bệnh như anh em ruột thịt được Hồ Chí Minh viết trong \"Thư gửi Hội nghị cán bộ y tế (1955)\" ngày 27 tháng 2 năm 1955 — dấu mốc sau này trở thành Ngày Thầy thuốc Việt Nam. Các bức thư gửi Hội nghị Y tế năm 1953, Hội nghị Quân y năm 1948 hay Trường Quân y năm 1946 đều là mốc nhiễu.","Nhớ mốc \"27/2/1955 – Thư gửi Hội nghị cán bộ y tế\" để vừa chọn đúng nguồn trích câu \"Lương y như từ mẫu\", vừa nhớ ba nội dung lớn Bác căn dặn ngành y: đoàn kết, thương yêu người bệnh và xây dựng nền y học dựa trên nguyên tắc khoa học, dân tộc và đại chúng."],[275,6,"Trong xây dựng lối sống mới, Hồ Chí Minh yêu cầu 5 cách phải sửa đổi không chỉ với mỗi người mà còn cho cả tập thể, cộng đồng. Đó là 5 cách gì?",["Cách làm việc, cách quản lý, cách ứng xử, cách ở và cách học tập","Cách ở, cách mặc, cách ăn, cách ứng xử, cách làm việc","Cách ở, cách ăn, cách mặc, cách đi lại, cách ứng xử","Cách ăn, cách mặc, cách ở, cách đi lại, cách làm việc"],3,"Trong tác phẩm \"Đời sống mới\" (1947), khi cụ thể hóa việc xây dựng lối sống mới cho mỗi cá nhân và cả cộng đồng, Hồ Chí Minh nêu rõ năm cách cần sửa đổi là \"cách ăn, cách mặc, cách ở, cách đi lại, cách làm việc\" theo hướng sạch sẽ, gọn gàng, giản dị, văn minh, khoa học. Các phương án đưa thêm \"cách quản lý\", \"cách ứng xử\" hay \"cách học tập\" đều làm sai lệch danh sách năm cách cụ thể mà Người đề ra.","Dễ nhớ bằng mẹo năm nhu cầu sinh hoạt - lao động thiết yếu hằng ngày: \"ăn - mặc - ở - đi lại - làm việc\". Nếu đề hỏi năm cách này thuộc nội dung nào trong ba nội dung của đời sống mới thì chọn \"Lối sống mới\"."],[276,6,"Theo tư tưởng Hồ Chí Minh, chính trị giải phóng thì sẽ như thế nào đối với văn hóa?",["Làm thay đổi bộ mặt văn hóa dân tộc","Thúc đẩy văn hoá phát triển","Mở rộng giao lưu văn hóa thế giới","Mở đường cho văn hoá phát triển"],3,"Khi phân tích mối quan hệ giữa văn hóa và chính trị ở một nước thuộc địa, Hồ Chí Minh chỉ rõ phải tiến hành cách mạng giải phóng dân tộc trước vì chính trị giải phóng thì sẽ \"mở đường cho văn hóa phát triển\" (nếu xã hội chưa được giải phóng thì văn hóa cũng bị nô dịch, không thể phát triển tự do). Các cụm từ \"làm thay đổi bộ mặt\", \"thúc đẩy\" hay \"mở rộng giao lưu\" không diễn đạt đúng nguyên văn luận điểm về vai trò mở đường của giải phóng chính trị.","Nếu đề hỏi chiều tác động ngược lại của \"văn hóa\" đối với \"chính trị\" thì chọn: văn hóa không đứng ngoài mà ở trong chính trị, phải phục vụ nhiệm vụ chính trị và tham gia vào quá trình giải phóng chính trị."],[277,6,"Mục tiêu của văn hoá giáo dục theo tư tưởng Hồ Chí Minh nhằm làm gì?",["Đổi mới nền giáo dục nước nhà","Bồi dưỡng tư tưởng đúng đắn và tình cảm cao đẹp","Bồi dưỡng những phẩm chất tốt đẹp, những phong cách lành mạnh","Nâng cao dân trí"],3,"Theo tư tưởng Hồ Chí Minh, lĩnh vực văn hóa giáo dục hướng trực tiếp tới mục tiêu diệt giặc dốt, xóa mù chữ, mở rộng hiểu biết và \"nâng cao dân trí\", qua đó đào tạo những công dân, cán bộ hữu ích cho đất nước. Các phương án \"bồi dưỡng tư tưởng đúng đắn và tình cảm cao đẹp\" và \"bồi dưỡng những phẩm chất tốt đẹp, những phong cách lành mạnh\" là hai chức năng khác của văn hóa nói chung, còn \"đổi mới nền giáo dục nước nhà\" là phương thức thực hiện chứ không phải mục tiêu cốt lõi theo câu hỏi.","Nếu đề hỏi \"chức năng hàng đầu của văn hóa\" nói chung thì chọn \"Bồi dưỡng tư tưởng đúng đắn và tình cảm cao đẹp\"; còn hỏi mục tiêu trực tiếp của \"văn hóa giáo dục\" thì chọn \"Nâng cao dân trí\"."],[278,6,"Theo tư tưởng Hồ Chí Minh: Văn nghệ là gì?",["Loại hình văn hóa đời sống","Lĩnh vực của đời sống xã hội","Nghệ thuật","Mặt trận"],3,"Trong \"Thư gửi các họa sĩ nhân dịp triển lãm hội họa năm 1951\", Hồ Chí Minh khẳng định luận điểm nổi tiếng: văn hóa nghệ thuật cũng là một \"mặt trận\", và anh chị em văn nghệ sĩ là chiến sĩ trên mặt trận ấy. Gọi văn nghệ đơn thuần là \"loại hình văn hóa đời sống\", \"lĩnh vực của đời sống xã hội\" hay \"nghệ thuật\" không lột tả được tính chiến đấu và vai trò xung kích cách mạng mà Hồ Chí Minh nhấn mạnh.","Nếu đề hỏi Hồ Chí Minh ví \"văn nghệ sĩ\" là gì trên mặt trận văn hóa nghệ thuật thì chọn \"Chiến sĩ\"; còn hỏi vũ khí của người chiến sĩ văn nghệ là gì thì chọn \"ngòi bút\" (\"ngòi bút của các bạn cũng là những vũ khí sắc bén trong sự nghiệp phò chính trừ tà\")."],[279,6,"Hồ Chí Minh viết: “Tuy năng lực và công việc của mỗi người khác nhau, người làm việc to, việc nhỏ, những ai giữ được đạo đức đều là người cao thượng”. Câu nói trên của Người đề cập tới vấn đề gì?",["Nguyên tắc xây dựng đạo đức mới","Các chuẩn mực đạo đức cách mạng","Chuẩn mực và nguyên tắc xây dựng đạo đức","Vai trò và sức mạnh của đạo đức"],3,"Câu nói trên trích từ bài viết \"Người cán bộ cách mạng\" (1955) khẳng định dù vị trí công tác lớn hay nhỏ, chính việc giữ vững phẩm chất đạo đức mới làm nên giá trị cao thượng của con người, qua đó đề cập trực tiếp tới \"vai trò và sức mạnh của đạo đức\". Câu trích không liệt kê cụ thể các chuẩn mực (như trung, hiếu, cần, kiệm) hay các nguyên tắc rèn luyện (như nói đi đôi với làm, xây đi đôi với chống).","Nếu đề dẫn các câu so sánh đạo đức với \"nguồn của sông\", \"gốc của cây\" hoặc khẳng định đạo đức tạo nên sức hấp dẫn của chủ nghĩa xã hội và sự cao thượng của con người thì đều xếp vào nội dung \"Vai trò và sức mạnh của đạo đức\"."],[280,6,"Vận dụng tư tưởng Hồ Chí Minh thì mục đích của việc học là để làm gì?",["Học để lấy bằng cấp cao","Học để đạt học vị cao","Học để bằng bạn bằng bè","Học để làm việc, làm người, để phụng sự nhân dân và tổ quốc"],3,"Trong sổ vàng Trường Nguyễn Ái Quốc Trung ương tháng 9 năm 1949, Hồ Chí Minh xác định rõ mục đích đúng đắn, nhân văn của việc học là \"học để làm việc, làm người, để phụng sự nhân dân và tổ quốc\" (nguyên văn còn nhấn mạnh làm cán bộ, phụng sự đoàn thể, giai cấp và nhân loại). Các động cơ \"lấy bằng cấp cao\", \"đạt học vị cao\" hay \"bằng bạn bằng bè\" đều mang tính hình thức, vụ lợi cá nhân, trái với tư tưởng giáo dục của Người.","Nếu đề hỏi phương châm học tập theo tư tưởng Hồ Chí Minh thì chọn \"Học đi đôi với hành\", \"Lý luận gắn liền với thực tiễn\", và \"Học không bao giờ cùng, học mãi để tiến bộ mãi\"."]];
  const QUESTIONS = RAW_BANK.map(([num, chapter, stem, options, correctIdx, why, twist]) => ({
    id: String(num),

    correctIdx,

  const Q_BY_ID = new Map(QUESTIONS.map((q) => [q.id, q]));
  const LETTERS = ['A', 'B', 'C', 'D'];

  // Minimal zero-dependency QR Code encoder (ISO/IEC 18004, Byte mode, ECC M, Versions 1..8)
const GF_EXP = new Uint8Array(512);
const GF_LOG = new Uint8Array(256);
(() => {
  let x = 1;
  for (let i = 0; i < 255; i++) {
    GF_EXP[i] = x;
    GF_LOG[x] = i;
    x <<= 1;
    if (x & 0x100) x ^= 0x11d;
  }
  for (let i = 255; i < 512; i++) GF_EXP[i] = GF_EXP[i - 255];
})();

function gfMul(a, b) {
  return a === 0 || b === 0 ? 0 : GF_EXP[GF_LOG[a] + GF_LOG[b]];
}

function rsGeneratorPoly(ecLen) {
  let g = [1];
  for (let i = 0; i < ecLen; i++) {
    const next = new Array(g.length + 1).fill(0);
    const root = GF_EXP[i];
    for (let j = 0; j < g.length; j++) {
      next[j] ^= g[j];
      next[j + 1] ^= gfMul(g[j], root);
    }
    g = next;
  }
  return g;
}

function rsEncode(data, ecLen) {
  const gen = rsGeneratorPoly(ecLen);
  const res = new Uint8Array(data.length + ecLen);
  res.set(data);
  for (let i = 0; i < data.length; i++) {
    const coef = res[i];
    if (coef !== 0) {
      for (let j = 0; j < gen.length; j++) {
        res[i + j] ^= gfMul(gen[j], coef);
      }
    }
  }
  return res.slice(data.length);
}

// Version specs for ECC Level M: [totalDataBytes, ecPerBlock, [group1Count, group1Data, group2Count, group2Data], alignCoords]
const SPECS_M = {
  1: [16, 10, [1, 16, 0, 0], []],
  2: [28, 16, [1, 28, 0, 0], [6, 18]],
  3: [44, 26, [1, 44, 0, 0], [6, 22]],
  4: [64, 18, [2, 32, 0, 0], [6, 26]],
  5: [86, 24, [2, 43, 0, 0], [6, 30]],
  6: [108, 16, [4, 27, 0, 0], [6, 34]],
  7: [124, 18, [4, 31, 0, 0], [6, 22, 38]],
  8: [154, 22, [2, 38, 2, 39], [6, 24, 42]],

function encodeBytesToCodewords(bytes) {
  let version = 0;

    // 4-bit mode + 8-bit length + 8*bytes + up to 4 terminator bits <= totalDataBytes*8
    if (4 + 8 + bytes.length * 8 <= SPECS_M[v][0] * 8) {
      version = v;
      break;
    }
  }
  if (!version) throw new Error('QR payload too long for Versions 1..8');

  const [totalData, ecLen, [g1c, g1d, g2c, g2d], align] = SPECS_M[version];
  const bits = [];
  const pushBits = (val, len) => {
    for (let i = len - 1; i >= 0; i--) bits.push((val >> i) & 1);
  };
  pushBits(0b0100, 4); // Byte mode
  pushBits(bytes.length, 8); // Char count (V1..V9)
  for (const b of bytes) pushBits(b, 8);
  const maxBits = totalData * 8;
  for (let i = 0; i < 4 && bits.length < maxBits; i++) bits.push(0);
  while (bits.length % 8 !== 0) bits.push(0);

  const data = [];
  for (let i = 0; i < bits.length; i += 8) {
    let val = 0;
    for (let j = 0; j < 8; j++) val = (val << 1) | bits[i + j];
    data.push(val);
  }
  const pads = [0xec, 0x11];
  let pi = 0;
  while (data.length < totalData) {
    data.push(pads[pi & 1]);
    pi++;
  }

  // Split into blocks and interleave
  const blocksData = [];
  const blocksEc = [];
  let offset = 0;
  for (let i = 0; i < g1c; i++) {
    const slice = data.slice(offset, offset + g1d);
    offset += g1d;
    blocksData.push(slice);
    blocksEc.push(Array.from(rsEncode(slice, ecLen)));
  }
  for (let i = 0; i < g2c; i++) {
    const slice = data.slice(offset, offset + g2d);
    offset += g2d;
    blocksData.push(slice);
    blocksEc.push(Array.from(rsEncode(slice, ecLen)));
  }

  const finalBytes = [];
  const maxD = Math.max(g1d, g2d);
  for (let i = 0; i < maxD; i++) {
    for (const bd of blocksData) if (i < bd.length) finalBytes.push(bd[i]);
  }
  for (let i = 0; i < ecLen; i++) {
    for (const be of blocksEc) if (i < be.length) finalBytes.push(be[i]);
  }

  return { version, align, finalBytes };
}

function calcFormatBits(maskIdx) {
  // ECC Level M = 00
  const data = (0b00 << 3) | maskIdx;
  let rem = data << 10;
  const gen = 0b10100110111;
  for (let i = 14; i >= 10; i--) {
    if ((rem >> i) & 1) rem ^= gen << (i - 10);
  }
  return ((data << 10) | rem) ^ 0b101010000010010;
}

function calcVersionBits(version) {
  let rem = version << 12;
  const gen = 0b1111100100101;
  for (let i = 17; i >= 12; i--) {
    if ((rem >> i) & 1) rem ^= gen << (i - 12);
  }
  return (version << 12) | rem;
}

function createMatrix(version, align, finalBytes) {
  const size = version * 4 + 17;
  const mod = Array.from({ length: size }, () => new Int8Array(size).fill(-1));
  const isFunc = Array.from({ length: size }, () => new Uint8Array(size));

  const setFunc = (r, c, v) => {
    if (r >= 0 && r < size && c >= 0 && c < size) {
      mod[r][c] = v ? 1 : 0;
      isFunc[r][c] = 1;
    }
  };

  const drawFinder = (r0, c0) => {
    for (let dr = -1; dr <= 7; dr++) {
      for (let dc = -1; dc <= 7; dc++) {
        const r = r0 + dr, c = c0 + dc;
        if (r < 0 || r >= size || c < 0 || c >= size) continue;
        const on =
          (dr >= 0 && dr <= 6 && (dc === 0 || dc === 6)) ||
          (dc >= 0 && dc <= 6 && (dr === 0 || dr === 6)) ||
          (dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4);
        setFunc(r, c, on);
      }
    }
  };
  drawFinder(0, 0);
  drawFinder(0, size - 7);
  drawFinder(size - 7, 0);

  // Alignment patterns
  for (const ar of align) {
    for (const ac of align) {
      if ((ar === 6 && ac === 6) || (ar === 6 && ac === size - 7) || (ar === size - 7 && ac === 6)) continue;
      for (let dr = -2; dr <= 2; dr++) {
        for (let dc = -2; dc <= 2; dc++) {
          const on = Math.abs(dr) === 2 || Math.abs(dc) === 2 || (dr === 0 && dc === 0);
          setFunc(ar + dr, ac + dc, on);
        }
      }
    }
  }

  // Timing patterns
  for (let i = 8; i < size - 8; i++) {
    const bit = i % 2 === 0;
    if (!isFunc[6][i]) setFunc(6, i, bit);
    if (!isFunc[i][6]) setFunc(i, 6, bit);
  }

  // Dark module
  setFunc(size - 8, 8, true);

  // Reserve format info zones
  for (let i = 0; i <= 8; i++) {
    if (!isFunc[8][i]) setFunc(8, i, false);
    if (!isFunc[i][8]) setFunc(i, 8, false);
  }
  for (let i = size - 8; i < size; i++) {
    if (!isFunc[8][i]) setFunc(8, i, false);
  }
  for (let i = size - 7; i < size; i++) {
    if (!isFunc[i][8]) setFunc(i, 8, false);
  }

  // Version info for V7+
  if (version >= 7) {
    const vb = calcVersionBits(version);
    for (let i = 0; i < 18; i++) {
      const bit = Boolean((vb >> i) & 1);
      const a = Math.floor(i / 3);
      const b = size - 11 + (i % 3);
      setFunc(a, b, bit);
      setFunc(b, a, bit);
    }
  }

  // Place data bits in zig-zag
  const allBits = [];
  for (const byte of finalBytes) {
    for (let b = 7; b >= 0; b--) allBits.push((byte >> b) & 1);
  }
  let bitIdx = 0;
  let upward = true;
  for (let right = size - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
    for (let step = 0; step < size; step++) {
      const r = upward ? size - 1 - step : step;
      for (let dx = 0; dx < 2; dx++) {
        const c = right - dx;
        if (!isFunc[r][c]) {
          mod[r][c] = bitIdx < allBits.length ? allBits[bitIdx++] : 0;
        }
      }
    }
    upward = !upward;
  }

  // Try all 8 masks and choose lowest penalty
  const masks = [
    (r, c) => (r + c) % 2 === 0,
    (r, c) => r % 2 === 0,
    (r, c) => c % 3 === 0,
    (r, c) => (r + c) % 3 === 0,
    (r, c) => (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0,
    (r, c) => ((r * c) % 2) + ((r * c) % 3) === 0,
    (r, c) => (((r * c) % 2) + ((r * c) % 3)) % 2 === 0,
    (r, c) => (((r + c) % 2) + ((r * c) % 3)) % 2 === 0,
  ];

  const writeFormat = (grid, maskIdx) => {
    const fb = calcFormatBits(maskIdx);
    for (let i = 0; i <= 5; i++) grid[8][i] = (fb >> i) & 1;
    grid[8][7] = (fb >> 6) & 1;
    grid[8][8] = (fb >> 7) & 1;
    grid[7][8] = (fb >> 8) & 1;
    for (let i = 9; i < 15; i++) grid[14 - i][8] = (fb >> i) & 1;

    for (let i = 0; i < 8; i++) grid[8][size - 1 - i] = (fb >> i) & 1;
    for (let i = 8; i < 15; i++) grid[size - 15 + i][8] = (fb >> i) & 1;
  };

  const penalty = (grid) => {
    let score = 0;
    // Rule 1: 5+ consecutive same color in rows and cols
    for (let r = 0; r < size; r++) {
      let run = 1;
      for (let c = 1; c < size; c++) {
        if (grid[r][c] === grid[r][c - 1]) run++;
        else { if (run >= 5) score += 3 + (run - 5); run = 1; }
      }
      if (run >= 5) score += 3 + (run - 5);
    }
    for (let c = 0; c < size; c++) {
      let run = 1;
      for (let r = 1; r < size; r++) {
        if (grid[r][c] === grid[r - 1][c]) run++;
        else { if (run >= 5) score += 3 + (run - 5); run = 1; }
      }
      if (run >= 5) score += 3 + (run - 5);
    }
    // Rule 2: 2x2 blocks
    for (let r = 0; r < size - 1; r++) {
      for (let c = 0; c < size - 1; c++) {
        const v = grid[r][c];
        if (v === grid[r][c + 1] && v === grid[r + 1][c] && v === grid[r + 1][c + 1]) score += 3;
      }
    }
    // Rule 3: finder-like patterns
    const checkSeq = (arr) => {
      let hits = 0;
      for (let i = 0; i <= arr.length - 11; i++) {
        if (
          (arr[i]===1&&arr[i+1]===0&&arr[i+2]===1&&arr[i+3]===1&&arr[i+4]===1&&arr[i+5]===0&&arr[i+6]===1&&arr[i+7]===0&&arr[i+8]===0&&arr[i+9]===0&&arr[i+10]===0) ||
          (arr[i]===0&&arr[i+1]===0&&arr[i+2]===0&&arr[i+3]===0&&arr[i+4]===1&&arr[i+5]===0&&arr[i+6]===1&&arr[i+7]===1&&arr[i+8]===1&&arr[i+9]===0&&arr[i+10]===1)
        ) hits++;
      }
      return hits * 40;
    };
    for (let r = 0; r < size; r++) score += checkSeq(grid[r]);
    for (let c = 0; c < size; c++) {
      const col = [];
      for (let r = 0; r < size; r++) col.push(grid[r][c]);
      score += checkSeq(col);
    }
    // Rule 4: dark ratio
    let dark = 0;
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) if (grid[r][c]) dark++;
    const pct = (dark * 100) / (size * size);
    const prev5 = Math.abs(Math.floor(pct / 5) * 5 - 50) / 5;
    const next5 = Math.abs(Math.ceil(pct / 5) * 5 - 50) / 5;
    score += Math.min(prev5, next5) * 10;
    return score;
  };

  let bestGrid = null;
  let bestScore = Infinity;
  for (let m = 0; m < 8; m++) {
    const g = mod.map((row, r) => row.map((v, c) => (isFunc[r][c] ? v : v ^ (masks[m](r, c) ? 1 : 0))));
    writeFormat(g, m);
    const s = penalty(g);
    if (s < bestScore) {
      bestScore = s;
      bestGrid = g;
    }
  }
  return bestGrid;
}

function generateQrMatrix(text) {
  const bytes = new TextEncoder().encode(text);
  const { version, align, finalBytes } = encodeBytesToCodewords(bytes);
  return createMatrix(version, align, finalBytes);
}

function generateQrSvg(text, darkColor = '#0F2942', lightColor = '#FFFFFF') {

  const total = n + pad * 2;
  let rects = '';
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      if (matrix[r][c]) {
        rects += `<rect x="${c + pad}" y="${r + pad}" width="1" height="1"/>`;
      }
    }
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${total}" shape-rendering="crispEdges" role="img" aria-label="Mã QR truy cập nhanh"><rect width="${total}" height="${total}" fill="${lightColor}"/><g fill="${darkColor}">${rects}</g></svg>`;
}

    swap: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 3 4 4-4 4M20 7H4M8 21l-4-4 4-4M4 17h16"/></svg>',
  };

  function shuffleArr(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function makeOptionPerms() {
    const map = {};
    for (const q of QUESTIONS) {
      map[q.id] = shuffleArr([0, 1, 2, 3]);
    }
    return map;
  }

  function defaultTimeForCount(count) {
    if (count <= 20) return 15 * 60;
    if (count <= 60) return 45 * 60;
    if (count <= 90) return 60 * 60;
    return 120 * 60;
  }

  function createEmptyProgress(count) {
    return {
      index: 0,
      answers: {}, // qid -> original option index (0..3)
      flags: {},
      submitted: false,
      timeLeft: defaultTimeForCount(count),
      elapsed: 0,
    };
  }

  function createInitialState() {
    const allIds = QUESTIONS.map((q) => q.id);
    const mixed = shuffleArr(allIds);
    const mock50 = shuffleArr(allIds).slice(0, 50);
    return {
      deck: 'chapters',
      chapter: 0, // 0 = all 280, 1..6 = chapter num
      mode: 'practice',
      ballotFilter: 'all',
      mixedOrder: mixed,
      mock50Order: mock50,
      optionPerms: makeOptionPerms(),
      wrongIds: [],
      progress: {},
    };
  }

  function loadState() {
    const fresh = createInitialState();
    try {
      const rawStr = localStorage.getItem(STORAGE_KEY);
      if (!rawStr) return fresh;
      const saved = JSON.parse(rawStr);
      if (saved && typeof saved === 'object') {
        if (['chapters', 'mock50', 'mixed280', 'wrong'].includes(saved.deck)) fresh.deck = saved.deck;
        if (typeof saved.chapter === 'number' && saved.chapter >= 0 && saved.chapter <= 6) fresh.chapter = saved.chapter;
        if (['practice', 'exam'].includes(saved.mode)) fresh.mode = saved.mode;
        if (Array.isArray(saved.mixedOrder) && saved.mixedOrder.length === QUESTIONS.length && saved.mixedOrder.every((id) => Q_BY_ID.has(id))) {
          fresh.mixedOrder = saved.mixedOrder;
        }
        if (Array.isArray(saved.mock50Order) && saved.mock50Order.length === 50 && saved.mock50Order.every((id) => Q_BY_ID.has(id))) {
          fresh.mock50Order = saved.mock50Order;
        }
        if (saved.optionPerms && typeof saved.optionPerms === 'object') {
          for (const q of QUESTIONS) {
            const p = saved.optionPerms[q.id];
            if (Array.isArray(p) && p.length === 4) fresh.optionPerms[q.id] = p;
          }
        }
        if (Array.isArray(saved.wrongIds)) {
          fresh.wrongIds = saved.wrongIds.filter((id) => Q_BY_ID.has(id));
        }
        if (saved.progress && typeof saved.progress === 'object') {
          fresh.progress = saved.progress;
        }
      }
    } catch {}
    return fresh;
  }

  let state = loadState();
  let timerHandle = null;
  let pendingConfirmAction = null;

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
  }

  function getDeckQuestionIds(deckId = state.deck, ch = state.chapter) {
    if (deckId === 'chapters') {
      if (ch === 0) return QUESTIONS.map((q) => q.id);
      return QUESTIONS.filter((q) => q.chapter === ch).map((q) => q.id);
    }
    if (deckId === 'mock50') return state.mock50Order;
    if (deckId === 'mixed280') return state.mixedOrder;
    return state.wrongIds.filter((id) => Q_BY_ID.has(id));
  }

  function sessionKey() {
    const scope = state.deck === 'chapters' ? ('ch' + state.chapter) : state.deck;
    return scope + ':' + state.mode;
  }

  function currentProgress() {
    const key = sessionKey();
    if (!state.progress[key]) {
      state.progress[key] = createEmptyProgress(getDeckQuestionIds().length);
    }
    return state.progress[key];
  }

  function formatSec(sec) {
    const s = Math.max(0, Math.floor(sec));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function syncTimer() {
    if (timerHandle) {
      clearInterval(timerHandle);
      timerHandle = null;
    }
    const ids = getDeckQuestionIds();
    const prog = currentProgress();
    if (state.mode === 'exam' && !prog.submitted && ids.length > 0 && prog.timeLeft > 0) {
      timerHandle = setInterval(() => {
        const p = currentProgress();
        if (state.mode !== 'exam' || p.submitted || getDeckQuestionIds().length === 0) {
          syncTimer();
          return;
        }
        p.timeLeft = Math.max(0, p.timeLeft - 1);
        p.elapsed = (p.elapsed || 0) + 1;
        const timerEl = document.getElementById('live-timer-val');
        if (timerEl) timerEl.textContent = formatSec(p.timeLeft);
        if (p.timeLeft === 0) submitExam(true);
        else if (p.timeLeft % 5 === 0) saveState();
      }, 1000);
    }
  }

  function triggerKittyHop() {
    const k = document.getElementById('btn-kitty-mascot');
    if (!k) return;
    k.classList.remove('hop');
    void k.offsetWidth;
    k.classList.add('hop');
  }

  function addWrongId(qid) {
    if (!state.wrongIds.includes(qid)) state.wrongIds.push(qid);
  }

  function removeWrongId(qid) {
    state.wrongIds = state.wrongIds.filter((id) => id !== qid);
    ['wrong:practice', 'wrong:exam'].forEach((k) => {
      if (state.progress[k]) {
        delete state.progress[k].answers[qid];
        const rem = getDeckQuestionIds('wrong').length;
        state.progress[k].index = rem > 0 ? Math.min(state.progress[k].index, rem - 1) : 0;
      }
    });
  }

  function selectDisplayIndex(displayPos) {
    const ids = getDeckQuestionIds();
    if (!ids.length) return;
    const prog = currentProgress();
    const qid = ids[prog.index];
    if (state.mode === 'exam' && prog.submitted) return;
    if (state.mode === 'practice' && prog.answers[qid] !== undefined) return;

    const q = Q_BY_ID.get(qid);
    const perm = state.optionPerms[qid] || [0, 1, 2, 3];
    const origIdx = perm[displayPos];
    prog.answers[qid] = origIdx;

    if (state.mode === 'practice') {
      if (origIdx === q.correctIdx) triggerKittyHop();
      else addWrongId(qid);
    }
    saveState();
    render();
  }

  function submitExam(autoTimeout = false) {
    const ids = getDeckQuestionIds();
    const prog = currentProgress();
    if (prog.submitted || !ids.length) return;

    const unanswered = ids.filter((id) => prog.answers[id] === undefined).length;
    if (!autoTimeout && unanswered > 0) {
      openConfirm(
        'Nộp bài thi thử?',
        'Còn ' + unanswered + ' câu chưa trả lời. Bạn vẫn muốn nộp bài và chấm điểm ngay bây giờ?',
        () => finalizeExamSubmit()
      );
      return;
    }
    finalizeExamSubmit();
  }

  function finalizeExamSubmit() {
    const ids = getDeckQuestionIds();
    const prog = currentProgress();
    prog.submitted = true;
    for (const id of ids) {
      const q = Q_BY_ID.get(id);
      if (prog.answers[id] !== undefined && prog.answers[id] !== q.correctIdx) {
        addWrongId(id);
      }
    }
    syncTimer();
    saveState();
    const main = document.getElementById('main-stage');
    if (main) main.scrollTop = 0;
    render();

    const ids = getDeckQuestionIds();
    if (state.deck === 'mixed280') {

    } else if (state.deck === 'mock50') {
      state.mock50Order = shuffleArr(QUESTIONS.map((q) => q.id)).slice(0, 50);
    }
    // Reshuffle A-B-C-D positions for the reset deck so answers stay fresh
    for (const id of getDeckQuestionIds()) {
      state.optionPerms[id] = shuffleArr([0, 1, 2, 3]);

    state.progress[sessionKey()] = createEmptyProgress(getDeckQuestionIds().length || ids.length);
