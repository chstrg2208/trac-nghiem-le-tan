n Pháp, Chủ tịch Hồ Chí Minh viết 'Lời kêu gọi toàn quốc kháng chiến' tại làng Vạn Phúc (Hà Đông), chính thức mở đầu cuộc kháng chiến trường kỳ chống thực dân Pháp. Năm 1944 là trước Cách mạng Tháng Tám, năm 1945 mới giành độc lập, còn năm 1955 kháng chiến chống Pháp đã kết thúc.","Nếu đề trích câu 'Chúng ta thà hy sinh tất cả, chứ nhất định không chịu mất nước, nhất định không chịu làm nô lệ' và hỏi trích từ văn kiện nào thì chọn 'Lời kêu gọi toàn quốc kháng chiến' (19-12-1946)."],[60,3,"Hồ Chí Minh nói: \"Không có gì quý hơn độc lập, tự do\" vào thời gian nào?",["Năm 1945","Năm 1954","Năm 1960","Năm 1966"],3,"Ngày 17-7-1966, khi đế quốc Mỹ leo thang chiến tranh bắn phá ác liệt ra miền Bắc, Hồ Chí Minh đã ra Lời kêu gọi đồng bào và chiến sĩ cả nước chống Mỹ, cứu nước, trong đó vang lên chân lý thời đại: 'Không có gì quý hơn độc lập, tự do'. Các mốc 1945 (Tuyên ngôn Độc lập), 1954 (Điện Biên Phủ) và 1960 (Đại hội III) đều không phải thời điểm ra đời câu nói này.","Nếu đề hỏi hoàn cảnh lịch sử của câu 'Không có gì quý hơn độc lập, tự do' thì chọn giai đoạn kháng chiến chống Mỹ cứu nước (17-7-1966); đừng nhầm với câu 'Dù có phải đốt cháy cả dãy Trường Sơn...' (tháng 8-1945) hay câu kết trong Tuyên ngôn Độc lập (2-9-1945)."],[61,3,"Hồ Chí Minh chủ yếu bàn về vấn đề dân tộc nào?",["Phong kiến","Tư sản","Chính quốc","Thuộc địa"],3,"Xuất phát từ hoàn cảnh Việt Nam và các nước bị đế quốc thống trị, Hồ Chí Minh chủ yếu bàn về vấn đề dân tộc thuộc địa – tức đấu tranh chống chủ nghĩa thực dân, xóa bỏ ách áp bức để giành độc lập, tự do cho các dân tộc bị áp bức. Người không đặt trọng tâm vào vấn đề dân tộc kiểu phong kiến, tư sản hay dân tộc chính quốc nói chung.","Nếu đề hỏi thực chất của vấn đề dân tộc thuộc địa theo Hồ Chí Minh là gì thì chọn đấu tranh chống chủ nghĩa thực dân, giải phóng dân tộc và lựa chọn con đường phát triển của dân tộc (gắn độc lập dân tộc với chủ nghĩa xã hội)."],[62,3,"Theo Hồ Chí Minh, cách mạng giải phóng dân tộc muốn giành được thắng lợi phải đi theo con đường nào?",["Cách mạng tư sản","Cách mạng tư sản dân quyền và thổ địa cách mạng","Cách mạng dân chủ mới","Cách mạng vô sản"],3,"Sau khi khảo nghiệm các cuộc cách mạng tư sản Mỹ, Pháp và tiếp thu Luận cương của Lênin, Hồ Chí Minh khẳng định chân lý: 'Muốn cứu nước và giải phóng dân tộc không có con đường nào khác con đường cách mạng vô sản'. Cách mạng tư sản bị Người đánh giá là 'chưa đến nơi', còn các khái niệm khác không phản ánh trực tiếp kết luận khái quát nhất về con đường cứu nước của Người.","Nếu đề hỏi Hồ Chí Minh đánh giá cuộc Cách mạng Mỹ (1776) và Cách mạng Pháp (1789) như thế nào trong 'Đường cách mệnh' thì chọn 'cách mệnh không đến nơi', vì tiếng là cộng hòa dân chủ nhưng trong thì vẫn tước lục công nông, ngoài thì áp bức thuộc địa."],[63,3,"Hồ Chí Minh khẳng định chủ nghĩa dân tộc là một động lực lớn ở các nước đang đấu tranh giành độc lập. Đó là chủ nghĩa dân tộc nào?",["Dân tộc xã hội chủ nghĩa","Dân tộc dân chủ nhân dân","Dân tộc Sô vanh","Dân tộc chân chính"],3,"Hồ Chí Minh chỉ rõ chủ nghĩa dân tộc chân chính – bắt nguồn từ lòng yêu nước thiết tha, tinh thần tự tôn dân tộc gắn với đoàn kết quốc tế – là một động lực lớn thúc đẩy nhân dân các nước thuộc địa đứng lên giành độc lập. Người kiên quyết phân biệt nó với chủ nghĩa dân tộc Sô-vanh (nước lớn, cực đoan, vị kỷ) của giai cấp tư sản.","Nếu đề hỏi Nguyễn Ái Quốc đề xuất khái niệm 'chủ nghĩa dân tộc là một động lực lớn của đất nước' trong tài liệu nào (năm 1924) thì chọn 'Báo cáo về Bắc Kỳ, Trung Kỳ và Nam Kỳ' gửi Quốc tế Cộng sản."],[64,3,"Nội dung cốt lõi của vấn đề dân tộc thuộc địa là gì?",["Giải phóng con người","Giải phóng giai cấp công nhân","Chủ nghĩa xã hội","Độc lập dân tộc"],3,"Nội dung cốt lõi, xuyên suốt của vấn đề dân tộc thuộc địa trong tư tưởng Hồ Chí Minh là độc lập dân tộc – giành lại quyền sống, quyền tự do và quyền tự quyết thiêng liêng cho dân tộc bị áp bức. Các mục tiêu như giải phóng giai cấp công nhân, xây dựng chủ nghĩa xã hội hay giải phóng con người là những nấc thang tiếp nối, chỉ thực hiện triệt để khi đã có độc lập dân tộc.","Nếu đề hỏi nội dung cốt lõi của toàn bộ tư tưởng Hồ Chí Minh (không chỉ riêng vấn đề dân tộc thuộc địa) thì chọn 'độc lập dân tộc gắn liền với chủ nghĩa xã hội'; còn nếu hỏi riêng mục tiêu trực tiếp, trước hết của cách mạng thuộc địa thì chọn 'độc lập dân tộc'."],[65,3,"Theo Hồ Chí Minh, cách mạng giải phóng dân tộc muốn dành thắng lợi thì phải:",["Đi theo con đường cách mạng tư sản","Do nhiều tổ chức đảng cùng lãnh đạo","Dựa trên lực lượng công nhân","Đi theo con đường cách mạng vô sản, do Đảng Cộng sản lãnh đạo, dựa trên liên minh công – nông"],3,"Theo tư tưởng Hồ Chí Minh, để cách mạng giải phóng dân tộc thắng lợi triệt để, phải hội tụ đồng thời ba điều kiện then chốt: đi theo con đường cách mạng vô sản, đặt dưới sự lãnh đạo duy nhất của Đảng Cộng sản và dựa trên khối đại đoàn kết toàn dân mà nền tảng là liên minh công – nông. Các phương án đi theo cách mạng tư sản, đa đảng lãnh đạo hay chỉ dựa vào công nhân đơn lẻ đều trái với quan điểm của Người.","Nếu đề hỏi riêng lực lượng của cách mạng giải phóng dân tộc theo Hồ Chí Minh là ai thì chọn 'toàn dân tộc' (cách mệnh là việc chung cả dân chúng chứ không phải việc một hai người), trong đó công – nông là gốc, là chủ cách mệnh."],[66,3,"Theo Tư tưởng Hồ Chí Minh, trong thời kỳ quá độ lên chủ nghĩa xã hội, không tồn tại hình thức sở hữu nào?",["Sở hữu nhà nước","Sở hữu hợp tác xã","Sở hữu của người lao động riêng lẻ","Sở hữu tư bản nhà nước"],3,"Theo quan niệm về các hình thức sở hữu cơ bản trong thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam được trình bày trong giáo trình, nền kinh tế tồn tại ba hình thức sở hữu là sở hữu nhà nước (toàn dân), sở hữu hợp tác xã (tập thể) và sở hữu của người lao động riêng lẻ. 'Sở hữu tư bản nhà nước' không phải một hình thức sở hữu riêng biệt trong phân loại này (tư bản nhà nước là một thành phần kinh tế hỗn hợp).","Nếu đề hỏi có mấy hình thức sở hữu trong thời kỳ quá độ (như câu 76 cùng chuyên đề) thì chọn ba hình thức sở hữu; chú ý phân biệt với 'thành phần kinh tế' (thường gồm quốc doanh, hợp tác xã, cá thể, tư bản tư nhân và tư bản nhà nước)."],[67,3,"Theo Tư tưởng Hồ Chí Minh, đặc điểm cơ bản nhất của thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam là gì?",["Nông nghiệp lạc hậu","Công nghiệp chưa phát triển","Không trải qua giai đoạn phát triển tư bản chủ nghĩa","Từ nước nông nghiệp lạc hậu tiến thẳng lên chủ nghĩa xã hội, không qua giai đoạn phát triển tư bản chủ nghĩa"],3,"Hồ Chí Minh khái quát đặc điểm to lớn và cơ bản nhất của nước ta khi bước vào thời kỳ quá độ là: 'từ một nước nông nghiệp lạc hậu tiến thẳng lên chủ nghĩa xã hội, không phải kinh qua giai đoạn phát triển tư bản chủ nghĩa'. Ba phương án còn lại đều chỉ nêu rời rạc từng vế nên chưa thể hiện trọn vẹn tính đặc thù của đặc điểm này.","Nếu đề hỏi đặc điểm này quy định tính chất nào của thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam thì chọn tính chất 'lâu dài, khó khăn, phức tạp', đòi hỏi phải làm dần dần, không được chủ quan nóng vội."],[68,3,"Hồ Chí Minh tiếp cận chủ nghĩa xã hội từ phương diện nào?",["Chế độ công hữu xã hội chủ nghĩa","Sự ưu việt của chế độ phân phối công bằng","Bình đẳng về quyền lợi","Kinh tế, chính trị; xã hội; văn hoá - đạo đức"],3,"Hồ Chí Minh tiếp cận chủ nghĩa xã hội một cách toàn diện trên đầy đủ các phương diện cốt yếu của đời sống xã hội gồm kinh tế, chính trị, xã hội và văn hóa – đạo đức, qua đó hình thành bức tranh sinh động, gần gũi với nhân dân. Những lựa chọn chỉ nhắc chế độ công hữu, phân phối hay quyền lợi đều phiến diện, mới chạm đến một lát cắt nhỏ.","Nếu đề hỏi điểm độc đáo, sáng tạo nổi bật trong cách tiếp cận chủ nghĩa xã hội của Hồ Chí Minh so với các nhà kinh điển phương Tây thì nhớ hai phương diện đặc sắc: tiếp cận từ khát vọng giải phóng dân tộc (chủ nghĩa yêu nước) và từ phương diện văn hóa – đạo đức nhân văn."],[69,3,"Hồ Chí Minh tiếp cận chủ nghĩa xã hội từ nền tảng tư tưởng, lý luận nào?",["Quy luật mâu thuẫn và đấu tranh giai cấp của chủ nghĩa Mác-Lênin","Tư tưởng tự do, bình đẳng, bác ái của phương Tây","Thuyết Tam dân","Chủ nghĩa yêu nước và truyền thống văn hoá dân tộc"],3,"Điểm độc đáo trong con đường tiếp cận chủ nghĩa xã hội của Hồ Chí Minh là Người đi từ chủ nghĩa yêu nước và truyền thống văn hóa nhân ái, cộng đồng của dân tộc Việt Nam để gặp gỡ và tiếp nhận lý luận khoa học của chủ nghĩa Mác – Lênin. Người không tiếp cận thuần túy từ mâu thuẫn tư bản – vô sản ở phương Tây, cũng không lấy thuyết Tam dân hay tư tưởng tư sản làm nền tảng xây dựng chủ nghĩa xã hội.","Nếu đề hỏi câu nói nổi tiếng của Hồ Chí Minh giải thích vì sao Người đến với chủ nghĩa Lênin và Quốc tế III thì nhớ: 'Lúc đầu, chính là chủ nghĩa yêu nước, chứ chưa phải chủ nghĩa cộng sản đã đưa tôi tin theo Lênin, tin theo Quốc tế thứ ba'."],[70,3,"Hồ Chí Minh quan niệm về chủ nghĩa xã hội ở nước ta bằng cách nhấn mạnh mục tiêu vì lợi ích của Tổ quốc, của nhân dân, có nghĩa là gì?",["Độc lập cho Tổ quốc, tự do cho nhân dân","Độc lập dân tộc và chủ nghĩa xã hội","Làm cho mọi người có cơm ăn, áo mặc, học hành","Làm sao cho dân giàu, nước mạnh"],3,"Khi giải thích mục tiêu của chủ nghĩa xã hội vì lợi ích tối cao của Tổ quốc và nhân dân, Hồ Chí Minh diễn đạt cô đọng và dễ hiểu nhất là 'làm sao cho dân giàu, nước mạnh'. Các cách diễn đạt như cơm ăn áo mặc hay độc lập tự do là những biểu hiện cụ thể từng mặt, còn 'dân giàu, nước mạnh' bao quát trọn vẹn cả lợi ích của nhân dân lẫn sự phồn vinh của Tổ quốc.","Nếu đề hỏi câu định nghĩa giản dị của Hồ Chí Minh về chủ nghĩa xã hội gắn với đời sống hằng ngày của nhân dân thì chú ý cụm 'Chủ nghĩa xã hội là làm cho nhân dân lao động thoát nạn bần cùng, làm cho mọi người có công ăn việc làm, được ấm no và sống một đời hạnh phúc'."],[71,3,"Theo tư tưởng Hồ Chí Minh, Chủ nghĩa xã hội là chế độ không còn vấn đề gì?",["Cưỡng bức lao động","Chế độ tư hữu","Tình trạng phân chia giàu nghèo","Người bóc lột người"],3,"Theo tư tưởng Hồ Chí Minh, đặc trưng bản chất căn bản nhất về mặt kinh tế – xã hội của chủ nghĩa xã hội là một chế độ tiến bộ, công bằng, không còn tình trạng người bóc lột người. Trong thời kỳ quá độ vẫn còn nhiều hình thức sở hữu và phân phối theo lao động (nên có chênh lệch thu nhập hợp lý), vì vậy xóa bỏ tận gốc chế độ người bóc lột người mới là điểm cốt lõi nhất.","Nếu đề hỏi nguyên tắc phân phối chủ yếu trong chủ nghĩa xã hội theo Hồ Chí Minh là gì thì chọn phân phối theo lao động ('làm nhiều hưởng nhiều, làm ít hưởng ít, không làm không hưởng', trừ người già yếu, tàn tật được xã hội chăm lo)."],[72,3,"Theo tư tưởng Hồ Chí Minh: “Muốn có chủ nghĩa xã hội trước hết cần có những con người xã hội chủ nghĩa”. Điều đó nói lên mục tiêu gì?",["Mục tiêu chính trị","Mục tiêu kinh tế","Mục tiêu văn hóa và xã hội","Mục tiêu phát triển con người xã hội chủ nghĩa"],3,"Luận điểm 'Muốn có chủ nghĩa xã hội trước hết cần có những con người xã hội chủ nghĩa' khẳng định trực tiếp mục tiêu phát triển con người xã hội chủ nghĩa – coi xây dựng con người mới có đạo đức, trí tuệ, làm chủ là điều kiện tiên quyết. Các mục tiêu chính trị, kinh tế hay văn hóa – xã hội tuy gắn bó chặt chẽ nhưng không phản ánh trực tiếp trọng tâm của câu nói này.","Nếu đề hỏi trong các động lực xây dựng chủ nghĩa xã hội ở Việt Nam, động lực nào là quan trọng nhất và quyết định nhất theo Hồ Chí Minh thì chọn 'động lực con người' (nhân dân lao động), đồng thời phải kết hợp lợi ích cá nhân với lợi ích tập thể và xã hội."],[73,3,"Câu: “Tự do cho đồng bào tôi, độc lập cho Tổ quốc tôi đấy là tất cả những gì tôi muốn, đấy là tất cả những gì tôi hiểu” được Hồ Chí Minh nói ở sự kiện nào?",["Đại hội V của Quốc tế Cộng sản (1924)","Cuộc họp của Hội Liên hiệp thuộc địa (10-1921)","Lễ mít tinh kỷ niệm ngày 1-5 do Đảng Xã hội Pháp tổ chức (1920)","Đại hội Tours (1920)"],3,"Câu nói chân thành, dứt khoát này được Nguyễn Ái Quốc phát biểu tại Đại hội Tours (tháng 12-1920 – Đại hội lần thứ XVIII Đảng Xã hội Pháp) khi một nữ đại biểu hỏi lý do Người kiên quyết bỏ phiếu tán thành gia nhập Quốc tế Cộng sản (Quốc tế III). Các sự kiện năm 1921 hay 1924 đều diễn ra sau dấu mốc chuyển biến bước ngoặt này.","Nếu đề hỏi ý nghĩa lịch sử của sự kiện Nguyễn Ái Quốc tham gia Đại hội Tours (12-1920) thì chọn: đánh dấu bước ngoặt quyết định chuyển từ người yêu nước chân chính trở thành người cộng sản đầu tiên của Việt Nam, đồng thời tham gia sáng lập Đảng Cộng sản Pháp."],[74,3,"Câu: “Toàn thể dân tộc Việt Nam quyết đem tất cả tinh thần và lực lượng, tính mạng và của cải để giữ vững quyền tự do, độc lập ấy” được trích từ bài viết nào của Hồ Chí Minh?",["Thư kêu gọi Tổng khởi nghĩa (1945)","Thư gửi đồng bào Nam bộ (1946)","Lời kêu gọi toàn quốc kháng chiến (1946)","Tuyên ngôn độc lập (1945)"],3,"Đây chính là lời thề sắt đá khép lại bản 'Tuyên ngôn Độc lập' do Chủ tịch Hồ Chí Minh đọc tại Quảng trường Ba Đình ngày 2-9-1945, khẳng định quyết tâm bảo vệ nền tự do, độc lập vừa giành được. Đừng nhầm với 'Lời kêu gọi toàn quốc kháng chiến' (1946) với câu 'Thà hy sinh tất cả...' hay 'Thư kêu gọi Tổng khởi nghĩa' (8-1945) với câu 'Giờ quyết định cho vận mệnh dân tộc ta đã đến'.","Nếu đề trích câu 'Đồng bào Nam Bộ là dân nước Việt Nam. Sông có thể cạn, núi có thể mòn, song chân lý đó không bao giờ thay đổi' thì chọn 'Thư gửi đồng bào Nam Bộ' (tháng 5-1946 trước khi Người sang thăm nước Pháp)."],[75,3,"Câu: “Sự tàn bạo của chủ nghĩa tư bản đã chuẩn bị đất rồi; chủ nghĩa xã hội chỉ còn phải làm cái việc là gieo hạt giống của công cuộc giải phóng nữa thôi” được trích trong tác phẩm nào của Hồ Chí Minh?",["Tâm địa thực dân (1921)","Đường kách mệnh (1927)","Bản án chế độ thực dân Pháp (1925)","Đông Dương (1921)"],3,"Luận điểm giàu hình ảnh này được Nguyễn Ái Quốc viết trong bài 'Đông Dương' đăng trên Tạp chí Cộng sản (La Revue Communiste) của Đảng Cộng sản Pháp số 14, tháng 5-1921, nhằm chứng minh chủ nghĩa xã hội hoàn toàn có thể bám rễ và thắng lợi ở các nước phương Đông thuộc địa. Các tác phẩm 'Bản án chế độ thực dân Pháp' (1925) và 'Đường cách mệnh' (1927) viết ở giai đoạn sau.","Nếu đề hỏi nội dung chính của bài 'Đông Dương' (1921) là gì thì nhớ Nguyễn Ái Quốc khẳng định sự tàn bạo của chủ nghĩa tư bản đã tạo tiền đề cho cách mạng, còn truyền thống cộng đồng phương Đông giúp các dân tộc thuộc địa dễ tiếp thu chủ nghĩa cộng sản hơn cả ở phương Tây."],[76,3,"Theo Tư tưởng Hồ Chí Minh, trong thời kỳ quá độ lên chủ nghĩa xã hội, nền kinh tế nước ta còn tồn tại mấy hình thức sở hữu?",["Một","Hai","Bốn","Ba"],3,"Nhất quán với hệ thống câu hỏi về kinh tế thời kỳ quá độ trong giáo trình, Hồ Chí Minh xác định nền kinh tế nước ta còn tồn tại ba hình thức sở hữu cơ bản: sở hữu của nhà nước (toàn dân), sở hữu của hợp tác xã (tập thể) và sở hữu của người lao động riêng lẻ. Các con số một, hai hay bốn đều không khớp với phân loại này.","Nếu đề hỏi trong các thành phần kinh tế thời kỳ quá độ ở Việt Nam, thành phần kinh tế nào giữ vai trò lãnh đạo và cần được ưu tiên phát triển thì chọn kinh tế quốc doanh (thuộc sở hữu nhà nước)."],[77,3,"Trong Thư gửi đồng bào toàn quốc, kêu gọi ra sức cứu đói của Hồ Chí Minh có câu: “Cứ 10 ngày nhịn ăn một bữa, mỗi tháng nhịn ăn ba bữa. Đem gạo đó (mỗi bữa một bơ) để cứu dân nghèo”, được viết thời gian nào?",["6-1-1946","5-9-1945","23-9-1945","28-9-1945"],3,"Lời kêu gọi 'Sẻ cơm nhường áo' với sáng kiến thiết thực '10 ngày nhịn ăn một bữa, mỗi tháng nhịn ăn ba bữa' được Hồ Chí Minh viết và đăng trên báo Cứu quốc ngày 28-9-1945 nhằm cứu đồng bào khỏi nạn đói khủng khiếp ngay sau Cách mạng Tháng Tám. Mốc 5-9-1945 là ngày khai giảng năm học đầu tiên, 23-9-1945 là ngày Nam Bộ kháng chiến, còn 6-1-1946 là ngày Tổng tuyển cử đầu tiên.","Nếu đề hỏi ngày Hồ Chí Minh viết thư gửi học sinh nhân ngày khai trường đầu tiên của nước Việt Nam mới thì chọn 5-9-1945; nếu hỏi ngày Tổng tuyển cử bầu Quốc hội khóa I thì chọn 6-1-1946."],[78,3,"Bài viết \"Lênin và các dân tộc thuộc địa\" của Nguyễn Ái Quốc được đăng trên tờ báo nào?",["Thanh niên","Le Paria","Nhân đạo","Pravda"],3,"Bài viết 'Lênin và các dân tộc thuộc địa' được Nguyễn Ái Quốc viết ngay khi V.I.Lênin từ trần và đăng trên tờ Pravda (báo Sự thật – cơ quan trung ương của Đảng Cộng sản Liên Xô) ngày 27-1-1924, bày tỏ lòng biết ơn sâu sắc của nhân dân thuộc địa đối với vị lãnh tụ cách mạng vô sản. Các báo Thanh niên (1925), Le Paria (1922) và Nhân đạo (L'Humanité) không phải nơi đăng bài báo này.","Nếu đề hỏi tờ báo do Nguyễn Ái Quốc sáng lập tại Pháp năm 1922 làm cơ quan ngôn luận của Hội Liên hiệp thuộc địa thì chọn báo Le Paria (Người cùng khổ); nếu hỏi tờ báo sáng lập ở Quảng Châu ngày 21-6-1925 thì chọn báo Thanh niên."],[79,3,"Câu: “Người ta sinh ra tự do và bình đẳng về quyền lợi; và phải luôn luôn được tự do và bình đẳng về quyền lợi” được Hồ Chí Minh kế thừa từ bản Tuyên ngôn độc lập của nước nào?",["Anh","Liên Xô","Mỹ","Pháp"],3,"Câu 'Người ta sinh ra tự do và bình đẳng về quyền lợi; và phải luôn luôn được tự do và bình đẳng về quyền lợi' được Hồ Chí Minh trích dẫn trong Tuyên ngôn Độc lập (2-9-1945) từ bản Tuyên ngôn Nhân quyền và Dân quyền năm 1791 của Cách mạng Pháp. Đừng nhầm với câu 'Tất cả mọi người đều sinh ra có quyền bình đẳng...' trích từ Tuyên ngôn Độc lập năm 1776 của nước Mỹ.","Mẹo phân biệt hai câu trích trong Tuyên ngôn Độc lập 1945: hễ thấy cụm 'Tạo hóa cho họ những quyền không ai có thể xâm phạm được; trong những quyền ấy, có quyền được sống, quyền tự do và quyền mưu cầu hạnh phúc' thì chọn Mỹ (1776); hễ thấy cụm 'tự do và bình đẳng về quyền lợi' thì chọn Pháp (1791)."],[80,3,"Hồ Chí Minh khẳng định: “Độc lập, tự do là quyền thiêng liêng, bất khả xâm phạm của tất cả các dân tộc”, được trích trong tác phẩm nào?",["Đường cách mệnh (1927)","Lời kêu gọi toàn quốc kháng chiến (1946)","Bản án chế độ thực dân Pháp (1925)","Tuyên ngôn độc lập (1945)"],3,"Tư tưởng 'Độc lập, tự do là quyền thiêng liêng, bất khả xâm phạm của tất cả các dân tộc' là luận điểm cốt lõi được Hồ Chí Minh tuyên bố trang trọng trước toàn thế giới trong bản 'Tuyên ngôn Độc lập' (2-9-1945), trên cơ sở suy rộng quyền con người thành quyền dân tộc. Các tác phẩm năm 1925, 1927 chưa phải bản tuyên ngôn lập quốc, còn văn kiện năm 1946 là lời hiệu triệu kháng chiến.","Nếu đề hỏi điểm sáng tạo pháp lý nổi bật của Hồ Chí Minh trong Tuyên ngôn Độc lập (1945) khi viện dẫn Tuyên ngôn của Mỹ và Pháp là gì thì chọn: Người đã nâng quyền con người (nhân quyền) thành quyền của tất cả các dân tộc trên thế giới (dân tộc quyền)."],[81,3,"Theo tư tưởng Hồ Chí Minh, muốn xây dựng chủ nghĩa xã hội, trước hết cần có gì?",["Con người có tinh thần sáng tạo, dám nghĩ, dám làm","Con người có đạo đức","Con người có tài năng","Con người xã hội chủ nghĩa"],3,"Tại Hội nghị bồi dưỡng cán bộ lãnh đạo các cấp toàn miền Bắc (3/1961), Hồ Chí Minh khẳng định nguyên văn: “Muốn xây dựng chủ nghĩa xã hội, trước hết cần có những con người xã hội chủ nghĩa”. Các yếu tố như đạo đức, tài năng hay tinh thần sáng tạo chỉ là từng mặt riêng lẻ, chưa bao quát trọn vẹn chuẩn mực toàn diện của con người xã hội chủ nghĩa.","Nếu đề hỏi “muốn có con người xã hội chủ nghĩa trước hết phải có gì” thì chọn “tư tưởng xã hội chủ nghĩa”; còn nếu hỏi hai tiêu chuẩn cốt lõi của con người mới xã hội chủ nghĩa thì nhớ là “vừa hồng, vừa chuyên” (có đủ đức và tài, lấy đức làm gốc)."],[82,3,"Hồ Chí Minh đã khẳng định: “Dân tộc Việt Nam phải được độc lập, nhân dân Việt Nam phải được hưởng cuộc sống ấm no hạnh phúc. Muốn vậy phải .......... đó là một tất yếu, một sự phát triển tất yếu”. Chọn phương án đúng để điền vào chỗ trống.",["đánh đuổi cho được bọn đế quốc xâm lược giành độc lập cho dân tộc","đưa người dân lên làm chủ xã hội","xây dựng chế độ dân chủ nhân dân","đi lên chủ nghĩa xã hội"],3,"Theo Hồ Chí Minh, độc lập dân tộc phải gắn liền với đời sống ấm no, hạnh phúc của nhân dân, và con đường duy nhất bảo đảm bền vững mục tiêu đó là “đi lên chủ nghĩa xã hội” như một quy luật phát triển tất yếu. Đánh đuổi đế quốc hay xây dựng chế độ dân chủ nhân dân mới là tiền đề ban đầu, chưa nêu đúng đích đến tất yếu trong câu trích.","Nếu đề trích câu “Nếu nước độc lập mà dân không hưởng hạnh phúc tự do, thì độc lập cũng chẳng có nghĩa lý gì” và hỏi nội dung tư tưởng nào, hãy chọn quan điểm độc lập dân tộc phải gắn liền với tự do, cơm no, áo ấm và hạnh phúc của nhân dân."],[83,3,"Hồ Chí Minh viết: \".......... là một trở ngại lớn cho việc xây dựng chủ nghĩa xã hội. Cho nên, thắng lợi của chủ nghĩa xã hội không thể tách rời thắng lợi của cuộc đấu tranh trừ bỏ ..........\". Chọn phương án đúng để điền vào chỗ trống.",["quan liêu","tham ô","tệ nạn xã hội","chủ nghĩa cá nhân"],3,"Trong tác phẩm Đạo đức cách mạng (1958), Hồ Chí Minh khẳng định “chủ nghĩa cá nhân” là trở ngại lớn cho việc xây dựng chủ nghĩa xã hội, nên thắng lợi của chủ nghĩa xã hội không thể tách rời cuộc đấu tranh trừ bỏ chủ nghĩa cá nhân. Tham ô, quan liêu hay tệ nạn xã hội chỉ là những biểu hiện cụ thể nảy sinh từ gốc rễ chủ nghĩa cá nhân.","Nếu đề hỏi căn bệnh nào được Hồ Chí Minh ví là “bệnh mẹ” đẻ ra hàng trăm thứ bệnh nguy hiểm khác thì vẫn chọn “chủ nghĩa cá nhân”; còn nếu hỏi “giặc nội xâm” trong bộ máy nhà nước gồm ba căn bệnh nào thì chọn “tham ô, lãng phí, quan liêu”."],[84,3,"Hồ Chí Minh viết: “Hiểu Chủ nghĩa Mác-Lênin là phải sống với nhau có tình có nghĩa, muốn xây dựng chủ nghĩa xã hội phải xây dựng con người ..........\". Chọn phương án đúng để điền vào chỗ trống.",["có đầy đủ năng lực và phẩm chất đạo đức cách mạng","có năng lực chuyên môn tốt, am hiểu pháp luật","có đủ đức và tài","văn hóa, có văn hóa"],3,"Hồ Chí Minh đề cao bản chất nhân văn của chủ nghĩa Mác-Lênin là sống với nhau có tình có nghĩa, đồng thời khẳng định nguyên văn muốn xây dựng chủ nghĩa xã hội phải xây dựng con người “văn hóa, có văn hóa”. Các phương án nói về năng lực chuyên môn, am hiểu pháp luật hay đủ đức và tài tuy hợp lý về ý nhưng không đúng nguyên văn câu trích dẫn.","Nếu đề hỏi câu “Vì lợi ích mười năm thì phải trồng cây, vì lợi ích trăm năm thì phải trồng người” thể hiện chiến lược gì thì chọn chiến lược “trồng người” (xây dựng con người xã hội chủ nghĩa); còn nếu hỏi tiêu chuẩn cán bộ thì mới chọn “có đủ đức và tài”."],[85,3,"Hồ Chí Minh cho rằng: Chủ nghĩa xã hội chính là sự nghiệp của chính bản thân nhân dân, dựa vào sức mạnh của toàn dân để .......... Chọn phương án đúng để điền vào chỗ trống.",["đưa đất nước phát triển ngang tầm với các nước trên thế giới","đưa đất nước phát triển dân giàu, nước mạnh, xã hội công bằng, văn minh","xây dựng đất nước sánh vai cùng các cường quốc năm châu","đưa lại quyền lợi cho nhân dân"],3,"Theo tư tưởng Hồ Chí Minh, nhân dân vừa là lực lượng sáng tạo vừa là người thụ hưởng thành quả của chủ nghĩa xã hội, nên sự nghiệp này dựa vào sức mạnh toàn dân để “đưa lại quyền lợi cho nhân dân”. Cụm từ “dân giàu, nước mạnh, xã hội công bằng, văn minh” là khái quát của Đảng trong thời kỳ Đổi mới, không phải nguyên văn câu nói của Người.","Nếu đề hỏi mục tiêu cao nhất của chủ nghĩa xã hội theo Hồ Chí Minh là gì thì chọn nâng cao không ngừng đời sống vật chất và tinh thần của nhân dân; còn nếu hỏi “sánh vai với các cường quốc năm châu” xuất hiện ở văn kiện nào thì là Thư gửi các học sinh nhân ngày khai trường đầu tiên (9/1945)."],[86,3,"Theo Hồ Chí Minh: Việt Nam đi lên chủ nghĩa xã hội từ một nước thuộc địa nửa phong kiến, .......... Chọn phương án đúng điền vào chỗ trống.",["Bỏ qua giai đoạn phát triển tư bản chủ nghĩa","Xuyên qua chủ nghĩa tư bản","Bỏ qua chế độ tư bản chủ nghĩa","Không kinh qua giai đoạn phát triển tư bản chủ nghĩa"],3,"Khi khái quát đặc điểm lớn nhất của thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam, Hồ Chí Minh dùng đúng cụm từ “không kinh qua giai đoạn phát triển tư bản chủ nghĩa”. Cách gọi “bỏ qua chế độ tư bản chủ nghĩa” là thuật ngữ chuẩn hóa từ Đại hội IX của Đảng (2001), còn “xuyên qua chủ nghĩa tư bản” sai hẳn về bản chất lý luận.","Nếu đề hỏi theo Văn kiện Đại hội IX của Đảng, Việt Nam quá độ lên chủ nghĩa xã hội là bỏ qua cái gì thì mới chọn “bỏ qua chế độ tư bản chủ nghĩa” (tức bỏ qua việc xác lập vị trí thống trị của quan hệ sản xuất và kiến trúc thượng tầng tư bản chủ nghĩa, nhưng tiếp thu thành tựu khoa học – công nghệ)."],[87,3,"Theo tư tưởng Hồ Chí Minh, nguyên tắc phân phối chủ yếu trong chủ nghĩa xã hội là gì?",["Lợi ích được phân phối theo tỷ lệ cống hiến của từng ngành, từng người","Sản phẩm được phân phối bình quân cho đầu người","Làm theo năng lực, hưởng theo nhu cầu","Làm nhiều hưởng nhiều, làm ít hưởng ít, không làm không hưởng"],3,"Ở giai đoạn chủ nghĩa xã hội, nguyên tắc phân phối chủ yếu là phân phối theo lao động, được Hồ Chí Minh diễn đạt dễ hiểu là “làm nhiều hưởng nhiều, làm ít hưởng ít, không làm không hưởng” (trừ người già yếu, bệnh tật, trẻ nhỏ được xã hội bảo trợ). “Làm theo năng lực, hưởng theo nhu cầu” thuộc giai đoạn cao là chủ nghĩa cộng sản, còn chia bình quân là sai lầm bình quân chủ nghĩa.","Nếu đề đổi sang hỏi nguyên tắc phân phối trong “chủ nghĩa cộng sản” (giai đoạn phát triển cao) thì chọn “làm theo năng lực, hưởng theo nhu cầu”; còn nếu hỏi tên gọi kinh tế chính trị của nguyên tắc phân phối chủ yếu trong chủ nghĩa xã hội thì chọn “phân phối theo lao động”."],[88,3,"Một trong những “ham muốn tột bậc” mà Hồ Chí Minh đã trả lời các nhà báo vào tháng 01 năm 1946 là gì?",["Đưa nước ta đi lên chủ nghĩa xã hội","Đồng bào thoát nạn bần cùng, nô lệ, vươn lên làm chủ đất nước","Đất nước thống nhất, non sông liền một dải, Bắc, Nam sum họp một nhà","Nước ta được hoàn toàn độc lập, dân ta được hoàn toàn tự do"],3,"Trong bài trả lời các nhà báo nước ngoài tháng 1/1946, Hồ Chí Minh bày tỏ nguyên văn “ham muốn tột bậc” của Người là “làm sao cho nước ta được hoàn toàn độc lập, dân ta được hoàn toàn tự do, đồng bào ai cũng có cơm ăn áo mặc, ai cũng được học hành”. Các phương án khác diễn đạt sai nguyên văn hoặc lấy khẩu hiệu của giai đoạn kháng chiến chống Mỹ.","Nếu đề trích vế đầu của “ham muốn tột bậc” (1/1946) và hỏi tiếp vế sau thì chọn “đồng bào ai cũng có cơm ăn áo mặc, ai cũng được học hành”; còn câu “Bắc, Nam sum họp một nhà” gắn với khát vọng thống nhất Tổ quốc thời kỳ chống Mỹ."],[89,3,"Theo Hồ Chí Minh, mâu thuẫn cơ bản trong thời kỳ quá độ là mâu thuẫn gì?",["Giữa sự lựa chọn con đường phát triển giữa tư bản chủ nghĩa và xã hội chủ nghĩa","Giữa tư tưởng tiến bộ, tiên tiến, hiện đại và sự cổ hủ, lạc hậu của lịch sử phong kiến để lại","Giữa hai thế lực Đế quốc chủ nghĩa và Xã hội chủ nghĩa","Giữa yêu cầu phát triển cao để xây dựng một chế độ xã hội mới với tình trạng lạc hậu của đất nước"],3,"Vì Việt Nam đi lên chủ nghĩa xã hội từ một nước nông nghiệp lạc hậu không kinh qua giai đoạn phát triển tư bản chủ nghĩa, Hồ Chí Minh xác định mâu thuẫn cơ bản trong thời kỳ quá độ là mâu thuẫn giữa yêu cầu phát triển cao để xây dựng chế độ xã hội mới với tình trạng kinh tế – xã hội còn thấp kém, lạc hậu của đất nước. Mâu thuẫn với đế quốc hay giữa hai hệ thống thế giới chỉ là bối cảnh bên ngoài.","Nếu đề hỏi “đặc điểm to nhất của thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam” theo Hồ Chí Minh là gì thì chọn “từ một nước nông nghiệp lạc hậu tiến thẳng lên chủ nghĩa xã hội không kinh qua giai đoạn phát triển tư bản chủ nghĩa”."],[90,3,"Xuất phát từ điều kiện cụ thể Việt Nam, trong quá trình xây dựng CNXH Hồ Chí Minh cho rằng: Việt Nam có thể làm .......... và các nước khác. Chọn phương án đúng để điền vào chỗ trống.",["Giống Liên Xô, Trung Quốc","Khác Liên Xô, giống Trung Quốc","Giống Liên Xô, khác Trung Quốc","Khác Liên Xô, Trung Quốc"],3,"Hồ Chí Minh yêu cầu học tập kinh nghiệm các nước anh em nhưng tuyệt đối không sao chép rập khuôn; căn cứ vào điều kiện lịch sử, kinh tế, văn hóa cụ thể của Việt Nam, ta có thể làm “khác Liên Xô, Trung Quốc và các nước khác”. Ba phương án chứa chữ “giống” đều rơi vào bệnh giáo điều, máy móc trái với tư duy độc lập sáng tạo của Người.","Nếu đề hỏi 4 nguyên tắc xây dựng chủ nghĩa xã hội trong thời kỳ quá độ theo Hồ Chí Minh thì nhớ đủ: giữ vững nền tảng chủ nghĩa Mác-Lênin; giữ vững độc lập dân tộc; đoàn kết học tập kinh nghiệm các nước anh em nhưng không rập khuôn; xây đi đôi với chống."],[91,3,"Theo tư tưởng Hồ Chí Minh, độc lập, tự do là gì?",["Quyền thiêng liêng của tất cả các dân tộc","Quyền bất khả xâm phạm của tất cả các dân tộc","Quyền tự quyết định và bất khả xâm phạm của tất cả các dân tộc","Quyền thiêng liêng, bất khả xâm phạm của tất cả các dân tộc"],3,"Luận điểm nền tảng trong tư tưởng Hồ Chí Minh về vấn đề dân tộc khẳng định đầy đủ: độc lập, tự do là “quyền thiêng liêng, bất khả xâm phạm của tất cả các dân tộc”. Phương án chỉ nêu “quyền thiêng liêng” hoặc chỉ nêu “quyền bất khả xâm phạm” đều thiếu một vế quan trọng, còn thay bằng “quyền tự quyết định” không chuẩn với diễn đạt gốc trong giáo trình.","Nếu đề hỏi tư tưởng Hồ Chí Minh về độc lập dân tộc gồm mấy nội dung lớn thì nhớ 4 ý: là quyền thiêng liêng, bất khả xâm phạm; gắn liền với tự do, cơm no, áo ấm và hạnh phúc của nhân dân; là nền độc lập thật sự, hoàn toàn và triệt để; gắn liền với thống nhất và toàn vẹn lãnh thổ."],[92,3,"Theo Hồ Chí Minh, Cách mạng giải phóng dân tộc có khả năng chủ động giành thắng lợi trước cách mạng vô sản ở chính quốc, bởi vì sao?",["Lực lượng cách mạng ở thuộc địa đông hơn, mạnh hơn giai cấp công nhân ở chính quốc","Kẻ thù tư bản ở thuộc địa ở xa và yếu hơn kẻ thù của giai cấp vô sản ở chính quốc","Muốn giết con đĩa tư bản phải cắt bỏ cái vòi hút máu nhân dân thuộc địa","Nọc độc và sức sống của con rắn độc tư bản chủ nghĩa tập trung ở các thuộc địa"],3,"Tại Đại hội V Quốc tế Cộng sản (1924), Nguyễn Ái Quốc luận chứng rằng “nọc độc và sức sống của con rắn độc tư bản chủ nghĩa tập trung ở các thuộc địa” hơn là ở chính quốc, nên đánh đổ chế độ thực dân tại thuộc địa hoàn toàn có thể chủ động thắng lợi trước cách mạng vô sản ở chính quốc. Hình ảnh “con đỉa hai vòi” lại dùng để chỉ mối quan hệ cần phối hợp đồng thời giữa hai cánh cách mạng, không phải lý giải trực tiếp việc thắng trước.","Nếu đề trích hình ảnh “con đỉa hai vòi” (một vòi bám vào giai cấp vô sản ở chính quốc, một vòi bám vào nhân dân thuộc địa) thì chọn luận điểm về mối quan hệ gắn bó bình đẳng, phối hợp chặt chẽ, cắt bỏ đồng thời cả hai vòi giữa cách mạng thuộc địa và cách mạng vô sản chính quốc."],[93,3,"Theo Hồ Chí Minh: Đối với các dân tộc thuộc địa ở phương Đông, .......... là động lực lớn của đất nước. Chọn phương án đúng nhất để điền vào chỗ trống.",["đoàn kết dân tộc","sức mạnh dân tộc","truyền thống dân tộc","chủ nghĩa dân tộc"],3,"Trong Báo cáo về Bắc Kỳ, Trung Kỳ và Nam Kỳ (1924), Nguyễn Ái Quốc viết nguyên văn: đối với các dân tộc thuộc địa phương Đông, “chủ nghĩa dân tộc” là động lực lớn của đất nước, nhấn mạnh sức mạnh tinh thần yêu nước chân chính thúc đẩy nhân dân vùng lên tự giải phóng. Các cụm từ “đoàn kết dân tộc”, “sức mạnh dân tộc” hay “truyền thống dân tộc” không đúng thuật ngữ gốc trong câu trích.","Nếu đề hỏi “chủ nghĩa dân tộc” theo quan điểm Hồ Chí Minh mang bản chất gì thì chọn “chủ nghĩa dân tộc chân chính” (gắn với yêu nước và tinh thần quốc tế trong sáng), khác hoàn toàn với chủ nghĩa dân tộc hẹp hòi, sô-vanh của giai cấp tư sản."],[94,3,"Trong Cương lĩnh chính trị đầu tiên của Đảng Cộng sản Việt Nam, Hồ Chí Minh viết: “Làm tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội cộng sản”. Đó là con đường phát triển của các dân tộc thuộc địa, nó kết hợp những nội dung nào?",["Độc lập dân tộc, chống chủ nghĩa đế quốc","Giải quyết vấn đề giai cấp và dân tộc ở thuộc địa","Ý thức hệ tư tưởng giai cấp công nhân và lợi ích dân tộc thuộc địa","Dân tộc, dân chủ và chủ nghĩa xã hội"],3,"Đường lối chiến lược trong Cương lĩnh chính trị đầu tiên (2/1930) kết hợp chặt chẽ ba nội dung xuyên suốt: giải phóng dân tộc (tư sản dân quyền cách mạng chống đế quốc), thực hiện dân chủ cho nhân dân (thổ địa cách mạng chống phong kiến) và tiến lên chủ nghĩa xã hội (đi tới xã hội cộng sản). Các phương án khác đều thiếu ít nhất một trong ba nội dung “dân tộc, dân chủ và chủ nghĩa xã hội”.","Nếu đề hỏi nhiệm vụ nào được Cương lĩnh chính trị đầu tiên (2/1930) đặt lên hàng đầu thì chọn “chống đế quốc, giải phóng dân tộc”; còn nếu hỏi văn kiện nào chịu ảnh hưởng tả khuynh, nhấn mạnh đấu tranh giai cấp hơn giải phóng dân tộc thì chọn “Luận cương chính trị tháng 10/1930”."],[95,3,"Nói về cách mạng giải phóng dân tộc ở thuộc địa, Hồ Chí Minh khẳng định như thế nào?",["Cách mạng giải phóng dân tộc giành thắng lợi cùng với thắng lợi của cách mạng vô sản ở chính quốc","Thắng lợi của cách mạng giải phóng dân tộc ở thuộc địa phải phụ thuộc vào thắng lợi của cách mạng vô sản ở chính quốc","Cách mạng giải phóng dân tộc phải chờ cách mạng vô sản giành thắng lợi trước","Cách mạng giải phóng dân tộc ở thuộc địa có khả năng giành được thắng lợi trước cách mạng vô sản ở chính quốc"],3,"Khắc phục quan điểm thụ động của một số người trong Quốc tế Cộng sản cho rằng thuộc địa phải phụ thuộc vào chính quốc, Hồ Chí Minh sáng tạo khẳng định cách mạng giải phóng dân tộc ở thuộc địa cần tiến hành chủ động, sáng tạo và “có khả năng giành được thắng lợi trước cách mạng vô sản ở chính quốc”. Các phương án nói “phụ thuộc”, “chờ” hay chỉ “thắng lợi cùng lúc” đều trái với luận điểm đột phá này.","Nếu đề hỏi luận điểm nào thể hiện rõ nhất sự bổ sung, phát triển sáng tạo của Hồ Chí Minh vào kho tàng lý luận Mác-Lênin về cách mạng thuộc địa, hãy chọn chính luận điểm cách mạng giải phóng dân tộc có thể chủ động giành thắng lợi trước cách mạng vô sản ở chính quốc."],[96,3,"Một trong những nội dung cốt lõi của tư tưởng Hồ Chí Minh là gì?",["Tư tưởng về dân tộc và hội nhập quốc tế","Tư tưởng giải phóng giai cấp công nhân","Tư tưởng giải phóng dân tộc Việt Nam","Tư tưởng độc lập dân tộc gắn liền với chủ nghĩa xã hội"],3,"Giáo trình Tư tưởng Hồ Chí Minh khẳng định sợi chỉ đỏ xuyên suốt và nội dung cốt lõi nhất của toàn bộ hệ thống tư tưởng Hồ Chí Minh là “tư tưởng độc lập dân tộc gắn liền với chủ nghĩa xã hội”. Chỉ nêu giải phóng dân tộc hay giải phóng giai cấp công nhân mới phản ánh một phần, còn hội nhập quốc tế là phạm trù hiện đại chưa bao trùm toàn bộ tiến trình cách mạng.","Nếu đề hỏi mối quan hệ biện chứng giữa hai vế của nội dung cốt lõi này thì nhớ: “độc lập dân tộc là cơ sở, tiền đề để tiến lên chủ nghĩa xã hội” và “chủ nghĩa xã hội là điều kiện để bảo đảm nền độc lập dân tộc vững chắc”."],[97,3,"Thực chất vấn đề dân tộc thuộc địa trong tư tưởng Hồ Chí Minh là gì?",["Bình đẳng dân tộc","Đòi quyền tự do dân chủ tối thiểu cho nhân dân","Đấu tranh giải phóng dân tộc Việt Nam khỏi sự áp bức, thống trị của nước ngoài, giành độc lập dân tộc, thành lập nhà nước dân tộc độc lập và đưa đất nước phát triển theo xu thế của thời đại","Đấu tranh giải phóng các dân tộc thuộc địa khỏi sự áp bức, thống trị của nước ngoài, giành độc lập dân tộc, thành lập nhà nước dân tộc độc lập và đưa đất nước phát triển theo xu thế của thời đại"],3,"Hồ Chí Minh tiếp cận vấn đề dân tộc thuộc địa trên phạm vi chung của “các dân tộc thuộc địa” bị chủ nghĩa đế quốc áp bức, với thực chất là đấu tranh giải phóng khỏi sự thống trị của nước ngoài, giành độc lập dân tộc, thành lập nhà nước dân tộc độc lập và đưa đất nước phát triển theo xu thế của thời đại. Phương án chỉ nêu “dân tộc Việt Nam” bị hẹp hơn phạm vi câu hỏi, còn đòi bình đẳng hay tự do tối thiểu chưa triệt để.","Cẩn thận phân biệt hai phương án gần giống hệt nhau: khi đề hỏi chung “vấn đề dân tộc thuộc địa” thì phải chọn “các dân tộc thuộc địa”; chỉ khi đề hỏi riêng nhiệm vụ cụ thể ở nước ta thì mới chọn phạm vi “dân tộc Việt Nam”."],[98,3,"Theo Hồ Chí Minh, để đảm bảo độc lập dân tộc gắn liền với chủ nghĩa xã hội, cần có điều kiện cơ bản nào?",["Đảm bảo vai trò lãnh đạo tuyệt đối của Đảng trong suốt tiến trình cách mạng","Củng cố và tăng cường khối đại đoàn kết dân tộc trên nền tảng của liên minh công - nông","Đoàn kết, gắn bó chặt chẽ với cách mạng thế giới","Đảm bảo vai trò lãnh đạo của Đảng, củng cố khối đại đoàn kết toàn dân và đoàn kết quốc tế"],3,"Để bảo đảm độc lập dân tộc gắn liền với chủ nghĩa xã hội, Hồ Chí Minh chỉ ra đầy đủ ba điều kiện cơ bản: bảo đảm vai trò lãnh đạo của Đảng Cộng sản, củng cố khối đại đoàn kết toàn dân trên nền tảng liên minh công – nông và đoàn kết quốc tế gắn bó với cách mạng thế giới. Ba phương án còn lại mỗi phương án chỉ nêu một điều kiện riêng lẻ nên chưa đầy đủ.","Nếu đề đổi câu hỏi thành “điều kiện tiên quyết, quan trọng nhất” trong ba điều kiện bảo đảm độc lập dân tộc gắn liền với chủ nghĩa xã hội thì lúc đó mới chọn riêng “bảo đảm vai trò lãnh đạo tuyệt đối của Đảng Cộng sản”."],[99,3,"Thực chất của vấn đề dân tộc thuộc địa trong tư tưởng Hồ Chí Minh là gì?",["Đòi quyền bình đẳng giữa các dân tộc","Đòi quyền tự do dân chủ cho nhân dân","Đòi quyền tự trị dân tộc dưới sự bảo hộ của ngoại bang","Đấu tranh giải phóng dân tộc, thành lập nhà nước dân tộc độc lập, trong đó nhân dân là chủ thể tối cao của quyền lực nhà nước"],3,"Thực chất vấn đề dân tộc thuộc địa trong tư tưởng Hồ Chí Minh là cuộc đấu tranh cách mạng triệt để nhằm giải phóng dân tộc, thành lập nhà nước dân tộc độc lập mà ở đó “nhân dân là chủ thể tối cao của quyền lực nhà nước”. Đòi bình đẳng, đòi tự do dân chủ đơn lẻ hay đòi quyền tự trị dưới sự bảo hộ của ngoại bang đều chỉ là yêu sách cải lương, không xóa bỏ được bản chất lệ thuộc.","Nếu đề hỏi khuynh hướng đòi “quyền tự trị dưới sự bảo hộ ngoại bang” thể hiện đường lối nào thì nhớ đó là ảo tưởng cải lương nửa vời, trái ngược với quan điểm độc lập thật sự, hoàn toàn và triệt để của Hồ Chí Minh."],[100,3,"Cách mạng giải phóng dân tộc trong thời đại mới muốn giành được thắng lợi phải do:",["Giai cấp tư sản lãnh đạo","Một cá nhân xuất chúng lãnh đạo","Tầng lớp trí thức lãnh đạo","Đảng Cộng sản lãnh đạo"],3,"Từ thực tiễn thất bại của các phong trào yêu nước theo khuynh hướng phong kiến và tư sản, Hồ Chí Minh khẳng định trong Đường cách mệnh (1927) rằng cách mạng giải phóng dân tộc trong thời đại mới muốn thắng lợi phải do “Đảng Cộng sản lãnh đạo”. Giai cấp tư sản, tầng lớp trí thức hay một cá nhân xuất chúng đều không đủ điều kiện lịch sử và bản chất cách mạng triệt để để giữ vai trò này.","Nếu đề hỏi “nhân tố chủ quan hàng đầu quyết định thắng lợi của cách mạng giải phóng dân tộc” hoặc “theo Đường cách mệnh, cách mạng trước hết phải có gì” thì đều chọn “Đảng cách mệnh / Đảng Cộng sản lãnh đạo”."],[101,3,"Biện pháp hàng đầu để giành thắng lợi trong cách mạng giải phóng dân tộc phải:",["Dựa vào bạo lực vũ trang thuần tuý","Dùng phương pháp đàm phán hoà bình","Kêu gọi quân đội nước ngoài trợ giúp","Sử dụng bạo lực cách mạng, kết hợp bạo lực chính trị của quần chúng với bạo lực vũ trang"],3,"Vì chủ nghĩa đế quốc dùng bạo lực phản cách mạng để áp bức thuộc địa, Hồ Chí Minh chỉ rõ nhân dân tất yếu phải “sử dụng bạo lực cách mạng, kết hợp bạo lực chính trị của quần chúng với bạo lực vũ trang”. Phương án bạo lực vũ trang thuần túy là phiến diện, đàm phán hòa bình đơn thuần không đủ đánh đổ thực dân, còn kêu gọi quân đội nước ngoài trái với phương châm tự lực cánh sinh.","Nếu đề hỏi hai lực lượng cơ bản của bạo lực cách mạng theo Hồ Chí Minh là gì thì chọn “lực lượng chính trị của quần chúng và lực lượng vũ trang nhân dân”; còn nếu hỏi hai hình thức đấu tranh thì chọn “đấu tranh chính trị kết hợp với đấu tranh vũ trang”."],[102,3,"Nghiên cứu tư tưởng Hồ Chí Minh về cách mạng giải phóng dân tộc, ta rút ra luận điểm nào đúng?",["Giải phóng giai cấp là tiền đề để giải phóng dân tộc","Giải phóng con người là tiền đề để giải phóng dân tộc","Giải phóng xã hội là tiền đề giải phóng giai cấp","Giải phóng dân tộc là tiền đề giải phóng giai cấp"],3,"Ở một nước thuộc địa nửa phong kiến như Việt Nam, mâu thuẫn giữa toàn thể dân tộc với chủ nghĩa đế quốc là mâu thuẫn chủ yếu, nên Hồ Chí Minh sáng tạo khẳng định “giải phóng dân tộc là tiền đề giải phóng giai cấp”. Đặt giải phóng giai cấp lên trước là rập khuôn mô hình các nước tư bản phát triển châu Âu, không phù hợp với thực tiễn thuộc địa.","Nếu đề so sánh C.Mác – Ph.Ăngghen với Hồ Chí Minh: ở các nước tư bản phương Tây, giải phóng giai cấp là tiền đề giải phóng dân tộc; còn ở Việt Nam thuộc địa, Hồ Chí Minh xác định giải phóng dân tộc là tiền đề giải phóng giai cấp và giải phóng con người."],[103,3,"Trong tư tưởng Hồ Chí Minh, chủ nghĩa dân tộc chân chính “là .......... của tinh thần quốc tế”. Chọn phương án đúng nhất điền vào chỗ trống.",["một chiến lược, là nghĩa vụ","một vấn đề sống còn","một yêu cầu không thể thiếu","một bộ phận"],3,"Hồ Chí Minh viết nguyên văn chủ nghĩa dân tộc chân chính “là một bộ phận” của tinh thần quốc tế, qua đó khẳng định chủ nghĩa yêu nước chân chính hoàn toàn thống nhất và bổ sung cho chủ nghĩa quốc tế vô sản chứ không hề đối lập. Các cụm từ như “chiến lược, nghĩa vụ”, “vấn đề sống còn” hay “yêu cầu không thể thiếu” không khớp đúng nguyên văn câu nói.","Nếu đề hỏi chủ nghĩa dân tộc chân chính khác gì với chủ nghĩa dân tộc tư sản thì nhớ: chủ nghĩa dân tộc chân chính gắn với chủ nghĩa quốc tế trong sáng, tôn trọng độc lập của các dân tộc khác; ngược lại với chủ nghĩa dân tộc hẹp hòi, sô-vanh, vị kỷ."],[104,3,"Câu: \"Toàn thể dân tộc Việt Nam quyết đem .......... để giữ vững quyền tự do, độc lập ấy\". Chọn phương án đúng để điền vào chỗ trống.",["toàn bộ sức lực","tất cả tinh thần và lực lượng","tất cả máu xương của mình","tất cả tinh thần và lực lượng, tính mạng và của cải"],3,"Lời thề quyết tâm bảo vệ nền độc lập ở đoạn kết bản Tuyên ngôn Độc lập (2/9/1945) ghi đầy đủ nguyên văn: “Toàn thể dân tộc Việt Nam quyết đem tất cả tinh thần và lực lượng, tính mạng và của cải để giữ vững quyền tự do, độc lập ấy”. Phương án chỉ có “tất cả tinh thần và lực lượng” bị thiếu vế sau, còn hai phương án kia viết sai nguyên văn.","Nếu đề hỏi câu này trích từ văn kiện nào và thời gian nào thì chọn Tuyên ngôn Độc lập (2/9/1945); tránh nhầm với câu “Thà hy sinh tất cả, chứ nhất định không chịu mất nước, nhất định không chịu làm nô lệ” thuộc Lời kêu gọi toàn quốc kháng chiến (19/12/1946)."],[105,3,"Câu “Chủ nghĩa xã hội đang thắng lợi ở châu Âu và tương lai nó sẽ tràn sang châu Á”. Quan điểm trên của ai?",["Trần Phú","Phan Bội Châu","V.I.Lênin","Hồ Chí Minh"],3,"Nhận định “Chủ nghĩa xã hội đang thắng lợi ở châu Âu và tương lai nó sẽ tràn sang châu Á” là quan điểm của Hồ Chí Minh, phản ánh tầm nhìn sắc bén của Người ngay từ đầu thập niên 1920 về quy luật lan tỏa tất yếu của chủ nghĩa xã hội tới các dân tộc thuộc địa phương Đông. Trần Phú, Phan Bội Châu hay V.I.Lênin không phải tác giả phát ngôn này.","Nếu đề trích câu “Chủ nghĩa cộng sản dễ thích ứng ở châu Á hơn là ở châu Âu” (bài viết Đông Dương, năm 1921) thì tác giả vẫn là Nguyễn Ái Quốc – Hồ Chí Minh."],[106,3,"Câu “Trong lúc này, quyền lợi của dân tộc là cao hơn hết thảy”. Đó là khẳng định của Hội Nghị nào?",["Hội Nghị Trung ương 6 (11-1939)","Hội Nghị Trung ương 7 (11-1940)","Hội Nghị Toàn quốc của Đảng (8-1945)","Hội Nghị Trung ương 8 (5-1941)"],3,"Khẳng định “Trong lúc này, quyền lợi của dân tộc là cao hơn hết thảy” trích từ Nghị quyết Hội nghị Trung ương 8 (5/1941) do Nguyễn Ái Quốc trực tiếp chủ trì tại Pác Bó, hoàn chỉnh sự chuyển hướng chỉ đạo chiến lược đặt giải phóng dân tộc lên vị trí tối thượng. Hội nghị Trung ương 6 (11/1939) mới mở đầu chuyển hướng, Trung ương 7 (11/1940) tiếp tục khẳng định chủ trương đó, còn Hội nghị Toàn quốc (8/1945) là quyết định Tổng khởi nghĩa.","Mẹo nhớ chuỗi mốc Hội nghị: mở đầu chuyển hướng chiến lược là Trung ương 6 (11/1939); hoàn chỉnh chuyển hướng chiến lược và thành lập Mặt trận Việt Minh là Trung ương 8 (5/1941); phát động Tổng khởi nghĩa là Hội nghị Toàn quốc của Đảng (8/1945)."],[107,3,"Theo tư tưởng Hồ Chí Minh, lực lượng cách mạng giải phóng dân tộc gồm thành phần nào?",["Công nhân, nông dân","Công nhân, nông dân, trí thức","Các dân tộc thuộc địa","Toàn dân tộc"],3,"Theo Hồ Chí Minh, cách mạng giải phóng dân tộc là sự nghiệp chung của cả nước nên lực lượng cách mạng bao gồm “toàn dân tộc”, tập hợp mọi giai cấp, tầng lớp, dân tộc, tôn giáo có lòng yêu nước chống kẻ thù chung. Chỉ kể công nhân, nông dân hay thêm trí thức là thu hẹp lực lượng, còn “các dân tộc thuộc địa” là phạm vi quốc tế chứ không phải cơ cấu lực lượng của một quốc gia.","Nếu đề đổi hỏi “lực lượng nòng cốt / gốc của cách mạng giải phóng dân tộc là ai” thì mới chọn “công nhân và nông dân” (liên minh công – nông); còn hỏi chung “lực lượng cách mạng giải phóng dân tộc” phải chọn “toàn dân tộc”."],[108,3,"Theo tư tưởng Hồ Chí Minh, cách mạng giải phóng dân tộc là sự nghiệp đoàn kết của ai?",["Của giai cấp công nhân","Của giai cấp công nhân và nông dân","Của dân tộc Việt Nam và quốc tế","Của toàn dân, trên cơ sở liên minh công nông"],3,"Hồ Chí Minh chỉ rõ cách mạng giải phóng dân tộc là sự nghiệp đoàn kết “của toàn dân, trên cơ sở liên minh công nông”, vừa huy động được sức mạnh rộng rãi nhất của cả dân tộc vừa bảo đảm nền tảng vững chắc của hai giai cấp đông đảo và cách mạng nhất. Chỉ nêu công nhân hoặc chỉ công – nông là bỏ sót các tầng lớp yêu nước khác.","Nếu đề hỏi trong tác phẩm Đường cách mệnh (1927), Hồ Chí Minh xác định vị trí của công – nông là gì thì chọn “là gốc cách mệnh / người chủ cách mệnh”, còn học trò, nhà buôn nhỏ, điền chủ nhỏ là “bầu bạn cách mệnh của công nông”."],[109,3,"Theo tư tưởng Hồ Chí Minh, lực lượng xây dựng chủ nghĩa xã hội là ai?",["Công nhân","Nông dân","Trí thức","Nhân dân"],3,"Trong tư tưởng Hồ Chí Minh, chủ nghĩa xã hội là công trình tập thể của quần chúng dưới sự lãnh đạo của Đảng, nên lực lượng xây dựng chủ nghĩa xã hội là toàn thể “nhân dân”. Công nhân, nông dân hay trí thức đều chỉ là từng bộ phận cấu thành trong khối nhân dân đông đảo đó.","Nếu đề hỏi về vị thế kép của nhân dân trong chủ nghĩa xã hội thì nhớ: nhân dân vừa là chủ thể, lực lượng trực tiếp xây dựng chủ nghĩa xã hội, vừa là chủ nhân thụ hưởng mọi thành quả do chủ nghĩa xã hội mang lại."],[110,3,"Câu “Luận cương của Lênin về những vấn đề dân tộc và thuộc địa đến với Người như một ánh sáng kỳ diệu nâng cao về chất tất cả những hiểu biết và tình cảm cách mạng mà Người hằng nung nấu”. Ai là tác giả của nhận định trên?",["Võ Nguyên Giáp","Lê Duẩn","Phạm Văn Đồng","Trường Chinh"],3,"Nhận định ví Sơ thảo Luận cương của Lênin đến với Nguyễn Ái Quốc (7/1920) “như một ánh sáng kỳ diệu nâng cao về chất tất cả những hiểu biết và tình cảm cách mạng mà Người hằng nung nấu” là của đồng chí Trường Chinh. Võ Nguyên Giáp, Lê Duẩn và Phạm Văn Đồng không phải tác giả của câu nhận định nguyên văn này.","Nếu đề hỏi sự kiện tháng 7/1920 (đọc Luận cương của Lênin) đánh dấu bước ngoặt gì trong cuộc đời Hồ Chí Minh thì chọn: Người tìm thấy con đường cứu nước đúng đắn — con đường cách mạng vô sản, mở đường giải quyết cuộc khủng hoảng đường lối cứu nước."],[111,3,"Theo tư tưởng Hồ Chí Minh, đặc trưng kinh tế nổi bật nhất của chủ nghĩa xã hội là gì?",["Khoa học – kỹ thuật phát triển","Cơ cấu công – nông nghiệp hợp lý","Quyền làm chủ trong sản xuất kinh doanh được pháp lý đảm bảo","Sở hữu xã hội về tư liệu sản xuất"],3,"Theo tư tưởng Hồ Chí Minh, đặc trưng kinh tế nổi bật nhất phân biệt bản chất chủ nghĩa xã hội với các chế độ bóc lột là chế độ “sở hữu xã hội (công hữu) về tư liệu sản xuất” chủ yếu, giúp xóa bỏ chế độ người bóc lột người. Khoa học – kỹ thuật phát triển hay cơ cấu công – nông nghiệp hợp lý mới phản ánh lực lượng sản xuất và cơ cấu ngành, chưa nêu trúng đặc trưng bản chất nhất về quan hệ sản xuất.","Nếu đề hỏi đầy đủ đặc trưng kinh tế của chủ nghĩa xã hội theo Hồ Chí Minh thì chọn “nền kinh tế phát triển cao dựa trên lực lượng sản xuất hiện đại và chế độ công hữu về các tư liệu sản xuất chủ yếu”; còn hỏi đặc trưng chính trị thì chọn “xã hội có chế độ dân chủ”."],[112,3,"Theo tư tưởng Hồ Chí Minh, vấn đề dân tộc là sự kết hợp nhuần nhuyễn giữa những yếu tố nào?",["Dân tộc này với các dân tộc khác trên thế giới","Dân tộc Việt Nam với các dân tộc anh em khác trên thế giới","Độc lập dân tộc Việt Nam với hòa bình, tiến bộ và chủ nghĩa xã hội","Dân tộc với giai cấp; độc lập dân tộc với chủ nghĩa xã hội; chủ nghĩa yêu nước với chủ nghĩa quốc tế"],3,"Giải quyết vấn đề dân tộc trong tư tưởng Hồ Chí Minh là sự kết hợp nhuần nhuyễn, toàn diện của cả ba cặp quan hệ cốt lõi: “dân tộc với giai cấp; độc lập dân tộc với chủ nghĩa xã hội; chủ nghĩa yêu nước với chủ nghĩa quốc tế”. Ba phương án còn lại chỉ nêu một khía cạnh đơn lẻ hoặc nói chung chung về quan hệ giữa các dân tộc nên chưa đầy đủ.","Nếu đề hỏi cơ sở lý luận giúp Hồ Chí Minh kết hợp hài hòa cả ba cặp quan hệ trên là gì thì chọn “chủ nghĩa Mác-Lênin” (trực tiếp là lý luận về vấn đề dân tộc và thuộc địa của V.I.Lênin)."],[113,3,"Một trong những nội dung cơ bản của Yêu sách của nhân dân An Nam do Nguyễn Ái Quốc gửi đến Hội nghị Vécxây (1919) là đòi vấn đề gì?",["Chia ruộng đất cho những nông dân nghèo","Các dân tộc ở Đông Dương được quyền tự trị","Độc lập dân tộc và tự do cho nhân dân","Các quyền tự do, dân chủ cho nhân dân"],3,"Bản Yêu sách của nhân dân An Nam (8 điểm) do Nguyễn Ái Quốc gửi đến Hội nghị Vécxây (6/1919) tập trung đòi hai nội dung cơ bản là quyền bình đẳng về mặt pháp lý và “các quyền tự do, dân chủ cho nhân dân” (tự do báo chí, hội họp, đi lại, học hành, ân xá tù chính trị…). Lúc đó bản Yêu sách chưa đề cập chia ruộng đất, cũng chưa đặt trực tiếp yêu cầu độc lập dân tộc hay tự trị.","Nếu đề hỏi nội dung cơ bản thứ hai bên cạnh “các quyền tự do, dân chủ” trong bản Yêu sách năm 1919 thì chọn “quyền bình đẳng về mặt pháp lý”; còn nếu hỏi bài học lớn Nguyễn Ái Quốc rút ra sau Hội nghị Vécxây thì chọn: muốn được giải phóng, các dân tộc chỉ có thể trông cậy vào lực lượng của chính bản thân mình."],[114,3,"Câu: \"Chiến tranh có thể kéo dài 5 năm, 10 năm, 20 năm hoặc lâu hơn nữa. Song, nhân dân Việt Nam quyết không sợ. Không có gì quý hơn độc lập tự do. Đến ngày thắng lợi nhân dân ta sẽ xây dựng lại đất nước ta đàng hoàng hơn, to đẹp hơn\", được Hồ Chí Minh viết ở trong bài viết nào?",["Lời kêu gọi, tháng 12-1946","Di chúc, năm 1969","Thư chúc Tết, năm 1968","Lời kêu gọi, tháng 7-1966"],3,"Đoạn văn bất hủ chứa chân lý “Không có gì quý hơn độc lập, tự do” trích trong “Lời kêu gọi, tháng 7-1966” (ngày 17/7/1966) của Chủ tịch Hồ Chí Minh khi đế quốc Mỹ mở rộng ném bom đánh phá Hà Nội, Hải Phòng. Các văn kiện như Lời kêu gọi tháng 12/1946, Thư chúc Tết 1968 hay Di chúc 1969 đều gắn với các hoàn cảnh và câu nói nổi tiếng khác.","Phân biệt nhanh các văn kiện hay bị trộn: “Thà hy sinh tất cả, chứ nhất định không chịu mất nước…” thuộc Lời kêu gọi toàn quốc kháng chiến (19/12/1946); “Xuân này hơn hẳn mấy xuân qua” thuộc Thư chúc Tết (1968); “Thắng giặc Mỹ, ta sẽ xây dựng hơn mười ngày nay” thuộc Di chúc (1969)."],[115,3,"Chủ nghĩa Uynxơn là chương trình gồm 14 điểm. Điểm thứ 5 trong chương trình đó có đề cập tới vấn đề gì?",["Trả lại quyền tự do dân chủ cho các nước thuộc địa và đối xử công bằng với các nước chính quốc","Tuyên bố nước Mỹ tham gia Chiến tranh thế giới thứ nhất","Đối xử một cách công bằng, dân chủ và nhân quyền","Giải quyết một cách công bằng những vấn đề thuộc địa, chiếu cố tới các dân tộc bản xứ"],3,"Trong chương trình 14 điểm (1918) của Tổng thống Mỹ Woodrow Wilson, điểm thứ 5 tuyên bố “giải quyết một cách công bằng những vấn đề thuộc địa, chiếu cố tới các dân tộc bản xứ”. Tuy nhiên tại Hội nghị Vécxây (1919), các cường quốc đế quốc đã phớt lờ quyền lợi các dân tộc thuộc địa, phơi bày tính chất giả dối của lời hứa này.","Nếu đề hỏi Nguyễn Ái Quốc đánh giá thế nào về “chủ nghĩa Uynxơn” sau Hội nghị Vécxây (1919) thì nhớ Người vạch trần đó chỉ là “trò bịp bợm lớn” của chủ nghĩa đế quốc, từ đó khẳng định dân tộc thuộc địa không thể trông chờ vào thiện chí của thực dân, đế quốc."],[116,3,"Theo quan điểm Hồ Chí Minh, tính chất và nhiệm vụ của cách mạng Việt Nam là gì?",["Đánh đổ tư sản, giải phóng giai cấp công nhân","Đánh đổ phong kiến, giải phóng giai cấp nông dân","Cách mạng ruộng đất","Giải phóng dân tộc"],3,"Xuất phát từ thực tiễn Việt Nam là nước thuộc địa nửa phong kiến có mâu thuẫn dân tộc gay gắt nhất, Hồ Chí Minh xác định tính chất và nhiệm vụ hàng đầu, bao trùm của cách mạng Việt Nam là “giải phóng dân tộc”. Các nhiệm vụ đánh đổ tư sản, đánh đổ phong kiến hay cách mạng ruộng đất đều không phải nhiệm vụ ưu tiên cao nhất trong giai đoạn đấu tranh giành độc lập.","Nếu đề hỏi Hội nghị nào khẳng định cuộc cách mạng Đông Dương lúc này không phải giải quyết đồng thời hai vấn đề phản đế và điền địa mà chỉ giải quyết một vấn đề cần kíp là “dân tộc giải phóng” thì chọn Hội nghị Trung ương 8 (5/1941)."],[117,3,"Theo quan điểm Hồ Chí Minh, yêu cầu bức thiết của nông dân các nước thuộc địa là gì?",["Cách mạng ruộng đất","Đánh đổ phong kiến","Đánh đổ tư sản","Độc lập dân tộc"],3,"Hồ Chí Minh nhận thức sâu sắc rằng nông dân ở các nước thuộc địa chịu hai tầng áp bức nhưng nỗi khổ lớn nhất là mất nước, mất quyền sống làm người tự do, nên yêu cầu bức thiết hàng đầu của họ là “độc lập dân tộc”. Chỉ khi đất nước độc lập thì nguyện vọng về ruộng đất hay đánh đổ phong kiến mới có điều kiện thực hiện triệt để và lâu dài.","Nếu đề đổi hỏi “yêu cầu kinh tế thiết tha của nông dân đối với chế độ phong kiến” thì mới chọn “cách mạng ruộng đất / người cày có ruộng”; còn hỏi “yêu cầu bức thiết nhất của nông dân các nước thuộc địa” theo Hồ Chí Minh luôn chọn “độc lập dân tộc”."],[118,3,"Cơ sở hình thành quan niệm của Hồ Chí Minh về những đặc trưng, bản chất của chủ nghĩa xã hội là gì?",["Chủ nghĩa Mác-Lênin","Thực tiễn xây dựng chủ nghĩa xã hội ở Việt Nam","Truyền thống cộng đồng làng xã Việt Nam","Chủ nghĩa Mác-Lênin và thực tiễn xây dựng chủ nghĩa xã hội ở Việt Nam"],3,"Quan niệm của Hồ Chí Minh về đặc trưng, bản chất của chủ nghĩa xã hội được hình thành trên sự thống nhất giữa hai cơ sở: lý luận khoa học của “chủ nghĩa Mác-Lênin” và “thực tiễn xây dựng chủ nghĩa xã hội ở Việt Nam”. Chỉ dựa vào một trong hai vế là phiến diện, còn truyền thống làng xã chỉ là một yếu tố văn hóa bổ trợ chứ không phải cơ sở quyết định đầy đủ.","Nếu đề hỏi Hồ Chí Minh tiếp cận chủ nghĩa xã hội từ những phương diện đặc thù nào ngoài học thuyết Mác-Lênin thì nhớ Người còn tiếp cận từ khát vọng giải phóng dân tộc, từ phương diện đạo đức – nhân văn và từ truyền thống văn hóa tốt đẹp của dân tộc Việt Nam."],[119,3,"Theo tư tưởng Hồ Chí Minh, chủ nghĩa xã hội, chủ nghĩa cộng sản là chế độ xã hội như thế nào?",["Hoàn chỉnh về mọi mặt chính trị, kinh tế, văn hoá, xã hội","Có nền kinh tế phát triển cao","Mọi người bình đẳng","Phát triển cao về văn hoá, đạo đức"],3,"Theo giáo trình Tư tưởng Hồ Chí Minh, một đặc trưng nổi bật của chế độ xã hội chủ nghĩa và cộng sản chủ nghĩa mà Người đặc biệt đề cao là chế độ xã hội “phát triển cao về văn hóa, đạo đức”, bảo đảm sự công bằng, hợp lý trong các quan hệ xã hội. Các phương án như “hoàn chỉnh về mọi mặt” hay “mọi người bình đẳng” chung chung, còn “nền kinh tế phát triển cao” đứng riêng lẻ chưa đủ làm rõ nền tảng công hữu và lực lượng sản xuất hiện đại.","Nếu đề hỏi trọn bộ 4 đặc trưng cơ bản của xã hội xã hội chủ nghĩa theo Hồ Chí Minh thì ghi nhớ: về chính trị là chế độ dân chủ; về kinh tế là kinh tế phát triển cao dựa trên lực lượng sản xuất hiện đại và chế độ công hữu tư liệu sản xuất chủ yếu; về văn hóa – đạo đức là phát triển cao, công bằng, hợp lý; về chủ thể là công trình tập thể của nhân dân dưới sự lãnh đạo của Đảng."],[120,3,"Nền kinh tế xã hội chủ nghĩa theo tư tưởng Hồ Chí Minh là nền kinh tế như thế nào?",["Có công nghiệp hiện đại","Có nông nghiệp hiện đại","Có khoa học, kỹ thuật tiên tiến","Có công nghiệp, nông nghiệp hiện đại, có khoa học, kỹ thuật tiên tiến"],3,"Hồ Chí Minh cụ thể hóa mô hình nền kinh tế xã hội chủ nghĩa phát triển cao ở Việt Nam phải kết hợp đồng bộ cả ba trụ cột: “có công nghiệp, nông nghiệp hiện đại, có khoa học, kỹ thuật tiên tiến” trên nền tảng chế độ công hữu về tư liệu sản xuất chủ yếu. Ba phương án kia mỗi phương án chỉ nêu đúng một bộ phận nên đều thiếu toàn diện.","Nếu đề hỏi Hồ Chí Minh ví mối quan hệ giữa công nghiệp và nông nghiệp trong nền kinh tế xã hội chủ nghĩa như thế nào thì nhớ hình ảnh: “công nghiệp và nông nghiệp là hai chân của nền kinh tế”, cần phát triển cân đối, hỗ trợ lẫn nhau."],[121,3,"Những trở lực kìm hãm sự phát triển của chủ nghĩa xã hội theo tư tưởng Hồ Chí Minh là gì?",["Sự bao vây cấm vận của chủ nghĩa đế quốc","Âm mưu diễn biến hòa bình","Sự tụt hậu về kinh tế so với thế giới","Chủ nghĩa cá nhân; bệnh tham ô, lãng phí, quan liêu; sự chia rẽ, bè phái, mất đoàn kết"],3,"Hồ Chí Minh chỉ rõ những trở lực nguy hiểm nhất kìm hãm, triệt tiêu nguồn lực xây dựng chủ nghĩa xã hội nằm ngay từ bên trong: chủ nghĩa cá nhân (nguồn gốc của nhiều thói hư tật xấu), bệnh tham ô, lãng phí, quan liêu và tình trạng chia rẽ, bè phái, mất đoàn kết. Các phương án như bao vây cấm vận, diễn biến hòa bình hay tụt hậu kinh tế chỉ phản ánh khó khăn, thách thức từ bối cảnh khách quan hoặc bên ngoài chứ không phải nhóm trở lực nội sinh cốt lõi mà Người cảnh báo.","Nếu đề hỏi đâu là \"kẻ địch hung ác nhất\" hoặc \"căn bệnh mẹ\" đẻ ra các thói hư tật xấu trong xây dựng chủ nghĩa xã hội thì chọn chủ nghĩa cá nhân; nếu hỏi về \"giặc nội xâm\" trong bộ máy nhà nước thì chọn tham ô, lãng phí, quan liêu."],[122,3,"Theo tư tưởng Hồ Chí Minh, nhiệm vụ lịch sử của thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam là gì?",["Xây dựng nền văn hóa của chủ nghĩa xã hội","Xây dựng con người của chủ nghĩa xã hội","Xây dựng nền tảng vật chất và kỹ thuật của chủ nghĩa xã hội","Xây dựng hệ thống chính trị của chủ nghĩa xã hội"],3,"Trong thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam, việc xây dựng hệ thống chính trị của chủ nghĩa xã hội (giữ vững vai trò lãnh đạo của Đảng, củng cố Nhà nước của dân, do dân, vì dân và Mặt trận đoàn kết toàn dân) giữ vai trò trụ cột để tổ chức, dẫn dắt toàn bộ công cuộc cải tạo xã hội cũ và xây dựng xã hội mới. Các phương án riêng lẻ về văn hóa hay con người chưa bao quát được thiết chế lãnh đạo và quản lý toàn xã hội.","Lưu ý phân biệt dạng câu hỏi: nếu đề nhấn mạnh nhiệm vụ trọng tâm về kinh tế - kỹ thuật hay cơ sở hạ tầng của thời kỳ quá độ thì chú ý phương án xây dựng nền tảng vật chất và kỹ thuật của chủ nghĩa xã hội; còn nếu hỏi đặc điểm lớn nhất của thời kỳ quá độ ở Việt Nam thì chọn từ một nước nông nghiệp lạc hậu tiến thẳng lên chủ nghĩa xã hội không qua giai đoạn phát triển tư bản chủ nghĩa."],[123,3,"Theo tư tưởng Hồ Chí Minh, biện pháp để phát huy động lực của mỗi cá nhân là gì?",["Tác động vào sự đam mê quyền lực chính trị của mỗi người","Tăng cường giáo dục đạo đức, lối sống mình vì mọi người","Tạo môi trường làm việc thuận lợi, hành lang pháp lý thông thoáng","Tác động vào nhu cầu, lợi ích của mỗi con người"],3,"Theo Hồ Chí Minh, để khơi dậy và phát huy động lực của mỗi cá nhân trong xây dựng chủ nghĩa xã hội, biện pháp thiết thực nhất là tác động đúng đắn vào nhu cầu và lợi ích chính đáng (cả vật chất lẫn tinh thần) của con người. Nếu chỉ kêu gọi đạo đức một chiều hay dựa vào ham muốn quyền lực thì không thể tạo ra động lực lao động bền vững, tự giác.","Nếu đề hỏi động lực quan trọng và quyết định nhất của chủ nghĩa xã hội nói chung thì chọn con người (nhân dân lao động) hoặc động lực bên trong (nội lực); nếu hỏi giải quyết hài hòa mối quan hệ lợi ích nào thì nhớ kết hợp lợi ích cá nhân, lợi ích tập thể và lợi ích xã hội."],[124,3,"Theo tư tưởng Hồ Chí Minh, biện pháp để tiến hành xây dựng chủ nghĩa xã hội ở Việt Nam là gì?",["Tăng cường mở rộng hợp tác quốc tế","Tăng cường mở rộng hợp tác kinh tế quốc tế, độc lập dân tộc gắn với chủ nghĩa xã hội","Phát huy hết tài năng, sức lực, của cải của nhân dân","Kết hợp cải tạo với xây dựng"],3,"Hồ Chí Minh xác định một trong những biện pháp cơ bản để tiến hành xây dựng chủ nghĩa xã hội ở Việt Nam là kết hợp cải tạo xã hội cũ với xây dựng xã hội mới, trong đó lấy xây dựng làm nhiệm vụ chủ chốt và lâu dài. Các phương án khác chỉ đề cập một khía cạnh như hợp tác quốc tế hoặc diễn đạt chưa đúng cụm biện pháp kinh điển trong giáo trình.","Nếu đề hỏi sâu hơn giữa cải tạo và xây dựng cái nào là chính thì chọn lấy xây dựng làm chính; còn nếu hỏi biện pháp quan trọng nhất thì chọn huy động các nguồn lực sẵn có trong dân (đem tài dân, sức dân, của dân làm lợi cho dân)."],[125,3,"Theo tư tưởng Hồ Chí Minh, đặc trưng nổi bật nhất về chính trị của chủ nghĩa xã hội là gì?",["Quyền tự do, dân chủ của mỗi người được phát huy","Đảng cộng sản lãnh đạo","Nhà nước của dân, do dân, vì dân","Thực hiện một nền dân chủ triệt để"],3,"Theo tư tưởng Hồ Chí Minh, đặc trưng nổi bật nhất về mặt chính trị của chế độ xã hội chủ nghĩa là thực hiện một nền dân chủ triệt để, bảo đảm địa vị làm chủ thực sự thuộc về nhân dân lao động. Vai trò lãnh đạo của Đảng hay thiết chế Nhà nước của dân, do dân, vì dân đều là điều kiện và công cụ để hiện thực hóa nền dân chủ triệt để đó.","Nếu đề hỏi về đặc trưng kinh tế của chủ nghĩa xã hội thì chọn nền kinh tế phát triển cao dựa trên lực lượng sản xuất hiện đại và chế độ công hữu về tư liệu sản xuất chủ yếu; nếu hỏi bản chất của Nhà nước ta thì chọn Nhà nước của nhân dân, do nhân dân, vì nhân dân."],[126,3,"Theo tư tưởng Hồ Chí Minh: Chủ nghĩa xã hội là chế độ do nhân dân lao động làm chủ, mọi công dân đều có quyền bầu cử, ứng cử vào các cơ quan nhà nước, có quyền kiểm soát các đại biểu của mình. Nội dung trên nói lên mục tiêu gì?",["Mục tiêu kinh tế","Mục tiêu văn hóa và xã hội","Mục tiêu phát triển con người xã hội chủ nghĩa","Mục tiêu chính trị"],3,"Đoạn trích đề cập trực tiếp đến quyền làm chủ của nhân dân lao động, quyền bầu cử, ứng cử vào cơ quan nhà nước và quyền kiểm soát đại biểu — đây đều là những nội dung cốt lõi thuộc lĩnh vực quyền lực nhà nước và dân chủ, nên phản ánh mục tiêu chính trị của chủ nghĩa xã hội. Các mục tiêu kinh tế hay văn hóa, xã hội không lấy quyền bầu cử, ứng cử làm dấu hiệu nhận diện.","Gặp câu nhận diện mục tiêu chủ nghĩa xã hội, chỉ cần bắt từ khóa: thấy \"làm chủ, bầu cử, ứng cử, kiểm soát đại biểu\" chọn mục tiêu chính trị; thấy \"lực lượng sản xuất, công hữu tư liệu sản xuất, không còn bóc lột\" chọn mục tiêu kinh tế; thấy \"giải phóng con người, xóa mù chữ, nâng cao dân trí\" chọn mục tiêu văn hóa và xã hội."],[127,3,"Chủ nghĩa xã hội theo tư tưởng Hồ Chí Minh: Đó là nền kinh tế phát triển cao, không có quan hệ người bóc lột người, dựa trên chế độ sở hữu công cộng về tư liệu sản xuất chủ yếu, với sự phát triển của lực lượng sản xuất, khoa học công nghệ. Nội dung trên nói lên mục tiêu gì?",["Mục tiêu chính trị","Mục tiêu văn hóa và xã hội","Mục tiêu phát triển con người xã hội chủ nghĩa","Mục tiêu kinh tế"],3,"Các dấu hiệu như nền kinh tế phát triển cao, xóa bỏ quan hệ người bóc lột người, chế độ sở hữu công cộng về tư liệu sản xuất chủ yếu và phát triển lực lượng sản xuất, khoa học công nghệ đều thuộc lĩnh vực sản xuất vật chất và quan hệ sản xuất, nên thể hiện trực tiếp mục tiêu kinh tế của chủ nghĩa xã hội. Các nhóm mục tiêu chính trị hay văn hóa, xã hội thuộc các phương diện khác của đời sống xã hội.","Nếu đề hỏi nền kinh tế xã hội chủ nghĩa theo Hồ Chí Minh có cơ cấu như thế nào thì chọn kết hợp công nghiệp và nông nghiệp hiện đại, khoa học kỹ thuật tiên tiến; nếu hỏi kinh tế giữ vai trò gì trong xây dựng chủ nghĩa xã hội thì chọn nền tảng vật chất - kỹ thuật quyết định đời sống nhân dân."],[128,3,"Chủ nghĩa xã hội theo tư tưởng Hồ Chí Minh: Phát triển cao hơn chủ nghĩa tư bản về mặt giải phóng con người. Nội dung trên nói lên mục tiêu gì?",["Mục tiêu chính trị","Mục tiêu kinh tế","Mục tiêu phát triển con người xã hội chủ nghĩa","Mục tiêu văn hóa và xã hội"],3,"Theo phân chia các mục tiêu cơ bản của chủ nghĩa xã hội trong tư tưởng Hồ Chí Minh (chính trị, kinh tế, văn hóa và xã hội), tiêu chí phát triển cao hơn chủ nghĩa tư bản về mặt giải phóng con người — xóa bỏ áp bức bất công, bảo đảm công bằng và phát triển toàn diện con người — được xếp vào mục tiêu văn hóa và xã hội. Các phương án mục tiêu chính trị hay kinh tế chỉ phản ánh phương diện quyền lực hoặc sở hữu vật chất.","Nếu đề hỏi mục tiêu cao nhất, tổng quát nhất của chủ nghĩa xã hội theo cách diễn đạt mộc mạc của Hồ Chí Minh thì nhớ câu: \"làm sao cho nhân dân đủ ăn, đủ mặc, ngày càng sung sướng, ai nấy được đi học, ốm đau có thuốc, già không lao động được thì nghỉ\"."],[129,3,"Biện pháp nào quan trọng nhất trong xây dựng chủ nghĩa xã hội ở Việt Nam theo tư tưởng Hồ Chí Minh?",["Tranh thủ tối đa sự giúp đỡ, viện trợ quốc tế","Kết hợp xây dựng và bảo vệ đất nước","Kết hợp cải tạo xã hội cũ với xây dựng xã hội mới","Huy động các nguồn lực sẵn có trong dân"],3,"Hồ Chí Minh luôn đặt nội lực lên hàng đầu với phương châm \"đem tài dân, sức dân, của dân làm lợi cho dân\", coi việc huy động các nguồn lực sẵn có trong dân là biện pháp quan trọng nhất khi xây dựng chủ nghĩa xã hội. Sự viện trợ quốc tế chỉ là yếu tố hỗ trợ, còn cải tạo kết hợp xây dựng hay xây dựng gắn với bảo vệ Tổ quốc tuy cần thiết nhưng đều phải dựa trên sức mạnh và nguồn lực từ nhân dân.","Nếu đề hỏi phương châm tiến hành xây dựng chủ nghĩa xã hội của Hồ Chí Minh thì chọn tiến nhanh, tiến mạnh, tiến vững chắc lên chủ nghĩa xã hội (nhưng không chủ quan, nóng vội, phải bước đi phù hợp); nếu hỏi thái độ đối với viện trợ bên ngoài thì nhớ \"tự lực cánh sinh là chính, tranh thủ sự giúp đỡ quốc tế là quan trọng\"."],[130,3,"Thực chất Chủ nghĩa Uynxơn của chính quyền Mỹ là gì?",["Liên minh Mỹ, Anh, Pháp, Nga chống lại Đức","Liên minh Mỹ - Nga chống lại Đức","Liên minh Mỹ và các nước Đồng minh chống Đức","Chống lại nước Nga Xô Viết"],3,"Chủ nghĩa Uynxơn (Chương trình 14 điểm của Tổng thống Mỹ Woodrow Wilson công bố năm 1918) tuy rêu rao khẩu hiệu \"quyền dân tộc tự quyết\" nhưng thực chất nhằm xoa dịu phong trào đấu tranh thuộc địa, phân chia lại ảnh hưởng đế quốc và chống lại ảnh hưởng ngày càng lớn của Cách mạng Tháng Mười cùng nước Nga Xô Viết. Các phương án nói về liên minh chống Đức chỉ phản ánh bề nổi của Chiến tranh thế giới thứ nhất, không lột tả bản chất chính trị của học thuyết này.","Liên hệ thực tiễn hành trình tìm đường cứu nước: năm 1919 Nguyễn Ái Quốc gửi Bản yêu sách của nhân dân An Nam tới Hội nghị Vécxây và sớm nhận ra \"chủ nghĩa Uynxơn chỉ là một trò bịp bợm lớn\", từ đó rút ra bài học muốn được giải phóng, các dân tộc chỉ có thể trông cậy vào lực lượng của bản thân mình."],[131,3,"Luận điểm nào là của tư tưởng Hồ Chí Minh?",["Công nghiệp hóa phải bắt đầu từ xây dựng và phát triển công nghiệp nặng","Công nghiệp hóa phải trên cơ sở hợp tác quốc tế","Công nghiệp hóa phải trên cơ sở cải tạo nông nghiệp","Công nghiệp hóa là con đường tất yếu phải đi của chúng ta"],3,"Hồ Chí Minh khẳng định muốn xây dựng cơ sở vật chất - kỹ thuật cho chủ nghĩa xã hội ở một nước nông nghiệp lạc hậu thì công nghiệp hóa là con đường tất yếu phải đi của chúng ta. Người không chủ trương rập khuôn công nghiệp hóa phải bắt đầu từ công nghiệp nặng (mà nhấn mạnh bắt đầu từ phát triển nông nghiệp làm cơ sở), cũng không coi hợp tác quốc tế là cơ sở duy nhất.","Nếu đề hỏi theo Hồ Chí Minh, công nghiệp hóa xã hội chủ nghĩa ở Việt Nam phải bắt đầu từ đâu thì chọn từ xây dựng và phát triển nông nghiệp (rồi mới phát triển công nghiệp nhẹ và công nghiệp nặng phù hợp)."],[132,3,"Theo Hồ Chí Minh: Tất cả những nhân tố góp phần thúc đẩy sự phát triển kinh tế – xã hội thông qua hoạt động của con người. Gọi tóm tắt là gì?",["Nội lực của chủ nghĩa xã hội","Tiềm năng của chủ nghĩa xã hội","Sức mạnh của chủ nghĩa xã hội","Động lực của chủ nghĩa xã hội"],3,"Trong tư tưởng Hồ Chí Minh, toàn bộ những nhân tố vật chất và tinh thần góp phần thúc đẩy sự phát triển kinh tế – xã hội thông qua hoạt động thực tiễn của con người được khái quát thành khái niệm động lực của chủ nghĩa xã hội. Các từ như nội lực, tiềm năng hay sức mạnh chỉ mang nghĩa hẹp hơn hoặc mới ở dạng khả năng chưa chuyển hóa thành lực thúc đẩy trực tiếp.","Nếu đề hỏi động lực của chủ nghĩa xã hội gồm những nhóm nào thì nhớ phân loại động lực bên trong (quyết định, gồm lợi ích của dân, dân chủ của dân, sức mạnh đoàn kết toàn dân và hoạt động của các tổ chức) và động lực bên ngoài (kết hợp sức mạnh thời đại); đồng thời lưu ý mặt đối lập với động lực là các \"trở lực\"."],[133,3,"Đảng ta vận dụng tư tưởng Hồ Chí Minh vào xây dựng đất nước ta hiện nay với mục tiêu cách mạng là gì?",["Phát triển đất nước cao hơn chủ nghĩa tư bản","Hội nhập quốc tế về mọi mặt","Dân tự do làm giàu; đất nước phát triển sánh vai với cường quốc trên thế giới","Độc lập dân tộc gắn liền với chủ nghĩa xã hội; dân giàu, nước mạnh; xã hội dân chủ công bằng văn minh"],3,"Vận dụng sáng tạo tư tưởng Hồ Chí Minh trong công cuộc đổi mới hiện nay, Đảng ta xác định mục tiêu cách mạng tổng quát là kiên định độc lập dân tộc gắn liền với chủ nghĩa xã hội, phấn đấu xây dựng đất nước \"dân giàu, nước mạnh, dân chủ, công bằng, văn minh\". Các phương án khác chỉ nêu từng khía cạnh rời rạc như hội nhập hay tự do làm giàu mà thiếu định hướng xã hội chủ nghĩa và tính toàn diện.","Nếu đề hỏi mục tiêu cốt lõi xuyên suốt toàn bộ tư tưởng Hồ Chí Minh từ năm 1930 đến nay là gì thì chọn độc lập dân tộc gắn liền với chủ nghĩa xã hội; nếu hỏi thứ tự các từ trong tiêu chí hiện hành sau Đại hội XI thì nhớ \"dân giàu, nước mạnh, dân chủ, công bằng, văn minh\" (từ \"dân chủ\" được đặt trước \"công bằng, văn minh\")."],[134,3,"Theo Tư tưởng Hồ Chí Minh: Cách mạng giải phóng dân tộc muốn giành được thắng lợi phải thực hiện gì?",["Thực hiện bằng hiệp thương, đối thoại hòa bình","Chỉ thực hiện bằng con đường bạo lực cách mạng của quần chúng nhân dân","Kết hợp lực lượng chính trị của quần chúng với lực lượng vũ trang nhân dân","Thực hiện bằng con đường bạo lực, kết hợp lực lượng chính trị của quần chúng với lực lượng vũ trang nhân dân"],3,"Hồ Chí Minh khẳng định chủ nghĩa thực dân tự bản thân nó là hành động bạo lực, nên cách mạng giải phóng dân tộc muốn thắng lợi tất yếu phải sử dụng bạo lực cách mạng của quần chúng, kết hợp chặt chẽ giữa lực lượng chính trị của quần chúng với lực lượng vũ trang nhân dân. Phương án đối thoại hòa bình trái với quy luật đánh đổ ách thực dân, còn các phương án chỉ nêu một vế đều thiếu tính đầy đủ.","Nếu đề hỏi hình thức đấu tranh của bạo lực cách mạng theo Hồ Chí Minh là gì thì chọn kết hợp đấu tranh chính trị với đấu tranh vũ trang; nếu hỏi quan điểm nhân văn của Người khi dùng bạo lực cách mạng thì nhớ Người luôn tranh thủ khả năng hòa bình đến giây phút cuối cùng, chỉ dùng bạo lực khi kẻ thù áp đặt chiến tranh."],[135,3,"Theo tư tưởng Hồ Chí Minh, Kết hợp nhuần nhuyễn dân tộc với giai cấp, độc lập dân tộc và chủ nghĩa xã hội, là phản ánh nội dung gì?",["Quy cách ứng xử giữa các nước về độc lập, chủ quyền, không can thiệp nội bộ của nhau","Nguyên tắc bang giao, đối tác chiến lược song phương, đa phương các nước trong khu vực và thế giới","Độc lập dân tộc Việt Nam với hòa bình, tiến bộ và chủ nghĩa xã hội","Quy luật khách quan của cách mạng giải phóng dân tộc trong thời đại cách mạng vô sản"],3,"Kết hợp nhuần nhuyễn vấn đề dân tộc với vấn đề giai cấp, độc lập dân tộc với chủ nghĩa xã hội phản ánh đúng quy luật khách quan của cách mạng giải phóng dân tộc trong thời đại cách mạng vô sản — khi chỉ có đi theo con đường cách mạng vô sản và chủ nghĩa xã hội thì độc lập dân tộc mới thực sự vững chắc, triệt để. Các phương án về bang giao hay ứng xử ngoại giao thuộc lĩnh vực đối ngoại, không phải bản chất quy luật cách mạng.","Nếu đề hỏi mối quan hệ giữa độc lập dân tộc và chủ nghĩa xã hội theo Hồ Chí Minh thì nhớ hai chiều: độc lập dân tộc là cơ sở, tiền đề để tiến lên chủ nghĩa xã hội; chủ nghĩa xã hội là điều kiện bảo đảm vững chắc cho độc lập dân tộc."],[136,3,"Theo tư tưởng Hồ Chí Minh, trong xây dựng chủ nghĩa xã hội, chủ trương đối xử với giai cấp tư sản như thế nào?",["Chỉ đánh đổ về mặt giai cấp","Là sản phẩm của chế độ bóc lột, cần đánh đổ","Xóa bỏ quyền sở hữu về tư liệu sản xuất, cũng như về mặt quản lý nhà nước của họ","Không xóa bỏ quyền sở hữu tư liệu sản xuất của họ"],3,"Xuất phát từ đặc điểm thực tiễn Việt Nam (giai cấp tư sản dân tộc nhỏ bé, từng chịu áp bức thực dân và có tinh thần yêu nước nhất định), Hồ Chí Minh chủ trương không xóa bỏ quyền sở hữu tư liệu sản xuất của họ mà thực hiện cải tạo hòa bình, hướng dẫn họ tham gia công tư hợp doanh phục vụ quốc kế dân sinh. Chủ trương đánh đổ hay tước đoạt triệt để là cách làm máy móc, không phù hợp với đường lối đại đoàn kết của Người.","Nếu đề hỏi hình thức kinh tế mà Hồ Chí Minh sử dụng để cải tạo và phát huy vai trò của tư sản dân tộc trong thời kỳ quá độ thì chọn công tư hợp doanh (kinh tế tư bản nhà nước); nếu hỏi Người đối xử với địa chủ yêu nước ra sao thì nhớ cũng có chính sách phân hóa, khoan hồng với địa chủ kháng chiến."],[137,3,"Tư tưởng góp phần bổ sung và làm phong phú lý luận chủ nghĩa Mác-Lênin của Hồ Chí Minh là:",["Cách mạng giải phóng dân tộc giành thắng lợi đồng thời với cách mạng vô sản ở chính quốc","Cách mạng giải phóng dân tộc giành thắng lợi sau cách mạng vô sản ở chính quốc","Thắng lợi của cách mạng giải phóng dân tộc phụ thuộc vào thắng lợi của cách mạng vô sản ở chính quốc","Cách mạng giải phóng dân tộc có khả năng giành thắng lợi trước cách mạng vô sản ở chính quốc"],3,"Một sáng tạo lý luận đặc sắc của Hồ Chí Minh bổ sung vào kho tàng chủ nghĩa Mác-Lênin là luận điểm: cách mạng giải phóng dân tộc ở thuộc địa có tính chủ động, sáng tạo và có khả năng giành thắng lợi trước cách mạng vô sản ở chính quốc, từ đó tác động trở lại thúc đẩy cách mạng ở chính quốc. Ba phương án còn lại đều thể hiện quan điểm thụ động, lệ thuộc vào cách mạng chính quốc mà Quốc tế Cộng sản từng có lúc nhấn mạnh.","Nếu đề hỏi hình ảnh ẩn dụ nổi tiếng Hồ Chí Minh dùng để chỉ mối quan hệ bình đẳng giữa cách mạng thuộc địa và cách mạng vô sản ở chính quốc thì chọn hình ảnh \"hai cánh của một con chim\" (hoặc hình ảnh \"con đỉa hai vòi\" để chỉ chủ nghĩa tư bản bóc lột cả vô sản chính quốc lẫn nhân dân thuộc địa)."],[138,4,"Hồ Chí Minh đến với chủ nghĩa Mác-Lênin và trở thành người cộng sản đầu tiên của Việt Nam vào thời gian nào?",["Năm 1919","Năm 1930","Năm 1925","Năm 1920"],3,"Năm 1920 đánh dấu bước ngoặt quyết định trong cuộc đời hoạt động của Hồ Chí Minh: tháng 7/1920 Người đọc Sơ thảo lần thứ nhất những luận cương về vấn đề dân tộc và vấn đề thuộc địa của Lênin, tìm thấy con đường cứu nước đúng đắn; tháng 12/1920 tại Đại hội Tua, Người tán thành gia nhập Quốc tế Cộng sản và tham gia sáng lập Đảng Cộng sản Pháp, trở thành người cộng sản đầu tiên của Việt Nam. Các mốc 1919, 1925, 1930 gắn với các sự kiện khác.","Ghi nhớ chuỗi mốc lịch sử dễ nhầm: 1919 gửi Bản yêu sách 8 điểm đến Hội nghị Vécxây; 1920 trở thành người cộng sản đầu tiên; 1925 thành lập Hội Việt Nam Cách mạng Thanh niên và xuất bản Bản án chế độ thực dân Pháp; 1930 thành lập Đảng Cộng sản Việt Nam."],[139,4,"Các yếu tố nào dẫn đến sự ra đời của Đảng Cộng sản Việt Nam?",["Chủ nghĩa Mác-Lênin","Phong trào công nhân","Phong trào yêu nước","Sự kết hợp chủ nghĩa Mác-Lênin với phong trào công nhân và phong trào yêu nước"],3,"Hồ Chí Minh sáng tạo bổ sung yếu tố thứ ba vào quy luật ra đời Đảng Cộng sản ở một nước thuộc địa nửa phong kiến: Đảng Cộng sản Việt Nam là sản phẩm của sự kết hợp giữa chủ nghĩa Mác-Lênin với phong trào công nhân và phong trào yêu nước. Ba phương án còn lại đều chỉ nêu từng yếu tố đơn lẻ nên không đầy đủ.","Nếu đề hỏi sự khác biệt sáng tạo của Hồ Chí Minh so với quy luật ra đời Đảng Cộng sản ở các nước phương Tây theo V.I. Lênin (chủ nghĩa Mác + phong trào công nhân) là yếu tố nào thì chọn phong trào yêu nước."],[140,4,"Quốc hội khóa I của nước ta được bầu ra vào năm nào?",["Năm 1945","Năm 1950","Năm 1948","Năm 1946"],3,"Ngày 6/1/1946, nhân dân cả nước đã đi bỏ phiếu trong cuộc Tổng tuyển cử tự do đầu tiên trên toàn lãnh thổ Việt Nam để bầu ra Quốc hội khóa I của nước Việt Nam Dân chủ Cộng hòa. Năm 1945 là năm giành chính quyền và đọc Tuyên ngôn Độc lập (2/9/1945), còn năm 1948 và 1950 thuộc giai đoạn kháng chiến chống Pháp.","Nếu đề hỏi Hiến pháp đầu tiên của nước Việt Nam Dân chủ Cộng hòa được Quốc hội khóa I thông qua vào thời gian nào thì cũng là năm 1946 (ngày 9/11/1946); còn nếu hỏi ngày Tổng tuyển cử cụ thể thì chọn 6/1/1946."],[141,4,"Tư tưởng Hồ Chí Minh về Nhà nước kiểu mới ở Việt Nam được hình thành vào thời gian nào?",["Năm 1920","Năm 1930","Năm 1945","Năm 1941"],3,"Tư tưởng Hồ Chí Minh về một Nhà nước kiểu mới của toàn dân tộc ở Việt Nam được định hình rõ nét vào năm 1941, khi Người trực tiếp về nước chủ trì Hội nghị Trung ương 8 (tháng 5/1941), xác định sau khi đánh đuổi Pháp - Nhật sẽ thành lập Chính phủ nhân dân của nước Việt Nam Dân chủ Cộng hòa thay vì mô hình chính quyền Xô viết công - nông trước đó. Năm 1920 và 1930 là giai đoạn tìm đường và thành lập Đảng, còn năm 1945 là thời điểm Nhà nước chính thức ra đời trên thực tế.","Cần phân biệt hai mốc rất dễ nhầm: hỏi thời điểm tư tưởng về Nhà nước kiểu mới được hình thành chọn năm 1941; hỏi thời điểm Nhà nước Việt Nam Dân chủ Cộng hòa chính thức ra đời trong thực tiễn chọn năm 1945 (2/9/1945)."],[142,4,"Theo Hồ Chí Minh, \"giặc nội xâm\" là loại nào?",["Chính trị bất ổn; thất nghiệp; kinh tế lạc hậu","Giặc đói; nội phản; tư tưởng lạc hậu; hủ tục, mê tín dị đoan","Giặc đói; giặc dốt; những hủ tục lạc hậu","Tham ô; lãng phí; quan liêu"],3,"Hồ Chí Minh gọi tham ô, lãng phí và quan liêu là \"giặc nội xâm\" (giặc ở trong lòng), coi chúng nguy hiểm ngang với giặc ngoại xâm vì chúng trực tiếp đục khoét của công, làm tha hóa cán bộ và xói mòn lòng tin của nhân dân. Còn giặc đói, giặc dốt là những tàn dư xã hội cần diệt sau Cách mạng Tháng Tám chứ không gọi là \"giặc nội xâm\".","Nếu đề hỏi \"ba thứ giặc\" cấp bách cần diệt ngay sau năm 1945 thì chọn giặc đói, giặc dốt, giặc ngoại xâm; nếu hỏi nguyên nhân sâu xa đẻ ra \"giặc nội xâm\" (tham ô, lãng phí, quan liêu) thì chọn chủ nghĩa cá nhân."],[143,4,"Theo Hồ Chí Minh, Chính phủ phải như thế nào?",["Là lãnh đạo tối cao của nhân dân","Thay mặt dân thực hiện đối nội, đối ngoại","Do nhân dân ủy thác","Là đầy tớ của nhân dân"],3,"Theo tư tưởng Hồ Chí Minh về Nhà nước của dân, do dân, vì dân, Chính phủ cùng toàn thể cán bộ từ Chủ tịch nước đến nhân viên cơ sở đều phải là \"đầy tớ\" (công bộc) thật trung thành của nhân dân, việc gì có lợi cho dân phải hết sức làm, việc gì có hại cho dân phải hết sức tránh. Quan niệm Chính phủ là \"lãnh đạo tối cao\" mang màu sắc quan liêu, trái ngược với bản chất dân chủ nhân dân.","Nếu đề hỏi cán bộ, đảng viên vừa là gì vừa là gì của nhân dân theo Hồ Chí Minh thì chọn vừa là người lãnh đạo, vừa là người đầy tớ thật trung thành của nhân dân."],[144,4,"Nguyên tắc xây dựng Đảng Cộng sản Việt Nam theo tư tưởng Hồ Chí Minh là gì?",["Tập trung dân chủ; tập thể lãnh đạo; dân chủ cơ sở; đoàn kết toàn dân","Tập thể lãnh đạo, cá nhân phụ trách; thực hiện chế độ sinh hoạt lệ, đóng đảng phí","Nâng cao chí khí cách mạng; tập trung dân chủ; cá nhân phụ trách và chịu trách nhiệm trước tập thể","Tập trung dân chủ; tập thể lãnh đạo, cá nhân phụ trách; tự phê bình và phê bình"],3,"Tập trung dân chủ; tập thể lãnh đạo, cá nhân phụ trách; tự phê bình và phê bình là ba trong những nguyên tắc cốt lõi, xuyên suốt trong công tác xây dựng Đảng theo tư tưởng Hồ Chí Minh (bên cạnh kỷ luật nghiêm minh tự giác, đoàn kết thống nhất trong Đảng...). Các phương án nhiễu đều ghép nhầm những nội dung không phải nguyên tắc xây dựng Đảng như đóng đảng phí, dân chủ cơ sở hay nâng cao chí khí cách mạng.","Nếu đề hỏi nguyên tắc tổ chức cơ bản nhất của Đảng là gì thì chọn tập trung dân chủ; hỏi nguyên tắc lãnh đạo thì chọn tập thể lãnh đạo, cá nhân phụ trách; hỏi quy luật phát triển và là \"thang thuốc\" tốt nhất để làm phần tốt nảy nở, phần xấu mất dần đi thì chọn tự phê bình và phê bình."],[145,4,"Theo tư tưởng Hồ Chí Minh, mục đích thành lập Đảng trước hết là gì?",["Để trong thì vận động và tổ chức dân chúng,","Bên ngoài thì liên lạc với dân tộc bị áp bức và vô sản giai cấp ở mọi nơi","Để tuyên ngôn với lực lượng đối lập mục tiêu đấu tranh","Bên trong thì vận động và tổ chức quần chúng, bên ngoài thì liên lạc với dân tộc bị áp bức và giai cấp vô sản thế giới"],3,"Trong tác phẩm Đường cách mệnh (1927), Hồ Chí Minh nêu trọn vẹn hai nhiệm vụ song song khi thành lập Đảng cách mạng: bên trong thì vận động và tổ chức quần chúng nhân dân đứng lên đấu tranh, bên ngoài thì liên lạc mật thiết với các dân tộc bị áp bức và giai cấp vô sản trên thế giới. Các phương án chỉ nêu vế trong hoặc vế ngoài đều phiến diện.","Nếu đề hỏi hình ảnh so sánh vai trò của Đảng trong câu văn này thì nhớ: \"Đảng có vững cách mệnh mới thành công, cũng như người cầm lái có vững thuyền mới chạy\"; nếu hỏi xuất xứ của luận điểm thì chọn tác phẩm Đường cách mệnh (1927)."],[146,4,"Theo tư tưởng Hồ Chí Minh, công tác “gốc” của Đảng là công tác nào?",["Công tác tư tưởng chính trị","Côn
